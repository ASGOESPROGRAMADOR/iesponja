o: advento do termo, <b>encampação</b> (retomada por interesse público, com lei autorizadora prévia e indenização prévia), <b>caducidade</b> (inadimplência do concessionário, por decreto), <b>rescisão</b> (pelo concessionário, só por ação judicial), <b>anulação</b> e falência ou extinção da empresa. A Lei 14.133/2021 manteve a Lei 8.987 e a Lei 11.079 em vigor e alterou pontos delas."], "pega": ["PPP não é qualquer concessão: a <b>concessão comum</b> (só tarifa) <b>não é PPP</b>. A banca troca e diz que toda concessão de serviço público é PPP.", "Valor, prazo e objeto: mínimo de <b>R$ 10 milhões</b> (Lei 13.529/2017), prazo de prestação mínimo de <b>5 anos</b>, contrato de <b>5 a 35 anos</b>. A banca troca por R$ 20 milhões, 10 anos ou 30 anos, ou diz que é permitida PPP só de fornecimento de mão de obra.", "Patrocinada x administrativa: na patrocinada há <b>tarifa dos usuários + contraprestação pública</b>; na administrativa a Administração é usuária direta ou indireta. A banca atribui tarifa à administrativa.", "Regime legal: a patrocinada aplica a Lei 8.987 <b>subsidiariamente</b>; a administrativa aplica <b>só alguns artigos</b> dela (21, 23, 25, 27 a 39). A banca inverte.", "Pagamento: a contraprestação vem <b>depois</b> da disponibilização do serviço. A banca diz que é paga antes do início da prestação. Exceção legal é o <b>aporte</b> de recursos, que não é contraprestação.", "SPE: é constituída <b>antes</b> do contrato e a Administração <b>não pode ter a maioria do capital votante</b>. A banca diz que o Poder Público controla a SPE ou que a SPE é constituída depois da assinatura.", "Indelegabilidade: regulação, jurisdição e <b>poder de polícia</b> não podem ser objeto de PPP. A banca diz que o poder de polícia pode ser delegado por PPP.", "Consulta pública: mínimo de <b>30 dias</b>, encerrando-se pelo menos <b>7 dias</b> antes da publicação do edital. A banca troca por 15 e 30 dias.", "Concessão comum x PPP na extinção: <b>rescisão</b> pelo concessionário exige ação judicial; <b>caducidade</b> é do poder concedente; <b>encampação</b> exige lei autorizadora e indenização prévia. A banca diz que o concessionário pode rescindir por ato próprio."]}, {"materia": "DIREITO CIVIL", "titulo": "Parte Geral: LINDB, pessoas, bens, negócio jurídico, prescrição e decadência", "key": "CIV", "nome": "Civil", "conc": ["Edital: Direito Civil, item 1, <b>Parte Geral</b>: Lei de Introdução às Normas do Direito Brasileiro, pessoa natural e jurídica, bens públicos e privados, fato, ato e negócio jurídico (defeitos, invalidades e eficácia), prescrição e decadência, e a <b>prescrição quinquenal do Decreto 20.910/1932</b>. O Código Civil (arts. 1º a 232), a LINDB (arts. 1º a 6º) e o Decreto 20.910 foram lidos <b>literalmente no Planalto</b>. Os arts. 20 a 30 da LINDB e as Súmulas e teses do STF e STJ citadas vêm de <b>memória</b>.", "LINDB, vigência e revogação (arts. 1º e 2º): salvo disposição contrária, a lei começa a vigorar <b>45 dias</b> depois de publicada (no exterior, <b>3 meses</b>). Correção de texto antes da vigência reabre o prazo; correção de texto já em vigor é <b>lei nova</b>. Sem vigência temporária, a lei vigora até que outra a modifique ou revogue. A lei posterior revoga a anterior quando <b>declara</b>, é <b>incompatível</b> ou <b>regula inteiramente</b> a matéria. Lei nova que traz disposições gerais ou especiais a par das existentes <b>não revoga</b> a anterior. Não há <b>repristinação</b> automática (§ 3º). Art. 3º: ninguém se escusa de cumprir a lei alegando que não a conhece.", "LINDB, integração e eficácia no tempo (arts. 4º a 6º): na omissão da lei, o juiz decide por <b>analogia, costumes e princípios gerais de direito</b>. Na aplicação da lei o juiz atende aos <b>fins sociais</b> e às exigências do bem comum. A lei em vigor tem <b>efeito imediato e geral</b>, respeitados o <b>ato jurídico perfeito</b>, o <b>direito adquirido</b> e a <b>coisa julgada</b> (art. 6º). Adquiridos são os direitos que o titular pode exercer ou cujo exercício já tem termo prefixo ou condição inalterável a arbítrio de outrem. Coisa julgada é a decisão de que não cabe mais recurso.", "LINDB aplicada ao direito público (Lei 13.655/2018, de memória): o art. 20 proíbe decidir com base em <b>valores jurídicos abstratos</b> sem considerar as consequências práticas; o art. 21 exige indicar as <b>consequências jurídicas e administrativas</b> da invalidação; o art. 22 manda considerar os <b>obstáculos e dificuldades reais do gestor</b>; o art. 23 exige <b>regime de transição</b> em norma nova de conteúdo indeterminado; o art. 24 protege situações já constituídas segundo <b>orientações gerais da época</b>; o art. 26 permite <b>compromisso</b> para eliminar irregularidade ou incerteza; o art. 28 limita a responsabilização do agente a <b>dolo ou erro grosseiro</b>.", "Pessoa natural (arts. 1º a 5º): toda pessoa é capaz de direitos e deveres. <b>Absolutamente incapazes</b>: somente os <b>menores de 16 anos</b> (art. 3º, após o Estatuto da Pessoa com Deficiência, Lei 13.146/2015). <b>Relativamente incapazes</b> (art. 4º): maiores de 16 e menores de 18; <b>ébrios habituais e viciados em tóxico</b>; quem, por causa transitória ou permanente, <b>não puder exprimir sua vontade</b>; os <b>pródigos</b>. A capacidade dos indígenas é regulada por lei especial. A menoridade cessa aos <b>18 anos</b>. Cessa a incapacidade, por <b>emancipação</b>: concessão dos pais por instrumento público a partir dos <b>16 anos</b>, casamento, emprego público efetivo, colação de grau em ensino superior e economia própria por estabelecimento civil ou comercial ou relação de emprego (com 16 anos completos).", "Pessoa jurídica de direito público (arts. 40 a 43): são de direito público interno a <b>União, os Estados, o DF e os Territórios, os Municípios, as autarquias (inclusive associações públicas)</b> e as demais entidades de caráter público criadas por lei. Entes de direito público que tenham <b>estrutura de direito privado</b> regem-se, no que couber, pelo Código Civil. O art. 43 consagra a <b>responsabilidade civil</b> das pessoas jurídicas de direito público por atos de seus agentes, com <b>direito de regresso</b> se houver culpa ou dolo. O STF (Tema 940) entende que a responsabilidade por ato de agente é do Estado, e o agente só responde regressivamente.", "Pessoa jurídica de direito privado (arts. 44 a 69): associações, sociedades, fundações, organizações religiosas, partidos políticos e <b>empreendimentos de economia solidária</b>. Começa a existir com o <b>registro do ato constitutivo</b> (art. 45), e decai em <b>3 anos</b> o direito de anular a constituição por defeito do ato. Art. 49-A: a pessoa jurídica <b>não se confunde</b> com os sócios. <b>Desconsideração</b> (art. 50): abuso por <b>desvio de finalidade</b> (propósito de lesar credores ou praticar ilícitos) ou <b>confusão patrimonial</b>; o juiz estende os efeitos das obrigações aos bens de sócios ou administradores <b>beneficiados direta ou indiretamente</b>, a requerimento da parte ou do MP. A mera existência de <b>grupo econômico</b> ou a mera expansão da atividade não bastam (§§ 4º e 5º). Vale também a desconsideração <b>inversa</b> (§ 3º).", "Associações e fundações: <b>associação</b> é a união de pessoas para fins <b>não econômicos</b>, sem direitos e obrigações recíprocos entre os associados. A exclusão de associado exige <b>justa causa</b> e procedimento com direito de defesa e recurso. Compete privativamente à <b>assembleia geral</b> destituir administradores e alterar o estatuto. A <b>fundação</b> é criada por escritura pública ou testamento, com <b>dotação especial de bens livres</b>, e só pode ter os fins do art. 62, parágrafo único (assistência social, cultura, educação, saúde, segurança alimentar, meio ambiente, pesquisa, ética e cidadania, atividades religiosas). Quem <b>vela</b> pelas fundações é o <b>Ministério Público</b> do Estado onde situadas (art. 66). Alteração do estatuto: <b>2/3</b> dos gestores, sem desvirtuar o fim, e aprovação do MP em <b>45 dias</b>, suprível pelo juiz.", "Bens públicos (arts. 98 a 103): são públicos os bens do domínio nacional pertencentes a pessoas jurídicas de direito público interno; <b>todos os outros são particulares</b>, seja qual for o titular (art. 98). Espécies (art. 99): de <b>uso comum do povo</b> (rios, mares, estradas, ruas, praças), de <b>uso especial</b> (edifícios e terrenos destinados a serviço ou estabelecimento da Administração, inclusive de autarquias) e <b>dominicais</b> (patrimônio das pessoas jurídicas de direito público, como objeto de direito pessoal ou real). Dominicais são também os bens de entes de direito público com estrutura de direito privado, salvo lei em contrário. Os de uso comum e especial são <b>inalienáveis enquanto conservarem a qualificação</b> (art. 100); os dominicais podem ser <b>alienados na forma da lei</b> (art. 101); <b>não sujeitos a usucapião</b> (art. 102). O uso comum pode ser gratuito ou retribuído.", "Negócio jurídico, validade (arts. 104 a 114): requer <b>agente capaz, objeto lícito, possível, determinado ou determinável, e forma prescrita ou não defesa em lei</b>. A forma é livre, salvo exigência legal; a escritura pública é essencial para direitos reais sobre imóveis de valor superior a <b>30 salários mínimos</b>. Interpretação: segundo a <b>boa-fé</b> e os usos do lugar; atende-se mais à <b>intenção</b> do que à letra (art. 112). O § 1º do art. 113 manda dar o sentido confirmado pelo comportamento posterior das partes, pelos usos do mercado, pela boa-fé, mais benéfico a quem <b>não redigiu</b> o dispositivo e o da razoável negociação. Negócios benéficos e a renúncia interpretam-se <b>estritamente</b>. O silêncio importa anuência quando as circunstâncias ou usos autorizarem. A <b>reserva mental</b> é irrelevante, salvo se o destinatário a conhecia.", "Representação, condição, termo e encargo (arts. 115 a 137): o <b>autocontrato</b> é <b>anulável</b>, salvo permissão da lei ou do representado; o negócio com <b>conflito de interesses</b> também, se o terceiro sabia ou devia saber, com prazo de <b>decadência de 180 dias</b>. <b>Condição</b> é evento futuro e incerto, derivado exclusivamente da vontade das partes. <b>Suspensiva</b>: não se adquire o direito enquanto não ocorrer. <b>Resolutiva</b>: o negócio vigora até o implemento. Condições impossíveis: suspensivas invalidam; resolutivas são tidas por inexistentes. <b>Termo inicial</b> suspende o exercício, mas não a aquisição do direito. <b>Encargo</b> não suspende a aquisição nem o exercício, salvo se imposto como condição suspensiva; o ilícito ou impossível é tido por não escrito, salvo se for o motivo determinante da liberalidade. Prazos: exclui-se o dia do começo e inclui-se o do vencimento; vencimento em feriado prorroga até o dia útil seguinte.", "Defeitos do negócio jurídico, vícios do consentimento (arts. 138 a 157): <b>erro</b> substancial que poderia ser percebido por pessoa de diligência normal (art. 138) → anulável; <b>dolo</b> quando for a causa do negócio; o <b>dolo acidental</b> só obriga a perdas e danos (art. 146); <b>coação</b> exige fundado temor de dano iminente e considerável; não é coação a ameaça de exercício normal de direito nem o mero <b>temor reverencial</b> (art. 153); <b>estado de perigo</b>: premido pela necessidade de salvar-se ou a pessoa da família de grave dano <b>conhecido pela outra parte</b>, assume obrigação excessivamente onerosa; <b>lesão</b>: premente necessidade ou <b>inexperiência</b>, prestação manifestamente desproporcional, apreciada ao tempo do negócio, com possibilidade de <b>suplemento</b> ou redução do proveito (art. 157, § 2º). A lesão <b>não exige</b> que a outra parte conheça a necessidade, ao contrário do estado de perigo.", "Fraude contra credores (arts. 158 a 165): é vício social. Negócios de <b>transmissão gratuita</b> ou remissão de dívida por devedor insolvente (ou reduzido à insolvência) são anuláveis pelos <b>credores quirografários</b>, mesmo que o devedor ignore. Nos <b>onerosos</b>, exige-se insolvência <b>notória</b> ou motivo para ser conhecida do outro contratante (art. 159). Só podem anular os credores que já o eram ao tempo do ato. A ação (<b>pauliana</b>) vai contra o devedor, quem contratou e terceiros adquirentes de má-fé. A vantagem reverte ao <b>acervo</b> do concurso de credores; se o fim era dar preferência por garantia real, anula-se apenas a preferência. Fraude contra credores é ato <b>anulável</b>; já a <b>fraude à execução</b> é ineficácia, não é vício do negócio.", "Invalidade (arts. 166 a 184): <b>nulo</b> o negócio celebrado por <b>absolutamente incapaz</b>, de objeto ilícito, impossível ou indeterminável, de motivo determinante comum ilícito, sem forma legal, com preterição de solenidade essencial, para <b>fraudar lei imperativa</b> ou quando a lei o declarar nulo. A <b>simulação</b> torna o negócio nulo (art. 167), subsistindo o dissimulado se válido; ressalvados terceiros de boa-fé. A nulidade pode ser alegada por qualquer interessado ou pelo MP, deve ser pronunciada de ofício, <b>não admite confirmação</b> nem convalesce pelo tempo (arts. 168 e 169). <b>Anulável</b> é o negócio por incapacidade relativa e por erro, dolo, coação, estado de perigo, lesão ou fraude contra credores; <b>pode ser confirmado</b>, não se pronuncia de ofício e só aproveita a quem o alegar (art. 177). Prazo de <b>decadência de 4 anos</b> (art. 178): coação, do dia em que cessar; erro, dolo, fraude, estado de perigo ou lesão, do dia do negócio; atos de incapazes, da cessação da incapacidade. Sem prazo legal: <b>2 anos</b> da conclusão do ato (art. 179).", "Atos ilícitos (arts. 185 a 188): comete ato ilícito quem, por ação ou omissão voluntária, negligência ou imprudência, viola direito e causa dano, <b>ainda que exclusivamente moral</b> (art. 186). O art. 187 cria o <b>abuso de direito</b>: excede manifestamente os limites do fim econômico ou social, da boa-fé ou dos bons costumes. Não são ilícitos a legítima defesa, o exercício regular de direito e o <b>estado de necessidade</b> (art. 188), este só quando absolutamente necessário e nos limites do indispensável. O art. 185 aplica aos atos jurídicos lícitos que não sejam negócios as regras do negócio jurídico, no que couber.", "Prescrição, noções (arts. 189 a 196): violado o direito, nasce a <b>pretensão</b>, que se extingue pela prescrição. A exceção prescreve no mesmo prazo da pretensão. A <b>renúncia</b> só vale depois de consumada a prescrição e sem prejuízo de terceiro; os prazos <b>não podem ser alterados por acordo</b> das partes (art. 192). Pode ser alegada em qualquer grau de jurisdição e a prescrição iniciada contra uma pessoa continua contra o sucessor. O Código não repete a regra de ofício, hoje coberta pelo CPC. Os relativamente incapazes e as pessoas jurídicas têm ação contra assistentes ou representantes que derem causa à prescrição.", "Impedimento e suspensão (arts. 197 a 201): não corre a prescrição entre <b>cônjuges</b> na constância da sociedade conjugal, entre <b>ascendentes e descendentes</b> durante o poder familiar, entre tutelados ou curatelados e tutores ou curadores. Também não corre contra os <b>absolutamente incapazes</b> (menores de 16), contra <b>ausentes do País em serviço público</b> da União, dos Estados ou dos Municípios e contra quem serve às Forças Armadas em tempo de guerra. Não corre ainda pendendo <b>condição suspensiva</b>, não vencido o prazo ou pendendo ação de <b>evicção</b> (art. 199), nem antes da sentença criminal definitiva quando a ação se originar de fato a apurar no juízo criminal (art. 200).", "Interrupção (arts. 202 a 204): a interrupção ocorre <b>uma só vez</b>. Hipóteses: despacho que ordena a citação, <b>mesmo de juiz incompetente</b>, se o interessado a promover no prazo da lei processual; protesto judicial; protesto cambial; apresentação do título em inventário ou concurso de credores; ato judicial que constitui o devedor em mora; <b>qualquer ato inequívoco, ainda que extrajudicial, de reconhecimento do direito</b> pelo devedor. A prescrição interrompida <b>recomeça</b> da data do ato que a interrompeu ou do último ato do processo. Pode ser interrompida por qualquer interessado. Interrupção por um credor solidário aproveita os outros; contra o devedor solidário envolve os demais; contra o principal devedor prejudica o fiador.", "Prazos de prescrição (arts. 205 e 206): regra geral de <b>10 anos</b> (art. 205). Em <b>1 ano</b>: hospedagem e alimentos para consumo no estabelecimento, emolumentos de tabeliães, honorários de peritos e árbitros, e contra peritos e sócios em hipóteses específicas. Em <b>2 anos</b>: pretensão para haver <b>prestações alimentares</b>, a partir do vencimento. Em <b>3 anos</b>: <b>aluguéis</b> de prédios urbanos ou rústicos, rendas, juros e prestações acessórias, <b>enriquecimento sem causa</b>, <b>reparação civil</b>, restituição de lucros e dividendos, títulos de crédito. Em <b>5 anos</b>: cobrança de dívidas <b>líquidas</b> constantes de instrumento público ou particular (§ 5º, I), honorários de profissionais liberais e pretensão do vencedor para haver do vencido o que despendeu em juízo.", "Decadência (arts. 207 a 211, de memória): em regra, <b>não se aplicam à decadência</b> as normas que impedem, suspendem ou interrompem a prescrição (art. 207). Aplicam-se a ela o art. 195 e o art. 198, I (art. 208): não corre contra absolutamente incapaz. É <b>nula a renúncia</b> à decadência fixada em lei (art. 209). O juiz deve conhecer de ofício a decadência <b>legal</b> (art. 210); a <b>convencional</b> pode ser alegada pela parte, e o juiz não pode supri-la de ofício (art. 211). Prescrição extingue a <b>pretensão</b> (direitos a uma prestação); decadência extingue o <b>direito potestativo</b>.", "Prescrição quinquenal contra a Fazenda (Decreto 20.910/1932): as dívidas passivas da União, dos Estados e dos Municípios e <b>todo e qualquer direito ou ação contra a Fazenda</b>, seja qual for a natureza, prescrevem em <b>5 anos</b> contados da data do ato ou fato do qual se originarem (art. 1º). Mesmo prazo para pensões, restituições ou diferenças (art. 2º). Quando o pagamento se dividir por períodos, a prescrição atinge <b>progressivamente as prestações</b> (art. 3º). Não corre a prescrição durante a demora da repartição em estudar ou apurar a dívida líquida; a suspensão se dá pela entrada do requerimento no protocolo (art. 4º). A demora do titular não suspende (art. 5º). O direito à reclamação administrativa sem prazo fixado prescreve em <b>1 ano</b> (art. 6º). A prescrição só se interrompe <b>uma vez</b> (art. 8º) e recomeça <b>pela metade do prazo</b> (art. 9º).", "Jurisprudência (de memória): o STJ, em recurso repetitivo (REsp 1.251.993, Tema 553), fixou que o prazo <b>quinquenal do Decreto 20.910</b> prevalece sobre o trienal do art. 206, § 3º, V, do CC nas ações de indenização contra a Fazenda Pública. A <b>Súmula 85 do STJ</b> trata das relações de trato sucessivo: a prescrição atinge só as parcelas anteriores aos 5 anos. A <b>Súmula 383 do STF</b> diz que a prescrição em favor da Fazenda recomeça pela metade, <b>sem ficar abaixo de 5 anos</b>. A <b>Súmula 150 do STF</b> iguala o prazo da execução ao da ação. A <b>Súmula 619 do STJ</b> afirma que a ocupação indevida de bem público é <b>detenção</b>, não posse. A <b>Súmula 195 do STJ</b> impede anular fraude contra credores em embargos de terceiro, e a <b>Súmula 375</b> exige registro da penhora ou má-fé do terceiro para fraude à execução."], "pega": ["Absolutamente incapazes: só os <b>menores de 16 anos</b>. A banca ainda coloca ébrios, pródigos e quem não pode exprimir vontade como absolutamente incapazes (texto anterior ao Estatuto da Pessoa com Deficiência).", "Bens públicos: <b>não são usucapíveis</b> (art. 102) e os de uso comum e especial são inalienáveis <b>enquanto afetados</b>. A banca diz que são inalienáveis para sempre ou que os dominicais podem ser usucapidos.", "Bens particulares de entes públicos: o art. 98 diz que todos os bens que não sejam de pessoa jurídica de direito público são particulares. A banca inclui bens de empresas públicas ou concessionárias como públicos.", "Vigência: <b>45 dias</b> após a publicação (3 meses no exterior). A banca usa 30 ou 90 dias ou diz que a lei só vale quando publicada.", "Não há <b>repristinação</b> automática: a lei revogada não volta com a perda de vigência da revogadora (art. 2º, § 3º). A banca afirma o contrário.", "Nulo x anulável: o nulo <b>não se confirma e não convalesce</b> com o tempo, o juiz o declara de ofício. O anulável <b>pode ser confirmado</b> e não se declara de ofício. A banca troca os efeitos.", "Prazos: anulação em <b>4 anos</b> (art. 178), subsidiário de <b>2 anos</b> (art. 179). A banca diz que a ação de nulidade prescreve em 10 anos como regra de convalidação.", "Lesão x estado de perigo: o estado de perigo exige que a outra parte <b>conheça o dano</b> e envolve risco pessoal ou familiar; a lesão não exige conhecimento da outra parte e envolve inexperiência ou necessidade. A banca confunde os requisitos.", "Fraude contra credores: é <b>anulável</b>, pelos credores <b>quirografários anteriores</b>. A banca fala em nulidade ou em ineficácia, mistura com a fraude à execução.", "Prescrição não pode ser alterada por acordo (art. 192). A renúncia só vale <b>depois de consumada</b>. A banca diz que as partes podem ampliar prazos ou renunciar antecipadamente.", "Interrupção: <b>uma só vez</b>. A banca diz que pode ser interrompida quantas vezes houver atos. No Decreto 20.910 também uma só vez (art. 8º).", "Decadência: em regra <b>não se suspende nem se interrompe</b>, mas não corre contra absolutamente incapazes. O juiz conhece de ofício a decadência <b>legal</b>. A banca generaliza que a decadência se suspende como a prescrição ou que o juiz conhece de ofício a convencional.", "Fazenda Pública: <b>5 anos</b> pelo Decreto 20.910, inclusive em indenização (Tema 553 STJ). A banca usa 3 anos do CC (art. 206, § 3º, V) para dano moral contra o Estado.", "Decreto 20.910, art. 9º: a prescrição interrompida recomeça <b>pela metade do prazo</b> (Súmula 383 STF: nunca abaixo de 5 anos). A banca diz que recomeça por inteiro ou por 1 ano."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Repartição constitucional das receitas tributárias (CF, arts. 157 a 162)", "key": "TRI", "nome": "Tributário", "conc": ["Edital: Direito Tributário, item 18, <b>repartição constitucional das receitas tributárias</b>: participação direta e indireta, participação dos Municípios, fundos constitucionais e federalismo fiscal. Os arts. <b>157 a 161</b> da CF foram lidos <b>literalmente no Planalto</b> (texto compilado, já com a EC 132/2023, a reforma tributária). O art. 162 e as teses do STF e STJ vêm de <b>memória</b>.", "Noção: a Constituição divide o produto da arrecadação de alguns tributos entre os entes. A <b>repartição direta</b> ocorre quando o ente é titular da receita por determinação constitucional (o dinheiro não passa pelo caixa da União ou do Estado de forma discricionária). A <b>repartição indireta</b> ocorre pelos <b>fundos de participação</b> (FPE e FPM) e pelos programas regionais, em que a União distribui um percentual do bolo. O art. 160 veda <b>reter ou restringir</b> a entrega e o emprego desses recursos, inclusive adicionais e acréscimos.", "Receitas dos Estados e do DF (art. 157): o produto do <b>IRRF</b> sobre rendimentos pagos por eles, suas autarquias e fundações; e <b>20% do imposto residual</b> que a União instituir (art. 154, I). Receitas dos Municípios (art. 158): <b>IRRF</b> sobre rendimentos que o Município, suas autarquias e fundações pagarem; <b>50% do ITR</b> dos imóveis situados no Município (<b>100%</b> se o Município fiscalizar e cobrar o ITR por opção, art. 153, § 4º, III); <b>50% do IPVA</b> dos veículos licenciados no território (e, para veículos aquáticos e aéreos, dos proprietários domiciliados nele); e <b>25% do ICMS</b>.", "Cota-parte municipal do ICMS (art. 158, IV e §§): os Municípios recebem <b>25%</b> do ICMS e agora também 25% do <b>IBS</b> distribuído aos Estados (art. 158, IV, “b”). Critérios do ICMS (art. 158, § 1º): <b>65%</b>, no mínimo, na proporção do <b>valor adicionado</b> nas operações e prestações realizadas em seu território; até <b>35%</b> conforme lei estadual, com obrigatoriedade de pelo menos <b>10 pontos percentuais</b> baseados em indicadores de melhoria de aprendizagem e equidade. Critérios do IBS (§ 2º): <b>80% pela população</b>, 10% por indicadores de educação, 5% por indicadores de preservação ambiental e 5% em montantes <b>iguais</b> para todos os Municípios do Estado.", "Fundos de participação (art. 159, I): a União entrega <b>50%</b> do produto do <b>IR, IPI</b> (e do imposto seletivo, art. 153, VIII): <b>21,5% ao FPE</b>; <b>22,5% ao FPM</b>; <b>3%</b> a programas de financiamento do setor produtivo das Regiões Norte, Nordeste e Centro-Oeste (metade do total regional ao semiárido do Nordeste); e <b>1% ao FPM</b> em cada uma de três parcelas adicionais, entregues no primeiro decêndio de <b>dezembro</b>, <b>julho</b> e <b>setembro</b>. Para o cálculo exclui-se o IRRF que já pertence aos Estados e Municípios (art. 159, § 1º).", "Outras entregas da União (art. 159, II a IV): <b>10% do IPI</b> (e do imposto seletivo) aos Estados e DF, proporcionalmente às <b>exportações de industrializados</b>; nenhuma unidade pode receber mais de <b>20%</b> desse montante, e o excedente é redistribuído (§ 2º). Os Estados repassam <b>25%</b> dessa cota aos Municípios, seguindo os critérios do art. 158 (§ 3º). <b>29% da CIDE-combustíveis</b> (art. 177, § 4º) vão aos Estados e DF, e <b>25%</b> dessa parcela cabe aos Municípios (§ 4º).", "Fundo Nacional de Desenvolvimento Regional (art. 159-A): criado pela EC 132/2023, visa reduzir desigualdades regionais e sociais, com entrega de recursos da <b>União aos Estados e ao DF</b> para infraestrutura, fomento a atividades produtivas e ciência, tecnologia e inovação. Critérios de rateio: <b>30% população</b> e <b>70%</b> pelo coeficiente de participação no FPE. O <b>TCU</b> calcula os coeficientes. É vedada a retenção ou qualquer restrição ao recebimento.", "Vedação à retenção (art. 160): é vedada a retenção ou restrição à entrega e ao emprego dos recursos. Exceção: a União e os Estados podem condicionar a entrega ao <b>pagamento de seus créditos</b> (inclusive de suas autarquias) e ao cumprimento do mínimo de saúde (art. 198, § 2º, II e III). Acordos e parcelamentos de débitos firmados com a União contêm cláusula que autoriza <b>deduzir dos repasses</b> das cotas dos fundos ou de precatórios federais (§ 2º).", "Lei complementar e transparência (arts. 161 e 162): cabe à <b>lei complementar</b> definir <b>valor adicionado</b> (art. 158, § 1º, I), estabelecer normas sobre a entrega dos recursos do art. 159 e critérios de rateio dos fundos, visando ao <b>equilíbrio socioeconômico</b> entre Estados e entre Municípios, e dispor sobre o acompanhamento pelos beneficiários do cálculo das quotas. O art. 162 impõe a divulgação, pelos entes, dos montantes arrecadados, recebidos e entregues e dos critérios de rateio (de memória). A LC 63/1990 trata da entrega das parcelas do ICMS e do IPI aos Municípios (de memória).", "Jurisprudência (de memória): o STF, no Tema 1.130, fixou que pertence ao <b>Município</b> a receita do <b>IRRF</b> incidente sobre valores pagos por ele, suas autarquias e fundações a pessoas físicas ou jurídicas contratadas para prestar bens ou serviços (art. 158, I). No Paraná, parte dos 35% do ICMS é distribuída por critérios de preservação ambiental (o chamado <b>ICMS ecológico</b>, pioneiro no país)."], "pega": ["IRRF: pertence ao ente que <b>paga</b> o rendimento (União, Estados, DF ou Municípios para si). A banca diz que todo o IRRF é da União ou que só o dos servidores é do ente.", "ITR: <b>50%</b> aos Municípios, ou <b>100%</b> se fiscalizarem e cobrarem por opção (art. 153, § 4º, III). A banca troca por 25% ou 100% automático.", "IPVA: <b>50%</b> ao Município do licenciamento. A banca diz 25% ou 100%.", "ICMS: <b>25%</b> aos Municípios. Critério mínimo: <b>65%</b> pelo valor adicionado (art. 158, § 1º, I) e até <b>35%</b> por lei estadual. A banca ainda usa o texto antigo (3/4 e 1/4).", "IBS: Municípios recebem 25% da parcela distribuída aos Estados, com <b>80% por população</b>, 10% educação, 5% meio ambiente, 5% igualitário. A banca troca por valor adicionado ou por critério livre estadual.", "FPM: <b>22,5%</b> + três parcelas de <b>1%</b> (dezembro, julho e setembro); FPE <b>21,5%</b>; total de <b>50%</b> do IR e IPI. A banca troca percentuais ou diz que o FPM é de ICMS.", "IPI-exportação: <b>10%</b> aos Estados, <b>limite de 20%</b> por unidade, e <b>25%</b> deste repasse aos Municípios. A banca coloca os Municípios recebendo diretamente da União.", "Retenção de repasses: é vedada, mas a União e os Estados podem condicionar a entrega ao <b>pagamento de seus créditos</b> e ao mínimo de saúde. A banca diz que a vedação é absoluta ou que só a União pode condicionar.", "Regulação: <b>lei complementar</b> define valor adicionado e critérios de rateio dos fundos. A banca diz que lei ordinária ou lei estadual disciplina o FPM."]}, {"materia": "PROCESSO CIVIL", "titulo": "Habeas data, mandado de injunção e ação popular", "key": "PCV", "nome": "Proc. Civil", "conc": ["Edital: Processo Civil, item 18, <b>habeas data (Lei 9.507/1997), mandado de injunção (Lei 13.300/2016) e ação popular (Lei 4.717/1965)</b>. Os três textos foram lidos <b>literalmente no Planalto</b>. Os arts. 1º e 2º do habeas data apareceram só em parte na leitura, e a redação do art. 1º vem de memória; o inciso V do art. 5º do Código Civil também. As súmulas citadas vêm de <b>memória</b>.", "Habeas data, cabimento (art. 7º e CF, art. 5º, LXXII): concede-se para <b>assegurar o conhecimento</b> de informações relativas à pessoa do impetrante constantes de registro ou banco de dados de <b>entidades governamentais ou de caráter público</b>; para <b>retificar</b> dados, quando não se prefira fazê-lo por processo sigiloso, judicial ou administrativo; e para <b>anotar</b> nos assentamentos do interessado a contestação ou explicação sobre dado verdadeiro, mas justificável e sob pendência judicial ou amigável. Considera-se de caráter público o registro ou banco de dados que possa ser transmitido a terceiros ou que não seja de uso privativo do órgão que o produz (art. 1º, parágrafo único, de memória). A ação é <b>gratuita</b> (art. 21).", "Habeas data, fase administrativa (arts. 2º a 4º, 8º): o requerimento é apresentado ao órgão depositário e <b>deferido ou indeferido em 48 horas</b>; a decisão é comunicada ao requerente em <b>24 horas</b>. Deferido, marca-se dia e hora para o requerente conhecer as informações. Para retificação, o interessado apresenta documentos; a retificação se faz em até <b>10 dias</b> e o interessado é cientificado. A inicial deve ser instruída com prova da <b>recusa ao acesso</b> ou do decurso de mais de <b>10 dias</b> sem decisão; da recusa da retificação ou do decurso de mais de <b>15 dias</b>; ou da recusa da anotação ou mais de <b>15 dias</b> sem decisão (art. 8º, parágrafo único). Sem isso a inicial é indeferida (art. 10).", "Habeas data, procedimento (arts. 9º a 19): o juiz notifica o coator para prestar informações em <b>10 dias</b>; ouve o MP em <b>5 dias</b>; decide em <b>5 dias</b>. Se procedente, marca data e hora para o coator apresentar as informações ou a prova da retificação ou anotação. Cabe <b>apelação</b> da sentença que conceder ou negar; se concedida, o recurso tem <b>efeito meramente devolutivo</b> (art. 15). O pedido pode ser <b>renovado</b> se a decisão denegatória não apreciou o mérito (art. 18). Tem <b>prioridade</b> sobre todos os atos judiciais, exceto habeas corpus e mandado de segurança (art. 19).", "Habeas data, competência (art. 20): originariamente, o <b>STF</b> contra atos do Presidente da República, das Mesas da Câmara e do Senado, do TCU, do PGR e do próprio STF; o <b>STJ</b> contra atos de Ministro de Estado ou do próprio Tribunal; os <b>TRFs</b> contra atos do próprio Tribunal ou de juiz federal; o <b>juiz federal</b> contra autoridade federal; <b>tribunais estaduais</b> conforme a Constituição do Estado; <b>juiz estadual</b> nos demais casos. Em regra, contra autoridade ou órgão municipal, a competência é do <b>juiz estadual</b>. Há recurso ordinário e extraordinário nos casos previstos. A Súmula 2 do STJ afirma que <b>não cabe</b> HD sem prévia recusa administrativa (de memória).", "Mandado de injunção, cabimento (arts. 1º a 3º e CF, art. 5º, LXXI): concede-se sempre que a <b>falta total ou parcial</b> de norma regulamentadora torne inviável o exercício de <b>direitos e liberdades constitucionais</b> e de prerrogativas inerentes à <b>nacionalidade, soberania e cidadania</b>. A regulamentação é <b>parcial</b> quando as normas editadas são insuficientes. Legitimam-se como impetrantes as pessoas naturais ou jurídicas que se afirmam titulares do direito; impetrado é o Poder, órgão ou autoridade com atribuição para editar a norma.", "Mandado de injunção, procedimento e decisão (arts. 4º a 11): a inicial segue a lei processual e indica o órgão impetrado e a pessoa jurídica a que ele pertence. Recebida a inicial, notifica-se o impetrado para informações em <b>10 dias</b> e dá-se ciência ao órgão de representação judicial da pessoa jurídica. O MP opina em <b>10 dias</b>. Indeferimento liminar pelo relator: agravo em <b>5 dias</b>. Reconhecida a <b>mora legislativa</b>, a injunção determina <b>prazo razoável</b> para editar a norma e estabelece as condições do exercício do direito ou da ação própria se a mora persistir (art. 8º). Dispensa o prazo se o impetrado já descumpriu injunção anterior.", "Mandado de injunção, eficácia (arts. 9º a 11): a decisão tem <b>eficácia subjetiva limitada às partes</b> e produz efeitos até o advento da norma regulamentadora. Poderá ter eficácia <b>ultra partes ou erga omnes</b> quando inerente ou indispensável ao exercício do direito (§ 1º), e o relator pode <b>estender</b> os efeitos a casos análogos (§ 2º). A insuficiência de prova não impede nova impetração. A decisão pode ser <b>revista</b> se mudarem as circunstâncias. A norma superveniente tem efeitos <b>ex nunc</b> para os beneficiados por decisão transitada, salvo se mais favorável; editada antes da decisão, a impetração fica prejudicada.", "Mandado de injunção coletivo (arts. 12 e 13): legitimados: <b>Ministério Público</b> (ordem jurídica, regime democrático, interesses sociais ou individuais indisponíveis); <b>partido político com representação no Congresso</b>; <b>organização sindical, entidade de classe ou associação</b> constituída e em funcionamento há pelo menos <b>1 ano</b>; e <b>Defensoria Pública</b> (direitos humanos e necessitados). A coisa julgada alcança limitadamente os membros da coletividade. Não induz <b>litispendência</b> com os individuais; o impetrante individual deve pedir <b>desistência em 30 dias</b> da ciência comprovada para ser beneficiado.", "Ação popular, cabimento e legitimidade (arts. 1º a 4º e CF, art. 5º, LXXIII): <b>qualquer cidadão</b> é parte legítima para anular ato lesivo ao patrimônio da União, Estados, DF, Municípios, autarquias, empresas públicas, sociedades de economia mista, serviços sociais autônomos, fundações e entidades subvencionadas. Patrimônio público: bens e direitos de valor <b>econômico, artístico, estético, histórico ou turístico</b>. A prova da cidadania é o <b>título de eleitor</b> (ou documento correspondente). A Súmula 365 do STF veda a ação à <b>pessoa jurídica</b>. Autor de boa-fé fica isento de custas e honorários (CF).", "Ação popular, nulidades (arts. 2º a 4º): são nulos os atos lesivos por <b>incompetência, vício de forma, ilegalidade do objeto, inexistência dos motivos e desvio de finalidade</b>. O art. 4º traz nulidades específicas, como a concessão de serviço público sem <b>concorrência</b> (quando exigida), cláusulas que comprometam o caráter competitivo, vantagens e prorrogações em contratos não previstas em lei ou no contrato, e compra e venda por preço acima ou abaixo do mercado. Atos cujos vícios não se enquadram nesses casos são <b>anuláveis</b> (art. 3º).", "Ação popular, competência e partes (arts. 5º e 6º): é competente o <b>juiz de primeira instância</b> conforme a origem do ato, segundo a organização judiciária de cada Estado. Interessando à União e a outro ente, o juízo da União; ao Estado e Município, o juízo do Estado. A propositura <b>previne</b> a jurisdição. Cabe <b>suspensão liminar</b> do ato lesivo (art. 5º, § 4º). Figuram como réus as pessoas públicas ou privadas envolvidas, as <b>autoridades</b> que autorizaram, aprovaram, ratificaram ou praticaram o ato (ou omissas), e os <b>beneficiários diretos</b>. A pessoa jurídica pode <b>abster-se de contestar</b> ou <b>atuar ao lado do autor</b> (§ 3º). O <b>MP acompanha</b> a ação, apressa a prova e promove a responsabilidade, mas não pode defender o ato impugnado (§ 4º). Qualquer cidadão pode habilitar-se como litisconsorte ou assistente (§ 5º).", "Ação popular, procedimento (arts. 7º a 22): segue o rito ordinário com modificações. O juiz ordena a citação, a intimação do MP e a requisição de documentos (prazo de <b>15 a 30 dias</b>). Contestação em <b>20 dias</b>, prorrogáveis por mais <b>20</b>, comum a todos os interessados. Citação de beneficiários pode ser por <b>edital</b> de 30 dias. Sentença em <b>15 dias</b>. Procedente: condena os responsáveis e beneficiários a <b>perdas e danos</b>, ressalvada a ação regressiva, e condena os réus às custas e <b>honorários</b> do autor. Lide <b>manifestamente temerária</b>: o autor paga o <b>décuplo das custas</b> (art. 13). Se o autor desistir ou der motivo à absolvição da instância, publicam-se editais e qualquer cidadão ou o MP pode prosseguir em <b>90 dias</b> (art. 9º). Execução: o MP promove em 30 dias, após 60 dias sem execução (art. 16).", "Ação popular, sentença e recursos (arts. 18, 19 e 21): a sentença faz <b>coisa julgada erga omnes</b>, exceto se improcedente por <b>deficiência de prova</b>, caso em que qualquer cidadão pode repropor com nova prova (art. 18). A sentença de <b>improcedência ou carência</b> sujeita-se ao <b>duplo grau obrigatório</b> (art. 19); da sentença de procedência cabe apelação com efeito <b>suspensivo</b>. A ação <b>prescreve em 5 anos</b> (art. 21). Súmula 101 do STF: o mandado de segurança <b>não substitui</b> a ação popular (de memória)."], "pega": ["Habeas data: protege informações <b>sobre a pessoa do impetrante</b>. A banca diz que serve para obter informações de terceiros ou dados de interesse coletivo.", "Requisito prévio: provas da recusa administrativa (ou silêncio por mais de 10 ou 15 dias, Súmula 2 STJ). A banca diz que o HD é cabível diretamente, sem negativa.", "Prazos do HD: 48h para deferir, 24h para comunicar, 10 dias para informações e retificação, 5 dias para MP e para decisão. A banca troca as unidades ou os números.", "Recurso no HD: <b>apelação</b>; se concedido, efeito <b>apenas devolutivo</b>. A banca diz suspensivo ou recurso ordinário.", "Gratuidade: HD é gratuito (CF e art. 21). A banca diz que há custas ou honorários ao vencido.", "MI: só para direitos e liberdades constitucionais e prerrogativas da nacionalidade, soberania e cidadania. A banca amplia para qualquer direito legal ou para norma infralegal.", "Eficácia do MI: em regra <b>inter partes</b>, até o advento da norma; <b>erga omnes</b> só se inerente ao direito. A banca diz que sempre alcança todos ou que a norma superveniente tem efeito retroativo.", "MI coletivo: associação com <b>1 ano</b>; partido <b>com representação no Congresso</b>; MP; Defensoria. A banca inclui o cidadão individual ou exige 2 anos.", "Ação popular: só o <b>cidadão</b>; a pessoa jurídica não pode (Súmula 365 STF). A banca diz que associação ou partido podem propor.", "Ação popular: o MP <b>não pode</b> defender o ato impugnado. A banca diz que o MP pode defender o ato quando o interesse público exigir ou que ele não participa.", "Coisa julgada na AP: <b>erga omnes</b>, salvo improcedência por falta de prova. A banca diz que é inter partes ou que sempre impede nova ação.", "Prazo da AP: <b>5 anos</b>; contestação de 20 dias prorrogável por 20; décuplo das custas na lide temerária. A banca usa 120 dias (mandado de segurança) ou 10 dias.", "Duplo grau na AP: sentença de <b>improcedência ou carência</b> sujeita-se ao reexame. A banca diz que a procedência é que depende de reexame, como no MS."]}], "20": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Parcerias e delegações em Curitiba: PARS S.A., PMPE e parcerias com OSC (Decreto 1.067/2016)", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 9 de Direito Administrativo (regulação de parcerias e delegações em Curitiba). Foram lidos <b>na íntegra</b>, no navegador (LegisWeb): a <b>Lei 16.538/2025</b> (PARS S.A.), a <b>Lei 16.763/2026</b> (Programa Municipal de Parcerias Estratégicas, PMPE) e o <b>Decreto 1.067/2016</b> em versão consolidada. Os <b>Decretos 352/2023 e 2.046/2023</b> foram lidos <b>apenas como aparecem embutidos</b> no texto consolidado do 1.067, não em arquivo próprio. A <b>Lei 8.987/1995</b> e a <b>Lei 13.019/2014</b> não foram relidas: o que se diz delas vem do estudo anterior. Importante: o Decreto 1.067/2016 é o regulamento local do <b>marco das organizações da sociedade civil (MROSC)</b>, e não de PPP.", "<b>PARS S.A. (Lei 16.538/2025).</b> A lei <b>autoriza</b> a criação de pessoa jurídica de direito privado, <b>sociedade por ações</b>, vinculada à <b>Secretaria Municipal de Planejamento, Finanças e Orçamento</b> (redação da Lei 16.763/2026). Objeto: promover a implementação do PMPE, estruturando a modelagem de projetos de concessão, PPP e outras parcerias <b>para Curitiba e para outros entes</b> (federal, estadual e municipais), gerindo ativos financeiros e contratuais transferidos pelo Município, auxiliando investimentos, prestando consultoria de infraestrutura e urbanização, fiscalizando e gerindo contratos administrativos e participando como sócia de empresas privadas. As atividades respeitam as atribuições dos órgãos existentes, <b>sem sobreposição de competências</b>. Regime jurídico: o <b>próprio das empresas privadas</b> (civil, comercial, trabalhista e tributário).", "<b>Capital e controle.</b> Ações ordinárias ou preferenciais <b>nominativas</b>. Podem participar a União, o Estado do Paraná, entidades de outros entes e <b>investidores privados</b>, mas o Município mantém no mínimo <b>50% mais uma</b> das ações <b>com direito a voto</b>. O capital inicial é de <b>R$ 6 milhões</b>. A PARS pode firmar contratos, convênios e termos de cooperação e <b>criar subsidiárias</b>. Receitas: dotações da LOA, prestação de serviços, alienação de ativos e rendimentos, <b>taxa de administração de 4%</b> sobre o valor total do Fundo Garantidor de Parcerias (Lei 13.912/2011) e doações, legados e subvenções.", "<b>Governança.</b> Conselho de Administração com no mínimo <b>3</b> membros; Diretoria Executiva com no mínimo <b>2</b> diretores; <b>mandato de 2 anos</b>, permitida a recondução; avaliação anual de desempenho individual e coletiva. Conselho Fiscal regido pela Lei 6.404/1976, com ao menos um membro indicado pelo controlador que seja servidor com <b>vínculo permanente</b>. A governança segue a <b>Lei municipal 15.208/2018</b>; se a receita operacional bruta superar <b>R$ 90 milhões</b>, aplica-se a <b>Lei 13.303/2016</b>. O Município consigna recursos na LOA para o custeio nos <b>quatro primeiros anos</b>, deve ter plano de metas para a <b>autossuficiência</b> depois disso e faz avaliação rigorosa no quarto ano. A PARS passa a <b>gerir o Fundo</b> da Lei 13.912/2011; até sua constituição, quem o administra é a Secretaria de Planejamento, Finanças e Orçamento.", "<b>PMPE (Lei 16.763/2026): conceito e finalidades.</b> Institui o programa de parcerias com a iniciativa privada para eficiência em serviços públicos e na gestão de bens e equipamentos municipais. Define <b>parcerias estratégicas</b> como negócios jurídicos, atos administrativos bilaterais e instrumentos análogos entre a Administração e entidades privadas, com ou sem fins lucrativos, de projeto <b>qualificado</b> no PMPE. <b>Qualificação</b> é o ato pelo qual o projeto entra na carteira do PMPE por deliberação do CGPE e é incluído no <b>Cronograma Trienal</b> (a partir do triênio <b>2026-2028</b>). A lei traz <b>8 objetivos</b> (infraestrutura, investimento privado, reordenação da posição do Estado na economia, desoneração do erário, uso eficiente de bens públicos, emprego e renda, sustentabilidade, apoio ao planejamento e ao Plano Diretor) e <b>10 diretrizes</b>, entre elas transparência, isonomia, orientação por resultados, segurança jurídica, direitos dos usuários (Lei 13.460/2017) e <b>meios consensuais</b> (mediação, arbitragem, comitês de prevenção e solução de controvérsias).", "<b>Modalidades (art. 6º, § 1º: doze).</b> (I) concessões e permissões da Lei 8.987; (II) concessões patrocinadas ou administrativas da Lei 11.079; (III) concessão de uso, permissão de uso e CDRU; (IV) locação, arrendamento e alienação de bens; (V) contrato de gestão com organização social (Lei 9.637 e Lei municipal 9.226/1997); (VI) termo de parceria com OSCIP (Lei 9.790); (VII) termo de colaboração ou de fomento com OSC (Lei 13.019); (VIII) contrato de gestão para ocupação de imóveis públicos; (IX) contratos geradores de receita e contratos de eficiência (Lei 14.133); (X) contratos administrativos de compras, serviços e obras (Lei 14.133); (XI) fundos de investimento (FIP, FII e outros); (XII) subvenção econômica e outras formas de fomento. Os projetos dos incisos <b>I e II (concessões e PPP) devem obrigatoriamente</b> ser submetidos ao CGPE, e isso ocorre <b>antes do início dos estudos de estruturação</b>.", "<b>CGPE: composição e competência.</b> O Comitê Gestor é presidido pelo <b>Secretário do Governo Municipal</b> e composto pelos Secretários de <b>Finanças</b> e de <b>Administração e Tecnologia da Informação</b>, pelo presidente do <b>IPPUC</b> e por <b>1 membro de livre escolha do Prefeito</b>. O órgão gestor do bem ou serviço participa <b>com voto</b> das reuniões em que seu projeto esteja em pauta. Compete ao CGPE avaliar propostas de qualificação, aprovar e alterar o Cronograma Trienal <b>por resolução</b>, acompanhar a estruturação e a execução, <b>autorizar, após consulta pública, a publicação final</b> de editais e contratos, editar resoluções normativas e se manifestar, a pedido do órgão titular, sobre revisões, reequilíbrios e aditivos. A qualificação ou a estruturação <b>não transfere</b> a competência de gestão do bem ou serviço.", "<b>Estruturação, instrumentos e contratos.</b> Estudos de viabilidade técnico-operacional, econômico-financeira e jurídica. Instrumentos: <b>PMI</b> (arts. 81 e seguintes da Lei 14.133, que pode partir de proposta da iniciativa privada), <b>sondagem de mercado</b> e <b>roadshow</b>. A estruturação é feita <b>preferencialmente</b> pela PARS S.A., mediante contrato (preferência, não exclusividade). A audiência ou consulta pública é facultativa, mas <b>obrigatória quando a legislação da modalidade a exigir</b>. Os contratos seguem a legislação da modalidade e podem prever <b>SPE</b>, mediação, arbitragem e <b>dispute board</b> (direitos patrimoniais disponíveis) e verificadores independentes. A remuneração do parceiro pode ser, isolada ou combinada, a cessão de direitos de exploração comercial, a transferência de bens, títulos da dívida pública ou receitas alternativas, com remuneração variável por desempenho e compartilhamento de receitas. As receitas do compartilhamento vão <b>integralmente ao Fundo</b> da Lei 13.912/2011, salvo decisão fundamentada do CGPE.", "<b>Regras especiais.</b> O art. 23 dispensa os contratos de concessão e PPP dos <b>limites de alteração de objeto e valor</b> do art. 124 e seguintes da Lei 14.133. Licenças, alvarás e autorizações do projeto têm <b>tramitação prioritária</b> com prazo máximo de resposta, <b>sem licença tácita</b>. A lei também altera as Leis 16.538, 16.466/2024, 11.095/2004, 7.671/1991, 13.912/2011 e 10.506/2002, e <b>revoga</b> a Lei 10.192/2001 e a Lei 11.929/2006 (exceto o art. 26). O <b>Fundo de Aportes e Garantias</b> (Lei 13.912/2011 alterada) é entidade contábil <b>sem personalidade jurídica</b>, presta garantia às obrigações pecuniárias do Município e recebe aportes; aporte de <b>imóveis</b> exige <b>prévia autorização legislativa</b>; admite fiança <b>sem benefício de ordem</b>, penhor, hipoteca, alienação e cessão fiduciárias e caução em dinheiro; é vedada garantia cujo valor presente líquido, somado às anteriores, supere o ativo total do Fundo.", "<b>Parcerias com OSC (Decreto 1.067/2016, regulamento da Lei 13.019/2014).</b> Instrumentos: <b>termo de colaboração</b> (iniciativa da Administração, com recursos), <b>termo de fomento</b> (iniciativa da OSC, com recursos) e <b>acordo de cooperação</b> (sem recursos). Regra: <b>chamamento público</b>, com divulgação do edital com antecedência mínima de <b>30 dias</b>. <b>Dispensa</b>: urgência (até 180 dias), calamidade e credenciadas em educação, saúde e assistência social; <b>inexigibilidade</b>: inviabilidade de competição, acordo internacional ou lei que identifique a entidade; a justificativa e o extrato são publicados na mesma data, <b>sob pena de nulidade</b>. O <b>PMIS</b> (manifestação de interesse social) não é pré-requisito do chamamento; o período de recebimento é de no mínimo 60 dias por ano e a análise dura até 6 meses. A <b>comissão de seleção</b> tem no mínimo <b>3 servidores efetivos</b>; recurso em <b>5 dias</b>; a homologação <b>não gera direito à celebração</b>. A OSC convocada tem <b>15 dias</b> para o plano de trabalho. Exige-se <b>parecer jurídico de Procurador do Município</b> (dispensável individualmente se houver parecer sobre minuta-padrão). A OSC precisa de no mínimo <b>1 ano</b> de CNPJ ativo e experiência prévia.", "<b>Execução, alteração e sanções (Decreto 1.067/2016).</b> Contrapartida financeira <b>não é exigida</b>. Cláusulas essenciais (art. 40) incluem rescisão a qualquer tempo com <b>aviso de no mínimo 60 dias</b>. A ampliação do valor por aditivo <b>não pode passar de 30%</b> do valor global. Os saldos são devolvidos em <b>30 dias improrrogáveis</b>, sob pena de tomada de contas especial. As sanções são advertência, <b>suspensão de até 2 anos</b> e declaração de inidoneidade; a suspensão e a inidoneidade são de competência indelegável do titular (art. 3º-A, § 2º). A competência dos Secretários pode ser delegada, <b>vedada a subdelegação</b>. A <b>prescrição</b> da prestação de contas é de 5 anos. O decreto <b>não se aplica</b> a contratos de gestão com OS, termos de parceria com OSCIP e convênios filantrópicos do SUS (CF, art. 199, § 1º). O credenciamento (arts. 29-C a 29-E) serve à educação, saúde e assistência social e <b>não gera direito à parceria</b> (redação do Decreto 2.046/2023)."], "pega": ["Controle da PARS: o Município mantém <b>50% mais uma das ações COM DIREITO A VOTO</b>. A banca diz 50% do capital total, maioria absoluta do capital ou 51% das ações preferenciais.", "Natureza da PARS: a lei <b>autoriza</b> a criação de <b>sociedade por ações</b> de direito privado, vinculada à Secretaria de <b>Planejamento, Finanças e Orçamento</b>. A banca diz autarquia, empresa pública ou vinculada à Secretaria do Governo ou à Procuradoria.", "Números da PARS: capital inicial <b>R$ 6 milhões</b>; taxa de administração de <b>4% sobre o valor total do Fundo</b>; Conselho de Administração com <b>3</b>; Diretoria com <b>2</b>; mandato de <b>2 anos</b>, com recondução; recursos na LOA por <b>4 anos</b>; Lei 13.303 se receita bruta acima de <b>R$ 90 milhões</b>. A banca troca algum desses números.", "Estruturação: é feita <b>preferencialmente</b> pela PARS, não de forma exclusiva nem obrigatória. A banca diz que só a PARS pode estruturar ou que a contratação de outra estruturadora é proibida.", "CGPE: presidido pelo <b>Secretário do Governo</b>, com Finanças, Administração e TI, presidente do IPPUC e um membro de livre escolha do Prefeito (5 membros). A banca põe o Prefeito ou o Procurador-Geral na presidência, ou o presidente da PARS como membro.", "Concessões e PPP (incisos I e II do art. 6º, § 1º) <b>devem</b> ir ao CGPE <b>antes dos estudos</b>. A banca diz que a submissão é facultativa ou que ocorre depois da estruturação. Já a audiência pública é obrigatória <b>só quando a legislação da modalidade exigir</b>.", "Art. 23 da Lei 16.763: concessões e PPP ficam <b>fora dos limites do art. 124 e seguintes da Lei 14.133</b> (alteração de objeto e valor). A banca estende a regra a todos os contratos do PMPE ou diz que se aplicam os limites de 25% e 50%.", "Licenças das parcerias: tramitação <b>prioritária</b> com prazo máximo, mas <b>sem licença tácita</b>. A banca afirma que o silêncio implica deferimento.", "Fundo de Aportes e Garantias: <b>sem personalidade jurídica</b> (entidade contábil); aporte de imóveis exige <b>autorização legislativa</b>; fiança <b>sem benefício de ordem</b>. A banca diz que é autarquia, tem CNPJ próprio ou que o aporte de bens dispensa lei.", "Decreto 1.067/2016 é o regulamento da <b>Lei 13.019 (OSC)</b>, não da PPP nem da PMI. A banca o descreve como regulamento da Lei 11.079.", "Termos: <b>colaboração</b> (iniciativa da Administração, com recursos), <b>fomento</b> (iniciativa da OSC, com recursos), <b>acordo de cooperação</b> (sem recursos). A banca inverte as iniciativas ou diz que o acordo de cooperação transfere recursos.", "Prazos e números do decreto: aviso do edital <b>30 dias</b>; PMIS <b>60 dias por ano</b>; plano de trabalho <b>15 dias</b>; recurso <b>5 dias</b>; comissão com <b>3 efetivos</b>; OSC com <b>1 ano</b> de CNPJ; rescisão com aviso de <b>60 dias</b>; aditivo até <b>30%</b>; saldo em <b>30 dias</b>; suspensão até <b>2 anos</b>; prescrição de <b>5 anos</b>.", "Competência: pode delegar, <b>mas não subdelegar</b>; suspensão temporária e inidoneidade <b>não são delegáveis</b>. A banca diz que tudo é delegável ou que a subdelegação é livre.", "Chamamento: é a <b>regra</b>, com dispensa e inexigibilidade <b>justificadas e publicadas na mesma data, sob pena de nulidade</b>. A banca diz que a homologação gera direito à celebração ou que o chamamento é dispensado em qualquer parceria sem recursos (só o acordo de cooperação sem comodato ou doação)."]}, {"materia": "DIREITO CIVIL", "titulo": "Obrigações e contratos: teoria geral, espécies do Código Civil e atos unilaterais", "key": "CIV", "nome": "Civil", "conc": ["Edital: item 2 de Direito Civil (obrigações e contratos). Li <b>literalmente no Planalto</b> (Código Civil compilado) os <b>arts. 233 a 420</b> (obrigações), <b>421 a 504</b> (contratos em geral e início da compra e venda), <b>538 a 564</b> (doação), <b>653 a 692</b> (mandato), <b>818 a 850</b> (fiança e transação) e <b>854 a 886</b> (atos unilaterais). <b>Não li</b> os arts. 505 a 537 (cláusulas especiais da compra e venda: retrovenda, venda a contento, preempção, reserva de domínio), nem os demais contratos típicos fora dos trechos citados. Súmulas, jurisprudência e a Lei 14.905/2024 em detalhe aparecem <b>de memória</b>, sinalizadas no texto.", "<b>Modalidades das obrigações.</b> <b>Dar coisa certa</b> (arts. 233 a 242): o acessório segue o principal; perda sem culpa do devedor resolve a obrigação, com culpa, equivale ao valor mais perdas e danos; deterioração dá ao credor a escolha entre aceitar a coisa com abatimento ou resolver. <b>Coisa incerta</b> (243 a 246): indicada ao menos pelo gênero e quantidade; antes da escolha o devedor não pode alegar perda (<i>genus nunquam perit</i>). <b>Fazer</b> (247 a 249): infungível, o devedor que recusa responde por perdas e danos; fungível, o credor pode mandar executar à custa do devedor, e em caso de urgência, <b>sem autorização judicial</b>. <b>Não fazer</b> (250 e 251). <b>Alternativas</b> (252 a 256): a escolha cabe, em regra, ao <b>devedor</b>. <b>Divisíveis e indivisíveis</b> (257 a 263).", "<b>Solidariedade (arts. 264 a 285).</b> <b>Não se presume</b>: resulta da lei ou da vontade das partes. O credor pode exigir a dívida toda de um, de alguns ou de todos os devedores; o pagamento parcial não exonera os demais pelo restante. Se a prestação se impossibilita por culpa de um, todos respondem pelo <b>equivalente</b>, mas só o culpado responde por <b>perdas e danos</b>; os <b>juros de mora</b> só atingem o culpado. Quem paga tem <b>regresso</b> pelas quotas iguais, e a parte do insolvente se rateia entre os demais. A <b>renúncia</b> à solidariedade pode ser em favor de um ou de todos.", "<b>Transmissão.</b> <b>Cessão de crédito</b> (286 a 298): independe de anuência do devedor, mas só tem <b>eficácia perante ele</b> depois de <b>notificado</b>; o cedente, salvo estipulação, responde pela <b>existência</b> do crédito ao tempo da cessão, mas <b>não pela solvência</b> do devedor. <b>Assunção de dívida</b> (299 a 303): exige <b>consentimento expresso do credor</b>; o silêncio, na assunção por terceiro, é interpretado como <b>recusa</b> após o prazo de 30 dias.", "<b>Adimplemento e extinção.</b> Pagamento (304 a 333): pode pagar o terceiro interessado (sub-roga-se) e o não interessado em nome do devedor; vale o pagamento ao <b>credor putativo</b> de boa-fé; o credor não é obrigado a receber coisa diversa; dívida em dinheiro paga-se em moeda corrente, e a <b>revisão judicial</b> é admitida em caso de desproporção manifesta (art. 317); a quitação da última parcela faz presumir as anteriores; as dívidas são em regra <b>quesíveis</b> (pagas no domicílio do devedor). Seguem consignação em pagamento (334 a 345), sub-rogação (346 a 351), imputação (352 a 355), <b>dação em pagamento</b> (356 a 359), <b>novação</b> (360 a 367), <b>compensação</b> (368 a 380), confusão (381 a 384) e remissão (385 a 388).", "<b>Inadimplemento (arts. 389 a 420).</b> O descumprimento gera perdas e danos, juros, correção monetária e honorários (art. 389). Há <b>mora</b> quando o devedor não paga no tempo, lugar e forma devidos, e <b>não há mora sem culpa</b> (art. 396). A mora é <i>ex re</i> quando a obrigação é positiva e líquida e tem termo certo, e na responsabilidade por ato ilícito conta-se do ato; nos demais casos exige interpelação. O devedor em mora responde pela impossibilidade mesmo por caso fortuito, salvo prova de ausência de culpa ou de que o dano ocorreria de qualquer modo. As perdas e danos abrangem <b>danos emergentes e lucros cessantes</b> e só incluem os prejuízos efetivos, <b>direto e imediato</b> (arts. 402 e 403). Os juros legais seguem a taxa Selic deduzido o IPCA (redação da Lei 14.905/2024, <b>de memória</b> quanto ao detalhe). <b>Cláusula penal</b> (408 a 416): não pode exceder o valor da obrigação principal e o juiz deve reduzi-la equitativamente se excessiva ou cumprida em parte; o credor não precisa provar prejuízo, e a indenização suplementar só cabe se convencionada. <b>Arras</b> (417 a 420): confirmatórias (art. 418) e penitenciais (art. 420, direito de arrependimento sem indenização suplementar).", "<b>Teoria geral dos contratos.</b> A liberdade contratual é exercida <b>nos limites da função social do contrato</b> (art. 421) e prevalecem a <b>intervenção mínima</b> e a excepcionalidade da revisão nas relações privadas (art. 421, parágrafo único, Lei 13.874/2019). Os contratos civis e empresariais <b>presumem-se paritários e simétricos</b> até prova em contrário (art. 421-A), respeitada a alocação de riscos. <b>Boa-fé objetiva</b> (art. 422): probidade e boa-fé na conclusão e na execução. Contratos de adesão: cláusulas ambíguas interpretam-se a favor do aderente (art. 423) e é nula a renúncia antecipada a direito resultante da natureza do negócio (art. 424). É lícito o contrato <b>atípico</b> (art. 425). <b>Não pode ser objeto de contrato a herança de pessoa viva</b> (art. 426).", "<b>Formação.</b> A proposta obriga o proponente (art. 427), mas deixa de ser obrigatória nos casos do art. 428: sem prazo a presente, se não imediatamente aceita (inclusive telefone); sem prazo a ausente, se decorrido tempo suficiente; com prazo, se a resposta não foi expedida no prazo; e se a retratação chega antes ou junto. A aceitação fora do prazo ou com modificações é <b>nova proposta</b> (art. 431). Entre ausentes o contrato se aperfeiçoa com a <b>expedição</b> da aceitação (art. 434), salvo retratação, promessa de esperar ou resposta fora do prazo. Reputa-se celebrado no lugar em que foi <b>proposto</b> (art. 435). <b>Estipulação em favor de terceiro</b> (436 a 438), <b>promessa de fato de terceiro</b> (439 e 440), <b>contrato preliminar</b> (462 a 466: requisitos do definitivo, exceto a forma, e execução específica se não houver arrependimento) e <b>contrato com pessoa a declarar</b> (467 a 471: indicação em 5 dias).", "<b>Vícios redibitórios e evicção.</b> Vício oculto torna a coisa imprópria ao uso ou diminui seu valor, em contrato <b>comutativo</b> (e doação onerosa): ações <b>redibitória</b> (resolução) ou <b>quanti minoris</b> (abatimento) (arts. 441 e 442). Alienante que sabia restitui com perdas e danos; o que não sabia, só o valor mais despesas do contrato. Prazos decadenciais (art. 445): <b>30 dias</b> (móvel) e <b>1 ano</b> (imóvel) da entrega efetiva, <b>metade</b> se já estava na posse; vício só conhecível mais tarde: do conhecimento, até <b>180 dias</b> (móvel) e <b>1 ano</b> (imóvel). <b>Evicção</b> (447 a 457): garantia nos contratos onerosos, inclusive em hasta pública; pode ser reforçada, diminuída ou excluída por cláusula expressa, mas, mesmo excluída, o evicto recebe o preço se não soube do risco; <b>não pode demandar</b> quem sabia que a coisa era alheia ou litigiosa (art. 457). <b>Contratos aleatórios</b> (458 a 461).", "<b>Extinção do contrato.</b> <b>Distrato</b> pela mesma forma do contrato (art. 472). <b>Resilição unilateral</b> por denúncia notificada; se uma parte fez investimentos consideráveis, só produz efeito após prazo compatível (art. 473). <b>Cláusula resolutiva expressa</b> opera de pleno direito; a <b>tácita</b> exige interpelação judicial (art. 474). A parte lesada pode pedir resolução ou exigir o cumprimento, sempre com perdas e danos (art. 475). <b>Exceção de contrato não cumprido</b> (476) e <b>exceção de inseguridade</b> (477). <b>Onerosidade excessiva</b> (478 a 480): contratos de execução continuada ou diferida, prestação excessivamente onerosa <b>com extrema vantagem para a outra</b>, por fato extraordinário e imprevisível; o devedor pede a <b>resolução</b> e os efeitos <b>retroagem à data da citação</b>; o réu pode evitá-la modificando equitativamente as condições.", "<b>Compra e venda (arts. 481 a 504, lidos).</b> Transfere-se o <b>domínio</b> mediante pagamento do preço em dinheiro; a venda pura é obrigatória e perfeita quando as partes acordam no objeto e no preço (art. 482), mas o domínio só se transfere com a tradição ou registro. Preço: fixação por terceiro, taxa de mercado ou índices objetivos; é <b>nulo</b> o contrato com preço deixado ao arbítrio exclusivo de uma das partes (art. 489). Despesas de escritura e registro são do <b>comprador</b>; as da tradição são do <b>vendedor</b> (art. 490). Até a tradição, os riscos da coisa correm por conta do vendedor e os do preço por conta do comprador (art. 492). Venda de <b>ascendente a descendente</b> é <b>anulável</b> sem consentimento expresso dos demais descendentes e do cônjuge (art. 496). São <b>nulas</b> as compras por tutores, curadores, testamenteiros e administradores (bens sob sua guarda), por <b>servidores públicos em geral</b> (bens ou direitos da pessoa jurídica a que servirem), por juízes e auxiliares da Justiça (bens em litígio no lugar onde servirem) e por leiloeiros (art. 497), vedação que se estende à cessão de crédito. Venda de imóvel por extensão: diferença de até <b>1/20</b> presume-se enunciativa; a decadência é de <b>1 ano</b> do registro (arts. 500 e 501). Preferência do condômino em coisa indivisível, <b>tanto por tanto</b>: decadência de <b>180 dias</b> (art. 504).", "<b>Doação (arts. 538 a 564).</b> Contrato por liberalidade, por escritura pública ou instrumento particular; a verbal vale para bens móveis de pequeno valor seguidos de tradição (art. 541). Aceitação: o silêncio dentro do prazo fixado vale como aceite se a doação não tem encargo (art. 539); dispensa-se para o absolutamente incapaz em doação pura (art. 543). Doação de ascendente a descendente ou entre cônjuges é <b>adiantamento de legítima</b> (art. 544). É <b>nula</b> a doação de todos os bens sem reserva de renda para a subsistência (art. 548) e na parte que exceder o que o doador poderia dispor em testamento (<b>inoficiosa</b>, art. 549). O doador não responde por evicção nem por vício redibitório, salvo doação para casamento (art. 552). Doação a entidade futura caduca se ela não se constituir em <b>2 anos</b> (art. 554). <b>Revogação</b> por <b>ingratidão</b> ou inexecução do encargo (art. 555); a renúncia antecipada ao direito de revogar é vedada (art. 556); hipóteses do art. 557 (atentado contra a vida, ofensa física, injúria ou calúnia graves, recusa de alimentos); ação em <b>1 ano</b> (art. 559); o direito <b>não se transmite</b> aos herdeiros, que podem prosseguir na ação já iniciada (art. 560). <b>Não se revogam</b> por ingratidão as doações puramente remuneratórias, as com encargo já cumprido, as em cumprimento de obrigação natural e as feitas para determinado casamento (art. 564).", "<b>Mandato (arts. 653 a 692).</b> A procuração é o instrumento; <b>mandato</b> é o contrato. Pode ser expresso ou tácito, verbal ou escrito, mas segue a forma exigida para o ato (art. 657). Presume-se <b>gratuito</b> se não houver retribuição, exceto se o objeto for de ofício ou profissão lucrativa do mandatário (art. 658). Mandato em termos gerais só dá poderes de <b>administração</b>; alienar, hipotecar e transigir exigem <b>poderes especiais e expressos</b>, e o poder de transigir não importa o de firmar compromisso arbitral (art. 661). Atos sem poderes são <b>ineficazes</b>, salvo ratificação, que retroage (art. 662). O maior de 16 e menor de 18 pode ser mandatário (art. 666). O mandatário responde pelo substabelecimento sem autorização e deve prestar contas (arts. 667 e 668). O mandante paga as despesas e a remuneração e responde pelos atos praticados nos limites do mandato (675 a 681). <b>Extinção</b> (art. 682): revogação, renúncia, morte ou interdição, mudança de estado e conclusão ou prazo. A cláusula <b>em causa própria</b> torna o mandato irrevogável e não se extingue pela morte (art. 685). A revogação notificada só ao mandatário <b>não se opõe a terceiros de boa-fé</b> (art. 686). O mandato judicial rege-se pela lei processual (art. 692).", "<b>Fiança (arts. 818 a 839).</b> Garantia pessoal; dá-se <b>por escrito</b> e <b>não admite interpretação extensiva</b> (art. 819); pode ser dada sem consentimento do devedor (art. 820) e para dívidas futuras (art. 821). Não é possível fiança de obrigação nula, salvo se a nulidade decorre apenas da incapacidade pessoal do devedor, exceto mútuo a menor (art. 824). <b>Benefício de ordem</b> (art. 827), perdido se renunciado, se o fiador é principal pagador ou devedor solidário, ou se o devedor é insolvente ou falido (art. 828). Vários fiadores: solidariedade, salvo benefício de divisão (art. 829). O fiador que paga se <b>sub-roga</b> (art. 831). <b>Exoneração</b> da fiança sem limite de tempo: o fiador permanece obrigado por <b>60 dias</b> após notificar o credor (art. 835). A obrigação passa aos herdeiros, limitada ao tempo até a morte e às forças da herança (art. 836). O fiador fica desobrigado se o credor concede moratória sem seu consentimento, se por fato do credor se torna impossível a sub-rogação, ou se o credor aceita objeto diverso em pagamento (art. 838). Súmulas do STJ sobre fiança (<b>de memória</b>) são tema frequente: conferir antes da prova.", "<b>Transação (arts. 840 a 850).</b> Prevenir ou terminar litígio por <b>concessões mútuas</b>, só sobre <b>direitos patrimoniais de caráter privado</b> (arts. 840 e 841). Forma: escritura pública se a lei exige, instrumento particular se admite, ou termo nos autos homologado se o direito está em juízo (art. 842). <b>Interpreta-se restritivamente</b> e tem efeito <b>declaratório</b> (art. 843). Só aproveita e prejudica quem nela interveio, com as consequências do art. 844 para fiador e solidários. Não extingue a ação penal pública (art. 846), admite pena convencional (art. 847), e a nulidade de uma cláusula contamina o todo, salvo direitos independentes (art. 848). Só se anula por <b>dolo, coação ou erro essencial quanto à pessoa ou coisa controversa</b>, e <b>não por erro de direito</b> (art. 849). É nula a transação sobre litígio já decidido por sentença transitada se uma parte não sabia (art. 850).", "<b>Atos unilaterais (arts. 854 a 886).</b> <b>Promessa de recompensa</b> (854 a 860): quem anuncia publicamente recompensa se obriga a cumprir; pode ser revogada com a mesma publicidade antes de cumprida a condição, salvo prazo assinado; nos concursos é essencial fixar <b>prazo</b>. <b>Gestão de negócios</b> (861 a 875): intervenção sem autorização; o gestor dirige segundo o interesse e a vontade presumível do dono e responde pela culpa; se a gestão foi contra a vontade do dono responde até pelo caso fortuito; se útil, o dono reembolsa as despesas necessárias e úteis. <b>Pagamento indevido</b> (876 a 883): quem recebeu o que não era devido deve restituir; quem pagou voluntariamente deve provar o <b>erro</b> (art. 877); não se repete o pago para solver dívida prescrita ou obrigação judicialmente inexigível (art. 882) nem o dado para fim ilícito (art. 883). <b>Enriquecimento sem causa</b> (884 a 886): restituição com atualização monetária; tem <b>caráter subsidiário</b> e não cabe se a lei confere outros meios para o ressarcimento (art. 886)."], "pega": ["Solidariedade <b>não se presume</b>: vem da lei ou do contrato. A banca diz que se presume nas obrigações de várias pessoas ou nas dívidas comerciais.", "Impossibilidade por culpa de um devedor solidário: <b>todos</b> respondem pelo equivalente, mas só o <b>culpado</b> por perdas e danos e juros de mora. A banca faz todos responderem por tudo.", "Cessão de crédito não exige anuência do devedor, mas só tem eficácia perante ele <b>depois da notificação</b>. O cedente, salvo estipulação, <b>não responde pela solvência</b>. Já na assunção de dívida, o silêncio do credor vale como <b>recusa</b>. A banca troca as duas regras.", "<b>Não há mora sem culpa</b> (art. 396), mas na mora <i>ex re</i> o devedor responde mesmo por caso fortuito. A banca esquece a exigência de culpa ou diz que toda mora exige interpelação.", "Cláusula penal: <b>não pode exceder o valor da obrigação principal</b>; o juiz <b>reduz</b> se for excessiva; a indenização suplementar só se convencionada. A banca diz que pode ultrapassar ou que o credor só recebe se provar o prejuízo.", "Função social e boa-fé: o art. 421 (alterado em 2019) fala em liberdade contratual exercida <b>nos limites</b> da função social; boa-fé do art. 422 vale na <b>conclusão e na execução</b>. A banca diz que a função social foi revogada ou que a boa-fé só vale na execução.", "Contrato com <b>herança de pessoa viva</b> é vedado (art. 426). A banca admite se o autor da herança consentir.", "Contrato entre ausentes: aperfeiçoa-se com a <b>expedição</b> da aceitação (teoria da expedição), e o lugar é o da <b>proposta</b>. A banca diz recebimento ou conhecimento.", "Vícios redibitórios: <b>30 dias</b> (móvel) e <b>1 ano</b> (imóvel) da <b>entrega efetiva</b>; metade se já estava na posse; vício tardio: até 180 dias (móvel) e 1 ano (imóvel). A banca inverte ou chama o prazo de prescricional (é <b>decadencial</b>).", "Evicção: a cláusula de exclusão <b>não</b> afasta a devolução do preço se o evicto não soube do risco; <b>não pode demandar</b> quem sabia que a coisa era alheia ou litigiosa. A banca diz que a exclusão afasta tudo.", "Onerosidade excessiva (art. 478): exige fato <b>extraordinário e imprevisível</b> e <b>extrema vantagem</b> para a outra parte; efeitos <b>retroagem à citação</b>. A banca dispensa um dos requisitos ou diz que a sentença só vale daí em diante.", "Compra e venda: despesas de <b>escritura e registro</b> do comprador; da <b>tradição</b> do vendedor. Preço deixado ao <b>arbítrio exclusivo</b> de uma parte: <b>nulo</b>. A banca inverte as despesas ou admite o arbítrio de uma parte.", "Venda de ascendente a descendente é <b>anulável</b> (não nula) sem consentimento dos demais descendentes e do cônjuge. Já a compra por <b>servidor público de bens da pessoa jurídica a que serve</b> é <b>nula</b> (art. 497). A banca troca nulidade por anulabilidade.", "Doação: <b>nula</b> se de todos os bens sem reserva de renda (art. 548) e inoficiosa (art. 549); doador <b>não responde</b> por evicção nem vício redibitório (art. 552); revogação por ingratidão em <b>1 ano</b>, e <b>não passa aos herdeiros</b> do doador. A banca diz que a ação é transmissível ou que as doações remuneratórias se revogam por ingratidão.", "Mandato: poderes gerais só de administração; <b>alienar e transigir</b> exigem poderes <b>especiais e expressos</b>; mandato <b>presume-se gratuito</b> salvo ofício; ato sem poderes é <b>ineficaz</b>, não nulo. A banca diz que o mandato geral abrange a alienação.", "Fiança: <b>por escrito</b>, <b>sem interpretação extensiva</b>; benefício de ordem perdido na renúncia, solidariedade e insolvência; exoneração da fiança sem prazo com <b>60 dias</b> após a notificação. A banca diz 30 ou 90 dias, ou que admite interpretação extensiva.", "Transação: só <b>direitos patrimoniais privados</b>, interpretação <b>restritiva</b>, anula-se por dolo, coação ou <b>erro essencial sobre a pessoa ou coisa</b>, e <b>não por erro de direito</b>. A banca inclui o erro de direito ou diz que a transação transmite direitos.", "Enriquecimento sem causa é <b>subsidiário</b> (art. 886). A banca diz que cabe mesmo havendo outra ação. No pagamento indevido, o <b>ônus de provar o erro</b> é de quem pagou voluntariamente, e a dívida prescrita <b>não se repete</b>."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Direito Financeiro e orçamento: Lei 4.320/1964, PPA, LDO, LOA, créditos adicionais e execução (CF, arts. 165 a 169)", "key": "TRI", "nome": "Tributário", "conc": ["Edital: item 14 (Direito Financeiro e Orçamento Público). Li <b>na íntegra e literalmente</b>, no Planalto, a <b>Lei 4.320/1964</b> (texto compilado, inclusive o art. 39-A acrescentado pela LC 208/2024) e os <b>arts. 165 a 169 da Constituição</b> (compilada, com as Emendas 100, 102, 105, 109, 126, 135 e 136). <b>Não li</b> nesta rodada a Lei de Responsabilidade Fiscal (LC 101/2000), a Lei Orgânica, o PPA, a LDO e a LOA de Curitiba, os arts. 163, 164 e 70 a 75 da CF nem as resoluções do Senado sobre dívida. Tudo que se diz sobre crédito público, dívida pública, LRF, súmulas e jurisprudência vem <b>de memória</b> e está sinalizado.", "<b>Direito Financeiro e competência.</b> A Lei 4.320 estatui <b>normas gerais de direito financeiro</b> para elaboração e controle dos orçamentos e balanços da União, Estados, Municípios e DF (art. 1º). Foi <b>recebida pela Constituição</b> com status de lei complementar quanto à matéria do art. 165, § 9º (doutrina e STF, <b>de memória</b>). A CF (art. 165, § 9º) reserva à <b>lei complementar</b> dispor sobre exercício financeiro, vigência, prazos, elaboração e organização do PPA, da LDO e da LOA e estabelecer normas de gestão financeira e patrimonial e condições para fundos.", "<b>Princípios orçamentários.</b> A Lei do Orçamento obedece aos princípios de <b>unidade, universalidade e anualidade</b> (art. 2º): compreende <b>todas</b> as receitas, inclusive operações de crédito autorizadas (art. 3º), e todas as despesas dos órgãos da administração centralizada (art. 4º). <b>Especificação</b>: não há dotações globais para atender a despesas indiferentes (art. 5º), e a despesa se discrimina no mínimo por <b>elementos</b> (art. 15). <b>Orçamento bruto</b>: receitas e despesas constam pelos totais, vedadas deduções (art. 6º). <b>Exclusividade</b> (CF, art. 165, § 8º): a LOA não conterá dispositivo estranho à previsão da receita e à fixação da despesa, mas pode autorizar a abertura de créditos suplementares e operações de crédito, <b>inclusive por antecipação de receita (ARO)</b>. <b>Legalidade e vedações</b> (CF, art. 167): é vedado iniciar programas ou projetos não incluídos na LOA, realizar despesas que excedam os créditos, abrir crédito sem autorização legislativa e sem indicação de recursos, conceder créditos ilimitados e <b>vincular receita de impostos</b> a órgão, fundo ou despesa (<b>não afetação</b>), com as exceções constitucionais (saúde, ensino, administração tributária, garantias à ARO, repartições do art. 158 e 159 e débitos com a União).", "<b>PPA, LDO e LOA (CF, art. 165).</b> São leis de iniciativa do <b>Poder Executivo</b>. O <b>PPA</b> estabelece, de forma regionalizada, as <b>diretrizes, objetivos e metas</b> da administração para as <b>despesas de capital</b> e outras delas decorrentes e para os <b>programas de duração continuada</b> (§ 1º). A <b>LDO</b> compreende as metas e prioridades, estabelece as diretrizes de política fiscal e as metas, em consonância com a <b>trajetória sustentável da dívida pública</b> (EC 109/2021), orienta a elaboração da LOA, dispõe sobre as <b>alterações na legislação tributária</b> e estabelece a política das <b>agências financeiras oficiais de fomento</b> (§ 2º). A <b>LOA</b> compreende o orçamento <b>fiscal</b>, o de <b>investimento das estatais</b> (maioria do capital com voto) e o da <b>seguridade social</b> (§ 5º), acompanhado de <b>demonstrativo regionalizado</b> do efeito das renúncias (§ 6º). Nenhum <b>investimento que ultrapasse um exercício</b> pode ser iniciado sem prévia inclusão no PPA ou lei que autorize a inclusão, sob pena de <b>crime de responsabilidade</b> (art. 167, § 1º). O Executivo tem o <b>dever de executar</b> as programações orçamentárias (art. 165, § 10), com exceções (§ 11). Emendas parlamentares só são aprovadas se compatíveis com PPA e LDO e se indicarem recursos de anulação de despesa, excluídas pessoal, serviço da dívida e transferências constitucionais (art. 166, § 3º).", "<b>Exercício financeiro, receita e despesa (Lei 4.320).</b> O exercício coincide com o <b>ano civil</b> (art. 34); pertencem a ele as <b>receitas nele arrecadadas</b> e as <b>despesas nele legalmente empenhadas</b> (art. 35). <b>Receitas</b>: correntes e de capital (art. 11, redação do DL 1.939/1982); <b>tributo</b> é receita derivada instituída pelos entes (art. 9º). Receita de capital: operações de crédito, alienação de bens, amortização de empréstimos e transferências de capital. <b>Despesas</b> (art. 12): correntes (custeio e transferências correntes) e de capital (<b>investimentos, inversões financeiras e transferências de capital</b>). <b>Subvenções</b> (art. 12, § 3º): <b>sociais</b> (instituições assistenciais ou culturais sem fins lucrativos) e <b>econômicas</b> (empresas industriais, comerciais, agrícolas ou pastoris). A LOA não consigna ajuda financeira a empresa com fins lucrativos, salvo subvenção autorizada em lei especial (art. 19), nem auxílio para investimentos que se incorporem ao patrimônio de empresas privadas de fins lucrativos (art. 21).", "<b>Créditos adicionais (arts. 40 a 46).</b> São autorizações de despesa não computadas ou insuficientemente dotadas na LOA. <b>Suplementares</b>: reforço de dotação. <b>Especiais</b>: despesa sem dotação específica. <b>Extraordinários</b>: despesas <b>urgentes e imprevistas</b>, em caso de guerra, comoção interna ou calamidade pública. Suplementares e especiais são <b>autorizados por lei e abertos por decreto</b> (art. 42); os extraordi
