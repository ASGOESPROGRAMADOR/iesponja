iterativa, quando o procurador atesta <b>remota chance de êxito</b> ou quando o ato agravaria o ônus da Administração. O art. 6º cuida do Município <b>devedor</b>: chamamento público ou convite com <b>deságio mínimo de 20%</b>, pagamento por RPV ou precatório.", "<b>LC 141/2023, créditos do Município (arts. 7º a 11):</b> o crédito, inscrito ou não em dívida ativa, pode ser parcelado em até <b>120 parcelas</b>. O valor é consolidado com <b>IPCA</b> mais multa e juros, e cada parcela é atualizada pelo IPCA com <b>juros de 1% ao mês</b>. A falta de pagamento de qualquer parcela por mais de <b>60 dias</b> revoga o parcelamento automaticamente, sem notificação. O termo traz <b>confissão irrevogável e irretratável</b>, com efeito de interromper a prescrição e suspender a exigibilidade, renúncia a discutir o débito e pedido de extinção do processo (art. 487, III, c, do CPC). Penhoras e garantias ficam à disposição do juízo até o pagamento. Os acordos <b>não geram novação</b> (art. 8º). O desconto especial é <b>gradual, até 100% dos juros e da multa moratória</b>, para créditos em atraso há mais de 7 anos ou de devedor em recuperação judicial ou falência. Pode-se usar <b>precatório</b> do Município para amortizar a dívida (art. 11).", "<b>LC 141/2023, arts. 12 a 17:</b> admite <b>negócio jurídico processual</b> (art. 190 do CPC). A PGM envia à SMF a previsão anual de receita e de renúncia na LDO, e a SMF é ouvida sobre <b>dotação orçamentária</b> quando houver obrigação financeira. O agente que participa da composição só responde disciplinarmente, inclusive perante o controle interno, se agir com <b>dolo ou fraude para obter vantagem indevida</b>, em processo com contraditório e ampla defesa. A lei vale também para <b>estatais e sociedades de economia mista</b> municipais, que a adaptam. Revogou a LC 68/2008.", "<b>Decreto 1.106/2024 (transações e dispensas):</b> os procuradores da Procuradoria Judicial e da de Recursos Humanos podem transigir em demandas individuais até <b>60 salários mínimos</b>. Acima disso é preciso <b>autorização formal do PGM</b>. A transação é atribuição <b>exclusiva de procurador</b> e só gera penalidade por <b>dolo ou fraude</b>, nunca por mera culpa. Exige <b>cota fundamentada</b> e prévia oitiva da <b>SMF</b> sobre dotação. Na Justiça do Trabalho, quando o Município é <b>subsidiário</b> (Súmula 331 do TST), só há acordo se o devedor principal estiver insolvente.", "<b>Decreto 1.106/2024 (dispensas):</b> pode-se <b>não contestar</b> quando os documentos já comprovam o direito sem necessidade de instrução, em perda de objeto, em ações de saúde com cumprimento voluntário pelos litisconsortes ou prescrição por médico do SUS, e em transferência de pontuação de condutor (art. 257, § 3º, do CTB, com requisitos cumulativos). Nada disso vale com <b>pedido cumulativo de indenização</b>. Pode-se <b>não recorrer</b> contra súmula vinculante, súmulas do STF e do STJ, controle concentrado, repercussão geral, repetitivos, IRDR e IAC. A PGJ dispensa <b>propor ação</b> sem elementos no processo administrativo ou contra jurisprudência consolidada, e pode <b>desistir</b> da execução esgotadas as buscas (Sisbajud, Renajud, Infojud, Receita Jud, Serasajud), com <b>presunção absoluta</b> para valores abaixo do limite de RPV. Dispensa o comparecimento às audiências dos Juizados da Fazenda e a do art. 334 do CPC, com petição de desinteresse.", "<b>Decreto 2.305/2023 (transação na dívida ativa):</b> pedido de transação individual <b>só pelo PROCEC</b>. A decisão do PGM é fundamentada e <b>irrecorrível</b>. Para devedor falido ou em recuperação, o desconto vai até 100% de juros e multa, na ordem do art. 83 da Lei 11.101, e é <b>vedado desconto sobre o principal</b>. A rescisão exige notificação, com <b>30 dias</b> para regularizar ou impugnar. São <b>irrecuperáveis</b>, entre outros, créditos inscritos há mais de <b>15 anos</b>, de pessoa jurídica baixada ou inapta, de pessoa física com indicativo de óbito, com execução arquivada pelo art. 40 da LEF há mais de 3 anos e os do <b>Tema 566 do STJ</b>. Crédito de <b>baixo valor</b> é o de até <b>R$ 10.000</b> por inscrição, com tratamento simplificado, protesto e negativação.", "<b>Decreto 868/2024 (Corregedoria Geral da PGM):</b> é regimento da PGM-CG, que conduz a atividade correcional na Administração Direta, Autárquica e Fundacional. As comissões permanentes são a <b>CPS</b> (sindicância) e a <b>CPP</b> (processo), presididas <b>obrigatoriamente por Procurador do Município estável</b>. A <b>sindicância</b> dura 15 dias, é sigilosa, inquisitorial e <b>sem contraditório</b>. O <b>PAD</b> admite advertência, repreensão, suspensão de até 90 dias, demissão e cassação de aposentadoria. Ficam fora da Corregedoria o PAR da <b>Lei Anticorrupção</b> e a corregedoria da Guarda Municipal.", "<b>Decreto 868/2024 (consensualidade disciplinar):</b> são dois instrumentos. A <b>OAP</b> (oferta de aplicação imediata de pena) cabe para infração punível com advertência, repreensão ou suspensão, exige que o agente <b>assuma a responsabilidade</b> (atenuante) e pode ser proposta até o fim do prazo de alegações finais. O silêncio vale como <b>recusa</b>, e a CPP não fica vinculada à pena ofertada se a OAP fracassar. O <b>TAD</b> (termo de ajustamento disciplinar) vale para conduta de <b>menor potencial ofensivo</b>, sem condenação disciplinar nos últimos <b>2 anos</b> e sem outro TAD vigente. Seu prazo é de <b>6 a 24 meses</b>, suspende o processo e a prescrição, <b>não é publicado</b> e não é penalidade. Se for rescindido, não há reconhecimento de culpa. Em dano de pequeno valor (até <b>R$ 50.000</b>, reajustado) há ressarcimento. Também vale: recurso em <b>30 dias</b>, <b>vedada exoneração a pedido ou aposentadoria voluntária</b> a quem responde a PAD (salvo abandono de cargo, inassiduidade habitual e acúmulo ilegal) e <b>inaplicabilidade do perdão tácito</b>."], "pega": ["<b>Acordo não é novação:</b> a banca diz que o parcelamento por transação novaria a dívida. A LC 141 (art. 8º) afasta a novação do art. 360, I, do Código Civil. A confissão é irrevogável e irretratável.", "<b>Decisão irrecorrível:</b> o pedido de transação é indeferido ou deferido pelo PGM em juízo de conveniência. Não existe recurso administrativo, e a banca costuma inventar um.", "<b>Desconto sobre o principal:</b> o desconto especial incide só em <b>juros de mora e multa moratória</b>, até 100%. Na falência e na recuperação, o Decreto 2.305 <b>veda</b> desconto sobre o principal.", "<b>Parcelamento:</b> até <b>120</b> parcelas (não 60 nem 84). Revogação automática com mais de <b>60 dias</b> de atraso em qualquer parcela. Juros de <b>1% ao mês</b> mais IPCA. Honorários e custas incidem na cobrança judicial e no protesto.", "<b>Responsabilização do agente:</b> a LC 141 (art. 16) e o Decreto 1.106 só punem por <b>dolo ou fraude</b>. A banca troca por culpa grave ou erro grosseiro, que é o parâmetro do art. 28 da LINDB para outro tema.", "<b>60 salários mínimos:</b> é o teto para o procurador transigir sozinho em demanda individual. Acima, o PGM autoriza. Não confundir com o limite de <b>R$ 10.000</b> do crédito de baixo valor e com o de <b>R$ 50.000</b> do dano no TAD.", "<b>Dispensa de contestação:</b> não vale com pedido cumulativo de indenização, e o procurador deve contestar se houver incongruência no valor da causa ou na legitimidade passiva do Município. A dispensa de audiência do art. 334 do CPC exige petição de desinteresse em até 10 dias antes da audiência.", "<b>TAD e OAP:</b> OAP é para infração com pena até suspensão, e o servidor assume a culpa. TAD é para menor potencial ofensivo, não é pena e não pode ser publicado. Lei 15.461 diz que o TAD é instituído por <b>ato do Chefe do Executivo</b>, e o Decreto 868 diz quem o celebra: Corregedor-Geral e presidentes da CPS e da CPP.", "<b>Sindicância:</b> não tem contraditório e é sigilosa, mas o investigado tem <b>direito ao silêncio</b> e acesso à íntegra dos autos, exceto diligências em andamento. Prazo de 15 dias, prorrogável. Quem preside é Procurador estável, e não qualquer servidor efetivo.", "<b>Anticorrupção:</b> o PAR da Lei 12.846/2013 <b>fica fora</b> da Corregedoria da PGM. Já o PAR de licitações do art. 158 da Lei 14.133 <b>entra</b>, com prazos em dias úteis e comissão especial."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Funções Essenciais à Justiça, Advocacia Pública e a PGM de Curitiba", "key": "CON", "nome": "Constitucional", "conc": ["<b>Edital:</b> Ministério Público, Advocacia e Advocacia-Geral da União, Advocacia Pública e Advocacia Pública Municipal, Procuradoria-Geral do Município de Curitiba (prerrogativas, organização, atribuições e autonomia), Lei Orgânica do Município de Curitiba (Lei 5.700/1977) e Lei Municipal 16.200/2023 (plano de carreira dos Procuradores). Os arts. 74 da Lei Orgânica e 2º, 4º, 14, 17 e 22 da Lei 16.200 foram lidos no texto municipal.", "<b>Ministério Público (arts. 127 a 130-A):</b> instituição permanente, essencial à função jurisdicional, defensora da ordem jurídica, do regime democrático e dos interesses sociais e individuais indisponíveis. Princípios: <b>unidade, indivisibilidade e independência funcional</b>. Tem autonomia funcional, administrativa e financeira, e iniciativa de lei para sua organização. O Procurador-Geral da República é nomeado pelo Presidente entre integrantes da carreira maiores de 35 anos, com aprovação do Senado por <b>maioria absoluta</b>, para mandato de <b>2 anos</b>, com recondução. O CNMP fiscaliza a atuação administrativa e financeira.", "<b>Advocacia e Defensoria:</b> o advogado é <b>indispensável à administração da justiça</b> e <b>inviolável</b> por seus atos e manifestações no exercício da profissão, nos limites da lei (art. 133). A Defensoria Pública é instituição permanente, essencial à função jurisdicional, para orientação jurídica e defesa dos necessitados (art. 134), com autonomia funcional e administrativa e iniciativa de proposta orçamentária.", "<b>Advocacia Pública federal e estadual (arts. 131 e 132):</b> a <b>AGU</b> representa a União judicial e extrajudicialmente e exerce consultoria e assessoramento jurídico do Poder Executivo. O Advogado-Geral é de livre nomeação entre cidadãos maiores de 35 anos, de notável saber jurídico e reputação ilibada. Os <b>Procuradores dos Estados e do DF</b> se organizam em carreira, com ingresso por concurso de provas e títulos <b>com participação da OAB em todas as suas fases</b>, e têm estabilidade após 3 anos de efetivo exercício, mediante avaliação de desempenho.", "<b>Advocacia Pública Municipal:</b> o art. 132 não menciona Municípios. Ainda assim, o STF considera os procuradores municipais integrantes da advocacia pública. No <b>Tema 510</b> (RE 663.696), o STF decidiu que o termo <b>“Procuradores”</b> do art. 37, XI, abrange os procuradores municipais, que se submetem ao teto de <b>90,25% do subsídio dos Ministros do STF</b>, e não ao subsídio do Prefeito. O art. 85, § 19, do CPC garante aos advogados públicos os honorários de sucumbência, e o STF considerou isso constitucional (ADI 6.053), sujeito ao teto do art. 37, XI.", "<b>Lei Orgânica de Curitiba, art. 74:</b> a representação judicial, <b>extrajudicial</b>, o assessoramento e a consultoria jurídica do Município cabem aos <b>Procuradores do Município</b>, membros da PGM, instituição <b>essencial à justiça</b>, <b>órgão central do sistema jurídico municipal</b>, diretamente vinculada ao Prefeito, com a função de <b>supervisionar os serviços jurídicos da administração direta e indireta</b> no Executivo (redação da Emenda 24/2024). O § 1º diz que o <b>Procurador-Geral</b> é de <b>livre nomeação do Prefeito</b>, preferencialmente dentre os integrantes da carreira, com tratamento e prerrogativas de <b>Secretário Municipal</b>, e que os demais cargos de direção são <b>privativos de Procuradores</b>.", "<b>Lei Orgânica, art. 74, §§ 2º a 5º:</b> os Procuradores formam <b>carreira própria, típica de Estado</b>, com ingresso por concurso de provas e títulos <b>realizado pela PGM</b>, com participação da <b>OAB em todas as fases</b>. A PGM atua <b>obrigatoriamente no controle interno da legalidade</b> dos atos do Executivo e na defesa dos interesses financeiro-orçamentários. Cabe <b>exclusivamente</b> à PGM a <b>cobrança judicial e extrajudicial da dívida ativa</b>. As atribuições são <b>exclusivas dos procuradores da carreira</b>, vedada a terceiros, servidores ou não. A Lei 15.461/2019 repete a exclusividade no art. 16 da Lei 7.671/91.", "<b>Lei 16.200/2023, natureza e ingresso:</b> a carreira é <b>permanente</b> e essencial à representação judicial e à consultoria jurídica na Administração Direta, Autárquica e Fundacional (art. 2º). O cargo pertence ao <b>Grupo Ocupacional Superior</b> e ao <b>Segmento Jurídico</b>. O concurso tem <b>prova escrita eliminatória</b> (objetiva e/ou discursiva) e <b>prova de títulos classificatória</b> (art. 4º). A comissão organizadora tem procuradores indicados pelo Conselho Superior e representantes da SMAP, e a presidência cabe a servidor efetivo designado pela SMAP. A <b>OAB-PR</b> acompanha todas as fases. O bacharel <b>não inscrito na OAB pode se inscrever</b>, mas a <b>posse</b> depende da inscrição. A jornada é de <b>40 horas</b>. O ingresso se dá pela Parte Permanente, <b>Nível I, referência inicial</b>, e é vedado ingressar por transformação ou transferência.", "<b>Lei 16.200/2023, desenvolvimento na carreira:</b> o <b>Crescimento Horizontal</b> (referência seguinte, mesmo nível) ocorre <b>só em anos pares</b>, com até <b>40%</b> dos procuradores ativos em 30 de junho do ano anterior, e pontuação de <b>80% avaliação funcional e 20% títulos</b>. O <b>Crescimento Vertical por Merecimento</b> (nível seguinte, mesma referência) ocorre <b>só em anos ímpares</b>, com até <b>20%</b> das vagas, e pontuação de <b>80% títulos e 20% avaliação funcional</b>. A instauração é autorizada pelo <b>Chefe do Executivo</b>, com análise da SMF, do Conselho de Gestão e Responsabilidade Fiscal e da LC 101/2017 municipal. Cumprir os requisitos <b>não gera direito subjetivo</b>, e as vagas <b>não acumulam</b>. Aposentados não participam. Até 31/12/2028, o desempenho não compõe a pontuação.", "<b>Lei 16.200/2023, gestão e remuneração:</b> a política de carreira, cargos e remuneração é da <b>SMAP</b>. O <b>Conselho Superior da PGM</b> é presidido pelo Procurador-Geral, composto por procuradores, e tem natureza técnica e de gestão do <b>Fundo Especial da PGM</b>, sem remuneração adicional. A remuneração é o vencimento básico mais gratificação de responsabilidade técnica, adicional por tempo de serviço, <b>prêmio de procurador municipal</b>, natalina e adicional de férias, tudo sob o <b>teto do art. 37, XI</b>. O quantitativo de vagas só muda por <b>lei</b>. O Procurador-Geral é de livre nomeação do Prefeito. Os arts. 35 a 52 da Lei 1.656/58 <b>não se aplicam</b> aos procuradores, e o <b>Estatuto da Advocacia</b> (Lei 8.906/94) é fonte subsidiária."], "pega": ["<b>Prefeito x teto:</b> procurador municipal se submete a 90,25% do subsídio dos Ministros do STF (Tema 510), e não ao subsídio do Prefeito. A banca inverte para o teto do Prefeito, que é o teto geral dos servidores municipais.", "<b>Município no art. 132:</b> o texto constitucional cita só Estados e DF. A banca diz que municípios são obrigados a criar procuradoria. Quem organiza a PGM é a lei local, e a Lei Orgânica de Curitiba é quem a trata como carreira típica de Estado.", "<b>Procurador-Geral:</b> não precisa ser da carreira, é preferencialmente da carreira. A banca troca por obrigatoriamente. Tem prerrogativas de Secretário, mas é cargo de confiança.", "<b>Concurso:</b> o concurso é realizado pela PGM, com a OAB em todas as fases. Comissão com procuradores e SMAP. Bacharel sem inscrição na OAB pode inscrever-se, mas só toma posse inscrito. A banca diz que a inscrição é requisito para se inscrever.", "<b>Anos pares e ímpares:</b> horizontal em ano <b>par</b>, vertical em ano <b>ímpar</b>. Percentuais: 40% e 20%. Pesos: horizontal 80/20 avaliação, vertical 80/20 títulos. É comum inverter.", "<b>Direito subjetivo:</b> a lei afirma que o mero cumprimento dos requisitos <b>não</b> dá direito à movimentação. Sem classificação dentro das vagas, não há avanço, e vagas não acumuladas passam ao ano seguinte.", "<b>Exclusividade:</b> a cobrança da dívida ativa e a representação judicial são exclusivas dos procuradores da carreira, e o §5º do art. 74 veda a terceiros, servidores ou não. Cargos comissionados não podem exercer atribuições típicas.", "<b>MP:</b> unidade, indivisibilidade e independência funcional. Não existe hierarquia funcional, só administrativa. O PGR cumpre mandato de 2 anos, com aprovação por maioria absoluta do Senado.", "<b>Honorários:</b> são direito do advogado público (art. 85, § 19, CPC), mas sob o teto constitucional. A banca diz que ficam fora do teto."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Administração Tributária, Dívida Ativa e Garantias do Crédito", "key": "TRI", "nome": "Tributário", "conc": ["<b>Edital:</b> fiscalização tributária, deveres instrumentais, sigilo fiscal, dívida ativa tributária e não tributária, inscrição, requisitos e presunções da CDA, certidões, garantias e privilégios do crédito, preferências, concurso de credores e fraude à execução fiscal. Base: CTN, Lei 6.830/80 e, no Município, a LC 40/2001, a Lei Orgânica e os Decretos 2.305/2023 e 1.106/2024. A fase de impugnação e recursos fica para a unidade seguinte.", "<b>Fiscalização (CTN, arts. 194 a 200):</b> a legislação tributária vale para todas as pessoas, naturais ou jurídicas, <b>inclusive as imunes e isentas</b>, quanto às obrigações acessórias. Livros e documentos <b>não podem ser negados</b> ao fisco, e devem ser conservados até a prescrição dos créditos (art. 195). A autoridade lavra o <b>termo de início de fiscalização</b>, que afasta a espontaneidade (art. 196 e art. 138, parágrafo único). Terceiros prestam informações, como tabeliães, bancos, corretores, inventariantes e síndicos, salvo fatos protegidos por segredo profissional (art. 197). As Fazendas se prestam <b>assistência mútua</b> (art. 199), e a autoridade pode requisitar <b>força policial</b> (art. 200).", "<b>Sigilo fiscal (CTN, art. 198):</b> é vedada a divulgação, pela Fazenda ou seus servidores, de informação sobre a situação econômica ou financeira do sujeito passivo ou de terceiros e sobre a natureza e o estado de seus negócios. Exceções: <b>requisição judicial</b>, solicitação de autoridade administrativa em processo administrativo instaurado para apurar infração, <b>representações fiscais para fins penais</b>, <b>inscrições na dívida ativa</b> e <b>parcelamento ou moratória</b>. A LC 105/2001 permite ao fisco acessar dados bancários sem ordem judicial, o que o STF validou (ADI 2.859 e RE 601.314, Tema 225).", "<b>Dívida ativa (CTN, arts. 201 a 204):</b> é a dívida tributária <b>regularmente inscrita</b> depois de esgotado o prazo de pagamento fixado em lei ou por decisão final em processo regular. Os juros de mora não excluem a liquidez. O termo de inscrição e a CDA trazem: <b>nome do devedor e dos corresponsáveis</b>, valor e forma de calcular juros, <b>origem, natureza e fundamento legal</b>, atualização monetária, <b>data e número da inscrição</b> e número do processo administrativo ou auto de infração. Omissão ou erro gera <b>nulidade</b>, que pode ser sanada <b>até a decisão de primeira instância</b>, com devolução de prazo de defesa só quanto à parte modificada. A presunção de <b>certeza e liquidez</b> e a <b>prova pré-constituída</b> são <b>relativas</b>, ilidíveis por <b>prova inequívoca</b> do sujeito passivo ou de terceiro.", "<b>Dívida ativa não tributária e Lei 6.830:</b> a LEF (art. 2º) estende a dívida ativa a qualquer valor cuja cobrança a lei atribua à Fazenda, o que inclui multas, foros, indenizações e restituições (art. 39, § 2º, da Lei 4.320/64). Súmulas do STJ: <b>392</b> (a CDA pode ser substituída até a sentença dos embargos, para corrigir erro material ou formal, mas <b>não para mudar o sujeito passivo</b>), <b>558</b> (a inicial não é indeferida por falta de pedido de citação ou de provas) e <b>559</b> (não precisa de demonstrativo de cálculo). O <b>protesto da CDA</b> é constitucional (ADI 5.135). São vedadas <b>sanções políticas</b> para cobrar tributo, como interdição de estabelecimento ou apreensão de mercadorias (Súmulas 70, 323 e 547 do STF).", "<b>Certidões (CTN, arts. 205 a 208):</b> a certidão negativa é expedida em <b>10 dias</b> do requerimento. A <b>positiva com efeitos de negativa</b> (art. 206) vale quando há créditos <b>não vencidos</b>, <b>em cobrança executiva com penhora efetivada</b> ou com <b>exigibilidade suspensa</b>. A prova de quitação é dispensada em caso de <b>urgência</b>, para evitar caducidade de direito ou penalidade (art. 207). O <b>servidor que expedir certidão com dolo ou fraude e erro contra a Fazenda</b> responde <b>pessoalmente pelo crédito e pelos juros</b> (art. 208), sem excluir a responsabilidade criminal e funcional.", "<b>Garantias do crédito (CTN, arts. 183 a 185-A):</b> as garantias do CTN <b>não excluem outras</b> previstas em lei. Respondem <b>todos os bens e rendas</b> do sujeito passivo, inclusive os gravados por ônus real ou cláusula de inalienabilidade, exceto os <b>absolutamente impenhoráveis</b> (art. 184). A <b>fraude à execução fiscal</b> (art. 185) se presume na alienação por devedor com crédito <b>já inscrito em dívida ativa</b>, <b>sem exigir registro da penhora</b> (STJ, REsp 1.141.990, repetitivo), e só se afasta se o devedor reservou bens suficientes. O art. 185-A autoriza a <b>indisponibilidade de bens e direitos</b> do devedor <b>citado</b> que não paga, não indica bens e não tem bens penhoráveis localizados, limitada ao valor da dívida.", "<b>Preferências (CTN, arts. 186 a 193):</b> o crédito tributário prefere a qualquer outro, <b>seja qual for sua natureza ou o tempo de sua constituição</b>, ressalvados os <b>créditos trabalhistas</b> e de <b>acidente de trabalho</b> (art. 186). Na falência, o crédito tributário <b>não prefere</b> aos <b>extraconcursais</b>, às <b>restituições</b> nem aos créditos com <b>garantia real</b> (até o valor do bem), e a <b>multa tributária</b> só prefere aos <b>subordinados</b>. Os trabalhistas ficam à frente até <b>150 salários mínimos</b>, pela Lei 11.101 (art. 83, I). A cobrança judicial <b>não se sujeita a concurso de credores</b> ou habilitação em falência, recuperação, inventário ou arrolamento (art. 187). O concurso entre entes seguia a ordem União, Estados e Distrito Federal, Municípios, mas o STF, na <b>ADPF 357</b>, entendeu que o art. 187 do CTN e o art. 29 da LEF <b>não foram recepcionados</b> e invalidou a Súmula 563. O art. 192 exige prova de quitação para o julgamento da partilha, e o art. 193 exige quitação para contratar com a Administração, salvo autorização legal.", "<b>Curitiba: cobrança e cadastro:</b> a Lei Orgânica (art. 74, § 4º) dá à PGM competência <b>exclusiva</b> para cobrar a dívida ativa, judicial e extrajudicialmente. A LC 40/2001 mantém <b>cadastros imobiliário, de prestadores de serviço e de comércio e indústria</b>, com multa de <b>R$ 250</b> por descumprir prazos ou prestar dados inexatos (dobro na reincidência, triplo na persistência), e permite à Administração <b>inserir, alterar e baixar de ofício</b> inscrições (art. 78-A, LC 146/2025). A <b>baixa</b> do cadastro independe da quitação, sem prejuízo da <b>responsabilidade solidária</b> dos sócios e administradores.", "<b>Curitiba: pagamento (LC 40/2001):</b> atraso gera atualização monetária, <b>multa moratória de 0,33% ao dia, limitada a 10%</b>, e juros. A autoridade pode conceder <b>desconto de até 20%</b> no pagamento integral no prazo ou <b>parcelamento em até 10 cotas</b> de pelo menos R$ 20 (art. 80). O parcelamento é <b>revogado</b> pela falta de qualquer parcela ou de imposto de fato gerador posterior (art. 81). A extinção por <b>compensação</b> (créditos líquidos, certos e vencidos) e por <b>dação em pagamento de imóveis livres de ônus em Curitiba</b> é a juízo da autoridade (art. 82). É <b>vedada a antecipação do IPTU</b> antes do exercício. A <b>unificação ou subdivisão de lote</b> e o <b>cadastro de condomínio</b> exigem quitação total, inclusive de débitos parcelados (as parcelas vincendas vencem antecipadamente), com certidão negativa.", "<b>Curitiba: dívida ativa e recuperação do crédito:</b> pela LC 141, o crédito, inscrito ou não, pode ser parcelado em <b>120 vezes</b>, com desconto gradual de até 100% em juros e multa em atrasos de mais de 7 anos. O Decreto 2.305/2023 permite <b>extinguir execuções fiscais</b> de crédito <b>irrecuperável</b> (mais de 15 anos de inscrição, devedor baixado ou inapto, falência encerrada, pessoa física com óbito, execução arquivada há mais de 3 anos, ISS fixo sem citação em 5 anos, Tema 566 do STJ). Débitos até <b>R$ 10.000</b> recebem tratamento simplificado, com <b>protesto</b> e inscrição em cadastros de proteção ao crédito. Priorizam-se execuções com penhora ou depósito sem embargos e as de grandes devedores."], "pega": ["<b>Presunção:</b> a da CDA é <b>relativa</b>, e não absoluta. Cabe prova inequívoca do sujeito passivo <b>ou de terceiro a quem aproveite</b>. A banca troca por presunção absoluta.", "<b>Substituição da CDA:</b> vai até a decisão de primeira instância (CTN) ou até a sentença dos embargos (Súmula 392 do STJ), só para erro material ou formal. <b>Mudar o sujeito passivo não pode.</b>", "<b>Fraude à execução fiscal:</b> o marco é a <b>inscrição em dívida ativa</b>, e não a citação nem o registro da penhora. A Súmula 375 do STJ é do processo civil comum. A banca mistura as duas.", "<b>Preferência:</b> o crédito tributário só cede ao <b>trabalhista e ao de acidente de trabalho</b>. Na falência, o crédito com garantia real (até o valor do bem) e os extraconcursais vêm antes, e a multa tributária só prefere aos subordinados. A ordem União, Estados, Municípios é afastada pela <b>ADPF 357</b>.", "<b>Certidão positiva com efeito de negativa:</b> são três hipóteses (crédito não vencido, execução com penhora, exigibilidade suspensa). A banca troca por <b>cobrança executiva sem garantia</b>, que não basta.", "<b>Sigilo:</b> a inscrição em dívida ativa e o parcelamento <b>não estão</b> protegidos pelo sigilo. A banca afirma que a divulgação de devedores ativos é ilegal.", "<b>Sanção política:</b> protesto de CDA é válido, mas interdição de estabelecimento, apreensão de mercadoria e proibição de comprar notas fiscais são <b>sanções políticas</b> vedadas pelas Súmulas 70, 323 e 547 do STF.", "<b>Cobrança da dívida:</b> a <b>PGM</b> é exclusiva, e a competência para lançar, arrecadar e fiscalizar é da <b>SMF</b> (Lei 15.461, art. 11). A baixa de cadastro independe da quitação, mas deixa a responsabilidade solidária dos sócios.", "<b>Números de Curitiba:</b> multa de <b>0,33% ao dia até 10%</b>, desconto de <b>até 20%</b>, <b>10</b> parcelas no Código Tributário (LC 40) e <b>120</b> parcelas na transação (LC 141). Baixo valor é <b>R$ 10.000</b>, irrecuperável é <b>15 anos</b>, cadastro com multa de <b>R$ 250</b>."]}, {"materia": "PROCESSO CIVIL", "titulo": "Execução de Título Extrajudicial e Defesas do Executado", "key": "PCV", "nome": "Proc. Civil", "conc": ["<b>Edital:</b> execução e cumprimento de sentença, execução de títulos extrajudiciais e defesas do executado. Aqui a base é o CPC (arts. 771 a 925), com ênfase na execução contra a <b>Fazenda Pública</b> (art. 910) e nas diferenças em relação à execução fiscal. Não há norma municipal específica nesta unidade. O regime de RPV de Curitiba (Lei 10.235/2001) já foi estudado na unidade anterior.", "<b>Título e requisitos:</b> a execução exige título executivo com <b>certeza, liquidez e exigibilidade</b> (art. 783). O rol do <b>art. 784</b> inclui letra de câmbio, nota promissória, duplicata, debênture e cheque, escritura pública ou documento assinado pelo devedor e <b>duas testemunhas</b>, contrato garantido por hipoteca, penhor ou caução, <b>contrato de seguro de vida</b>, crédito de foro e laudêmio, crédito de aluguel e <b>encargos acessórios</b>, <b>certidão de dívida ativa</b> e crédito de contribuição condominial <b>previsto em convenção ou aprovado em assembleia</b>. A propositura de ação sobre o débito <b>não impede</b> a execução (art. 784, § 1º). O credor pode optar pelo processo de conhecimento (art. 785).", "<b>Citação e honorários:</b> o executado é citado para pagar em <b>3 dias</b> (art. 829). Fixam-se honorários de <b>10%</b>, que caem pela metade se o pagamento for integral nesse prazo (art. 827, § 1º). Não pagando, penhoram-se bens e o oficial avalia (art. 829, § 1º). A ordem do <b>art. 835</b> começa por dinheiro. O art. 792 trata da <b>fraude à execução</b>: a alienação é ineficaz perante o exequente, e <b>antes de declará-la o juiz deve intimar o terceiro adquirente</b>, que pode opor <b>embargos de terceiro em 15 dias</b> (§ 4º). A Súmula 375 do STJ exige registro da penhora ou prova de má-fé do terceiro.", "<b>Embargos à execução (arts. 914 a 920):</b> independem de penhora, depósito ou caução. O prazo é de <b>15 dias</b>, contado da <b>juntada do comprovante da citação</b> aos autos (art. 915), e, havendo vários executados, conta-se <b>individualmente</b> (salvo cônjuges, que têm prazo comum). Os embargos não suspendem a execução. O <b>efeito suspensivo</b> depende de <b>requerimento</b>, dos requisitos da tutela provisória e de <b>garantia do juízo</b> (art. 919, § 1º). Matérias (art. 917): inexequibilidade ou inexigibilidade, penhora incorreta ou avaliação errônea, <b>excesso de execução</b>, retenção por benfeitorias, incompetência e qualquer defesa de processo de conhecimento. No excesso, o embargante deve <b>indicar o valor</b>, sob pena de rejeição liminar ou não conhecimento.", "<b>Rejeição, multa e parcelamento:</b> o juiz rejeita liminarmente embargos <b>intempestivos</b>, quando cabível o indeferimento da inicial ou <b>manifestamente protelatórios</b> (art. 918), e nesse caso aplica multa de até <b>20%</b> do valor atualizado da execução (arts. 774 e 918, parágrafo único). O <b>art. 916</b> permite parcelar: no prazo dos embargos, o executado reconhece o débito, deposita <b>30%</b> (com custas e honorários) e paga o resto em até <b>6 parcelas</b> mensais com correção e juros de 1% ao mês. O exequente se manifesta, o pedido não depende de sua concordância, e a falta de pagamento de parcela gera vencimento antecipado e multa de 10%. Esse parcelamento <b>não se aplica ao cumprimento de sentença</b> (art. 916, § 7º).", "<b>Execução contra a Fazenda (art. 910):</b> a Fazenda é citada para opor embargos em <b>30 dias</b> (e não paga em 3 dias nem sofre penhora). Não opostos os embargos ou transitada em julgado a decisão que os rejeitar, expede-se <b>precatório ou RPV</b>, na forma do art. 100 da CF. Nos embargos, a Fazenda pode alegar qualquer matéria de defesa do processo de conhecimento. A <b>Súmula 279 do STJ</b> admite execução de título extrajudicial contra a Fazenda. A remessa necessária <b>não</b> se aplica aos embargos. O STF e o STJ exigem o regime de precatórios para bens públicos, que são impenhoráveis.", "<b>Impenhorabilidade (art. 833 do CPC e Lei 8.009/90):</b> são impenhoráveis bens inalienáveis, móveis de uso doméstico de médio valor, vestuário, <b>salários e proventos</b>, quantia depositada em <b>caderneta de poupança até 40 salários mínimos</b>, instrumentos de trabalho, seguro de vida e a pequena propriedade rural trabalhada pela família. A regra do salário cede para <b>pensão alimentícia</b> e para valores acima de <b>50 salários mínimos mensais</b> (§ 2º e § 3º). O <b>bem de família</b> é protegido, mas a Lei 8.009 (art. 3º) excepciona, entre outros, <b>créditos de condomínio</b> pelo próprio imóvel, de pensão alimentícia e de fiança em locação. A <b>cota condominial</b> é <b>obrigação propter rem</b>, e o adquirente responde pelos débitos anteriores. O STJ permite penhora de <b>vaga de garagem com matrícula própria</b> (Súmula 449), e o bem locado a terceiros, cuja renda mantém a família, é protegido (Súmula 486).", "<b>Defesas fora dos embargos:</b> a <b>exceção de pré-executividade</b> (simples petição) é admitida para matérias de ordem pública e sem dilação probatória (Súmula 393 do STJ). Nulidades da execução e questões sobre penhora ou avaliação podem ser suscitadas por <b>simples petição</b> em 15 dias do ato (art. 803, parágrafo único; art. 917, § 1º). A arrematação pode ser contestada por <b>simples petição</b> em <b>10 dias</b>, aperfeiçoada a arrematação (art. 903, § 2º), e a ação anulatória cabe depois. O executado pode ainda propor <b>ação autônoma</b> de anulação ou declaração de inexistência do débito, e a ação não impede a execução.", "<b>Suspensão e extinção:</b> a execução se suspende no caso do art. 921: quando o executado ou o devedor não é localizado, quando <b>não há bens penhoráveis</b> (suspensão por <b>1 ano</b>, sem prazo prescricional nesse período) e se houver parcelamento. Findo o ano, começa a <b>prescrição intercorrente</b>, que corre pelo prazo da pretensão originária, e o juiz a reconhece de ofício depois de ouvir as partes em 15 dias (art. 921, §§ 1º a 5º). A execução se extingue por pagamento, remissão, renúncia, transação, prescrição intercorrente e outros (art. 924), e a extinção depende de sentença (art. 925).", "<b>Execução fiscal e CPC:</b> a Lei 6.830/80 tem <b>regime próprio</b>: citação em <b>5 dias</b> para pagar ou garantir a execução (art. 8º), embargos em <b>30 dias</b> contados do depósito, da juntada da prova da fiança ou da intimação da penhora (art. 16), e <b>garantia prévia</b> obrigatória para embargar. O CPC é <b>subsidiário</b> (art. 1º da LEF). Nas execuções contra a Fazenda, o prazo e o rito do art. 910 do CPC valem, e não os da LEF, que trata de execução <b>pela</b> Fazenda."], "pega": ["<b>Embargos sem garantia:</b> no CPC, os embargos <b>independem de penhora</b> (art. 914), mas o <b>efeito suspensivo</b> exige garantia. Na execução fiscal, a LEF exige garantia para embargar (art. 16, § 1º). A banca mistura os dois regimes.", "<b>Prazo de 15 dias:</b> começa da <b>juntada do comprovante da citação</b>, não da citação, e é individual para cada executado. Na execução contra a Fazenda o prazo é de <b>30 dias</b> e a Fazenda <b>não paga em 3 dias</b>.", "<b>Efeito suspensivo automático:</b> não existe. A banca diz que os embargos suspendem a execução, o que vale só na LEF antiga e não no CPC atual. É preciso requerimento, tutela provisória e garantia.", "<b>Excesso de execução:</b> o embargante tem de apontar o valor correto e apresentar demonstrativo. Se não o fizer, os embargos são <b>rejeitados liminarmente</b> ou não conhecidos nesse ponto.", "<b>Parcelamento do art. 916:</b> 30% de entrada e <b>6 parcelas</b>. Não depende de aceite do exequente. Não vale no cumprimento de sentença (§ 7º). A banca troca por 40% e 12 parcelas, ou exige concordância do credor.", "<b>Título extrajudicial contra a Fazenda:</b> é cabível (Súmula 279 do STJ), mas o pagamento se faz por precatório ou RPV. Não há penhora de bens públicos, e a decisão que rejeita os embargos faz expedir o requisitório.", "<b>Fraude à execução e fraude contra credores:</b> a primeira é ineficácia declarada <b>nos próprios autos</b>, com intimação prévia do adquirente e 15 dias para embargos de terceiro. A segunda é ação pauliana, com consilium fraudis e eventus damni, e exige anulação.", "<b>Bem de família:</b> é oponível, mas cede para o <b>crédito de condomínio</b> do próprio imóvel (obrigação propter rem). A banca afirma que a impenhorabilidade prevalece sobre o crédito condominial.", "<b>Prescrição intercorrente:</b> suspensão de <b>1 ano</b> por falta de bens, depois começa o prazo da pretensão originária. Reconhecimento de ofício só depois de ouvir as partes em <b>15 dias</b>. A banca troca por prescrição automática."]}], "14": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Licitações: princípios, modalidades e critérios de julgamento (Lei 14.133/2021)", "key": "ADM", "nome": "Administrativo", "conc": ["<b>Edital:</b> Lei 14.133/2021, princípios, modalidades, critérios de julgamento, habilitação e recursos. Os decretos municipais de Curitiba que regulamentam a Lei 14.133 pertencem a outra unidade do plano (ADM 16). Os textos abaixo foram conferidos no <b>texto atualizado da lei</b>, lido no site do Planalto.", "<b>Princípios (art. 5º):</b> a lista tem <b>21</b> itens: legalidade, impessoalidade, moralidade, publicidade, eficiência, interesse público, probidade administrativa, igualdade, planejamento, transparência, eficácia, segregação de funções, motivação, vinculação ao edital, julgamento objetivo, segurança jurídica, razoabilidade, competitividade, proporcionalidade, celeridade, economicidade e desenvolvimento nacional sustentável. Tudo conforme o <b>Decreto-Lei 4.657/42 (LINDB)</b>.", "<b>Fases (art. 17):</b> preparatória, divulgação do edital, apresentação de propostas e lances, <b>julgamento</b>, <b>habilitação</b>, recursal e homologação. A ordem é diferente da Lei 8.666: o julgamento vem <b>antes</b> da habilitação. A <b>inversão</b> (habilitação antes) é possível, desde que motivada e prevista no edital (§ 1º). A forma <b>eletrônica</b> é preferencial; a presencial exige justificativa e gravação em vídeo (§ 2º).", "<b>Modalidades (art. 28):</b> pregão, concorrência, concurso, leilão e <b>diálogo competitivo</b>. Desapareceram <b>tomada de preços e convite</b>. É <b>vedado</b> criar outras modalidades ou combinar as existentes. Credenciamento, pré-qualificação, procedimento de manifestação de interesse e SRP são <b>procedimentos auxiliares</b>, e não modalidades.", "<b>Pregão (arts. 6º, XLI, e 29):</b> é <b>obrigatório</b> para bens e serviços comuns, ou seja, aqueles com padrões de desempenho e qualidade objetivamente definidos no edital. Os critérios são <b>menor preço ou maior desconto</b>. Não se aplica a <b>serviços técnicos especializados de natureza predominantemente intelectual</b> nem a obras e serviços de engenharia, salvo os <b>serviços comuns de engenharia</b> (art. 6º, XXI, “a”).", "<b>Concorrência (art. 6º, XXXVIII):</b> serve para bens e serviços <b>especiais</b> e para obras e serviços comuns e especiais de engenharia. Os critérios de julgamento são os do art. 33 (exceto o maior lance, próprio do leilão). <b>Concurso:</b> escolha de trabalho técnico, científico ou artístico, com prêmio ou remuneração ao vencedor. O critério é a melhor técnica ou conteúdo artístico.", "<b>Leilão (art. 31):</b> alienação de bens imóveis ou móveis inservíveis ou legalmente apreendidos, ao <b>maior lance</b>, igual ou superior à avaliação. O leiloeiro é oficial ou designado por <b>credenciamento</b>, ou por pregão com critério de <b>maior desconto</b> sobre as comissões. Não exige registro cadastral prévio nem habilitação. A homologação ocorre depois de lances, recurso e <b>pagamento</b>.", "<b>Diálogo competitivo (art. 32):</b> serve para objetos de <b>inovação tecnológica ou técnica</b>, ou quando a Administração não consegue definir sozinha a solução. A manifestação de interesse tem prazo mínimo de <b>25 dias úteis</b>, e as propostas finais têm prazo mínimo de <b>60 dias úteis</b> depois do diálogo. A comissão tem <b>no mínimo 3 servidores efetivos</b> ou empregados públicos, e podem ser contratados profissionais para assessoria técnica.", "<b>Critérios de julgamento (art. 33):</b> menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance (no leilão) e maior retorno econômico. No <b>técnica e preço</b>, a ponderação da técnica tem <b>limite de 70%</b> (art. 36). Para serviços técnicos especializados de natureza intelectual acima de <b>R$ 300.000</b>, a regra é melhor técnica ou técnica e preço (art. 37). O <b>maior retorno econômico</b> só serve para o contrato de eficiência (art. 39). A banca de técnica tem ≥ <b>3 membros</b>.", "<b>Publicidade e prazos (arts. 54 e 55):</b> o edital e seus anexos vão ao <b>PNCP</b> (Portal Nacional de Contratações Públicas), e o extrato em diário oficial. Prazos mínimos entre a divulgação e a abertura: <b>bens</b>, 8 dias úteis (menor preço ou maior desconto) e 15 dias úteis nos demais; <b>serviços e obras comuns</b>, 10 dias úteis; <b>serviços e obras especiais</b>, 25 dias úteis; contratação semi-integrada, 35; <b>integrada</b>, 60; maior lance, 15; técnica e preço ou melhor técnica, 35.", "<b>Julgamento (arts. 56, 59 e 60):</b> o modo de disputa pode ser aberto ou fechado. O <b>fechado isolado é vedado</b> quando o critério for menor preço ou maior desconto, e o <b>aberto é vedado</b> em técnica e preço. Serão desclassificadas, entre outras, propostas inexequíveis: em obras e serviços de engenharia, abaixo de <b>75%</b> do valor orçado. Desempate: disputa final, desempenho contratual prévio, <b>equidade de gênero</b> e programa de integridade, nessa ordem.", "<b>Habilitação (arts. 62 a 70):</b> jurídica, técnica, fiscal, social e trabalhista, e econômico-financeira. Os documentos são exigidos <b>só do licitante vencedor</b> (a regularidade fiscal, só do melhor classificado). A exigência de atestado de parcelas de maior relevância limita-se a <b>4%</b> do valor, e as quantidades, a até <b>50%</b>. É vedado exigir <b>faturamento mínimo</b>. Capital ou patrimônio líquido mínimo: até <b>10%</b> do valor estimado. Balanço dos <b>2 últimos exercícios</b>.", "<b>Impugnação e recursos (arts. 164 e 165):</b> qualquer pessoa pode impugnar o edital até <b>3 dias úteis antes</b> da abertura, e a resposta sai em até <b>3 dias úteis</b>. O recurso tem prazo de <b>3 dias úteis</b> em <b>fase única</b>, com intenção de recorrer manifestada imediatamente. A autoridade decide em <b>10 dias úteis</b>. O <b>pedido de reconsideração</b> também tem 3 dias úteis."], "pega": ["<b>Modalidades extintas:</b> a banca cobra tomada de preços e convite como se ainda existissem. Elas acabaram. Cabem apenas pregão, concorrência, concurso, leilão e diálogo competitivo.", "<b>Pregão e engenharia:</b> pregão não serve para obra, mas serve para <b>serviço comum de engenharia</b>. Também não serve para serviço intelectual predominante. A banca mistura as duas hipóteses.", "<b>Ordem das fases:</b> na Lei 14.133 o julgamento antecede a habilitação. A banca cobra a ordem da Lei 8.666 (habilitação primeiro) como regra.", "<b>Credenciamento e SRP:</b> são procedimentos auxiliares, não modalidades. A banca lista como modalidade.", "<b>Prazo do recurso:</b> é de <b>3 dias úteis</b> (não 5 dias úteis, como na Lei 8.666), e a decisão da autoridade é em 10 dias úteis. A impugnação ao edital é de até 3 dias úteis antes da abertura.", "<b>Técnica e preço:</b> o teto de 70% é para a ponderação da técnica, e não para o preço. Não confundir com o limite de 25% de acréscimo em contratos.", "<b>Habilitação de todos:</b> a documentação é exigida do vencedor, e não de todos os licitantes. A banca diz o contrário, como na lei antiga.", "<b>Atestados:</b> o limite de 4% é para parcelas de maior relevância, e o de 50% é para quantidades. Faturamento mínimo é vedado. Capital mínimo e patrimônio líquido mínimo: até 10%.", "<b>Leilão:</b> o critério é maior lance, não maior desconto. O maior desconto é critério para escolher o <b>leiloeiro</b> por pregão. Leilão não exige habilitação.", "<b>Diálogo competitivo:</b> não é para qualquer objeto, e a comissão tem servidores efetivos. A banca troca por servidores comissionados ou por 5 membros."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Administração Pública e servidores na CF: art. 37 a 41 e teto remuneratório", "key": "CON", "nome": "Constitucional", "conc": ["<b>Edital:</b> administração pública e servidores públicos na Constituição Federal, incluindo teto e subteto. Os textos abaixo seguem o texto atual da CF, com as ECs 135/2024 e 138/2025, lido no Planalto.", "<b>Art. 37, caput:</b> princípios expressos <b>LIMPE</b> (legalidade, impessoalidade, moralidade, publicidade e eficiência). Incisos I a III: cargos acessíveis a brasileiros e a estrangeiros na forma da lei; <b>concurso público</b> de provas ou de provas e títulos para cargo e emprego, exceto cargo em comissão de livre nomeação e exoneração; validade de até <b>2 anos, prorrogável uma vez</b> por igual período. Inciso IV: durante o prazo, quem foi aprovado em concurso tem <b>prioridade na convocação</b> sobre os novos concursados.", "<b>Funções de confiança e cargos em comissão (V):</b> as funções de confiança são exercidas <b>exclusivamente por servidores efetivos</b>. Os cargos em comissão são preenchidos por servidores de carreira nos casos, condições e percentuais mínimos previstos em lei, e destinam-se <b>apenas às atribuições de direção, chefia e assessoramento</b>. A <b>SV 13</b> veda o nepotismo nos três Poderes (parentes até o terceiro grau), salvo cargo político.", "<b>Sindicato e greve (VI e VII):</b> a livre associação sindical é garantida ao servidor. O direito de greve é exercido <b>nos termos de lei específica</b>, norma de eficácia limitada. Na omissão, o STF aplica a Lei 7.783/89 (MI 708). No <b>Tema 531</b>, o STF decidiu que a Administração <b>deve descontar</b> os dias de paralisação, ressalvadas a compensação por acordo e a greve provocada por conduta ilícita do próprio Poder Público.", "<b>Pessoas com deficiência e temporários (VIII e IX):</b> a lei reserva percentual dos cargos e empregos públicos às pessoas com deficiência. A <b>contratação temporária</b> exige lei, <b>tempo determinado</b> e <b>necessidade temporária de excepcional interesse público</b>. O STF exige ainda que a necessidade seja <b>temporária, não permanente</b>, e vedada para atividade ordinária.", "<b>Remuneração (X, XII, XIII, XIV e XV):</b> a remuneração e o subsídio só podem ser fixados ou alterados por <b>lei específica</b>, com <b>revisão geral anual</b> sempre na mesma data e sem distinção de índices. Os vencimentos do Legislativo e do Judiciário não podem superar os do Executivo (XII). É vedada a <b>vinculação e a equiparação</b> para efeito de remuneração (XIII; <b>SV 37</b>: Judiciário não aumenta vencimentos por isonomia). Acréscimos não são computados nem acumulados (XIV, vedado o repique), e a remuneração é <b>irredutível</b> (XV).", "<b>Teto geral (XI):</b> a remuneração, os subsídios, os proventos e as pensões não podem superar o <b>subsídio mensal dos Ministros do STF</b>. Nos Municípios, o teto é o <b>subsídio do Prefeito</b>. Nos Estados e no DF, é o do Governador no Executivo, o dos Deputados no Legislativo e o dos Desembargadores do TJ (<b>90,25%</b> do STF) no Judiciário. Esse limite de 90,25% também vale para <b>procuradores, defensores e membros do MP</b>. Somam-se todas as verbas, incluindo as vantagens pessoais.", "<b>Subteto (§ 12) e verbas indenizatórias (§ 11):</b> Estados e DF <b>podem</b> adotar teto único igual ao subsídio dos Desembargadores, mas só pode haver teto único por <b>emenda às Constituições estaduais ou à Lei Orgânica do DF</b>. A EC 135/2024 fixou que as parcelas de natureza <b>indenizatória</b> só ficam fora do teto se previstas em <b>lei ordinária nacional</b>. Os Municípios não têm subteto: o teto é o subsídio do Prefeito.", "<b>Acumulação (XVI e XVII):</b> é vedada, salvo havendo compatibilidade de horários e respeitado o teto: (a) <b>dois cargos de professor</b>; (b) um cargo de professor com <b>outro de qualquer natureza</b> (EC 138/2025, mais amplo que o antigo “técnico ou científico”); (c) <b>dois cargos ou empregos privativos de profissionais de saúde</b>, com profissões regulamentadas. A proibição alcança autarquias, fundações, empresas públicas, sociedades de economia mista, <b>subsidiárias e controladas</b> (XVII). Pelo Tema 384 (RE 612.975), o teto incide sobre <b>cada vínculo isoladamente</b>.", "<b>Responsabilidade e improbidade (§§ 4º a 6º):</b> a improbidade acarreta suspensão dos direitos políticos, perda da função, indisponibilidade dos bens e ressarcimento, <b>sem prejuízo da ação penal</b>. A lei fixa prazos de prescrição, ressalvado o <b>ressarcimento</b>, que é imprescritível quando decorre de ato de <b>improbidade doloso</b> (Tema 897). A responsabilidade do Estado é <b>objetiva</b> pelos danos causados por seus agentes, assegurado o <b>direito de regresso</b> contra o responsável nos casos de <b>dolo ou culpa</b> (§ 6º).", "<b>Estabilidade (art. 41):</b> adquire-se após <b>3 anos</b> de efetivo exercício, e é condicionada à <b>avaliação especial de desempenho</b> por comissão instituída para essa finalidade. A perda do cargo exige: sentença judicial transitada em julgado, <b>processo administrativo</b> com ampla defesa ou <b>avaliação periódica</b> de desempenho (§ 1º). Invalidada a demissão, o servidor é reintegrado e o ocupante, reconduzido ou aproveitado (§ 2º). Extinto o cargo, o estável fica em disponibilidade com remuneração proporcional (§ 3º). As <b>Súmulas 20 e 21 do STF</b> exigem processo para exonerar o estável e as formalidades legais de apuração, mesmo no estágio probatório.", "<b>Mandato eletivo (art. 38) e acumulação de proventos (§ 10):</b> o servidor no mandato de <b>Prefeito</b> é afastado do cargo, podendo optar pela remuneração. No de <b>Vereador</b>, havendo compatibilidade de horário, acumula as vantagens do cargo com a remuneração do mandato. Sem compatibilidade, aplica-se a regra do Prefeito. É vedada a percepção simultânea de proventos de aposentadoria (art. 40 ou RGPS) com a remuneração de cargo, emprego ou função pública, ressalvados os cargos acumuláveis, eletivos e em comissão."], "pega": ["<b>Teto do Município:</b> o teto dos servidores municipais é o <b>subsídio do Prefeito</b>, e não o do Governador nem o dos Ministros do STF. Procuradores municipais são exceção pelo Tema 510 (90,25% dos Ministros do STF).", "<b>Subteto único:</b> é <b>facultado</b> a Estados e DF, e não aos Municípios. A banca troca por obrigatório ou estende aos Municípios.", "<b>Indenizatórias:</b> a EC 135/2024 exige <b>lei ordinária nacional</b> para excluir verbas do teto. A banca diz lei complementar ou lei local.", "<b>Prazo do concurso:</b> validade de <b>até 2 anos</b>, prorrogável <b>uma vez</b>. A banca troca por 5 anos ou por prorrogações sucessivas. A prioridade (IV) é sobre novos concursados, e não sobre os cargos em comissão.", "<b>Funções de confiança:</b> só efetivos. Cargo em comissão pode ser ocupado por não efetivos, mas só para direção, chefia e assessoramento. A banca inverte as duas regras.", "<b>Acumulação:</b> a EC 138/2025 ampliou a hipótese do professor com <b>outro cargo de qualquer natureza</b>. A banca ainda usa a redação antiga (técnico ou científico). Dois cargos de profissionais de saúde: só se forem privativos desses profissionais.", "<b>Teto e acumulação:</b> pelo Tema 384, o teto vale por <b>vínculo</b>, e não sobre a soma. A banca diz que a soma limita o teto.", "<b>Estabilidade:</b> são <b>3 anos</b> e avaliação especial (EC 19/98), e não 2 anos. A perda do cargo também ocorre por <b>avaliação periódica</b>, e não só por sentença ou PAD.", "<b>Greve:</b> a lei específica é exigida, e na omissão aplica-se a Lei 7.783. O desconto dos dias parados é regra (Tema 531). A banca diz que a greve é vedada ao servidor, ou que o desconto é proibido.", "<b>Imprescritibilidade:</b> só o ressarcimento por <b>improbidade dolosa</b> é imprescritível (Tema 897). Ilícito civil comum prescreve (Tema 666). A banca generaliza."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Processo Administrativo Tributário de Curitiba: lançamento, revisão, JJT, CMC, CRT e Consulta", "key": "TRI", "nome": "Tributário", "conc": ["<b>Edital:</b> lançamento e revisão administrativa, impugnação, recursos, consulta, processo administrativo fiscal de Curitiba, constituição definitiva do crédito e controle de legalidade. As normas locais, todas conferidas no texto municipal, são a <b>LC 40/2001 (arts. 92 a 118)</b> e os Decretos <b>502/2018 (JJT)</b>, <b>31/2021 (CMC)</b>, <b>824/2002 (CRT)</b>, <b>825/2002 (Consulta)</b> e <b>703/2023 (revisão de ofício do IPTU e da TCL)</b>.", "<b>Lançamento (CTN, arts. 142 e 145 a 149):</b> é o procedimento administrativo que verifica o fato gerador, calcula o montante, identifica o sujeito passivo e propõe a penalidade. É <b>atividade vinculada e obrigatória</b>, <b>privativa</b> da autoridade administrativa. O lançamento regularmente notificado só pode ser alterado por <b>impugnação</b>, <b>recurso de ofício</b> ou <b>iniciativa de ofício</b> nos casos do art. 149 (art. 145). Modalidades: <b>de ofício</b> (art. 149), <b>por declaração</b> (art. 147) e <b>por homologação</b> (art. 150). O art. 146 veda a aplicação de novo critério jurídico a fatos geradores anteriores.", "<b>Revisão de ofício (CTN, art. 149):</b> cabe nos casos de lei que a autorize, quando a declaração não é prestada, quando é falsa, quando houve fraude, dolo ou simulação, e quando há <b>fato não conhecido</b> ou não provado. Só pode ser iniciada <b>enquanto não extinto o direito da Fazenda</b> (decadência, art. 173). A mudança de critério jurídico não vale para o passado (art. 146). Em Curitiba, o <b>Decreto 703/2023</b> disciplina a revisão de ofício do <b>IPTU e da TCL</b> pelo órgão fazendário, com <b>ratificação do Diretor</b> e encaminhamento à JJT nos casos previstos.", "<b>Constituição definitiva do crédito:</b> é a que ocorre quando o lançamento <b>não pode mais ser alterado na esfera administrativa</b>. O <b>art. 151, III</b> suspende a exigibilidade durante reclamações e recursos administrativos, e o <b>art. 156, IX</b> extingue o crédito com a <b>decisão administrativa irreformável</b>. Pela <b>Súmula 622 do STJ</b>, a notificação do auto de infração faz cessar a contagem da decadência. Esgotada a instância administrativa, começa a <b>prescrição</b> de 5 anos (art. 174). A <b>Súmula 436 do STJ</b> dispensa lançamento quando o contribuinte entrega declaração reconhecendo o débito.", "<b>Impugnação (LC 40, arts. 92 a 95):</b> o prazo é de <b>30 dias</b>, podendo ser acrescido da <b>metade</b> nos casos previstos. O art. 94 lista os casos em que o processo <b>não é instaurado</b>. O art. 95 trata da instrução, com produção de provas e diligências. Os prazos são <b>contínuos</b>.", "<b>Primeira instância: Junta de Julgamento Tributário (LC 40, art. 96; Decreto 502/2018):</b> a JJT tem <b>no máximo 5 membros</b>, <b>estáveis</b>, da carreira de <b>Auditor Fiscal</b>. O mandato é de <b>1 ano</b>, com recondução de no mínimo 3 membros, e a distribuição é por <b>sorteio</b>. Há <b>sessões semanais presenciais</b>, com quórum de <b>3 membros</b>, e a <b>abstenção é vedada</b>. A súmula da JJT exige <b>unanimidade</b> e <b>ratificação do Secretário</b>. A reconsideração do Simples Nacional é decidida pelo Secretário.", "<b>Recurso voluntário e reexame (LC 40, arts. 98 a 100):</b> o prazo do recurso voluntário ao CMC é de <b>30 dias</b>, com efeitos <b>suspensivo e devolutivo</b>. O <b>reexame necessário</b> ocorre quando a decisão desfavorável à Fazenda superar <b>R$ 25.000</b> para o ISS ou <b>R$ 10.000</b> para os demais tributos. O vício <b>formal</b> pode ser sanado sem reexame (art. 100). Não se exige depósito nem arrolamento prévio para recorrer, conforme a <b>SV 21</b> do STF e a Súmula 373 do STJ.", "<b>Segunda instância: Conselho Municipal de Contribuintes (LC 40, art. 101; Decreto 31/2021):</b> é órgão <b>paritário</b>, integrante da PGM e da SMF e presidido por <b>Procurador</b>. O Presidente é de livre nomeação do PGM, e o Vice, do Secretário (Auditor Fiscal). Tem duas Câmaras, com <b>4 conselheiros dos contribuintes e 4 do Município</b> em cada, mais <b>2 defensores da Fazenda</b> e suplentes. Os representantes dos contribuintes saem de <b>lista tríplice</b> de FECOMÉRCIO, ACP, FIEP e SICONTIBA, com <b>graduação universitária</b>.", "<b>CMC: impedimentos e perda do mandato (Decreto 31/2021):</b> está <b>impedido</b> o conselheiro que participou da instrução no lançamento ou do julgamento de primeira instância. A distribuição prioriza sujeito passivo com <b>60 anos ou mais</b> e créditos de <b>R$ 500.000</b> (ISS) ou <b>R$ 50.000</b> (IPTU e outros). Perde o mandato quem retiver processo por mais de <b>60 dias</b>, faltar a <b>3 sessões consecutivas</b> sem justificativa ou deixar de apresentar processos por 3 sessões. O art. 104 trata do <b>não conhecimento</b> do recurso.", "<b>Instância especial: CRT (LC 40, arts. 105 a 107; Decreto 824/2002):</b> o recurso, de <b>30 dias</b>, é cabível de decisão <b>não unânime</b> do CMC, ou de ementa que não reflita os fundamentos, e só pelos <b>representantes da Fazenda</b>. A CRT tem três membros: <b>Procurador-Geral</b>, <b>Secretário de Finanças</b> e <b>Presidente do CMC</b>. O contribuinte tem <b>30 dias</b> de contrarrazões, e o relator, <b>30 dias</b> para o voto. Não se conhece do recurso intempestivo, contra decisão unânime ou sem contrariedade à lei e à evidência das provas.", "<b>Equidade, renúncia e prazos (LC 40, arts. 109, 111, 116 e 118):</b> a decisão por <b>equidade</b> só dispensa <b>acréscimos legais</b>, exclusive a atualização, e nunca o tributo. A <b>ação judicial</b> com o mesmo objeto importa <b>renúncia ou desistência</b> da via administrativa. Os prazos são <b>contínuos</b>. Podem ser cancelados os débitos de até <b>R$ 135</b>. A <b>Súmula 436</b> do STJ e a <b>SV 21</b> do STF completam o quadro federal.", "<b>Consulta (LC 40, arts. 112 a 114; Decreto 825/2002):</b> é o meio de o contribuinte esclarecer dúvida sobre a legislação. A resposta é <b>vinculante</b> para a Administração enquanto não alterada. A <b>Comissão de Consultas</b> tem 4 membros e é presidida pelo Procurador-Chefe do NAJ/SMF, e a decisão exige o voto de <b>3 membros</b>. Pelo Decreto 581/2024, o presidente declara <b>monocraticamente</b> a ineficácia da consulta nos casos previstos. A Súmula 446 do STJ trata da certidão positiva com efeitos de negativa."], "pega": ["<b>Depósito prévio:</b> é <b>inconstitucional</b> como condição do recurso administrativo (SV 21 e Súmula 373 do STJ). A banca ainda cobra o depósito de 30% do débito.", "<b>Quem recorre à CRT:</b> só o <b>representante da Fazenda</b>, e só contra decisão <b>não unânime</b> ou ementa imprecisa. O contribuinte não recorre à CRT. A banca inverte.", "<b>Composição da CRT:</b> PGM, Secretário de Finanças e Presidente do CMC. A banca troca por Prefeito, por Auditor Fiscal ou por 5 membros. Quem preside o <b>CMC</b> é Procurador.", "<b>JJT:</b> até 5 membros, estáveis, Auditores Fiscais, mandato de 1 ano, quórum de 3, abstenção vedada. A banca troca por Procuradores, por mandato de 2 anos ou por quórum de maioria absoluta dos 5.", "<b>Valores do reexame:</b> R$ 25.000 para o ISS e R$ 10.000 para os demais. A banca inverte. Não confundir com os R$ 500.000 e R$ 50.000 da distribuição prioritária no CMC.", "<b>Equidade:</b> dispensa só os <b>acréscimos legais</b> (multa e juros), exclusive a atualização monetária. O tributo e a atualização continuam devidos.", "<b>Ação judicial:</b> o ajuizamento com o mesmo objeto é <b>renúncia ou desistência</b> da via administrativa. A banca diz que apenas suspende o processo.", "<b>Decadência e prescrição:</b> a notificação do auto faz cessar a decadência (Súmula 622 do STJ). A prescrição só começa quando a decisão administrativa torna-se definitiva. Durante o recurso, a exigibilidade está suspensa (art. 151, III).", "<b>Consulta:</b> a resposta é <b>vinculante</b> para a Administração (arts. 112 a 114). Quem a decide é a Comissão de Consultas (4 membros, voto de 3), presidida pelo Procurador-Chefe do NAJ/SMF. A banca troca por decisão do Secretário ou por 5 membros.", "<b>Lançamento:</b> é <b>vinculado e obrigatório</b>, e não discricionário. O art. 142 o define como ato de <b>responsabilidade funcional</b>: o servidor que não lança responde. A banca troca por ato facultativo ou discricionário."]}, {"materia": "PROCESSO CIVIL", "titulo": "Juizados Especiais da Fazenda Pública (Lei 12.153/2009) e Lei 9.099/95", "key": "PCV", "nome": "Proc. Civil", "conc": ["<b>Edital:</b> Juizados Especiais Cíveis e Juizado Especial da Fazenda Pública (Lei 12.153/2009). O texto abaixo foi conferido no <b>Planalto</b>. A lei aplica <b>subsidiariamente</b> o CPC e as Leis 9.099/95 e 10.259/2001 (art. 27).", "<b>Competência (art. 2º):</b> o Juizado da Fazenda Pública processa e julga causas de interesse dos Estados, do DF, dos Territórios e dos Municípios, até <b>60 salários mínimos</b>. Na soma de parcelas vencidas e <b>12 vincendas</b>, o total não pode superar esse valor. A competência é <b>absoluta</b> no foro onde estiver instalado. Cabe ao autor <b>renunciar</b> ao excedente para ficar no Juizado.", "<b>Exclusões (art. 2º, § 1º):</b> não cabem no Juizado o <b>mandado de segurança</b>, a <b>desapropriação</b>, a divisão e demarcação, as <b>ações populares</b>, a <b>improbidade</b>, a <b>execução fiscal</b>, as causas sobre <b>bens imóveis</b> dos entes públicos, as causas sobre <b>direitos ou interesses difusos e coletivos</b> e as de <b>demissão de servidor</b> ou sanções disciplinares a militares. Em causas de valor menor, o autor não pode optar pelo juízo comum se o Juizado estiver instalado.", "<b>Partes (art. 5º):</b> podem ser autores as <b>pessoas físicas</b>, as <b>microempresas</b> e as <b>empresas de pequeno porte</b>. Podem ser réus os <b>Estados, DF, Territórios e Municípios</b>, bem como <b>autarquias, fundações e empresas públicas</b> a eles vinculadas. As <b>sociedades de economia mista</b> não podem ser rés. Pessoas jurídicas de médio e grande porte não são autoras.", "<b>Tutelas e recursos (arts. 3º e 4º):</b> o juiz pode deferir de ofício <b>medidas cautelares</b> e de antecipação de tutela. Só cabe <b>recurso</b> contra a <b>sentença</b>, mas é possível recorrer da decisão que defere ou nega tutela de urgência. Não há reexame necessário (art. 11). O recurso inominado vai à <b>Turma Recursal</b>, composta por juízes de primeiro grau com <b>mandato de 2 anos</b>, vedada a recondução (art. 17).", "<b>Procedimento (arts. 7º a 10):</b> não há <b>prazos diferenciados</b> para a Fazenda. A citação ocorre com antecedência mínima de <b>30 dias</b> da audiência. Os representantes do ente podem <b>conciliar, transigir ou desistir</b> nos termos da lei do próprio ente (art. 8º). Documentos em poder da parte contrária são requisitados, e a Fazenda deve juntar os que estão na repartição até a audiência (art. 9º). A <b>perícia</b> é por técnico indicado pelo juiz, e o laudo deve ser apresentado <b>5 dias antes</b> da audiência (art. 10).", "<b>Cumprimento (arts. 12 e 13):</b> a <b>obrigação de fazer, não fazer ou entregar</b> é cumprida por <b>ofício do juiz</b>. A obrigação de pagar quantia certa até o limite é paga por <b>RPV em 60 dias</b>, sem precatório. Os limites de RPV são <b>40 salários mínimos</b> (Estados e DF) e <b>30 salários mínimos</b> (Municípios), até que a lei do ente fixe outro valor. Se não houver pagamento, o juiz determina o <b>sequestro</b>. É vedado o <b>fracionamento</b> para forçar RPV. A <b>renúncia ao excedente</b> permite a RPV.", "<b>Conciliadores e juízes leigos (arts. 15 e 16):</b> os conciliadores são auxiliares da Justiça, recrutados preferencialmente entre bacharéis em Direito, e os <b>juízes leigos</b> são advogados com <b>mais de 2 anos</b> de experiência. Os leigos ficam impedidos de advogar perante os Juizados enquanto exercem a função. A sentença do juiz leigo é submetida ao juiz togado, que a homologa ou não.", "<b>Uniformização e recursos aos tribunais (arts. 18 a 21):</b> cabe <b>pedido de uniformização</b> de jurisprudência quando as Turmas do mesmo Estado divergirem em questões de direito material, e a decisão compete à reunião das Turmas em conflito, presidida por desembargador (art. 18). Havendo divergência com a súmula do <b>STJ</b>, o pedido vai ao STJ (art. 19). O <b>recurso extraordinário</b> cabe contra acórdão da Turma Recursal (art. 21). A <b>Súmula 640 do STF</b> admite o RE e a <b>Súmula 203 do STJ</b> não admite REsp. Contra ato de Juizado, o MS é da Turma Recursal.", "<b>Lei 9.099/95 (Juizado Cível):</b> competência para causas de até <b>40 salários mínimos</b> (art. 3º), sem advogado até <b>20 salários</b> (art. 9º). Não podem ser partes o incapaz, o preso, as pessoas jurídicas de direito público, as empresas públicas da União, a massa falida e o insolvente civil (art. 8º). O recurso inominado tem prazo de <b>10 dias</b> (art. 42), e os embargos de declaração, <b>5 dias</b> (art. 49). Em primeiro grau, o acesso é <b>gratuito</b> (art. 54); a sucumbência (custas e honorários de 10 a 20%) só ocorre no recurso, para o vencido (art. 55).", "<b>CPC e Juizados:</b> o <b>incidente de desconsideração da personalidade jurídica</b> é admitido nos Juizados Especiais (art. 1.062 do CPC). O processo segue os critérios de <b>oralidade, simplicidade, informalidade, economia processual e celeridade</b> (art. 2º da Lei 9.099). Prevalece a conciliação. A Lei 12.153 exclui a execução fiscal, mas a <b>execução do título judicial</b> contra a Fazenda segue o rito próprio dos arts. 12 e 13."], "pega": ["<b>Mandado de segurança:</b> não cabe no Juizado da Fazenda (art. 2º, § 1º, I). A banca diz que cabe se o valor for baixo.", "<b>Sociedade de economia mista:</b> não pode ser ré no Juizado da Fazenda (art. 5º, II), mas empresa pública pode. A banca troca.", "<b>Limites de valor:</b> o teto de competência é de <b>60 salários</b>, o RPV é de 40 (Estados e DF) e 30 (Municípios), e o Juizado Cível comum tem 40 salários. Não confundir os três.", "<b>Prazo da Fazenda:</b> não existe prazo em dobro nem em quádruplo no Juizado (art. 7º). A banca aplica o CPC, art. 183.", "<b>Reexame necessário:</b> não há no Juizado da Fazenda (art. 11). A banca diz que, contra o ente público, é obrigatório.", "<b>Recorrer:</b> só da sentença, salvo tutelas de urgência (arts. 3º e 4º). Em outras decisões interlocutórias não cabe agravo. A banca diz que cabe agravo de instrumento.", "<b>Competência absoluta:</b> o autor não pode escolher entre o Juizado e a Vara da Fazenda quando houver Juizado instalado. A banca fala em competência relativa ou opcional.", "<b>Execução fiscal:</b> está excluída. Mas o crédito do <b>cidadão</b> contra o Município (RPV) é do Juizado. O Município não é autor. A banca confunde autor e réu.", "<b>Honorários:</b> em 1º grau não há condenação. No recurso, o vencido paga custas e honorários de 10 a 20% do valor da condenação (art. 55 da Lei 9.099). A banca diz que também há em 1º grau.", "<b>Juiz leigo e Turma:</b> o juiz leigo é advogado com mais de 2 anos de experiência. A Turma Recursal tem mandato de 2 anos, sem recondução. A banca troca por 5 anos ou por recondução permitida."]}], "15": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Contratação direta e procedimentos auxiliares (Lei 14.133/2021)", "key": "ADM", "nome": "Administrativo", "conc": ["<b>Edital:</b> Lei 14.133/2021, contratação direta (inexigibilidade e dispensa) e procedimentos auxiliares. Não há norma de Curitiba nesta unidade. Os artigos foram conferidos no texto da lei no site do Planalto, e os valores no <b>Decreto 12.807/2025</b>.", "<b>Regra e exceção:</b> a regra é licitar (CF, art. 37, XXI). A contratação direta é exceção e se divide em <b>inexigibilidade</b> (art. 74), em que a competição é inviável, e <b>dispensa</b> (art. 75), em que a competição seria possível, mas a lei permite não licitar. Existe ainda a <b>licitação dispensada</b> (art. 76), que trata de <b>alienação</b> de bens.", "<b>Processo de contratação direta (art. 72):</b> deve ser instruído com documento de formalização da demanda, estudo técnico preliminar, análise de riscos, termo de referência, estimativa de despesa, <b>parecer jurídico</b> e técnicos, compatibilidade com a lei orçamentária, razão da escolha do contratado, <b>justificativa de preço</b> e autorização da autoridade competente. O ato que autoriza ou ratifica a contratação direta deve ser <b>divulgado</b> no sítio oficial.", "<b>Responsabilidade (art. 73):</b> se a contratação direta for indevida, com <b>dolo, fraude ou erro grosseiro</b>, o contratado e o agente público respondem <b>solidariamente</b> pelo dano, sem prejuízo de outras sanções legais.", "<b>Inexigibilidade (art. 74):</b> cabe quando há inviabilidade de competição, em especial para: <b>I</b> fornecedor exclusivo; <b>II</b> profissional do setor artístico consagrado pela crítica ou pela opinião pública; <b>III</b> serviços técnicos especializados de natureza predominantemente intelectual com profissionais ou empresas de <b>notória especialização</b>; <b>IV</b> objetos que possam ser contratados por <b>credenciamento</b>; <b>V</b> compra ou locação de imóvel cujas características de instalações e de localização tornem necessária a sua escolha. O rol do art. 74 é <b>exemplificativo</b> (“em especial”). No inciso III, a lei <b>veda a inexigibilidade para serviços de publicidade e divulgação</b>.", "<b>Serviços do inciso III:</b> estudos técnicos, planejamentos e projetos; pareceres, perícias e avaliações; assessorias ou consultorias técnicas e auditorias financeiras ou tributárias; fiscalização, supervisão ou gerenciamento de obras; <b>patrocínio ou defesa de causas judiciais ou administrativas</b>; treinamento de pessoal; restauração de obras de arte; controles de qualidade e ensaios. A lei <b>não exige mais a natureza singular</b> do serviço, como exigia a Lei 8.666. Vedada a subcontratação de empresas ou profissionais distintos daqueles que justificaram a inexigibilidade.", "<b>Dispensa por valor (art. 75, I e II):</b> obras, serviços de engenharia e manutenção de veículos, até <b>R$ 130.984,20</b>; demais compras e serviços, até <b>R$ 65.492,11</b> (valores de 2026, atualizados pelo Decreto 12.807/2025). Os valores são <b>dobrados</b> para consórcios públicos e agências executivas. O cálculo considera o somatório no exercício, por unidade gestora e por <b>mesmo ramo de atividade</b>. Preferencialmente há aviso em sítio oficial por <b>3 dias úteis</b> para receber propostas adicionais.", "<b>Outras dispensas (art. 75):</b> licitação <b>deserta</b> (sem interessados, se a licitação não puder ser repetida sem prejuízo e mantidas as condições do edital) e <b>fracassada</b> (propostas com preços manifestamente superiores ao mercado ou desclassificadas); <b>emergência ou calamidade</b> (contratos de até <b>1 ano</b>, vedadas a prorrogação e a recontratação da mesma empresa); contratação com órgão ou entidade da administração criado para esse fim, entre outras.", "<b>Alienação (art. 76):</b> exige interesse público justificado e <b>avaliação prévia</b>. Bens imóveis da administração direta, autarquias e fundações exigem <b>autorização legislativa</b> e licitação na modalidade <b>leilão</b>, com hipóteses de dispensa. Bens móveis exigem avaliação e leilão, também com dispensas previstas.", "<b>Procedimentos auxiliares (art. 78): credenciamento, pré-qualificação, procedimento de manifestação de interesse (PMI), sistema de registro de preços (SRP) e registro cadastral</b>. Não são modalidades de licitação. Obedecem a regulamento, com critérios objetivos.", "<b>Credenciamento (art. 79):</b> quatro hipóteses: contratação <b>paralela e não excludente</b> (vários contratados ao mesmo tempo), seleção a critério de terceiros (o usuário escolhe), mercados fluidos, em que a Administração não pode fixar o preço previamente, e <b>comércio eletrônico</b> de bens e serviços comuns padronizados no Sistema de Compras Expressas (inciso IV, incluído pela Lei 15.266/2025).", "<b>Sistema de registro de preços (arts. 82 a 86):</b> o registro de preços gera <b>compromisso do fornecedor</b>, mas <b>não obriga a Administração</b> a contratar. A ata vale por <b>1 ano</b>, prorrogável por igual período se o preço continuar vantajoso. Há órgão gerenciador, participantes e, em regra, <b>não participantes</b> (adesão ou “carona”), com justificativa da vantagem, preços compatíveis com o mercado e aceitação do gerenciador e do fornecedor. O limite é de <b>50%</b> por órgão aderente, sobre os quantitativos registrados, e de <b>o dobro</b> no total das adesões (art. 86, §§ 2º, 4º e 5º)."], "pega": ["<b>Singularidade:</b> a banca cobra a “natureza singular” como requisito da inexigibilidade do inciso III. Na Lei 14.133 ela foi retirada. Exige-se <b>notória especialização</b> e serviço técnico especializado.", "<b>Rol taxativo ou exemplificativo:</b> as hipóteses de <b>dispensa</b> do art. 75 são taxativas. As de <b>inexigibilidade</b> do art. 74 são exemplificativas (“em especial”).", "<b>Fracionamento:</b> dividir o objeto para ficar abaixo do limite é vedado. O limite se aplica ao total do exercício, por ramo de atividade e unidade gestora.", "<b>Emergência:</b> o contrato dura no máximo <b>1 ano</b>, não pode ser prorrogado e a mesma empresa não pode ser recontratada pelo inciso. A banca troca por “prorrogável por igual período”.", "<b>Valores:</b> R$ 130.984,20 (obras e engenharia) e R$ 65.492,11 (demais) valem a partir de 1º/1/2026. Os R$ 100 mil e R$ 50 mil são os valores originais da lei, já atualizados.", "<b>Mal-entendido sobre SRP:</b> registrar preço não é contratar. A Administração não é obrigada a comprar, e o fornecedor registrado fica obrigado ao fornecimento.", "<b>Credenciamento:</b> não é modalidade e não tem disputa. É procedimento auxiliar, e várias pessoas são contratadas. Também é hipótese de inexigibilidade (art. 74, IV).", "<b>Responsabilidade:</b> a contratação direta indevida gera responsabilidade <b>solidária</b> do agente e do contratado, mas só com dolo, fraude ou erro grosseiro. Erro simples não basta.", "<b>Publicidade:</b> a inexigibilidade do inciso III <b>não vale</b> para serviços de publicidade e divulgação. A banca apresenta a contratação de agência de comunicação por notória especialização como regular, e ela é vedada.", "<b>Advogado:</b> o patrocínio ou defesa de causas judiciais ou administrativas está no rol do inciso III. Mesmo assim, exige notória especialização e justificativa. A dispensa de licitação para advogado não é automática."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Tributação e finanças na CF: EC 132/2023, repartição de receitas e precatórios", "key": "CON", "nome": "Constitucional", "conc": ["<b>Edital:</b> Constituição Federal, sistema tributário nacional, finanças públicas e precatórios, com a EC 132/2023 e a EC 136/2025. Não há norma de Curitiba nesta unidade. O art. 100 foi lido no texto atualizado do Planalto, e a EC 136 foi lida na íntegra.", "<b>Reforma tributária (EC 132/2023):</b> cria o <b>IBS</b> (compartilhado entre Estados, DF e Municípios, com legislação uniforme), a <b>CBS</b> (federal) e o <b>Imposto Seletivo</b>. O IBS substitui o <b>ICMS e o ISS</b>; a CBS substitui o PIS e a Cofins (e o IPI, que fica reduzido a zero, salvo a Zona Franca de Manaus). A regulamentação veio com a LC 214/2025. O IBS é gerido pelo <b>Comitê Gestor</b> nacional.", "<b>Transição:</b> 2026 é ano de testes (CBS a 0,9% e IBS a 0,1%, compensáveis). A CBS passa a valer plenamente em 2027. O IBS cresce de <b>2029 a 2032</b>, enquanto ICMS e ISS diminuem. Em <b>2033</b> ICMS e ISS são extintos. Durante a transição o ISS continua existindo, e a competência dos Municípios sobre ele é preservada até lá.", "<b>Princípios do novo sistema (art. 156-A):</b> não cumulatividade ampla, tributação no <b>destino</b>, alíquota única por ente para todas as operações (salvo regimes diferenciados), não incidência sobre exportações, e neutralidade. O IBS é cobrado sobre operações com bens, serviços e direitos.", "<b>Competência municipal (art. 156): IPTU, ITBI e ISS</b>. O ITBI incide sobre transmissão inter vivos de bens imóveis, e não incide em integralização de capital nem em fusão e incorporação, salvo atividade preponderante imobiliária. O IPTU pode ser progressivo no tempo e em razão do valor, e a EC 132 o permitiu também por localização e uso.", "<b>Taxas, contribuição de melhoria e COSIP:</b> taxas se vinculam a serviço específico e divisível ou a poder de polícia (art. 145). A contribuição de melhoria exige obra pública e valorização. A <b>COSIP</b> (art. 149-A) é contribuição municipal para o serviço de iluminação pública e, desde a EC 132, também para sistemas de monitoramento.", "<b>Repartição de receitas (arts. 157 a 162):</b> pertencem aos Municípios 100% do IR retido na fonte de seus servidores, 50% do ITR do imóvel no território, 50% do IPVA dos veículos licenciados no território e <b>25% do ICMS</b>. O <b>FPM</b> é de 22,5% do IR e do IPI, mais 1% em dezembro, 1% em julho e 1% em setembro (art. 159).", "<b>Retenção (art. 160):</b> é vedada a retenção ou restrição à entrega das receitas partilhadas. As exceções são o pagamento de créditos da União e o condicionamento à aplicação mínima em saúde.", "<b>Orçamento (arts. 165 a 169):</b> três leis de iniciativa do Executivo: PPA, LDO e LOA. O art. 167 veda iniciar programas não previstos na LOA, despesa que exceda créditos e a vinculação de impostos, salvo exceções (saúde, educação, ADCT). Os limites de despesa com pessoal vêm da LRF: <b>60%</b> da receita corrente líquida no Município, sendo 6% para o Legislativo e 54% para o Executivo.", "<b>Precatórios (art. 100):</b> pagamento na ordem cronológica de apresentação, após o trânsito em julgado. Os apresentados <b>até 1º de fevereiro</b> (prazo antecipado pela EC 136/2025, antes 2 de abril) entram no orçamento do ano seguinte e são pagos até o fim desse exercício. Créditos alimentares têm preferência (§1º), e idosos, doentes graves e pessoas com deficiência têm superpreferência (§2º).", "<b>Requisição de pequeno valor (§3º e §4º):</b> não se submete a precatório. O valor é fixado em lei do ente federado, não podendo ser inferior ao maior benefício do regime geral de previdência. É <b>vedado o fracionamento</b> para enquadrar parte em RPV (§8º).", "<b>Outras regras do art. 100:</b> o Tribunal solicita à Fazenda informação sobre débitos que impeçam a expedição (§10, prazo de 30 dias). O credor pode usar créditos em precatórios para comprar imóveis públicos do ente devedor, se a lei local o previr (§11). A atualização observa a EC 113 e a EC 136 (§12). O credor pode <b>ceder</b> o precatório a terceiros <b>sem anuência do devedor</b> (§13).", "<b>Sequestro:</b> só cabe em caso de preterição da ordem de pagamento ou de ausência de alocação orçamentária. A competência é do presidente do tribunal. O não pagamento de precatório pode levar à intervenção federal ou estadual (arts. 34, V, “a”, e 35, I)."], "pega": ["<b>Prazo de apresentação:</b> 1º de fevereiro (EC 136/2025). A banca antiga cobra 2 de abril.", "<b>Cota do ICMS:</b> os Municípios ficam com 25%, e não 20% ou 50%. O IPVA é 50%, e o ITR 50% (ou 100% se o Município fiscalizar e cobrar, nos termos da CF).", "<b>IBS substitui ICMS e ISS</b>, e não o IPTU. A banca troca o imposto substituído. O IPTU e o ITBI continuam municipais.", "<b>Transição:</b> o IBS cresce de 2029 a 2032 e ICMS e ISS acabam em 2033. A banca antecipa ou atrasa um ano.", "<b>Cessão de precatório:</b> não depende de concordância do devedor (§13). A banca exige anuência da Fazenda.", "<b>Sequestro:</b> só em duas hipóteses (preterição e falta de alocação). Não vale como regra geral de execução contra a Fazenda.", "<b>RPV:</b> o limite é definido por lei do ente, com piso igual ao maior benefício do RGPS. Não se pode fracionar o valor da execução para enquadrar parte em RPV.", "<b>Retenção do FPM:</b> a regra é vedar. As exceções são crédito da União e saúde, e não qualquer dívida do Município.", "<b>Atualização:</b> a EC 113 adotou a Selic. A EC 136 fixou o IPCA para atualização a partir de 1º/8/2025 (com a regra de ajuste pela Selic). Atenção à data que a questão pergunta."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Execução fiscal: Lei 6.830/1980", "key": "TRI", "nome": "Tributário", "conc": ["<b>Edital:</b> ex
