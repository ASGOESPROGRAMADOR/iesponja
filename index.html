denação por crime da lei (art. 48). A petição inicial leva, entre outros documentos, o <b>relatório detalhado do passivo fiscal</b> (art. 51, X). No deferimento, o juiz <b>dispensa certidões negativas para o exercício das atividades</b>, observados o <b>art. 195, § 3º, da CF</b> e o <b>art. 69</b> (art. 52, II) e manda <b>intimar eletronicamente o MP e as Fazendas Públicas federal e de todos os Estados, DF e Municípios em que o devedor tiver estabelecimento</b> (art. 52, V), para que tomem conhecimento e informem eventuais créditos; o <b>plano</b> deve ser apresentado em <b>60 dias improrrogáveis</b> da publicação do deferimento, sob pena de falência (art. 53), e a assembleia ocorre em até <b>150 dias</b> (art. 56, § 1º). O plano aprovado <b>nova</b> os créditos anteriores ao pedido, sem prejuízo das garantias, e a decisão que concede a recuperação é <b>título executivo judicial</b> (art. 59). A <b>concessão</b> depende de plano sem objeção ou aprovado em assembleia; no <b>cram down</b> (art. 58, § 1º) exigem-se mais da <b>metade</b> do valor dos créditos presentes, aprovação de <b>2 classes</b> (ou de 1, se só 2 votam) e mais de <b>1/3</b> dos credores da classe que rejeitou. <b>Plano rejeitado:</b> a falência <b>não é imediata</b>; o administrador judicial submete à assembleia a concessão de <b>30 dias</b> para os <b>credores apresentarem plano</b> (art. 56, §§ 4º a 6º, aprovada por mais da metade dos créditos presentes). Só se isso não ocorrer, ou se esse plano for rejeitado, o juiz <b>convola em falência</b> (art. 56, § 8º). Os trabalhistas vencidos até o pedido têm prazo de até <b>1 ano</b>, e os salariais até <b>5 salários mínimos</b> dos 3 meses anteriores, até <b>30 dias</b> (art. 54). A fiscalização dura até <b>2 anos</b> após a concessão (art. 61).", "<b>Fazenda Pública na recuperação (arts. 57, 68 e 73).</b> Aprovado o plano, o devedor deve apresentar <b>certidões negativas</b> de débitos tributários (art. 57; também o <b>CTN art. 191-A</b>). A <b>jurisprudência oscilou</b>: houve entendimento de <b>dispensa</b>, e o <b>STJ</b> passou a exigir a regularidade fiscal depois que a <b>Lei 14.112/2020</b> criou a transação e o parcelamento específicos . O <b>art. 68</b> diz que as Fazendas Públicas e o INSS <b>podem</b> deferir <b>parcelamento</b> em sede de recuperação, nos termos da legislação específica e do CTN; <b>ME e EPP</b> têm prazos <b>20% maiores</b>. O <b>descumprimento</b> do parcelamento do art. 68, ou da transação do art. 10-C da Lei 10.522, é causa de <b>falência durante a recuperação</b> (art. 73, V). Também o é o <b>esvaziamento patrimonial</b> que implique <b>liquidação substancial</b> em prejuízo de credores <b>não sujeitos</b> à recuperação, <b>inclusive as Fazendas Públicas</b> (art. 73, VI); nesse caso, a falência <b>não invalida os atos</b>, o juiz determina o <b>bloqueio do produto</b> das alienações, e a perícia sobre a liquidação substancial é <b>facultativa</b> (§§ 2º e 3º).", "<b>Falência: pedido e sentença (arts. 94 a 99).</b> Será decretada a falência de quem, <b>sem relevante razão de direito</b>, não paga título protestado acima de <b>40 salários mínimos</b>; do executado que não paga, não deposita nem nomeia bens; e de quem pratica <b>atos de falência</b> (art. 94). Podem requerê-la o devedor, o cônjuge, herdeiro ou inventariante, o cotista ou acionista e <b>qualquer credor</b> (art. 97). A contestação é em <b>10 dias</b>, com <b>depósito elisivo</b> possível nos incisos I e II (art. 98). Na sentença, o <b>termo legal</b> não retroage mais de <b>90 dias</b> do pedido de falência, do pedido de recuperação ou do primeiro protesto (art. 99, II). O juiz ordena a <b>intimação eletrônica do MP e das Fazendas Públicas</b> de todos os entes em que haja estabelecimento (art. 99, XIII). Em <b>qualquer modalidade de alienação</b>, o MP e as <b>Fazendas Públicas</b> serão intimados <b>por meio eletrônico, sob pena de nulidade</b> (art. 142, § 7º), e a <b>massa falida é dispensada de certidões negativas</b> (art. 146). Para o Município, a intimação da <b>administração indireta</b> vai à <b>Procuradoria-Geral</b> ou, se não houver, ao gabinete do Prefeito (§ 2º, III). O administrador judicial apresenta o <b>plano de realização do ativo</b> em <b>60 dias</b>, com estimativa de até <b>180 dias</b> por auto de arrecadação (§ 3º).", "<b>Juízo universal e incidente fiscal (arts. 76 e 7º-A).</b> O juízo da falência é <b>indivisível</b> e atrai as ações sobre bens e negócios do falido, <b>ressalvadas as causas trabalhistas, fiscais</b> e as não reguladas pela lei em que o falido seja autor (art. 76). A <b>Lei 14.112/2020</b> criou o <b>incidente de classificação de crédito público</b> (art. 7º-A): na falência, o juiz instaura <b>de ofício</b>, para <b>cada Fazenda Pública credora</b>, e intima-a para, em <b>30 dias</b>, apresentar a relação completa dos créditos inscritos em dívida ativa, com cálculos, classificação e situação. Há <b>15 dias</b> para objeções (falido, credores e administrador), <b>10 dias</b> para a Fazenda se manifestar, e os créditos controvertidos ficam em <b>reserva integral</b>. O juízo <b>falimentar</b> decide os <b>cálculos e a classificação</b>; o juízo da <b>execução fiscal</b> decide a <b>existência, a exigibilidade e o valor</b> do crédito e o prosseguimento contra os <b>corresponsáveis</b> (§ 4º). No Município de Curitiba, a <b>LOM art. 74, § 4º</b>, atribui <b>exclusivamente à Procuradoria-Geral</b> a cobrança judicial e extrajudicial da <b>dívida ativa</b>: é a PGM quem atua nesse incidente.", "<b>Ordem de pagamento na falência (arts. 83, 84 e 86).</b> Primeiro, os <b>extraconcursais</b> (art. 84): quantias dos arts. 150 e 151, <b>financiamento</b> do devedor em recuperação, <b>restituições em dinheiro</b>, remuneração do administrador e trabalhistas pós-falência, obrigações de atos válidos, despesas de arrecadação e realização do ativo, custas em que a massa foi vencida e os <b>tributos de fatos geradores posteriores à decretação da falência</b> (inciso V; também o CTN art. 188). A <b>restituição em dinheiro</b> inclui o direito das <b>Fazendas Públicas</b> a tributos <b>passíveis de retenção na fonte</b>, descontos de terceiros e valores recebidos por agentes arrecadadores e não recolhidos (art. 86, IV). Depois, a ordem do <b>art. 83</b>: <b>(I)</b> trabalhistas, até <b>150 salários mínimos</b> por credor, e acidentes de trabalho; <b>(II)</b> crédito com <b>garantia real</b>, até o valor do bem; <b>(III)</b> <b>créditos tributários</b>, independentemente da natureza e do tempo de constituição, <b>exceto as multas</b>; <b>(VI)</b> quirografários (inclusive o saldo trabalhista acima de 150 salários e os créditos com privilégio geral ou especial de outras leis, § 6º); <b>(VII)</b> <b>multas</b> contratuais e penas pecuniárias, <b>incluídas as multas tributárias</b>; <b>(VIII)</b> subordinados; <b>(IX)</b> juros após a falência. O <b>CTN art. 186</b> concorda: o crédito tributário prefere a qualquer outro, ressalvados os trabalhistas, mas <b>na falência</b> não prefere aos extraconcursais, às restituições nem aos créditos com garantia real, e a <b>multa tributária</b> prefere apenas aos <b>subordinados</b>.", "<b>Alienação do ativo, concurso entre entes e Curitiba.</b> Na alienação de ativos na falência, o objeto fica <b>livre de ônus</b> e <b>sem sucessão</b> do arrematante nas obrigações do devedor, <b>inclusive tributárias</b> e trabalhistas (art. 141, II), salvo se o arrematante for <b>sócio</b>, <b>parente até o 4º grau</b> ou agente do falido para fraudar (§ 1º). A <b>LEF art. 31</b> exige prova de <b>quitação da dívida ativa ou concordância da Fazenda</b> para autorizar alienação em falência; a Lei 11.101 (arts. 141, 142 e 146) dispensa certidões e dá <b>ciência eletrônica</b> às Fazendas, sob pena de nulidade. Na prova, vale a ordem: <b>sem sucessão</b> e <b>intimação obrigatória</b>. O <b>concurso de preferência entre os entes</b> (parágrafo único do CTN art. 187 e da LEF art. 29: União, Estados, Municípios) foi declarado <b>não recepcionado</b> na <b>ADPF 357</b> (Plenário, 24/06/2021, rel. Min. Cármen Lúcia), e a Súmula 563 do STF foi <b>cancelada</b>; os <b>caputs</b> continuam valendo. Em <b>Curitiba</b>, a <b>LC 141/2023</b> (art. 7º, § 6º) trata de condições especiais para devedor em recuperação ou falência, e o <b>Decreto 2.305/2023</b> (art. 16) cuida dos créditos <b>irrecuperáveis</b>, entre eles o de falência encerrada sem ativos.", "<b>Recuperação extrajudicial, plano especial e prazos (arts. 10, 71, 129, 132, 158, 161 e 163).</b> Na <b>recuperação extrajudicial</b>, não se sujeitam os créditos de <b>natureza tributária</b> (art. 161, § 1º); o acordo obriga todos os credores da espécie se assinado por mais da <b>metade</b> dos créditos de cada espécie (art. 163, antes 3/5), e o pedido pode ser feito com <b>1/3</b>, com prazo improrrogável de <b>90 dias</b> para atingir o quórum (§ 7º). No <b>plano especial de ME e EPP</b> (art. 71), ficam de fora os créditos <b>fiscais</b>; o parcelamento é em até <b>36 parcelas</b> com juros pela <b>SELIC</b>, a 1ª em até <b>180 dias</b> da distribuição. Na falência: a habilitação retardatária (art. 10, § 10) tem prazo de <b>3 anos</b> da sentença, sob pena de decadência; os atos do art. 129 são <b>ineficazes objetivamente</b> (pagamento de dívida não vencida no termo legal, atos gratuitos até <b>2 anos</b> antes); a <b>ação revocatória</b> prescreve em <b>3 anos</b> da decretação (art. 132); a <b>extinção das obrigações</b> do falido ocorre com o pagamento de mais de <b>25%</b> dos quirografários ou o decurso de <b>3 anos</b> da decretação (art. 158). Os crimes falimentares são de <b>ação penal pública incondicionada</b>, e a sentença de falência é <b>condição objetiva de punibilidade</b> (arts. 180 e 184)."], "pega": ["Sujeição do crédito tributário: a banca diz que o crédito tributário se sujeita à recuperação judicial e deve ser habilitado. A lei diz que a cobrança judicial do crédito tributário <b>não se sujeita</b> a concurso de credores ou habilitação (CTN art. 187; LEF art. 29, caput), e o art. 6º, § 7º-B, ressalva as <b>execuções fiscais</b> do stay.", "Stay period: a banca diz que a execução fiscal fica suspensa por 180 dias com o deferimento da recuperação. A lei diz que a suspensão <b>não se aplica às execuções fiscais</b>; o juízo da recuperação só pode <b>substituir constrições</b> sobre <b>bens de capital essenciais</b> (art. 6º, § 7º-B).", "Tema 987 do STJ: a banca diz que o STJ fixou a tese no Tema 987 sobre a constrição em execução fiscal. A <b>afetação foi cancelada</b> em 2021, por causa da Lei 14.112/2020 (REsp 1.694.261/SP); <b>não há tese</b>.", "Data do crédito: a banca diz que se sujeitam à recuperação os créditos existentes na data da <b>decretação</b>, ou do <b>deferimento do processamento</b>. A lei diz <b>na data do pedido</b>, ainda que não vencidos (art. 49, caput); a questão de banco sobre o tema pede a tese do STJ (<b>Tema 1.051</b>: o <b>fato gerador</b>).", "Garantia real e tributo: a banca diz que o crédito tributário vem logo depois do trabalhista, antes da garantia real. A lei diz: trabalhista até <b>150 salários</b>, depois <b>garantia real até o valor do bem</b>, <b>depois</b> o tributário (art. 83, I a III; CTN art. 186, parágrafo único, I).", "Multa tributária: a banca diz que a multa tributária tem a mesma preferência do tributo. A lei diz que ela fica na classe do <b>art. 83, VII</b> (junto com multas contratuais e penas pecuniárias) e <b>prefere apenas aos subordinados</b> (CTN art. 186, parágrafo único, III).", "Fato gerador posterior: a banca diz que o tributo de fato gerador posterior à falência entra na classe tributária do art. 83. A lei diz que é <b>extraconcursal</b> (art. 84, V; CTN art. 188), respeitada a ordem do art. 83 entre eles.", "Concurso entre entes: a banca diz que a União tem preferência sobre Estados e Municípios na execução fiscal, conforme o parágrafo único do art. 187 do CTN e a Súmula 563 do STF. O STF, na <b>ADPF 357</b>, declarou o parágrafo <b>não recepcionado</b> e <b>cancelou</b> a Súmula 563; o <b>caput</b> do art. 187 e do art. 29 da LEF <b>continua válido</b>.", "Sucessão: a banca diz que o arrematante de ativo na falência responde pelas dívidas tributárias do falido. A lei diz que o objeto fica <b>livre de ônus</b> e <b>sem sucessão</b>, inclusive tributária (art. 141, II), <b>salvo</b> arrematante sócio, parente até o 4º grau ou agente do falido (§ 1º).", "Intimação das Fazendas: a banca diz que só a União é intimada da falência. A lei diz que o juiz intima eletronicamente o <b>MP</b> e as <b>Fazendas federal e de todos os Estados, DF e Municípios em que o devedor tiver estabelecimento</b> (arts. 52, V, e 99, XIII); para a administração indireta do Município, a intimação vai à <b>Procuradoria-Geral</b>.", "Esvaziamento patrimonial: a banca diz que a convolação por esvaziamento protege só os credores sujeitos à recuperação, ou invalida os atos de esvaziamento. A lei diz que protege os credores <b>não sujeitos</b>, <b>inclusive as Fazendas</b>; <b>não invalida</b> os atos, e a perícia é <b>facultativa</b> (art. 73, VI, §§ 2º e 3º). A questão do TJPE no banco gira em torno disso.", "Quem se submete à lei: a banca diz que a Lei 11.101 se aplica à sociedade de economia mista municipal. A lei diz que <b>não se aplica</b> a empresa pública e sociedade de economia mista (art. 2º, I).", "Prazos: a banca diz que os prazos da lei são em dias úteis. A lei diz <b>dias corridos</b> (art. 189, § 1º, I), e o termo legal da falência não retroage mais de <b>90 dias</b> (art. 99, II).", "Plano rejeitado: a banca diz que a rejeição do plano na assembleia leva imediatamente à falência. A lei diz que o administrador submete à assembleia a concessão de <b>30 dias</b> para um <b>plano dos credores</b>; só depois, se não houver ou for rejeitado, vem a <b>convolação</b> (art. 56, §§ 4º a 8º).", "Falência e Fazendas: a banca diz que a venda de ativo na falência exige certidão negativa da arrematante ou da massa. A lei diz que a massa é <b>dispensada de certidões</b> (art. 146), mas as <b>Fazendas devem ser intimadas por meio eletrônico, sob pena de nulidade</b> (art. 142, § 7º).", "Recuperação extrajudicial: a banca diz que o crédito tributário pode ser incluído no acordo extrajudicial. A lei <b>exclui</b> os créditos tributários (art. 161, § 1º); o plano especial de ME e EPP também exclui os <b>fiscais</b> (art. 71).", "Extinção das obrigações do falido: a banca diz que exige o pagamento de <b>50%</b> dos quirografários. A lei, após a Lei 14.112/2020, diz mais de <b>25%</b>, ou <b>3 anos</b> da decretação da falência (art. 158)."]}]};

const m=document.getElementById('m'),back=document.getElementById('back'),ct=document.getElementById('ct'),bot=document.getElementById('bot');
const SZ=[16,17,19,21];let si=1;try{const v=parseInt(localStorage.getItem('iesp_sz'));if(v>=0&&v<SZ.length)si=v}catch(e){}
function applySz(){document.documentElement.style.setProperty('--fs',SZ[si]+'px')}applySz();
document.getElementById('aa').onclick=()=>{si=(si+1)%SZ.length;applySz();try{localStorage.setItem('iesp_sz',si)}catch(e){}};
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function tabs(list,on){bot.innerHTML='';list.forEach(([t,h])=>{const a=el('a',h===on?'on':'');a.textContent=t;a.href=h;bot.appendChild(a)})}
function setTop(b,t){back.style.display=b?'':'none';if(b)back.href=b;ct.textContent=t}
function home(){
 setTop(null,'Resumos de estudo');m.innerHTML='';
 m.appendChild(el('div','title','<big>IEsponja</big>'));
 {const q=el('p','sub','Procurador de Curitiba: conceito, explicação e pegadinhas das bancas');q.style.textAlign='center';m.appendChild(q)}
 const me=el('div','menu');
 Object.keys(D).sort((a,b)=>a-b).forEach(k=>{const a=el('a','','<span class="s">Procurador de Curitiba</span><span class="t">PDF '+k+'</span><span class="m"></span>');
  a.querySelector('.m').textContent=D[k].map(x=>x.nome).join(' · ');a.href='#/'+k;me.appendChild(a)});
 m.appendChild(me);
 bot.innerHTML='';
}
function mtabs(k,on){tabs(D[k].map(x=>[x.nome,'#/'+k+'/'+x.key]),on)}
function pdf(k){
 setTop('#/','PDF '+k);m.innerHTML='';
 m.appendChild(el('div','title','<big>PDF '+k+'</big>'));
 {const q=el('p','sub','Estudo de '+DATA[k]);q.style.textAlign='center';m.appendChild(q)}
 const me=el('div','menu');
 D[k].forEach(t=>{const a=el('a','','<span class="s"></span><span class="t"></span><span class="m"></span>');
  a.querySelector('.s').textContent=t.materia;a.querySelector('.t').textContent=t.nome;a.querySelector('.m').textContent=t.titulo;a.href='#/'+k+'/'+t.key;me.appendChild(a)});
 m.appendChild(me);mtabs(k,null);
}
function topic(k,key){
 const L=D[k],i=L.findIndex(x=>x.key===key);if(i<0)return home();const t=L[i];
 setTop('#/'+k,'PDF '+k+' · '+t.nome);m.innerHTML='';
 m.appendChild(el('div','h','').appendChild(document.createTextNode(t.materia)).parentNode);
 const s=el('p','sub');s.textContent=t.titulo;m.appendChild(s);
 m.appendChild(el('div','h','Conceito e explicação'));
 t.conc.forEach((c,j)=>{const d=el('div','v','<sup>'+(j+1)+'</sup>'+c);m.appendChild(d)});
 m.appendChild(el('div','h','Pegadinhas das bancas'));
 const p=el('div','p');t.pega.forEach((c,j)=>{p.appendChild(el('div','v','<sup>'+(j+1)+'</sup>'+c))});m.appendChild(p);
 const n=el('div','nv');const pr=el('a',i>0?'':'off','‹ Anterior'),ix=el('a','','PDF '+k),nx=el('a',i<L.length-1?'':'off','Próxima ›');
 pr.href=i>0?'#/'+k+'/'+L[i-1].key:'#';ix.href='#/'+k;nx.href=i<L.length-1?'#/'+k+'/'+L[i+1].key:'#';n.append(pr,ix,nx);m.appendChild(n);
 mtabs(k,'#/'+k+'/'+key);
}
function route(){const s=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 if(s[0]&&D[s[0]]){if(s[1])topic(s[0],s[1]);else pdf(s[0])}else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
