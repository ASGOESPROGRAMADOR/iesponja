ncia na lista do art. 43 ou diz que o extraordinário depende de lei.", "Dívida ativa (art. 39): inscrição <b>após apurada a liquidez e certeza</b>; <b>tributária</b> (tributos, adicionais e multas) e <b>não tributária</b> (os demais créditos). A banca diz que a multa tributária é dívida não tributária ou que o crédito é inscrito antes de exigível. Atualização, juros, multa e encargo legal integram a receita da dívida ativa.", "Cessão de créditos (art. 39-A): exige <b>lei específica</b>, operação <b>definitiva</b> sem coobrigação do cedente, <b>cobrança mantida com a Fazenda</b>, e é vedada até <b>90 dias antes do fim do mandato</b> (salvo pagamento integral posterior). Não se mexe nas <b>garantias e privilégios</b>. A banca diz que o cedente responde pela solvência ou que a cessão inclui poderes de cobrança do cessionário.", "Dívida flutuante (art. 92): restos a pagar, serviços da dívida, <b>depósitos e débitos de tesouraria</b>. Dívida fundada (art. 98): <b>exigibilidade superior a doze meses</b>. A banca troca o prazo (seis ou vinte e quatro meses) ou põe restos a pagar na dívida fundada.", "Fundos especiais: receitas <b>especificadas e vinculadas por lei</b>; saldo positivo <b>transfere-se</b> ao exercício seguinte, salvo lei em contrário; a lei pode fixar controle próprio, mas <b>sem afastar o Tribunal de Contas</b>. A banca diz que o saldo reverte ao caixa único ou que o fundo é pessoa jurídica."]}, {"materia": "PROCESSO CIVIL", "titulo": "Processos estruturais, controle judicial de políticas públicas e protocolos do CNJ (Resoluções 492/2023 e 598/2024)", "key": "PCV", "nome": "Proc. Civil", "conc": ["Edital: item 13 de Processo Civil (processos estruturais e controle judicial de políticas públicas). Li <b>literalmente</b>, no navegador: no site da Câmara, os <b>arts. 139, 190, 191, 373, 497 a 500 e 536 a 538 do CPC</b> (texto da publicação original); no site de atos do CNJ, as <b>Resoluções 492/2023 e 598/2024</b> inteiras. <b>Não li</b> o &quot;Protocolo para Julgamento com Perspectiva de Gênero&quot; nem o &quot;Protocolo com Perspectiva Racial&quot;, que são os anexos (a Res. 598 informa que o protocolo ocupa as páginas 2 a 193 do DJe): o que digo de seu conteúdo é <b>só o que as resoluções dizem</b>. Os <b>precedentes do STF</b> citados abaixo vêm <b>da minha memória</b> e não foram conferidos.", "<b>Litígio estrutural: conceito.</b> Litígio <b>estrutural</b> é o que envolve uma <b>violação contínua e generalizada de direitos</b> decorrente do modo de funcionamento de uma <b>estrutura</b> (instituição, política, serviço), em que a solução exige <b>reorganizar</b> essa estrutura e não apenas decidir quem tem razão (doutrina de Fiss e Owen, memória). Características: <b>multipolaridade</b> (vários interesses), <b>complexidade</b>, solução <b>prospectiva</b> e <b>contínua</b>, decisão em fases e participação de muitos atores. O CPC não tem um capítulo próprio sobre o tema (o edital cita expressamente <b>art. 139, IV</b> e <b>art. 536, § 1º</b>); o projeto de lei sobre processo estrutural não é lei, e a atuação judicial se apoia nas cláusulas gerais do CPC.", "<b>Poderes do juiz: art. 139.</b> O juiz dirige o processo e pode <b>determinar todas as medidas indutivas, coercitivas, mandamentais ou sub-rogatórias</b> necessárias para assegurar o cumprimento de ordem judicial, <b>inclusive nas ações que tenham por objeto prestação pecuniária</b> (inciso IV); promover a <b>autocomposição</b> (V); <b>dilatar prazos e alterar a ordem de produção das provas</b> para dar efetividade à tutela (VI), mas a dilação só antes de encerrado o prazo regular (p.ú.); determinar o comparecimento pessoal das partes (VIII); suprir pressupostos e sanear vícios (IX); e, diante de <b>demandas individuais repetitivas</b>, <b>oficiar o Ministério Público, a Defensoria e outros legitimados</b> da Lei 7.347 e do CDC (art. 82) para <b>propor ação coletiva</b> (X). <b>Medidas</b>: <b>indutivas</b> (incentivam o cumprimento, como bônus), <b>coercitivas</b> (pressionam, como multa), <b>mandamentais</b> (ordem direta ao obrigado) e <b>sub-rogatórias</b> (substituem a conduta do devedor, como a execução por terceiro).", "<b>Tutela específica e cumprimento (arts. 497 a 500, 536 a 538).</b> Na obrigação de fazer ou não fazer, o juiz concede a <b>tutela específica</b> ou providências que assegurem o <b>resultado prático equivalente</b> (art. 497). Para inibir a prática, a reiteração ou a continuação de um <b>ilícito</b>, ou sua <b>remoção</b>, é <b>irrelevante</b> a demonstração de <b>dano, culpa ou dolo</b> (p.ú.). A conversão em perdas e danos só se o autor requerer ou se impossível a tutela específica (art. 499), e <b>sem prejuízo da multa</b> periódica (art. 500). No cumprimento (art. 536), o juiz pode, de ofício ou a requerimento, determinar <b>multa, busca e apreensão, remoção de pessoas e coisas, desfazimento de obras e impedimento de atividade nociva</b>, requisitando <b>força policial</b> se necessário (§ 1º). O descumprimento injustificado gera <b>litigância de má-fé</b> e responsabilização por crime de <b>desobediência</b> (§ 3º). Aplica-se também a deveres de fazer ou não fazer de <b>natureza não obrigacional</b> (§ 5º), base para ordens estruturais.", "<b>Multa coercitiva (art. 537).</b> <b>Independe de requerimento</b> da parte e pode ser aplicada na <b>fase de conhecimento</b>, em <b>tutela provisória</b>, na <b>sentença</b> ou na <b>execução</b>, desde que <b>suficiente e compatível</b> com a obrigação e fixado <b>prazo razoável</b>. O juiz pode, de ofício ou a requerimento, <b>modificar o valor ou a periodicidade da multa vincenda ou excluí-la</b> se ficar <b>insuficiente ou excessiva</b>, ou se o obrigado demonstrar <b>cumprimento parcial superveniente</b> ou <b>justa causa</b> (§ 1º). O valor é <b>devido ao exequente</b> (§ 2º). A decisão que a fixa é passível de <b>cumprimento provisório</b>, com depósito em juízo, e o <b>levantamento</b> só após o trânsito em julgado favorável ou na pendência de agravo dos incisos II ou III do art. 1.042 (§ 3º). A multa é devida <b>desde o dia do descumprimento</b> e incide enquanto não cumprida a decisão (§ 4º). Contra o Poder Público a multa é admitida, com o ônus recaindo sobre o ente (STJ, memória), com possibilidade de responsabilização pessoal do agente em casos de descumprimento doloso.", "<b>Flexibilização do procedimento.</b> <b>Negócio processual típico (art. 190)</b>: se o processo versa sobre direitos que <b>admitam autocomposição</b>, as partes <b>plenamente capazes</b> podem estipular <b>mudanças no procedimento</b> e convencionar sobre ônus, poderes, faculdades e deveres processuais, antes ou durante o processo. O juiz <b>controla a validade</b> de ofício ou a requerimento e só recusa aplicação nos casos de <b>nulidade</b>, de <b>inserção abusiva em contrato de adesão</b> ou de <b>manifesta vulnerabilidade</b> (p.ú.). <b>Calendário processual (art. 191)</b>: <b>de comum acordo</b>, juiz e partes fixam datas dos atos; o calendário <b>vincula</b> as partes e o juiz, os prazos só se alteram <b>excepcionalmente, com justificativa</b>, e <b>dispensa-se a intimação</b> para atos com data já fixada. <b>Carga dinâmica da prova (art. 373, § 1º)</b>: nos casos previstos em lei ou diante de <b>impossibilidade ou excessiva dificuldade</b> de cumprir o encargo ou <b>maior facilidade</b> de obter a prova do fato contrário, o juiz atribui o ônus de modo diverso, por decisão <b>fundamentada</b>, com oportunidade de desincumbência, sem gerar situação <b>impossível ou excessivamente difícil</b> (§ 2º).", "<b>Fases e técnica do processo estrutural (doutrina, memória).</b> <b>1. Diagnóstico e decisão-núcleo ou decisão de primeira ordem</b>: reconhece o <b>estado de coisas</b> violador, fixa <b>metas e princípios</b> gerais e não detalha todos os meios. <b>2. Implementação</b>: por <b>decisões em cascata</b> ou complementares, com <b>plano</b> apresentado pelo réu ou por especialistas, <b>monitoramento</b>, relatórios periódicos e ajustes. Instrumentos: <b>audiências públicas</b>, <b>amici curiae</b>, <b>peritos</b>, <b>comitês de acompanhamento</b>, <b>negócios processuais</b> (arts. 190 e 191) e <b>cooperação institucional</b> entre Judiciário, Executivo, Legislativo, MP e Defensoria. O edital resume isso como &quot;fases de cognição e de implementação, flexibilização procedimental, audiências públicas e cooperação institucional na execução da decisão&quot;. Dificuldades: <b>coisa julgada</b> dinâmica, legitimação, <b>custos</b>, risco de <b>ativismo</b> e de decisão sem capacidade institucional.", "<b>Controle judicial de políticas públicas (precedentes do STF, memória).</b> O STF admite que o Judiciário <b>controle omissões</b> e <b>imponha obrigações</b> à Administração para garantir <b>direitos fundamentais</b>, sem violar a separação de poderes, e a <b>reserva do possível</b> não pode ser oposta ao <b>mínimo existencial</b> (estudo anterior em Constitucional). <b>Tema 220 (RE 592.581)</b>: o Judiciário pode determinar obras em <b>estabelecimentos prisionais</b> para garantir a integridade física e moral dos presos. <b>Tema 698 (RE 684.612)</b>: o Judiciário pode determinar a <b>implementação de políticas públicas</b> em caso de omissão ou deficiência, observados parâmetros como <b>fundamentação da decisão</b>, previsão de <b>prazo razoável</b> e de <b>planejamento</b>, e <b>não pode fixar o conteúdo da política</b>, apenas assegurar o resultado (a tese exata deve ser conferida). <b>ADPF 347</b>: <b>estado de coisas inconstitucional</b> no sistema prisional, com determinações estruturais (audiência de custódia, uso do FUNPEN). <b>ADPF 709</b> (povos indígenas e Covid-19) é citada como processo estrutural.", "<b>Limites e princípios.</b> <b>Separação de poderes</b> e <b>capacidade institucional</b>: o juiz não escolhe a política, mas pode impor o <b>dever de fazer</b> e supervisionar. <b>Reserva do possível</b>: cabe ao Poder Público provar a insuficiência de recursos e a razoabilidade da pretensão, e ela <b>não afasta o mínimo existencial</b>. <b>Orçamento</b>: o STF afasta a tese de que a ausência de previsão orçamentária impede a ordem judicial (memória). <b>Proporcionalidade</b> e <b>dialogicidade</b>: a decisão deve ser <b>executável</b>, com <b>planos, prazos e metas</b>. Efetivação contra a Fazenda (estudo anterior): o regime de <b>precatórios</b> vale para pagamentos em dinheiro; a <b>obrigação de fazer</b> cumpre-se por ordem direta, com multa.", "<b>Resolução CNJ 492/2023: Protocolo de Julgamento com Perspectiva de Gênero.</b> <b>Art. 1º</b>: para adoção da perspectiva de gênero nos julgamentos dos órgãos do Judiciário, ficam estabelecidas as <b>diretrizes do protocolo</b> aprovado pelo Grupo de Trabalho da <b>Portaria CNJ 27/2021</b>. <b>Art. 2º</b>: os tribunais, com as escolas da magistratura, promoverão <b>cursos de formação inicial e continuada</b> que incluam <b>obrigatoriamente</b> direitos humanos, gênero, raça e etnia, <b>com periodicidade mínima anual</b>; § 1º: a capacitação constará nos regulamentos do <b>Prêmio CNJ de Qualidade</b>; § 2º: os tribunais facilitam o <b>acesso ao Protocolo</b> (QRCode, card, link, sítio, intranet). <b>Art. 3º</b>: instituído o <b>Comitê de Acompanhamento e Capacitação sobre Julgamento com Perspectiva de Gênero</b>, nacional e permanente. <b>Art. 4º</b>: competências (acompanhar o cumprimento, estudos e medidas em <b>perspectiva interseccional</b>, fóruns anuais, cooperação interinstitucional, reuniões, cooperação judicial, eventos). <b>Art. 5º</b>: coordenado por <b>Conselheiro ou Conselheira</b> do CNJ, com representantes das Justiças Estadual, Federal, do Trabalho, Eleitoral e Militar, <b>Enfam</b>, <b>Enamat</b>, <b>OAB</b>, academia e sociedade civil; composição com <b>pluralidade de gênero e raça</b>. <b>Art. 6º</b>: altera o <b>art. 3º da Resolução 255/2018</b> (Comitê de Incentivo à Participação Institucional Feminina, que atua de forma <b>articulada</b> com o outro comitê).", "<b>Resolução CNJ 598/2024: Perspectiva Racial.</b> Datada de <b>22/11/2024</b>, estabelece as diretrizes para adoção da <b>perspectiva racial</b> nos julgamentos de todo o Judiciário, conforme o protocolo do Grupo de Trabalho da <b>Portaria Presidência 73/2024</b>. <b>Art. 1º</b>: diretrizes do protocolo; <b>art. 2º</b>: cursos de formação inicial e continuada com <b>conteúdos obrigatórios</b> de direitos humanos, gênero, raça e etnia, conforme o <b>Protocolo para Julgamento com Perspectiva Racial</b>, com <b>periodicidade mínima anual</b>; § 1º: a formação consta nos regulamentos do <b>Prêmio CNJ de Qualidade</b>; § 2º: acesso ao protocolo por QRCode, card, link ou outro meio. <b>Art. 3º</b>: cabe ao <b>Fórum Nacional do Poder Judiciário para a Equidade Racial (Fonaer)</b>, instituído pela <b>Resolução CNJ 490/2023</b>, acompanhar o cumprimento, propor medidas em <b>perspectiva interseccional</b>, organizar <b>fóruns permanentes anuais</b>, cooperar com entidades e tribunais, reunir-se periodicamente e participar de eventos. Entra em vigor na <b>publicação</b> (art. 4º). Considerandos: Convenção sobre Eliminação da Discriminação Racial (Decreto 65.810/1969), Convenção Interamericana contra o Racismo (Decreto 10.932/2022), Estatuto da Igualdade Racial (Lei 12.288/2010), Declaração de Durban e <b>ODS 18</b> da Agenda 2030.", "<b>Relação entre as duas resoluções e o processo.</b> A <b>492</b> trata de <b>gênero</b> e cria um <b>Comitê</b> próprio (coordenado por Conselheiro do CNJ); a <b>598</b> trata de <b>raça</b> e atribui o acompanhamento ao <b>Fonaer</b>, que já existia pela Res. 490/2023. Ambas <b>não criam regra processual nova</b>: dirigem-se ao <b>modo de julgar</b> (análise do caso à luz de desigualdades estruturais), à <b>capacitação</b> e à divulgação do protocolo. Elo com o tema estrutural: ambas pedem <b>perspectiva interseccional</b>, ou seja, a análise conjunta de gênero, raça e etnia, e a execução por <b>comitês</b> e <b>fóruns</b> de acompanhamento, o que conversa com a ideia de <b>cooperação institucional</b> e de <b>monitoramento</b> do processo estrutural. A Res. 492 cita como base decisões do STF (<b>ADPF 779, ADI 4424, ADC 19</b>), a CEDAW e a Convenção de Belém do Pará."], "pega": ["Art. 139, IV: o juiz pode determinar <b>todas as medidas indutivas, coercitivas, mandamentais ou sub-rogatórias</b> necessárias para o cumprimento da ordem, <b>inclusive nas ações que tenham por objeto prestação pecuniária</b>. A banca diz que só vale para obrigações de fazer ou que a lista é restrita à multa e à busca e apreensão.", "Art. 139, VI: o juiz pode <b>dilatar prazos</b> e <b>alterar a ordem de produção das provas</b>, mas a dilação só pode ser determinada <b>antes de encerrado o prazo regular</b>. A banca diz que pode dilatar prazos já encerrados.", "Art. 139, X: diante de <b>demandas individuais repetitivas</b>, o juiz <b>oficia</b> o MP, a Defensoria e outros legitimados para propor ação coletiva; <b>não</b> propõe de ofício nem extingue as individuais. A banca diz que o juiz converte as ações individuais em coletiva.", "Tutela inibitória (art. 497, p.ú.): para inibir ou remover o <b>ilícito</b>, é <b>irrelevante</b> a demonstração de <b>dano ou culpa/dolo</b>. A banca diz que exige prova do dano ou da culpa.", "Multa do art. 537: <b>independe de requerimento</b>, pode ser fixada na <b>fase de conhecimento, em tutela provisória, na sentença ou na execução</b>; é <b>devida ao exequente</b>; o juiz pode <b>reduzi-la, aumentá-la na periodicidade ou excluí-la</b> se insuficiente, excessiva ou houver justa causa. A banca diz que só se aplica na execução, que a parte precisa pedir, que o valor é do Estado ou que é imutável.", "Levantamento da multa (art. 537, § 3º): pode haver <b>cumprimento provisório</b>, com <b>depósito em juízo</b>, e o levantamento só após o <b>trânsito em julgado favorável</b> (ou na pendência de agravo dos incisos II ou III do art. 1.042). A banca diz que se levanta imediatamente ou que a multa não admite cumprimento provisório.", "Cumprimento de obrigação de fazer (art. 536, § 1º): medidas <b>entre outras</b>: multa, busca e apreensão, remoção, desfazimento de obras, impedimento de atividade nociva, <b>força policial</b>. O rol é <b>exemplificativo</b>. A banca diz que é taxativo. Descumprimento injustificado: <b>má-fé</b> e <b>desobediência</b> (§ 3º).", "Negócio processual (art. 190): só para direitos que <b>admitam autocomposição</b>, por partes <b>plenamente capazes</b>, com <b>controle de validade</b> pelo juiz (nulidade, abuso em contrato de adesão, vulnerabilidade). A banca diz que o juiz não controla ou que vale para direitos indisponíveis em geral.", "Calendário processual (art. 191): <b>de comum acordo</b>; <b>vincula</b> partes e juiz; prazos só mudam em casos <b>excepcionais</b> e justificados; <b>dispensa intimação</b> para os atos com data fixada. A banca diz que o juiz pode impor unilateralmente ou que as partes precisam ser intimadas de cada ato.", "Carga dinâmica (art. 373, § 1º): por <b>decisão fundamentada</b>, diante de <b>impossibilidade ou excessiva dificuldade</b> ou <b>maior facilidade</b> da outra parte, com oportunidade de se desincumbir; não pode gerar prova <b>impossível ou excessivamente difícil</b> (§ 2º). A banca diz que é automática ou que pode criar a prova diabólica.", "Processo estrutural: decisão-núcleo com <b>metas gerais</b>, <b>implementação em fases</b>, <b>planos</b>, monitoramento e <b>cooperação institucional</b>, com <b>audiências públicas</b>. A banca diz que o juiz deve fixar sozinho todos os meios na sentença ou que o processo estrutural exige lei específica.", "Políticas públicas: o Judiciário pode <b>impor obrigações</b> para garantir direitos fundamentais, sem ofensa à separação de poderes, e a <b>reserva do possível não se opõe ao mínimo existencial</b>. A banca diz que o Judiciário nunca pode intervir ou que a falta de previsão orçamentária impede a ordem judicial.", "Res. CNJ 492/2023: <b>perspectiva de gênero</b>; formação com <b>periodicidade mínima anual</b>; cria o <b>Comitê de Acompanhamento e Capacitação</b>, coordenado por <b>Conselheiro ou Conselheira</b>, com <b>pluralidade de gênero e raça</b>. A banca troca por <b>Comitê coordenado pelo Presidente do STF</b> ou diz que a resolução dispensa a capacitação.", "Res. CNJ 598/2024: <b>perspectiva racial</b>; acompanhamento pelo <b>Fonaer</b>, instituído pela <b>Res. 490/2023</b>; formação com direitos humanos, gênero, raça e etnia, <b>mínimo anual</b>. A banca atribui o acompanhamento ao Comitê da Res. 492 ou data a Resolução de 2023.", "As Resoluções 492 e 598 estabelecem as <b>diretrizes do protocolo</b> e <b>capacitação</b>; <b>não</b> alteram o CPC nem criam nulidade automática da decisão que não adote o protocolo. A banca diz que a decisão sem o protocolo é nula de pleno direito (a resolução não traz essa sanção).", "<b>Perspectiva interseccional</b> aparece nas duas resoluções (competências do Comitê e do Fonaer): análise combinada de <b>gênero, raça e etnia</b>. A banca diz que a perspectiva é só de gênero na Res. 598 ou que cada resolução veda a análise cumulativa."]}], "22": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Poder de polícia e intervenção do Estado: conceito, atributos, limites, ciclo, delegação e liberdade econômica (Lei 13.874/2019)", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 11 de Direito Administrativo. Li <b>literalmente</b>, no navegador: <b>CTN, arts. 77 a 82</b> (taxas e poder de polícia); <b>Lei 13.874/2019, arts. 1º a 15</b> (incluindo as alterações no Código Civil do art. 7º). <b>Não li</b> os arts. 16 a 19 da Lei 13.874, a Constituição (arts. 145, II, 170 e 174), a Lei 9.873/1999 nem os decretos regulamentadores da liberdade econômica. Súmulas, temas de repercussão geral e acórdãos citados abaixo vêm <b>da minha memória</b> e não foram conferidos. A classificação doutrinária (ciclo de polícia, atributos) é doutrina, não texto de lei.", "<b>Conceito legal (CTN, art. 78).</b> Poder de polícia é a atividade da administração pública que, <b>limitando ou disciplinando direito, interesse ou liberdade</b>, regula a prática de ato ou a abstenção de fato, em razão de interesse público concernente a: segurança, higiene, ordem, costumes, disciplina da produção e do mercado, exercício de atividades econômicas dependentes de concessão ou autorização do Poder Público, tranquilidade pública, respeito à propriedade e aos direitos individuais ou coletivos. Parágrafo único: considera-se <b>regular</b> o poder de polícia quando exercido pelo <b>órgão competente</b>, nos <b>limites da lei</b>, com observância do <b>processo legal</b> e, sendo a atividade discricionária, <b>sem abuso ou desvio de poder</b>.", "<b>Poder de polícia e taxa (CTN, arts. 77 e 79).</b> As taxas têm como fato gerador o <b>exercício regular do poder de polícia</b> ou a utilização, efetiva ou potencial, de serviço público <b>específico e divisível</b>. A taxa <b>não pode</b> ter base de cálculo ou fato gerador idênticos aos de imposto, nem ser calculada em função do capital das empresas (art. 77, p.ú.). Atenção: no poder de polícia o fato gerador é o <b>exercício regular</b> (não basta a existência potencial do órgão fiscalizador). Do estudo anterior e da memória: o STF admite a taxa de licença de localização e funcionamento quando há <b>órgão e estrutura de fiscalização</b> (Tema 16 de repercussão geral, a conferir).", "<b>Atributos (doutrina).</b> <b>Discricionariedade</b> (a lei dá margem de escolha de meio e momento; mas a licença para atividade lícita é <b>vinculada</b>); <b>autoexecutoriedade</b> (a Administração executa sem ordem judicial, quando a lei prevê ou em urgência); <b>coercibilidade</b> (imposição de medidas, inclusive com força). Exceção importante: a <b>cobrança de multa</b> não é autoexecutória, exige execução fiscal. Também é parte da doutrina que a autoexecutoriedade se divide em <b>exigibilidade</b> (decidir) e <b>executoriedade</b> (executar). Há quem inclua a <b>tipicidade</b> para a sanção (a infração e a pena devem estar previstas em lei).", "<b>Limites.</b> O poder de polícia se submete à <b>legalidade</b>, à <b>proporcionalidade</b> (adequação, necessidade e proporcionalidade em sentido estrito), ao <b>devido processo legal</b> (contraditório e ampla defesa no procedimento sancionador) e à <b>finalidade pública</b>. O desvio de finalidade e o excesso são controláveis pelo Judiciário. Súmula 70 do STF (de memória): é inadmissível a <b>interdição de estabelecimento</b> como meio coercitivo para cobrança de tributo. Súmula 547 (de memória): não é lícito à autoridade proibir que o contribuinte em débito adquira estampilhas, despache mercadorias nas alfândegas e exerça suas atividades profissionais.", "<b>Ciclo de polícia (doutrina).</b> Quatro fases: <b>ordem de polícia</b> (a lei que cria limitação), <b>consentimento</b> (licença ou autorização), <b>fiscalização</b> e <b>sanção</b>. Diferença clássica: <b>licença</b> é ato <b>vinculado</b> e definitivo (preenchidos os requisitos, o particular tem direito); <b>autorização</b> é ato <b>discricionário</b> e precário. O STJ, de memória (REsp 817.534), entendeu que só as fases de <b>consentimento e fiscalização</b> são delegáveis a particulares; <b>legislação e sanção</b> seriam indelegáveis. Confirme a posição atual antes de cravar.", "<b>Delegação.</b> Regra tradicional: o poder de polícia é indelegável a <b>particulares</b> (pessoas privadas sem vínculo estatal). Pode ser exercido por pessoas jurídicas de <b>direito público</b> (autarquias). Do estudo anterior (memória): o STF, no tema sobre delegação (RE 633.782, Tema 532), admitiu a delegação por <b>lei</b> a pessoas jurídicas de direito privado da <b>Administração indireta</b>, de capital social <b>majoritariamente público</b>, que prestem <b>exclusivamente serviço público de atuação própria do Estado em regime não concorrencial</b>. Antes disso, a ADI 1.717 afirmara que conselhos profissionais não podem ser privados (a anuidade e a fiscalização são típicas de Estado).", "<b>Competência federativa.</b> O poder de polícia é exercido por quem tem a competência legislativa sobre a matéria. O Município tem competência sobre assuntos de <b>interesse local</b>: Súmula Vinculante 38 (de memória): é competente o Município para fixar o <b>horário de funcionamento</b> de estabelecimento comercial. Também de memória, a SV 49: ofende a livre concorrência lei municipal que impede a instalação de estabelecimentos comerciais do mesmo ramo em determinado perímetro. Para Curitiba, associe: posturas, uso e ocupação do solo, funcionamento de atividade econômica e fiscalização urbanística.", "<b>Lei de Liberdade Econômica: âmbito e princípios (arts. 1º e 2º).</b> A lei institui a <b>Declaração de Direitos de Liberdade Econômica</b> e estabelece normas de proteção à livre iniciativa e ao livre exercício de atividade econômica, além de disposições sobre a atuação do Estado como agente normativo e regulador. Aplica-se ao direito civil, empresarial, econômico, urbanístico e do trabalho. <b>Interpretação</b> em favor da liberdade econômica, da boa-fé e do respeito aos contratos, aos investimentos e à propriedade. Os arts. 1º a 4º <b>não se aplicam ao direito tributário e financeiro</b>, ressalvado o inciso XI do art. 3º (medida compensatória abusiva em direito urbanístico). Princípios do art. 2º: I <b>liberdade</b> como garantia; II <b>boa-fé do particular</b> perante o poder público; III <b>intervenção subsidiária e excepcional</b> do Estado; IV <b>vulnerabilidade do particular</b> perante o Estado.", "<b>Direitos do art. 3º (selecionados).</b> I atividade econômica de <b>baixo risco</b> sem ato público de liberação, usando propriedade própria ou de terceiros consensuais; II exercer a atividade em <b>qualquer horário ou dia da semana, inclusive feriados</b>, sem encargos adicionais, observadas as normas ambientais (incluída poluição sonora), as restrições de contrato, regulamento condominial e direito de vizinhança, e a legislação trabalhista; III definir livremente o preço em <b>mercados não regulados</b>; V presunção de <b>boa-fé</b> nos atos econômicos, e dúvidas de interpretação resolvidas em favor da <b>autonomia privada</b>; VIII receber <b>prazo expresso</b> para análise do pedido; IX <b>aprovação tácita</b> se o órgão não decidir no prazo (com as ressalvas do §); X <b>arquivar documentos em meio digital</b>, equiparados ao físico; XI não sofrer <b>medida compensatória abusiva</b> em estudos de impacto (urbanístico); XII <b>não ser exigida certidão</b> sem previsão expressa em lei. Os parágrafos sobre baixo risco e aprovação tácita têm exceções e regulamentação: confira o texto.", "<b>Abuso do poder regulatório (art. 4º).</b> É dever da administração pública e das entidades vinculadas, ao editar ato normativo de interesse geral de agentes econômicos, <b>evitar</b>: I criar <b>reserva de mercado</b> em favor de grupo econômico ou profissional; II redigir enunciados que impeçam a entrada de novos competidores; III exigir <b>especificação técnica</b> desnecessária; IV impedir ou retardar a inovação, ressalvadas as situações de alto risco; V <b>aumentar custos de transação</b> sem demonstração de benefícios; VI criar <b>demanda artificial ou compulsória</b> de produto, serviço ou atividade profissional (inclusive uso de cartórios, registros ou cadastros); VII limitar a livre formação de sociedades; VIII restringir publicidade, ressalvado o vedado em lei federal; IX exigir medida compensatória ou mitigatória abusiva. O art. 4º-A trata da fiscalização de atividades econômicas (a lei adota o critério da <b>dupla visita</b> e veda termos subjetivos em infrações): li, mas não fixei a redação exata; revise no texto.", "<b>Alterações no Código Civil (art. 7º da Lei 13.874).</b> <b>Art. 49-A</b>: a pessoa jurídica não se confunde com seus sócios; a autonomia patrimonial é <b>instrumento lícito de alocação de riscos</b>. <b>Art. 50</b> (desconsideração): exige <b>abuso</b> caracterizado por <b>desvio de finalidade</b> (uso doloso da pessoa jurídica para lesar credores ou praticar ilícitos) ou <b>confusão patrimonial</b> (ausência de separação de fato entre os patrimônios, com exemplos nos incisos). Pode atingir sócio ou administrador <b>beneficiado direta ou indiretamente</b> pelo abuso; a mera existência de <b>grupo econômico</b> não autoriza a desconsideração; a mera expansão ou alteração da finalidade original <b>não</b> é desvio. <b>Art. 113, §1º</b>: a interpretação do negócio jurídico considera, entre outros, o comportamento posterior das partes, os usos e costumes do mercado, a boa-fé, o critério mais benéfico a quem não redigiu a cláusula e a razoável negociação inferida da racionalidade econômica. <b>Art. 421, p.ú.</b>: intervenção mínima do Estado e revisão contratual <b>excepcional</b>. <b>Art. 421-A</b>: contratos civis e empresariais presumem-se <b>paritários e simétricos</b> até haver elementos concretos em contrário.", "<b>Resumo operacional para prova.</b> (1) Poder de polícia: conceito do art. 78 CTN e requisitos da regularidade. (2) Atributos: discricionariedade, autoexecutoriedade, coercibilidade, com a exceção da multa. (3) Ciclo: ordem, consentimento, fiscalização, sanção; só as fases materiais seriam delegáveis (posição do STJ, a conferir). (4) Lei 13.874: princípios do art. 2º, direitos do art. 3º, abuso regulatório do art. 4º e as mudanças no CC. (5) A lei <b>não</b> vale para tributário e financeiro, salvo o inciso XI do art. 3º."], "pega": ["Conceito: a banca atribui ao <b>poder hierárquico</b> ou ao <b>disciplinar</b> o que o CTN (art. 78) define como poder de polícia. O poder de polícia atua sobre <b>particulares</b>, em nome do interesse público; hierárquico e disciplinar operam dentro da Administração.", "Taxa de polícia: a banca diz que a taxa é devida pela <b>mera existência</b> do órgão. O CTN (art. 77) exige <b>exercício regular</b> do poder de polícia. O STF (de memória) aceita a presunção de fiscalização quando há órgão e estrutura em funcionamento.", "Base de cálculo: a banca admite taxa calculada sobre o <b>capital da empresa</b>. O art. 77, p.ú., do CTN proíbe base ou fato gerador idênticos aos de imposto e cálculo em função do capital.", "Licença e autorização: a banca troca. <b>Licença</b> é vinculada e definitiva; <b>autorização</b> é discricionária e precária. Preenchidos os requisitos, a licença não pode ser negada.", "Autoexecutoriedade: a banca diz que <b>todas</b> as medidas de polícia são autoexecutórias, inclusive a cobrança de multa. A multa precisa de <b>execução fiscal</b>. E a autoexecutoriedade depende de previsão legal ou de urgência.", "Discricionariedade: a banca afirma que o poder de polícia é <b>sempre discricionário</b>. A doutrina distingue: pode haver atos <b>vinculados</b> (licença) e discricionários (autorização, escolha do meio e momento).", "Delegação: a banca afirma que o poder de polícia é <b>indelegável em qualquer hipótese</b>, ou o contrário, que pode ser delegado a <b>qualquer particular</b>. A posição do STF (de memória) é intermediária: por lei, a pessoas de direito privado da Administração indireta, capital majoritariamente público, serviço público próprio do Estado, regime não concorrencial.", "Ciclo de polícia: a banca inclui o <b>exame de mérito judicial</b> como fase, ou omite a <b>sanção</b>. As fases doutrinárias são ordem, consentimento, fiscalização e sanção.", "Meio coercitivo: a banca admite <b>interdição do estabelecimento</b> para forçar o pagamento de tributo. A Súmula 70 do STF (de memória) veda. Não confundir com interdição por infração sanitária ou de segurança.", "Competência municipal: a banca diz que o horário comercial é matéria <b>estadual ou federal</b>. SV 38 (de memória): compete ao <b>Município</b>.", "Lei 13.874, aplicação: a banca diz que a lei vale para o <b>direito tributário</b>. Os arts. 1º a 4º não se aplicam a tributário e financeiro, ressalvado o art. 3º, XI.", "Art. 3º, II: a banca diz que a atividade pode funcionar em qualquer horário <b>sem nenhuma restrição</b>. A lei ressalva normas ambientais (inclusive poluição sonora), contrato, regulamento condominial, direito de vizinhança e legislação trabalhista.", "Silêncio da Administração: a banca generaliza a <b>aprovação tácita</b> para todos os casos. O art. 3º, IX, e os parágrafos têm ressalvas e dependem de regulamento; não vale para todo ato de liberação.", "Desconsideração (CC, art. 50): a banca diz que basta a <b>insolvência</b> da sociedade. Exige abuso: <b>desvio de finalidade</b> ou <b>confusão patrimonial</b>. E a existência de grupo econômico, por si, não basta.", "Princípios do art. 2º: a banca troca a <b>intervenção subsidiária e excepcional</b> por intervenção <b>ampla e necessária</b>, ou chama de <b>hipersuficiente</b> o particular. A lei reconhece a <b>vulnerabilidade do particular</b> perante o Estado."]}, {"materia": "DIREITO CIVIL", "titulo": "Direitos reais: posse, propriedade, aquisição e perda, usucapião, servidões, usufruto, hipoteca, condomínio e vizinhança", "key": "CIV", "nome": "Civil", "conc": ["Edital: item 4 de Direito Civil (direitos reais). Li <b>literalmente</b>, no navegador, o <b>Código Civil, arts. 1.196 a 1.460</b> (posse, propriedade, superfície, servidões, usufruto, uso, habitação, direito do promitente comprador, penhor) e <b>arts. 1.473 a 1.510-E</b> (hipoteca, anticrese, laje). <b>Não li</b> os arts. 1.461 a 1.472 (penhor de veículos e legal), a Lei 6.015/1973, o Estatuto da Cidade (Lei 10.257/2001) nem a Lei 13.465/2017 (laje e regularização). Súmulas e temas citados vêm <b>da minha memória</b>.", "<b>Posse (arts. 1.196 a 1.224).</b> Possuidor é quem tem de fato o exercício, pleno ou não, de algum dos poderes inerentes à propriedade (art. 1.196). Posse <b>direta</b> e <b>indireta</b> coexistem (art. 1.197). <b>Detentor</b> é quem, em relação de dependência, conserva a posse em nome de outrem (art. 1.198). <b>Justa</b> é a posse que não é violenta, clandestina ou precária (art. 1.200). <b>Boa-fé</b>: o possuidor ignora o vício; o justo título presume a boa-fé (art. 1.201). Atos de mera <b>permissão ou tolerância</b> não induzem posse; os violentos ou clandestinos só depois de cessar a violência ou clandestinidade (art. 1.208). Perde-se a posse quando cessa o poder sobre o bem (art. 1.223).", "<b>Proteção possessória (arts. 1.210 a 1.212).</b> O possuidor tem direito a ser <b>mantido</b> na posse em caso de turbação, <b>restituído</b> no de esbulho e <b>segurado</b> de violência iminente. <b>Legítima defesa e desforço imediato</b>: permitidos desde que o faça logo e os atos não vão além do indispensável (§1º). A alegação de <b>propriedade ou outro direito</b> não obsta a manutenção ou reintegração (§2º): a posse se discute separada da propriedade (exceção possessória, não petitória). Se várias pessoas se disserem possuidoras, mantém-se provisoriamente a que tiver a coisa, se não estiver manifesto que a obteve de modo vicioso (art. 1.211).", "<b>Efeitos da posse (arts. 1.214 a 1.222).</b> <b>Boa-fé</b>: faz seus os frutos percebidos enquanto durar; responde pela perda ou deterioração só se der causa; tem direito à indenização pelas benfeitorias <b>necessárias e úteis</b> e a <b>retenção</b> por elas; pode levantar as voluptuárias sem detrimento. <b>Má-fé</b>: responde pelos frutos colhidos e pelos que deixou de perceber por culpa; responde pela perda ou deterioração, salvo prova de que ocorreriam mesmo na posse do reivindicante; só tem direito às <b>necessárias</b>, sem retenção (art. 1.220). Na indenização pelas benfeitorias devida ao possuidor de má-fé, o reivindicante opta entre valor atual e de custo (art. 1.222).", "<b>Propriedade (arts. 1.228 a 1.232).</b> Faculdades: usar, gozar, dispor e reaver (art. 1.228). Exercício conforme as finalidades econômicas e sociais (§1º). São proibidos os <b>atos emulativos</b>, sem utilidade e com intenção de prejudicar (§2º). O §3º autoriza <b>desapropriação</b> e <b>requisição</b>. <b>Desapropriação judicial privada (§§4º e 5º)</b>: imóvel reivindicado de <b>extensa área</b>, posse <b>ininterrupta e de boa-fé</b> por <b>mais de cinco anos</b> de <b>considerável número de pessoas</b>, com obras e serviços de interesse social e econômico relevante; o juiz fixa <b>justa indenização</b> e, pago o preço, a sentença vale como título para registro. O solo abrange o espaço aéreo e o subsolo em altura e profundidade úteis (art. 1.229), mas não as jazidas e minas (art. 1.230). A propriedade presume-se plena e exclusiva (art. 1.231).", "<b>Usucapião (arts. 1.238 a 1.244).</b> <b>Extraordinária</b>: <b>15 anos</b>, posse sem interrupção nem oposição, <b>independente de título e boa-fé</b>; cai para <b>10 anos</b> se o possuidor estabeleceu moradia habitual ou realizou obras ou serviços de caráter produtivo (art. 1.238). <b>Rural especial</b> (art. 1.239): <b>5 anos</b>, área rural até <b>50 hectares</b>, tornada produtiva por seu trabalho, com moradia, e sem ser proprietário de outro imóvel. <b>Urbana especial individual</b> (art. 1.240): <b>5 anos</b>, área urbana até <b>250 m²</b>, para moradia, sem ser proprietário de outro imóvel; direito não reconhecido mais de uma vez. <b>Familiar</b> (art. 1.240-A): <b>2 anos</b>, imóvel urbano até <b>250 m²</b>, posse direta e exclusiva, de propriedade dividida com ex-cônjuge ou ex-companheiro que abandonou o lar. <b>Ordinária</b> (art. 1.242): <b>10 anos</b>, com <b>justo título e boa-fé</b>; <b>5 anos</b> se adquirido onerosamente com base em registro posteriormente cancelado, com moradia ou investimentos de interesse social e econômico. A <b>soma de posses</b> (art. 1.243) exige que sejam contínuas, pacíficas e, na ordinária, com justo título e boa-fé.", "<b>Aquisição e perda da propriedade imóvel (arts. 1.245 a 1.276).</b> Transfere-se a propriedade <b>mediante o registro</b> do título translativo no Registro de Imóveis; enquanto não registrado, o alienante continua dono (art. 1.245). <b>Acessão</b>: ilhas, aluvião, avulsão, abandono de álveo e construções ou plantações (art. 1.248). Presume-se que toda construção ou plantação foi feita pelo proprietário e à sua custa (art. 1.253). Quem edifica em terreno alheio <b>perde</b> a obra em proveito do dono, mas, se de boa-fé, tem direito a <b>indenização</b>; se a obra exceder consideravelmente o valor do terreno, o construtor de boa-fé pode <b>adquirir o solo</b> mediante indenização (art. 1.255). <b>Perda</b> (art. 1.275): alienação, renúncia, abandono, perecimento, desapropriação. <b>Abandono</b> do imóvel urbano arrecadado como bem vago: após <b>3 anos</b>, passa ao <b>Município</b> (ou DF); imóvel rural, à <b>União</b> (art. 1.276). Presume-se de modo absoluto a intenção de abandonar quando cessados os atos de posse e o proprietário deixa de pagar os ônus fiscais (§2º).", "<b>Direitos de vizinhança (arts. 1.277 a 1.313).</b> O proprietário ou possuidor pode fazer cessar interferências prejudiciais à <b>segurança, ao sossego e à saúde</b> (art. 1.277). Mesmo quando toleradas por decisão judicial, o vizinho pode exigir sua redução ou eliminação quando possível (art. 1.279). <b>Árvore</b> com tronco na linha divisória pertence em comum (art. 1.282); raízes e ramos que ultrapassarem a estrema podem ser cortados até o plano vertical divisório (art. 1.283); frutos caídos pertencem ao dono do solo onde caíram (art. 1.284). <b>Passagem forçada</b> a quem não tem acesso a via pública, nascente ou porto, mediante indenização cabal (art. 1.285). <b>Janelas</b>: não se abrem a menos de <b>1,50 m</b> do terreno vizinho (art. 1.301); as que não incidem sobre a linha divisória, e as perpendiculares, a menos de <b>75 cm</b> (§1º); o vizinho tem <b>ano e dia</b> após a obra para exigir o desfazimento (art. 1.302). Na zona rural, edificações a menos de <b>3 metros</b> do terreno vizinho são proibidas (art. 1.303).", "<b>Condomínio (arts. 1.314 a 1.358-A).</b> <b>Voluntário</b>: cada condômino pode usar a coisa conforme sua destinação, reivindicá-la de terceiro, defender a posse e alienar ou gravar sua parte ideal; nenhum pode alterar a destinação nem dar posse, uso ou gozo a estranhos sem consenso (art. 1.314). A todo tempo se pode exigir a <b>divisão</b>; podem acordar indivisão por prazo não maior de <b>5 anos</b>, prorrogável (art. 1.320). Coisa indivisível que ninguém queira adjudicar é <b>vendida</b>, com <b>preferência</b> do condômino sobre o estranho (art. 1.322). <b>Edilício</b>: partes exclusivas e comuns; o solo, a estrutura e outras partes comuns são <b>insuscetíveis de divisão ou alienação destacada</b> (art. 1.331). O condômino que não cumpre reiteradamente os deveres pode ser constrangido a multa de até o <b>quíntuplo</b> da contribuição e, por comportamento antissocial reiterado, até o <b>décuplo</b> (art. 1.337, com deliberação de 3/4 e 2/3 conforme a redação lida: confira os quóruns no texto).", "<b>Rol dos direitos reais (art. 1.225).</b> São direitos reais: I propriedade; II superfície; III servidões; IV usufruto; V uso; VI habitação; VII direito do promitente comprador do imóvel; VIII penhor; IX hipoteca; X anticrese; XI concessão de uso especial para fins de moradia; XII concessão de direito real de uso; XIII laje; XIV direitos oriundos da imissão provisória na posse concedida a entes públicos, e a cessão e promessa de cessão. O rol é <b>taxativo</b> pelo princípio do <i>numerus clausus</i> (doutrina). <b>Promitente comprador</b> (arts. 1.417 e 1.418): sem arrependimento, por instrumento público ou particular, <b>registrado</b> no Registro de Imóveis, gera direito real à aquisição; pode exigir a escritura e, se houver recusa, pedir a <b>adjudicação</b>. A Súmula 239 do STJ (de memória) dispensa o registro do compromisso para a adjudicação compulsória.", "<b>Superfície, servidões, usufruto.</b> <b>Superfície</b> (arts. 1.369 a 1.377): concedida por <b>escritura pública registrada</b>, gratuita ou onerosa; transfere-se a terceiros e aos herdeiros, sem cobrança do concedente pela transferência; há <b>preferência</b> recíproca na alienação; extinta, o proprietário recupera a plena propriedade <b>sem indenização</b>, salvo cláusula contrária. <b>Servidões</b> (arts. 1.378 a 1.389): constituem-se por declaração expressa e <b>registro</b>, ou por usucapião (10 anos com justo título e boa-fé; <b>20 anos</b> sem título, art. 1.379); a servidão registrada só se extingue, em relação a terceiros, quando <b>cancelada</b> (art. 1.387); extingue-se, entre outros, por renúncia, perda da utilidade, resgate, <b>reunião dos prédios</b> no mesmo dono e <b>não uso por 10 anos</b> contínuos. <b>Usufruto</b> (arts. 1.390 a 1.411): o <b>direito</b> não se aliena, mas o <b>exercício</b> pode ser cedido (art. 1.393); extingue-se pela morte, renúncia, termo, consolidação, culpa do usufrutuário e não uso; para <b>pessoa jurídica</b>, extingue-se com a pessoa ou em <b>30 anos</b> do início do exercício (art. 1.410, III).", "<b>Hipoteca e anticrese (arts. 1.473 a 1.505; 1.506 a 1.510).</b> Podem ser hipotecados os imóveis e acessórios, o domínio direto e útil, navios, aeronaves, a propriedade superficiária, o direito real de uso, entre outros (art. 1.473). É <b>nula</b> a cláusula que proíbe o dono de alienar o imóvel hipotecado (art. 1.475), mas pode-se convencionar o <b>vencimento antecipado</b> do crédito na alienação. Pode-se constituir <b>nova hipoteca</b> sobre o mesmo imóvel (art. 1.476); o credor da segunda não executa antes de vencida a primeira, salvo insolvência do devedor (art. 1.477). Prorroga-se por averbação até <b>30 anos</b>; depois, só por novo título e novo registro (art. 1.485). <b>Hipoteca legal</b> (art. 1.489): às pessoas de direito público sobre imóveis dos responsáveis por fundos e rendas; aos filhos, sobre imóveis do pai ou mãe que casar sem inventariar; ao ofendido, sobre imóveis do delinquente; ao coerdeiro; ao credor sobre imóvel arrematado. Extingue-se pela extinção da obrigação, perecimento, resolução da propriedade, renúncia, remição, arrematação ou adjudicação (art. 1.499). A <b>anticrese</b> tem prazo máximo de <b>15 anos</b> (art. 1.423).", "<b>Propriedade resolúvel e laje (arts. 1.359, 1.360, 1.510-A a 1.510-E).</b> Resolvida a propriedade pelo implemento da condição ou pelo advento do termo, <b>resolvem-se também</b> os direitos reais concedidos na pendência, e o proprietário em cujo favor se opera a resolução pode <b>reivindicar</b> a coisa de quem a possua ou detenha (art. 1.359). Se a causa for superveniente, o possuidor que adquiriu por título anterior à sua consumação só responde pelos frutos após a ciência (art. 1.360, em síntese). <b>Direito de laje</b>: o dono da construção-base pode ceder a superfície superior ou inferior para que o titular da laje mantenha <b>unidade distinta</b> da originalmente construída; <b>não</b> implica fração ideal de terreno nem participação proporcional em áreas já edificadas; exige <b>matrícula própria</b>. Detalhes dos §§ do art. 1.510-A: li, mas revise no texto."], "pega": ["Detenção x posse: a banca diz que o <b>caseiro</b> ou o empregado que ocupa o imóvel por ordem do dono adquire posse e usucapião. É <b>detentor</b> (art. 1.198); a detenção não induz posse, e atos de <b>tolerância</b> também não (art. 1.208).", "Posse e propriedade: a banca afirma que <b>alegar domínio</b> impede a proteção possessória. O art. 1.210, §2º, diz o contrário: a alegação de propriedade <b>não obsta</b> manutenção ou reintegração.", "Desforço imediato: a banca permite a autotutela <b>sem limites</b> ou depois de muito tempo. Exige-se agir <b>logo</b> e sem ir além do indispensável (art. 1.210, §1º).", "Benfeitorias: a banca concede <b>retenção</b> ao possuidor de má-fé. A má-fé só dá direito às <b>necessárias</b>, sem retenção (art. 1.220). A boa-fé garante retenção das necessárias e úteis.", "Frutos: a banca diz que o possuidor de boa-fé <b>restitui todos</b> os frutos. Faz seus os <b>percebidos</b> enquanto a boa-fé durar (art. 1.214); os pendentes ao cessar a boa-fé devem ser restituídos.", "Usucapião extraordinária: a banca coloca <b>10 anos</b> como regra e 15 como exceção. Regra é <b>15 anos</b>; cai para <b>10</b> se há moradia habitual ou obras e serviços produtivos (art. 1.238).", "Usucapião urbana: a banca diz <b>300 m²</b> ou 10 anos. Art. 1.240: até <b>250 m²</b>, <b>5 anos</b>, moradia, sem outro imóvel urbano ou rural. A familiar (art. 1.240-A) é de <b>2 anos</b> e 250 m², com ex-cônjuge ou ex-companheiro que abandonou o lar.", "Usucapião rural: a banca troca 50 hectares por <b>250 hectares</b> ou omite a moradia. O art. 1.239 exige área até <b>50 hectares</b>, produtiva por trabalho e moradia, 5 anos.", "Bem público: a banca admite usucapião de imóvel <b>dominical</b>. O art. 102 do CC veda a usucapião de bens públicos de qualquer classe (e a CF reforça para os imóveis públicos, arts. 183, §3º, e 191, p.ú.).", "Registro: a banca diz que a <b>escritura pública</b> já transfere a propriedade imóvel. Transfere-se mediante o <b>registro</b> (art. 1.245); antes disso, o alienante continua dono.", "Abandono: a banca diz que o imóvel urbano abandonado passa à <b>União</b>. Imóvel <b>urbano</b>: Município ou DF; <b>rural</b>: União, após <b>3 anos</b> como bem vago (art. 1.276).", "Hipoteca: a banca afirma que a cláusula que <b>proíbe alienar</b> o imóvel hipotecado é válida. É <b>nula</b> (art. 1.475); válida é a cláusula de <b>vencimento antecipado</b>. E a prorrogação passa de 30 anos <b>só por novo título e novo registro</b> (art. 1.485).", "Usufruto: a banca diz que o usufruto pode ser <b>alienado</b>. Não se transfere por alienação; o <b>exercício</b> pode ser cedido (art. 1.393). Para pessoa jurídica, o limite é <b>30 anos</b>.", "Servidão: a banca fala em extinção por <b>não uso de 5 anos</b>. O prazo é de <b>10 anos contínuos</b> (art. 1.389, III). E, registrada, só se extingue perante terceiros com o <b>cancelamento</b> do registro (art. 1.387).", "Condomínio: a banca diz que a indivisão pactuada pode durar <b>10 anos</b>. O limite é <b>5 anos</b>, prorrogáveis (art. 1.320, §1º). E o condômino tem <b>preferência</b> sobre o estranho na venda da coisa indivisível (art. 1.322).", "Rol do art. 1.225: a banca inclui a <b>locação</b> ou a <b>posse</b> como direito real. A posse não consta do rol; locação é direito pessoal. Constam: superfície, laje, promitente comprador, concessões de uso etc."]}, {"materia": "DIREITO TRIBUTÁRIO E FINANCEIRO", "titulo": "Responsabilidade fiscal: LC 101/2000 (LRF) e LC municipal 101/2017 de Curitiba; poder de polícia e taxas (CTN)", "key": "TRI", "nome": "Tributário", "conc": ["Edital: item 15 de Direito Tributário e Financeiro (responsabilidade fiscal). Li <b>literalmente</b>, no navegador: a <b>LC 101/2000 (LRF), arts. 1º a 69</b>, e <b>CTN, arts. 77 a 82</b>. <b>Não li</b> os arts. 70 a 75 da LRF. <b>Atenção, aviso importante</b>: a <b>LC municipal 101/2017 de Curitiba</b> eu <b>não</b> consegui ler no texto oficial (o site que a traz bloqueou a leitura automática e o PDF oficial não pôde ser extraído). O que está abaixo sobre ela vem de um <b>resumo gerado por uma ferramenta de busca</b>, arts. 3º a 20 apenas, <b>não literal</b>, e tem pontos estranhos (marcados no texto). <b>Confira o texto oficial</b> da lei de Curitiba antes de cravar qualquer número. Decisões do STF vêm da memória.", "<b>Pressupostos (LRF, arts. 1º a 11).</b> Responsabilidade na gestão fiscal pressupõe <b>ação planejada e transparente</b>, que previna riscos e corrija desvios capazes de afetar o <b>equilíbrio das contas públicas</b>, com cumprimento de metas de resultado entre receitas e despesas e obediência a limites e condições de renúncia de receita, geração de despesas com pessoal, seguridade social, dívidas, operações de crédito e garantias (art. 1º, §1º). Aplica-se a todos os entes e Poderes, ao Ministério Público e aos Tribunais de Contas, a administração direta, fundos, autarquias, fundações e empresas estatais <b>dependentes</b> (art. 1º, §3º e art. 2º). <b>Receita corrente líquida</b> (art. 2º, IV) é o somatório das receitas correntes, deduzidas as transferências constitucionais aos Municípios (no caso dos Estados), contribuições previdenciárias dos servidores e compensações financeiras, na forma da lei. <b>Efetiva arrecadação</b> (art. 11): é requisito de responsabilidade fiscal a instituição, previsão e efetiva arrecadação de todos os tributos da competência constitucional; o ente que não os arrecada de <b>impostos</b> fica proibido de receber <b>transferências voluntárias</b> (art. 11, p.ú.).", "<b>Planejamento (arts. 4º a 10).</b> A <b>LDO</b> dispõe sobre equilíbrio entre receitas e despesas, critérios para limitação de empenho, normas de controle de custos e condições para transferências a entes privados, e traz o <b>Anexo de Metas Fiscais</b> e o <b>Anexo de Riscos Fiscais</b> (art. 4º). A <b>LOA</b> é compatível com PPA, LDO e a LRF; traz a <b>reserva de contingência</b> (art. 5º). <b>Limitação de empenho e movimentação financeira (art. 9º)</b>: ao fim de cada <b>bimestre</b>, se a receita não comportar o cumprimento das metas de resultado primário ou nominal, cada Poder e o MP promovem a limitação nos <b>30 dias</b> subsequentes. Não se limitam as <b>obrigações constitucionais e legais</b> do ente, inclusive o <b>serviço da dívida</b>, e as ressalvadas na LDO (art. 9º, §2º). Reestabelecida a receita, a recomposição é proporcional. Do estudo anterior (memória): o STF (ADI 2238) suspendeu a autorização para o Executivo limitar os demais Poderes por conta própria (§3º do art. 9º).", "<b>Renúncia de receita e despesa (arts. 14 a 17).</b> <b>Renúncia</b> (art. 14): concessão ou ampliação de incentivo tributário exige <b>estimativa de impacto orçamentário-financeiro</b> no exercício de início e nos dois seguintes, atendimento à LDO e uma de duas condições: I demonstração de que a renúncia foi considerada na estimativa de receita da LOA e não afeta as metas; II <b>medidas de compensação</b> por aumento de receita (elevação de alíquotas, ampliação da base, majoração ou criação de tributo). Exceções do §3º: alterações das alíquotas dos impostos extrafiscais federais (II, IE, IPI, IOF) e cancelamento de débito inferior ao custo da cobrança. <b>Despesa não autorizada, irregular e lesiva</b> (art. 15): a que não observa os arts. 16 e 17. <b>Art. 16</b>: criação, expansão ou aperfeiçoamento de ação governamental que acarrete aumento de despesa exige estimativa de impacto e declaração do ordenador de que há adequação orçamentária e financeira com LOA, PPA e LDO. <b>Art. 17</b>: <b>despesa obrigatória de caráter continuado</b> é a despesa corrente derivada de lei, MP ou ato administrativo normativo que fixe para o ente a obrigação legal de sua execução por <b>período superior a dois exercícios</b>; exige estimativa e <b>compensação</b> por aumento permanente de receita ou redução permanente de despesa.", "<b>Despesa com pessoal (LRF, arts. 18 a 23).</b> Despesa total com pessoal é o somatório dos gastos com ativos, inativos e pensionistas, mandatos eletivos, cargos, funções, empregos, com qualquer espécie de remuneração, vantagens, adicionais, gratificações, horas extras, mais os encargos sociais e contribuições à previdência; apura-se no mês de referência e nos <b>11 anteriores</b>, pelo regime de <b>competência</b> (art. 18). Os terceirizados que substituem servidores contam como outras despesas de pessoal (§1º). <b>Limites (art. 19 e 20)</b>: <b>Municípios 60% da RCL</b>; nos Municípios, <b>6% para o Legislativo</b> (incluído o Tribunal de Contas, quando houver) e <b>54% para o Executivo</b>. <b>Verificação quadrimestral</b> (art. 22). Se a despesa passar de <b>95% do limite</b> (limite prudencial), ficam vedados: concessão de vantagem, aumento ou reajuste (salvo revisão geral anual), criação de cargo, alteração de carreira que aumente despesa, provimento de cargo ou contratação (exceto reposição de aposentadoria ou falecimento nas áreas de educação, saúde e segurança) e hora extra (salvo as exceções legais) (art. 22, p.ú.).", "<b>Excesso e consequências (LRF, arts. 21 a 23).</b> É <b>nulo de pleno direito</b> o ato que provoque aumento de despesa com pessoal e não atenda às exigências da lei, e o ato de que resulte aumento de despesa com pessoal nos <b>180 dias anteriores ao final do mandato</b> (art. 21). Ultrapassado o limite, o percentual excedente deve ser eliminado nos <b>dois quadrimestres seguintes</b>, sendo pelo menos <b>um terço no primeiro</b>, com medidas como redução de <b>20% das despesas com cargos em comissão e funções de confiança</b> e exoneração de servidores não estáveis (art. 23, §§1º e 3º). Se persistir o excesso, o ente <b>não pode</b> receber transferências voluntárias, obter garantia de outro ente nem contratar operações de crédito (exceto refinanciamento da dívida e as destinadas à redução de despesa com pessoal) (art. 23, §3º). Do estudo anterior (memória): o STF (ADI 2238) afastou a <b>redução de jornada com redução de vencimentos</b> prevista como medida do art. 23, §2º.", "<b>Fim de mandato e outras regras (LRF).</b> <b>Art. 42</b>: é vedado, nos <b>dois últimos quadrimestres do mandato</b>, contrair obrigação de despesa que não possa ser cumprida integralmente dentro dele, ou que tenha parcelas a serem pagas no seguinte sem suficiente <b>disponibilidade de caixa</b>. <b>ARO</b> (arts. 38): só a partir do <b>décimo dia</b> do exercício, liquidada com juros até <b>10 de dezembro</b>, proibida se houver ARO anterior não resgatada e <b>no último ano do mandato</b>. <b>Alienação de bens</b> (art. 44): é vedada a aplicação da receita de capital derivada de alienação de patrimônio público ao financiamento de <b>despesa corrente</b>, salvo se destinada por lei aos regimes de previdência. <b>Calamidade</b> (art. 65): reconhecida pelo Legislativo, suspende prazos e dispensa limitação de empenho e atingimento de resultado fiscal enquanto durar.", "<b>Transparência, controle e relatórios (arts. 48 a 59).</b> Instrumentos de transparência: planos, orçamentos, LDO, prestações de contas e parecer prévio, <b>RREO</b> e <b>RGF</b>, e versões simplificadas. A transparência é assegurada também por incentivo à <b>participação popular</b> e <b>audiências públicas</b> e pela liberação, em <b>tempo real</b>, de informações pormenorizadas sobre a execução orçamentária e financeira em meios eletrônicos de acesso público (art. 48, §1º). O <b>RREO</b> é <b>bimestral</b> (art. 52) e o <b>RGF</b> é <b>quadrimestral</b> (art. 54; municípios com menos de 50 mil habitantes podem optar por semestral, art. 63). <b>Fiscalização</b> (art. 59): Poder Legislativo, com auxílio do Tribunal de Contas, sistema de controle interno e Ministério Público. Os Tribunais de Contas <b>alertam</b> os Poderes quando constatarem, entre outros, que a despesa com pessoal ultrapassou <b>90% do limite</b> (art. 59, §1º, II e III).", "<b>Poder de polícia e taxas (CTN, arts. 77 a 82).</b> Taxas cobradas no âmbito das atribuições de cada ente têm como fato gerador o <b>exercício regular do poder de polícia</b> ou a utilização, efetiva ou potencial, de serviço público <b>específico e divisível</b> (art. 77). Serviços <b>utilizados efetivamente</b> (a qualquer título) ou <b>potencialmente</b> (de utilização compulsória e postos à disposição por atividade administrativa em efetivo funcionamento); <b>específicos</b> (destacados em unidades autônomas) e <b>divisíveis</b> (suscetíveis de utilização separada por cada usuário) (art. 79). Em síntese: a taxa de serviço exige serviço específico e divisível; a taxa de polícia exige poder de polícia efetivamente exercido. Nunca base de cálculo própria de imposto (art. 77, p.ú.).", "<b>LC municipal 101/2017 de Curitiba: o que o resumo da ferramenta trouxe (arts. 3º a 20).</b> <b>Aviso</b>: abaixo, <b>paráfrase não literal</b>. <b>Art. 3º</b>: o Executivo define, em até 30 dias após a publicação dos orçamentos, a programação financeira e o cronograma mensal de desembolso; pode contingenciar despesas de forma preventiva para riscos fiscais. <b>Art. 4º e 5º</b>: ao fim de cada bimestre, se a receita não comportar as metas de resultado primário ou nominal, cada Poder limita empenho e movimentação financeira em 30 dias, de forma proporcional à sua participação no orçamento; não se limitam gastos com percentuais constitucionais e legais mínimos nem serviço da dívida; enquanto durar a limitação, o Chefe do Executivo não pode praticar atos que aumentem despesa com pessoal. <b>Art. 7º</b>: nos dois últimos quadrimestres do mandato, vedada obrigação de despesa não quitável no mandato sem caixa suficiente, com ressalvas para serviço contínuo e calamidade reconhecida pelo Legislativo. <b>Arts. 8º a 12</b>: despesa que descumpra os arts. 10 a 13 é <b>não autorizada, irregular e lesiva</b>; novos programas exigem <b>estimativa de impacto</b> para o exercício e os dois seguintes; <b>despesa obrigatória de caráter continuado</b> (mais de dois exercícios) exige compensação por receita ou redução permanente e não pode ser executada antes das medidas compensatórias; para despesas de pessoal do Executivo, há rito com pareceres da Secretaria de Finanças, jurídico, Secretaria de Recursos Humanos e Diretoria de Orçamento.", "<b>LC municipal 101/2017 (arts. 13 a 20), mesma ressalva: paráfrase.</b> <b>Art. 13</b>: despesa total com pessoal inclui ativos, inativos e pensionistas, encargos e contribuições à previdência; terceirização que substitua servidores entra como outras despesas de pessoal; apuração por competência, mês de referência mais <b>onze anteriores</b>. <b>Art. 14</b>: limite global de <b>60% da RCL</b> do Município, com exclusões (indenizações de exoneração e demissão, incentivos à demissão voluntária, certas decisões judiciais, certos gastos com inativos custeados por contribuições dos segurados ou fundo específico); valores do FUC destinados à concessão do transporte coletivo <b>não entram</b> na base da RCL. <b>Art. 15</b>: repartição: <b>Legislativo 6%</b>, <b>Executivo 54%</b>. <b>Art. 17</b>: a variação nominal da despesa com <b>pessoal ativo</b> não pode superar <b>80% da variação nominal da RCL do exercício anterior</b>, com exceção para reposição de servidores de educação, saúde e segurança. <b>Art. 18</b>: nulo de pleno direito o ato que aumente despesa com pessoal sem respeitar os limites; vedado reajuste implementado nos <b>dois últimos quadrimestres do mandato</b>. <b>Art. 19</b>: verificação quadrimestral; se a despesa passar de <b>92,6% dos limites</b> (valor que consta do resumo), devem ser reduzidas despesas com cargos em comissão e funções gratificadas, horas extras, contratos em regime integral de trabalho e serviços terceirizados. <b>Art. 20</b>: reajustes do Executivo passam pelo <b>Conselho de Gestão e Responsabilidade Fiscal</b>.", "<b>Pontos estranhos do resumo da LC 101/2017 (a conferir no texto oficial).</b> (1) O percentual de <b>92,6%</b> não é o limite prudencial da LRF federal (95%, art. 22, p.ú.). Pode ser característica da lei municipal ou erro do resumo: não afirme em prova sem o texto. (2) O resumo diz que o art. 15 remete ao &laquo;limite global do art. 15&raquo;, o que parece uma remissão ao art. 14. (3) Aparecem siglas locais (NAF, IPMC, FUC, RIT) cujo significado preciso não confirmei. (4) Não tenho o texto dos arts. 21 em diante. Plano: antes da prova, abrir o texto oficial da LC 101/2017 e conferir estes quatro pontos. Até lá, trate as regras da LC municipal como <b>espelho da LRF</b>, sem decorar números exclusivos do município."], "pega": ["Limite para Municípios: a banca diz <b>50%</b> (limite da União) ou 54% global. Município: <b>60% da RCL</b> (art. 19, III), sendo <b>6% Legislativo (com Tribunal de Contas, se houver)</b> e <b>54% Executivo</b> (art. 20, III).", "Limite prudencial: a banca diz <b>90%</b> ou 100%. A LRF fixa <b>95% do limite</b> (art. 22, p.ú.). Os <b>90%</b> são o gatilho do <b>alerta do Tribunal de Contas</b> (art. 59, §1º).", "Vedações do art. 22, p.ú.: a banca inclui <b>revisão geral anual</b> entre as vedadas. É a <b>ressalva</b>: a revisão geral é permitida. Também permitidas as reposições de aposentadoria ou falecimento em educação, saúde e segurança.", "Prazo de eliminação do excesso: a banca diz <b>um ano</b> ou três quadrimestres. LRF: <b>dois quadrimestres</b> seguintes, com <b>pelo menos 1/3 no primeiro</b> (art. 23).", "Sanções do art. 23, §3º: a banca diz que o ente perde o <b>FPM</b> ou as transferências constitucionais. Perde só <b>transferências voluntárias</b>, garantia de outro ente e acesso a operações de crédito (exceto refinanciamento e redução de pessoal).", "Apuração da despesa com pessoal: a banca diz <b>regime de caixa</b> ou 12 meses seguintes. É <b>regime de competência</b>, mês de referência mais <b>11 anteriores</b> (art. 18, §2º).", "Despesa obrigatória de caráter continuado: a banca diz <b>mais de um exercício</b>. A LRF diz <b>mais de dois exercícios</b> (art. 17). A LC municipal, no resumo, repete <b>dois exercícios</b>.", "Limitação de empenho: a banca diz <b>trimestral</b> ou semestral. É <b>bimestral</b> (art. 9º), com prazo de <b>30 dias</b>. E não alcança as obrigações constitucionais e legais nem o serviço da dívida.", "Art. 42: a banca coloca o último <b>ano</b> do mandato inteiro ou o último semestre. São os <b>dois últimos quadrimestres</b> do mandato.", "Nulidade do art. 21: a banca diz que o ato é <b>anulável</b> ou <b>válido</b> até declaração. A lei diz <b>nulo de pleno direito</b>, e o prazo de <b>180 dias anteriores ao final do mandato</b> aparece no art. 21, II.", "RREO e RGF: a banca troca as periodicidades. <b>RREO bimestral</b>, <b>RGF quadrimestral</b> (municípios com menos de 50 mil habitantes podem optar por semestral).", "Transparência: a banca diz que a LRF dispensa <b>participação popular</b>. O art. 48, §1º, prevê <b>audiências públicas</b> e liberação, em <b>tempo real</b>, de informações pormenorizadas em meios eletrônicos de acesso público.", "Alienação de ativos (art. 44): a banca permite usar a receita de venda de bens para <b>despesa corrente</b>. Em regra, vedado; a exceção é a destinação por lei aos <b>regimes de previdência</b>.", "Taxa de polícia: a banca diz que basta <b>potencialidade</b> do exercício do poder de polícia. O CTN exige <b>exercício regular</b> (art. 77). Já a taxa de serviço admite utilização <b>efetiva ou potencial</b> (art. 79).", "LC municipal 101/2017: a banca inventa percentuais próprios ou troca o que é da LRF federal. Confira o texto; <b>não dependa do resumo</b>. Os que trago (<b>60%, 6%, 54%, 80% da variação da RCL, 92,6%</b>) foram da paráfrase e precisam de conferência."]}, {"materia": "DIREITO PROCESSUAL CIVIL", "titulo": "Prática eletrônica dos atos processuais: CPC, arts. 193 a 199 e Lei 11.419/2006", "key": "PCV", "nome": "Proc. Civil", "conc": ["Edital: item 15 de Processo Civil (prática eletrônica dos atos processuais). Li <b>literalmente</b>, no navegador: a <b>Lei 11.419/2006 inteira</b> (arts. 1º a 22) e, do <b>CPC</b>, os <b>arts. 183, 193 a 199, 228, 229, 231, 246 (redação da Lei 14.195/2021), 270, 272, 1.050 e 1.051</b>. <b>Não reli</b> a Resolução CNJ 185/2013 (PJe) nem as normas do TJPR sobre o sistema; a Lei 14.195/2021 fora do art. 246 também não. Súmulas e precedentes vêm <b>da minha memória</b>. Como a redação do art. 246 mudou, <b>confira a numeração dos parágrafos</b> antes de citar na prova.", "<b>Atos processuais digitais no CPC (arts. 193 a 199).</b> Os atos processuais podem ser <b>total ou parcialmente digitais</b>, de forma a permitir que sejam produzidos, comunicados, armazenados e validados por meio eletrônico (art. 193); isso vale, no que couber, a atos notariais e de registro. Os sistemas respeitam a <b>publicidade</b>, o acesso e a participação das partes e procuradores, inclusive em audiências e sessões, e as garantias de <b>disponibilidade, independência de plataforma, acessibilidade e interoperabilidade</b> (art. 194). O registro do ato eletrônico deve ser feito em <b>padrões abertos</b> que atendam a autenticidade, integridade, temporalidade, <b>não repúdio</b>, conservação e, em segredo de justiça, <b>confidencialidade</b> (art. 195). Compete ao <b>CNJ</b> e, supletivamente, aos tribunais, regulamentar a prática e a comunicação oficial por meio eletrônico (art. 196).", "<b>Informações do sistema e acesso (arts. 197 a 199).</b> Os tribunais divulgam as informações de seus sistemas em página própria na internet, e essa divulgação goza de <b>presunção de veracidade e confiabilidade</b> (art. 197). Em caso de problema técnico do sistema ou erro ou omissão do auxiliar da Justiça no registro dos andamentos, pode haver <b>justa causa</b> (art. 223, caput e §1º). As unidades do Judiciário devem manter, <b>gratuitamente</b>, equipamentos para a prática de atos e consulta (art. 198); será admitida a prática de atos por <b>meio não eletrônico</b> se os equipamentos ou sistemas não estiverem disponíveis. Assegura-se <b>acessibilidade</b> às pessoas com deficiência nos sítios dos tribunais (art. 199).", "<b>Lei 11.419/2006: âmbito e assinatura (arts. 1º e 2º).</b> A lei disciplina o uso de meio eletrônico na tramitação de processos, comunicação de atos e transmissão de peças; aplica-se aos processos <b>civil, penal e trabalhista</b>, bem como aos <b>juizados especiais</b>, em qualquer grau de jurisdição (art. 1º, §1º). <b>Assinatura eletrônica</b>: a) <b>assinatura digital</b> baseada em certificado digital emitido por autoridade certificadora credenciada; b) mediante <b>cadastro de usuário</b> no Judiciário (art. 1º, §2º, III). O envio de petições por meio eletrônico exige <b>credenciamento prévio</b> no Poder Judiciário, com <b>identificação presencial</b> do interessado, e atribuição de registro e meio de acesso (art. 2º, §§1º e 2º). Os órgãos podem criar <b>cadastro único</b> (art. 2º, §3º).", "<b>Tempestividade (arts. 3º e 10).</b> Os atos por meio eletrônico consideram-se realizados no <b>dia e hora do recebimento pelo sistema</b> do Judiciário, que fornece <b>protocolo eletrônico</b> (art. 3º). A petição eletrônica é tempestiva se transmitida até as <b>24 horas</b> do último dia do prazo (art. 3º, p.ú., e art. 10, §1º). Se o sistema ficar <b>indisponível por motivo técnico</b>, o prazo é automaticamente <b>prorrogado para o primeiro dia útil seguinte à resolução do problema</b> (art. 10, §2º). No processo eletrônico, advogados públicos e privados podem distribuir a inicial e juntar contestação, recursos e petições <b>diretamente</b>, sem intervenção do cartório; a autuação é automática e há recibo eletrônico (art. 10).", "<b>Diário da Justiça eletrônico (art. 4º).</b> Os tribunais podem criar o <b>DJe</b>, para publicação de atos judiciais e administrativos e comunicações em geral. A publicação eletrônica substitui qualquer outro meio e publicação oficial para quaisquer efeitos legais, <b>exceto</b> os casos em que a lei exija <b>intimação ou vista pessoal</b>. Considera-se data da publicação o <b>primeiro dia útil seguinte</b> ao da disponibilização, e os prazos começam no <b>primeiro dia útil seguinte à publicação</b> (§§3º e 4º). No CPC, art. 231, V: quando a citação ou intimação for eletrônica, o prazo começa no <b>dia útil seguinte à consulta</b> ao teor ou ao <b>término do prazo para a consulta</b>.", "<b>Intimação eletrônica (art. 5º).</b> Feita em <b>portal próprio</b> aos que se cadastrarem, dispensando publicação no órgão oficial. Considera-se realizada <b>no dia em que o intimando efetivar a consulta</b> ao teor, com certidão nos autos (§1º). Se a consulta ocorrer em dia não útil, a intimação considera-se feita no <b>primeiro dia útil seguinte</b> (§2º). A consulta deve ser feita em até <b>10 dias corridos</b> contados do envio; <b>escoado o prazo, a intimação é realizada automaticamente</b> na data do término (§3º). O aviso por e-mail é <b>meramente informativo</b> (§4º). Em casos urgentes, ou de tentativa de burla ao sistema, o ato pode ser realizado por outro meio, por determinação do juiz (§5º). As intimações assim feitas, <b>inclusive da Fazenda Pública</b>, são <b>pessoais</b> para todos os efeitos legais (§6º).", "<b>Citação e comunicações (arts. 6º a 9º).</b> Observadas as formas e cautelas do art. 5º, as citações, inclusive da Fazenda Pública, <b>exceto as do processo penal e infracional</b>, podem ser eletrônicas, desde que a <b>íntegra dos autos</b> seja acessível ao citando (art. 6º). Cartas precatórias, rogatórias, de ordem e comunicações oficiais entre órgãos serão feitas <b>preferencialmente</b> por meio eletrônico (art. 7º). Os órgãos podem desenvolver sistemas de autos <b>total ou parcialmente digitais</b> (art. 8º). No processo eletrônico, <b>todas</b> as citações, intimações e notificações, inclusive da Fazenda Pública, são feitas por meio eletrônico, e as que viabilizem o acesso à íntegra do processo valem como <b>vista pessoal</b> (art. 9º, §1º). Se for inviável por motivo técnico, usam-se as regras ordinárias, <b>digitalizando-se o documento físico</b>, que será destruído (§2º).", "<b>Documentos eletrônicos e digitalizados (arts. 11 a 13).</b> Documentos produzidos eletronicamente e juntados com garantia de origem e signatário são <b>originais</b> para todos os efeitos (art. 11). Os documentos <b>digitalizados</b> juntados por órgãos da Justiça, Ministério Público, procuradorias, polícia, repartições públicas e advogados têm <b>a mesma força probante dos originais</b>, ressalvada a alegação motivada de adulteração antes ou durante a digitalização (§1º). A arguição de falsidade processa-se eletronicamente (§2º). Os originais devem ser preservados pelo detentor até o <b>trânsito em julgado</b> ou, se cabível, até o fim do prazo da <b>rescisória</b> (§3º). Documento de digitalização inviável (volume ou ilegibilidade) é apresentado em <b>10 dias</b> a contar do envio da petição que comunica o fato (§5º). O acesso aos documentos digitalizados pela rede externa é restrito às <b>partes e ao Ministério Público</b>, respeitado o sigilo (§6º). O juiz pode determinar o envio eletrônico de dados e documentos de cadastros públicos, ainda que de concessionárias ou empresas privadas (art. 13).", "<b>Demais regras da Lei 11.419.</b> <b>Art. 14</b>: sistemas desenvolvidos pelos órgãos do Judiciário usam, <b>preferencialmente</b>, programas de <b>código aberto</b>, acessíveis ininterruptamente pela rede mundial e padronizados. <b>Art. 15</b>: salvo impossibilidade que comprometa o acesso à Justiça, a parte informa, ao distribuir a inicial, o <b>número de CPF ou CNPJ</b> perante a Receita. <b>Art. 16</b>: livros cartorários e repositórios podem ser gerados e armazenados em meio totalmente eletrônico. <b>Art. 19</b>: ficam <b>convalidados</b> os atos processuais por meio eletrônico praticados até a publicação da lei, desde que tenham atingido a finalidade e não tenha havido prejuízo. Arts. 17, 18, 20 a 22: não os reli com atenção especial; revise se a banca cobrar vigência e alterações no CPC de 1973 (já revogado).", "<b>Prazos e Fazenda Pública no CPC.</b> A <b>Fazenda Pública</b> tem prazo <b>em dobro</b> para todas as manifestações processuais, com <b>intimação pessoal</b> por carga, remessa ou meio eletrônico (art. 183, caput e §1º); a regra não vale quando a lei estabelecer <b>prazo próprio</b> (§2º). O art. 229, §2º, afasta o prazo em dobro para litisconsortes com procuradores diferentes quando os autos são <b>eletrônicos</b>: <b>não</b> há prazo em dobro nesse caso. O art. 270 manda fazer as intimações, sempre que possível, por <b>meio eletrônico</b>, e o p.ú. estende ao MP, Defensoria e Advocacia Pública o disposto no §1º do art. 246. Os arts. 1.050 e 1.051 impõem o <b>cadastro</b> de entes públicos e de empresas para receber citações e intimações eletrônicas (prazo e redação: confira no texto).", "<b>Citação eletrônica (CPC, art. 246, redação da Lei 14.195/2021).</b> A citação será feita <b>preferencialmente por meio eletrônico</b>, no prazo de até <b>2 dias úteis</b> contados da decisão que a determinar, pelos endereços eletrônicos indicados pelo citando no banco de dados do Poder Judiciário. Com exceção das <b>microempresas e empresas de pequeno porte</b>, as empresas públicas e privadas são obrigadas a manter <b>cadastro</b> nos sistemas de autos eletrônicos. A citação eletrônica deve ser <b>confirmada</b> em até <b>3 dias úteis</b>; na ausência de confirmação, e sem justa causa, a citação é feita pelos demais meios (o CPC prevê consequência para a omissão injustificada, a conferir no texto). Para a Fazenda, o CPC aplica o cadastro e a citação eletrônica à administração direta e indireta."], "pega": ["Prazo da petição eletrônica: a banca diz que o último dia vai até as <b>18 horas</b> ou o fim do expediente forense. Lei 11.419, art. 3º, p.ú., e art. 10, §1º: até as <b>24 horas</b> do último dia.", "Indisponibilidade do sistema: a banca exige que a parte <b>peça nova abertura</b> de prazo ou que o ato seja protocolado em papel. Art. 10, §2º: o prazo se <b>prorroga automaticamente</b> para o primeiro dia útil seguinte à resolução do problema. Atenção ao motivo: <b>motivo técnico</b> do sistema do Judiciário.", "Intimação eletrônica: a banca diz que se considera realizada no <b>envio</b> ou na <b>leitura do e-mail</b>. É realizada no dia da <b>consulta ao teor</b>, ou, sem consulta, no <b>décimo dia corrido</b> do envio (art. 5º, §§1º e 3º). O e-mail é <b>informativo</b>.", "Prazo de consulta: a banca troca <b>10 dias corridos</b> por 10 dias úteis, 5 ou 15 dias. A lei diz <b>10 dias corridos</b>. Já o CPC, art. 231, V, fixa o começo do prazo no <b>dia útil seguinte</b> à consulta ou ao término do prazo para a consulta.", "Consulta em dia não útil: a banca diz que a intimação vale no mesmo dia. Art. 5º, §2º: considera-se feita no <b>primeiro dia útil seguinte</b>.", "Fazenda Pública: a banca diz que a intimação eletrônica da Fazenda <b>não é pessoal</b>, por não ter carga ou remessa. Art. 5º, §6º, da Lei 11.419: as intimações eletrônicas, <b>inclusive da Fazenda</b>, são <b>pessoais</b>. O CPC (art. 183, §1º) admite intimação pessoal por <b>meio eletrônico</b>.", "Prazo em dobro: a banca diz que a <b>Fazenda perde</b> o prazo em dobro nos autos eletrônicos. O art. 229, §2º, só afasta o prazo em dobro para <b>litisconsortes com procuradores diferentes</b>. A <b>Fazenda</b> continua com prazo em dobro (art. 183), salvo prazo próprio.", "DJe: a banca diz que a publicação no DJe <b>substitui</b> toda intimação, inclusive a pessoal. O art. 4º, §2º, ressalva os casos em que a lei exige <b>intimação ou vista pessoal</b>. Data da publicação: <b>primeiro dia útil seguinte</b> à disponibilização; prazo conta do dia útil seguinte à publicação.", "Citação eletrônica penal: a banca diz que a Lei 11.419 permite citação eletrônica no <b>processo penal</b>. O art. 6º <b>exclui</b> as citações do direito processual criminal e infracional. E exige que a <b>íntegra dos autos</b> seja acessível ao citando.", "Documentos digitalizados: a banca diz que têm força probante <b>inferior</b> ao original ou exigem autenticação. O art. 11, §1º: <b>mesma força probante</b>, ressalvada alegação motivada de adulteração. Os originais devem ser guardados até o <b>trânsito em julgado</b> ou o fim do prazo da rescisória.", "Acesso a documentos: a banca diz que os documentos digitalizados estão acessíveis a <b>qualquer pessoa</b> pela rede externa. Art. 11, §6º: só <b>partes e Ministério Público</b>, respeitado o sigilo.", "Assinatura: a banca diz que só vale a assinatura digital com certificado. Há <b>duas</b>: digital com certificado de AC credenciada e <b>cadastro de usuário</b> no Judiciário (art. 1º, §2º, III). O credenciamento exige <b>identificação presencial</b>.", "Aplicação da lei: a banca diz que a Lei 11.419 se limita ao processo <b>civil</b>. Aplica-se também ao <b>penal</b>, <b>trabalhista</b> e aos <b>juizados especiais</b>, em qualquer grau.", "Atos digitais no CPC: a banca atribui a regulamentação ao <b>Tribunal local</b> exclusivamente. O art. 196 atribui ao <b>CNJ</b> e, supletivamente, aos tribunais. E o art. 198 impõe que as unidades mantenham <b>gratuitamente</b> equipamentos, admitindo a prática de ato <b>não eletrônico</b> se o sistema não estiver disponível.", "Citação eletrônica: a banca diz que se exige citação por oficial de justiça como regra. O CPC, art. 246 (Lei 14.195/2021), faz da citação eletrônica a <b>forma preferencial</b>, em até <b>2 dias úteis</b>, com confirmação em <b>3 dias úteis</b>. As <b>microempresas e empresas de pequeno porte</b> ficam <b>fora</b> da obrigação de cadastro."]}], "23": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Intervenção do Estado na propriedade: limitação, tombamento, servidão, requisição, ocupação temporária e desapropriação (DL 3.365/1941, Lei 4.132/1962, DL 25/1937)", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 12 de Direito Administrativo. Li <b>literalmente</b>, no navegador (Planalto): <b>DL 3.365/1941 inteiro (arts. 1º a 43, com as alterações das Leis 13.867/2019, 13.465/2017, 14.421/2022 e 14.620/2023)</b>; <b>Lei 4.132/1962 inteira</b>; <b>DL 25/1937 inteiro</b>. <b>Não li</b> a Constituição (arts. 5º, XXIV, XXV, 182, 184 e 243), a Lei 8.629/1993, o Estatuto da Cidade nem a legislação municipal de Curitiba sobre patrimônio e zoneamento. Súmulas (STF e STJ), a ADI 2.332 e os temas de repercussão geral citados vêm <b>da minha memória</b> e não foram conferidos. A classificação das modalidades de intervenção é doutrina.", "<b>Panorama.</b> A propriedade se submete à função social, e o Estado pode intervir de dois modos: <b>intervenção restritiva</b> (o proprietário conserva o domínio, mas sofre limites: limitação administrativa, ocupação temporária, requisição, servidão, tombamento) e <b>intervenção supressiva</b> (o domínio é transferido: desapropriação). A regra para fixar a indenização, de memória: a restrição <b>geral e abstrata</b> (limitação administrativa) em regra não indeniza; a rest
