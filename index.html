é o de mais de 500 m² com <b>75% de desocupação por 3 anos</b> (art. 136). A notificação é <b>averbada</b>; os prazos são <b>1 ano</b> para protocolar o projeto, <b>2 anos</b> para iniciar as obras e <b>5 anos</b> para a conclusão (art. 138). O <b>IPTU progressivo</b> dura <b>5 anos</b>, com alíquota <b>dobrada a cada ano</b>, teto de <b>15%</b> e <b>sem isenção ou anistia</b> (art. 139). Depois, a desapropriação é paga em <b>títulos</b> (art. 140).", "<b>Preempção, outorga, TDC, OUC, PDR, RDU e EIV (arts. 142 a 180).</b> <b>Preempção</b>: vigência de até <b>5 anos</b>, renovável após <b>1 ano</b> (arts. 142 a 145). <b>Outorga onerosa</b> (arts. 146 a 151): permite edificar acima do coeficiente básico mediante contrapartida; os acréscimos máximos de coeficiente variam por zona (<b>até 2</b> nos eixos estruturantes, de adensamento, na ocupação mista e nas residenciais média e alta; <b>até 1</b> em baixa densidade, ocupação controlada e destinação específica, art. 149); as vias hierarquizadas dão <b>+1</b>; <b>sem isenção</b> para novas edificações, salvo HIS (art. 150, parágrafo único). <b>TDC</b> (arts. 152 a 156): para imóveis com limitação ambiental ou cultural, doação ao Município etc. <b>OUC</b> (arts. 157 a 165): coordenada pelo IPPUC; o <b>CEPAC</b> só se converte em direito de construir <b>na área da operação</b> (art. 163). <b>PDR</b> (arts. 166 a 168) é elaborado pelo IPPUC e aprovado por ato do Executivo. <b>Reparcelamento (RDU)</b> exige <b>lei específica</b> (arts. 169 a 175). <b>EIV</b> (arts. 176 a 180): completo, simplificado ou RAP; <b>não dispensa o EIA</b>.", "<b>Gestão democrática e disposições finais (arts. 181 a 194).</b> Compõem a gestão democrática o <b>CONCITIBA</b>, as audiências públicas, a conferência e a iniciativa popular (arts. 181 a 189). A <b>alteração do Plano</b> exige participação popular e oitiva do CONCITIBA (art. 188). O <b>licenciamento prévio</b> é exigido para qualquer edificação, reforma, demolição ou obra (art. 193). A lei vigora desde a publicação, em <b>17/12/2015</b> (art. 194).", "<b>Zoneamento: estrutura (Lei 15.511/2019, arts. 1º a 110).</b> A lei divide o território em <b>eixos, zonas e setores especiais</b> e é de <b>observância obrigatória</b> para alvarás, planos, obras, urbanização e parcelamento (arts. 1º e 5º). <b>Eixos Estruturantes</b> (EE, ENC, EMF, EAC, EMLV): sistema trinário, com o <b>Plano Massa</b> na via central, que garante a continuidade da testada comercial (art. 11) e que o Conselho Municipal de Urbanismo pode dispensar (art. 12); recuo mínimo de <b>10 m</b> nas vias externas, cedido sem ônus (art. 13); <b>vedado</b> usar a frente do térreo para garagem (art. 14). Nos eixos de adensamento (EACF, EACB, Conectores), a <b>fruição pública</b> é obrigatória em trechos como Costa Barros/Mercer Júnior e Wenceslau Braz. <b>Zonas</b> (art. 34): ZC (central; proíbe balanço, admite marquise), <b>ZR</b> (ZR1 a ZR4, ZROC e ZROI), <b>ZUM</b> (inclusive <b>Vale do Pinhão</b>, ZUMVP, com coeficiente básico <b>1 por tipo de uso até 3</b>) e <b>ZDE</b> (ZE, ZM, ZPS, ZH, ZCC, ZCSF, ZCUM, ZS, ZI). Em ZROC-1 (Campo de Santana), o loteamento reserva <b>10% a equipamentos comunitários</b>, <b>10% a lazer</b> e <b>15% a HIS</b> (art. 48); na ZROI, <b>40%</b> da área vai ao Município (art. 51). Na ZH, o imóvel tombado pode chegar a <b>coeficiente 4</b> com a <b>transferência total do potencial</b> (art. 73, parágrafo único, hoje com a redação da Lei 16.448/2024).", "<b>Zoneamento: setores especiais, usos e parâmetros (arts. 94 a 239).</b> <b>Setores especiais</b> (art. 94): SEPE, SEPP, SEP, SEDE, SEAHM, SEVB, SEAV, SESA e SEHIS; novos setores nascem de <b>ato do Executivo</b>, por proposta do IPPUC (art. 95). O <b>SEVB</b> (vias) trata faixa de <b>80 m</b> ou metade da quadra (o que ocorrer primeiro); nas <b>vias prioritárias</b>, abrange todo o lote. <b>Uso do solo</b> (arts. 161 a 189): é admitida mais de uma edificação por lote; a lei <b>veda</b> atividade não contemplada na zona (art. 165), embora o CMU possa autorizar (art. 166); o <b>alvará de localização é sempre precário</b> e pode ser <b>cassado</b> por incômodo, periculosidade ou nocividade, inclusive por <b>manifestação da vizinhança</b> (art. 167). Tipos habitacionais: <b>em série</b> (4 a 20 unifamiliares), <b>conjunto</b> (mais de 20) e <b>coletiva</b> (mais de 2 unidades autônomas verticais); conjuntos só em lotes de até <b>20.000 m²</b> (art. 169). <b>Porte</b> (art. 185): <b>pequeno até 400 m²</b>, <b>médio de 400 a 2.000 m²</b>, <b>grande acima de 2.000 m²</b>. Usos classificam-se em <b>permitidos, permissíveis e omissos</b> (art. 188). <b>Densidade</b>: ZR1 <b>1 UH/300 m²</b>; ZROC-1 e 2 <b>1 UH/2.000 m²</b>; demais ZR <b>1 UH/120 m²</b> (arts. 209 a 212). O <b>recuo frontal</b> admite balanço de até <b>1,20 m</b> (art. 202, § 2º). Em <b>infrações</b>: cassação do alvará, embargo, multa e demolição (art. 237). Validade de projetos: <b>1 ano</b> sem início de obras (art. 234); vigência <b>180 dias</b> após a publicação; revoga as Leis 7.529/1990 e 9.800/2000 (art. 239).", "<b>Suspensão do Zoneamento (Lei 15.626/2020).</b> Suspendeu por <b>120 dias</b> a aplicação da Lei 15.511, <b>sem revogá-la nem alterar</b> a legislação vigente (§ 1º); o Executivo podia regulamentar a suspensão e a retomada (§ 2º); vigência na publicação, com <b>efeitos retroativos a 07/04/2020</b>, inclusive para contagem do prazo. Segundo a página da Secretaria de Urbanismo, o zoneamento está em vigor <b>desde 05/08/2020</b> (informação lida na página, não em lei).", "<b>Potencial construtivo adicional (Lei 16.361/2024).</b> Os acréscimos aos parâmetros básicos da Lei 15.511 dependem de três instrumentos: <b>outorga onerosa (OODC)</b>, <b>transferência do direito de construir (TDC)</b> e <b>cotas de potencial construtivo (CPC)</b> (arts. 1º e 2º). Os recursos da <b>OODC</b> se distribuem assim (art. 6º): <b>70% ao FMHIS</b>, <b>5% ao FUNRECAL</b> (patrimônio natural), <b>5% ao FUNPAC</b> (patrimônio cultural), <b>10% ao Município</b> (equipamentos) e <b>até 10%</b> a critério do Executivo. Fórmula (art. 9º): <b>Vp = (A / Ca) × Vu × Fc</b>, com <b>Fc de 0,15</b> (pavimentos), <b>0,75</b> (coeficiente) e <b>1,0</b> (uso e porte não habitacional); com mais de uma situação, <b>prevalece o maior valor</b>. O <b>IPU</b> (art. 10) é de <b>0,3</b>, por <b>2 anos</b> (prorrogáveis), para habitação na ZC e na ZR4 lindeiras a certos eixos. O art. 11 divide <b>50% por OODC e 50% por TDC</b>; o art. 12 <b>isenta</b> a OODC de HIS e habitação coletiva da COHAB. A <b>TDC</b> (arts. 14 a 26) se faz em <b>duas etapas</b> (certidão de concessão e certidão de transferência) e se averba; <b>Pc = Ptr × Vur/Vuc × Cc/Cr × Fc</b>, com <b>Fc 0,55</b> (edificação do patrimônio cultural), <b>0,75</b> (RPPNM e demais) e <b>0,15</b> (pavimentos); o potencial se <b>restabelece a cada 15 anos</b> se o bem estiver conservado e transferido o total (art. 26). A <b>CPC</b> (arts. 27 a 32): <b>1 cota = 1 m²</b>. As <b>certidões</b> de OODC e CPC valem <b>4 anos</b>, prorrogáveis por <b>até 4 anos</b>, com taxa de <b>1%</b> ao FMHIS (art. 35); os recursos só custeiam <b>despesas de capital</b> (art. 33). Revoga a <b>Lei 15.661/2020</b> (art. 40).", "<b>Prêmios e incentivos construtivos (Lei 16.448/2024).</b> <b>Prêmio</b> compensa o cumprimento de regras urbanísticas especiais; <b>incentivo construtivo</b> são parâmetros diferenciados condicionados a obrigações do empreendedor; <b>condições especiais</b> são parâmetros diferenciados em face de restrições (art. 2º). O <b>Plano Massa</b> (arts. 5º a 11) funciona na <b>Via Central</b>: o <b>embasamento comercial</b> premia com <b>mínimo de 50% do terreno no térreo</b> (até 100%), galeria coberta e testada contínua (art. 7º); a <b>torre exclusivamente comercial</b> recebe <b>1,5 vez a área do terreno</b> (art. 8º); nas <b>Outras Vias</b>, até <b>1×</b> a área, não computada (art. 10); nas <b>Vias Externas</b>, <b>+1×</b> se a torre for exclusivamente habitacional (art. 11). <b>Fruição pública</b> (arts. 12 a 14): <b>obrigatória</b> em Marechal Floriano, Affonso Camargo, EACB e Conector Leste 3 (Wenceslau Braz); o prêmio vai até o <b>dobro</b> da área de fruição; área mínima de <b>50 m²</b>, até <b>20% do lote</b>. <b>Passagens e praças internas</b> (art. 15): diâmetro mínimo de <b>8 m</b>; incentivo de <b>1×</b> a área. <b>Fachada ativa</b> (arts. 16 a 19): <b>+1 pavimento não oneroso</b> habitacional. <b>Galerias comerciais na ZC</b> (arts. 20 a 22): largura mínima de <b>4 m</b> e pé-direito de <b>2,80 m</b>; incentivo de <b>2×</b> a área da galeria. No <b>patrimônio cultural</b> (arts. 24 a 29): na transferência <b>total</b>, a área da edificação preservada se acresce ao potencial; na <b>parcial</b>, a área preservada <b>não computa</b> no coeficiente nem na taxa de ocupação; o art. 30 admite <b>coeficiente até 4</b> para imóveis tombados e listados no Anexo I da Lei 14.794 (UIP), com transferência total. Revoga a <b>Lei 15.824/2021</b> (art. 37).", "<b>Patrimônio Cultural (Lei 14.794/2016).</b> Abrange bens <b>materiais e imateriais</b>, públicos ou privados (art. 1º); a gestão é da <b>Fundação Cultural de Curitiba (FCC)</b> e, no edificado, da SMU e do IPPUC (art. 3º). Os instrumentos <b>plenos</b> são o <b>tombamento</b> e o <b>registro</b>; os <b>auxiliares</b>, o <b>inventário</b> e a <b>vigilância</b> (art. 4º), esta de caráter <b>subsidiário</b> (arts. 17 a 19). O <b>tombamento</b> declara singularidade e excepcionalidade e <b>dispensa inventário prévio</b> (art. 8º, § 3º); o bem tombado ou em processo <b>não pode ser demolido, destruído, mutilado ou movido</b>. O proprietário conserva às suas custas (art. 10); sem recursos, requer ao <b>CMPC</b> com plano de trabalho de até <b>24 meses</b> (art. 11), exceto <b>obras urgentes</b> (art. 12). Os procedimentos exigem contraditório com prazo <b>não inferior a 30 dias</b> (arts. 20 e 21). <b>Multas</b> (calculadas sobre o valor do bem): destruir ou demolir, <b>50% a 80%</b> (art. 30); reformar sem autorização, <b>20% a 70%</b> (art. 31); deixar de conservar, <b>30% a 80%</b> (art. 32); entorno, <b>10% a 50%</b> (art. 33); plano protelatório, <b>20%</b> (art. 34); impugnação em <b>30 dias</b> (art. 38). A <b>reincidência</b> não prevalece após <b>5 anos</b> (art. 26); a multa pode ser aumentada até o <b>dobro</b> (art. 27); admite-se <b>redução de até 2/3</b> por caso fortuito, força maior ou culpa de terceiro, com restauração em até <b>24 meses</b> (art. 28). <b>Incentivos</b> (arts. 40 a 47): redução de IPTU, incentivo construtivo averbado, potencial restabelecido a cada <b>15 anos</b>; a área do bem protegido <b>não computa</b> no coeficiente nem na TO (art. 47). O <b>CMPC</b> é consultivo e deliberativo (presidente: o da FCC; vice: o do IPPUC; <b>14 titulares</b>, sendo 7 do Executivo; mandato de <b>2 anos</b>, com uma recondução) e revê os benefícios a cada <b>4 anos</b>. O <b>FUNPAC</b> recebe multas, doações e condenações em ACP. A infração <b>suspende imediatamente</b> os benefícios, e o bem pode ser <b>desapropriado</b> a qualquer momento, abatendo-se as multas da indenização (arts. 60 a 64).", "<b>Código de Posturas: alvarás e obras (Lei 11.095/2004, arts. 1º a 100).</b> Regula a aprovação de projetos, o licenciamento de obras e atividades e a manutenção das obras. O profissional precisa ser <b>habilitado no CREA e licenciado pelo Município</b>, e o Município <b>não assume responsabilidade técnica</b> (art. 3º). O <b>alvará de licença</b> é obrigatório para construção, ampliação, reforma, demolição, redes, antenas, tapume, caçamba, publicidade e atividades (art. 9º); a aprovação é cancelada se a obra não começa ou é interrompida e passam <b>180 dias</b> do prazo (art. 24, § 1º). O <b>CVCO</b> (certificado de vistoria de conclusão) vem após a conclusão; se não expedido no prazo, o interessado <b>pode ocupar</b> (art. 30, § 3º). O <b>alvará de localização e funcionamento</b> antecede a atividade (arts. 32 a 44); o temporário vale até <b>30 dias</b> (art. 35); o <b>ambulante</b> tem licença <b>individual e intransferível</b> (arts. 40 a 44). Na <b>vistoria administrativa</b>, o edital antecede em <b>3 dias úteis</b>; obras <b>paralisadas há mais de 30 dias</b> ou em ruínas exigem vedação e vigilância (arts. 58 a 70). A <b>limpeza do passeio</b> cabe ao proprietário; em eventos, termina em até <b>8 horas</b> após (arts. 90 a 98).", "<b>Código de Posturas: instalações, penalidades e recursos (arts. 101 a 360).</b> Nas instalações: <b>inspeção anual de segurança</b> (art. 130); elevadores obrigatórios se o piso mais alto estiver a mais de <b>9,50 m</b> (art. 134); <b>marquise</b> com balanço máximo de <b>2,00 m</b> (art. 167); inflamáveis a <b>4 m</b> das divisas e <b>10 m</b> do alinhamento (art. 185). <b>Penalidades</b> (art. 193): cassação, interdição, embargo, demolição, suspensão, apreensão e multa, <b>sem hierarquia</b> e cumuláveis. O <b>auto de infração</b> exige <b>verificação pessoal</b>, e a mera denúncia não basta (art. 210, § 2º); o prazo de pagamento da multa é de <b>10 dias</b>, sob pena de dívida ativa; há <b>redução de até 90%</b> por circunstância atenuante (art. 211). As multas por obra sem licença vão de <b>R$ 200 a R$ 500</b> por faixa de área; para imóvel de valor cultural, de <b>R$ 4.000 a R$ 32.000</b>; a demolição de imóvel de valor cultural sem alvará chega a <b>R$ 100.000</b>; <b>embargo descumprido</b>: <b>triplo</b> da soma das multas (art. 344); <b>reincidência</b>: <b>dobro</b>, em <b>24 meses</b> (art. 345). <b>Recursos</b> (arts. 347 a 349): <b>defesa prévia em 10 dias</b> ao diretor do órgão e <b>recurso hierárquico em 10 dias</b> ao Secretário, última instância. Os valores acima são os da versão compilada de 2014 e podem ter sido corrigidos por decreto (art. 346)."], "pega": ["Natureza do Plano Diretor: a banca diz que o Plano Diretor de Curitiba abrange apenas a <b>área urbana</b> definida por perímetro. A lei diz que abrange <b>todo o território municipal</b>, <b>completamente urbano</b> (art. 3º).", "Direito adquirido: a banca diz que a alteração do Zoneamento gera <b>direito a indenização</b> por parâmetros anteriores. A lei diz que valem os parâmetros da lei vigente <b>à época da análise</b>, sem direito adquirido ou indenização (PD, art. 21).", "PEUC e IPTU progressivo: a banca diz que o IPTU progressivo pode ter alíquota livre, com isenção para pequenos proprietários. A lei diz que a alíquota <b>dobra</b> a cada ano, com teto de <b>15%</b>, por <b>5 anos</b>, e que <b>é vedada isenção ou anistia</b> (PD, art. 139).", "Imóvel não edificado: a banca diz que é todo lote vazio, de qualquer tamanho. A lei diz que é o lote ou gleba com <b>2.000 m² ou mais</b>, ou qualquer área na zona central, no setor histórico ou em SEHIS de Vazios (PD, art. 136).", "Pedágio urbano: a banca diz que o Plano Diretor admite o <b>rodízio de placas</b> em situações críticas. A lei <b>proíbe</b> o pedágio urbano e o rodízio de placas (PD, art. 40, parágrafo único).", "Alvará de localização: a banca diz que o alvará de localização é <b>definitivo</b> e só se cassa por decisão judicial. A lei diz que é <b>sempre a título precário</b> e pode ser cassado por incômodo, periculosidade ou nocividade, até com base na <b>manifestação da vizinhança</b> (Zoneamento, art. 167).", "Porte: a banca diz que porte grande é acima de <b>1.000 m²</b>. A lei diz <b>pequeno até 400 m², médio de 400 a 2.000 m², grande acima de 2.000 m²</b> (Zoneamento, art. 185).", "Suspensão do zoneamento: a banca diz que a Lei 15.626/2020 <b>revogou</b> o Zoneamento. A lei diz que <b>suspendeu por 120 dias</b>, sem revogar nem alterar a legislação vigente, com efeitos retroativos a <b>07/04/2020</b> (art. 1º, § 1º).", "Distribuição da outorga: a banca diz que a outorga onerosa vai toda para o caixa geral do Município. A lei diz <b>70% FMHIS, 5% FUNRECAL, 5% FUNPAC, 10% Município e até 10% a critério do Executivo</b> (Lei 16.361/2024, art. 6º).", "Validade das certidões: a banca diz que a certidão de OODC ou CPC vale <b>indefinidamente</b>. A lei diz <b>4 anos</b>, prorrogáveis por <b>até 4 anos adicionais</b>, com taxa de 1% e sem devolução do valor pago (Lei 16.361/2024, art. 35).", "Tombamento: a banca diz que o tombamento exige <b>inventário prévio</b> e que o bem inventariado pode sofrer intervenção livre. A lei diz que o tombamento <b>dispensa inventário</b> (art. 8º, § 3º) e que o bem inventariado <b>não pode sofrer intervenção sem autorização prévia</b> (art. 7º, Lei 14.794).", "Reincidência no patrimônio: a banca diz que a reincidência vale por <b>10 anos</b>. A lei diz que <b>não prevalece após 5 anos</b> (art. 26, Lei 14.794); a multa por destruir ou demolir é de <b>50% a 80%</b> do valor do bem (art. 30).", "Posturas: a banca diz que a multa por <b>embargo descumprido</b> é de uma vez a soma das multas e que a reincidência não tem agravante. A lei diz <b>triplo</b> (art. 344) e <b>dobro</b> na reincidência dentro de 24 meses (art. 345); defesa prévia e recurso têm <b>10 dias</b> cada.", "Alvará em loteamento: a banca diz que se concede alvará em qualquer lote de loteamento não aprovado. A lei diz que <b>não se concede</b> alvará em lotes de loteamento não aprovado (Posturas, art. 10, § 4º), salvo COHAB-CT e regularização fundiária a critério do Município (§ 5º)."]}, {"materia": "DIREITO EMPRESARIAL", "titulo": "Defesa da concorrência: Lei 12.529/2011 (Sistema Brasileiro de Defesa da Concorrência, CADE, infrações, penas, procedimentos, TCC, leniência e atos de concentração)", "key": "EMP", "nome": "Empresarial", "conc": ["Edital: item de Direito Empresarial sobre a <b>ordem econômica e a defesa da concorrência</b>. Li <b>literalmente</b>, no navegador (Planalto), a <b>Lei 12.529/2011 inteira (arts. 1º a 128)</b>. Uma ressalva: o <b>início do art. 9º</b> (lista de competências do Tribunal) <b>não foi relido</b> com o cuidado das demais partes. Os <b>valores em reais</b> e os critérios de faturamento resumidos aqui são os do <b>texto da lei</b>; as <b>portarias interministeriais</b> que os atualizam (por exemplo, para as notificações do art. 88) <b>não foram lidas</b>, e o <b>regimento interno do CADE</b> também não. A jurisprudência do STJ e do STF e a doutrina vêm <b>da minha memória</b> e precisam de conferência. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Sistema e órgãos (arts. 1º a 20).</b> A lei estrutura o <b>Sistema Brasileiro de Defesa da Concorrência (SBDC)</b>: o <b>CADE</b> (autarquia federal vinculada ao Ministério da Justiça) e a <b>Secretaria de Acompanhamento Econômico (Seae)</b>. O CADE tem o <b>Tribunal Administrativo</b>, a <b>Superintendência-Geral (SG)</b> e o <b>Departamento de Estudos Econômicos (DEE)</b>. O <b>Tribunal</b> tem <b>1 Presidente e 6 Conselheiros</b>, com mais de 30 anos, notório saber jurídico ou econômico e reputação ilibada, nomeados pelo Presidente da República <b>após aprovação do Senado</b>, com mandato de <b>4 anos, sem recondução</b>. O Presidente tem <b>voto de qualidade</b> e os processos são distribuídos por <b>sorteio</b> (art. 10). A <b>SG</b> tem <b>1 Superintendente e 2 Adjuntos</b>, também com mais de 30 anos, mandato de <b>2 anos</b>, com uma recondução (art. 12). A <b>Procuradoria Federal</b> junto ao CADE tem Procurador-Chefe com mais de 30 anos, mandato de <b>2 anos</b> e uma recondução (arts. 15 e 16). O <b>MPF</b> oficia nos processos (art. 20). As <b>taxas processuais</b> são de <b>R$ 85.000</b> (análise de atos do art. 88) e <b>R$ 15.000</b> (consultas) (art. 23). As multas revertem ao <b>Fundo de Defesa de Direitos Difusos</b> (art. 28, § 3º).", "<b>Aplicação e responsabilidade (arts. 31 a 35).</b> A lei se aplica a <b>pessoas físicas ou jurídicas</b>, de direito público ou privado, mesmo sob <b>monopólio legal</b> (art. 31). Respondem <b>solidariamente</b> a empresa e seus dirigentes ou administradores (art. 32) e as empresas do <b>mesmo grupo econômico</b> (art. 33). A <b>desconsideração da personalidade jurídica</b> é possível por abuso de direito, excesso de poder, infração à lei ou falência, estado de insolvência, encerramento ou inatividade provocados por má administração (art. 34).", "<b>Infração à ordem econômica (art. 36).</b> Constituem infração os atos que tenham por objeto ou possam produzir: limitar ou prejudicar a <b>livre concorrência</b>; <b>dominar mercado relevante</b>; <b>aumentar arbitrariamente lucros</b>; ou <b>exercer abusivamente posição dominante</b>. A infração é <b>objetiva</b>: configura-se <b>independentemente de culpa</b>, ainda que os efeitos não sejam alcançados. <b>Posição dominante</b> presume-se quando a empresa controla <b>20% ou mais</b> do mercado relevante (§ 2º, parâmetro ajustável pelo CADE para setores específicos). O § 3º traz um <b>rol exemplificativo</b> (cartel: acordo sobre preços, quantidades, divisão de mercados e licitações; conduta uniforme ou concertada; preços predatórios; venda casada; recusa de venda; discriminação; exclusividade; imposição de preços de revenda).", "<b>Penas (arts. 37 a 45).</b> A <b>empresa</b> paga multa de <b>0,1% a 20% do faturamento bruto</b> do ramo de atividade no ano anterior à instauração do processo, <b>nunca inferior à vantagem auferida</b>, quando for possível estimá-la. As demais pessoas físicas ou jurídicas sem faturamento pagam de <b>R$ 50.000 a R$ 2 bilhões</b>. O <b>administrador</b> responsável paga de <b>1% a 20%</b> da multa da empresa, por <b>culpa ou dolo</b>. Na <b>reincidência</b>, a multa é aplicada em <b>dobro</b>. <b>Penas acessórias</b> (art. 38): publicação do extrato da decisão; <b>proibição de contratar com instituições financeiras oficiais e de participar de licitação</b> por <b>no mínimo 5 anos</b>; inscrição no cadastro de defesa do consumidor; <b>licença compulsória</b> de patentes; <b>cisão</b> ou transferência de controle; proibição de exercer o comércio por até 5 anos. Há ainda multas processuais: <b>multa diária de R$ 5.000</b> (até 50 vezes, art. 39); <b>recusa de informações</b>: <b>R$ 5.000 por dia</b> (art. 40); <b>falta injustificada</b>: <b>R$ 500 a R$ 15.000</b> (art. 41); <b>obstrução à inspeção</b>: <b>R$ 20.000 a R$ 400.000</b> (art. 42); <b>informação falsa ou enganosa</b>: <b>R$ 5.000 a R$ 5 milhões</b> (art. 43); <b>quebra de sigilo</b>: <b>R$ 1.000 a R$ 20.000</b> (art. 44). A dosimetria segue critérios do art. 45 (gravidade, boa-fé, vantagem, consumação, efeitos, situação econômica e reincidência).", "<b>Prescrição e reparação (arts. 46 a 47-A).</b> A pretensão <b>punitiva</b> prescreve em <b>5 anos</b>, contados da data da prática do ilícito ou, nas infrações permanentes ou continuadas, do dia em que cessou; <b>interrompe-se por qualquer ato</b> de apuração, e a <b>prescrição intercorrente</b> é de <b>3 anos</b> (art. 46, § 3º). A <b>reparação de danos (art. 46-A)</b> prescreve em <b>5 anos</b>, contados da <b>ciência inequívoca do ilícito</b>, que ocorre com a <b>publicação do julgamento final do CADE</b>. A <b>ação de indenização</b> é <b>independente</b> do processo administrativo (art. 47) e, nos <b>cartéis</b>, a indenização é em <b>dobro</b> (§ 1º); quem celebrou <b>leniência ou TCC</b> responde só pelos <b>próprios danos</b>; o <b>sobrepreço não se presume repassado</b> (§ 4º). O art. 47-A admite a <b>tutela da evidência</b> com base nas conclusões do CADE.", "<b>Procedimentos e processo administrativo (arts. 48 a 84).</b> A lei prevê <b>seis tipos</b> de procedimentos. O <b>procedimento preparatório</b> (30 dias) e o <b>inquérito administrativo</b> (de natureza <b>inquisitorial</b>) apuram os fatos; o inquérito dura <b>180 dias</b>, prorrogáveis por <b>até 60</b> (art. 66). Após a instauração do <b>processo administrativo</b>, o representado apresenta <b>defesa em 30 dias</b> (art. 70), com até <b>3 testemunhas</b> por fato; a <b>revelia</b> gera confissão sobre a matéria de fato, mas o revel pode intervir no estado em que o processo se encontra (art. 71). O Plenário pode adotar <b>medida preventiva</b> (art. 84), e do despacho cabe <b>recurso ao Plenário em 5 dias</b>, sem efeito suspensivo. A decisão é publicada em até <b>5 dias úteis</b> e constitui <b>título executivo extrajudicial</b> (art. 93).", "<b>TCC e leniência (arts. 85 a 87).</b> O <b>termo de compromisso de cessação (TCC)</b> é cabível a critério de <b>conveniência e oportunidade</b>; é <b>público</b>, só pode ser proposto <b>uma vez</b> e <b>não suspende</b> o processo (que fica suspenso apenas enquanto cumprido o termo); no <b>cartel</b>, a contribuição pecuniária não é inferior ao <b>mínimo do art. 37</b>; é <b>título executivo extrajudicial</b>. O <b>acordo de leniência</b> (art. 86) concede <b>extinção da ação punitiva</b> ou <b>redução de 1 a 2/3</b> da pena. Exige: ser o <b>primeiro</b> a se qualificar; <b>cessar</b> o envolvimento; a SG <b>não dispor de provas suficientes</b> para condenar; <b>confissão</b> e <b>cooperação</b>. O descumprimento gera <b>impedimento por 3 anos</b>. O art. 87 estende efeitos aos <b>crimes</b> (suspensão do prazo prescricional, e extinção da punibilidade com o cumprimento).", "<b>Atos de concentração (arts. 88 a 91).</b> Devem ser <b>previamente submetidos</b> ao CADE os atos em que (I) um grupo envolvido tenha faturamento bruto no Brasil, no ano anterior, de <b>R$ 400 milhões ou mais</b> e (II) outro grupo, <b>R$ 30 milhões ou mais</b>. Os critérios são <b>cumulativos</b> e podem ser alterados por <b>portaria interministerial</b>. O <b>controle é prévio</b> e o CADE decide em até <b>240 dias</b>, prorrogáveis por <b>60 dias</b> (a pedido das partes) ou por <b>90 dias</b> (decisão do Tribunal). A <b>consumação antes da aprovação</b> é nula e gera multa de <b>R$ 60 mil a R$ 60 milhões</b>, além de abertura de processo (gun jumping, art. 88, § 3º). São <b>vedados</b> os atos que eliminem a concorrência em parte substancial do mercado ou criem ou reforcem posição dominante, <b>ressalvadas as eficiências</b>, desde que repassada parte relevante aos consumidores (§§ 5º e 6º). O CADE pode, em até <b>1 ano</b> da consumação, requisitar a submissão de atos <b>fora dos critérios</b> (§ 7º). O art. 90 define a concentração (fusão, aquisição de controle ou partes, incorporação, contrato associativo, consórcio ou <b>joint venture</b>, exceto licitações). O Tribunal pode <b>aprovar</b>, <b>rejeitar</b> ou aprovar <b>com restrições</b> (venda de ativos, cisão, licenciamento etc., art. 61, § 2º). Da aprovação pela SG cabe <b>recurso de terceiros em 15 dias</b> e <b>avocação</b> por Conselheiro (art. 65). A <b>revisão</b> da aprovação (art. 91) gera multa de <b>R$ 60 mil a R$ 6 milhões</b>.", "<b>Execução e disposições finais (arts. 93 a 128).</b> A decisão do Plenário é <b>título executivo extrajudicial</b>; a execução segue a <b>Lei 6.830/1980</b>, na <b>Justiça Federal do DF</b> ou da <b>sede ou domicílio do executado</b>, à escolha do CADE (art. 97); os <b>embargos</b> só suspendem a execução se o juízo estiver <b>garantido</b> (art. 98). Em casos graves cabe <b>intervenção judicial</b> na empresa, por até <b>180 dias</b> (arts. 102 a 111; o prazo máximo é de <b>180 dias</b>, com nomeação de interventor). Aplicam-se subsidiariamente o CPC, a Lei 7.347/1985, o CDC e a Lei 9.784/1999 (art. 115). O CADE é <b>intimado como assistente</b> nas ações sobre a matéria (art. 118). <b>Dumping e subsídios</b> ficam fora da lei (art. 119). A lei foi assinada em <b>30/11/2011</b> e entrou em vigor <b>180 dias</b> após a publicação (art. 128); revogou a <b>Lei 8.884/1994</b> (em parte)."], "pega": ["Natureza da infração: a banca diz que a infração à ordem econômica exige <b>culpa ou dolo</b> da empresa. A lei diz que é <b>objetiva</b>, <b>independe de culpa</b> e não exige que os efeitos sejam alcançados (art. 36).", "Posição dominante: a banca diz que se presume com <b>51%</b> do mercado. A lei diz que se presume com <b>20%</b> do mercado relevante, parâmetro que o CADE pode alterar para setores específicos (art. 36, § 2º).", "Multa: a banca diz que a multa da empresa é de <b>1% a 30%</b> do faturamento total. A lei diz <b>0,1% a 20%</b> do faturamento bruto do <b>ramo de atividade</b> no ano anterior à instauração, nunca inferior à vantagem auferida (art. 37, I); o administrador paga <b>1% a 20% da multa da empresa</b>; a reincidência <b>dobra</b>.", "Notificação: a banca diz que basta <b>um</b> grupo atingir o faturamento previsto. A lei exige <b>cumulativamente</b> R$ 400 milhões para um grupo e R$ 30 milhões para outro (art. 88, I e II), e o controle é <b>prévio</b>, com <b>nulidade e multa</b> se consumado antes (§ 3º).", "Prazo de análise: a banca diz que o CADE decide em <b>120 dias</b>. A lei diz <b>240 dias</b>, prorrogáveis por <b>60 dias</b> (partes) ou <b>90 dias</b> (Tribunal) (art. 88, §§ 2º e 9º).", "Mandatos: a banca diz que os Conselheiros têm mandato de <b>2 anos com recondução</b>. A lei diz <b>4 anos, sem recondução</b> (Tribunal), e <b>2 anos com uma recondução</b> para o Superintendente-Geral e o Procurador-Chefe (arts. 6º, 12 e 15).", "Leniência: a banca diz que qualquer cooperador tem extinção da pena. A lei diz que o benefício exige ser o <b>primeiro</b> a se qualificar e a SG <b>não ter provas suficientes</b>, e a pena é <b>extinta</b> ou <b>reduzida de 1 a 2/3</b> (art. 86); o descumprimento gera <b>3 anos</b> de impedimento.", "TCC: a banca diz que o TCC suspende o processo desde a proposta e pode ser proposto várias vezes. A lei diz que é cabível a critério de <b>conveniência e oportunidade</b>, é proposto <b>uma só vez</b> e é <b>título executivo extrajudicial</b> (art. 85).", "Prescrição: a banca diz que a pretensão punitiva do CADE prescreve em <b>10 anos</b> e a reparação, em <b>3 anos</b>. A lei diz <b>5 anos</b> (punitiva), com <b>intercorrente de 3 anos</b>, e <b>5 anos</b> para a reparação, a partir da <b>ciência inequívoca</b> (arts. 46 e 46-A).", "Indenização: a banca diz que o cartel gera indenização <b>simples</b> e que o sobrepreço é sempre presumido repassado. A lei diz que o cartel gera indenização em <b>dobro</b> (art. 47, § 1º) e que o <b>repasse do sobrepreço não se presume</b> (§ 4º)."]}], "27": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Responsabilidade dos prefeitos: Decreto-Lei 201/1967 (crimes de responsabilidade, infrações político-administrativas, rito, extinção do mandato) e a Lei Orgânica de Curitiba", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 15 de Direito Administrativo, <b>segunda parte</b> (responsabilidade dos prefeitos, DL 201/67). Base: <b>DL 201/1967</b> inteiro, <b>CF art. 29</b>, <b>Lei Orgânica de Curitiba</b> (art. 20 e arts. 68 a 78). Jurisprudência: <b>Súmula Vinculante 46</b>, <b>Súmulas 164 e 208 do STJ</b> e <b>Súmulas 702 e 703 do STF</b>.", "<b>Duas responsabilidades diferentes.</b> O DL 201 trata de <b>(1) crimes de responsabilidade</b> (art. 1º), julgados pelo <b>Poder Judiciário</b>, <b>independentemente do pronunciamento da Câmara</b>; e de <b>(2) infrações político-administrativas</b> (art. 4º), julgadas pela <b>Câmara de Vereadores</b>, com sanção de <b>cassação do mandato</b>. As duas vias <b>não se excluem</b> e correm em separado. O art. 3º estende o processo ao <b>Vice-Prefeito</b> ou a quem substituir o Prefeito, ainda que a substituição já tenha cessado.", "<b>Crimes do art. 1º.</b> São 23 incisos. Os dois primeiros são os mais graves: <b>(I) apropriar-se</b> de bens ou rendas públicas, ou desviá-los em proveito próprio ou alheio, e <b>(II) utilizar-se indevidamente</b> de bens, rendas ou serviços públicos. Pena de <b>reclusão, de 2 a 12 anos</b>. Os demais têm pena de <b>detenção, de 3 meses a 3 anos</b>. Exemplos: aplicar verbas indevidamente (III), despesas não autorizadas em lei (V), <b>deixar de prestar contas</b> (VI e VII), empréstimo sem autorização da Câmara (VIII), <b>comprar sem concorrência</b> quando exigida (XI), <b>antecipar ou inverter a ordem de pagamento sem vantagem para o erário</b> (XII), nomear ou admitir servidor contra expressa disposição de lei (XIII), <b>negar execução a lei ou descumprir ordem judicial sem dar o motivo por escrito</b> (XIV), não fornecer certidões no prazo (XV). Os incisos <b>XVI a XXIII</b> vieram da <b>Lei 10.028/2000</b> (ligados à Lei de Responsabilidade Fiscal: dívida consolidada, crédito sem autorização, operação de crédito, restos a pagar, antecipação de receita). São crimes de <b>ação pública</b> (§ 1º). A <b>condenação definitiva</b> traz <b>perda do cargo</b> e <b>inabilitação por 5 anos</b> para cargo ou função pública, sem prejuízo da reparação civil (§ 2º).", "<b>Processo judicial (art. 2º).</b> Segue o <b>rito comum do juízo singular</b>, com três modificações. <b>(I)</b> O réu é notificado para <b>defesa prévia em 5 dias, antes</b> de a denúncia ser recebida. <b>(II)</b> Ao receber a denúncia, o juiz deve manifestar-se <b>obrigatória e motivadamente</b> sobre a <b>prisão preventiva</b> (só nos crimes dos <b>incisos I e II</b> do art. 1º) e sobre o <b>afastamento do cargo</b> durante a instrução (cabível em <b>todos</b> os casos). <b>(III)</b> Cabe <b>recurso em sentido estrito em 5 dias</b>, em autos apartados, com <b>efeito suspensivo</b> quando decretadas a prisão ou o afastamento. Os órgãos <b>federais, estaduais ou municipais interessados</b> podem requerer ação penal e <b>intervir como assistentes de acusação</b> em qualquer fase (§ 1º); se a autoridade policial ou o MP estadual não atenderem, o pedido vai ao <b>Procurador-Geral da República</b> (§ 2º).", "<b>Infrações político-administrativas (art. 4º).</b> Julgadas pela <b>Câmara</b>, com <b>cassação</b>: <b>(I)</b> impedir o funcionamento regular da Câmara; <b>(II)</b> impedir exame de livros, folhas de pagamento e documentos, ou a verificação de obras; <b>(III)</b> desatender, sem motivo justo, a convocações ou pedidos de informação; <b>(IV)</b> retardar ou deixar de publicar leis e atos; <b>(V)</b> deixar de apresentar a proposta orçamentária no tempo devido; <b>(VI)</b> descumprir o orçamento aprovado; <b>(VII)</b> praticar, contra expressa disposição de lei, ato de sua competência ou omitir-se; <b>(VIII)</b> omitir-se ou negligenciar na defesa de bens, rendas, direitos ou interesses do Município; <b>(IX)</b> ausentar-se do Município por tempo superior ao permitido em lei, ou afastar-se da Prefeitura sem autorização da Câmara; <b>(X)</b> proceder de modo incompatível com a dignidade e o decoro do cargo.", "<b>Rito de cassação (art. 5º).</b> Aplica-se se <b>outro não for estabelecido pela legislação do Estado</b>. <b>(I)</b> A denúncia escrita pode ser feita por <b>qualquer eleitor</b>; o Vereador denunciante fica <b>impedido de votar</b> e de integrar a comissão. <b>(II)</b> O Presidente da Câmara lê a denúncia na primeira sessão e consulta sobre o recebimento, que exige <b>maioria dos presentes</b>. A <b>comissão processante</b> tem <b>3 Vereadores sorteados</b>. <b>(III)</b> O denunciado é notificado e tem <b>10 dias</b> para defesa prévia, com direito a até <b>10 testemunhas</b>; a comissão emite parecer em <b>5 dias</b>. <b>(IV)</b> O denunciado deve ser intimado dos atos com <b>antecedência mínima de 24 horas</b>. <b>(V)</b> Concluída a instrução, vista para razões escritas em <b>5 dias</b>; no julgamento, cada Vereador fala até <b>15 minutos</b> e a defesa até <b>2 horas</b>. <b>(VI)</b> A votação é <b>nominal</b>, por infração; o Prefeito é afastado se declarado culpado pelo voto de <b>2/3 dos membros da Câmara</b>, por decreto legislativo. <b>(VII)</b> O processo deve terminar em <b>90 dias contados da notificação</b>; passado o prazo, é <b>arquivado</b>, sem prejuízo de nova denúncia, mesmo sobre os mesmos fatos.", "<b>Extinção do mandato (art. 6º).</b> A <b>extinção</b> do mandato do Prefeito é <b>declarada pelo Presidente da Câmara</b>, e não depende de deliberação do plenário, nos casos de <b>falecimento</b>, <b>renúncia por escrito</b>, <b>cassação dos direitos políticos</b> ou <b>condenação por crime funcional ou eleitoral</b>, e também se deixar de tomar posse sem motivo justo ou incidir em impedimento sem desincompatibilizar-se. Já a <b>cassação</b> (art. 4º) <b>depende</b> do julgamento da Câmara. Não confundir os dois institutos. Os arts. 7º e 8º tratam de forma parecida os <b>Vereadores</b>.", "<b>Constituição e Curitiba.</b> A CF art. 29 prevê o <b>julgamento do Prefeito perante o Tribunal de Justiça</b> (inciso X) e a perda do mandato nos termos do art. 28, parágrafo único (inciso XIV). A <b>LOM de Curitiba</b> diz que cabe <b>privativamente à Câmara</b> processar e julgar o Prefeito e os Secretários nas infrações político-administrativas (art. 20, XIV) e <b>destituir</b> o Prefeito e o Vice <b>após condenação transitada em julgado</b> por crime comum ou de responsabilidade (XVI). O art. 71 proíbe o Prefeito de se ausentar do <b>País ou do Município</b> por mais de <b>15 dias</b> sem autorização da Câmara, <b>sob pena de perda do cargo</b>. O <b>art. 75</b> remete os crimes de responsabilidade, as infrações, as sanções e o rito a <b>lei complementar</b> e ao <b>Regimento Interno</b>: aqui está a <b>pegadinha com a SV 46</b>, pois o município <b>não pode legislar</b> sobre crime de responsabilidade e seu processo.", "<b>Jurisprudência.</b> <b>SV 46:</b> a definição dos crimes de responsabilidade e das normas de processo e julgamento é de competência <b>legislativa privativa da União</b> (convertida da Súmula 722). <b>Súmula 702 do STF:</b> a competência do TJ para julgar prefeitos restringe-se aos crimes de competência da <b>Justiça Comum estadual</b>; nos demais casos, cabe ao respectivo tribunal de segundo grau (por exemplo, o TRF nos crimes federais). <b>Súmula 703 do STF</b> e <b>Súmula 164 do STJ:</b> a <b>extinção do mandato não impede</b> o processo pelos crimes do art. 1º. <b>Súmula 209 do STJ</b> (<b>Justiça estadual</b> para desvio de verba transferida e incorporada ao patrimônio municipal) e <b>Súmula 208</b> (<b>Justiça Federal</b> se a verba está sujeita a prestação de contas perante órgão federal). Em improbidade, a mera sujeição à prestação de contas ao TCU não basta, por si só, para a competência federal."], "pega": ["Assistente de acusação: a banca diz que só o Ministério Público e o ofendido participam da acusação. O DL 201 diz que os órgãos <b>federais, estaduais ou municipais interessados</b> podem <b>intervir como assistentes de acusação em qualquer fase</b> (art. 2º, § 1º).", "Recurso: a banca diz que o despacho que decreta a prisão preventiva do prefeito desafia <b>apelação em 10 dias</b>. A lei diz <b>recurso em sentido estrito em 5 dias</b>, com <b>efeito suspensivo</b> (art. 2º, III).", "Defesa prévia: a banca diz que o prefeito é interrogado primeiro, ou que a defesa vem depois do recebimento da denúncia. A lei diz que a <b>notificação para defesa prévia (5 dias) vem antes</b> do recebimento da denúncia (art. 2º, I).", "Prisão preventiva: a banca diz que cabe em <b>qualquer crime</b> do art. 1º, decretada <b>de ofício</b> para garantir a ordem pública. A lei diz que o juiz deve manifestar-se <b>motivadamente</b> e que a preventiva só se refere aos crimes dos <b>incisos I e II</b>; o <b>afastamento do cargo</b>, esse sim, vale para todos (art. 2º, II).", "Penas: a banca diz que todos os crimes do art. 1º têm reclusão. A lei diz que só os dos <b>incisos I e II</b> têm <b>reclusão (2 a 12 anos)</b>; os demais têm <b>detenção (3 meses a 3 anos)</b>. A perda do cargo e a <b>inabilitação por 5 anos</b> dependem de <b>condenação definitiva</b> (§ 2º).", "Quórum de cassação: a banca diz que a cassação exige maioria simples ou 2/3 dos presentes. A lei diz <b>2/3 dos membros da Câmara</b> (art. 5º, VI); já o <b>recebimento</b> da denúncia exige <b>maioria dos presentes</b> (art. 5º, II).", "Prazo do processo: a banca diz que a Câmara tem 180 dias para julgar. A lei diz <b>90 dias contados da notificação</b>; o decurso do prazo gera <b>arquivamento</b>, sem impedir <b>nova denúncia</b> (art. 5º, VII).", "Quem denuncia: a banca diz que só Vereador ou o Ministério Público pode denunciar. A lei diz <b>qualquer eleitor</b> (art. 5º, I); o Vereador denunciante fica impedido de votar e de integrar a comissão.", "Extinção do mandato: a banca diz que a renúncia precisa ser votada pela Câmara. A lei diz que a extinção é <b>declarada pelo Presidente da Câmara</b>, e a renúncia deve ser <b>escrita</b> (art. 6º).", "Lei Orgânica municipal: a banca diz que o Município pode definir em sua lei orgânica os crimes de responsabilidade e o rito. A <b>SV 46</b> diz que a competência é <b>privativa da União</b>; é a armadilha do <b>art. 75 da LOM de Curitiba</b>.", "Fim do mandato: a banca diz que, terminado o mandato, o ex-prefeito deixa de responder pelos crimes do art. 1º. As <b>Súmulas 703 do STF e 164 do STJ</b> dizem que <b>continua sujeito a processo</b>."]}, {"materia": "DIREITO DO TRABALHO", "titulo": "Item 1: princípios e fontes, proteção constitucional do trabalho, relação de trabalho e de emprego (CLT, CF art. 7º e 114, Reforma Trabalhista e EC 141/2026)", "key": "TRB", "nome": "Trabalho", "conc": ["Edital: primeiro item de Direito do Trabalho (<b>princípios e fontes, proteção constitucional, relação de trabalho e relação de emprego</b>). Base normativa: <b>CLT arts. 1º a 12, 442 a 452-A e 611-A e 611-B</b>; <b>CF arts. 6º, 7º, 114 e 170</b>; <b>EC 141/2026</b>; <b>LC 150/2015</b> (doméstico, com a Lei 15.455/2026); <b>Lei 5.889/1973</b> (rural); <b>Lei 6.019/1974</b> (temporário e terceirização); <b>Lei 11.788/2008</b> (estágio); <b>Lei 13.874/2019</b> (liberdade econômica). Jurisprudência: <b>ADI 3395</b> (STF) e <b>Súmula 331 do TST</b>. O item 2 do edital (regimes funcionais) fica para outro PDF.", "<b>Fontes e princípios (CLT arts. 8º e 9º).</b> Na falta de disposição legal ou contratual, decidem a <b>jurisprudência, a analogia, a equidade</b>, os princípios e normas gerais de direito (principalmente do trabalho), os <b>usos e costumes</b> e o direito comparado, sempre de modo que <b>nenhum interesse de classe ou particular prevaleça sobre o interesse público</b>. A Reforma (Lei 13.467/2017) mudou três pontos: o <b>direito comum</b> é fonte subsidiária (§ 1º, sem a antiga exigência de compatibilidade); <b>súmulas do TST e dos TRTs não podem restringir direitos legais nem criar obrigações</b> (§ 2º); e na análise de convenção ou acordo coletivo a Justiça do Trabalho examina <b>exclusivamente a conformidade dos elementos essenciais do negócio jurídico</b> (art. 104 do CC), com <b>intervenção mínima</b> na autonomia coletiva (§ 3º). O art. 9º anula os atos praticados para <b>desvirtuar, impedir ou fraudar</b> a CLT (base da <b>primazia da realidade</b>, princípio tratado pela doutrina).", "<b>Proteção constitucional.</b> O <b>art. 6º</b> arrola o trabalho entre os direitos sociais. O <b>art. 7º</b> traz os direitos dos trabalhadores <b>urbanos e rurais</b>, entre eles: relação de emprego protegida contra despedida arbitrária ou sem justa causa <b>nos termos de lei complementar</b> (I, indenização compensatória; <b>a LC nunca foi editada</b>); <b>salário mínimo</b> nacionalmente unificado (IV); <b>irredutibilidade salarial</b>, salvo convenção ou acordo (VI); hora extra com <b>mínimo de 50%</b> (XVI); férias com <b>1/3</b> (XVII); licença-gestante de <b>120 dias</b> (XVIII); <b>aviso prévio proporcional</b>, de no mínimo 30 dias (XXI); reconhecimento das <b>convenções e acordos coletivos</b> (XXVI); <b>prescrição de 5 anos</b> até <b>2 anos após</b> a extinção do contrato (XXIX); proibição de trabalho noturno, perigoso ou insalubre a menores de 18 anos e de qualquer trabalho a menores de 16, salvo aprendiz a partir de 14 (XXXIII); igualdade entre vínculo permanente e <b>avulso</b> (XXXIV). Os <b>domésticos</b> têm os direitos listados no parágrafo único (agora § 1º). O <b>art. 170</b> funda a ordem econômica na <b>valorização do trabalho humano</b> e na livre iniciativa, com busca do pleno emprego.", "<b>EC 141/2026 (publicada em 16/10/2026): atenção para a prova de 13/12/2026.</b> O <b>art. 7º, XIII</b>, passa a prever jornada de <b>8 horas diárias e 40 semanais</b>. O <b>inciso XV</b> passa a garantir <b>repouso semanal remunerado de 2 dias</b>, um deles preferencialmente aos domingos. O antigo parágrafo único vira § 1º; o <b>§ 2º</b> permite que <b>convenção ou acordo coletivo</b> estabeleçam regime compensatório que assegure, <b>na média, 2 dias de repouso por mês</b>, com <b>ao menos 1 dia em cada semana</b>; o <b>§ 3º</b> permite lei criar regimes diferenciados, respeitados os incisos XIII, XIV e XV. <b>Transição</b> (art. 6º): em <b>2 meses</b> da publicação (cerca de <b>16/12/2026</b>) a jornada máxima é de <b>42 horas</b>; <b>1 ano depois</b> (cerca de <b>16/12/2027</b>), <b>40 horas</b>. A mudança do inciso XV só vale <b>2 meses</b> depois da publicação (art. 10). Os contratos em vigor mantêm o salário sem redução (art. 2º). O <b>art. 8º</b> exclui das regras de duração e controle de jornada o empregado com <b>diploma de nível superior e remuneração de pelo menos 2,5 vezes o teto do RGPS</b>, salvo liberalidade ou norma coletiva, e <b>não se aplica aos empregados públicos</b> da administração direta e indireta (§ 1º), com competência da Justiça do Trabalho (§ 2º). O <b>art. 9º</b> manda <b>aditar os contratos administrativos</b> com mão de obra direta para manter o <b>equilíbrio econômico-financeiro</b>, em até <b>1 ano</b>. Isso toca de perto o <b>Município</b> como contratante. A prova é em 13/12, <b>antes</b> dos 2 meses; como a banca tratará o tema é incerto, e as datas exatas de vigência merecem conferência no DOU.", "<b>Relação de emprego (CLT arts. 2º, 3º e 6º).</b> <b>Empregador</b> é a empresa, individual ou coletiva, que, assumindo os <b>riscos</b> da atividade econômica, <b>admite, assalaria e dirige</b> a prestação pessoal de serviço; equiparam-se a ele profissionais liberais, instituições de beneficência e associações sem fins lucrativos que admitam empregados (§ 1º). <b>Empregado</b> é a <b>pessoa física</b> que presta serviço de natureza <b>não eventual</b>, sob a <b>dependência</b> do empregador e mediante <b>salário</b>; não há distinção entre trabalho intelectual, técnico e manual. O art. 6º iguala o trabalho no estabelecimento, no <b>domicílio</b> e <b>a distância</b>, e o parágrafo único diz que <b>meios telemáticos de comando e controle</b> equivalem, para a <b>subordinação jurídica</b>, aos meios pessoais. <b>Grupo econômico</b> (art. 2º, §§ 2º e 3º): as empresas respondem <b>solidariamente</b>, mas a <b>mera identidade de sócios não basta</b>; exige-se interesse integrado, efetiva comunhão de interesses e atuação conjunta.", "<b>Contratos e figuras especiais (arts. 442 a 452-A).</b> O contrato individual é o acordo <b>tácito ou expresso</b> correspondente à relação de emprego (art. 442). Em <b>cooperativa</b>, não há vínculo entre ela e seus associados, nem entre estes e os tomadores (§ 1º); também não há vínculo entre entidades religiosas e <b>ministros de confissão religiosa</b> e equiparados, salvo <b>desvirtuamento</b> da finalidade religiosa (§§ 2º e 3º, Lei 14.647/2023). O <b>autônomo</b> contratado com as formalidades legais, com ou sem exclusividade, afasta a qualidade de empregado (art. 442-B), desde que não haja <b>subordinação</b>. O contrato por <b>prazo determinado</b> só vale para serviço transitório, atividade empresarial transitória ou <b>experiência</b> (art. 443, § 2º); não pode passar de <b>2 anos</b>, e o de experiência não passa de <b>90 dias</b> (art. 445); prorrogado mais de uma vez, vira indeterminado (art. 451). O <b>intermitente</b> (art. 443, § 3º) exige contrato <b>escrito</b>, valor da hora não inferior ao do salário mínimo-hora ou ao dos demais empregados na função, e convocação com <b>3 dias corridos</b> de antecedência (art. 452-A). <b>Sucessão</b>: a mudança de propriedade ou estrutura não afeta os contratos (arts. 10 e 448); o <b>sucessor responde</b> também pelas obrigações anteriores, e a sucedida responde solidariamente se houver <b>fraude</b> (art. 448-A). O <b>sócio retirante</b> responde subsidiariamente, só em ações ajuizadas em até <b>2 anos</b> da averbação (art. 10-A).", "<b>Quem fica fora da CLT (art. 7º).</b> Salvo disposição expressa em contrário, a CLT <b>não se aplica</b> aos <b>domésticos</b>, aos <b>trabalhadores rurais</b> típicos, aos <b>funcionários públicos</b> da União, dos Estados e dos Municípios e extranumerários, aos servidores de autarquias paraestatais com regime próprio, e aos dirigentes e assessores de <b>partidos políticos</b> (Lei 13.877/2019). Cuidado: a exclusão atinge o servidor de <b>regime estatutário</b>; o empregado público contratado pelo regime celetista é regido pela CLT.", "<b>Prescrição (CLT art. 11).</b> Prescreve em <b>5 anos</b> a pretensão sobre créditos trabalhistas, até o limite de <b>2 anos após</b> a extinção do contrato, para urbanos e rurais. Em prestações sucessivas decorrentes de alteração ou descumprimento do pactuado, a prescrição é <b>total</b>, salvo se o direito à parcela estiver assegurado por <b>preceito de lei</b> (§ 2º). Só o <b>ajuizamento de reclamação trabalhista</b> interrompe a prescrição, mesmo em <b>juízo incompetente</b>, mesmo se extinta sem resolução do mérito, e só para os <b>pedidos idênticos</b> (§ 3º). A <b>prescrição intercorrente</b> é de <b>2 anos</b>, contados do descumprimento de determinação judicial pelo exequente na execução (art. 11-A).", "<b>Negociado sobre o legislado (arts. 611-A e 611-B) e hipersuficiente (art. 444).</b> Convenção e acordo coletivo <b>prevalecem sobre a lei</b> quando tratam, <b>entre outros</b> (rol exemplificativo), de jornada (respeitados os limites constitucionais), <b>banco de horas anual</b>, intervalo intrajornada (mínimo de <b>30 minutos</b> em jornadas acima de 6 horas), teletrabalho, sobreaviso, trabalho intermitente, plano de cargos, registro de jornada, troca do dia de feriado, grau de insalubridade e participação nos lucros. A <b>ausência de contrapartidas recíprocas não gera nulidade</b> (§ 2º); se a cláusula reduz salário ou jornada, deve prever <b>proteção contra a dispensa imotivada</b> (§ 3º); os <b>sindicatos subscritores</b> são litisconsortes necessários na ação de anulação (§ 5º). O art. 611-B lista, de modo <b>taxativo</b> (diz que constituem objeto ilícito <b>exclusivamente</b> a supressão ou redução desses direitos), o <b>núcleo intocável</b>: FGTS, salário mínimo, 13º, repouso semanal remunerado, hora extra de 50%, férias com 1/3, licença-maternidade de 120 dias, aviso prévio proporcional, normas de saúde e segurança, adicionais de insalubridade, periculosidade e penosidade, entre outros. O <b>parágrafo único</b> do 611-B diz que <b>regras sobre duração do trabalho e intervalos não são normas de saúde, higiene e segurança</b> para esse fim, o que mantém negociáveis jornada e intervalos. O rol do 611-B inclui ainda a <b>prescrição</b> (5 e 2 anos), a <b>liberdade sindical</b> e o <b>direito de greve</b>. O <b>hipersuficiente</b> (art. 444, parágrafo único): diploma superior <b>e</b> salário de <b>pelo menos 2 vezes</b> o teto do RGPS; pode pactuar individualmente as matérias do 611-A, com a mesma eficácia sobre os instrumentos coletivos.", "<b>Competência (CF art. 114).</b> A Justiça do Trabalho julga as ações da <b>relação de trabalho</b> (I), inclusive dos entes de direito público externo e da <b>administração pública direta e indireta</b> de todos os entes; o <b>dano moral e patrimonial decorrente da relação de trabalho</b> (VI); as <b>penalidades administrativas</b> impostas aos empregadores pelos órgãos de fiscalização (VII); e a execução de ofício das contribuições sociais (VIII). O STF, na <b>ADI 3395</b> (liminar de 2006; mérito julgado em abril de 2020), afastou da Justiça do Trabalho as causas de <b>vínculo jurídico-administrativo ou estatutário</b> com o poder público, o que interessa a quem defende o Município.", "<b>Doméstico (LC 150/2015).</b> É a pessoa que presta serviço de forma contínua, subordinada, onerosa e pessoal, <b>sem finalidade lucrativa</b>, à pessoa ou família, no âmbito residencial, <b>por mais de 2 dias por semana</b> (art. 1º); é <b>vedado menor de 18 anos</b>. Jornada de <b>8 horas diárias e 44 semanais</b>, hora extra de no mínimo <b>50%</b> (art. 2º); regime de <b>12x36</b> por acordo escrito (art. 10); registro de ponto obrigatório (art. 12); intervalo de <b>1 a 2 horas</b>, reduzível a 30 minutos por acordo escrito (art. 13); noturno das <b>22h às 5h</b>, adicional de <b>20%</b> (art. 14). A CTPS é anotada em <b>48 horas</b> (art. 9º), regra diferente da CLT (art. 29: <b>5 dias úteis</b>). <b>FGTS obrigatório</b>, com <b>3,2%</b> de indenização compensatória (arts. 21 e 22); aviso prévio de <b>30 dias + 3 por ano</b>, até 90 (art. 23); <b>prescrição</b> de 5 anos até 2 após o fim do contrato (art. 43). Contrato por prazo determinado: <b>experiência</b> (até 90 dias) ou necessidade transitória (até 2 anos). São vedados descontos por alimentação, vestuário, higiene e moradia (art. 18). A <b>Lei 15.455/2026</b> incluiu o <b>art. 30-A</b>: medidas protetivas de urgência ao doméstico <b>resgatado de condição análoga à de escravo</b>.", "<b>Rural, temporário e terceirização (Leis 5.889/1973 e 6.019/1974).</b> <b>Empregado rural</b> é a pessoa física que presta serviço em propriedade rural ou prédio rústico, de forma não eventual (Lei 5.889, art. 2º); o <b>noturno</b> é das <b>21h às 5h na lavoura</b> e das <b>20h às 4h na pecuária</b>, com adicional de <b>25%</b> (art. 7º); descontos de moradia até <b>20%</b> e alimentação até <b>25%</b> (art. 9º). <b>Trabalho temporário</b> (Lei 6.019, art. 2º): contratado por empresa de trabalho temporário (pessoa jurídica) para <b>substituição transitória</b> ou <b>demanda complementar</b>; prazo de até <b>180 dias</b>, prorrogável por até <b>90</b>; nova contratação pelo mesmo tomador só após <b>90 dias</b>; <b>não há vínculo</b> com a tomadora (art. 10), que responde <b>subsidiariamente</b> pelas obrigações trabalhistas e, na <b>falência</b> da temporária, <b>solidariamente</b> (art. 16). <b>Terceirização</b> (art. 4º-A): admite a transferência de <b>quaisquer atividades, inclusive a principal</b>, à pessoa jurídica de capacidade econômica compatível; <b>não há vínculo</b> entre os empregados da prestadora e a contratante; a contratante responde <b>subsidiariamente</b> (art. 5º-A, § 5º), e há <b>quarentena de 18 meses</b> para a empresa cujos sócios foram empregados da contratante (art. 5º-C). A <b>Súmula 331 do TST</b>: a terceirização ilícita forma vínculo com o tomador (salvo temporário); a Administração Pública só responde subsidiariamente se evidenciada <b>conduta culposa</b>, em especial na <b>fiscalização</b> do contrato.", "<b>Estágio e liberdade econômica (Leis 11.788/2008 e 13.874/2019).</b> O <b>estágio</b> é ato educativo escolar supervisionado e <b>não cria vínculo de emprego</b> se houver matrícula e frequência, <b>termo de compromisso</b> e compatibilidade das atividades; o descumprimento de qualquer requisito gera <b>vínculo</b> (art. 3º). A <b>Administração direta, autárquica e fundacional</b>, inclusive os <b>Municípios</b>, pode oferecer estágio (art. 9º). Jornada de <b>6 horas diárias e 30 semanais</b> no ensino superior e médio (art. 10); duração máxima de <b>2 anos</b> na mesma concedente, salvo pessoa com deficiência (art. 11); <b>bolsa e auxílio-transporte são compulsórios</b> no estágio não obrigatório (art. 12); <b>recesso de 30 dias</b> no estágio de 1 ano ou mais (art. 13). A <b>Lei 13.874/2019</b> vale para o direito do trabalho (art. 1º, § 1º), mas o direito à atividade em <b>qualquer horário</b> ressalva a <b>legislação trabalhista</b> (art. 3º, II); alterou a CLT para exigir <b>registro de ponto</b> acima de <b>20 trabalhadores</b> (art. 74) e para a anotação da CTPS em <b>5 dias úteis</b> (art. 29). Seus arts. 1º a 4º são <b>norma geral</b> aplicável também aos <b>Municípios</b>; a <b>aprovação tácita</b> (art. 3º, IX) <b>não se aplica</b> a Estados, DF e Municípios, salvo exceções do art. 1º, § 5º."], "pega": ["CLT e domésticos: a banca diz que a CLT se aplica integralmente ao empregado doméstico. O art. 7º da CLT diz que ela <b>não se aplica</b> aos domésticos, que têm lei própria (LC 150/2015) e os direitos do art. 7º, § 1º, da CF.", "Grupo econômico: a banca diz que basta a <b>identidade de sócios</b> para haver grupo e responsabilidade solidária. A CLT diz que a <b>mera identidade de sócios não caracteriza</b> grupo; exige <b>interesse integrado, comunhão de interesses e atuação conjunta</b> (art. 2º, § 3º).", "Prescrição: a banca diz que a prescrição é de <b>2 anos durante o contrato</b>, ou de <b>5 anos</b> contados do fim do contrato. A lei diz <b>5 anos</b> até o limite de <b>2 anos após</b> a extinção (CF art. 7º, XXIX; CLT art. 11); e só a <b>reclamação trabalhista</b> a interrompe (art. 11, § 3º).", "Intermitente: a banca diz que o contrato pode ser verbal e a convocação feita no mesmo dia. A CLT exige contrato <b>escrito</b> e convocação com <b>3 dias corridos</b> de antecedência, com valor da hora não inferior ao do salário mínimo-hora ou ao dos demais empregados da função (art. 452-A).", "Prazos: a banca diz que o contrato por prazo determinado vai até <b>4 anos</b> e a experiência até <b>180 dias</b>. A CLT diz <b>2 anos</b> e <b>90 dias</b> (art. 445), e a prorrogação por mais de uma vez torna o contrato indeterminado (art. 451).", "Hipersuficiente: a banca diz que basta diploma superior, ou que basta salário alto. A CLT exige <b>os dois</b>: diploma de nível superior <b>e</b> salário mensal de pelo menos <b>2 vezes</b> o teto do RGPS (art. 444, parágrafo único). Cuidado para não misturar com a regra de <b>2,5 vezes</b> do art. 8º da <b>EC 141</b>, que trata de jornada.", "Rol do 611-B: a banca diz que o rol de direitos que a norma coletiva não pode suprimir é meramente exemplificativo, e que o do 611-A é taxativo. É o <b>inverso</b>: o <b>611-A é exemplificativo</b> (‘entre outros’) e o <b>611-B é taxativo</b> (‘exclusivamente’).", "Súmulas do TST: a banca diz que as súmulas podem criar obrigações não previstas em lei. A CLT diz que <b>não podem restringir direitos legais nem criar obrigações</b> (art. 8º, § 2º).", "Fiscalização do trabalho: a banca diz que o auto de infração lavrado por Auditor Fiscal do Trabalho é contestado na Justiça Federal ou na comum. A CF diz que a <b>Justiça do Trabalho</b> julga as ações sobre <b>penalidades administrativas</b> impostas aos empregadores pelos órgãos de fiscalização (art. 114, VII). Questão de magistratura do banco trouxe esse tema.", "Sucessão: a banca diz que o sucessor só responde pelas dívidas posteriores à sucessão. A CLT diz que responde <b>também pelas anteriores</b> (art. 448-A); a empresa sucedida só responde <b>solidariamente em caso de fraude</b>.", "Jornada na EC 141: a banca diz que a jornada máxima de 40 horas já vale para todos desde 16/10/2026, ou que o repouso de 2 dias já vale em 13/12/2026. A EC prevê <b>transição</b>: <b>42 horas</b> a partir de cerca de <b>16/12/2026</b> e <b>40 horas</b> um ano depois; o repouso de 2 dias vale <b>2 meses</b> após a publicação (arts. 6º e 10). Leia o enunciado com atenção à <b>data</b>.", "Doméstico e FGTS: a banca diz que o FGTS do doméstico é facultativo. A LC 150 diz que é <b>obrigatório</b> (art. 21), com <b>3,2%</b> de indenização compensatória (art. 22).", "Anotação da CTPS: a banca diz que o prazo é de 48 horas para todo empregado. A CLT diz <b>5 dias úteis</b> (art. 29, Lei 13.874/2019); as <b>48 horas</b> são do <b>doméstico</b> (LC 150, art. 9º).", "Terceirização: a banca diz que é proibido terceirizar a atividade-fim. A Lei 6.019 diz que se pode transferir <b>quaisquer atividades, inclusive a principal</b> (art. 4º-A), e não há vínculo com a contratante, que responde <b>subsidiariamente</b>.", "Estágio: a banca diz que o estágio não obrigatório pode ser sem bolsa, e que o Município não pode oferecer estágio. A lei diz que a <b>bolsa e o auxílio-transporte são compulsórios</b> no estágio não obrigatório (art. 12), e que a <b>administração pública direta, autárquica e fundacional</b> pode oferecer estágio (art. 9º). O descumprimento dos requisitos gera <b>vínculo de emprego</b> (art. 3º, § 2º).", "Temporário: a banca diz que o trabalho temporário dura até 1 ano. A lei diz <b>180 dias</b>, prorrogáveis por até <b>90</b> (art. 10, §§ 1º e 2º), e não há vínculo com a tomadora.", "Ação contra o Município por servidor temporário: a banca diz que a Justiça do Trabalho julga as causas de contratação temporária do Município. O STF (ADI 3395 e reclamações) diz que o vínculo <b>jurídico-administrativo</b> é da <b>Justiça comum</b>."]}, {"materia": "DIREITO URBANÍSTICO E AMBIENTAL", "titulo": "Parcelamento e ordenamento do solo: Lei 6.766/1979 (loteamento, desmembramento, registro, contratos, penas) e a disciplina de Curitiba (Decreto 1.938/2023, Lei 9.460/1998)", "key": "URB", "nome": "Urbanístico", "conc": ["Edital: item 4 de Direito Urbanístico (<b>parcelamento e ordenamento do solo</b>). Base normativa: <b>Lei 6.766/1979</b> (normas gerais), <b>Lei 14.771/2015</b> (Plano Diretor de Curitiba: arts. 25 a 27 tratam do parcelamento, das áreas públicas e da garantia das obras), <b>Lei Municipal 2.942/1966</b> (aprovação de arruamentos, loteamentos e desmembramentos), <b>Decreto 1.938/2023</b> (regulamento atual do parcelamento) e <b>Lei 9.460/1998</b> (regularização). Os decretos 881/2017 e 1.048/2018 regulamentam os arts. 25 a 27 e 44, III, do Plano Diretor. No <b>STF, Tema 492</b> (RE 695.911, dez/2020): a cobrança, por associação, de taxa de manutenção de proprietário <b>não associado</b> só é possível a partir da <b>Lei 13.465/2017</b> (ou de lei municipal anterior que discipline a matéria), e desde que o loteamento tenha <b>acesso controlado</b> (art. 36-A da Lei 6.766) e o <b>ato constitutivo da obrigação esteja registrado no Registro de Imóveis</b>.", "<b>Conceitos (arts. 1º e 2º).</b> A União edita as normas gerais; <b>Estados, DF e Municípios</b> podem editar normas <b>complementares</b>, para adequar a lei às peculiaridades locais (art. 1º, parágrafo único). O parcelamento se faz por <b>loteamento</b> (subdivisão de gleba em lotes <b>com abertura de novas vias</b> ou prolongamento, modificação ou ampliação das existentes) ou <b>desmembramento</b> (aproveita o sistema viário existente, <b>sem abrir</b> nem ampliar vias). <b>Lote</b> é o terreno servido de <b>infraestrutura básica</b>, com dimensões que atendam aos índices do plano diretor ou da lei municipal (§ 4º). A infraestrutura básica é: águas pluviais, iluminação pública, esgotamento sanitário, água potável, energia elétrica pública e domiciliar e vias de circulação (§ 5º); nas <b>ZHIS</b> (interesse social), o mínimo é vias, águas pluviais, água potável e soluções para esgoto e energia (§ 6º). O lote pode ser autônomo ou unidade de <b>condomínio de lotes</b> (§ 7º). No <b>loteamento de acesso controlado</b>, o controle é regulamentado pelo Município e <b>não pode impedir o acesso de pedestres ou de condutores não residentes, identificados ou cadastrados</b> (§ 8º). O <b>empreendedor</b> (art. 2º-A, Lei 14.118/2021) pode ser o proprietário, o compromissário comprador com anuência do dono, o ente público que desapropria, o contratado e cooperativas ou associações.", "<b>Onde e como pode (arts. 3º, 4º e 5º).</b> Só em <b>zonas urbanas, de expansão urbana ou de urbanização específica</b>. <b>Proibido</b> parcelar: terrenos <b>alagadiços</b> sem providências; <b>aterrados com material nocivo</b> sem saneamento; com <b>declividade igual ou superior a 30%</b>, salvo exigências específicas; com condições <b>geológicas</b> desfavoráveis; e <b>áreas de preservação ecológica</b> ou poluídas até a correção. Nos loteamentos: áreas públicas (circulação, equipamentos, espaços livres) <b>proporcionais à densidade</b> prevista no plano diretor ou em lei municipal (a antiga regra fixa de <b>35%</b> do § 1º <b>deixou de existir</b>); lotes com <b>mínimo de 125 m²</b> e <b>frente de 5 m</b>, salvo urbanização específica ou habitação de interesse social; <b>faixa não edificável de 15 m</b> ao longo de <b>ferrovias</b> e de rodovias (nas <b>rodovias</b>, a faixa pode ser reduzida por <b>lei municipal</b> até <b>5 m</b>, Lei 13.913/2019); ao longo das águas, a faixa segue a <b>lei municipal</b> (Lei 14.285/2021, área urbana consolidada). Equipamentos <b>comunitários</b> são os de educação, cultura, saúde, lazer e similares (art. 4º, § 2º).", "<b>Procedimento (arts. 6º a 17).</b> Antes do projeto, o interessado pede à Prefeitura as <b>diretrizes</b> (válidas por <b>4 anos</b>, art. 7º). Municípios com <b>menos de 50.000 habitantes</b> ou com plano diretor com diretrizes podem <b>dispensar</b> essa fase por lei (art. 8º). O projeto leva <b>cronograma de execução de até 4 anos</b>, certidão atualizada da matrícula, certidão negativa de tributos municipais e <b>garantia</b> (art. 9º). Cabe à <b>Prefeitura aprovar</b>; aos <b>Estados</b>, disciplinar a aprovação pelos Municípios nos casos de <b>áreas de interesse especial</b> (mananciais, patrimônio), <b>áreas limítrofes</b> ou de região metropolitana e <b>loteamentos acima de 1.000.000 m²</b> (art. 13). O projeto aprovado deve ser executado no prazo, <b>sob pena de caducidade</b>; é <b>vedada</b> a aprovação em <b>áreas de risco</b> não edificáveis (art. 12). A lei municipal fixa os prazos de aprovação; <b>decorrido o prazo sem manifestação, o projeto é considerado rejeitado</b> (silêncio negativo), com <b>indenização</b> por danos da omissão; se a lei for omissa, são <b>90 dias</b> para aprovar e <b>60 dias</b> para aceitar as obras (art. 16). Aprovado o projeto, as <b>áreas públicas não podem ter destinação alterada</b> pelo loteador (art. 17).", "<b>Registro (arts. 18 a 24).</b> O loteador registra o projeto no Registro de Imóveis em <b>180 dias</b> da aprovação, <b>sob pena de caducidade</b>, com título, histórico de <b>20 anos</b>, certidões negativas (tributos; ações reais e penais contra o patrimônio e a administração pública, por <b>10 anos</b>), certidões de protesto (<b>5 anos</b>), ações cíveis e penais (<b>10 anos</b>), contrato-padrão e declaração do cônjuge. O oficial comunica a Prefeitura e publica <b>edital por 3 dias consecutivos</b>; a impugnação é possível em <b>15 dias corridos</b> (art. 19). <b>Desde o registro</b>, as vias, praças, espaços livres e áreas de equipamentos <b>passam ao domínio do Município</b> (art. 22), sem escritura. O registro só se cancela por <b>decisão judicial</b>, a pedido do loteador com anuência da Prefeitura <b>enquanto nenhum lote tiver sido contratado</b>, ou por pedido conjunto de loteador e <b>todos</b> os adquirentes, com anuência da Prefeitura e do Estado (art. 23). Por opção do loteador, o loteamento pode ser submetido ao <b>patrimônio de afetação</b>, averbado na matrícula, que <b>não integra a massa falida</b> do loteador (arts. 18-A a 18-F, Lei 14.620/2023).", "<b>Contratos (arts. 25 a 36-A).</b> Os compromissos de compra e venda são <b>irretratáveis</b> e, se registrados, dão <b>direito real</b> oponível a terceiros e <b>adjudicação compulsória</b> (art. 25). A <b>cláusula penal</b> não excede <b>10% do débito</b> e só é exigível em caso de intervenção judicial ou de mora superior a <b>3 meses</b> (art. 26, V). O contrato deve começar com <b>quadro-resumo</b>; se faltar informação, há <b>30 dias</b> para sanar, sob pena de justa causa para a rescisão pelo adquirente (art. 26-A). Atraso: o contrato se considera <b>rescindido 30 dias depois</b> de o devedor ser constituído em mora por intimação do oficial; a <b>purga da mora</b> faz o contrato convalescer (art. 32). Na <b>resolução por fato do adquirente</b>, devolve-se o valor pago com desconto de <b>fruição até 0,75% ao mês</b>, cláusula penal e despesas até <b>10%</b> do valor atualizado, encargos, IPTU e corretagem, em até <b>12 parcelas</b> (art. 32-A, que <b>não se aplica à alienação fiduciária</b>). A <b>falência</b> de qualquer das partes <b>não rescinde</b> os compromissos (art. 30). A cessão <b>independe</b> da anuência do loteador (art. 31). As associações de moradores <b>sem fins lucrativos</b> equiparam-se à atividade de <b>administração de imóveis</b> (art. 36-A, Lei 13.465/2017).", "<b>Parcelamento irregular (arts. 37 a 49).</b> É <b>vedado vender ou prometer vender</b> parcela de loteamento <b>não registrado</b> (art. 37). Se o loteamento não está registrado ou regularmente executado, o adquirente <b>suspende o pagamento</b>, notifica o loteador e <b>deposita as prestações</b> no Registro de Imóveis (art. 38); a Prefeitura ou o <b>Ministério Público</b> também podem notificar. É <b>nula</b> a cláusula de rescisão por inadimplemento quando o loteamento não está regularmente inscrito (art. 39). Se o loteador não atende à notificação, a <b>Prefeitura pode regularizar</b> o loteamento e se ressarcir com as prestações depositadas, <b>sem contrariar os arts. 3º e 4º</b> (art. 40). No loteamento não aprovado, a destinação de áreas públicas não pode ser alterada, e o loteador ressarce o Município <b>no dobro</b> da diferença de áreas (art. 43). O loteador ou os <b>vizinhos</b> têm legitimidade para impedir construção em desacordo com restrições legais ou contratuais (art. 45). Há <b>responsabilidade solidária</b> do grupo econômico (art. 47) e o <b>foro</b> é o da comarca da situação do lote (art. 48).", "<b>Disposições penais (arts. 50 a 52).</b> É <b>crime contra a Administração Pública</b> dar início a loteamento ou desmembramento <b>sem autorização</b> ou em desacordo com a lei e com a licença, e fazer afirmação falsa sobre a legalidade: <b>reclusão de 1 a 4 anos</b> e multa. É <b>qualificado</b> (reclusão de 1 a 5 anos) se há <b>venda, promessa ou reserva</b> em loteamento <b>não registrado</b> ou <b>sem título legítimo</b> de propriedade. Concorre quem pratica atos como <b>mandatário, diretor ou gerente</b> (art. 51). O art. 52 pune o <b>oficial de registro</b> que registra loteamento não aprovado: <b>detenção de 1 a 2 anos</b>. O <b>art. 53</b> exige audiência do <b>INCRA</b> para converter solo rural em urbano.", "<b>Curitiba: Decreto 1.938/2023.</b> Regulamenta o parcelamento com base na Lei 6.766, no Plano Diretor (Lei 14.771/2015) e na <b>Lei 2.942/1966</b>. O <b>desmembramento</b> também é chamado de <b>subdivisão</b>; existem ainda a <b>unificação</b>, o <b>cadastramento</b> e a <b>regularização de lote</b>. A competência é da <b>Secretaria Municipal do Urbanismo (SMU)</b>; o <b>CMU</b> decide as exceções e os casos omissos. A doação de áreas ao Município é <b>sem ônus</b> e calculada sobre a <b>área líquida</b> (área original menos o sistema viário básico e as áreas de saneamento). Se a área líquida é de <b>até 20.000 m²</b>, <b>recolhe-se o valor equivalente</b> aos cofres municipais, avaliado pela base do <b>ITBI</b>; se maior, a área institucional fica no próprio lote, com exceções admitidas pelo CMU. O <b>equipamento comunitário</b> tem <b>mínimo de 10%</b> da área líquida. Na <b>ZROC-1 (Campo de Santana)</b>: 10% equipamentos, 10% lazer e <b>15% habitação de interesse social</b>. Na <b>ZROI</b>: <b>40%</b> da área total. <b>Dispensam</b> a destinação: plantas anteriores com áreas já destinadas, plantas tipo ‘A’, lotes com <b>alvará de construção</b> (exceto de muro), <b>zonas industriais</b> e a área da <b>CIC</b>. A obra viária da diretriz de arruamento transferida deve ficar pronta em até <b>5 anos</b>, às custas do proprietário.", "<b>Curitiba: regularização (Lei 9.460/1998).</b> Trata do parcelamento <b>irregular</b> (sem autorização do Município ou em desacordo com o plano aprovado). A data-limite vigente (Lei 14.981/2016) é <b>31/12/2011</b>. A regularização plena exige <b>título de propriedade registrado</b> e prova da <b>irreversibilidade</b> por laudo técnico; o <b>compromisso de compra e venda isolado não prova</b> a existência do parcelamento. Se o parcelador, notificado, não atende em <b>30 dias</b> (prorrogáveis até 90), o <b>Município regulariza</b> e cobra o custo. Em novo parcelamento irregular, há <b>notícia-crime</b> ao Ministério Público."], "pega": ["Loteamento e desmembramento: a banca diz que a diferença é o tamanho do lote, ou que o desmembramento também abre novas vias. A lei diz que o <b>loteamento abre novas vias</b> (ou prolonga, modifica, amplia) e o <b>desmembramento aproveita o sistema viário existente</b> (art. 2º, §§ 1º e 2º).", "Percentual de áreas públicas: a banca diz que a lei exige <b>35% da gleba</b> para áreas públicas em todo loteamento. O texto atual diz que as áreas são <b>proporcionais à densidade</b> prevista no plano diretor ou em lei municipal (art. 4º, I). O § 1º antigo (35%) foi <b>substituído</b> pela Lei 9.785/99.", "Lote mínimo: a banca diz que o lote mínimo é de <b>360 m²</b> e a frente de <b>12 m</b>. A lei diz <b>125 m²</b> e <b>5 m</b>, salvo urbanização específica ou interesse social (art. 4º, II); os índices locais vêm da <b>lei municipal</b> (art. 4º, § 1º).", "Declividade: a banca diz que é proibido parcelar terreno com declividade igual ou superior a <b>20%</b> em qualquer hipótese. A lei diz <b>30%</b>, <b>salvo</b> se atendidas exigências específicas das autoridades (art. 3º, parágrafo único, III).", "Silêncio da Prefeitura: a banca diz que o projeto é <b>aprovado tacitamente</b> se a Prefeitura não responde no prazo. A lei diz que o projeto é considerado <b>rejeitado</b> (silêncio negativo), com <b>indenização</b> por danos da omissão (art. 16, § 1º).", "Registro: a banca diz que o loteador tem <b>1 ano</b> para registrar, sem consequências. A lei diz <b>180 dias</b>, <b>sob pena de caducidade</b> da aprovação (art. 18).", "Domínio das áreas públicas: a banca diz que as áreas passam ao Município só após <b>escritura de doação</b>. A lei diz que passam ao Município <b>desde a data do registro</b> do loteamento (art. 22).", "Quem aprova: a banca diz que a aprovação do loteamento é sempre do Estado. A lei diz que a aprovação é da <b>Prefeitura</b>; o Estado só disciplina nos casos do art. 13 (interesse especial, limítrofes, metropolitanas, acima de <b>1.000.000 m²</b>). Na LOM de Curitiba, o Prefeito aprova projetos de arruamento e loteamento (art. 72, XXVII).", "Cláusula penal: a banca diz que a cláusula penal pode chegar a <b>20%</b> e é exigível desde o primeiro dia de atraso. A lei diz <b>até 10% do débito</b>, exigível só em intervenção judicial ou <b>mora superior a 3 meses</b> (art. 26, V).", "Comprador de loteamento irregular: a banca diz que o adquirente deve continuar pagando o loteador. A lei diz que ele <b>suspende o pagamento</b>, notifica e <b>deposita</b> as prestações no Registro de Imóveis (art. 38); a cláusula de rescisão por inadimplemento é <b>nula</b> se o loteamento não está regularmente inscrito (art. 39).", "Doação em Curitiba: a banca diz que sempre se doa área física ao Município. O decreto diz que, até <b>20.000 m²</b> de área líquida, <b>recolhe-se o valor equivalente</b> (base do ITBI); acima disso, a área institucional fica no próprio lote (art. 9º). Há <b>dispensas</b> (alvará de construção, zonas industriais, CIC).", "Crime e registro: a banca diz que só o loteador comete crime. A lei pune também quem <b>concorre</b> (mandatário, diretor, gerente, art. 51) e o <b>oficial de registro</b> que registra loteamento não aprovado, com <b>detenção de 1 a 2 anos</b> (art. 52).", "Taxa de associação de moradores: a banca diz que o proprietário de lote em loteamento é obrigado a pagar a taxa de manutenção à associação, <b>mesmo sem ter se associado</b>, em qualquer caso. O STF (Tema 492) diz que antes da <b>Lei 13.465/2017</b> (ou de lei municipal anterior) a cobrança era <b>inconstitucional</b>; depois, só é possível se o loteamento tiver <b>acesso controlado</b> e a obrigação estiver <b>registrada no Registro de Imóveis</b> (art. 36-A da Lei 6.766)."]}, {"materia": "DIREITO EMPRESARIAL", "titulo": "Falência e recuperação de empresas: Lei 11.101/2005 (com a Lei 14.112/2020), crédito tributário, execução fiscal e a Fazenda Pública do Município", "key": "EMP", "nome": "Empresarial", "conc": ["Edital: item 4 de Direito Empresarial (<b>falência e recuperação de empresas</b>, com os reflexos sobre o crédito tributário e a Fazenda Pública). Base: <b>Lei 11.101/2005</b> inteira (com a <b>Lei 14.112/2020</b>), <b>CTN arts. 186 a 193</b> e <b>LEF arts. 29 a 31</b>. Em <b>Curitiba</b>: <b>LOM art. 74, § 4º</b> (dívida ativa é com a Procuradoria-Geral), <b>LC 141/2023</b> e <b>Decretos 2.305 e 2.306/2023</b>. Jurisprudência: <b>Tema 1.051 do STJ</b>, <b>Tema 987 do STJ</b> (afetação cancelada) e <b>ADPF 357</b> do STF.", "<b>Âmbito e competência (arts. 1º a 3º).</b> A lei trata da <b>recuperação judicial</b>, da <b>recuperação extrajudicial</b> e da <b>falência</b> do empresário e da sociedade empresária. <b>Não se aplica</b> a <b>empresa pública e sociedade de economia mista</b> (inclusive as municipais) nem a <b>instituição financeira</b>, cooperativa de crédito, consórcio, previdência complementar, operadora de plano de saúde, seguradora e capitalização (art. 2º). É competente o juízo do <b>local do principal estabelecimento</b> do devedor (art. 3º). Os prazos da lei são em <b>dias corridos</b>, e as decisões desafiam <b>agravo de instrumento</b>, salvo previsão diversa (art. 189, § 1º).", "<b>Efeitos do deferimento da recuperação (art. 6º).</b> O <b>deferimento do processamento</b> da recuperação judicial (ou a decretação da falência) suspende a prescrição, as execuções e proíbe constrições <b>quanto aos créditos sujeitos</b> à lei. Na recuperação, o <b>stay period</b> é de <b>180 dias</b>, prorrogáveis <b>uma vez</b> por igual período, em caráter excepcional (§ 4º). Mas o <b>§ 7º-B</b> diz que essas regras <b>não se aplicam às execuções fiscais</b>: a execução fiscal <b>segue</b> normalmente; o juízo da recuperação só pode determinar a <b>substituição</b> dos atos de constrição sobre <b>bens de capital essenciais</b> à atividade, por <b>cooperação jurisdicional</b>, até o encerramento da recuperação. O § 11 veda a <b>expedição de certidão de crédito</b> e o <b>arquivamento</b> das execuções para efeito de habilitação. O <b>Tema 987 do STJ</b> (atos constritivos em execução fiscal contra empresa em recuperação) teve a <b>afetação cancelada</b> em 2021 (REsp 1.694.261/SP), por perda de objeto diante da Lei 14.112/2020; <b>não</b> há tese fixada nele.", "<b>Créditos sujeitos à recuperação (art. 49).</b> Sujeitam-se <b>todos os créditos existentes na data do pedido</b>, ainda que não vencidos (o texto diz <b>data do pedido</b>; o STJ, no <b>Tema 1.051</b> (REsp 1.840.531 e outros, 09/12/2020), fixou que a existência do crédito se determina pela data do <b>fato gerador</b>, sem depender de sentença ou trânsito em julgado). Os credores conservam seus direitos contra <b>coobrigados, fiadores e obrigados de regresso</b> (§ 1º). <b>Não se sujeitam</b>: o <b>proprietário fiduciário</b>, o <b>arrendador mercantil</b>, o <b>proprietário ou promitente vendedor</b> de imóvel com cláusula de irrevogabilidade e o vendedor com <b>reserva de domínio</b> (prevalecem os direitos de propriedade; mas, durante o stay, não podem retirar <b>bens de capital essenciais</b>, § 3º) e as importâncias de <b>adiantamento de contrato de câmbio</b> (§ 4º). O <b>crédito tributário</b> também <b>não se sujeita</b>: a cobrança judicial não se sujeita a concurso de credores ou <b>habilitação</b> em falência ou recuperação (<b>CTN art. 187; LEF art. 29</b>).", "<b>Plano, concessão e fiscalização (arts. 47 a 61).</b> O objetivo é <b>superar a crise</b> e manter a <b>fonte produtora</b>, o emprego e os interesses dos credores, com a <b>preservação da empresa</b> e sua função social (art. 47). Pode pedir quem exerce regularmente a atividade há <b>mais de 2 anos</b>, não é falido (ou teve extintas as responsabilidades), não obteve recuperação há menos de <b>5 anos</b> e não tem con
