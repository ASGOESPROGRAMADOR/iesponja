 "URB", "nome": "Urbanístico", "conc": ["Edital: item 2 de Direito Urbanístico e Ambiental. Li <b>literalmente</b>, no navegador (Planalto): <b>Lei 13.089/2015 (Estatuto da Metrópole), arts. 1º a 25</b>, e <b>Lei 10.257/2001 (Estatuto da Cidade), arts. 4º a 10, 21 a 38, 39 a 42-B e 43 a 46</b> (e o início do art. 47). O texto compilado do Planalto <b>mostra lado a lado as redações antiga e nova</b>, e as notas de revogação ficaram fora do meu recorte; por isso conferi à parte o <b>art. 21 do Estatuto da Metrópole</b>, que a página marca como <b>revogado pela Lei 13.683/2018</b>. <b>Não li</b> os arts. 11 a 20 do Estatuto da Cidade (usucapião coletiva e concessão de uso, em boa parte vetados ou revogados) nem a íntegra do art. 2º (diretrizes; li-as na unidade 1 apenas em parte). <b>Zonas Especiais de Interesse Social (ZEIS)</b>: o Estatuto só as cita (art. 4º, V, f, e as regras de expansão urbana e de áreas de risco, arts. 42-A e 42-B), a regulação é <b>municipal</b> e a doutrina vem <b>da minha memória</b>. Teses do STF e conceitos de doutrina também são de memória. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Estatuto da Metrópole: objeto e competências (Lei 13.089/2015, art. 1º).</b> Estabelece <b>diretrizes gerais para o planejamento, a gestão e a execução das funções públicas de interesse comum (FPIC)</b> em <b>regiões metropolitanas e aglomerações urbanas instituídas pelos Estados</b>, normas gerais sobre o <b>plano de desenvolvimento urbano integrado (PDUI)</b> e instrumentos de <b>governança interfederativa</b>, e critérios para o apoio da União. Fundamenta-se nos arts. 21, XX, 23, IX, 24, I, 25, § 3º e 182 da CF. Aplica-se, <b>no que couber</b>, às <b>microrregiões</b> com FPIC de características predominantemente urbanas e às <b>unidades regionais de saneamento básico</b> (art. 1º, § 1º). Na aplicação, observam-se as normas gerais do <b>Estatuto da Cidade</b> (§ 2º).", "<b>Conceitos (art. 2º).</b> <b>Aglomeração urbana</b>: unidade territorial urbana constituída pelo agrupamento de <b>dois ou mais Municípios limítrofes</b>, com complementaridade funcional e integração das dinâmicas geográficas, ambientais, políticas e socioeconômicas. <b>Função pública de interesse comum</b>: política pública ou ação nela inserida cuja realização por um <b>Município, isoladamente, seja inviável ou cause impacto em Municípios limítrofes</b>. <b>Gestão plena</b>: região metropolitana ou aglomeração com (a) <b>formalização e delimitação por lei complementar estadual</b>, (b) <b>estrutura de governança interfederativa própria</b> (art. 8º) e (c) <b>PDUI aprovado por lei estadual</b>. <b>Governança interfederativa</b>: compartilhamento de responsabilidades e ações entre entes da Federação (organização, planejamento e execução das FPIC). <b>Metrópole</b>: espaço urbano com continuidade territorial que, pela população e relevância, tem <b>influência nacional ou sobre uma região que configure, no mínimo, a área de influência de uma capital regional</b>, conforme critérios do <b>IBGE</b>. <b>Região metropolitana</b>: unidade regional <b>instituída pelos Estados, mediante lei complementar</b>, por agrupamento de Municípios limítrofes para integrar a organização, o planejamento e a execução de FPIC. <b>Área metropolitana</b>: expansão contínua da malha urbana da metrópole, conurbada pela integração dos sistemas viários. <b>PDUI</b>: instrumento que estabelece, com base em planejamento permanente, <b>diretrizes</b> para o desenvolvimento territorial estratégico e os projetos estruturantes.", "<b>Instituição das unidades territoriais (arts. 3º a 5º).</b> Os <b>Estados</b>, <b>mediante lei complementar</b>, podem instituir regiões metropolitanas e aglomerações urbanas (art. 3º). Estado e Municípios incluídos <b>devem promover a governança interfederativa</b> (§ 1º). A criação deve ser <b>precedida de estudos técnicos e audiências públicas</b> com <b>todos os Municípios</b> envolvidos (§ 2º). O <b>Distrito Federal</b> pode integrar região metropolitana com Municípios limítrofes (§ 3º). Se envolver Municípios de <b>mais de um Estado</b>, é formalizada por <b>leis complementares das assembleias de cada Estado</b> (art. 4º); enquanto nem todos aprovaram, vale só para os Municípios dos Estados que já aprovaram (§ 1º). A lei complementar estadual define, no mínimo: <b>os Municípios; as FPIC; a estrutura de governança interfederativa; e os meios de controle social</b> (art. 5º).", "<b>Governança interfederativa: princípios, diretrizes e estrutura (arts. 6º a 8º).</b> <b>Princípios</b> (art. 6º): <b>prevalência do interesse comum sobre o local</b>; compartilhamento de responsabilidades e de gestão; <b>autonomia dos entes</b>; observância das peculiaridades regionais; <b>gestão democrática</b> (arts. 43 a 45 do Estatuto da Cidade); efetividade no uso dos recursos; desenvolvimento sustentável. <b>Diretrizes específicas</b> (art. 7º): processo permanente e compartilhado de planejamento e decisão; meios compartilhados de organização administrativa; <b>sistema integrado de alocação de recursos e prestação de contas</b>; <b>execução compartilhada com rateio de custos</b>; participação de representantes da sociedade civil; compatibilização dos <b>PPAs, LDOs e LOAs</b>; <b>compensação por serviços ambientais</b> prestados pelo Município à unidade territorial. <b>Estrutura básica</b> (art. 8º): <b>(I) instância executiva</b> dos Poderes Executivos dos entes; <b>(II) instância colegiada deliberativa</b> com representação da sociedade civil; <b>(III) organização pública</b> com funções técnico-consultivas; <b>(IV) sistema integrado</b> de alocação de recursos e prestação de contas.", "<b>Instrumentos do desenvolvimento urbano integrado e o PDUI (arts. 9º a 12).</b> Sem prejuízo dos instrumentos do art. 4º do Estatuto da Cidade, usam-se, entre outros: <b>PDUI</b>; <b>planos setoriais interfederativos</b>; <b>fundos públicos</b>; <b>operações urbanas consorciadas interfederativas</b>; zonas para <b>aplicação compartilhada</b> dos instrumentos urbanísticos; <b>consórcios públicos</b> (Lei 11.107/2005); <b>convênios de cooperação</b>; <b>contratos de gestão</b>; compensação por serviços ambientais; e <b>PPPs interfederativas</b> (art. 9º). O <b>PDUI</b> é obrigatório e <b>aprovado por lei estadual</b> (art. 10). Ele <b>não exime</b> o Município de ter <b>plano diretor</b> (§ 2º), que deve ser <b>compatibilizado</b> com o PDUI (§ 3º). É elaborado <b>de forma conjunta e cooperada</b> (Estado, Municípios, sociedade civil) e <b>aprovado pela instância colegiada deliberativa antes de ir à Assembleia Legislativa</b> (§ 4º). <b>Revisão</b>: pelo menos a cada <b>10 anos</b> (art. 11). Conteúdo mínimo (art. 12, § 1º): <b>diretrizes para as FPIC</b>; <b>macrozoneamento</b>; articulação dos Municípios no parcelamento, uso e ocupação do solo; articulação intersetorial; áreas com restrições à urbanização e de <b>risco de desastres</b>; sistema de acompanhamento e controle; e diretrizes de <b>regularização fundiária</b> (Lei 13.465/2017). No processo de elaboração: <b>audiências públicas em todos os Municípios</b>, <b>publicidade</b> e <b>acompanhamento do Ministério Público</b> (§ 2º).", "<b>União, SNDU e outras regras do Estatuto da Metrópole (arts. 13 a 23).</b> A <b>União apoia</b> as iniciativas dos Estados e Municípios voltadas à governança interfederativa, nos limites orçamentários (art. 13). Para o apoio, exige-se que a unidade territorial tenha <b>gestão plena</b> (art. 14), e a região metropolitana deve atender ao conceito de <b>metrópole</b> do art. 2º, VII; admite-se apoio à elaboração do PDUI sem a exigência da alínea c do inciso III (art. 14, § 2º). A região metropolitana instituída por lei complementar que <b>não</b> atenda ao conceito é <b>enquadrada como aglomeração urbana</b> para as políticas federais (art. 15). O art. 20 coloca a aplicação da lei sob coordenação do <b>Sistema Nacional de Desenvolvimento Urbano (SNDU)</b>, com participação da sociedade civil, e um <b>subsistema de planejamento e informações metropolitanas</b>. O art. 22 aplica a lei, no que couber, às <b>regiões integradas de desenvolvimento (RIDEs)</b> criadas por lei complementar federal. O art. 23 preserva a possibilidade de <b>convênios e consórcios públicos</b> entre Municípios. O art. 24 inseriu o <b>art. 34-A no Estatuto da Cidade</b> (<b>operações urbanas consorciadas interfederativas</b>, aprovadas por <b>leis estaduais específicas</b>). <b>Atenção</b>: o art. 21 do Estatuto da Metrópole (improbidade do governador e do prefeito por não elaborarem o PDUI no prazo) está <b>revogado pela Lei 13.683/2018</b>, segundo a própria página do Planalto.", "<b>Estatuto da Cidade: lista de instrumentos (Lei 10.257, art. 4º).</b> Entre outros: <b>planos</b> nacionais, regionais e estaduais; <b>planejamento</b> das regiões metropolitanas e aglomerações; <b>planejamento municipal</b> (plano diretor; disciplina do <b>parcelamento, uso e ocupação do solo</b>; zoneamento ambiental; PPA; LDO; LOA; gestão orçamentária participativa); <b>institutos tributários e financeiros</b> (<b>IPTU</b>, <b>contribuição de melhoria</b>, incentivos fiscais); <b>institutos jurídicos e políticos</b> (desapropriação, servidão, limitações, <b>tombamento</b>, unidades de conservação, <b>ZEIS</b>, CDRU, concessão de uso especial para moradia, <b>PEUC</b>, <b>usucapião especial</b>, <b>direito de superfície</b>, <b>direito de preempção</b>, <b>outorga onerosa</b>, <b>transferência do direito de construir</b>, <b>operações urbanas consorciadas</b>, regularização fundiária, assistência técnica e jurídica gratuita, <b>referendo e plebiscito</b>, <b>demarcação urbanística</b>, <b>legitimação de posse</b>); e <b>EIA e EIV</b>. Os instrumentos <b>regem-se pela legislação própria</b>, observada a lei (§ 1º), e os que demandam dispêndio de recursos devem ser objeto de controle social (§ 3º).", "<b>PEUC, IPTU progressivo e desapropriação-sanção (arts. 5º a 8º).</b> <b>Lei municipal específica</b> para área incluída no plano diretor pode determinar o <b>parcelamento, edificação ou utilização compulsórios</b> do solo urbano <b>não edificado, subutilizado ou não utilizado</b>, fixando condições e prazos (art. 5º). Considera-se <b>subutilizado</b> o imóvel com aproveitamento <b>inferior ao mínimo definido no plano diretor</b> (§ 1º, I). O proprietário é <b>notificado</b> pelo Executivo, e a notificação é <b>averbada no registro de imóveis</b> (§ 2º); a notificação é feita por funcionário ao proprietário (ou, sendo PJ, a quem tenha poderes de gerência geral ou administração) ou, frustradas <b>três tentativas</b>, por <b>edital</b> (§ 3º). Prazos mínimos: <b>1 ano</b> a partir da notificação para protocolar o projeto; <b>2 anos</b> a partir da aprovação para iniciar as obras (§ 4º). A <b>transmissão</b> do imóvel, inter vivos ou causa mortis, <b>após a notificação</b>, <b>transfere as obrigações</b>, sem interromper os prazos (art. 6º). Descumpridos, o Município aplica o <b>IPTU progressivo no tempo</b>, com majoração da alíquota por <b>5 anos consecutivos</b>; a alíquota de cada ano é fixada na lei específica e <b>não pode exceder o dobro</b> do ano anterior, respeitada a <b>alíquota máxima de 15%</b> (art. 7º, § 1º); passados 5 anos sem cumprimento, mantém-se a <b>alíquota máxima</b> até o cumprimento (§ 2º); <b>vedadas isenções ou anistia</b> (§ 3º). Decorridos <b>5 anos de cobrança</b> sem cumprimento, o Município pode <b>desapropriar com pagamento em títulos da dívida pública</b>, de aprovação prévia pelo <b>Senado</b>, resgatáveis em até <b>10 anos</b>, em prestações anuais, iguais e sucessivas, com <b>juros legais de 6% ao ano</b> (art. 8º, § 1º). O valor real da indenização reflete a <b>base de cálculo do IPTU</b>, descontadas as <b>obras do Poder Público após a notificação</b>, e <b>não computa expectativas de ganho, lucros cessantes e juros compensatórios</b> (§ 2º); os títulos <b>não têm poder liberatório</b> para tributos (§ 3º). O Município tem <b>5 anos</b> para dar o aproveitamento adequado (§ 4º), direta ou indiretamente, por licitação (§ 5º), e o adquirente fica sujeito às mesmas obrigações (§ 6º).", "<b>Usucapião especial urbana (arts. 9º e 10).</b> <b>Individual</b>: área ou edificação urbana de até <b>250 m²</b>, por <b>5 anos</b> ininterruptos e sem oposição, para <b>moradia</b>, <b>sem ser proprietário de outro imóvel urbano ou rural</b>; título ao homem, à mulher ou a ambos, <b>independentemente do estado civil</b> (§ 1º); <b>uma só vez</b> (§ 2º); o herdeiro que já resida no imóvel <b>continua a posse</b> do antecessor (§ 3º). <b>Coletiva</b> (art. 10, na redação mais nova): <b>núcleos urbanos informais</b> existentes sem oposição há mais de <b>5 anos</b> e cuja <b>área total dividida pelo número de possuidores seja inferior a 250 m² por possuidor</b>, desde que os possuidores não sejam proprietários de outro imóvel (a redação antiga falava em 'população de baixa renda'; o compilado mostra as duas redações; conferi no texto da página). O restante (sentença, condomínio especial, administração) <b>não li</b>.", "<b>Direito de superfície (arts. 21 a 24).</b> O proprietário urbano pode conceder a outrem o direito de superfície do seu terreno, por <b>tempo determinado ou indeterminado</b>, mediante <b>escritura pública registrada</b> no cartório de registro de imóveis. Abrange o direito de utilizar <b>solo, subsolo ou espaço aéreo</b> conforme o contrato e a legislação urbanística (§ 1º); pode ser <b>gratuita ou onerosa</b> (§ 2º). O superficiário responde pelos <b>encargos e tributos</b> da propriedade superficiária e, proporcionalmente, pelos da área objeto da concessão, salvo disposição contrária (§ 3º); o direito <b>pode ser transferido a terceiros</b> (§ 4º) e, por morte do superficiário, <b>transmite-se aos herdeiros</b> (§ 5º). Em caso de alienação do terreno ou do direito de superfície, o superficiário e o proprietário têm <b>direito de preferência</b>, em igualdade de condições (art. 22). Extingue-se pelo <b>termo</b> ou pelo <b>descumprimento</b> das obrigações (art. 23); extinto, o proprietário recupera o <b>pleno domínio</b>, com acessões e benfeitorias, <b>sem indenização</b>, se o contrato não dispuser o contrário (art. 24); antes do termo, extingue-se se houver <b>destinação diversa</b> da concedida (§ 1º), e a extinção é <b>averbada</b> (§ 2º). (O Código Civil também trata da superfície nos arts. 1.369 e seguintes; <b>de memória</b>.)", "<b>Direito de preempção (arts. 25 a 27).</b> Confere ao <b>Poder Público municipal</b> preferência para <b>aquisição de imóvel urbano objeto de alienação onerosa entre particulares</b> (art. 25). <b>Lei municipal, baseada no plano diretor</b>, delimita as áreas e fixa prazo de vigência <b>não superior a 5 anos</b>, <b>renovável a partir de um ano</b> após o decurso do prazo inicial (§ 1º); fica assegurado durante a vigência, <b>independentemente do número de alienações</b> (§ 2º). Finalidades (art. 26): <b>regularização fundiária; programas habitacionais de interesse social; reserva fundiária; ordenamento e expansão urbana; equipamentos urbanos e comunitários; espaços públicos de lazer e áreas verdes; unidades de conservação; áreas de interesse histórico, cultural ou paisagístico</b>; e outra finalidade. Procedimento (art. 27): o proprietário <b>notifica</b> a intenção de alienar; o Município, em <b>até 30 dias</b>, manifesta por escrito o interesse; a notificação leva <b>proposta de compra assinada por terceiro</b> (preço, condições, validade); o Município publica <b>edital</b>; sem manifestação, o proprietário pode alienar a terceiros nas condições da proposta; concretizada a venda, apresenta <b>cópia do instrumento</b> em <b>30 dias</b>. A alienação em <b>condições diversas</b> da proposta é <b>nula de pleno direito</b>, e o Município pode adquirir pelo <b>valor da base de cálculo do IPTU</b> ou pelo da proposta, se inferior (§§ 5º e 6º).", "<b>Outorga onerosa e transferência do direito de construir (arts. 28 a 31 e 35).</b> <b>Outorga onerosa do direito de construir</b>: o plano diretor fixa áreas em que o direito de construir pode ser exercido <b>acima do coeficiente de aproveitamento básico</b>, mediante <b>contrapartida</b> do beneficiário (art. 28). <b>Coeficiente de aproveitamento</b> é a relação entre a <b>área edificável e a área do terreno</b> (§ 1º); o básico pode ser <b>único</b> para toda a zona urbana ou <b>diferenciado</b> (§ 2º); o plano define os <b>limites máximos</b>, considerando a proporcionalidade entre a <b>infraestrutura existente</b> e o aumento de densidade (§ 3º). Também se pode permitir <b>alteração de uso do solo</b> mediante contrapartida (art. 29). Uma <b>lei municipal específica</b> estabelece a <b>fórmula de cálculo</b>, os <b>casos de isenção</b> e a <b>contrapartida</b> (art. 30); os recursos têm <b>destinação vinculada</b> (art. 31, finalidades do art. 26, I a IX). <b>Transferência do direito de construir</b> (art. 35): lei municipal, baseada no plano diretor, autoriza o proprietário de imóvel urbano, <b>privado ou público</b>, a <b>exercer em outro local ou alienar, por escritura pública</b>, o direito de construir quando o imóvel for necessário para: <b>equipamentos urbanos e comunitários</b>; <b>preservação</b> de interesse histórico, ambiental, paisagístico, social ou cultural; ou <b>regularização fundiária</b>, urbanização de áreas ocupadas por população de baixa renda e habitação de interesse social. A mesma faculdade vale para quem <b>doar</b> ao Poder Público seu imóvel (§ 1º).", "<b>Operações urbanas consorciadas (arts. 32 a 34-A).</b> Conjunto de intervenções e medidas coordenadas pelo <b>Poder Público municipal</b>, com a participação de <b>proprietários, moradores, usuários permanentes e investidores privados</b>, para alcançar em uma área <b>transformações urbanísticas estruturais, melhorias sociais e valorização ambiental</b> (art. 32, § 1º). <b>Lei municipal específica, baseada no plano diretor</b>, delimita a área; podem ser previstas: modificação de índices e características de parcelamento, uso e ocupação do solo; <b>regularização</b> de construções em desacordo com a legislação; e <b>incentivos</b> a tecnologias que reduzam impactos ambientais (§ 2º). A lei contém o <b>plano de operação</b>: área, programa básico de ocupação, <b>programa de atendimento econômico e social</b> da população afetada, finalidades, <b>EIV</b>, <b>contrapartida</b>, forma de controle <b>compartilhado com a sociedade civil</b> e natureza dos incentivos (art. 33). <b>Os recursos</b> obtidos são aplicados <b>exclusivamente na própria operação</b> (§ 1º), e, a partir da lei, são <b>nulas</b> as licenças contrárias ao plano (§ 2º). A lei pode prever os <b>CEPACs (certificados de potencial adicional de construção)</b>, alienados em leilão ou usados no pagamento das obras, <b>livremente negociados</b> mas <b>conversíveis em direito de construir unicamente na área da operação</b> (art. 34, §§ 1º e 2º). Nas regiões metropolitanas e aglomerações, podem existir operações <b>interfederativas</b>, aprovadas por <b>leis estaduais específicas</b> (art. 34-A).", "<b>EIV, plano diretor e gestão democrática (arts. 36 a 46).</b> <b>Estudo de Impacto de Vizinhança (EIV)</b>: <b>lei municipal</b> define os empreendimentos e atividades, <b>privados ou públicos</b>, que dependem do EIV para obter licenças de construção, ampliação ou funcionamento (art. 36). Analisa os efeitos <b>positivos e negativos</b> sobre a qualidade de vida da população da área e proximidades, incluindo no mínimo: <b>adensamento populacional; equipamentos urbanos e comunitários; uso e ocupação do solo; valorização imobiliária; mobilidade urbana, geração de tráfego e demanda por transporte público; ventilação e iluminação; paisagem urbana e patrimônio natural e cultural</b> (art. 37); os documentos são <b>públicos</b> (parágrafo único). O EIV <b>não substitui</b> o <b>EIA</b> (art. 38). <b>Plano diretor</b> (arts. 39 a 42-B): <b>função social</b> da propriedade urbana = atender às exigências do plano diretor (art. 39); <b>lei municipal</b>; <b>instrumento básico</b> (art. 40); <b>obrigatório</b> para cidades com <b>mais de 20 mil habitantes</b>, integrantes de <b>regiões metropolitanas e aglomerações</b>, onde se pretenda usar os instrumentos do <b>art. 182, § 4º</b>, de <b>especial interesse turístico</b>, na área de influência de empreendimentos de <b>significativo impacto ambiental</b> e as incluídas no <b>cadastro nacional de áreas suscetíveis a desastres</b> (art. 41); cidades com mais de <b>500 mil habitantes</b> devem ter <b>plano de transporte urbano integrado</b> (§ 2º). <b>Conteúdo mínimo</b> (art. 42): delimitação das áreas para o <b>PEUC</b>; disposições sobre <b>preempção, outorga onerosa, alteração de uso, operações consorciadas e transferência do direito de construir</b>; <b>sistema de acompanhamento e controle</b>. <b>Gestão democrática</b> (arts. 43 a 45): <b>órgãos colegiados</b>, <b>debates, audiências e consultas públicas</b>, <b>conferências</b>, <b>iniciativa popular</b>; a <b>gestão orçamentária participativa</b> exige debates e audiências sobre PPA, LDO e LOA como <b>condição obrigatória</b> para aprovação pela Câmara (art. 44). <b>Consórcio imobiliário</b> (art. 46): o Município pode facultar ao proprietário atingido pelo art. 5º que <b>transfira o imóvel ao poder público</b> e, após as obras, receba <b>unidades imobiliárias urbanizadas ou edificadas</b> como pagamento (§ 1º), cujo valor corresponde ao <b>valor do imóvel antes da execução das obras</b> (§ 2º); a nova redação inclui a <b>regularização fundiária</b> e não livra quem causou <b>núcleo urbano informal</b> da responsabilidade (§ 3º).", "<b>ZEIS, resumo operacional e pontos de conferência.</b> <b>ZEIS</b> são áreas do território urbano, <b>delimitadas pelo plano diretor ou lei municipal</b>, destinadas à <b>habitação de interesse social</b> e à <b>regularização fundiária</b>, com parâmetros urbanísticos próprios (doutrina; de memória). O Estatuto da Cidade as lista no <b>art. 4º, V, f</b> e manda prever <b>zonas especiais de interesse social</b> nos planos de expansão urbana e de áreas de risco (arts. 42-A e 42-B, que li; a numeração no compilado vem misturada). <b>Resumo</b>: (1) Estatuto da Metrópole é de <b>governança interfederativa</b>, com <b>PDUI estadual</b> e revisão a cada <b>10 anos</b>; (2) o PDUI <b>não dispensa</b> o plano diretor; (3) a <b>sequência</b> do art. 182, § 4º, é PEUC, IPTU progressivo (5 anos, máximo de 15%, dobro a cada ano) e desapropriação com títulos (10 anos, juros de 6%); (4) <b>preempção</b>: 5 anos de vigência, 30 dias para manifestação; (5) <b>outorga</b>, <b>TDC</b> e <b>operações consorciadas</b> dependem de <b>lei municipal específica baseada no plano diretor</b>; (6) <b>EIV</b> não substitui <b>EIA</b>; (7) <b>superfície</b> por escritura pública registrada; (8) recursos da outorga e das operações têm <b>destinação vinculada</b>. <b>De memória</b> (conferir): o STF, na <b>ADI 1.842</b> (regiões metropolitanas do RJ), afirmou que o <b>interesse comum</b> exige <b>decisão compartilhada</b> entre Estado e Municípios, sem <b>concentração</b> do poder em um só ente, e o Estatuto da Metrópole segue essa linha."], "pega": ["Metrópole: a banca diz que a região metropolitana é instituída por <b>lei ordinária</b> ou por <b>decreto</b> do Estado, ou pela <b>União</b>. É criada pelos <b>Estados, mediante lei complementar</b>, por agrupamento de Municípios <b>limítrofes</b> (art. 3º); só os casos de RIDEs seguem lei complementar federal (art. 22).", "PDUI: a banca afirma que o plano de desenvolvimento urbano integrado <b>substitui</b> o plano diretor dos Municípios. O art. 10, § 2º, diz que <b>não exime</b> o Município de formular o plano diretor, que deve ser <b>compatibilizado</b> com o PDUI (§ 3º).", "Prazo de revisão: a banca fixa a revisão do PDUI em <b>5 anos</b> (ou do plano diretor em 5). O Estatuto da Metrópole (art. 11) e o Estatuto da Cidade (art. 40, § 3º) fixam <b>pelo menos 10 anos</b>.", "Estrutura de governança: a banca esquece a <b>instância colegiada deliberativa</b> com <b>representação da sociedade civil</b>, ou diz que só há instância executiva. O art. 8º traz <b>quatro</b> elementos: executiva, colegiada deliberativa, organização técnico-consultiva e sistema integrado de recursos e prestação de contas.", "Improbidade na governança: a banca afirma que o governador e o prefeito <b>respondem por improbidade</b> se não elaborarem o PDUI ou compatibilizarem o plano diretor (art. 21 da Lei 13.089). A página do Planalto marca o art. 21 como <b>revogado pela Lei 13.683/2018</b>.", "PEUC e IPTU progressivo: a banca diz que o IPTU progressivo pode ser aplicado <b>sem</b> a notificação e o prazo para o PEUC, ou que a alíquota pode passar de 15%. A sequência é <b>PEUC, IPTU progressivo e desapropriação</b>; a alíquota dobra por ano, com <b>teto de 15%</b>, durante <b>5 anos</b> (art. 7º), e <b>não há isenção nem anistia</b> (§ 3º).", "Desapropriação-sanção: a banca afirma que a indenização é em <b>dinheiro</b>, com <b>juros compensatórios</b> e lucros cessantes. É em <b>títulos da dívida pública</b>, resgatáveis em <b>até 10 anos</b>, com <b>juros legais de 6%</b>; o valor real <b>não computa</b> expectativas de ganho, lucros cessantes e juros compensatórios (art. 8º, §§ 1º e 2º).", "Preempção: a banca diz que o direito de preempção vale por <b>10 anos</b>, ou que o Município tem <b>60 dias</b> para manifestar o interesse. A vigência é de até <b>5 anos</b> (renovável após um ano); a manifestação do Município é em até <b>30 dias</b> (arts. 25 e 27).", "Outorga onerosa: a banca afirma que a outorga é criada por <b>decreto</b> ou é livre de contrapartida e de destinação. Exige <b>plano diretor</b> e <b>lei municipal específica</b> (fórmula de cálculo, isenções e contrapartida), e os recursos têm <b>destinação vinculada</b> (arts. 28 a 31).", "Operações urbanas consorciadas: a banca diz que os recursos podem ir ao <b>caixa geral</b> do Município, ou que a licença contrária ao plano continua válida. Os recursos são aplicados <b>exclusivamente na operação</b> e as licenças em desacordo são <b>nulas</b> (art. 33, §§ 1º e 2º); os CEPACs só se convertem em direito de construir <b>na área da operação</b> (art. 34, § 1º).", "EIV: a banca afirma que o EIV <b>dispensa</b> o EIA, ou que só vale para empreendimentos <b>privados</b>. O EIV <b>não substitui</b> o EIA (art. 38) e abrange atividades <b>privadas ou públicas</b>, conforme lei municipal (art. 36)."]}, {"materia": "DIREITO EMPRESARIAL", "titulo": "Sociedades: disposições gerais, personalidade e desconsideração, sociedades não personificadas, sociedade simples, limitada, anônima, transformação, incorporação, fusão e cisão", "key": "EMP", "nome": "Empresarial", "conc": ["Edital: item 2 de Direito Empresarial (sociedades; fica para outras unidades a defesa da concorrência e a falência). Li <b>literalmente</b>, no navegador (Planalto): <b>Código Civil, arts. 50, 51, 981 a 994, 997 e 998 (início), 1.023 a 1.027, 1.052 a 1.063, 1.071 a 1.077, 1.080 a 1.084</b>; <b>Lei 6.404/1976, arts. 1º a 3º, 80, 109, 116, 117, 153 a 155, 158, 220 a 223, 227 a 229, 233 a 235, 243 e 265</b>. <b>Não li</b>: os demais artigos do CC sobre sociedade simples (arts. 999 a 1.022, 1.030 a 1.038), sociedade em nome coletivo, comandita, cooperativa; a parte da limitada sobre conselho fiscal, exclusão de sócio (art. 1.085) e dissolução; <b>a maior parte da Lei das S.A.</b> (ações, assembleia, conselhos, balanços, debêntures, o regime de economia mista dos arts. 236 a 240, consórcio dos arts. 278 e 279); o <b>CPC</b> (arts. 133 a 137, incidente de desconsideração); o <b>CDC</b> (art. 28); a <b>Lei 13.303/2016</b>; e a <b>Lei 14.133/2021</b>. Tudo isso, quando aparece abaixo, vem <b>da minha memória</b> e está <b>sinalizado</b>. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Contrato de sociedade e espécies (CC, arts. 981 a 985).</b> Celebram contrato de sociedade as pessoas que <b>reciprocamente se obrigam a contribuir, com bens ou serviços, para o exercício de atividade econômica e a partilha, entre si, dos resultados</b> (art. 981); a atividade pode restringir-se a <b>um ou mais negócios determinados</b> (parágrafo único). Salvo exceções, é <b>empresária</b> a sociedade cujo objeto é atividade própria de empresário sujeito a registro (art. 967); as demais são <b>simples</b> (art. 982). <b>Independentemente do objeto</b>, é <b>empresária a sociedade por ações</b> e <b>simples a cooperativa</b> (parágrafo único). A sociedade empresária deve constituir-se segundo um dos tipos dos arts. 1.039 a 1.092; a simples pode adotar um desses tipos, e, se não o fizer, submete-se às suas próprias normas (art. 983), ressalvadas a conta de participação, a cooperativa e as leis especiais. A sociedade que tem por objeto <b>atividade rural</b> e se constitui como sociedade empresária pode requerer <b>inscrição no Registro Público de Empresas Mercantis</b> e, depois, fica <b>equiparada</b> à empresária (art. 984).", "<b>Personalidade jurídica (art. 985) e a distinção de tipos.</b> A sociedade <b>adquire personalidade</b> com a <b>inscrição, no registro próprio, dos seus atos constitutivos</b> (art. 985; arts. 45 e 1.150, de memória). Das <b>personificadas</b> (que têm registro): <b>sociedade simples, em nome coletivo, em comandita simples, limitada, anônima e em comandita por ações</b> (de memória a lista completa), além da cooperativa. <b>Não personificadas</b> (que não adquiriram personalidade): <b>sociedade em comum</b> (arts. 986 a 990) e <b>sociedade em conta de participação</b> (arts. 991 a 996). Duas regras de prova: na sociedade em comum, os sócios, entre si ou com terceiros, só podem <b>provar a existência por escrito</b>, mas <b>terceiros podem prová-la de qualquer modo</b> (art. 987); na conta de participação, a constituição <b>independe de formalidade</b> e prova-se por todos os meios (art. 992).", "<b>Sociedade em comum (arts. 986 a 990).</b> Enquanto <b>não inscritos os atos constitutivos</b>, a sociedade se rege pelo capítulo da sociedade em comum e, <b>subsidiariamente</b>, pelas normas da <b>sociedade simples</b> (art. 986). <b>Os bens e dívidas sociais constituem patrimônio especial</b>, do qual os sócios são <b>titulares em comum</b> (art. 988). Os bens sociais respondem pelos atos de gestão praticados por qualquer dos sócios, salvo pacto limitativo de poderes, que só tem eficácia contra o terceiro que o conheça ou deva conhecer (art. 989). <b>Todos os sócios respondem solidária e ilimitadamente</b> pelas obrigações sociais, <b>excluído do benefício de ordem</b> (art. 1.024) <b>aquele que contratou pela sociedade</b> (art. 990). Na prática: quem age sem registro assume <b>responsabilidade pessoal</b> pelas dívidas.", "<b>Sociedade em conta de participação (arts. 991 a 996).</b> A atividade constitutiva do objeto social é exercida <b>unicamente pelo sócio ostensivo</b>, em <b>nome individual e sob sua exclusiva responsabilidade</b>; os demais (<b>participantes</b>) participam dos <b>resultados</b> (art. 991). Obriga-se perante terceiro <b>tão somente o sócio ostensivo</b>, e o participante <b>só perante este</b> (parágrafo único). O contrato produz efeito <b>apenas entre os sócios</b>, e a <b>inscrição do instrumento</b> em qualquer registro <b>não confere personalidade</b> (art. 993). Sem prejuízo do direito de <b>fiscalizar</b>, o participante <b>não pode tomar parte nas relações</b> do ostensivo com terceiros, sob pena de <b>responder solidariamente</b> pelas obrigações em que intervier (art. 993, parágrafo único). A contribuição constitui, com a do ostensivo, <b>patrimônio especial</b> (art. 994, que li só no início).", "<b>Desconsideração da personalidade jurídica (CC, art. 50).</b> Em caso de <b>abuso da personalidade jurídica</b>, caracterizado por <b>desvio de finalidade</b> ou por <b>confusão patrimonial</b>, o juiz pode, <b>a requerimento da parte ou do Ministério Público</b> (quando lhe couber intervir), desconsiderá-la para que os efeitos de <b>certas e determinadas relações de obrigações</b> sejam estendidos aos <b>bens particulares de administradores ou de sócios beneficiados direta ou indiretamente pelo abuso</b>. <b>Desvio de finalidade</b> é a utilização da pessoa jurídica <b>com o propósito de lesar credores e para a prática de atos ilícitos de qualquer natureza</b> (§ 1º). <b>Confusão patrimonial</b> é a <b>ausência de separação de fato entre os patrimônios</b>, caracterizada por (I) <b>cumprimento repetitivo</b> pela sociedade de obrigações do sócio ou administrador ou vice-versa; (II) <b>transferência de ativos ou passivos sem efetivas contraprestações</b>, exceto os de valor proporcionalmente insignificante; (III) outros atos de descumprimento da autonomia patrimonial (§ 2º). A <b>desconsideração inversa</b> está no § 3º: o mesmo regime se aplica à <b>extensão das obrigações de sócios ou administradores à pessoa jurídica</b>. A <b>mera existência de grupo econômico</b> sem os requisitos <b>não autoriza</b> a desconsideração (§ 4º), e a <b>mera expansão ou alteração da finalidade original</b> da atividade econômica <b>não é desvio de finalidade</b> (§ 5º). O art. 50 (redação da Lei 13.874/2019, <b>de memória</b>) adotou a <b>teoria maior</b> (exige abuso); o <b>CDC, art. 28</b>, e a legislação ambiental adotam a <b>teoria menor</b> (basta a insolvência/obstáculo ao ressarcimento; <b>de memória</b>). O <b>incidente de desconsideração</b> é regulado nos <b>arts. 133 a 137 do CPC</b> (<b>não li</b>), e cabe em qualquer fase, com <b>suspensão do processo</b> e contraditório.", "<b>Sociedade simples: responsabilidade dos sócios (arts. 997, 1.023 a 1.027).</b> A sociedade simples se constitui por <b>contrato escrito</b>, particular ou público, que menciona (art. 997): qualificação dos sócios; <b>denominação, objeto, sede e prazo</b>; <b>capital</b> em moeda corrente (podendo compreender qualquer espécie de bens suscetíveis de avaliação); <b>quota</b> de cada sócio e modo de realizá-la; <b>prestações de serviços</b>; administradores e poderes; <b>participação nos lucros e perdas</b>; e se os sócios <b>respondem ou não subsidiariamente</b> pelas obrigações sociais. É <b>ineficaz perante terceiros</b> pacto separado contrário ao contrato (parágrafo único). O prazo para inscrever o contrato no <b>Registro Civil das Pessoas Jurídicas</b> é de <b>30 dias</b> (art. 998). <b>Responsabilidade</b>: se os bens da sociedade não cobrirem as dívidas, <b>respondem os sócios pelo saldo, na proporção em que participem das perdas</b>, salvo cláusula de responsabilidade solidária (art. 1.023). Os bens particulares dos sócios <b>só podem ser executados após os bens sociais</b> (art. 1.024, o <b>benefício de ordem</b>). O sócio que <b>entra depois</b> não se exime das dívidas anteriores (art. 1.025). O credor particular do sócio pode alcançar o que ao sócio couber <b>nos lucros</b> ou na liquidação (art. 1.026); os herdeiros do cônjuge de sócio <b>não podem exigir desde logo</b> a parte da quota (art. 1.027).", "<b>Sociedade limitada: características (arts. 1.052 a 1.059).</b> A responsabilidade de cada sócio é <b>restrita ao valor de suas quotas</b>, mas <b>todos respondem solidariamente pela integralização do capital social</b> (art. 1.052). Pode ser constituída por <b>uma ou mais pessoas</b> (§ 1º; a limitada <b>unipessoal</b> segue, no que couber, as regras do contrato social, § 2º). Rege-se, nas omissões, pelas normas da <b>sociedade simples</b>, e o contrato pode prever a <b>regência supletiva da lei das S.A.</b> (art. 1.053). O capital divide-se em <b>quotas</b>, iguais ou desiguais (art. 1.055). Pela <b>exata estimação de bens</b> conferidos ao capital respondem <b>solidariamente todos os sócios</b> até <b>5 anos</b> do registro (§ 1º). <b>É vedada contribuição que consista em prestação de serviços</b> (§ 2º). A quota é <b>indivisível</b> em relação à sociedade (art. 1.056). Na omissão do contrato, o sócio pode <b>ceder sua quota</b> a sócio sem audiência dos demais, ou a <b>estranho, se não houver oposição de titulares de mais de um quarto do capital</b> (art. 1.057); a cessão tem eficácia perante a sociedade e terceiros a partir da <b>averbação</b>. Contra o <b>sócio remisso</b>, os outros podem tomar a quota para si ou transferi-la a terceiros (art. 1.058). Os sócios devem <b>repor lucros e quantias retiradas</b> distribuídos com prejuízo do capital (art. 1.059).", "<b>Limitada: administração, deliberações e capital (arts. 1.060 a 1.084).</b> É administrada por <b>uma ou mais pessoas designadas no contrato ou em ato separado</b> (art. 1.060). A designação de <b>administrador não sócio</b> depende da aprovação de <b>no mínimo 2/3 dos sócios</b>, enquanto o capital não estiver integralizado, e de <b>titulares de quotas correspondentes a mais da metade do capital</b>, após a integralização (art. 1.061, texto vigente, conforme a página). O administrador designado em ato separado toma posse mediante <b>termo no livro de atas</b>, e a posse não assinada em <b>30 dias</b> faz a designação perder efeito (art. 1.062); <b>destituição</b> a qualquer tempo, ressalvado o sócio nomeado no contrato, que exige quórum próprio (art. 1.063, § 1º). <b>Dependem de deliberação dos sócios</b> (art. 1.071): contas, designação e destituição de administradores, remuneração, <b>modificação do contrato</b>, incorporação, fusão e dissolução, liquidantes. Quórum (art. 1.076): <b>mais da metade do capital</b> para os casos de designação, destituição, remuneração, modificação do contrato, incorporação, fusão, dissolução e outros; <b>maioria dos presentes</b> nos demais. A <b>assembleia é obrigatória</b> se os sócios forem <b>mais de dez</b> (art. 1.072, § 1º); reunião e assembleia são <b>dispensáveis</b> quando todos decidirem <b>por escrito</b> (§ 3º). <b>Quórum de instalação</b> (art. 1.074): em primeira convocação, <b>3/4 do capital</b>; em segunda, qualquer número. <b>Retirada</b> do dissidente em <b>30 dias</b> após deliberação de modificação do contrato, fusão ou incorporação (art. 1.077). <b>As deliberações que infringem o contrato ou a lei tornam ilimitada a responsabilidade dos que as aprovaram</b> (art. 1.080). <b>Aumento de capital</b>: depois de integralizadas as quotas, os sócios têm <b>preferência por 30 dias</b> (art. 1.081). <b>Redução</b>: por <b>perdas irreparáveis</b> ou se <b>excessivo</b>; no segundo caso, o credor quirografário pode se opor em <b>90 dias</b> (art. 1.084, § 1º).", "<b>Sociedade anônima: conceito e constituição (Lei 6.404/1976, arts. 1º a 3º e 80).</b> A companhia ou S.A. tem o <b>capital dividido em ações</b>, e a responsabilidade dos acionistas é <b>limitada ao preço de emissão das ações subscritas ou adquiridas</b> (art. 1º). Pode ter por objeto <b>qualquer empresa de fim lucrativo</b>, não contrário à lei, à ordem pública e aos bons costumes (art. 2º); <b>qualquer que seja o objeto, a companhia é mercantil</b> (§ 1º), e o estatuto define o objeto de modo <b>preciso e completo</b> (§ 2º). O nome é uma <b>denominação</b> com 'companhia' ou 'sociedade anônima' (art. 3º). <b>Requisitos preliminares da constituição</b> (art. 80): <b>subscrição por pelo menos 2 pessoas</b> de todas as ações; <b>entrada de pelo menos 10% do preço de emissão</b> das ações subscritas em dinheiro; <b>depósito</b> da parte realizada em dinheiro em banco autorizado (Banco do Brasil ou outro autorizado pela CVM). Aberta ou fechada conforme os valores mobiliários estejam ou não admitidos à negociação em bolsa ou balcão (art. 4º).", "<b>Direitos dos acionistas e acionista controlador (arts. 109, 116 e 117).</b> Nem o estatuto nem a assembleia podem privar o acionista dos direitos de: <b>participar dos lucros</b>; <b>participar do acervo em liquidação</b>; <b>fiscalizar a gestão</b>; <b>preferência</b> para subscrição de ações e valores conversíveis; e <b>retirar-se</b> nos casos previstos em lei (art. 109). As ações de cada classe conferem <b>iguais direitos</b> (§ 1º). <b>Acionista controlador</b> é a pessoa, natural ou jurídica, ou o grupo vinculado por acordo de voto ou sob controle comum, que (a) é titular de direitos de sócio que lhe assegurem, <b>de modo permanente, a maioria dos votos</b> nas deliberações e o <b>poder de eleger a maioria dos administradores</b>; e (b) <b>usa efetivamente</b> seu poder para <b>dirigir as atividades sociais e orientar o funcionamento dos órgãos</b> (art. 116). O poder deve ser usado para fazer a companhia realizar o seu <b>objeto</b> e cumprir sua <b>função social</b>, com deveres para com os demais acionistas, <b>os que nela trabalham e a comunidade</b> (parágrafo único). O controlador <b>responde pelos danos causados por atos com abuso de poder</b> (art. 117); são modalidades, por exemplo: orientar a companhia para <b>fim estranho ao objeto social ou lesivo ao interesse nacional</b>; promover <b>liquidação de companhia próspera, transformação, incorporação, fusão ou cisão</b> para obter <b>vantagem indevida</b>; promover alteração estatutária ou emissão de valores sem interesse da companhia; <b>eleger administrador ou fiscal que sabe inapto</b>; <b>contratar com a companhia em condições de favorecimento</b>; <b>aprovar contas irregulares</b> por favorecimento pessoal.", "<b>Administradores: deveres e responsabilidade (arts. 153 a 158).</b> O administrador deve empregar o <b>cuidado e a diligência que todo homem ativo e probo costuma empregar</b> nos seus negócios (art. 153: <b>dever de diligência</b>). Deve exercer as atribuições <b>nos fins e no interesse da companhia</b>, satisfeitas as exigências do <b>bem público e da função social</b> (art. 154); é <b>vedado</b> praticar ato de <b>liberalidade à custa da companhia</b>, tomar <b>empréstimo</b> de recursos da companhia sem autorização, e <b>receber vantagem pessoal</b> de terceiros sem autorização (art. 154, § 2º). <b>Dever de lealdade</b>: servir com lealdade e manter <b>reserva sobre negócios</b> (art. 155, início, que li só em parte). <b>Responsabilidade</b> (art. 158): <b>não responde pessoalmente</b> pelas obrigações contraídas em nome da sociedade e em virtude de <b>ato regular de gestão</b>; responde <b>civilmente</b> pelos prejuízos que causar quando proceder (I) <b>dentro de suas atribuições, com culpa ou dolo</b>, ou (II) <b>com violação da lei ou do estatuto</b>. O administrador <b>não é responsável por atos ilícitos de outros</b>, salvo conivência, negligência em descobri-los ou omissão em impedir (§ 1º), eximindo-se o <b>dissidente</b> que consigne a divergência em ata ou dê ciência por escrito.", "<b>Transformação, incorporação, fusão e cisão (Lei 6.404, arts. 220 a 234).</b> <b>Transformação</b> (art. 220): operação pela qual a sociedade passa, <b>independentemente de dissolução e liquidação</b>, de um tipo para outro; exige <b>consentimento unânime</b> dos sócios ou acionistas, <b>salvo previsão no estatuto ou contrato</b>, caso em que o dissidente tem direito de <b>retirada</b> (art. 221); <b>não prejudica os credores</b>, que mantêm as mesmas garantias (art. 222). <b>Incorporação</b> (art. 227): uma ou mais sociedades são <b>absorvidas por outra</b>, que lhes <b>sucede em todos os direitos e obrigações</b>; aprovado o laudo e a incorporação, <b>extingue-se a incorporada</b>. <b>Fusão</b> (art. 228): unem-se duas ou mais sociedades para formar <b>sociedade nova</b>, que lhes sucede; extinguem-se as originais; é vedado aos sócios de cada uma votar o laudo de avaliação do patrimônio da sociedade de que fazem parte (§ 2º). <b>Cisão</b> (art. 229): a companhia <b>transfere parcelas do seu patrimônio</b> para uma ou mais sociedades, constituídas para esse fim ou já existentes, <b>extinguindo-se</b> a cindida, se houver versão total, ou <b>dividindo-se o seu capital</b>, se parcial. <b>Responsabilidade na cisão</b> (art. 233): na cisão com extinção, as sociedades que absorverem parcelas <b>respondem solidariamente</b> pelas obrigações da extinta; a cindida que subsistir e as que absorverem parcelas respondem <b>solidariamente</b> pelas obrigações anteriores à cisão; na <b>cisão parcial</b>, o ato pode estipular que as receptoras <b>só respondem pelas obrigações transferidas</b>, sem solidariedade, mas <b>qualquer credor anterior pode se opor</b>, notificando em <b>90 dias</b> da publicação. As operações podem ocorrer entre <b>tipos iguais ou diferentes</b> (art. 223). A certidão do registro do comércio é título hábil para <b>averbar a sucessão</b> nos registros públicos (art. 234).", "<b>Grupos, coligadas, controladas e economia mista (arts. 235, 243 e 265).</b> <b>Controlada</b>: a sociedade em que a controladora, diretamente ou por outras controladas, é titular de direitos de sócio que lhe assegurem, <b>de modo permanente, preponderância nas deliberações</b> e o poder de <b>eleger a maioria dos administradores</b> (art. 243, § 2º). <b>Coligadas</b>: a redação antiga usava <b>10% ou mais do capital</b>, sem controle; a redação atual usa a <b>influência significativa</b> (§ 1º; a página mostra as duas redações). <b>Grupo de sociedades</b> (art. 265): a controladora e suas controladas podem constituir grupo por <b>convenção</b> pela qual se obriguem a combinar recursos ou esforços ou participar de atividades comuns; a controladora deve ser <b>brasileira</b> e exercer o controle de modo permanente (§ 1º). <b>Sociedade de economia mista</b>: as S.A. de economia mista sujeitam-se à Lei 6.404, <b>sem prejuízo de disposições especiais de lei federal</b> (art. 235); as companhias abertas de economia mista também se sujeitam às normas da <b>CVM</b> (§ 1º). <b>De memória (conferir)</b>: a CF, art. 173, § 1º, exige <b>estatuto jurídico próprio</b> para as estatais que exploram atividade econômica, a <b>Lei 13.303/2016</b> o instituiu, e a <b>empresa pública</b> pode ter <b>qualquer forma societária</b>, com capital 100% público; a <b>sociedade de economia mista</b> adota a forma de <b>S.A.</b>, com maioria das ações com direito a voto pertencente ao ente público. <b>Consórcio de empresas</b> (arts. 278 e 279 da Lei 6.404; <b>não li</b>): de memória, <b>não tem personalidade</b> e as consorciadas <b>respondem sem presunção de solidariedade</b>, regra que a Lei de Licitações modifica para o consórcio em licitações (conferir).", "<b>Resumo operacional para prova.</b> (1) <b>Sociedade empresária × simples</b> pelo <b>objeto</b>; S.A. é sempre empresária, cooperativa sempre simples. (2) <b>Personalidade</b>: surge com a <b>inscrição</b> dos atos constitutivos (art. 985). (3) <b>Sociedade em comum</b>: sócios respondem <b>solidária e ilimitadamente</b>, quem contratou <b>sem benefício de ordem</b>. (4) <b>Conta de participação</b>: só o <b>sócio ostensivo</b> se obriga perante terceiros; a inscrição <b>não dá</b> personalidade. (5) <b>Desconsideração</b> (CC, art. 50): <b>desvio de finalidade ou confusão patrimonial</b>; grupo econômico sozinho <b>não basta</b>; vale a <b>inversa</b> (§ 3º). (6) <b>Limitada</b>: responsabilidade <b>limitada ao valor das quotas</b>, mas <b>solidária pela integralização</b>; <b>serviços não integralizam</b> capital. (7) <b>S.A.</b>: pelo menos <b>2 subscritores</b>, <b>10% de entrada</b>. (8) <b>Controlador</b> responde por abuso; <b>administrador</b> responde por culpa/dolo ou violação da lei. (9) <b>Transformação</b>: sem dissolução e sem prejudicar credores; <b>incorporação</b> extingue a incorporada, <b>fusão</b> cria nova sociedade, <b>cisão</b> divide o patrimônio (solidariedade regra, exceção na parcial com oposição dos credores)."], "pega": ["Tipos: a banca diz que a sociedade <b>por ações</b> pode ser simples quando o objeto não é empresarial, ou que a <b>cooperativa</b> é sempre empresária. Pelo art. 982, parágrafo único, a S.A. é <b>sempre empresária</b> e a cooperativa <b>sempre simples</b>.", "Personalidade: a banca afirma que a sociedade em conta de participação <b>adquire personalidade</b> com a inscrição do contrato. O art. 993 diz que a inscrição <b>não confere personalidade</b>, e o contrato só vale entre os sócios.", "Sociedade em comum: a banca diz que os sócios respondem <b>subsidiariamente e limitadamente</b>, ou que o sócio que contratou pode invocar o <b>benefício de ordem</b>. Respondem <b>solidária e ilimitadamente</b>, e <b>excluído do benefício de ordem</b> aquele que contratou pela sociedade (art. 990).", "Prova da sociedade em comum: a banca afirma que <b>terceiros</b> só provam por escrito. Os <b>sócios</b> só provam por escrito; <b>terceiros</b> podem provar <b>de qualquer modo</b> (art. 987).", "Desconsideração: a banca diz que a <b>mera inadimplência</b> ou a <b>existência de grupo econômico</b> autoriza a desconsideração pelo art. 50. O CC exige <b>abuso</b>, por <b>desvio de finalidade ou confusão patrimonial</b>; o grupo sozinho não basta (§ 4º), e a expansão da atividade não é desvio (§ 5º). A teoria menor está em <b>leis especiais</b> (CDC, ambiental), segundo a minha memória.", "Sociedade simples: a banca afirma que os sócios <b>não respondem</b> pelas dívidas além do capital. Os sócios respondem pelo saldo, <b>proporcionalmente às perdas</b>, salvo solidariedade pactuada (art. 1.023), mas <b>só após</b> executados os bens sociais (art. 1.024).", "Limitada: a banca diz que o sócio <b>só responde pelas suas quotas</b>, sem solidariedade. Todos respondem <b>solidariamente pela integralização</b> do capital (art. 1.052) e, por <b>5 anos</b>, pela exata estimação de bens conferidos (art. 1.055, § 1º).", "Capital da limitada: a banca admite capital em <b>prestação de serviços</b> na limitada (como na sociedade simples). O art. 1.055, § 2º, <b>veda</b> contribuição que consista em prestação de serviços na limitada.", "Administração: a banca diz que o administrador não sócio da limitada é designado por <b>maioria simples</b> dos presentes. Exige-se <b>2/3 dos sócios</b> enquanto o capital não está integralizado e <b>mais da metade do capital</b> após a integralização (art. 1.061).", "S.A.: a banca afirma que a companhia se constitui com <b>um só subscritor</b> ou com <b>50%</b> de entrada. São necessárias <b>2 pessoas</b> e <b>10% do preço de emissão</b> das ações subscritas em dinheiro (art. 80); as exceções são as <b>subsidiárias integrais</b> (de memória).", "Administrador: a banca diz que o administrador responde <b>pessoalmente</b> pelas obrigações contraídas em nome da companhia. Não responde por <b>ato regular de gestão</b>; responde civilmente por <b>culpa ou dolo</b> ou por <b>violação da lei ou do estatuto</b> (art. 158).", "Cisão: a banca afirma que a sociedade receptora <b>nunca</b> responde pelas dívidas da cindida, ou que sempre responde <b>solidariamente</b>. A regra é a <b>solidariedade</b> (art. 233), mas na <b>cisão parcial</b> o ato pode limitar a responsabilidade às obrigações transferidas, <b>ressalvada a oposição do credor</b> em 90 dias."]}], "26": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Improbidade administrativa: processo, indisponibilidade, ANPC, sentença, sanções, prescrição (Lei 8.429/1992, arts. 13 a 23)", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 15 de Direito Administrativo (segunda parte: processo, acordo de não persecução civil e prescrição). Li <b>literalmente</b>, no navegador (Planalto, texto compilado), a <b>Lei 8.429/1992, arts. 13 a 23</b> (incluídos os arts. 17-A a 17-D, 18-A, 23-A, 23-B e 23-C), na <b>redação vigente dada pela Lei 14.230/2021</b>; resumi só o que vale hoje. <b>Não reli</b> nesta unidade os arts. 1º a 12 (atos, sujeitos e sanções, que estudamos na unidade anterior). Os <b>Temas 1.199 (irretroatividade e prescrição), as ADIs 7042/7043 (legitimidade ativa) e 7236</b> e as teses do STJ vêm <b>da minha memória</b> e precisam de conferência. Os decretos e a regulamentação local <b>não foram lidos</b>. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Declaração de bens (art. 13).</b> A posse e o exercício de agente público ficam condicionados à <b>apresentação de declaração de imposto de renda e proventos</b> (ou autorização de acesso eletrônico), atualizada anualmente e na saída do cargo. A recusa ou a declaração falsa expõem a pena de demissão, sem prejuízo de outras sanções. <b>Representação (art. 14):</b> qualquer pessoa pode representar à autoridade administrativa; o procedimento exige <b>identificação do representante</b> e indícios; a representação que não cumpre os requisitos é rejeitada. <b>Investigação (art. 22):</b> o MP pode instaurar <b>inquérito civil</b> (art. 22) e requisitar diligências, assegurada a <b>manifestação do investigado</b>.", "<b>Indisponibilidade de bens (art. 16).</b> Medida <b>cautelar</b> dentro da própria ação, que garante o <b>integral ressarcimento do dano ou a perda do acréscimo patrimonial ilícito</b>. A lei exige <b>urgência</b> e fundamentação; como regra, ouve-se o réu em <b>5 dias</b> (§ 3º), mas há decretação <b>sem oitiva prévia</b> quando a urgência o justificar (§ 4º). Alcança só o <b>ressarcimento</b> e o acréscimo ilícito, <b>não a multa civil</b> (§ 10º). Respeita a <b>ordem de preferência</b> (dinheiro, aplicações e bens, conforme o § 11) e <b>não incide</b> sobre quantia de até <b>40 salários mínimos</b> em poupança, conta ou aplicação (§ 13). O <b>bem de família é impenhorável</b> nesse regime, salvo se adquirido com produto de <b>enriquecimento ilícito do art. 9º</b> (§ 14). Cabe <b>agravo de instrumento</b> (§ 9º).", "<b>Legitimidade ativa e foro (art. 17).</b> O art. 17, caput, atribui a propositura da ação ao <b>Ministério Público</b>. A Lei 14.230 retirou a legitimação do ente lesado, e a <b>ADI 7042/7043</b> discutiu isso (de memória: o STF reconheceu a <b>legitimidade concorrente</b> da pessoa jurídica interessada; a conferir). A ação segue o <b>procedimento comum do CPC</b>, mas <b>não é ação civil pública</b> (art. 17-D: tem natureza <b>repressiva e sancionatória</b>). <b>Foro (§ 4º-A):</b> a ação é proposta perante o juízo do local do dano ou do domicílio do réu, <b>sem prerrogativa de foro</b> em razão do cargo (resultado de memória do STF).", "<b>Petição inicial e fases (art. 17, §§ 6º a 19).</b> A inicial <b>individualiza a conduta</b> de cada réu e a norma violada (§ 6º, I) e traz <b>elementos probatórios mínimos</b> (II). O juiz <b>rejeita</b> por inexistência de ato ímprobo, falta de provas mínimas ou ilegitimidade (§ 6º-B). O réu é citado e <b>contesta em 30 dias</b> (§ 7º). Da decisão sobre a inicial e a contestação cabe <b>agravo</b> (§ 9º-A). Após a contestação, o juiz tem até <b>90 dias</b> para tentativa de <b>solução consensual</b> (§ 10-A). Na decisão de recebimento, o juiz <b>fixa o tipo</b> (arts. 9º, 10 ou 11) e é <b>nulo</b> condenar por tipo <b>diverso</b> do apontado ou sem prova (§§ 10-C, 10-D e 10-F). Havendo <b>manifesta inexistência do ato</b>, julga-se improcedente (§ 11). A <b>pessoa jurídica lesada</b> é intimada para intervir (§ 14). O interrogatório segue o CPC (§ 18). Não se aplicam à ação (§ 19): a <b>presunção de veracidade pela revelia</b>; a <b>distribuição dinâmica do ônus da prova</b> contra o réu (CPC, art. 373, §§ 1º e 2º); o <b>ajuizamento de mais de uma ação</b> pelo mesmo fato; e o <b>reexame necessário</b>. A assessoria jurídica pode <b>defender o agente</b> no polo passivo (§ 20), e há <b>agravo</b> contra decisões interlocutórias (§ 21).", "<b>Acordo de não persecução civil (art. 17-B).</b> O <b>Ministério Público</b> pode celebrar o ANPC, desde que <b>do acordo resulte</b> o <b>integral ressarcimento do dano</b> e a <b>reversão da vantagem indevida</b> ao ente lesado. Exige <b>oitiva do ente federado lesado</b> e <b>aprovação, em até 60 dias, pelo órgão superior do MP</b>, e depois <b>homologação judicial</b> (§ 1º). Em caso de dano ao erário, a tomada de contas de <b>TCE tem 90 dias</b> para apurar o valor (§ 3º). Pode ser celebrado na fase de <b>investigação, ação ou execução</b> (§ 4º). Quem descumpre ou frustra o acordo fica <b>impedido de nova composição por 5 anos</b> (§ 7º).", "<b>Sentença e unificação de sanções (arts. 17-C, 18 e 18-A).</b> A sentença indica de modo <b>preciso</b> os atos e as razões de convencimento. <b>Ilegalidade sem dolo</b> não é improbidade (§ 1º). <b>Não há solidariedade</b> entre os réus (§ 2º) e <b>não há remessa necessária</b> (§ 3º). O art. 18 prevê o <b>ressarcimento</b> (parcelamento em até <b>48 parcelas</b>, § 4º). O art. 18-A permite <b>unificar sanções</b>: a <b>continuidade</b> leva à maior sanção <b>aumentada de 1/3</b>; <b>novos atos</b> somam-se; o limite é de <b>20 anos</b> para a suspensão dos direitos políticos e a proibição de contratar.", "<b>Execução e sanções (arts. 19 a 21).</b> A <b>denúncia falsa</b> de improbidade é crime com <b>detenção de 6 a 10 meses</b> e multa (art. 19). A <b>perda da função</b> e a <b>suspensão dos direitos políticos</b> só se efetivam com o <b>trânsito em julgado</b> (art. 20). O <b>afastamento cautelar</b> do agente pode durar até <b>90 dias</b>, prorrogável por <b>mais 90</b>. As sanções <b>independem</b> da aprovação das contas e do dano efetivo, <b>salvo</b> o ressarcimento e o art. 10 (art. 21). A sentença civil e a penal se comunicam nos termos dos §§ 3º e 4º (a <b>absolvição criminal por órgão colegiado</b> pode repercutir na ação), e o § 5º admite a <b>compensação</b> das sanções já aplicadas em outras esferas pelo mesmo fato.", "<b>Prescrição (art. 23).</b> Em <b>8 anos</b>, contados do <b>fato</b> ou, nas infrações permanentes, da <b>cessação da permanência</b>. O prazo é <b>suspenso por até 180 dias</b> pela instauração de inquérito civil ou procedimento administrativo (§ 1º). O inquérito se conclui em <b>365 dias</b>, prorrogável por <b>mais 365</b> (§ 2º), e a ação deve ser proposta em <b>30 dias</b> da conclusão (§ 3º). A prescrição se <b>interrompe</b> (§ 4º): (I) pelo ajuizamento; (II) pela publicação da sentença condenatória; (III) por acórdão do TJ ou TRF que confirma condenação ou reforma improcedência; (IV) por acórdão do STJ; (V) por acórdão do STF. Interrompida, <b>recomeça pela metade</b>, ou seja, <b>4 anos</b> (§ 5º); decorrido esse prazo entre os marcos, reconhece-se a <b>prescrição intercorrente</b> de ofício (§ 8º).", "<b>Disposições finais (arts. 23-A a 23-C).</b> Os órgãos de controle devem promover <b>capacitação</b> dos gestores (art. 23-A). Não há <b>adiantamento de custas</b> nem condenação em honorários ou despesas, <b>salvo comprovada má-fé</b> (art. 23-B). Os atos que causem dano a <b>partidos políticos</b> seguem a Lei 9.096/1995 (art. 23-C). <b>Jurisprudência (de memória, a conferir):</b> o STF fixou no <b>Tema 1.199</b> a exigência de <b>dolo</b> para o art. 10, a <b>irretroatividade</b> das normas mais benéficas aos processos com condenação transitada em julgado, a aplicação nos casos em curso apenas quanto à <b>culpa</b> e a <b>prescrição intercorrente</b> sem retroatividade."], "pega": ["Legitimidade e natureza: a banca diz que a ação de improbidade é <b>ação civil pública</b> comum. A lei diz que é ação <b>repressiva e sancionatória</b>, que <b>não é ação civil</b> (art. 17-D), e que a sentença <b>não admite remessa necessária</b> (art. 17-C, § 3º).", "Revelia e ônus: a banca diz que a falta de contestação gera <b>revelia e presunção de veracidade</b>, e que o juiz pode inverter o ônus da prova contra o réu. A lei diz que <b>não se aplicam</b> a presunção pela revelia nem a distribuição dinâmica do ônus (art. 17, § 19).", "Prazos: a banca diz que a contestação é em <b>15 dias</b> e que o juiz tenta a solução consensual em <b>30 dias</b>. A lei diz <b>30 dias</b> para contestar (§ 7º) e <b>90 dias</b> para a tentativa de solução consensual (§ 10-A).", "Indisponibilidade: a banca diz que a indisponibilidade garante também a <b>multa civil</b> e que atinge poupança de qualquer valor. A lei diz que garante só o <b>ressarcimento e o acréscimo ilícito</b> (§ 10) e protege até <b>40 salários mínimos</b> (§ 13).", "Bem de família: a banca diz que o bem de família é sempre <b>impenhorável</b> na improbidade. A lei diz que a regra cede quando o bem foi adquirido com <b>enriquecimento ilícito (art. 9º)</b> (§ 14).", "ANPC: a banca diz que o acordo dispensa o ressarcimento ou que depende só de assinatura do promotor. A lei diz que exige <b>integral ressarcimento e reversão da vantagem</b>, <b>oitiva do ente lesado</b>, <b>aprovação em 60 dias pelo órgão superior do MP</b> e <b>homologação judicial</b> (art. 17-B).", "Perda da função: a banca diz que a perda do cargo ocorre com a sentença de primeiro grau. A lei diz que só ocorre com o <b>trânsito em julgado</b> (art. 20); o afastamento cautelar é de até <b>90 dias</b>, prorrogável por 90.", "Prescrição: a banca diz que o prazo é de <b>5 anos</b> e recomeça por inteiro após a interrupção. A lei diz <b>8 anos</b>, e, interrompido o prazo, ele recomeça <b>pela metade (4 anos)</b>, com <b>prescrição intercorrente</b> (art. 23, §§ 5º e 8º).", "Denúncia falsa: a banca diz que é só infração administrativa. A lei diz que é <b>crime</b>, com detenção de <b>6 a 10 meses</b> (art. 19)."]}, {"materia": "DIREITO CIVIL", "titulo": "Locação de imóveis urbanos (Lei 8.245/1991) e direitos autorais (Lei 9.610/1998)", "key": "CIV", "nome": "Civil", "conc": ["Edital: item de Direito Civil sobre <b>locações</b> e <b>direitos autorais</b>. Li <b>literalmente</b>, no navegador (Planalto, texto compilado): a <b>Lei 8.245/1991 inteira (arts. 1º a 78)</b> e a <b>Lei 9.610/1998 inteira (arts. 1º a 115)</b>. Na Lei 8.245 o texto compilado mistura redações antigas e novas; valem as das <b>Leis 12.112/2009 e 12.744/2012</b>. Na Lei 9.610, os arts. 68 a 110 trazem redações <b>sobrepostas</b> (a original, a da Lei 12.853/2013 e a da MP 907/2019, que perdeu eficácia, e a MP 1.068/2021, <b>rejeitada</b>); resumi a redação <b>vigente</b>. <b>Jurisprudência</b> (STJ e STF) e <b>doutrina</b> vêm <b>da minha memória</b> e precisam de conferência. <b>Não li</b> os regulamentos (decretos) nem a legislação do ECAD. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Locação: contrato, multa e alienação (arts. 4º e 8º).</b> O locador não pode reaver o imóvel durante o prazo ajustado; o locatário pode devolvê-lo pagando a <b>multa proporcional ao tempo que falta</b> (art. 4º). Na <b>alienação</b> do imóvel durante a locação, o adquirente pode denunciar o contrato em <b>90 dias</b> após o registro da venda, salvo se o contrato tiver <b>cláusula de vigência</b> e estiver <b>averbado na matrícula</b> (art. 8º). <b>Fiança (art. 12, § 2º):</b> o fiador pode se <b>exonerar</b> notificando o locador e continua responsável por <b>120 dias</b>; nos casos do art. 40 o <b>locatário</b> tem <b>30 dias</b> para apresentar nova garantia, sob pena de desfazimento da locação. <b>Cessão, sublocação e empréstimo (art. 13)</b> exigem <b>consentimento prévio e escrito</b> do locador; notificado, ele tem <b>30 dias</b> para manifestar oposição (§ 2º), e o silêncio nesse prazo <b>vale como aceitação</b>.", "<b>Deveres e garantias (arts. 22, 23, 35 a 42).</b> O <b>locador</b> entrega o imóvel em estado de servir ao uso, garante o uso pacífico e paga taxas extraordinárias de condomínio; o <b>locatário</b> paga aluguel e encargos, usa para o fim contratado e devolve o imóvel no estado em que recebeu. As <b>benfeitorias necessárias</b> são indenizáveis e permitem <b>retenção</b>; as <b>úteis</b>, só se <b>autorizadas</b> (art. 35); salvo cláusula, as benfeitorias se <b>incorporam</b> ao imóvel (art. 36). Em cada contrato admite-se <b>uma única garantia</b> (art. 37, parágrafo único: a <b>cumulação é nula</b>). A <b>caução em dinheiro</b> não passa de <b>3 meses</b> de aluguel (art. 38, § 2º). A garantia <b>se estende até a devolução do imóvel</b> (art. 39). A <b>revisão judicial</b> do aluguel só é possível após <b>3 anos</b> do contrato ou do último acordo (art. 19).", "<b>Direito de preferência (arts. 27 a 34).</b> O locatário tem preferência na compra, em igualdade de condições. O locador comunica o preço, as condições e o local para exame; o locatário tem <b>30 dias</b> para aceitar. <b>Preterido</b>, o locatário pode pleitear <b>perdas e danos</b> ou <b>haver para si o imóvel</b>, depositando o preço e as despesas, desde que o contrato esteja <b>averbado na matrícula, no mínimo, 30 dias antes</b> da alienação e que requeira em <b>6 meses do registro</b> da venda (art. 33). Não há preferência em perda da propriedade por decisão judicial, desapropriação, permuta, doação, integralização de capital, cisão, fusão e incorporação (art. 32).", "<b>Locação residencial (arts. 46 e 47).</b> Contrato <b>escrito por 30 meses ou mais</b> termina no prazo, <b>sem notificação</b>; se o locatário continua no imóvel por <b>30 dias</b> sem oposição, a locação <b>prorroga por prazo indeterminado</b> (art. 46, § 1º). Contratos <b>verbais ou escritos com menos de 30 meses</b> prorrogam-se automaticamente, e o locador só retoma nas hipóteses do <b>art. 47</b>, como: extinção do contrato de trabalho relacionado à ocupação, uso próprio ou de familiares, obras determinadas pelo Poder Público ou aprovadas e, no inciso V, <b>vigência ininterrupta por 5 anos</b>. <b>Locação por temporada (art. 48):</b> até <b>90 dias</b>, para lazer, obras ou outro fim temporário.", "<b>Locação não residencial e ação renovatória (arts. 51 a 57 e 71 a 75).</b> O locatário tem direito à renovação, por igual prazo, se o contrato for <b>escrito e por prazo determinado</b>, o prazo mínimo for <b>5 anos</b> (somados contratos ininterruptos) e ele explorar o <b>mesmo ramo por 3 anos</b>. A ação se propõe no <b>interregno de 1 ano a 6 meses antes</b> do fim do prazo; fora dele há <b>decadência</b>. O locador pode se opor nas hipóteses do art. 52 (obras determinadas pelo Poder Público, uso próprio ou transferência de fundo de comércio existente há mais de um ano); a <b>proposta melhor de terceiro</b> é defesa do art. 72. <b>Contrato atípico built-to-suit (art. 54-A):</b> prevalecem as condições livremente pactuadas; a <b>renúncia à revisional</b> é válida e, em caso de denúncia antecipada, a <b>multa não excede a soma dos aluguéis até o termo</b>.", "<b>Ações locatícias (arts. 58 a 75).</b> Nelas as <b>férias forenses não suspendem os prazos</b>; o foro é o do <b>local do imóvel</b> ou o de eleição; o valor da causa é de <b>12 meses de aluguel</b>; o recurso tem <b>só efeito devolutivo</b> (art. 58). <b>Liminar de despejo em 15 dias</b> (art. 59, § 1º, incisos I a IX), mediante <b>caução de 3 meses</b> de aluguel. <b>Purga da mora</b> no despejo por falta de pagamento: em <b>15 dias</b> da citação, <b>uma vez em 24 meses</b> (art. 62). Nos demais casos o prazo de desocupação voluntária é de <b>30 dias</b> (art. 63; § 1º: <b>15 dias</b>). Na <b>revisional</b> (rito sumário), o aluguel provisório é devido desde a citação e fica em <b>até 80% do pedido</b>, se o autor é o locador, ou em <b>no mínimo 80% do aluguel vigente</b>, se o autor é o locatário (art. 68); o novo valor retroage à citação (art. 69). A lei traz ainda a <b>contravenção do art. 43</b> e o <b>crime do art. 44</b>.", "<b>Direitos autorais: objeto e titularidade (arts. 7º, 8º, 11 e 18).</b> Protegem-se as <b>criações do espírito</b>, expressas por qualquer meio, tangível ou intangível (art. 7º). <b>Não se protegem</b> as ideias, procedimentos, esquemas, planos e regras de jogos, os formulários em branco, os textos oficiais, as informações de uso comum, os nomes e títulos isolados e o aproveitamento industrial ou comercial das ideias (art. 8º). <b>Autor</b> é a <b>pessoa física</b> criadora; a lei estende a proteção à pessoa jurídica nos casos previstos (art. 11). A <b>proteção independe de registro</b>, que é <b>facultativo</b> (art. 18).", "<b>Direitos morais e patrimoniais (arts. 24 a 29, 38 a 52).</b> Os <b>direitos morais</b> (paternidade, nome, integridade, modificação, retirada de circulação, acesso a exemplar raro) são <b>inalienáveis e irrenunciáveis</b> (art. 27). O <b>patrimonial</b> depende de <b>autorização prévia e expressa</b> do autor para qualquer utilização (art. 29), que se interpreta <b>restritivamente</b>. <b>Direito de sequência (art. 38):</b> <b>5%</b> sobre o aumento de preço em cada revenda de obra de arte ou manuscrito. <b>Prazo (art. 41):</b> <b>70 anos</b> contados de <b>1º de janeiro do ano seguinte ao da morte</b>; obras anônimas e pseudônimas, <b>70 anos</b> da divulgação (art. 43); audiovisuais e fotográficas, <b>70 anos</b> da divulgação (art. 44). <b>Limitações (art. 46):</b> cópia de pequenos trechos para uso privado, citação, uso em atos judiciais e administrativos e <b>paródias</b> (art. 47, quando não forem reprodução da obra nem lhe causem descrédito); as obras situadas <b>permanentemente em logradouros públicos</b> podem ser representadas <b>livremente</b> por pinturas, desenhos, fotografias e processos audiovisuais (art. 48). <b>Cessão (art. 49):</b> contrato <b>escrito</b>; sem estipulação de prazo, <b>5 anos</b>; vale no <b>país onde foi celebrado</b>; só para as <b>modalidades existentes</b>; a cessão de obras futuras é de até <b>5 anos</b> (art. 51).", "<b>Edição, execução pública e conexos (arts. 53 a 100-B).</b> No <b>contrato de edição</b>, no silêncio, vale <b>uma edição de 3.000 exemplares</b> (art. 56); o editor presta contas <b>mensais</b> quando o autor ganha por venda (art. 61) e a obra deve ser editada em <b>2 anos</b> (art. 62). A <b>execução pública</b> de música e fonogramas em <b>locais de frequência coletiva</b> (bares, restaurantes, hotéis, lojas, órgãos públicos) exige <b>autorização prévia</b> e comprovação do pagamento ao <b>ECAD</b> (art. 68, § 4º). Os <b>direitos conexos</b> (intérpretes, produtores fonográficos, radiodifusão) duram <b>70 anos</b> contados de <b>1º de janeiro do ano seguinte</b> à fixação, transmissão ou execução (art. 96). A <b>gestão coletiva</b> exige <b>habilitação</b> em órgão federal (arts. 98 e 98-A); dirigentes têm mandato de <b>3 anos</b> e <b>uma recondução</b> (art. 98, § 13), e respondem <b>solidariamente, com bens particulares</b> (art. 100-A).", "<b>Sanções civis (arts. 101 a 110).</b> O titular pode pedir <b>apreensão</b> dos exemplares e <b>suspensão</b> da divulgação (art. 102). Quem edita sem autorização perde os exemplares apreendidos e paga o preço dos vendidos; se desconhecido o número, paga o valor de <b>3.000 exemplares</b> além dos apreendidos (art. 103). Respondem <b>solidariamente com o contrafator</b> quem vende, expõe, adquire ou deposita a obra fraudulenta (art. 104); o <b>importador</b> e o <b>distribuidor</b> respondem como contrafatores (art. 104). A <b>execução pública irregular</b> gera <b>multa de 20 vezes</b> o valor devido (art. 109). Os proprietários, gerentes e arrendatários do local respondem <b>solidariamente</b> com os organizadores do espetáculo (art. 110). A omissão do nome do autor gera <b>danos morais</b> e obrigação de divulgar a identidade (art. 108). O art. 111 (prescrição) foi <b>vetado</b>; a prescrição segue o Código Civil (de memória: <b>3 anos</b> para a reparação civil, conforme o STJ, a conferir)."], "pega": ["Fiança: a banca diz que o fiador exonerado deixa de responder imediatamente. A lei diz que ele responde pelos efeitos da fiança por <b>120 dias</b> após a notificação (art. 12, § 2º).", "Garantias: a banca diz que o locador pode exigir <b>fiador e caução</b> ao mesmo tempo. A lei diz que só cabe <b>uma modalidade de garantia</b>, sendo <b>nula</b> a cumulação (art. 37, parágrafo único), e a caução em dinheiro vai a no máximo <b>3 meses</b> (art. 38, § 2º).", "Alienação: a banca diz que a venda do imóvel rompe sempre a locação. A lei diz que o adquirente só denuncia em <b>90 dias</b> se o contrato <b>não tiver cláusula de vigência averbada</b> (art. 8º).", "Preferência: a banca diz que o preterido sempre pode haver o imóvel. A lei diz que isso exige <b>contrato averbado 30 dias antes</b> e requerimento em <b>6 meses do registro</b>; sem isso, só <b>perdas e danos</b> (art. 33).", "Renovatória: a banca diz que o prazo para a ação renovatória é de qualquer época do contrato. A lei diz que o interregno é de <b>1 ano a 6 meses antes</b> do fim; fora dele, <b>decadência</b> (art. 51, § 5º).", "Purga da mora: a banca diz que pode ser feita sempre, em 30 dias. A lei diz <b>15 dias</b> da citação e <b>uma vez a cada 24 meses</b> (art. 62).", "Retomada: a banca diz que o locador retoma o imóvel residencial a qualquer tempo por contrato de 30 meses. A lei diz que o contrato <b>escrito por 30 meses ou mais</b> termina no prazo sem notificação, e a retomada em contratos <b>menores</b> exige as hipóteses do <b>art. 47</b> (inciso V: <b>5 anos</b>).", "Direitos autorais: a banca diz que a proteção depende de <b>registro</b> e que os direitos morais podem ser <b>cedidos</b>. A lei diz que o registro é <b>facultativo</b> (art. 18) e que os direitos morais são <b>inalienáveis e irrenunciáveis</b> (art. 27).", "Prazo: a banca diz que a proteção é de <b>vida do autor mais 50 anos</b>. A lei diz <b>70 anos</b>, contados de <b>1º de janeiro do ano seguinte</b> à morte (art. 41); conexos: <b>70 anos</b> (art. 96).", "Execução pública: a banca diz que restaurante e hotel não precisam de autorização para música ambiente. A lei diz que são <b>locais de frequência coletiva</b> (art. 68, § 3º) e exige <b>autorização prévia</b> e pagamento; a infração gera <b>multa de 20 vezes</b> o valor (art. 109)."]}, {"materia": "DIREITO URBANÍSTICO E AMBIENTAL", "titulo": "Legislação urbanística de Curitiba: Plano Diretor (14.771/2015), Zoneamento (15.511/2019), potencial construtivo adicional (16.361/2024), prêmios e incentivos (16.448/2024), Patrimônio Cultural (14.794/2016) e Código de Posturas (11.095/2004)", "key": "URB", "nome": "Urbanístico", "conc": ["Edital: item de Direito Urbanístico e Ambiental sobre a <b>legislação urbanística de Curitiba</b>. Li <b>literalmente</b>, no navegador, nos PDFs e páginas oficiais da Prefeitura: o <b>Plano Diretor (Lei 14.771/2015), arts. 1º a 194, inteiro</b>; o <b>Zoneamento (Lei 15.511/2019), arts. 1º a 239</b>, mas no <b>texto original</b> (as <b>alterações posteriores</b> só conheço pela Lei 16.448/2024, art. 73, parágrafo único, e <b>não verifiquei</b> as demais); a <b>Lei 15.626/2020</b>; a <b>Lei 16.361/2024 inteira</b>; a <b>Lei 16.448/2024 inteira</b>; a <b>Lei 14.794/2016 (Patrimônio Cultural), arts. 1º a 64</b>, <b>sem ler item a item o Anexo I</b> (lista de imóveis, que apenas varri); e o <b>Código de Posturas (Lei 11.095/2004), arts. 1º a 360 e anexo</b>, na <b>versão compilada de 2014</b> da Prefeitura. <b>Alterações posteriores a 2014 do Código de Posturas não foram verificadas.</b> Não li <b>decretos regulamentadores</b> (por exemplo, o Decreto 1327/2024) nem os <b>anexos e quadros de parâmetros</b> numéricos do Zoneamento. Jurisprudência e doutrina vêm <b>da minha memória</b>. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Plano Diretor: natureza e estrutura (Lei 14.771/2015, arts. 1º a 16).</b> É a <b>revisão</b> do plano de 1966 (Lei 2.828), adequada ao Estatuto da Cidade pela Lei 11.266/2004. Abrange <b>todo o território municipal, totalmente urbano</b> (art. 3º), e é o <b>instrumento básico, global e estratégico</b> da política de desenvolvimento (art. 4º), compatível com os planos regionais, a RMC e o ZEE; o PPA, a LDO e a LOA o observam. Integram o plano a legislação urbanística e os <b>planos setoriais</b> (mobilidade, habitação e regularização fundiária, desenvolvimento econômico, social, defesa social e civil, ambiental e biodiversidade, saneamento). O <b>Sistema de Planejamento</b> é coordenado pelo <b>IPPUC</b> (art. 7º), que apresenta o <b>relatório anual de monitoramento</b> (arts. 10 a 12). A <b>função social da propriedade</b> é cumprida segundo os critérios do plano (art. 16). Valem <b>parâmetros da lei vigente na análise</b>, sem direito adquirido nem indenização por mudança (art. 21).", "<b>Macrozoneamento (arts. 17 a 23).</b> O território se organiza em <b>oito categorias</b>: eixos estruturantes, eixos de adensamento, predominância residencial de média densidade, de baixa densidade, ocupação mista, destinação específica, ocupação controlada e áreas de proteção ambiental (as <b>APAs do Passaúna e do Iguaçu</b>). Densidade: <b>baixa até 80 hab/ha</b>, <b>média 81 a 200</b>, <b>alta 201 a 400</b> (art. 20, § 2º). Os <b>Polos de Desenvolvimento</b> (art. 22) e os <b>microcentros de adensamento</b> (art. 23, com compra de potencial ao <b>Fundo Curitiba Mais Humana</b> e EIV) reforçam o modelo. A <b>fachada ativa</b> (arts. 29 a 31) dá <b>+1 pavimento não computável</b> quando 50% do térreo é não residencial, <b>sem cumular</b> com o uso misto. A <b>regularização simplificada</b> (arts. 33 a 35) alcança imóveis ocupados até <b>31/12/2012</b>, com <b>regulamento em 60 dias</b>, protocolo em <b>1 ano</b> e recursos ao Fundo. Pelo art. 37, parágrafo único, o gabarito máximo fora das áreas de influência é de <b>8 pavimentos</b>, salvo exceções.", "<b>Mobilidade, ambiente, patrimônio e paisagem (arts. 39 a 78).</b> O Plano <b>proíbe pedágio urbano e rodízio de placas</b> (art. 40, parágrafo único); trata de estacionamentos próximos a terminais (<b>até 300 m</b>, art. 55) e do <b>EstaR</b> com pagamento fracionado (arts. 59 e 60). Em matéria ambiental, consagra a <b>proibição do retrocesso ambiental</b> (art. 61), a <b>bacia hidrográfica</b> como unidade de planejamento (art. 62), o <b>IPTU verde</b> (art. 65, só para imóveis ligados à rede de esgoto) e o <b>pagamento por serviços ambientais</b> (art. 66). O patrimônio cultural é regulado por lei específica (arts. 68 e 69). A <b>fruição pública</b> de lotes privados exige área mínima de <b>50 m²</b>, com limite de <b>20% do lote</b> (arts. 70 a 76). <b>Habitação (arts. 79 a 91):</b> a HIS prioriza renda até <b>3 salários mínimos</b>; os <b>SEHIS</b> são de Regularização Fundiária, de Vazios e de Produção; a <b>cota de HIS</b> é obrigatória em empreendimentos de grande porte (produção local ou próxima, doação de imóvel ou depósito ao Fundo Municipal); o SEHIS pode ser criado por <b>decreto</b> a qualquer momento (art. 90). O <b>Fundo Curitiba Mais Humana</b> (arts. 93 a 98) favorece áreas de <b>IDHM abaixo de 0,71</b>, depois de 0,71 a 0,75; <b>veda o custeio</b>.", "<b>Uso misto e edificações mistas (arts. 123 e 124).</b> No <b>uso misto em edificação unifamiliar</b>, o uso não residencial pode ocupar até <b>50% da área total averbada</b>, com acessibilidade, comércio ou serviço <b>sem impacto ambiental ou de vizinhança</b> e fora de polo gerador de tráfego (art. 123). Na <b>edificação mista</b>, exigem-se <b>mínimo de 30% residencial</b> e <b>30% não residencial</b>; os benefícios são: dispensa de acesso independente de veículos, garagem compartilhada, nenhuma obrigatoriedade de vagas residenciais e <b>redução de 25%</b> do valor do potencial construtivo; o limite é de <b>2.500 m²</b> (art. 124, § 4º).", "<b>Instrumentos da política urbana no Plano (arts. 131 a 180).</b> O rol: <b>PEUC, preempção, outorga onerosa, transferência do direito de construir, operações urbanas consorciadas, planos de desenvolvimento regional, reparcelamento e EIV</b> (art. 131). A <b>concessão urbanística</b> depende de lei específica (§ 1º) e a <b>CDRU coletiva</b> se admite em HIS (§ 2º). <b>PEUC (arts. 132 a 141):</b> a sequência é <b>PEUC, IPTU progressivo e desapropriação com títulos</b>. <b>Não se aplica</b> a unidades de conservação, imóveis com <b>bosque nativo em 50% ou mais</b> e APP comprometida em <b>50% ou mais</b> (art. 134). <b>Não edificado</b> é o lote ou gleba com <b>2.000 m² ou mais</b> (ou qualquer área na zona central, no setor histórico ou em SEHIS de Vazios, ou construção paralisada ou em ruínas); <b>subutilizado</b> é o imóvel com coeficiente de aproveitamento de até <b>15% do básico</b> ou com unidades autônomas com mais de 500 m² computáveis e <b>80% desocupadas por 3 anos</b>; <b>não utilizado</b>
