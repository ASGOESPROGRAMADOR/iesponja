<script>
const D={"25": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Improbidade administrativa (Lei 8.429/1992, com a Lei 14.230/2021): sujeitos, atos de improbidade (arts. 9º, 10 e 11) e sanções", "key": "ADM", "conc": ["Edital: item 15 de Direito Administrativo (parte de sujeitos, atos e sanções; processo, ANPC e prescrição ficam para a unidade 28). Li <b>literalmente</b>, no navegador (Planalto, texto compilado): <b>Lei 8.429/1992, arts. 1º a 8º-A, 9º, 10, 10-A (marcado como revogado), 11, 12, 21, 23 e partes dos arts. 17 e 17-B</b>. A página mostra, lado a lado, a redação antiga e a nova (Lei 14.230/2021); resumi só a <b>redação vigente</b>. <b>Não li</b> os arts. 13 a 16, 18 a 20 e 22, nem o restante do art. 17. As teses do STF (Tema 1.199, ADIs 7042/7043 e 7236) vêm <b>da minha memória</b> e precisam de conferência. Esta unidade não traz questões de prova novas do banco; o treino fica no app.", "<b>Visão geral e o que mudou em 2021.</b> A Lei 14.230/2021 reescreveu a Lei de Improbidade. Quatro ideias dominam a prova: (1) improbidade exige <b>dolo</b>, <b>não há mais modalidade culposa</b>; (2) o rol do art. 11 (princípios) passou a ser <b>taxativo</b>; (3) a ação é de <b>natureza sancionadora</b>, com garantias próprias do direito sancionador; (4) as sanções foram reorganizadas, e o <b>art. 10-A</b> (benefício tributário irregular de ISS, que veio da LC 157/2016) foi <b>revogado</b>. A página do Planalto marca expressamente o art. 10-A como <b>Revogado pela Lei nº 14.230, de 2021</b>.", "<b>Dolo e erro (art. 1º, §§ 1º a 3º; art. 17-C, § 3º, de memória).</b> Consideram-se atos de improbidade as condutas <b>dolosas</b> tipificadas nos arts. 9º, 10 e 11 e em leis especiais. Dolo é a <b>vontade livre e consciente</b> de alcançar o resultado ilícito; <b>não basta a voluntariedade</b> do agente, e a mera <b>culpa</b>, a <b>divergência interpretativa da lei</b> (se baseada em jurisprudência, ainda que não pacificada, mesmo que não seja a melhor) e o <b>exercício da função sem dolo</b> não configuram improbidade. Em suma: <b>ilegalidade ou erro de gestão não é, por si só, improbidade</b>; é preciso <b>dolo específico</b> e um fim ilícito (proveito indevido, nos termos do art. 11, §§ 1º e 2º, abaixo).", "<b>Sujeitos passivos (art. 1º, §§ 5º a 7º; de memória nos pormenores).</b> São as <b>entidades da administração direta, indireta ou fundacional</b> de qualquer dos Poderes da União, dos Estados, do DF, dos Municípios e de Território; também as <b>empresas incorporadas ao patrimônio público</b> e as entidades para cuja criação ou custeio o erário haja concorrido. A lei distingue: (a) entidades que recebem <b>subvenção, benefício ou incentivo</b> do poder público, e entidades para cuja criação ou custeio o erário concorra <b>com menos de 50% do patrimônio ou da receita</b> (sanção patrimonial limitada à <b>repercussão sobre a contribuição dos cofres públicos</b>); (b) <b>partidos políticos</b>, cuja responsabilização por improbidade passou a seguir a Lei 9.096/1995 e o art. 23-C (que li) e <b>não</b> mais a Lei de Improbidade em si.", "<b>Sujeitos ativos (arts. 2º e 3º).</b> <b>Agente público</b> é quem exerce, ainda que <b>transitoriamente ou sem remuneração</b>, por eleição, nomeação, designação, contratação ou <b>qualquer forma de investidura</b> ou vínculo, mandato, cargo, emprego ou função nas entidades do art. 1º. O <b>particular</b> que celebra com a administração contrato, convênio ou ajuste análogo <b>responde</b> nos termos da lei. Também o <b>terceiro</b> (pessoa física ou jurídica) que <b>induza ou concorra dolosamente</b> para o ato, ou dele se beneficie, responde <b>na medida da sua participação</b> (art. 3º, caput e § 1º). O art. 3º traz três regras que a banca gosta de testar: <b>(i)</b> <b>sócios, cotistas, diretores e colaboradores</b> de pessoa jurídica de direito privado só respondem se <b>comprovada a participação e o benefício direto</b>, ainda que por intermédio de interposta pessoa (§ 1º); <b>(ii)</b> a pessoa jurídica <b>não é sancionada</b> pela Lei 8.429 se já houver <b>responsabilização por ato lesivo pela Lei 12.846/2013</b> (Lei Anticorrupção), evitando <i>bis in idem</i> (§ 2º); <b>(iii)</b> o <b>sucessor ou herdeiro</b> responde só até o <b>limite do valor da herança ou do patrimônio transferido</b> (art. 8º), e há regra própria para <b>sucessão empresarial</b> (art. 8º-A, que li na leitura anterior; o detalhe de que a responsabilidade se limita ao patrimônio transferido, salvo simulação ou fraude, é <b>de memória</b>: conferir).", "<b>Art. 9º: enriquecimento ilícito.</b> Constitui improbidade <b>auferir, mediante a prática de ato doloso, qualquer tipo de vantagem patrimonial indevida</b> em razão do exercício de cargo, mandato, função, emprego ou atividade nas entidades do art. 1º. Exemplos do rol (<b>exemplificativo</b>, expresso em 'notadamente'): receber <b>vantagem econômica</b> para facilitar a alienação, permuta ou locação de bem público <b>por preço inferior ao de mercado</b> ou a aquisição por <b>preço superior</b> (I a III); usar <b>bem móvel, trabalho de servidores, empregados ou terceiros contratados</b> em obra ou serviço particular (IV); receber vantagem para tolerar jogos de azar, lenocínio, narcotráfico, contrabando, usura (V); receber vantagem para <b>declaração falsa</b> sobre medição ou avaliação (VI); <b>adquirir bens desproporcionais à evolução patrimonial</b>, assegurada ao agente a <b>demonstração da licitude da origem</b> da evolução, e <b>decorrentes dos atos do caput</b> (VII); aceitar emprego ou consultoria de quem tenha interesse suscetível de ser atingido por ação ou omissão do agente (VIII); intermediar liberação de verba (IX); receber vantagem para omitir ato de ofício (X); <b>incorporar ou usar em proveito próprio</b> bens, rendas, verbas ou valores do acervo (XI e XII). <b>Dano ao erário não é elemento</b> do art. 9º; basta o <b>enriquecimento ilícito doloso</b>.", "<b>Art. 10: lesão ao erário.</b> Constitui improbidade qualquer <b>ação ou omissão dolosa</b> que enseje, <b>efetiva e comprovadamente</b>, <b>perda patrimonial, desvio, apropriação, malbaratamento ou dilapidação</b> de bens ou haveres das entidades do art. 1º. A redação anterior admitia a modalidade <b>dolosa ou culposa</b> e a perda patrimonial 'presumida'; hoje, <b>só dolo</b> e perda <b>efetiva e comprovada</b>. Entre os incisos que li: facilitar a <b>incorporação indevida</b> de bens ao patrimônio particular (I); permitir a utilização de bens sem as <b>formalidades legais</b> (II); doação sem formalidades (III); alienação/locação/prestação de serviço por <b>preço inferior ao de mercado</b> (IV) ou aquisição por <b>preço superior</b> (V); operação financeira sem observância das normas ou garantia insuficiente (VI); benefício administrativo ou fiscal sem formalidades (VII); <b>frustrar a licitude de processo licitatório ou dispensá-lo indevidamente</b>, hoje com a exigência de <b>perda patrimonial efetiva</b> (VIII); despesa não autorizada (IX); <b>agir ilicitamente na arrecadação</b> de tributo ou renda (X; antes dizia 'negligentemente'); liberar verba pública sem observância das normas (XI); permitir que <b>terceiro se enriqueça ilicitamente</b> (XII); uso de bens em obra particular (XIII); contrato de <b>gestão associada</b> e <b>rateio de consórcio</b> sem formalidades ou dotação (XIV e XV); e vários incisos sobre <b>parcerias com entidades privadas</b> (XVI a XX e XXII, este quanto a benefício tributário contrário à LC 116/2003). <b>§ 1º</b>: se a inobservância das formalidades <b>não gerar perda patrimonial efetiva</b>, <b>não há</b> imposição de ressarcimento (vedado o enriquecimento sem causa). <b>§ 2º</b>: a <b>mera perda patrimonial decorrente da atividade econômica</b> não é improbidade, salvo ato doloso com essa finalidade.", "<b>Art. 11: violação de princípios.</b> Hoje exige <b>ação ou omissão dolosa</b> que viole os deveres de <b>honestidade, imparcialidade e legalidade</b> (o texto antigo falava também em <b>lealdade às instituições</b>), <b>caracterizada por uma das condutas</b> do rol, que passou a ser <b>taxativo</b>. Do rol vigente (que li): <b>revelar fato ou circunstância sigilosa</b> propiciando beneficiamento por informação privilegiada ou risco à segurança da sociedade e do Estado (III); <b>negar publicidade</b> a atos oficiais, ressalvada a imprescindibilidade para a segurança da sociedade e do Estado ou outras hipóteses legais (IV); <b>frustrar, em ofensa à imparcialidade, o caráter concorrencial</b> de concurso público, chamamento ou licitação, <b>com vistas a benefício próprio ou de terceiros</b> (V); <b>deixar de prestar contas</b> desde que disponha das condições para isso e <b>com vistas a ocultar irregularidades</b> (VI); revelar medida política ou econômica capaz de afetar preços antes da divulgação oficial (VII); descumprir normas de <b>parcerias</b> (VIII); <b>nomear cônjuge, companheiro ou parente até o 3º grau</b> para cargo em comissão, função de confiança ou função gratificada, <b>inclusive nomeações recíprocas</b> (XI, o <b>nepotismo</b>); e <b>publicidade</b> oficial que promova <b>enaltecimento e personalização</b> (XII). Os incisos I (fim proibido), II (retardar ato de ofício) e IX (acessibilidade) estão <b>revogados</b>. Salvaguardas: <b>§ 1º</b> só há improbidade se comprovado o <b>fim de obter proveito ou benefício indevido</b> para si ou outrem (dolo específico); <b>§ 3º</b> exige a <b>demonstração objetiva</b> da ilegalidade, com <b>indicação das normas violadas</b>; <b>§ 4º</b> exige <b>lesividade relevante</b> ao bem jurídico, <b>independentemente</b> de dano ao erário ou enriquecimento; <b>§ 5º</b> a <b>mera nomeação ou indicação política</b> por quem tem mandato eletivo <b>não</b> configura improbidade, é preciso <b>dolo com finalidade ilícita</b>.", "<b>Sanções (art. 12, redação vigente).</b> As penas podem ser aplicadas <b>isolada ou cumulativamente</b>, conforme a gravidade, <b>independentemente do ressarcimento integral do dano</b> (se efetivo) e das demais sanções. <b>Art. 9º</b>: perda dos bens ou valores acrescidos ilicitamente; perda da função pública; <b>suspensão dos direitos políticos até 14 anos</b>; <b>multa civil equivalente ao valor do acréscimo patrimonial</b>; proibição de contratar com o poder público ou receber benefícios ou incentivos fiscais ou creditícios, ainda que por pessoa jurídica da qual seja sócio majoritário, por <b>prazo não superior a 14 anos</b>. <b>Art. 10</b>: perda dos bens acrescidos (se concorrer), perda da função, suspensão dos direitos políticos <b>até 12 anos</b>, <b>multa equivalente ao valor do dano</b>, proibição de contratar <b>até 12 anos</b>. <b>Art. 11</b>: <b>multa civil de até 24 vezes o valor da remuneração</b> do agente e proibição de contratar <b>até 4 anos</b>; <b>não há</b> perda da função nem suspensão de direitos políticos. O antigo inciso IV (sanções do art. 10-A) está <b>revogado</b>, e o texto antigo ('suspensão de 8 a 10 anos', 'multa de até três vezes') foi substituído pelos <b>tetos</b> acima.", "<b>Parágrafos do art. 12 (dosimetria).</b> <b>§ 1º</b>: a perda da função pública, nos incisos I e II, atinge <b>apenas o vínculo de mesma qualidade e natureza</b> que o agente detinha na época da infração; só <b>excepcionalmente</b> (no art. 9º) o juiz pode estendê-la aos demais vínculos. <b>§ 2º</b>: a multa pode ser <b>aumentada até o dobro</b> se, pela situação econômica do réu, o valor calculado for ineficaz. <b>§ 3º</b>: na responsabilização da <b>pessoa jurídica</b>, consideram-se os <b>efeitos econômicos e sociais</b> das sanções, para viabilizar a manutenção das atividades. <b>§ 4º</b>: a proibição de contratar pode, <b>excepcionalmente</b> e por motivo relevante justificado, <b>extrapolar o ente lesado</b>. <b>§ 5º</b>: em atos de <b>menor ofensa</b>, a sanção limita-se à <b>multa</b>, sem prejuízo do ressarcimento e da perda dos valores obtidos. <b>§ 6º</b>: a reparação deve <b>deduzir</b> o ressarcimento ocorrido em outras instâncias. <b>§ 7º</b>: <i>non bis in idem</i> entre a Lei 8.429 e a <b>Lei 12.846</b> para pessoas jurídicas. <b>§ 8º</b>: a proibição de contratar consta do <b>CEIS</b>. <b>§ 9º</b>: as sanções só são executadas <b>após o trânsito em julgado</b>. <b>§ 10</b>: para a contagem da suspensão dos direitos políticos computa-se <b>retroativamente</b> o intervalo entre a <b>decisão colegiada e o trânsito em julgado</b>.", "<b>Independência das instâncias e efeitos de outras decisões (art. 21).</b> A aplicação das sanções <b>independe</b> da aprovação ou rejeição de contas pelo controle interno ou pelo Tribunal de Contas (II) e, em regra, de <b>dano efetivo</b> ao patrimônio, <b>salvo</b> quanto ao ressarcimento e às condutas do art. 10 (I). Os atos do controle são <b>considerados</b> pelo juiz quando fundamentaram a conduta (§ 1º), e as provas do controle devem ser consideradas, <b>sem prejuízo da análise do dolo</b> (§ 2º). Sentenças civis e penais produzem efeito na ação de improbidade quando concluírem pela <b>inexistência da conduta</b> ou <b>negativa de autoria</b> (§ 3º). A <b>absolvição criminal confirmada por decisão colegiada</b> impede o trâmite da ação de improbidade, com comunicação de todos os fundamentos do art. 386 do CPP (§ 4º), dispositivo com a nota <b>ADI 7236</b> e <b>ADI 7156</b> na página (as ações constam como 'Vide'; <b>não li</b> o seu andamento).", "<b>Sobre o processo: o essencial para ligar com a unidade 28.</b> No art. 17 (lido em trechos) a ação para a aplicação das sanções <b>segue o procedimento comum do CPC</b>, com foro do local do dano ou da pessoa jurídica prejudicada (§ 4º-A), prevenção do juízo (§ 5º) e petição inicial que deve <b>individualizar a conduta</b> e apontar <b>elementos probatórios mínimos</b> (§ 6º). O art. 17-B (lido em trechos) autoriza o <b>acordo de não persecução cível</b>, com <b>integral ressarcimento</b> e <b>reversão da vantagem indevida</b>; exige a <b>oitiva do ente lesado</b> e <b>aprovação pelo órgão superior do MP</b> em até 60 dias. No art. 23 (lido): a prescrição é de <b>8 anos</b> contados do fato (ou do fim da permanência), com suspensão de até <b>180 dias</b> pelo inquérito civil, <b>marcos interruptivos</b> (ajuizamento, sentença condenatória, acórdãos de TJ/TRF, STJ e STF que confirmem a condenação ou reformem a improcedência) e, após interromper, <b>recomeça pela metade</b> (4 anos); há também <b>prescrição intercorrente</b> (§ 8º). Tudo isso é detalhado na unidade 28.", "<b>Teses do STF e pontos de conferência (de memória; conferir).</b> (a) <b>Tema 1.199 (RE 843.989)</b>: (i) é <b>necessária a presença do dolo</b> nos atos dos arts. 9º, 10 e 11; (ii) a <b>revogação da modalidade culposa</b> do art. 10 é <b>irretroativa</b>, não alcançando a <b>coisa julgada</b> nem execuções em andamento, mas a nova lei se aplica <b>aos processos em curso</b>, devendo o juízo analisar o dolo; (iii) o <b>novo regime prescricional não retroage</b>. (b) <b>ADIs 7042 e 7043</b>: o STF reconheceu a <b>legitimidade ativa concorrente</b> do <b>ente público lesado</b>, afastando a exclusividade do Ministério Público (relevante para o Município, que é quem o procurador representa). (c) <b>ADI 7236</b>: tema de efeitos da absolvição criminal e de outros dispositivos; <b>não conferi</b>. (d) Para o Município de Curitiba, o procurador atua como <b>representante do ente lesado</b>, com <b>legitimidade para propor ação</b> e para <b>integrar a lide</b> quando o autor for o MP.", "<b>Resumo operacional para prova.</b> (1) <b>Só dolo</b>; culpa e erro não bastam; divergência interpretativa não é improbidade. (2) <b>Art. 9º</b>: vantagem indevida, <b>sem exigir dano</b>; suspensão <b>até 14 anos</b>, multa = acréscimo patrimonial. (3) <b>Art. 10</b>: <b>perda patrimonial efetiva e comprovada</b>; suspensão <b>até 12 anos</b>, multa = valor do dano. (4) <b>Art. 11</b>: rol <b>taxativo</b>, exige <b>fim de proveito indevido</b> e <b>lesividade relevante</b>; <b>multa até 24 remunerações</b>, proibição até <b>4 anos</b>, sem perda da função nem suspensão de direitos políticos. (5) <b>Art. 10-A revogado</b>. (6) Sanções só se executam <b>após o trânsito em julgado</b>. (7) <b>Nepotismo</b> (art. 11, XI) exige dolo; <b>nomeação política</b> sozinha não basta. (8) <b>Prescrição</b> de <b>8 anos</b>; recomeço pela <b>metade</b>. (9) PJ não é punida duas vezes: Lei 8.429 e Lei 12.846 (<i>non bis in idem</i>)."], "pega": ["Culpa: a banca diz que o ato de improbidade do art. 10 admite <b>modalidade culposa</b>. Desde a Lei 14.230/2021, só se admite <b>ação ou omissão dolosa</b> (arts. 9º, 10 e 11).", "Dano: a banca exige <b>dano ao erário</b> para o art. 9º (ou para o art. 11). O art. 9º se configura com a <b>vantagem indevida</b> e o art. 11 independe de dano ou enriquecimento (art. 11, § 4º); só o art. 10 pede <b>perda patrimonial efetiva e comprovada</b>.", "Erro de gestão: a banca diz que a <b>mera ilegalidade</b> ou a <b>divergência interpretativa</b> configura improbidade. A lei diz que a <b>divergência baseada em jurisprudência</b> e o <b>exercício da função sem dolo</b> não configuram, e o art. 11, § 3º, exige a demonstração objetiva da ilegalidade com a indicação das normas violadas.", "Rol do art. 11: a banca afirma que o rol é <b>meramente exemplificativo</b>. Hoje o art. 11 traz condutas <b>taxativas</b> ('caracterizada por uma das seguintes condutas'); o rol do art. 9º e do art. 10, por 'notadamente', segue <b>exemplificativo</b>.", "Sanções do art. 11: a banca inclui <b>perda da função</b> e <b>suspensão dos direitos políticos</b>. Pelo art. 12, III vigente, só há <b>multa de até 24 remunerações</b> e <b>proibição de contratar por até 4 anos</b> (mais o ressarcimento, se houver dano).", "Prazos de suspensão: a banca troca os números ('8 a 10 anos', 'de 5 a 8'). O texto vigente fixa <b>até 14 anos</b> (art. 9º) e <b>até 12 anos</b> (art. 10), com multa igual ao acréscimo patrimonial (art. 9º) ou ao dano (art. 10).", "Execução das sanções: a banca diz que a perda da função e a suspensão de direitos políticos se executam após a <b>sentença de primeiro grau</b> ou o acórdão. O § 9º do art. 12 exige o <b>trânsito em julgado</b>.", "Particular: a banca afirma que <b>sócio e diretor</b> respondem por improbidade da empresa <b>só por serem sócios</b>. O art. 3º, § 1º, exige <b>participação e benefício direto</b>, e a PJ não é sancionada pela Lei 8.429 se já responsabilizada pela <b>Lei 12.846</b> (art. 3º, § 2º; art. 12, § 7º).", "Sucessores: a banca diz que o herdeiro responde por <b>todas as sanções</b> do falecido. O art. 8º limita a responsabilidade ao <b>valor da herança</b> (e só a reparação e a perda de bens), e o art. 8º-A trata a sucessão empresarial com limite ao patrimônio transferido.", "Nepotismo: a banca diz que a <b>mera nomeação política</b> de parente ou apadrinhado por prefeito configura improbidade <b>por presunção</b>. O art. 11, § 5º, exige <b>dolo com finalidade ilícita</b>; a nomeação de cônjuge ou parente até o 3º grau para cargo de confiança continua prevista no inciso XI do art. 11."]}, {"materia": "DIREITO CIVIL", "titulo": "Registros Públicos (Lei 6.015/1973): espécies de registro, escrituração, protocolo e prioridade, princípios, registro, averbação, matrícula, procedimento de dúvida, retificação e cancelamento", "key": "CIV", "conc": ["Edital: item 7 de Direito Civil, 'Registros Públicos (Lei nº 6.015/1973): Registros, presunção de fé pública, prioridade, especialidade, legalidade, continuidade, transcrição, inscrição e averbação. Procedimento de dúvida'. Li <b>literalmente</b>, no navegador (Planalto, texto compilado): <b>Lei 6.015/1973, arts. 1º a 7º, 12 a 15, 167 (parte), 169, 172 a 176 (parte), 182 a 195, 196 a 212, 213 (caput, incisos e §§ 1º a 7º, em parte), 237, 252 a 259 e 260</b>. <b>Não li</b> o registro civil das pessoas naturais e jurídicas (arts. 29 em diante), o registro de títulos e documentos, nem a íntegra dos arts. 167, 176, 213 e 214 a 236. Os artigos do <b>Código Civil</b> (arts. 1.245 a 1.247) e a <b>Lei 13.097/2015</b> (concentração) citados abaixo vêm <b>da minha memória</b>. As teses de jurisprudência não foram conferidas. Esta unidade não traz questões novas do banco de provas; o treino fica no app.", "<b>Quais são os registros públicos (arts. 1º e 2º).</b> Os serviços de registros públicos, estabelecidos pela legislação civil para dar <b>autenticidade, segurança e eficácia</b> aos atos jurídicos, ficam sujeitos à lei. São quatro: <b>(I) registro civil de pessoas naturais; (II) registro civil de pessoas jurídicas; (III) registro de títulos e documentos; (IV) registro de imóveis</b>. Os demais registros (como o de empresas, o de embarcações, o de aeronaves) regem-se por <b>leis próprias</b> (§ 2º). O § 3º, hoje, manda <b>escriturar, publicizar e conservar os registros em meio eletrônico</b>, nos padrões da <b>Corregedoria Nacional de Justiça do CNJ</b>, e o § 4º <b>veda</b> às serventias recusar a recepção, a conservação ou o registro de documentos eletrônicos produzidos nos termos do CNJ. A lei cita o <b>Serp</b> (Sistema Eletrônico dos Registros Públicos) em vários artigos, como no art. 169, § 2º.", "<b>Escrituração e livros (arts. 3º a 7º).</b> A escrituração é feita em <b>livros encadernados</b>, sujeitos à <b>correição</b> da autoridade judiciária competente; os livros são abertos, numerados, autenticados e encerrados <b>pelo oficial</b> (art. 4º). A numeração dos registros <b>não se interrompe</b> no fim de cada livro (art. 7º). O art. 7º-A afasta essas regras para a <b>escrituração eletrônica</b>. No Registro de Imóveis há cinco livros (art. 173): <b>Livro 1 (Protocolo)</b>, <b>Livro 2 (Registro Geral)</b>, <b>Livro 3 (Registro Auxiliar)</b>, <b>Livro 4 (Indicador Real)</b> e <b>Livro 5 (Indicador Pessoal)</b>. O Livro 2 serve à <b>matrícula</b> dos imóveis e ao registro ou averbação dos atos do art. 167 (art. 176).", "<b>Instância (rogação) e impulso oficial (art. 13).</b> Salvo as <b>anotações e averbações obrigatórias</b>, os atos do registro são praticados <b>(I) por ordem judicial; (II) a requerimento verbal ou escrito dos interessados; (III) a requerimento do Ministério Público</b>, quando a lei autorizar. É o <b>princípio da instância</b>: o registrador não age de ofício como regra. As exceções de ofício existem, como a retificação de erro de transposição e a abertura de matrícula (art. 213, I, e art. 169, IV). Se o interessado no registro for o próprio oficial ou parente em grau de impedimento, o ato incumbe ao <b>substituto legal</b> (art. 15).", "<b>Protocolo, prenotação e <i>prioridade</i> (arts. 12, 174 a 192).</b> O Livro 1 serve para o <b>apontamento de todos os títulos apresentados diariamente</b>, e é encerrado diariamente (art. 184). Cada título recebe o número de ordem <b>pela sequência rigorosa da apresentação</b> (art. 182), que é reproduzido no título com a data da prenotação (art. 183). O <b>número de ordem determina a prioridade do título, e esta a preferência dos direitos reais</b>, ainda que apresentados pela mesma pessoa vários títulos simultaneamente (art. 186). O art. 12 garante que nenhuma <b>exigência fiscal ou dúvida</b> impede o lançamento no Protocolo quando da precedência decorre prioridade. <b>Regras de conflito</b>: no mesmo dia, <b>não se registram</b> títulos que constituam <b>direitos reais contraditórios</b> sobre o mesmo imóvel (art. 190); prevalece o de <b>número de ordem mais baixo</b>, protelando-se o registro dos posteriores por, pelo menos, <b>um dia útil</b> (art. 191); a regra não vale para <b>escrituras públicas da mesma data</b> que indiquem a <b>hora</b> da lavratura (art. 192). A <b>segunda hipoteca</b> com referência à anterior é prenotada e o oficial aguarda <b>30 dias</b> pela inscrição da primeira, depois do que a segunda é inscrita e <b>passa a ter preferência</b> (art. 189).", "<b>Prazos do registro e a nota devolutiva (arts. 188, 198 e 205).</b> Protocolizado o título, o oficial procede ao <b>registro</b> ou emite <b>nota devolutiva</b> no prazo de <b>10 dias</b> (art. 188). No prazo de <b>5 dias</b>, se não houver exigências ou falta de custas: escrituras de compra e venda sem cláusulas especiais, pedidos de averbação de construção e cancelamento de garantias, documentos eletrônicos apresentados pelo Serp e títulos reapresentados na vigência da prenotação com as exigências cumpridas (§ 1º). A exigência é feita <b>por escrito, de uma só vez, de forma articulada, clara e objetiva</b>, com data, identificação e assinatura (art. 198, caput). <b>A prenotação perde a eficácia</b> se, em <b>20 dias</b> (<b>40 dias</b> na regularização fundiária de interesse social), o título não for registrado por omissão do interessado em atender às exigências (art. 205 e parágrafo único). O oficial <b>não pode recusar</b> a prenotação de título eletrônico produzido conforme o CNJ (art. 1º, § 4º).", "<b>Princípio da <i>continuidade</i> (arts. 195 e 237).</b> Se o imóvel <b>não estiver matriculado ou registrado em nome do outorgante</b>, o oficial exigirá a <b>prévia matrícula e o registro do título anterior</b>, qualquer que seja a sua natureza, para <b>manter a continuidade</b> do registro (art. 195). O art. 237 completa: <b>ainda que o imóvel esteja matriculado</b>, não se fará o registro que dependa da apresentação de <b>título anterior</b>, a fim de preservar a continuidade. Em linguagem simples: cada transmissão deve <b>encaixar na cadeia</b> (A vendeu a B, B vende a C; não se registra a venda de A a C sem a de A a B). Se o título anterior estiver em outro cartório, o novo título vai com <b>certidão atualizada</b> do registro anterior e de ônus (art. 197).", "<b>Princípio da <i>especialidade</i> e a matrícula (art. 176).</b> Especialidade exige que o imóvel e as partes sejam <b>individualizados</b>. <b>Cada imóvel tem matrícula própria</b>, aberta por ocasião do primeiro ato de registro ou averbação caso a transcrição possua os requisitos (art. 176, § 1º, I). São <b>requisitos da matrícula</b> (art. 176, § 1º, II): o <b>número de ordem</b>, a <b>data</b>, a <b>identificação do imóvel</b> (se <b>rural</b>: código do imóvel, dados do <b>CCIR</b>, denominação, características, confrontações, localização e área; se <b>urbano</b>: características, confrontações, localização, área, logradouro, número e designação cadastral) e a <b>qualificação do proprietário</b> (nome, domicílio, nacionalidade; para pessoa física, estado civil, profissão, <b>CPF</b> ou RG ou filiação). Os demais requisitos do art. 176 <b>não li</b> em detalhe. O art. 169, II, estabelece que, para imóvel em <b>duas ou mais circunscrições</b>, abrem-se matrículas em <b>ambas</b> as serventias.", "<b>Registro <i>lato sensu</i>: registro e averbação (arts. 167, 169 e 172).</b> O art. 172 define a função do Registro de Imóveis: fazer o <b>registro e a averbação dos títulos ou atos constitutivos, declaratórios, translativos e extintivos de direitos reais</b> sobre imóveis, <b>inter vivos ou mortis causa</b>, quer para <b>constituição, transferência e extinção</b>, quer para <b>validade em relação a terceiros</b>, quer para <b>disponibilidade</b>. O art. 167 distingue: <b>I – registro</b> (por exemplo: instituição de bem de família; hipotecas legais, judiciais e convencionais; locações com cláusula de vigência em caso de alienação; penhoras, arrestos e sequestros; servidões; usufruto, uso e habitação; compromisso de compra e venda e cessão; entre outros) e <b>II – averbação</b> (por exemplo: convenções antenupciais e regime de bens; <b>cancelamento</b> da extinção de ônus e direitos reais; mudança de denominação e numeração, <b>edificação, reconstrução, demolição</b>, desmembramento e loteamento; alteração do nome por casamento ou por desquite (como diz o texto); cláusulas de <b>inalienabilidade, impenhorabilidade e incomunicabilidade</b>; decisões e recursos relativos a atos registrados; sentenças de separação, divórcio e anulação de casamento quando as partilhas contiverem imóveis; <b>notificação para parcelamento, edificação ou utilização compulsórios</b>; extinção da concessão de uso especial para moradia; extinção do direito de superfície; entre outros). Em termos práticos: <b>registro</b> cria, transfere ou grava direito real (em regra); <b>averbação</b> <b>modifica ou noticia</b> fato que altera o registro ou as pessoas, ou cancela.", "<b>Fé pública, presunção e <i>transcrição</i> (de memória; conferir).</b> Os registradores são titulares de serviço dotado de <b>fé pública</b> (Lei 8.935/1994, art. 3º), e o registro goza de <b>presunção relativa de veracidade</b>. No CC (arts. 1.245 a 1.247, <b>não lidos</b> aqui): <b>a propriedade imóvel se transfere pelo registro do título translativo</b> (art. 1.245); <b>enquanto não registrado</b>, o alienante continua dono (§ 1º); <b>enquanto não se promover a anulação do registro</b>, o adquirente é dono (§ 2º); a eficácia do registro <b>retroage à data da prenotação</b> (art. 1.246); <b>retificação ou anulação</b> do registro por falta de verdade (art. 1.247). Na Lei 6.015, o <b>art. 252</b> (que li) diz que o registro, <b>enquanto não cancelado, produz todos os efeitos legais</b>, ainda que por outra maneira se prove que o título está desfeito, anulado, extinto ou rescindido. <b>Transcrição</b> era o sistema anterior à Lei 6.015 (Livro 3, <i>Transcrição das Transmissões</i>); o sistema atual é de <b>matrícula</b>, mas as transcrições antigas ainda dão origem às matrículas no primeiro ato (art. 176, § 1º, I). A <b>inscrição</b>, em sentido amplo, é o registro de hipotecas e demais ônus.", "<b>Princípio da <i>legalidade</i> e o procedimento de <i>dúvida</i> (arts. 198 a 207).</b> O registrador faz a <b>qualificação registral</b>: se houver exigência, indica-a por escrito (art. 198). O interessado pode <b>(V) satisfazê-la</b> ou <b>(VI)</b>, se não se conformar ou for impossível cumprir, <b>requerer que o título e a declaração de dúvida sejam remetidos ao juízo competente</b>. Rito (art. 198, § 1º): <b>anotação na margem da prenotação</b>; certificação da prenotação e da suscitação, com rubrica das folhas; <b>ciência ao apresentante</b>, que é notificado para <b>impugnar em 15 dias</b> perante o juízo; remessa eletrônica das razões da dúvida e do título. Se o interessado <b>não impugnar</b>, a dúvida é <b>ainda assim julgada por sentença</b> (art. 199). Impugnada, ouve-se o <b>Ministério Público em 10 dias</b> (art. 200); o juiz decide em <b>15 dias</b> (art. 201). Da sentença cabe <b>apelação</b>, com efeitos <b>devolutivo e suspensivo</b>, pelo <b>interessado, MP e terceiro prejudicado</b> (art. 202). Transitada em julgado: se <b>procedente</b>, os documentos voltam à parte e cancela-se a prenotação; se <b>improcedente</b>, o interessado reapresenta o título com a certidão da sentença e procede-se ao registro (art. 203). <b>A decisão da dúvida tem natureza administrativa</b> e <b>não impede o uso do processo contencioso competente</b> (art. 204). Custas: só são devidas, e pagas pelo interessado, <b>quando a dúvida é julgada procedente</b> (art. 207).", "<b>Retificação (arts. 212 e 213) e cancelamento (arts. 252 a 259).</b> Se o registro ou a averbação for <b>omissa, imprecisa ou não exprimir a verdade</b>, a retificação é feita <b>pelo oficial</b>, a requerimento do interessado, pelo <b>procedimento administrativo do art. 213</b>, sendo <b>facultado</b> o procedimento judicial (art. 212). O art. 213 permite retificar <b>de ofício ou a requerimento</b> nos casos de: erro de transposição de elemento do título; indicação ou atualização de confrontação; mudança de nome de logradouro; indicação de rumos, ângulos de deflexão ou coordenadas georreferenciadas <b>sem alterar as medidas perimetrais</b>; mero cálculo matemático; reprodução de linha divisória já retificada; dados de qualificação pessoal das partes (I). <b>A requerimento do interessado</b> (II), quando houver inserção ou alteração de <b>medida perimetral</b> ou de área, exige-se <b>planta e memorial descritivo</b> com ART no CREA e <b>anuência dos confrontantes</b>; se faltar alguma assinatura, o confrontante é <b>notificado para se manifestar em 15 dias</b> (§ 2º), <b>presumindo-se a anuência</b> pelo silêncio (§ 4º). Havendo <b>impugnação fundamentada</b>, o oficial intima o requerente (5 dias); sem transação, remete ao juiz, que decide de plano ou após instrução sumária, <b>remetendo às vias ordinárias</b> se a controvérsia versar sobre o <b>direito de propriedade</b> (§§ 5º e 6º). <b>Cancelamento</b>: o registro, enquanto não cancelado, vale (art. 252); o <b>terceiro prejudicado</b> pode provar em juízo a extinção dos ônus e promover o cancelamento (art. 253); cancelado o registro, se o título subsistir, o credor pode fazer <b>novo registro</b>, que <b>só produz efeitos a partir da nova data</b> (art. 254); o cancelamento <b>não pode</b> decorrer de sentença <b>sujeita a recurso</b> (art. 259).", "<b>Bem de família (arts. 260 e seguintes; ponte com o Direito de Família).</b> A <b>instituição do bem de família</b> far-se-á <b>por escritura pública</b>, declarando o instituidor que determinado prédio se destina a domicílio de sua família e <b>ficará isento de execução por dívida</b> (art. 260, que li). O registro é feito no <b>Registro de Imóveis</b> (art. 167, I, 1), e o art. 261 trata da apresentação ao oficial. Para o Município, a distinção entre o <b>bem de família voluntário</b> (CC) e o <b>legal</b> (Lei 8.009/1990) importa em <b>execução fiscal</b> (de memória; não lido nesta unidade).", "<b>Resumo operacional para prova.</b> (1) São <b>quatro</b> registros públicos (RCPN, RCPJ, RTD, RI). (2) <b>Instância</b>: registro a requerimento, por ordem judicial ou do MP (art. 13). (3) <b>Prioridade</b>: número de ordem do Protocolo (arts. 182 a 191); direitos reais contraditórios não se registram no mesmo dia (art. 190). (4) <b>Continuidade</b>: exige registro prévio em nome do outorgante (arts. 195 e 237). (5) <b>Especialidade</b>: matrícula própria, com identificação do imóvel e das partes (art. 176). (6) <b>Legalidade</b>: exigência escrita, única e articulada; <b>dúvida</b> com impugnação em <b>15 dias</b>, MP em <b>10</b>, decisão em <b>15</b>, apelação com efeito suspensivo; natureza <b>administrativa</b> (arts. 198 a 204). (7) Prazos: <b>10 dias</b> (5 em casos específicos); prenotação cessa em <b>20 dias</b> (40 na Reurb-S). (8) Registro vale até o <b>cancelamento</b> (art. 252). (9) Retificação administrativa com <b>notificação de confrontantes em 15 dias</b> e <b>anuência presumida</b> (art. 213, §§ 2º e 4º)."], "pega": ["Espécies: a banca inclui o <b>registro de empresas mercantis</b> ou o <b>registro de embarcações</b> entre os quatro da Lei 6.015. O art. 1º, § 1º, lista: <b>pessoas naturais, pessoas jurídicas, títulos e documentos e imóveis</b>; os demais regem-se por leis próprias (§ 2º).", "Instância: a banca diz que o oficial pratica <b>todos os atos de ofício</b>. A regra é a <b>instância</b> (art. 13: ordem judicial, requerimento do interessado ou do MP); de ofício só em casos como a retificação por erro de transposição (art. 213, I) e as averbações obrigatórias.", "Prioridade: a banca afirma que prevalece o título de <b>data de lavratura anterior</b>. A prioridade decorre do <b>número de ordem no Protocolo</b> (arts. 182 e 186); a escritura que declara a <b>hora</b> da lavratura só prevalece nos casos do art. 192.", "Direitos reais contraditórios: a banca diz que se registram <b>ambos</b> no mesmo dia e prevalece o primeiro. O art. 190 <b>proíbe</b> o registro, no mesmo dia, de títulos que constituam direitos reais contraditórios sobre o mesmo imóvel.", "Continuidade: a banca afirma que, estando o imóvel matriculado, <b>qualquer título</b> pode ser registrado. O art. 237 manda <b>exigir o título anterior</b> mesmo com matrícula aberta, para preservar a continuidade; o art. 195 exige a prévia matrícula e o registro em nome do outorgante.", "Dúvida: a banca diz que o <b>oficial decide</b> a dúvida, ou que a decisão faz <b>coisa julgada material</b>. Quem decide é o <b>juiz competente</b>, e a decisão tem <b>natureza administrativa</b> e <b>não impede</b> o processo contencioso (art. 204).", "Prazos da dúvida: a banca troca os números (impugnação em <b>10 dias</b>, parecer do MP em <b>15</b>). Impugnação: <b>15 dias</b>; MP: <b>10 dias</b>; decisão do juiz: <b>15 dias</b> (arts. 198, § 1º, III, 200 e 201).", "Recurso: a banca diz que a apelação da sentença da dúvida só tem efeito <b>devolutivo</b>, ou que só o interessado pode recorrer. Cabe apelação com efeitos <b>devolutivo e suspensivo</b> e legitimados são o <b>interessado, o MP e o terceiro prejudicado</b> (art. 202).", "Custas: a banca afirma que as custas da dúvida são devidas sempre. Só são devidas, pelo interessado, quando a dúvida é <b>julgada procedente</b> (art. 207).", "Prenotação: a banca diz que a prenotação vale <b>indefinidamente</b> enquanto pendente a exigência. Cessam os efeitos em <b>20 dias</b> se o interessado não atender à exigência (40 dias na regularização fundiária de interesse social).", "Registro e anulação do título: a banca diz que, provada a nulidade do título, o registro <b>deixa de valer</b> por si. Pelo art. 252, o registro, enquanto <b>não cancelado</b>, produz todos os seus efeitos, mesmo que se prove que o título está desfeito, anulado ou rescindido."]}, {"materia": "DIREITO URBANÍSTICO E AMBIENTAL", "titulo": "Estatuto da Metrópole (Lei 13.089/2015) e Estatuto da Cidade (Lei 10.257/2001): governança interfederativa, plano diretor e instrumentos da política urbana", "key": "URB", "conc": ["Edital: item 2 de Direito Urbanístico e Ambiental. Li <b>literalmente</b>, no navegador (Planalto): <b>Lei 13.089/2015 (Estatuto da Metrópole), arts. 1º a 25</b>, e <b>Lei 10.257/2001 (Estatuto da Cidade), arts. 4º a 10, 21 a 38, 39 a 42-B e 43 a 46</b> (e o início do art. 47). O texto compilado do Planalto <b>mostra lado a lado as redações antiga e nova</b>, e as notas de revogação ficaram fora do meu recorte; por isso conferi à parte o <b>art. 21 do Estatuto da Metrópole</b>, que a página marca como <b>revogado pela Lei 13.683/2018</b>. <b>Não li</b> os arts. 11 a 20 do Estatuto da Cidade (usucapião coletiva e concessão de uso, em boa parte vetados ou revogados) nem a íntegra do art. 2º (diretrizes; li-as na unidade 1 apenas em parte). <b>Zonas Especiais de Interesse Social (ZEIS)</b>: o Estatuto só as cita (art. 4º, V, f, e as regras de expansão urbana e de áreas de risco, arts. 42-A e 42-B), a regulação é <b>municipal</b> e a doutrina vem <b>da minha memória</b>. Teses do STF e conceitos de doutrina também são de memória. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Estatuto da Metrópole: objeto e competências (Lei 13.089/2015, art. 1º).</b> Estabelece <b>diretrizes gerais para o planejamento, a gestão e a execução das funções públicas de interesse comum (FPIC)</b> em <b>regiões metropolitanas e aglomerações urbanas instituídas pelos Estados</b>, normas gerais sobre o <b>plano de desenvolvimento urbano integrado (PDUI)</b> e instrumentos de <b>governança interfederativa</b>, e critérios para o apoio da União. Fundamenta-se nos arts. 21, XX, 23, IX, 24, I, 25, § 3º e 182 da CF. Aplica-se, <b>no que couber</b>, às <b>microrregiões</b> com FPIC de características predominantemente urbanas e às <b>unidades regionais de saneamento básico</b> (art. 1º, § 1º). Na aplicação, observam-se as normas gerais do <b>Estatuto da Cidade</b> (§ 2º).", "<b>Conceitos (art. 2º).</b> <b>Aglomeração urbana</b>: unidade territorial urbana constituída pelo agrupamento de <b>dois ou mais Municípios limítrofes</b>, com complementaridade funcional e integração das dinâmicas geográficas, ambientais, políticas e socioeconômicas. <b>Função pública de interesse comum</b>: política pública ou ação nela inserida cuja realização por um <b>Município, isoladamente, seja inviável ou cause impacto em Municípios limítrofes</b>. <b>Gestão plena</b>: região metropolitana ou aglomeração com (a) <b>formalização e delimitação por lei complementar estadual</b>, (b) <b>estrutura de governança interfederativa própria</b> (art. 8º) e (c) <b>PDUI aprovado por lei estadual</b>. <b>Governança interfederativa</b>: compartilhamento de responsabilidades e ações entre entes da Federação (organização, planejamento e execução das FPIC). <b>Metrópole</b>: espaço urbano com continuidade territorial que, pela população e relevância, tem <b>influência nacional ou sobre uma região que configure, no mínimo, a área de influência de uma capital regional</b>, conforme critérios do <b>IBGE</b>. <b>Região metropolitana</b>: unidade regional <b>instituída pelos Estados, mediante lei complementar</b>, por agrupamento de Municípios limítrofes para integrar a organização, o planejamento e a execução de FPIC. <b>Área metropolitana</b>: expansão contínua da malha urbana da metrópole, conurbada pela integração dos sistemas viários. <b>PDUI</b>: instrumento que estabelece, com base em planejamento permanente, <b>diretrizes</b> para o desenvolvimento territorial estratégico e os projetos estruturantes.", "<b>Instituição das unidades territoriais (arts. 3º a 5º).</b> Os <b>Estados</b>, <b>mediante lei complementar</b>, podem instituir regiões metropolitanas e aglomerações urbanas (art. 3º). Estado e Municípios incluídos <b>devem promover a governança interfederativa</b> (§ 1º). A criação deve ser <b>precedida de estudos técnicos e audiências públicas</b> com <b>todos os Municípios</b> envolvidos (§ 2º). O <b>Distrito Federal</b> pode integrar região metropolitana com Municípios limítrofes (§ 3º). Se envolver Municípios de <b>mais de um Estado</b>, é formalizada por <b>leis complementares das assembleias de cada Estado</b> (art. 4º); enquanto nem todos aprovaram, vale só para os Municípios dos Estados que já aprovaram (§ 1º). A lei complementar estadual define, no mínimo: <b>os Municípios; as FPIC; a estrutura de governança interfederativa; e os meios de controle social</b> (art. 5º).", "<b>Governança interfederativa: princípios, diretrizes e estrutura (arts. 6º a 8º).</b> <b>Princípios</b> (art. 6º): <b>prevalência do interesse comum sobre o local</b>; compartilhamento de responsabilidades e de gestão; <b>autonomia dos entes</b>; observância das peculiaridades regionais; <b>gestão democrática</b> (arts. 43 a 45 do Estatuto da Cidade); efetividade no uso dos recursos; desenvolvimento sustentável. <b>Diretrizes específicas</b> (art. 7º): processo permanente e compartilhado de planejamento e decisão; meios compartilhados de organização administrativa; <b>sistema integrado de alocação de recursos e prestação de contas</b>; <b>execução compartilhada com rateio de custos</b>; participação de representantes da sociedade civil; compatibilização dos <b>PPAs, LDOs e LOAs</b>; <b>compensação por serviços ambientais</b> prestados pelo Município à unidade territorial. <b>Estrutura básica</b> (art. 8º): <b>(I) instância executiva</b> dos Poderes Executivos dos entes; <b>(II) instância colegiada deliberativa</b> com representação da sociedade civil; <b>(III) organização pública</b> com funções técnico-consultivas; <b>(IV) sistema integrado</b> de alocação de recursos e prestação de contas.", "<b>Instrumentos do desenvolvimento urbano integrado e o PDUI (arts. 9º a 12).</b> Sem prejuízo dos instrumentos do art. 4º do Estatuto da Cidade, usam-se, entre outros: <b>PDUI</b>; <b>planos setoriais interfederativos</b>; <b>fundos públicos</b>; <b>operações urbanas consorciadas interfederativas</b>; zonas para <b>aplicação compartilhada</b> dos instrumentos urbanísticos; <b>consórcios públicos</b> (Lei 11.107/2005); <b>convênios de cooperação</b>; <b>contratos de gestão</b>; compensação por serviços ambientais; e <b>PPPs interfederativas</b> (art. 9º). O <b>PDUI</b> é obrigatório e <b>aprovado por lei estadual</b> (art. 10). Ele <b>não exime</b> o Município de ter <b>plano diretor</b> (§ 2º), que deve ser <b>compatibilizado</b> com o PDUI (§ 3º). É elaborado <b>de forma conjunta e cooperada</b> (Estado, Municípios, sociedade civil) e <b>aprovado pela instância colegiada deliberativa antes de ir à Assembleia Legislativa</b> (§ 4º). <b>Revisão</b>: pelo menos a cada <b>10 anos</b> (art. 11). Conteúdo mínimo (art. 12, § 1º): <b>diretrizes para as FPIC</b>; <b>macrozoneamento</b>; articulação dos Municípios no parcelamento, uso e ocupação do solo; articulação intersetorial; áreas com restrições à urbanização e de <b>risco de desastres</b>; sistema de acompanhamento e controle; e diretrizes de <b>regularização fundiária</b> (Lei 13.465/2017). No processo de elaboração: <b>audiências públicas em todos os Municípios</b>, <b>publicidade</b> e <b>acompanhamento do Ministério Público</b> (§ 2º).", "<b>União, SNDU e outras regras do Estatuto da Metrópole (arts. 13 a 23).</b> A <b>União apoia</b> as iniciativas dos Estados e Municípios voltadas à governança interfederativa, nos limites orçamentários (art. 13). Para o apoio, exige-se que a unidade territorial tenha <b>gestão plena</b> (art. 14), e a região metropolitana deve atender ao conceito de <b>metrópole</b> do art. 2º, VII; admite-se apoio à elaboração do PDUI sem a exigência da alínea c do inciso III (art. 14, § 2º). A região metropolitana instituída por lei complementar que <b>não</b> atenda ao conceito é <b>enquadrada como aglomeração urbana</b> para as políticas federais (art. 15). O art. 20 coloca a aplicação da lei sob coordenação do <b>Sistema Nacional de Desenvolvimento Urbano (SNDU)</b>, com participação da sociedade civil, e um <b>subsistema de planejamento e informações metropolitanas</b>. O art. 22 aplica a lei, no que couber, às <b>regiões integradas de desenvolvimento (RIDEs)</b> criadas por lei complementar federal. O art. 23 preserva a possibilidade de <b>convênios e consórcios públicos</b> entre Municípios. O art. 24 inseriu o <b>art. 34-A no Estatuto da Cidade</b> (<b>operações urbanas consorciadas interfederativas</b>, aprovadas por <b>leis estaduais específicas</b>). <b>Atenção</b>: o art. 21 do Estatuto da Metrópole (improbidade do governador e do prefeito por não elaborarem o PDUI no prazo) está <b>revogado pela Lei 13.683/2018</b>, segundo a própria página do Planalto.", "<b>Estatuto da Cidade: lista de instrumentos (Lei 10.257, art. 4º).</b> Entre outros: <b>planos</b> nacionais, regionais e estaduais; <b>planejamento</b> das regiões metropolitanas e aglomerações; <b>planejamento municipal</b> (plano diretor; disciplina do <b>parcelamento, uso e ocupação do solo</b>; zoneamento ambiental; PPA; LDO; LOA; gestão orçamentária participativa); <b>institutos tributários e financeiros</b> (<b>IPTU</b>, <b>contribuição de melhoria</b>, incentivos fiscais); <b>institutos jurídicos e políticos</b> (desapropriação, servidão, limitações, <b>tombamento</b>, unidades de conservação, <b>ZEIS</b>, CDRU, concessão de uso especial para moradia, <b>PEUC</b>, <b>usucapião especial</b>, <b>direito de superfície</b>, <b>direito de preempção</b>, <b>outorga onerosa</b>, <b>transferência do direito de construir</b>, <b>operações urbanas consorciadas</b>, regularização fundiária, assistência técnica e jurídica gratuita, <b>referendo e plebiscito</b>, <b>demarcação urbanística</b>, <b>legitimação de posse</b>); e <b>EIA e EIV</b>. Os instrumentos <b>regem-se pela legislação própria</b>, observada a lei (§ 1º), e os que demandam dispêndio de recursos devem ser objeto de controle social (§ 3º).", "<b>PEUC, IPTU progressivo e desapropriação-sanção (arts. 5º a 8º).</b> <b>Lei municipal específica</b> para área incluída no plano diretor pode determinar o <b>parcelamento, edificação ou utilização compulsórios</b> do solo urbano <b>não edificado, subutilizado ou não utilizado</b>, fixando condições e prazos (art. 5º). Considera-se <b>subutilizado</b> o imóvel com aproveitamento <b>inferior ao mínimo definido no plano diretor</b> (§ 1º, I). O proprietário é <b>notificado</b> pelo Executivo, e a notificação é <b>averbada no registro de imóveis</b> (§ 2º); a notificação é feita por funcionário ao proprietário (ou, sendo PJ, a quem tenha poderes de gerência geral ou administração) ou, frustradas <b>três tentativas</b>, por <b>edital</b> (§ 3º). Prazos mínimos: <b>1 ano</b> a partir da notificação para protocolar o projeto; <b>2 anos</b> a partir da aprovação para iniciar as obras (§ 4º). A <b>transmissão</b> do imóvel, inter vivos ou causa mortis, <b>após a notificação</b>, <b>transfere as obrigações</b>, sem interromper os prazos (art. 6º). Descumpridos, o Município aplica o <b>IPTU progressivo no tempo</b>, com majoração da alíquota por <b>5 anos consecutivos</b>; a alíquota de cada ano é fixada na lei específica e <b>não pode exceder o dobro</b> do ano anterior, respeitada a <b>alíquota máxima de 15%</b> (art. 7º, § 1º); passados 5 anos sem cumprimento, mantém-se a <b>alíquota máxima</b> até o cumprimento (§ 2º); <b>vedadas isenções ou anistia</b> (§ 3º). Decorridos <b>5 anos de cobrança</b> sem cumprimento, o Município pode <b>desapropriar com pagamento em títulos da dívida pública</b>, de aprovação prévia pelo <b>Senado</b>, resgatáveis em até <b>10 anos</b>, em prestações anuais, iguais e sucessivas, com <b>juros legais de 6% ao ano</b> (art. 8º, § 1º). O valor real da indenização reflete a <b>base de cálculo do IPTU</b>, descontadas as <b>obras do Poder Público após a notificação</b>, e <b>não computa expectativas de ganho, lucros cessantes e juros compensatórios</b> (§ 2º); os títulos <b>não têm poder liberatório</b> para tributos (§ 3º). O Município tem <b>5 anos</b> para dar o aproveitamento adequado (§ 4º), direta ou indiretamente, por licitação (§ 5º), e o adquirente fica sujeito às mesmas obrigações (§ 6º).", "<b>Usucapião especial urbana (arts. 9º e 10).</b> <b>Individual</b>: área ou edificação urbana de até <b>250 m²</b>, por <b>5 anos</b> ininterruptos e sem oposição, para <b>moradia</b>, <b>sem ser proprietário de outro imóvel urbano ou rural</b>; título ao homem, à mulher ou a ambos, <b>independentemente do estado civil</b> (§ 1º); <b>uma só vez</b> (§ 2º); o herdeiro que já resida no imóvel <b>continua a posse</b> do antecessor (§ 3º). <b>Coletiva</b> (art. 10, na redação mais nova): <b>núcleos urbanos informais</b> existentes sem oposição há mais de <b>5 anos</b> e cuja <b>área total dividida pelo número de possuidores seja inferior a 250 m² por possuidor</b>, desde que os possuidores não sejam proprietários de outro imóvel (a redação antiga falava em 'população de baixa renda'; o compilado mostra as duas redações; conferi no texto da página). O restante (sentença, condomínio especial, administração) <b>não li</b>.", "<b>Direito de superfície (arts. 21 a 24).</b> O proprietário urbano pode conceder a outrem o direito de superfície do seu terreno, por <b>tempo determinado ou indeterminado</b>, mediante <b>escritura pública registrada</b> no cartório de registro de imóveis. Abrange o direito de utilizar <b>solo, subsolo ou espaço aéreo</b> conforme o contrato e a legislação urbanística (§ 1º); pode ser <b>gratuita ou onerosa</b> (§ 2º). O superficiário responde pelos <b>encargos e tributos</b> da propriedade superficiária e, proporcionalmente, pelos da área objeto da concessão, salvo disposição contrária (§ 3º); o direito <b>pode ser transferido a terceiros</b> (§ 4º) e, por morte do superficiário, <b>transmite-se aos herdeiros</b> (§ 5º). Em caso de alienação do terreno ou do direito de superfície, o superficiário e o proprietário têm <b>direito de preferência</b>, em igualdade de condições (art. 22). Extingue-se pelo <b>termo</b> ou pelo <b>descumprimento</b> das obrigações (art. 23); extinto, o proprietário recupera o <b>pleno domínio</b>, com acessões e benfeitorias, <b>sem indenização</b>, se o contrato não dispuser o contrário (art. 24); antes do termo, extingue-se se houver <b>destinação diversa</b> da concedida (§ 1º), e a extinção é <b>averbada</b> (§ 2º). (O Código Civil também trata da superfície nos arts. 1.369 e seguintes; <b>de memória</b>.)", "<b>Direito de preempção (arts. 25 a 27).</b> Confere ao <b>Poder Público municipal</b> preferência para <b>aquisição de imóvel urbano objeto de alienação onerosa entre particulares</b> (art. 25). <b>Lei municipal, baseada no plano diretor</b>, delimita as áreas e fixa prazo de vigência <b>não superior a 5 anos</b>, <b>renovável a partir de um ano</b> após o decurso do prazo inicial (§ 1º); fica assegurado durante a vigência, <b>independentemente do número de alienações</b> (§ 2º). Finalidades (art. 26): <b>regularização fundiária; programas habitacionais de interesse social; reserva fundiária; ordenamento e expansão urbana; equipamentos urbanos e comunitários; espaços públicos de lazer e áreas verdes; unidades de conservação; áreas de interesse histórico, cultural ou paisagístico</b>; e outra finalidade. Procedimento (art. 27): o proprietário <b>notifica</b> a intenção de alienar; o Município, em <b>até 30 dias</b>, manifesta por escrito o interesse; a notificação leva <b>proposta de compra assinada por terceiro</b> (preço, condições, validade); o Município publica <b>edital</b>; sem manifestação, o proprietário pode alienar a terceiros nas condições da proposta; concretizada a venda, apresenta <b>cópia do instrumento</b> em <b>30 dias</b>. A alienação em <b>condições diversas</b> da proposta é <b>nula de pleno direito</b>, e o Município pode adquirir pelo <b>valor da base de cálculo do IPTU</b> ou pelo da proposta, se inferior (§§ 5º e 6º).", "<b>Outorga onerosa e transferência do direito de construir (arts. 28 a 31 e 35).</b> <b>Outorga onerosa do direito de construir</b>: o plano diretor fixa áreas em que o direito de construir pode ser exercido <b>acima do coeficiente de aproveitamento básico</b>, mediante <b>contrapartida</b> do beneficiário (art. 28). <b>Coeficiente de aproveitamento</b> é a relação entre a <b>área edificável e a área do terreno</b> (§ 1º); o básico pode ser <b>único</b> para toda a zona urbana ou <b>diferenciado</b> (§ 2º); o plano define os <b>limites máximos</b>, considerando a proporcionalidade entre a <b>infraestrutura existente</b> e o aumento de densidade (§ 3º). Também se pode permitir <b>alteração de uso do solo</b> mediante contrapartida (art. 29). Uma <b>lei municipal específica</b> estabelece a <b>fórmula de cálculo</b>, os <b>casos de isenção</b> e a <b>contrapartida</b> (art. 30); os recursos têm <b>destinação vinculada</b> (art. 31, finalidades do art. 26, I a IX). <b>Transferência do direito de construir</b> (art. 35): lei municipal, baseada no plano diretor, autoriza o proprietário de imóvel urbano, <b>privado ou público</b>, a <b>exercer em outro local ou alienar, por escritura pública</b>, o direito de construir quando o imóvel for necessário para: <b>equipamentos urbanos e comunitários</b>; <b>preservação</b> de interesse histórico, ambiental, paisagístico, social ou cultural; ou <b>regularização fundiária</b>, urbanização de áreas ocupadas por população de baixa renda e habitação de interesse social. A mesma faculdade vale para quem <b>doar</b> ao Poder Público seu imóvel (§ 1º).", "<b>Operações urbanas consorciadas (arts. 32 a 34-A).</b> Conjunto de intervenções e medidas coordenadas pelo <b>Poder Público municipal</b>, com a participação de <b>proprietários, moradores, usuários permanentes e investidores privados</b>, para alcançar em uma área <b>transformações urbanísticas estruturais, melhorias sociais e valorização ambiental</b> (art. 32, § 1º). <b>Lei municipal específica, baseada no plano diretor</b>, delimita a área; podem ser previstas: modificação de índices e características de parcelamento, uso e ocupação do solo; <b>regularização</b> de construções em desacordo com a legislação; e <b>incentivos</b> a tecnologias que reduzam impactos ambientais (§ 2º). A lei contém o <b>plano de operação</b>: área, programa básico de ocupação, <b>programa de atendimento econômico e social</b> da população afetada, finalidades, <b>EIV</b>, <b>contrapartida</b>, forma de controle <b>compartilhado com a sociedade civil</b> e natureza dos incentivos (art. 33). <b>Os recursos</b> obtidos são aplicados <b>exclusivamente na própria operação</b> (§ 1º), e, a partir da lei, são <b>nulas</b> as licenças contrárias ao plano (§ 2º). A lei pode prever os <b>CEPACs (certificados de potencial adicional de construção)</b>, alienados em leilão ou usados no pagamento das obras, <b>livremente negociados</b> mas <b>conversíveis em direito de construir unicamente na área da operação</b> (art. 34, §§ 1º e 2º). Nas regiões metropolitanas e aglomerações, podem existir operações <b>interfederativas</b>, aprovadas por <b>leis estaduais específicas</b> (art. 34-A).", "<b>EIV, plano diretor e gestão democrática (arts. 36 a 46).</b> <b>Estudo de Impacto de Vizinhança (EIV)</b>: <b>lei municipal</b> define os empreendimentos e atividades, <b>privados ou públicos</b>, que dependem do EIV para obter licenças de construção, ampliação ou funcionamento (art. 36). Analisa os efeitos <b>positivos e negativos</b> sobre a qualidade de vida da população da área e proximidades, incluindo no mínimo: <b>adensamento populacional; equipamentos urbanos e comunitários; uso e ocupação do solo; valorização imobiliária; mobilidade urbana, geração de tráfego e demanda por transporte público; ventilação e iluminação; paisagem urbana e patrimônio natural e cultural</b> (art. 37); os documentos são <b>públicos</b> (parágrafo único). O EIV <b>não substitui</b> o <b>EIA</b> (art. 38). <b>Plano diretor</b> (arts. 39 a 42-B): <b>função social</b> da propriedade urbana = atender às exigências do plano diretor (art. 39); <b>lei municipal</b>; <b>instrumento básico</b> (art. 40); <b>obrigatório</b> para cidades com <b>mais de 20 mil habitantes</b>, integrantes de <b>regiões metropolitanas e aglomerações</b>, onde se pretenda usar os instrumentos do <b>art. 182, § 4º</b>, de <b>especial interesse turístico</b>, na área de influência de empreendimentos de <b>significativo impacto ambiental</b> e as incluídas no <b>cadastro nacional de áreas suscetíveis a desastres</b> (art. 41); cidades com mais de <b>500 mil habitantes</b> devem ter <b>plano de transporte urbano integrado</b> (§ 2º). <b>Conteúdo mínimo</b> (art. 42): delimitação das áreas para o <b>PEUC</b>; disposições sobre <b>preempção, outorga onerosa, alteração de uso, operações consorciadas e transferência do direito de construir</b>; <b>sistema de acompanhamento e controle</b>. <b>Gestão democrática</b> (arts. 43 a 45): <b>órgãos colegiados</b>, <b>debates, audiências e consultas públicas</b>, <b>conferências</b>, <b>iniciativa popular</b>; a <b>gestão orçamentária participativa</b> exige debates e audiências sobre PPA, LDO e LOA como <b>condição obrigatória</b> para aprovação pela Câmara (art. 44). <b>Consórcio imobiliário</b> (art. 46): o Município pode facultar ao proprietário atingido pelo art. 5º que <b>transfira o imóvel ao poder público</b> e, após as obras, receba <b>unidades imobiliárias urbanizadas ou edificadas</b> como pagamento (§ 1º), cujo valor corresponde ao <b>valor do imóvel antes da execução das obras</b> (§ 2º); a nova redação inclui a <b>regularização fundiária</b> e não livra quem causou <b>núcleo urbano informal</b> da responsabilidade (§ 3º).", "<b>ZEIS, resumo operacional e pontos de conferência.</b> <b>ZEIS</b> são áreas do território urbano, <b>delimitadas pelo plano diretor ou lei municipal</b>, destinadas à <b>habitação de interesse social</b> e à <b>regularização fundiária</b>, com parâmetros urbanísticos próprios (doutrina; de memória). O Estatuto da Cidade as lista no <b>art. 4º, V, f</b> e manda prever <b>zonas especiais de interesse social</b> nos planos de expansão urbana e de áreas de risco (arts. 42-A e 42-B, que li; a numeração no compilado vem misturada). <b>Resumo</b>: (1) Estatuto da Metrópole é de <b>governança interfederativa</b>, com <b>PDUI estadual</b> e revisão a cada <b>10 anos</b>; (2) o PDUI <b>não dispensa</b> o plano diretor; (3) a <b>sequência</b> do art. 182, § 4º, é PEUC, IPTU progressivo (5 anos, máximo de 15%, dobro a cada ano) e desapropriação com títulos (10 anos, juros de 6%); (4) <b>preempção</b>: 5 anos de vigência, 30 dias para manifestação; (5) <b>outorga</b>, <b>TDC</b> e <b>operações consorciadas</b> dependem de <b>lei municipal específica baseada no plano diretor</b>; (6) <b>EIV</b> não substitui <b>EIA</b>; (7) <b>superfície</b> por escritura pública registrada; (8) recursos da outorga e das operações têm <b>destinação vinculada</b>. <b>De memória</b> (conferir): o STF, na <b>ADI 1.842</b> (regiões metropolitanas do RJ), afirmou que o <b>interesse comum</b> exige <b>decisão compartilhada</b> entre Estado e Municípios, sem <b>concentração</b> do poder em um só ente, e o Estatuto da Metrópole segue essa linha."], "pega": ["Metrópole: a banca diz que a região metropolitana é instituída por <b>lei ordinária</b> ou por <b>decreto</b> do Estado, ou pela <b>União</b>. É criada pelos <b>Estados, mediante lei complementar</b>, por agrupamento de Municípios <b>limítrofes</b> (art. 3º); só os casos de RIDEs seguem lei complementar federal (art. 22).", "PDUI: a banca afirma que o plano de desenvolvimento urbano integrado <b>substitui</b> o plano diretor dos Municípios. O art. 10, § 2º, diz que <b>não exime</b> o Município de formular o plano diretor, que deve ser <b>compatibilizado</b> com o PDUI (§ 3º).", "Prazo de revisão: a banca fixa a revisão do PDUI em <b>5 anos</b> (ou do plano diretor em 5). O Estatuto da Metrópole (art. 11) e o Estatuto da Cidade (art. 40, § 3º) fixam <b>pelo menos 10 anos</b>.", "Estrutura de governança: a banca esquece a <b>instância colegiada deliberativa</b> com <b>representação da sociedade civil</b>, ou diz que só há instância executiva. O art. 8º traz <b>quatro</b> elementos: executiva, colegiada deliberativa, organização técnico-consultiva e sistema integrado de recursos e prestação de contas.", "Improbidade na governança: a banca afirma que o governador e o prefeito <b>respondem por improbidade</b> se não elaborarem o PDUI ou compatibilizarem o plano diretor (art. 21 da Lei 13.089). A página do Planalto marca o art. 21 como <b>revogado pela Lei 13.683/2018</b>.", "PEUC e IPTU progressivo: a banca diz que o IPTU progressivo pode ser aplicado <b>sem</b> a notificação e o prazo para o PEUC, ou que a alíquota pode passar de 15%. A sequência é <b>PEUC, IPTU progressivo e desapropriação</b>; a alíquota dobra por ano, com <b>teto de 15%</b>, durante <b>5 anos</b> (art. 7º), e <b>não há isenção nem anistia</b> (§ 3º).", "Desapropriação-sanção: a banca afirma que a indenização é em <b>dinheiro</b>, com <b>juros compensatórios</b> e lucros cessantes. É em <b>títulos da dívida pública</b>, resgatáveis em <b>até 10 anos</b>, com <b>juros legais de 6%</b>; o valor real <b>não computa</b> expectativas de ganho, lucros cessantes e juros compensatórios (art. 8º, §§ 1º e 2º).", "Preempção: a banca diz que o direito de preempção vale por <b>10 anos</b>, ou que o Município tem <b>60 dias</b> para manifestar o interesse. A vigência é de até <b>5 anos</b> (renovável após um ano); a manifestação do Município é em até <b>30 dias</b> (arts. 25 e 27).", "Outorga onerosa: a banca afirma que a outorga é criada por <b>decreto</b> ou é livre de contrapartida e de destinação. Exige <b>plano diretor</b> e <b>lei municipal específica</b> (fórmula de cálculo, isenções e contrapartida), e os recursos têm <b>destinação vinculada</b> (arts. 28 a 31).", "Operações urbanas consorciadas: a banca diz que os recursos podem ir ao <b>caixa geral</b> do Município, ou que a licença contrária ao plano continua válida. Os recursos são aplicados <b>exclusivamente na operação</b> e as licenças em desacordo são <b>nulas</b> (art. 33, §§ 1º e 2º); os CEPACs só se convertem em direito de construir <b>na área da operação</b> (art. 34, § 1º).", "EIV: a banca afirma que o EIV <b>dispensa</b> o EIA, ou que só vale para empreendimentos <b>privados</b>. O EIV <b>não substitui</b> o EIA (art. 38) e abrange atividades <b>privadas ou públicas</b>, conforme lei municipal (art. 36)."]}, {"materia": "DIREITO EMPRESARIAL", "titulo": "Sociedades: disposições gerais, personalidade e desconsideração, sociedades não personificadas, sociedade simples, limitada, anônima, transformação, incorporação, fusão e cisão", "key": "EMP", "conc": ["Edital: item 2 de Direito Empresarial (sociedades; fica para outras unidades a defesa da concorrência e a falência). Li <b>literalmente</b>, no navegador (Planalto): <b>Código Civil, arts. 50, 51, 981 a 994, 997 e 998 (início), 1.023 a 1.027, 1.052 a 1.063, 1.071 a 1.077, 1.080 a 1.084</b>; <b>Lei 6.404/1976, arts. 1º a 3º, 80, 109, 116, 117, 153 a 155, 158, 220 a 223, 227 a 229, 233 a 235, 243 e 265</b>. <b>Não li</b>: os demais artigos do CC sobre sociedade simples (arts. 999 a 1.022, 1.030 a 1.038), sociedade em nome coletivo, comandita, cooperativa; a parte da limitada sobre conselho fiscal, exclusão de sócio (art. 1.085) e dissolução; <b>a maior parte da Lei das S.A.</b> (ações, assembleia, conselhos, balanços, debêntures, o regime de economia mista dos arts. 236 a 240, consórcio dos arts. 278 e 279); o <b>CPC</b> (arts. 133 a 137, incidente de desconsideração); o <b>CDC</b> (art. 28); a <b>Lei 13.303/2016</b>; e a <b>Lei 14.133/2021</b>. Tudo isso, quando aparece abaixo, vem <b>da minha memória</b> e está <b>sinalizado</b>. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Contrato de sociedade e espécies (CC, arts. 981 a 985).</b> Celebram contrato de sociedade as pessoas que <b>reciprocamente se obrigam a contribuir, com bens ou serviços, para o exercício de atividade econômica e a partilha, entre si, dos resultados</b> (art. 981); a atividade pode restringir-se a <b>um ou mais negócios determinados</b> (parágrafo único). Salvo exceções, é <b>empresária</b> a sociedade cujo objeto é atividade própria de empresário sujeito a registro (art. 967); as demais são <b>simples</b> (art. 982). <b>Independentemente do objeto</b>, é <b>empresária a sociedade por ações</b> e <b>simples a cooperativa</b> (parágrafo único). A sociedade empresária deve constituir-se segundo um dos tipos dos arts. 1.039 a 1.092; a simples pode adotar um desses tipos, e, se não o fizer, submete-se às suas próprias normas (art. 983), ressalvadas a conta de participação, a cooperativa e as leis especiais. A sociedade que tem por objeto <b>atividade rural</b> e se constitui como sociedade empresária pode requerer <b>inscrição no Registro Público de Empresas Mercantis</b> e, depois, fica <b>equiparada</b> à empresária (art. 984).", "<b>Personalidade jurídica (art. 985) e a distinção de tipos.</b> A sociedade <b>adquire personalidade</b> com a <b>inscrição, no registro próprio, dos seus atos constitutivos</b> (art. 985; arts. 45 e 1.150, de memória). Das <b>personificadas</b> (que têm registro): <b>sociedade simples, em nome coletivo, em comandita simples, limitada, anônima e em comandita por ações</b> (de memória a lista completa), além da cooperativa. <b>Não personificadas</b> (que não adquiriram personalidade): <b>sociedade em comum</b> (arts. 986 a 990) e <b>sociedade em conta de participação</b> (arts. 991 a 996). Duas regras de prova: na sociedade em comum, os sócios, entre si ou com terceiros, só podem <b>provar a existência por escrito</b>, mas <b>terceiros podem prová-la de qualquer modo</b> (art. 987); na conta de participação, a constituição <b>independe de formalidade</b> e prova-se por todos os meios (art. 992).", "<b>Sociedade em comum (arts. 986 a 990).</b> Enquanto <b>não inscritos os atos constitutivos</b>, a sociedade se rege pelo capítulo da sociedade em comum e, <b>subsidiariamente</b>, pelas normas da <b>sociedade simples</b> (art. 986). <b>Os bens e dívidas sociais constituem patrimônio especial</b>, do qual os sócios são <b>titulares em comum</b> (art. 988). Os bens sociais respondem pelos atos de gestão praticados por qualquer dos sócios, salvo pacto limitativo de poderes, que só tem eficácia contra o terceiro que o conheça ou deva conhecer (art. 989). <b>Todos os sócios respondem solidária e ilimitadamente</b> pelas obrigações sociais, <b>excluído do benefício de ordem</b> (art. 1.024) <b>aquele que contratou pela sociedade</b> (art. 990). Na prática: quem age sem registro assume <b>responsabilidade pessoal</b> pelas dívidas.", "<b>Sociedade em conta de participação (arts. 991 a 996).</b> A atividade constitutiva do objeto social é exercida <b>unicamente pelo sócio ostensivo</b>, em <b>nome individual e sob sua exclusiva responsabilidade</b>; os demais (<b>participantes</b>) participam dos <b>resultados</b> (art. 991). Obriga-se perante terceiro <b>tão somente o sócio ostensivo</b>, e o participante <b>só perante este</b> (parágrafo único). O contrato produz efeito <b>apenas entre os sócios</b>, e a <b>inscrição do instrumento</b> em qualquer registro <b>não confere personalidade</b> (art. 993). Sem prejuízo do direito de <b>fiscalizar</b>, o participante <b>não pode tomar parte nas relações</b> do ostensivo com terceiros, sob pena de <b>responder solidariamente</b> pelas obrigações em que intervier (art. 993, parágrafo único). A contribuição constitui, com a do ostensivo, <b>patrimônio especial</b> (art. 994, que li só no início).", "<b>Desconsideração da personalidade jurídica (CC, art. 50).</b> Em caso de <b>abuso da personalidade jurídica</b>, caracterizado por <b>desvio de finalidade</b> ou por <b>confusão patrimonial</b>, o juiz pode, <b>a requerimento da parte ou do Ministério Público</b> (quando lhe couber intervir), desconsiderá-la para que os efeitos de <b>certas e determinadas relações de obrigações</b> sejam estendidos aos <b>bens particulares de administradores ou de sócios beneficiados direta ou indiretamente pelo abuso</b>. <b>Desvio de finalidade</b> é a utilização da pessoa jurídica <b>com o propósito de lesar credores e para a prática de atos ilícitos de qualquer natureza</b> (§ 1º). <b>Confusão patrimonial</b> é a <b>ausência de separação de fato entre os patrimônios</b>, caracterizada por (I) <b>cumprimento repetitivo</b> pela sociedade de obrigações do sócio ou administrador ou vice-versa; (II) <b>transferência de ativos ou passivos sem efetivas contraprestações</b>, exceto os de valor proporcionalmente insignificante; (III) outros atos de descumprimento da autonomia patrimonial (§ 2º). A <b>desconsideração inversa</b> está no § 3º: o mesmo regime se aplica à <b>extensão das obrigações de sócios ou administradores à pessoa jurídica</b>. A <b>mera existência de grupo econômico</b> sem os requisitos <b>não autoriza</b> a desconsideração (§ 4º), e a <b>mera expansão ou alteração da finalidade original</b> da atividade econômica <b>não é desvio de finalidade</b> (§ 5º). O art. 50 (redação da Lei 13.874/2019, <b>de memória</b>) adotou a <b>teoria maior</b> (exige abuso); o <b>CDC, art. 28</b>, e a legislação ambiental adotam a <b>teoria menor</b> (basta a insolvência/obstáculo ao ressarcimento; <b>de memória</b>). O <b>incidente de desconsideração</b> é regulado nos <b>arts. 133 a 137 do CPC</b> (<b>não li</b>), e cabe em qualquer fase, com <b>suspensão do processo</b> e contraditório.", "<b>Sociedade simples: responsabilidade dos sócios (arts. 997, 1.023 a 1.027).</b> A sociedade simples se constitui por <b>contrato escrito</b>, particular ou público, que menciona (art. 997): qualificação dos sócios; <b>denominação, objeto, sede e prazo</b>; <b>capital</b> em moeda corrente (podendo compreender qualquer espécie de bens suscetíveis de avaliação); <b>quota</b> de cada sócio e modo de realizá-la; <b>prestações de serviços</b>; administradores e poderes; <b>participação nos lucros e perdas</b>; e se os sócios <b>respondem ou não subsidiariamente</b> pelas obrigações sociais. É <b>ineficaz perante terceiros</b> pacto separado contrário ao contrato (parágrafo único). O prazo para inscrever o contrato no <b>Registro Civil das Pessoas Jurídicas</b> é de <b>30 dias</b> (art. 998). <b>Responsabilidade</b>: se os bens da sociedade não cobrirem as dívidas, <b>respondem os sócios pelo saldo, na proporção em que participem das perdas</b>, salvo cláusula de responsabilidade solidária (art. 1.023). Os bens particulares dos sócios <b>só podem ser executados após os bens sociais</b> (art. 1.024, o <b>benefício de ordem</b>). O sócio que <b>entra depois</b> não se exime das dívidas anteriores (art. 1.025). O credor particular do sócio pode alcançar o que ao sócio couber <b>nos lucros</b> ou na liquidação (art. 1.026); os herdeiros do cônjuge de sócio <b>não podem exigir desde logo</b> a parte da quota (art. 1.027).", "<b>Sociedade limitada: características (arts. 1.052 a 1.059).</b> A responsabilidade de cada sócio é <b>restrita ao valor de suas quotas</b>, mas <b>todos respondem solidariamente pela integralização do capital social</b> (art. 1.052). Pode ser constituída por <b>uma ou mais pessoas</b> (§ 1º; a limitada <b>unipessoal</b> segue, no que couber, as regras do contrato social, § 2º). Rege-se, nas omissões, pelas normas da <b>sociedade simples</b>, e o contrato pode prever a <b>regência supletiva da lei das S.A.</b> (art. 1.053). O capital divide-se em <b>quotas</b>, iguais ou desiguais (art. 1.055). Pela <b>exata estimação de bens</b> conferidos ao capital respondem <b>solidariamente todos os sócios</b> até <b>5 anos</b> do registro (§ 1º). <b>É vedada contribuição que consista em prestação de serviços</b> (§ 2º). A quota é <b>indivisível</b> em relação à sociedade (art. 1.056). Na omissão do contrato, o sócio pode <b>ceder sua quota</b> a sócio sem audiência dos demais, ou a <b>estranho, se não houver oposição de titulares de mais de um quarto do capital</b> (art. 1.057); a cessão tem eficácia perante a sociedade e terceiros a partir da <b>averbação</b>. Contra o <b>sócio remisso</b>, os outros podem tomar a quota para si ou transferi-la a terceiros (art. 1.058). Os sócios devem <b>repor lucros e quantias retiradas</b> distribuídos com prejuízo do capital (art. 1.059).", "<b>Limitada: administração, deliberações e capital (arts. 1.060 a 1.084).</b> É administrada por <b>uma ou mais pessoas designadas no contrato ou em ato separado</b> (art. 1.060). A designação de <b>administrador não sócio</b> depende da aprovação de <b>no mínimo 2/3 dos sócios</b>, enquanto o capital não estiver integralizado, e de <b>titulares de quotas correspondentes a mais da metade do capital</b>, após a integralização (art. 1.061, texto vigente, conforme a página). O administrador designado em ato separado toma posse mediante <b>termo no livro de atas</b>, e a posse não assinada em <b>30 dias</b> faz a designação perder efeito (art. 1.062); <b>destituição</b> a qualquer tempo, ressalvado o sócio nomeado no contrato, que exige quórum próprio (art. 1.063, § 1º). <b>Dependem de deliberação dos sócios</b> (art. 1.071): contas, designação e destituição de administradores, remuneração, <b>modificação do contrato</b>, incorporação, fusão e dissolução, liquidantes. Quórum (art. 1.076): <b>mais da metade do capital</b> para os casos de designação, destituição, remuneração, modificação do contrato, incorporação, fusão, dissolução e outros; <b>maioria dos presentes</b> nos demais. A <b>assembleia é obrigatória</b> se os sócios forem <b>mais de dez</b> (art. 1.072, § 1º); reunião e assembleia são <b>dispensáveis</b> quando todos decidirem <b>por escrito</b> (§ 3º). <b>Quórum de instalação</b> (art. 1.074): em primeira convocação, <b>3/4 do capital</b>; em segunda, qualquer número. <b>Retirada</b> do dissidente em <b>30 dias</b> após deliberação de modificação do contrato, fusão ou incorporação (art. 1.077). <b>As deliberações que infringem o contrato ou a lei tornam ilimitada a responsabilidade dos que as aprovaram</b> (art. 1.080). <b>Aumento de capital</b>: depois de integralizadas as quotas, os sócios têm <b>preferência por 30 dias</b> (art. 1.081). <b>Redução</b>: por <b>perdas irreparáveis</b> ou se <b>excessivo</b>; no segundo caso, o credor quirografário pode se opor em <b>90 dias</b> (art. 1.084, § 1º).", "<b>Sociedade anônima: conceito e constituição (Lei 6.404/1976, arts. 1º a 3º e 80).</b> A companhia ou S.A. tem o <b>capital dividido em ações</b>, e a responsabilidade dos acionistas é <b>limitada ao preço de emissão das ações subscritas ou adquiridas</b> (art. 1º). Pode ter por objeto <b>qualquer empresa de fim lucrativo</b>, não contrário à lei, à ordem pública e aos bons costumes (art. 2º); <b>qualquer que seja o objeto, a companhia é mercantil</b> (§ 1º), e o estatuto define o objeto de modo <b>preciso e completo</b> (§ 2º). O nome é uma <b>denominação</b> com 'companhia' ou 'sociedade anônima' (art. 3º). <b>Requisitos preliminares da constituição</b> (art. 80): <b>subscrição por pelo menos 2 pessoas</b> de todas as ações; <b>entrada de pelo menos 10% do preço de emissão</b> das ações subscritas em dinheiro; <b>depósito</b> da parte realizada em dinheiro em banco autorizado (Banco do Brasil ou outro autorizado pela CVM). Aberta ou fechada conforme os valores mobiliários estejam ou não admitidos à negociação em bolsa ou balcão (art. 4º).", "<b>Direitos dos acionistas e acionista controlador (arts. 109, 116 e 117).</b> Nem o estatuto nem a assembleia podem privar o acionista dos direitos de: <b>participar dos lucros</b>; <b>participar do acervo em liquidação</b>; <b>fiscalizar a gestão</b>; <b>preferência</b> para subscrição de ações e valores conversíveis; e <b>retirar-se</b> nos casos previstos em lei (art. 109). As ações de cada classe conferem <b>iguais direitos</b> (§ 1º). <b>Acionista controlador</b> é a pessoa, natural ou jurídica, ou o grupo vinculado por acordo de voto ou sob controle comum, que (a) é titular de direitos de sócio que lhe assegurem, <b>de modo permanente, a maioria dos votos</b> nas deliberações e o <b>poder de eleger a maioria dos administradores</b>; e (b) <b>usa efetivamente</b> seu poder para <b>dirigir as atividades sociais e orientar o funcionamento dos órgãos</b> (art. 116). O poder
