Federal (ou da União em território federal); os <b>colaterais</b> que não se habilitarem até a declaração de vacância ficam excluídos (1.822). Se todos os chamados renunciarem, a herança é <b>desde logo vacante</b> (1.823). Quem não deixou cônjuge, companheiro nem parente sucessível, ou se eles renunciaram, tem a herança devolvida ao Município ou DF (1.844). Para o Município, é matéria de atuação da Procuradoria.", "<b>Petição de herança (1.824 a 1.828).</b> O herdeiro pode, em <b>ação de petição de herança</b>, demandar o reconhecimento do seu direito sucessório, para obter a restituição da herança, ou de parte dela, contra quem, na qualidade de herdeiro, ou mesmo sem título, a possua (1.824); pode abranger todos os bens, ainda se exercida por um só herdeiro (1.825); o possuidor responde pela restituição segundo a boa ou má-fé (1.826). De memória: a <b>Súmula 149 do STF</b> diz que é prescritível a petição de herança (imprescritível é a investigação de paternidade); o STJ aplica o prazo <b>decenal</b> (art. 205). O <b>herdeiro aparente</b> (1.827): são eficazes as alienações onerosas feitas a terceiro de boa-fé.", "<b>Ordem da vocação hereditária (art. 1.829, lido por inteiro).</b> A sucessão legítima defere-se: <b>(I)</b> aos <b>descendentes, em concorrência com o cônjuge sobrevivente</b>, <b>salvo</b> se casado com o falecido no regime da <b>comunhão universal</b>, ou da <b>separação obrigatória de bens</b> (art. 1.640, p.ú.), ou, na <b>comunhão parcial</b>, se o autor da herança <b>não houver deixado bens particulares</b>; <b>(II)</b> aos <b>ascendentes, em concorrência com o cônjuge</b>; <b>(III)</b> ao <b>cônjuge sobrevivente</b>; <b>(IV)</b> aos <b>colaterais</b>. <b>Art. 1.830</b>: só há direito sucessório do cônjuge se, ao tempo da morte, não estavam separados judicialmente nem separados de fato há mais de <b>dois anos</b>, salvo prova de que a convivência se tornara impossível sem culpa do sobrevivente. <b>Art. 1.831</b>: <b>direito real de habitação</b> do cônjuge sobre o imóvel residencial da família, <b>qualquer que seja o regime</b>, desde que seja o único daquela natureza a inventariar. <b>Art. 1.832</b>: em concorrência com os descendentes, o cônjuge recebe quinhão igual ao dos que sucederem por cabeça, e sua quota <b>não pode ser inferior à quarta parte</b> se for ascendente dos herdeiros com que concorrer. De memória, o repetitivo do STJ (REsp 1.368.123) entendeu que, na <b>comunhão parcial</b>, o cônjuge concorre com os descendentes <b>apenas quanto aos bens particulares</b> do falecido; e a 2ª Seção (REsp 1.382.170) admitiu a concorrência do cônjuge casado em <b>separação convencional</b>. Conferir.", "<b>Linhas, graus e classes (1.833 a 1.844).</b> Entre os descendentes, os em <b>grau mais próximo excluem os mais remotos</b>, salvo representação (1.833); os da mesma classe têm os mesmos direitos (1.834); na linha descendente, os filhos sucedem <b>por cabeça</b> e os outros descendentes por cabeça ou por estirpe (1.835). Na falta de descendentes, são chamados os <b>ascendentes</b>, em concorrência com o cônjuge; na classe dos ascendentes, o grau mais próximo exclui o mais remoto, <b>sem distinção de linhas</b> (1.836, § 1º). De memória (não li): se o cônjuge concorre com ascendente em primeiro grau, recebe <b>um terço</b>; metade se for um só ascendente ou maior o grau (1.837); na falta de descendentes e ascendentes, o cônjuge herda <b>sozinho</b> (1.838); a seguir, os <b>colaterais até o quarto grau</b> (1.839); os irmãos bilaterais herdam o <b>dobro</b> dos unilaterais (1.841). Li: não concorrendo irmão bilateral, herdam em partes iguais os unilaterais (1.842); na falta de irmãos, herdam os <b>sobrinhos</b> e, não os havendo, os <b>tios</b> (1.843); sem cônjuge, companheiro nem parente sucessível, a herança vai ao Município ou DF (1.844).", "<b>Companheiro: Tema 809 do STF (e Tema 498).</b> Li o art. 1.790 (companheiro herdava só quanto aos bens adquiridos onerosamente na união estável, em quotas diferentes), mas a tese que li no Tema 809 diz: <b>é inconstitucional a distinção de regimes sucessórios entre cônjuges e companheiros prevista no art. 1.790 do CC/2002</b>, devendo ser aplicado, tanto no casamento como na união estável, o regime do <b>art. 1.829</b>. A mesma tese foi fixada no Tema 498. Consequências comuns (a conferir): o companheiro passa a concorrer como o cônjuge; se ele é <b>herdeiro necessário</b> é questão debatida; o direito real de habitação do companheiro é reconhecido (Lei 9.278/96, art. 7º, p.ú., e jurisprudência do STJ, de memória).", "<b>Herdeiros necessários e legítima (1.845 a 1.850).</b> São herdeiros necessários os <b>descendentes, os ascendentes e o cônjuge</b> (1.845); a eles pertence, de pleno direito, <b>metade</b> dos bens da herança, a <b>legítima</b> (1.846). A legítima calcula-se sobre o valor dos bens existentes na abertura da sucessão, abatidas as dívidas e despesas do funeral, adicionando-se o valor dos bens sujeitos a colação (1.847). Salvo <b>justa causa declarada no testamento</b>, o testador <b>não pode</b> estabelecer cláusulas de <b>inalienabilidade, impenhorabilidade e incomunicabilidade</b> sobre a legítima (1.848); não pode converter os bens da legítima em outros de espécie diversa (§ 1º); com autorização judicial e justa causa, os bens gravados podem ser alienados e o produto convertido (§ 2º). O herdeiro necessário que recebe parte disponível ou legado <b>não perde a legítima</b> (1.849). Para <b>excluir os colaterais</b>, basta o testador dispor do patrimônio sem os contemplar (1.850). De memória: Súmula 49 do STF, a inalienabilidade inclui a incomunicabilidade.", "<b>Direito de representação (1.851 a 1.856).</b> Dá-se quando a lei chama certos parentes do falecido a suceder em todos os direitos em que ele sucederia se vivo fosse. Ocorre na linha reta <b>descendente</b>, <b>nunca na ascendente</b> (1.852); na linha transversal, somente em favor dos <b>filhos de irmãos</b> do falecido, quando com irmãos deste concorrerem (1.853). Os representantes herdam como tais o que o representado herdaria (1.854); o quinhão do representado parte-se igualmente (1.855). O <b>renunciante</b> à herança de uma pessoa pode representá-la na sucessão de outra (1.856).", "<b>Testamento (1.857 a 1.860).</b> Toda pessoa <b>capaz</b> pode dispor, por testamento, da totalidade ou de parte de seus bens para depois da morte; a <b>legítima</b> dos herdeiros necessários não pode ser incluída (§ 1º); são válidas as disposições de <b>caráter não patrimonial</b>, ainda que o testador somente a elas tenha se limitado (§ 2º). O testamento é <b>ato personalíssimo</b>, mudável a qualquer tempo (1.858). Extingue-se em <b>cinco anos</b> o direito de impugnar a validade do testamento, contado da data do seu registro (1.859). <b>Podem testar os maiores de dezesseis anos</b>; não podem testar os incapazes nem os que, no ato, não tiverem pleno discernimento (1.860). As formas ordinárias e especiais de testamento (público, cerrado, particular) <b>não li</b>; não as detalhei aqui.", "<b>Pagamento das dívidas (1.997 a 2.001).</b> A herança responde pelo pagamento das dívidas do falecido; mas, feita a partilha, só responde cada herdeiro <b>na proporção da parte que na herança lhe coube</b> (1.997). As despesas funerárias saem do monte (1.998). Relevância fiscal (de memória): o CTN, art. 131, responsabiliza o <b>espólio</b> pelos tributos devidos pelo de cujus até a abertura da sucessão, e o <b>sucessor</b> a qualquer título pelos devidos até a partilha, limitado ao montante do quinhão. Os legatários e credores podem exigir que o patrimônio do falecido se discrimine do do herdeiro (2.000).", "<b>Colação, sonegados e redução (1.992 a 1.996 e 2.002 a 2.012).</b> <b>Colação</b>: os <b>descendentes</b> que concorrerem à sucessão do ascendente comum devem conferir as doações recebidas, para igualar as legítimas (2.002; 2.003). O valor de colação é o <b>certo ou estimativo atribuído no ato de liberalidade</b>; se não constar, os bens são conferidos pelo que valeram <b>ao tempo da liberalidade</b> (2.004, § 1º); só o valor dos bens doados entra, não as benfeitorias (§ 2º). Ficam <b>dispensadas</b> as doações que o doador determinar que saiam da parte disponível (2.005); a dispensa pode estar em testamento ou no título da liberalidade (2.006). Doações em <b>excesso</b> ao que o doador poderia dispor são sujeitas a <b>redução</b> (2.007), com o excesso apurado pelo valor dos bens no momento da liberalidade (§ 1º). Quem <b>renunciou</b> ou foi excluído deve conferir as doações (2.008). Gastos ordinários com descendente menor e doações remuneratórias não vêm à colação (2.010; 2.011). <b>Sonegados</b>: o herdeiro que sonegar bens, não os descrevendo no inventário quando estejam em seu poder, perde o direito sobre eles (1.992, de memória); a pena só se requer e impõe em <b>ação movida por herdeiros ou credores</b> (1.994) e só se pode arguir de sonegação o inventariante depois de encerrada a descrição dos bens, com declaração de que não há outros (1.996).", "<b>Partilha (2.013 a 2.027).</b> O herdeiro pode <b>sempre requerer a partilha</b>, ainda que o testador a proíba (2.013). Se os herdeiros forem <b>capazes</b>, podem fazer <b>partilha amigável</b>, por escritura pública, termo nos autos do inventário ou escrito particular homologado pelo juiz (2.015); a partilha é <b>judicial</b> se divergirem ou se algum for incapaz (2.016). Bens indivisíveis que não caibam na meação ou no quinhão: <b>venda judicial</b> e rateio, salvo adjudicação a cônjuge ou herdeiro (2.019 e § 1º). Ficam sujeitos a <b>sobrepartilha</b> os bens sonegados e os de que se tiver ciência após a partilha (2.022). Garantia dos quinhões: os coerdeiros respondem reciprocamente pela <b>evicção</b> (2.023 a 2.026). A partilha é <b>anulável</b> pelos vícios e defeitos que invalidam os negócios jurídicos em geral (2.027; o prazo de um ano está no parágrafo único, de memória). Procedimento (de memória, não li o CPC): inventário judicial; inventário e partilha por <b>escritura pública</b> quando todos são capazes e concordes; arrolamento sumário e comum.", "<b>Resumo operacional para prova.</b> (1) <b>Saisine</b>: a herança transmite-se com a morte; lei e legitimação, as do dia da abertura; foro, o último domicílio. (2) <b>1.829</b>: descendentes (com cônjuge, salvo as três exceções), ascendentes (com cônjuge), cônjuge, colaterais. (3) <b>Tema 809</b>: cônjuge e companheiro no mesmo regime do 1.829. (4) <b>Legítima = metade</b>; colaterais não são necessários. (5) <b>Indignidade</b> (sentença, 4 anos) x <b>deserdação</b> (testamento, causa expressa, 4 anos para provar). (6) <b>Renúncia</b>: instrumento público ou termo judicial, não parcial, irretratável. (7) <b>Vacância</b>: 1 ano de editais; 5 anos da abertura para o Município. (8) <b>Colação</b>: só descendentes. (9) Testamento: 16 anos; impugnar em 5 anos."], "pega": ["Saisine: a banca diz que a herança só se transmite após o <b>inventário</b> ou a <b>partilha</b>. Pelo art. 1.784, transmite-se <b>desde logo</b>, com a abertura da sucessão (a morte).", "Companheiro: a banca mantém o <b>art. 1.790</b> (quotas diferenciadas, só bens onerosos). O STF (Tema 809) declarou inconstitucional a distinção e mandou aplicar o <b>art. 1.829</b> à união estável também.", "Legítima: a banca fala em <b>um terço</b> ou em <b>toda a herança</b> reservada. Havendo herdeiros necessários, o testador só pode dispor da <b>metade</b> (1.789; 1.846).", "Colaterais: a banca inclui os colaterais entre os <b>herdeiros necessários</b>. Necessários são <b>descendentes, ascendentes e cônjuge</b> (1.845); para excluir colaterais basta o testador não os contemplar (1.850).", "Cônjuge: a banca diz que o cônjuge sempre concorre com os descendentes. Há <b>exceções</b> do art. 1.829, I: comunhão universal, separação obrigatória e comunhão parcial sem bens particulares.", "Indignidade e deserdação: a banca troca. <b>Indignidade</b> vale para qualquer sucessão, é declarada por <b>sentença</b>, em ação que se extingue em <b>4 anos</b> da abertura. <b>Deserdação</b> só atinge herdeiro <b>necessário</b>, só se faz por <b>testamento</b> com causa expressa.", "Renúncia: a banca admite renúncia <b>tácita</b>, <b>parcial</b> ou sob condição, ou diz que é retratável. Só vale por <b>instrumento público ou termo judicial</b> e não pode ser parcial, condicional ou a termo (1.806; 1.808).", "Representação: a banca admite representação na linha <b>ascendente</b>. Só há na linha reta <b>descendente</b> e, na colateral, para <b>filhos de irmãos</b> (1.852; 1.853).", "Herança vacante: a banca diz que os bens passam ao Município <b>imediatamente</b> após a morte. É preciso arrecadação, editais, vacância (após 1 ano) e, em regra, 5 anos da abertura (1.822); renúncia de todos torna a herança desde logo vacante (1.823).", "Colação: a banca estende a colação a <b>todos os herdeiros</b>. Os obrigados são os <b>descendentes</b> que concorrerem (2.002).", "Cessão: a banca valida a cessão de <b>bem singular</b> da herança antes da partilha. É <b>ineficaz</b> (1.793, § 2º), e a disposição sem autorização do juiz também (§ 3º).", "Testamento: a banca exige <b>18 anos</b> para testar. Podem testar os maiores de <b>16</b> (1.860, p.ú.); o direito de impugnar a validade extingue-se em <b>5 anos</b> (1.859)."]}, {"materia": "DIREITO URBANÍSTICO E AMBIENTAL", "titulo": "Teoria geral e fundamentos: conceito, objeto, autonomia e princípios do Direito Urbanístico; função social da cidade e da propriedade urbana; direito à cidade e à moradia", "key": "URB", "nome": "Urbanístico", "conc": ["Edital: item 1 de Direito Urbanístico e Ambiental (primeira matéria nova; ela entra no lugar de Tributário). Li <b>literalmente</b>, no navegador (Planalto): <b>CF, art. 6º</b> (com a redação da EC 26/2000), <b>art. 21, XX</b>, <b>art. 24, I</b>, <b>art. 30, VIII</b>, <b>arts. 182 e 183</b>; <b>Lei 10.257/2001 (Estatuto da Cidade): art. 2º (caput e incisos I a VI, em parte), art. 39, art. 40 e início do art. 41</b>. Li, na página do tema, a tese do <b>Tema 348 do STF</b>. <b>Não li</b> o art. 1º do Estatuto, os incisos VII a XX do art. 2º, os arts. 41 em diante nem a legislação de Curitiba (outro item do edital). Súmulas, conceitos e autores (como José Afonso da Silva) vêm <b>da minha memória e da doutrina</b>; não foram conferidos.", "<b>Conceito, objeto e autonomia (doutrina).</b> <b>Direito Urbanístico</b> é o ramo do direito público que reúne normas e princípios voltados à <b>ordenação dos espaços habitáveis</b> (a cidade e seu planejamento), à disciplina do uso e ocupação do solo, da edificação, do parcelamento e da execução de políticas urbanas. Distingue-se do <b>Urbanismo</b> (ciência e técnica de organizar a cidade). <b>Autonomia</b>: a doutrina majoritária a reconhece, e a CF, ao falar em <b>direito urbanístico</b> no art. 24, I (competência legislativa concorrente), o trata como ramo próprio. O Estatuto da Cidade fixa <b>normas de ordem pública e interesse social</b> (art. 1º, parágrafo único, de memória, não li).", "<b>Competências (CF).</b> A <b>União</b> tem competência material para instituir <b>diretrizes para o desenvolvimento urbano</b>, inclusive habitação, saneamento básico e transportes urbanos (art. 21, XX). Legislar sobre <b>direito urbanístico</b> é competência <b>concorrente</b> entre União, Estados e DF (art. 24, I); à União cabem as <b>normas gerais</b> (§ 1º, de memória). Ao <b>Município</b> compete promover, no que couber, o <b>adequado ordenamento territorial</b>, mediante <b>planejamento e controle do uso, do parcelamento e da ocupação do solo urbano</b> (art. 30, VIII), além de legislar sobre assuntos de interesse local e suplementar (art. 30, I e II, de memória). O art. 182 reforça: a política de desenvolvimento urbano é <b>executada pelo Poder Público municipal</b>, conforme <b>diretrizes gerais fixadas em lei</b> (federal).", "<b>Objetivo constitucional (CF, art. 182, caput).</b> A política de desenvolvimento urbano tem por objetivo <b>ordenar o pleno desenvolvimento das funções sociais da cidade</b> e <b>garantir o bem-estar de seus habitantes</b>. O Estatuto da Cidade, art. 2º, caput, acrescenta a ordenação do pleno desenvolvimento das funções sociais da cidade <b>e da propriedade urbana</b>, mediante diretrizes gerais. Aqui nasce a ligação entre <b>função social da cidade</b> (visão coletiva: moradia, circulação, trabalho, lazer, ambiente) e <b>função social da propriedade urbana</b> (visão individual).", "<b>Plano diretor.</b> CF, art. 182, § 1º: o plano diretor, <b>aprovado pela Câmara Municipal</b>, <b>obrigatório para cidades com mais de vinte mil habitantes</b>, é o <b>instrumento básico</b> da política de desenvolvimento e de expansão urbana. Estatuto, art. 40: é <b>aprovado por lei municipal</b>; integra o processo de planejamento municipal, devendo o PPA, a LDO e a LOA <b>incorporar suas diretrizes e prioridades</b> (§ 1º); engloba o <b>território do Município como um todo</b> (§ 2º); a lei deve ser <b>revista, pelo menos, a cada dez anos</b> (§ 3º); na elaboração e fiscalização, Legislativo e Executivo garantem <b>audiências públicas</b>, <b>publicidade</b> e <b>acesso</b> aos documentos (§ 4º). Art. 41: é obrigatório para cidades com mais de 20 mil habitantes e para as <b>integrantes de regiões metropolitanas e aglomerações urbanas</b> (e nos demais casos do artigo, que li só em parte).", "<b>Tema 348 (STF): o plano diretor e as leis municipais específicas.</b> Controvérsia (lida): leis que criam programas e projetos urbanos <b>de forma isolada e desvinculada do plano diretor</b> (no caso, lei distrital sobre condomínios fechados). Tese oficial (lida, em trechos): os <b>municípios com mais de vinte mil habitantes e o Distrito Federal podem legislar sobre programas e projetos específicos de ordenamento do espaço urbano</b> por meio de leis que sejam <b>compatíveis com as diretrizes fixadas no plano diretor</b>. Ou seja: o plano diretor é o instrumento básico, mas <b>não</b> impede leis específicas desde que <b>compatíveis</b> com ele.", "<b>Função social da propriedade urbana (CF, art. 182, § 2º; Estatuto, art. 39).</b> A propriedade urbana cumpre sua função social quando <b>atende às exigências fundamentais de ordenação da cidade expressas no plano diretor</b>. O Estatuto, art. 39, acrescenta que isso <b>assegura o atendimento das necessidades dos cidadãos</b> quanto à <b>qualidade de vida, à justiça social e ao desenvolvimento das atividades econômicas</b>, respeitadas as diretrizes do art. 2º. Em suma: o conteúdo da função social urbana é <b>definido pelo plano diretor</b>, não por conceito abstrato.", "<b>Sanções para o imóvel que não cumpre a função social (CF, art. 182, § 4º).</b> Mediante <b>lei municipal específica</b> para <b>área incluída no plano diretor</b>, e nos termos da <b>lei federal</b> (o Estatuto), o Poder Público municipal pode exigir do proprietário de solo urbano <b>não edificado, subutilizado ou não utilizado</b> que promova seu adequado aproveitamento, sob pena, <b>sucessivamente</b>, de: <b>I</b> parcelamento ou edificação <b>compulsórios</b> (PEUC); <b>II</b> <b>IPTU progressivo no tempo</b>; <b>III</b> <b>desapropriação com pagamento em títulos da dívida pública</b>, de emissão previamente aprovada pelo <b>Senado Federal</b>, com <b>prazo de resgate de até dez anos</b>, em parcelas anuais, iguais e sucessivas, assegurados o <b>valor real</b> da indenização e os juros legais. Já a desapropriação <b>ordinária</b> de imóveis urbanos exige <b>prévia e justa indenização em dinheiro</b> (art. 182, § 3º).", "<b>Direito à cidade (Estatuto, art. 2º, I a VI).</b> O Estatuto não usa a expressão sozinha: define como primeira diretriz a <b>garantia do direito a cidades sustentáveis</b>, entendido como o direito à <b>terra urbana, à moradia, ao saneamento ambiental, à infraestrutura urbana, ao transporte e aos serviços públicos, ao trabalho e ao lazer</b>, para as <b>presentes e futuras gerações</b> (I). Seguem: <b>gestão democrática</b> por participação da população e de associações representativas na formulação, execução e acompanhamento de planos, programas e projetos (II); <b>cooperação</b> entre governos, iniciativa privada e demais setores (III); <b>planejamento</b> do desenvolvimento das cidades e da distribuição espacial da população e das atividades econômicas, para evitar e corrigir as distorções do crescimento urbano (IV); <b>oferta</b> de equipamentos urbanos e comunitários, transporte e serviços (V); e <b>ordenação e controle do uso do solo</b>, para evitar, entre outros, a utilização inadequada dos imóveis, a proximidade de usos incompatíveis, o parcelamento ou a edificação excessivos em relação à infraestrutura, polos geradores de tráfego sem infraestrutura, a <b>retenção especulativa</b> de imóvel urbano e a deterioração de áreas urbanizadas (VI, alíneas a a f).", "<b>Direito à moradia e usucapião especial urbana.</b> A <b>moradia</b> foi incluída entre os <b>direitos sociais</b> do art. 6º pela <b>EC 26/2000</b> (o trecho que li, com a redação da EC 26/2000, lista educação, saúde, trabalho, <b>moradia</b>, lazer, segurança, previdência social etc.; o texto vigente também traz alimentação e transporte, por emendas posteriores, de memória). O art. 183 cria a <b>usucapião especial urbana</b>: quem possuir como sua <b>área urbana de até 250 m²</b>, por <b>cinco anos ininterruptos e sem oposição</b>, utilizando-a para <b>moradia sua ou de sua família</b>, adquire o domínio, <b>desde que não seja proprietário de outro imóvel urbano ou rural</b>. O título é conferido ao homem ou à mulher, ou a ambos, <b>independentemente do estado civil</b> (§ 1º); o direito <b>não é reconhecido mais de uma vez</b> ao mesmo possuidor (§ 2º); <b>imóveis públicos não são usucapíveis</b> (§ 3º).", "<b>Princípios do Direito Urbanístico (doutrina; conferir).</b> Função social da propriedade e da cidade; <b>planejamento</b>; <b>gestão democrática</b> (participação popular); <b>sustentabilidade urbana</b>; <b>cooperação</b> entre os entes e com a sociedade; <b>justa distribuição dos benefícios e ônus do processo de urbanização</b> e <b>recuperação, pelo Poder Público, da valorização imobiliária</b> decorrente de obras públicas (essas duas últimas constam do art. 2º do Estatuto, incisos que <b>não li</b>); legalidade e proporcionalidade no controle do uso do solo. Uma banca de procurador costuma cobrar a relação entre <b>plano diretor</b>, <b>função social</b> e <b>sanções sucessivas</b>.", "<b>Ponte com o Tributário (de memória).</b> O <b>IPTU progressivo no tempo</b> (art. 182, § 4º, II) é <b>sanção urbanística</b>, diferente da progressividade <b>fiscal</b> do IPTU (art. 156, § 1º). A <b>Súmula 668 do STF</b> declara inconstitucional a lei municipal anterior à EC 29/2000 que estabeleceu alíquotas progressivas para o IPTU, salvo se destinada a assegurar o cumprimento da função social da propriedade urbana. Já o IPTU progressivo do art. 182 exige <b>plano diretor</b>, <b>lei específica</b> e a <b>sequência</b> PEUC, IPTU progressivo, desapropriação.", "<b>Resumo operacional para prova.</b> (1) O <b>Município</b> executa a política urbana (CF, art. 182), a <b>União</b> fixa diretrizes gerais (art. 21, XX; Estatuto) e o direito urbanístico é de <b>competência concorrente</b> (art. 24, I). (2) <b>Plano diretor</b>: lei municipal, obrigatório com mais de 20 mil habitantes, revisão a cada 10 anos. (3) <b>Função social urbana</b> = exigências do plano diretor. (4) Sanções <b>sucessivas</b>: PEUC, IPTU progressivo, desapropriação com títulos (Senado, 10 anos). (5) <b>Direito à cidade</b> = cidades sustentáveis (terra, moradia, saneamento, infraestrutura, transporte, trabalho, lazer). (6) <b>Usucapião urbana</b>: 250 m², 5 anos, uma vez, não proprietário. (7) <b>Tema 348</b>: leis específicas só se <b>compatíveis</b> com o plano diretor."], "pega": ["Plano diretor: a banca diz que ele é instituído por <b>decreto do Prefeito</b>. É aprovado pela <b>Câmara Municipal</b>, por <b>lei</b> municipal (CF, art. 182, § 1º; Estatuto, art. 40).", "Obrigatoriedade: a banca fala em plano diretor obrigatório para cidades com mais de <b>cinquenta mil</b> habitantes (ou cem mil). O número é <b>vinte mil</b>, além das cidades de regiões metropolitanas e aglomerações urbanas.", "Revisão: a banca diz que a lei do plano diretor deve ser revista a cada <b>cinco anos</b>. O Estatuto, art. 40, § 3º, fixa <b>pelo menos a cada dez anos</b>.", "Sanções: a banca apresenta PEUC, IPTU progressivo e desapropriação como medidas <b>alternativas</b>, à escolha do Município. O texto constitucional diz <b>sucessivamente</b>, e exige <b>lei específica</b> para área incluída no plano diretor.", "Desapropriação-sanção: a banca afirma que a indenização é <b>prévia, justa e em dinheiro</b>. Na desapropriação do art. 182, § 4º, III, o pagamento é em <b>títulos da dívida pública</b> aprovados pelo <b>Senado</b>, resgate em até <b>dez anos</b>; a <b>em dinheiro</b> é a desapropriação ordinária (§ 3º).", "Função social: a banca afirma que a propriedade urbana cumpre função social <b>por si só</b>, independentemente do plano diretor. O § 2º do art. 182 liga o cumprimento às <b>exigências do plano diretor</b>.", "Competência: a banca diz que só a <b>União</b> legisla sobre direito urbanístico, ou só o <b>Município</b>. A competência legislativa é <b>concorrente</b> (União, Estados, DF; art. 24, I), e o Município ordena o uso e a ocupação do solo (art. 30, VIII).", "Usucapião especial urbana: a banca altera a área (<b>300 m²</b>), o prazo (<b>10 anos</b>) ou admite quem tenha outro imóvel, ou imóvel <b>público</b>. São <b>250 m²</b>, <b>5 anos</b>, não proprietário de outro imóvel urbano <b>ou rural</b>, só <b>uma vez</b>; imóveis públicos não são usucapíveis.", "Direito à cidade: a banca o reduz a <b>moradia</b>. O Estatuto (art. 2º, I) fala em cidades sustentáveis: terra urbana, moradia, saneamento ambiental, infraestrutura, transporte e serviços públicos, trabalho e lazer, para as <b>presentes e futuras gerações</b>.", "Tema 348: a banca diz que o município <b>não pode</b> legislar sobre projetos urbanos específicos fora do plano diretor, ou que pode <b>livremente</b>. O STF admite, <b>desde que compatíveis</b> com as diretrizes do plano diretor."]}, {"materia": "DIREITO EMPRESARIAL", "titulo": "Fundamentos: teoria da empresa, empresário, capacidade e impedimentos, registro, estabelecimento, aviamento, trespasse, nome empresarial, prepostos e escrituração", "key": "EMP", "nome": "Empresarial", "conc": ["Edital: item 1 de Direito Empresarial (segunda matéria nova; ela entra no lugar de Processo Civil). Li <b>literalmente</b>, no navegador (Planalto, CC compilado): <b>arts. 966 a 984</b> e <b>arts. 1.142 a 1.171</b> (<b>com trechos truncados</b> no fim de várias linhas). <b>Não li</b> os arts. 1.172 a 1.195 (gerentes, contabilistas, escrituração), a Lei 8.934/1994 (registro de empresas), a Lei 14.195/2021, a Lei 14.382/2022, o CTN nem a legislação de Curitiba. Súmulas, a história do direito comercial e o que marco como memória <b>não foram conferidos</b>.", "<b>Evolução e autonomia (doutrina).</b> (1) <b>Corporações de ofício</b> (direito do comerciante, subjetivo); (2) <b>teoria dos atos de comércio</b> (Código Napoleônico, 1807; Código Comercial brasileiro de 1850): direito comercial define-se pelos atos praticados; (3) <b>teoria da empresa</b> (Código Civil italiano, 1942; CC brasileiro de 2002): o centro é a <b>atividade econômica organizada</b>. O CC/2002 <b>unificou</b> o direito das obrigações civis e empresariais (Livro II, <b>Do Direito de Empresa</b>), mas o direito empresarial segue autônomo na doutrina. Fontes: CC, leis especiais (Lei 6.404/76, Lei 11.101/2005, Lei 8.934/94), usos e costumes, doutrina e jurisprudência.", "<b>Empresário (art. 966).</b> Considera-se empresário quem exerce <b>profissionalmente</b> atividade <b>econômica organizada</b> para a <b>produção ou a circulação de bens ou de serviços</b>. Elementos: <b>profissionalismo</b> (habitualidade, pessoalidade e conhecimento dos produtos), <b>atividade econômica</b> (fim lucrativo), <b>organização</b> (reunião de capital, trabalho, insumos e tecnologia) e <b>produção ou circulação</b>. O parágrafo único exclui quem exerce <b>profissão intelectual, de natureza científica, literária ou artística</b>, ainda que com auxiliares ou colaboradores, <b>salvo se o exercício da profissão constituir elemento de empresa</b> (parte final de memória, o texto que li foi truncado). O <b>empresário rural</b> pode requerer inscrição no Registro de Empresas e, se o fizer, fica equiparado ao empresário comum (art. 971).", "<b>Registro (arts. 967 a 970).</b> É <b>obrigatória</b> a inscrição do empresário no <b>Registro Público de Empresas Mercantis</b> da respectiva sede (Junta Comercial), <b>antes do início da atividade</b> (967). O requerimento contém: <b>nome, nacionalidade, domicílio, estado civil e regime de bens</b> (se casado); a <b>firma</b>, com assinatura autógrafa; o <b>capital</b>; o <b>objeto e a sede</b> (968). As modificações são averbadas à margem da inscrição (968, § 2º); o empresário individual que admitir sócios pode solicitar a <b>transformação</b> do registro em sociedade (§ 3º); o processo do <b>MEI</b> segue lei complementar (§ 4º). Quem institui <b>sucursal, filial ou agência</b> em lugar sujeito a outro Registro deve inscrevê-la ali, com prova da inscrição originária, e <b>averbar</b> a constituição do estabelecimento secundário na sede (969). A lei assegura <b>tratamento favorecido, diferenciado e simplificado</b> ao empresário rural e ao pequeno empresário (970). Efeito do registro (1.154): o ato sujeito a registro <b>não pode ser oposto a terceiros</b> antes do cumprimento das formalidades; cumpridas, o terceiro <b>não pode alegar ignorância</b>.", "<b>Capacidade e impedimentos (arts. 972 a 976).</b> Podem exercer a atividade de empresário os que estiverem <b>em pleno gozo da capacidade civil</b> e <b>não forem legalmente impedidos</b> (972). A pessoa <b>legalmente impedida</b> que exercer a atividade <b>responde pelas obrigações contraídas</b> (973). O <b>incapaz</b>, por meio de representante ou devidamente assistido, pode <b>continuar</b> a empresa antes exercida por ele enquanto capaz, por seus pais ou pelo autor de herança (974): precede <b>autorização judicial</b>, após exame das circunstâncias e dos riscos da empresa (§ 1º); <b>não ficam sujeitos ao resultado da empresa os bens</b> que o incapaz já possuía ao tempo da sucessão ou da interdição, estranhos ao acervo daquela (§ 2º). No registro de sociedade com sócio incapaz exige-se: ele <b>não administra</b>; o capital deve estar <b>totalmente integralizado</b>; o relativamente incapaz é assistido e o absolutamente incapaz, representado (§ 3º). Impedimentos <b>legais</b> típicos (de memória): magistrados, membros do Ministério Público, militares da ativa, <b>servidores públicos</b> (vedada a participação em gerência ou administração de empresa privada, Lei 8.112/90, art. 117, X, sem proibir ser sócio cotista) e <b>falidos não reabilitados</b>.", "<b>Casados e empresa (arts. 977 a 980).</b> Os <b>cônjuges</b> podem contratar sociedade entre si ou com terceiros, <b>desde que não casados</b> no regime da <b>comunhão universal de bens</b> ou no da <b>separação obrigatória</b> (977). O empresário casado pode, <b>sem outorga conjugal</b>, qualquer que seja o regime, <b>alienar os imóveis</b> que integrem o patrimônio da empresa ou gravá-los de ônus real (978). Os pactos e declarações de regime de bens e as doações e outros atos relativos devem ser <b>arquivados e averbados</b> no Registro de Empresas (979). <b>EIRELI</b>: o art. 980-A <b>aparece sem texto</b> na compilação que li (revogado pela Lei 14.382/2022, de memória), e a <b>sociedade limitada unipessoal</b> passou a ser prevista no art. 1.052, § 1º; as EIRELI existentes foram transformadas em SLU.", "<b>Sociedade empresária e simples (arts. 981 a 984).</b> Celebram contrato de sociedade as pessoas que <b>reciprocamente se obrigam a contribuir, com bens ou serviços</b>, para o exercício de atividade econômica e a <b>partilha, entre si, dos resultados</b> (981, parte final de memória); a atividade pode restringir-se a um ou mais negócios determinados (p.ú.). Salvo exceções, é <b>empresária</b> a sociedade que tem por objeto o exercício de atividade própria de empresário sujeito a registro (art. 967); e <b>simples</b>, as demais (982). <b>Independentemente do objeto</b>, é empresária a <b>sociedade por ações</b> e simples a <b>cooperativa</b> (982, p.ú.). A sociedade empresária deve adotar um dos <b>tipos</b> dos arts. 1.039 a 1.092; a simples pode constituir-se segundo um desses tipos (983). A sociedade que exerça atividade <b>rural</b> e constituída segundo um tipo pode requerer inscrição no Registro de Empresas, ficando equiparada à empresária (984). Estudo detalhado dos tipos fica para o item 2 do edital.", "<b>Estabelecimento empresarial (arts. 1.142 e 1.143).</b> É todo <b>complexo de bens organizado</b>, para o exercício da empresa, por empresário ou sociedade empresária (1.142). Redação lida: o estabelecimento <b>não se confunde com o local</b> onde se exerce a atividade, que pode ser <b>físico ou virtual</b> (§ 1º); no <b>local virtual</b>, o endereço informado para fins de registro pode ser o do empresário ou de um dos sócios (§ 2º); no <b>local físico</b>, a fixação do horário de funcionamento compete ao <b>Município</b> (§ 3º; texto truncado). Natureza (doutrina): <b>universalidade de fato</b>. Pode ser <b>objeto unitário</b> de direitos e de negócios jurídicos, translativos ou constitutivos, que sejam compatíveis com sua natureza (1.143). <b>Aviamento</b> (doutrina): atributo do estabelecimento, a aptidão de gerar lucros, o <b>sobrevalor</b> do conjunto organizado; <b>clientela</b> e <b>ponto</b> são elementos ligados a ele, e a proteção do ponto comercial é tema de outra unidade (Lei 8.245/1991, locações).", "<b>Trespasse (arts. 1.144 a 1.149).</b> O contrato que tenha por objeto a <b>alienação, o usufruto ou o arrendamento</b> do estabelecimento só produz efeitos quanto a terceiros depois de <b>averbado</b> à margem da inscrição do empresário (ou da sociedade) no Registro de Empresas e <b>publicado</b> na imprensa oficial (1.144; fim do artigo de memória). Se ao alienante <b>não restarem bens suficientes</b> para solver o passivo, a eficácia da alienação depende do <b>pagamento de todos os credores</b> ou do <b>consentimento expresso ou tácito</b> destes, em <b>trinta dias</b> a partir da notificação (1.145; detalhes de memória). O adquirente responde pelos débitos anteriores à transferência, <b>desde que regularmente contabilizados</b> (1.146); o devedor primitivo continua <b>solidariamente obrigado por um ano</b> (parte final de memória). <b>Não concorrência</b>: não havendo autorização expressa, o alienante <b>não pode fazer concorrência</b> ao adquirente nos <b>cinco anos</b> subsequentes à transferência (1.147, prazo de memória); no usufruto ou arrendamento, a proibição persiste durante o contrato (p.ú.). Há <b>sub-rogação</b> do adquirente nos contratos estipulados para exploração do estabelecimento, salvo os de caráter pessoal (1.148); a cessão de créditos produz efeito em relação aos devedores desde a publicação da transferência (1.149). Para a Fazenda (CTN, art. 133, de memória): o adquirente responde pelos tributos do fundo de comércio, integralmente se o alienante cessar a exploração, subsidiariamente se continuar ou retomar em seis meses.", "<b>Nome empresarial (arts. 1.155 a 1.168).</b> É a <b>firma ou a denominação</b> adotada para o exercício da empresa (1.155); a denominação das sociedades simples, associações e fundações se equipara para fins de proteção (p.ú.). O <b>empresário individual</b> opera sob <b>firma</b> formada por seu nome, completo ou abreviado (1.156). A sociedade com sócios de responsabilidade ilimitada opera sob firma (1.157). A <b>limitada</b> pode adotar firma ou denominação, com a palavra final <b>limitada</b> ou sua abreviatura; a <b>omissão</b> da palavra torna <b>solidária e ilimitada</b> a responsabilidade dos <b>administradores</b> que assim empregarem a firma ou denominação (1.158, § 3º). A <b>cooperativa</b> usa denominação com o vocábulo <b>cooperativa</b> (1.159); a <b>S/A</b>, denominação com <b>sociedade anônima</b> ou <b>companhia</b> (1.160). A <b>sociedade em conta de participação não pode ter firma ou denominação</b> (1.162). O nome deve <b>distinguir-se</b> de outro já inscrito no mesmo registro (1.163). <b>Não pode ser objeto de alienação</b>, mas o adquirente do estabelecimento, se o contrato permitir, pode usar o nome do alienante precedido do seu, com a qualificação de <b>sucessor</b> (1.164). O nome do sócio que <b>falecer, for excluído ou se retirar</b> não pode ser mantido na firma (1.165). A inscrição assegura o <b>uso exclusivo</b> no âmbito do <b>Estado</b>; se registrado nos termos da lei especial, em todo o <b>território nacional</b> (1.166). Pode-se anular a qualquer tempo a inscrição feita em violação à lei (1.167) e cancelá-la quando cessar o exercício da atividade (1.168). <b>Marca</b> é outro instituto (INPI, Lei 9.279/96), tratado no item 5.", "<b>Prepostos (arts. 1.169 e 1.170; início do 1.171).</b> O preposto <b>não pode, sem autorização escrita, fazer-se substituir</b> no desempenho da preposição, sob pena de responder pessoalmente pelos atos do substituto e pelas obrigações por ele contraídas (1.169, redação lida em parte). Salvo autorização expressa, o preposto <b>não pode negociar por conta própria ou de terceiro</b>, nem participar, ainda que indiretamente, de operação do mesmo gênero da que lhe foi cometida, sob pena de responder por <b>perdas e danos</b> e de serem retidos pelo preponente os lucros da operação (1.170). Gerentes e contabilistas (arts. 1.172 a 1.178) <b>não li</b>; de memória, o gerente é preposto permanente no exercício da empresa, na sede ou em sucursal, filial ou agência.", "<b>Escrituração (arts. 1.179 a 1.195; não li).</b> De memória e para revisar: o empresário e a sociedade empresária são obrigados a seguir <b>sistema de contabilidade</b> e levantar anualmente <b>balanço patrimonial e de resultado econômico</b> (1.179); o <b>Livro Diário</b> é obrigatório (1.180); o <b>pequeno empresário</b> é dispensado desses deveres (1.179, § 2º). Sigilo: a autoridade só pode determinar <b>exibição integral</b> em casos de sucessão, comunhão ou sociedade, administração à conta de outrem e falência (1.191, de memória); a <b>Súmula 439 do STF</b> permite o exame de livros pela fiscalização tributária limitado aos pontos da investigação; a <b>Súmula 390 do STF</b> trata do acesso do sócio de S/A. Confira o texto antes de usar em prova.", "<b>Resumo operacional para prova.</b> (1) <b>Teoria da empresa</b>: atividade econômica organizada; profissão intelectual não é empresa, <b>salvo elemento de empresa</b>. (2) <b>Registro</b> obrigatório <b>antes</b> do início; rural, <b>facultativo</b>. (3) <b>Capacidade</b>: plena e sem impedimento; incapaz só <b>continua</b> empresa, com autorização judicial. (4) <b>Cônjuges</b> não contratam sociedade em comunhão universal ou separação obrigatória; imóvel da empresa dispensa outorga. (5) <b>Estabelecimento</b> = complexo de bens, físico ou virtual; trespasse com <b>averbação e publicação</b>, <b>não concorrência</b>. (6) <b>Nome</b>: inalienável; omissão de limitada = responsabilidade ilimitada dos administradores; conta de participação sem firma. (7) <b>EIRELI</b> deixou de existir."], "pega": ["Atividade intelectual: a banca diz que o <b>médico, o advogado ou o artista</b> são sempre empresários por exercerem atividade econômica. O art. 966, p.ú., os exclui, <b>salvo se o exercício da profissão constituir elemento de empresa</b>.", "Registro: a banca afirma que o empresário só existe <b>depois do registro</b>. O art. 967 impõe a inscrição <b>antes do início</b> da atividade, mas quem exerce empresa sem registro é empresário <b>irregular</b>; o registro não cria a qualidade. Para o <b>rural</b> é <b>facultativo</b> (art. 971).", "Sociedades: a banca fala em S/A <b>simples</b> ou em cooperativa <b>empresária</b>. Independentemente do objeto, a <b>sociedade por ações</b> é <b>empresária</b> e a <b>cooperativa</b> é <b>simples</b> (art. 982, p.ú.).", "Incapaz: a banca diz que o incapaz <b>não pode ser empresário em nenhuma hipótese</b>, ou que pode iniciar empresa livremente. Pode <b>continuar</b> a empresa que já exercia ou que herdou, por representante ou assistido, <b>mediante autorização judicial</b> (art. 974), e preserva os bens anteriores.", "Cônjuges: a banca permite sociedade entre cônjuges em <b>qualquer regime</b>. Não podem contratar sociedade entre si ou com terceiros os casados em <b>comunhão universal</b> ou <b>separação obrigatória</b> (art. 977).", "Outorga conjugal: a banca exige a outorga para o empresário casado vender imóvel <b>da empresa</b>. O art. 978 <b>dispensa</b> a outorga, <b>qualquer que seja o regime</b>.", "Estabelecimento: a banca o iguala ao <b>local físico</b>. O estabelecimento é o <b>complexo de bens organizado</b> e <b>não se confunde</b> com o local, que pode ser físico ou virtual (art. 1.142, § 1º).", "Trespasse: a banca diz que o adquirente responde por <b>todos</b> os débitos do alienante, ou nenhum, e que o alienante pode concorrer livremente. O adquirente responde pelos débitos <b>regularmente contabilizados</b> (art. 1.146); o alienante <b>não pode concorrer</b> por cinco anos sem autorização (art. 1.147); para terceiros, só vale após <b>averbação e publicação</b> (art. 1.144).", "Nome empresarial: a banca afirma que o nome pode ser <b>vendido</b> junto com a empresa. É <b>inalienável</b> (art. 1.164); o adquirente do estabelecimento só pode usá-lo precedido do seu, como <b>sucessor</b>, se o contrato permitir. A <b>conta de participação</b> não tem firma nem denominação (art. 1.162).", "Limitada: a banca diz que a omissão da palavra <b>limitada</b> não gera efeito. Gera a responsabilidade <b>solidária e ilimitada dos administradores</b> que assim empregarem a firma ou denominação (art. 1.158, § 3º).", "EIRELI: a banca a trata como espécie vigente do art. 980-A. O dispositivo <b>não tem mais texto</b> (Lei 14.382/2022); a empresa de sócio único hoje é <b>sociedade limitada unipessoal</b>."]}], "25": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Improbidade administrativa (Lei 8.429/1992, com a Lei 14.230/2021): sujeitos, atos de improbidade (arts. 9º, 10 e 11) e sanções", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 15 de Direito Administrativo (parte de sujeitos, atos e sanções; processo, ANPC e prescrição ficam para a unidade 28). Li <b>literalmente</b>, no navegador (Planalto, texto compilado): <b>Lei 8.429/1992, arts. 1º a 8º-A, 9º, 10, 10-A (marcado como revogado), 11, 12, 21, 23 e partes dos arts. 17 e 17-B</b>. A página mostra, lado a lado, a redação antiga e a nova (Lei 14.230/2021); resumi só a <b>redação vigente</b>. <b>Não li</b> os arts. 13 a 16, 18 a 20 e 22, nem o restante do art. 17. As teses do STF (Tema 1.199, ADIs 7042/7043 e 7236) vêm <b>da minha memória</b> e precisam de conferência. Esta unidade não traz questões de prova novas do banco; o treino fica no app.", "<b>Visão geral e o que mudou em 2021.</b> A Lei 14.230/2021 reescreveu a Lei de Improbidade. Quatro ideias dominam a prova: (1) improbidade exige <b>dolo</b>, <b>não há mais modalidade culposa</b>; (2) o rol do art. 11 (princípios) passou a ser <b>taxativo</b>; (3) a ação é de <b>natureza sancionadora</b>, com garantias próprias do direito sancionador; (4) as sanções foram reorganizadas, e o <b>art. 10-A</b> (benefício tributário irregular de ISS, que veio da LC 157/2016) foi <b>revogado</b>. A página do Planalto marca expressamente o art. 10-A como <b>Revogado pela Lei nº 14.230, de 2021</b>.", "<b>Dolo e erro (art. 1º, §§ 1º a 3º; art. 17-C, § 3º, de memória).</b> Consideram-se atos de improbidade as condutas <b>dolosas</b> tipificadas nos arts. 9º, 10 e 11 e em leis especiais. Dolo é a <b>vontade livre e consciente</b> de alcançar o resultado ilícito; <b>não basta a voluntariedade</b> do agente, e a mera <b>culpa</b>, a <b>divergência interpretativa da lei</b> (se baseada em jurisprudência, ainda que não pacificada, mesmo que não seja a melhor) e o <b>exercício da função sem dolo</b> não configuram improbidade. Em suma: <b>ilegalidade ou erro de gestão não é, por si só, improbidade</b>; é preciso <b>dolo específico</b> e um fim ilícito (proveito indevido, nos termos do art. 11, §§ 1º e 2º, abaixo).", "<b>Sujeitos passivos (art. 1º, §§ 5º a 7º; de memória nos pormenores).</b> São as <b>entidades da administração direta, indireta ou fundacional</b> de qualquer dos Poderes da União, dos Estados, do DF, dos Municípios e de Território; também as <b>empresas incorporadas ao patrimônio público</b> e as entidades para cuja criação ou custeio o erário haja concorrido. A lei distingue: (a) entidades que recebem <b>subvenção, benefício ou incentivo</b> do poder público, e entidades para cuja criação ou custeio o erário concorra <b>com menos de 50% do patrimônio ou da receita</b> (sanção patrimonial limitada à <b>repercussão sobre a contribuição dos cofres públicos</b>); (b) <b>partidos políticos</b>, cuja responsabilização por improbidade passou a seguir a Lei 9.096/1995 e o art. 23-C (que li) e <b>não</b> mais a Lei de Improbidade em si.", "<b>Sujeitos ativos (arts. 2º e 3º).</b> <b>Agente público</b> é quem exerce, ainda que <b>transitoriamente ou sem remuneração</b>, por eleição, nomeação, designação, contratação ou <b>qualquer forma de investidura</b> ou vínculo, mandato, cargo, emprego ou função nas entidades do art. 1º. O <b>particular</b> que celebra com a administração contrato, convênio ou ajuste análogo <b>responde</b> nos termos da lei. Também o <b>terceiro</b> (pessoa física ou jurídica) que <b>induza ou concorra dolosamente</b> para o ato, ou dele se beneficie, responde <b>na medida da sua participação</b> (art. 3º, caput e § 1º). O art. 3º traz três regras que a banca gosta de testar: <b>(i)</b> <b>sócios, cotistas, diretores e colaboradores</b> de pessoa jurídica de direito privado só respondem se <b>comprovada a participação e o benefício direto</b>, ainda que por intermédio de interposta pessoa (§ 1º); <b>(ii)</b> a pessoa jurídica <b>não é sancionada</b> pela Lei 8.429 se já houver <b>responsabilização por ato lesivo pela Lei 12.846/2013</b> (Lei Anticorrupção), evitando <i>bis in idem</i> (§ 2º); <b>(iii)</b> o <b>sucessor ou herdeiro</b> responde só até o <b>limite do valor da herança ou do patrimônio transferido</b> (art. 8º), e há regra própria para <b>sucessão empresarial</b> (art. 8º-A, que li na leitura anterior; o detalhe de que a responsabilidade se limita ao patrimônio transferido, salvo simulação ou fraude, é <b>de memória</b>: conferir).", "<b>Art. 9º: enriquecimento ilícito.</b> Constitui improbidade <b>auferir, mediante a prática de ato doloso, qualquer tipo de vantagem patrimonial indevida</b> em razão do exercício de cargo, mandato, função, emprego ou atividade nas entidades do art. 1º. Exemplos do rol (<b>exemplificativo</b>, expresso em 'notadamente'): receber <b>vantagem econômica</b> para facilitar a alienação, permuta ou locação de bem público <b>por preço inferior ao de mercado</b> ou a aquisição por <b>preço superior</b> (I a III); usar <b>bem móvel, trabalho de servidores, empregados ou terceiros contratados</b> em obra ou serviço particular (IV); receber vantagem para tolerar jogos de azar, lenocínio, narcotráfico, contrabando, usura (V); receber vantagem para <b>declaração falsa</b> sobre medição ou avaliação (VI); <b>adquirir bens desproporcionais à evolução patrimonial</b>, assegurada ao agente a <b>demonstração da licitude da origem</b> da evolução, e <b>decorrentes dos atos do caput</b> (VII); aceitar emprego ou consultoria de quem tenha interesse suscetível de ser atingido por ação ou omissão do agente (VIII); intermediar liberação de verba (IX); receber vantagem para omitir ato de ofício (X); <b>incorporar ou usar em proveito próprio</b> bens, rendas, verbas ou valores do acervo (XI e XII). <b>Dano ao erário não é elemento</b> do art. 9º; basta o <b>enriquecimento ilícito doloso</b>.", "<b>Art. 10: lesão ao erário.</b> Constitui improbidade qualquer <b>ação ou omissão dolosa</b> que enseje, <b>efetiva e comprovadamente</b>, <b>perda patrimonial, desvio, apropriação, malbaratamento ou dilapidação</b> de bens ou haveres das entidades do art. 1º. A redação anterior admitia a modalidade <b>dolosa ou culposa</b> e a perda patrimonial 'presumida'; hoje, <b>só dolo</b> e perda <b>efetiva e comprovada</b>. Entre os incisos que li: facilitar a <b>incorporação indevida</b> de bens ao patrimônio particular (I); permitir a utilização de bens sem as <b>formalidades legais</b> (II); doação sem formalidades (III); alienação/locação/prestação de serviço por <b>preço inferior ao de mercado</b> (IV) ou aquisição por <b>preço superior</b> (V); operação financeira sem observância das normas ou garantia insuficiente (VI); benefício administrativo ou fiscal sem formalidades (VII); <b>frustrar a licitude de processo licitatório ou dispensá-lo indevidamente</b>, hoje com a exigência de <b>perda patrimonial efetiva</b> (VIII); despesa não autorizada (IX); <b>agir ilicitamente na arrecadação</b> de tributo ou renda (X; antes dizia 'negligentemente'); liberar verba pública sem observância das normas (XI); permitir que <b>terceiro se enriqueça ilicitamente</b> (XII); uso de bens em obra particular (XIII); contrato de <b>gestão associada</b> e <b>rateio de consórcio</b> sem formalidades ou dotação (XIV e XV); e vários incisos sobre <b>parcerias com entidades privadas</b> (XVI a XX e XXII, este quanto a benefício tributário contrário à LC 116/2003). <b>§ 1º</b>: se a inobservância das formalidades <b>não gerar perda patrimonial efetiva</b>, <b>não há</b> imposição de ressarcimento (vedado o enriquecimento sem causa). <b>§ 2º</b>: a <b>mera perda patrimonial decorrente da atividade econômica</b> não é improbidade, salvo ato doloso com essa finalidade.", "<b>Art. 11: violação de princípios.</b> Hoje exige <b>ação ou omissão dolosa</b> que viole os deveres de <b>honestidade, imparcialidade e legalidade</b> (o texto antigo falava também em <b>lealdade às instituições</b>), <b>caracterizada por uma das condutas</b> do rol, que passou a ser <b>taxativo</b>. Do rol vigente (que li): <b>revelar fato ou circunstância sigilosa</b> propiciando beneficiamento por informação privilegiada ou risco à segurança da sociedade e do Estado (III); <b>negar publicidade</b> a atos oficiais, ressalvada a imprescindibilidade para a segurança da sociedade e do Estado ou outras hipóteses legais (IV); <b>frustrar, em ofensa à imparcialidade, o caráter concorrencial</b> de concurso público, chamamento ou licitação, <b>com vistas a benefício próprio ou de terceiros</b> (V); <b>deixar de prestar contas</b> desde que disponha das condições para isso e <b>com vistas a ocultar irregularidades</b> (VI); revelar medida política ou econômica capaz de afetar preços antes da divulgação oficial (VII); descumprir normas de <b>parcerias</b> (VIII); <b>nomear cônjuge, companheiro ou parente até o 3º grau</b> para cargo em comissão, função de confiança ou função gratificada, <b>inclusive nomeações recíprocas</b> (XI, o <b>nepotismo</b>); e <b>publicidade</b> oficial que promova <b>enaltecimento e personalização</b> (XII). Os incisos I (fim proibido), II (retardar ato de ofício) e IX (acessibilidade) estão <b>revogados</b>. Salvaguardas: <b>§ 1º</b> só há improbidade se comprovado o <b>fim de obter proveito ou benefício indevido</b> para si ou outrem (dolo específico); <b>§ 3º</b> exige a <b>demonstração objetiva</b> da ilegalidade, com <b>indicação das normas violadas</b>; <b>§ 4º</b> exige <b>lesividade relevante</b> ao bem jurídico, <b>independentemente</b> de dano ao erário ou enriquecimento; <b>§ 5º</b> a <b>mera nomeação ou indicação política</b> por quem tem mandato eletivo <b>não</b> configura improbidade, é preciso <b>dolo com finalidade ilícita</b>.", "<b>Sanções (art. 12, redação vigente).</b> As penas podem ser aplicadas <b>isolada ou cumulativamente</b>, conforme a gravidade, <b>independentemente do ressarcimento integral do dano</b> (se efetivo) e das demais sanções. <b>Art. 9º</b>: perda dos bens ou valores acrescidos ilicitamente; perda da função pública; <b>suspensão dos direitos políticos até 14 anos</b>; <b>multa civil equivalente ao valor do acréscimo patrimonial</b>; proibição de contratar com o poder público ou receber benefícios ou incentivos fiscais ou creditícios, ainda que por pessoa jurídica da qual seja sócio majoritário, por <b>prazo não superior a 14 anos</b>. <b>Art. 10</b>: perda dos bens acrescidos (se concorrer), perda da função, suspensão dos direitos políticos <b>até 12 anos</b>, <b>multa equivalente ao valor do dano</b>, proibição de contratar <b>até 12 anos</b>. <b>Art. 11</b>: <b>multa civil de até 24 vezes o valor da remuneração</b> do agente e proibição de contratar <b>até 4 anos</b>; <b>não há</b> perda da função nem suspensão de direitos políticos. O antigo inciso IV (sanções do art. 10-A) está <b>revogado</b>, e o texto antigo ('suspensão de 8 a 10 anos', 'multa de até três vezes') foi substituído pelos <b>tetos</b> acima.", "<b>Parágrafos do art. 12 (dosimetria).</b> <b>§ 1º</b>: a perda da função pública, nos incisos I e II, atinge <b>apenas o vínculo de mesma qualidade e natureza</b> que o agente detinha na época da infração; só <b>excepcionalmente</b> (no art. 9º) o juiz pode estendê-la aos demais vínculos. <b>§ 2º</b>: a multa pode ser <b>aumentada até o dobro</b> se, pela situação econômica do réu, o valor calculado for ineficaz. <b>§ 3º</b>: na responsabilização da <b>pessoa jurídica</b>, consideram-se os <b>efeitos econômicos e sociais</b> das sanções, para viabilizar a manutenção das atividades. <b>§ 4º</b>: a proibição de contratar pode, <b>excepcionalmente</b> e por motivo relevante justificado, <b>extrapolar o ente lesado</b>. <b>§ 5º</b>: em atos de <b>menor ofensa</b>, a sanção limita-se à <b>multa</b>, sem prejuízo do ressarcimento e da perda dos valores obtidos. <b>§ 6º</b>: a reparação deve <b>deduzir</b> o ressarcimento ocorrido em outras instâncias. <b>§ 7º</b>: <i>non bis in idem</i> entre a Lei 8.429 e a <b>Lei 12.846</b> para pessoas jurídicas. <b>§ 8º</b>: a proibição de contratar consta do <b>CEIS</b>. <b>§ 9º</b>: as sanções só são executadas <b>após o trânsito em julgado</b>. <b>§ 10</b>: para a contagem da suspensão dos direitos políticos computa-se <b>retroativamente</b> o intervalo entre a <b>decisão colegiada e o trânsito em julgado</b>.", "<b>Independência das instâncias e efeitos de outras decisões (art. 21).</b> A aplicação das sanções <b>independe</b> da aprovação ou rejeição de contas pelo controle interno ou pelo Tribunal de Contas (II) e, em regra, de <b>dano efetivo</b> ao patrimônio, <b>salvo</b> quanto ao ressarcimento e às condutas do art. 10 (I). Os atos do controle são <b>considerados</b> pelo juiz quando fundamentaram a conduta (§ 1º), e as provas do controle devem ser consideradas, <b>sem prejuízo da análise do dolo</b> (§ 2º). Sentenças civis e penais produzem efeito na ação de improbidade quando concluírem pela <b>inexistência da conduta</b> ou <b>negativa de autoria</b> (§ 3º). A <b>absolvição criminal confirmada por decisão colegiada</b> impede o trâmite da ação de improbidade, com comunicação de todos os fundamentos do art. 386 do CPP (§ 4º), dispositivo com a nota <b>ADI 7236</b> e <b>ADI 7156</b> na página (as ações constam como 'Vide'; <b>não li</b> o seu andamento).", "<b>Sobre o processo: o essencial para ligar com a unidade 28.</b> No art. 17 (lido em trechos) a ação para a aplicação das sanções <b>segue o procedimento comum do CPC</b>, com foro do local do dano ou da pessoa jurídica prejudicada (§ 4º-A), prevenção do juízo (§ 5º) e petição inicial que deve <b>individualizar a conduta</b> e apontar <b>elementos probatórios mínimos</b> (§ 6º). O art. 17-B (lido em trechos) autoriza o <b>acordo de não persecução cível</b>, com <b>integral ressarcimento</b> e <b>reversão da vantagem indevida</b>; exige a <b>oitiva do ente lesado</b> e <b>aprovação pelo órgão superior do MP</b> em até 60 dias. No art. 23 (lido): a prescrição é de <b>8 anos</b> contados do fato (ou do fim da permanência), com suspensão de até <b>180 dias</b> pelo inquérito civil, <b>marcos interruptivos</b> (ajuizamento, sentença condenatória, acórdãos de TJ/TRF, STJ e STF que confirmem a condenação ou reformem a improcedência) e, após interromper, <b>recomeça pela metade</b> (4 anos); há também <b>prescrição intercorrente</b> (§ 8º). Tudo isso é detalhado na unidade 28.", "<b>Teses do STF e pontos de conferência (de memória; conferir).</b> (a) <b>Tema 1.199 (RE 843.989)</b>: (i) é <b>necessária a presença do dolo</b> nos atos dos arts. 9º, 10 e 11; (ii) a <b>revogação da modalidade culposa</b> do art. 10 é <b>irretroativa</b>, não alcançando a <b>coisa julgada</b> nem execuções em andamento, mas a nova lei se aplica <b>aos processos em curso</b>, devendo o juízo analisar o dolo; (iii) o <b>novo regime prescricional não retroage</b>. (b) <b>ADIs 7042 e 7043</b>: o STF reconheceu a <b>legitimidade ativa concorrente</b> do <b>ente público lesado</b>, afastando a exclusividade do Ministério Público (relevante para o Município, que é quem o procurador representa). (c) <b>ADI 7236</b>: tema de efeitos da absolvição criminal e de outros dispositivos; <b>não conferi</b>. (d) Para o Município de Curitiba, o procurador atua como <b>representante do ente lesado</b>, com <b>legitimidade para propor ação</b> e para <b>integrar a lide</b> quando o autor for o MP.", "<b>Resumo operacional para prova.</b> (1) <b>Só dolo</b>; culpa e erro não bastam; divergência interpretativa não é improbidade. (2) <b>Art. 9º</b>: vantagem indevida, <b>sem exigir dano</b>; suspensão <b>até 14 anos</b>, multa = acréscimo patrimonial. (3) <b>Art. 10</b>: <b>perda patrimonial efetiva e comprovada</b>; suspensão <b>até 12 anos</b>, multa = valor do dano. (4) <b>Art. 11</b>: rol <b>taxativo</b>, exige <b>fim de proveito indevido</b> e <b>lesividade relevante</b>; <b>multa até 24 remunerações</b>, proibição até <b>4 anos</b>, sem perda da função nem suspensão de direitos políticos. (5) <b>Art. 10-A revogado</b>. (6) Sanções só se executam <b>após o trânsito em julgado</b>. (7) <b>Nepotismo</b> (art. 11, XI) exige dolo; <b>nomeação política</b> sozinha não basta. (8) <b>Prescrição</b> de <b>8 anos</b>; recomeço pela <b>metade</b>. (9) PJ não é punida duas vezes: Lei 8.429 e Lei 12.846 (<i>non bis in idem</i>)."], "pega": ["Culpa: a banca diz que o ato de improbidade do art. 10 admite <b>modalidade culposa</b>. Desde a Lei 14.230/2021, só se admite <b>ação ou omissão dolosa</b> (arts. 9º, 10 e 11).", "Dano: a banca exige <b>dano ao erário</b> para o art. 9º (ou para o art. 11). O art. 9º se configura com a <b>vantagem indevida</b> e o art. 11 independe de dano ou enriquecimento (art. 11, § 4º); só o art. 10 pede <b>perda patrimonial efetiva e comprovada</b>.", "Erro de gestão: a banca diz que a <b>mera ilegalidade</b> ou a <b>divergência interpretativa</b> configura improbidade. A lei diz que a <b>divergência baseada em jurisprudência</b> e o <b>exercício da função sem dolo</b> não configuram, e o art. 11, § 3º, exige a demonstração objetiva da ilegalidade com a indicação das normas violadas.", "Rol do art. 11: a banca afirma que o rol é <b>meramente exemplificativo</b>. Hoje o art. 11 traz condutas <b>taxativas</b> ('caracterizada por uma das seguintes condutas'); o rol do art. 9º e do art. 10, por 'notadamente', segue <b>exemplificativo</b>.", "Sanções do art. 11: a banca inclui <b>perda da função</b> e <b>suspensão dos direitos políticos</b>. Pelo art. 12, III vigente, só há <b>multa de até 24 remunerações</b> e <b>proibição de contratar por até 4 anos</b> (mais o ressarcimento, se houver dano).", "Prazos de suspensão: a banca troca os números ('8 a 10 anos', 'de 5 a 8'). O texto vigente fixa <b>até 14 anos</b> (art. 9º) e <b>até 12 anos</b> (art. 10), com multa igual ao acréscimo patrimonial (art. 9º) ou ao dano (art. 10).", "Execução das sanções: a banca diz que a perda da função e a suspensão de direitos políticos se executam após a <b>sentença de primeiro grau</b> ou o acórdão. O § 9º do art. 12 exige o <b>trânsito em julgado</b>.", "Particular: a banca afirma que <b>sócio e diretor</b> respondem por improbidade da empresa <b>só por serem sócios</b>. O art. 3º, § 1º, exige <b>participação e benefício direto</b>, e a PJ não é sancionada pela Lei 8.429 se já responsabilizada pela <b>Lei 12.846</b> (art. 3º, § 2º; art. 12, § 7º).", "Sucessores: a banca diz que o herdeiro responde por <b>todas as sanções</b> do falecido. O art. 8º limita a responsabilidade ao <b>valor da herança</b> (e só a reparação e a perda de bens), e o art. 8º-A trata a sucessão empresarial com limite ao patrimônio transferido.", "Nepotismo: a banca diz que a <b>mera nomeação política</b> de parente ou apadrinhado por prefeito configura improbidade <b>por presunção</b>. O art. 11, § 5º, exige <b>dolo com finalidade ilícita</b>; a nomeação de cônjuge ou parente até o 3º grau para cargo de confiança continua prevista no inciso XI do art. 11."]}, {"materia": "DIREITO CIVIL", "titulo": "Registros Públicos (Lei 6.015/1973): espécies de registro, escrituração, protocolo e prioridade, princípios, registro, averbação, matrícula, procedimento de dúvida, retificação e cancelamento", "key": "CIV", "nome": "Civil", "conc": ["Edital: item 7 de Direito Civil, 'Registros Públicos (Lei nº 6.015/1973): Registros, presunção de fé pública, prioridade, especialidade, legalidade, continuidade, transcrição, inscrição e averbação. Procedimento de dúvida'. Li <b>literalmente</b>, no navegador (Planalto, texto compilado): <b>Lei 6.015/1973, arts. 1º a 7º, 12 a 15, 167 (parte), 169, 172 a 176 (parte), 182 a 195, 196 a 212, 213 (caput, incisos e §§ 1º a 7º, em parte), 237, 252 a 259 e 260</b>. <b>Não li</b> o registro civil das pessoas naturais e jurídicas (arts. 29 em diante), o registro de títulos e documentos, nem a íntegra dos arts. 167, 176, 213 e 214 a 236. Os artigos do <b>Código Civil</b> (arts. 1.245 a 1.247) e a <b>Lei 13.097/2015</b> (concentração) citados abaixo vêm <b>da minha memória</b>. As teses de jurisprudência não foram conferidas. Esta unidade não traz questões novas do banco de provas; o treino fica no app.", "<b>Quais são os registros públicos (arts. 1º e 2º).</b> Os serviços de registros públicos, estabelecidos pela legislação civil para dar <b>autenticidade, segurança e eficácia</b> aos atos jurídicos, ficam sujeitos à lei. São quatro: <b>(I) registro civil de pessoas naturais; (II) registro civil de pessoas jurídicas; (III) registro de títulos e documentos; (IV) registro de imóveis</b>. Os demais registros (como o de empresas, o de embarcações, o de aeronaves) regem-se por <b>leis próprias</b> (§ 2º). O § 3º, hoje, manda <b>escriturar, publicizar e conservar os registros em meio eletrônico</b>, nos padrões da <b>Corregedoria Nacional de Justiça do CNJ</b>, e o § 4º <b>veda</b> às serventias recusar a recepção, a conservação ou o registro de documentos eletrônicos produzidos nos termos do CNJ. A lei cita o <b>Serp</b> (Sistema Eletrônico dos Registros Públicos) em vários artigos, como no art. 169, § 2º.", "<b>Escrituração e livros (arts. 3º a 7º).</b> A escrituração é feita em <b>livros encadernados</b>, sujeitos à <b>correição</b> da autoridade judiciária competente; os livros são abertos, numerados, autenticados e encerrados <b>pelo oficial</b> (art. 4º). A numeração dos registros <b>não se interrompe</b> no fim de cada livro (art. 7º). O art. 7º-A afasta essas regras para a <b>escrituração eletrônica</b>. No Registro de Imóveis há cinco livros (art. 173): <b>Livro 1 (Protocolo)</b>, <b>Livro 2 (Registro Geral)</b>, <b>Livro 3 (Registro Auxiliar)</b>, <b>Livro 4 (Indicador Real)</b> e <b>Livro 5 (Indicador Pessoal)</b>. O Livro 2 serve à <b>matrícula</b> dos imóveis e ao registro ou averbação dos atos do art. 167 (art. 176).", "<b>Instância (rogação) e impulso oficial (art. 13).</b> Salvo as <b>anotações e averbações obrigatórias</b>, os atos do registro são praticados <b>(I) por ordem judicial; (II) a requerimento verbal ou escrito dos interessados; (III) a requerimento do Ministério Público</b>, quando a lei autorizar. É o <b>princípio da instância</b>: o registrador não age de ofício como regra. As exceções de ofício existem, como a retificação de erro de transposição e a abertura de matrícula (art. 213, I, e art. 169, IV). Se o interessado no registro for o próprio oficial ou parente em grau de impedimento, o ato incumbe ao <b>substituto legal</b> (art. 15).", "<b>Protocolo, prenotação e <i>prioridade</i> (arts. 12, 174 a 192).</b> O Livro 1 serve para o <b>apontamento de todos os títulos apresentados diariamente</b>, e é encerrado diariamente (art. 184). Cada título recebe o número de ordem <b>pela sequência rigorosa da apresentação</b> (art. 182), que é reproduzido no título com a data da prenotação (art. 183). O <b>número de ordem determina a prioridade do título, e esta a preferência dos direitos reais</b>, ainda que apresentados pela mesma pessoa vários títulos simultaneamente (art. 186). O art. 12 garante que nenhuma <b>exigência fiscal ou dúvida</b> impede o lançamento no Protocolo quando da precedência decorre prioridade. <b>Regras de conflito</b>: no mesmo dia, <b>não se registram</b> títulos que constituam <b>direitos reais contraditórios</b> sobre o mesmo imóvel (art. 190); prevalece o de <b>número de ordem mais baixo</b>, protelando-se o registro dos posteriores por, pelo menos, <b>um dia útil</b> (art. 191); a regra não vale para <b>escrituras públicas da mesma data</b> que indiquem a <b>hora</b> da lavratura (art. 192). A <b>segunda hipoteca</b> com referência à anterior é prenotada e o oficial aguarda <b>30 dias</b> pela inscrição da primeira, depois do que a segunda é inscrita e <b>passa a ter preferência</b> (art. 189).", "<b>Prazos do registro e a nota devolutiva (arts. 188, 198 e 205).</b> Protocolizado o título, o oficial procede ao <b>registro</b> ou emite <b>nota devolutiva</b> no prazo de <b>10 dias</b> (art. 188). No prazo de <b>5 dias</b>, se não houver exigências ou falta de custas: escrituras de compra e venda sem cláusulas especiais, pedidos de averbação de construção e cancelamento de garantias, documentos eletrônicos apresentados pelo Serp e títulos reapresentados na vigência da prenotação com as exigências cumpridas (§ 1º). A exigência é feita <b>por escrito, de uma só vez, de forma articulada, clara e objetiva</b>, com data, identificação e assinatura (art. 198, caput). <b>A prenotação perde a eficácia</b> se, em <b>20 dias</b> (<b>40 dias</b> na regularização fundiária de interesse social), o título não for registrado por omissão do interessado em atender às exigências (art. 205 e parágrafo único). O oficial <b>não pode recusar</b> a prenotação de título eletrônico produzido conforme o CNJ (art. 1º, § 4º).", "<b>Princípio da <i>continuidade</i> (arts. 195 e 237).</b> Se o imóvel <b>não estiver matriculado ou registrado em nome do outorgante</b>, o oficial exigirá a <b>prévia matrícula e o registro do título anterior</b>, qualquer que seja a sua natureza, para <b>manter a continuidade</b> do registro (art. 195). O art. 237 completa: <b>ainda que o imóvel esteja matriculado</b>, não se fará o registro que dependa da apresentação de <b>título anterior</b>, a fim de preservar a continuidade. Em linguagem simples: cada transmissão deve <b>encaixar na cadeia</b> (A vendeu a B, B vende a C; não se registra a venda de A a C sem a de A a B). Se o título anterior estiver em outro cartório, o novo título vai com <b>certidão atualizada</b> do registro anterior e de ônus (art. 197).", "<b>Princípio da <i>especialidade</i> e a matrícula (art. 176).</b> Especialidade exige que o imóvel e as partes sejam <b>individualizados</b>. <b>Cada imóvel tem matrícula própria</b>, aberta por ocasião do primeiro ato de registro ou averbação caso a transcrição possua os requisitos (art. 176, § 1º, I). São <b>requisitos da matrícula</b> (art. 176, § 1º, II): o <b>número de ordem</b>, a <b>data</b>, a <b>identificação do imóvel</b> (se <b>rural</b>: código do imóvel, dados do <b>CCIR</b>, denominação, características, confrontações, localização e área; se <b>urbano</b>: características, confrontações, localização, área, logradouro, número e designação cadastral) e a <b>qualificação do proprietário</b> (nome, domicílio, nacionalidade; para pessoa física, estado civil, profissão, <b>CPF</b> ou RG ou filiação). Os demais requisitos do art. 176 <b>não li</b> em detalhe. O art. 169, II, estabelece que, para imóvel em <b>duas ou mais circunscrições</b>, abrem-se matrículas em <b>ambas</b> as serventias.", "<b>Registro <i>lato sensu</i>: registro e averbação (arts. 167, 169 e 172).</b> O art. 172 define a função do Registro de Imóveis: fazer o <b>registro e a averbação dos títulos ou atos constitutivos, declaratórios, translativos e extintivos de direitos reais</b> sobre imóveis, <b>inter vivos ou mortis causa</b>, quer para <b>constituição, transferência e extinção</b>, quer para <b>validade em relação a terceiros</b>, quer para <b>disponibilidade</b>. O art. 167 distingue: <b>I – registro</b> (por exemplo: instituição de bem de família; hipotecas legais, judiciais e convencionais; locações com cláusula de vigência em caso de alienação; penhoras, arrestos e sequestros; servidões; usufruto, uso e habitação; compromisso de compra e venda e cessão; entre outros) e <b>II – averbação</b> (por exemplo: convenções antenupciais e regime de bens; <b>cancelamento</b> da extinção de ônus e direitos reais; mudança de denominação e numeração, <b>edificação, reconstrução, demolição</b>, desmembramento e loteamento; alteração do nome por casamento ou por desquite (como diz o texto); cláusulas de <b>inalienabilidade, impenhorabilidade e incomunicabilidade</b>; decisões e recursos relativos a atos registrados; sentenças de separação, divórcio e anulação de casamento quando as partilhas contiverem imóveis; <b>notificação para parcelamento, edificação ou utilização compulsórios</b>; extinção da concessão de uso especial para moradia; extinção do direito de superfície; entre outros). Em termos práticos: <b>registro</b> cria, transfere ou grava direito real (em regra); <b>averbação</b> <b>modifica ou noticia</b> fato que altera o registro ou as pessoas, ou cancela.", "<b>Fé pública, presunção e <i>transcrição</i> (de memória; conferir).</b> Os registradores são titulares de serviço dotado de <b>fé pública</b> (Lei 8.935/1994, art. 3º), e o registro goza de <b>presunção relativa de veracidade</b>. No CC (arts. 1.245 a 1.247, <b>não lidos</b> aqui): <b>a propriedade imóvel se transfere pelo registro do título translativo</b> (art. 1.245); <b>enquanto não registrado</b>, o alienante continua dono (§ 1º); <b>enquanto não se promover a anulação do registro</b>, o adquirente é dono (§ 2º); a eficácia do registro <b>retroage à data da prenotação</b> (art. 1.246); <b>retificação ou anulação</b> do registro por falta de verdade (art. 1.247). Na Lei 6.015, o <b>art. 252</b> (que li) diz que o registro, <b>enquanto não cancelado, produz todos os efeitos legais</b>, ainda que por outra maneira se prove que o título está desfeito, anulado, extinto ou rescindido. <b>Transcrição</b> era o sistema anterior à Lei 6.015 (Livro 3, <i>Transcrição das Transmissões</i>); o sistema atual é de <b>matrícula</b>, mas as transcrições antigas ainda dão origem às matrículas no primeiro ato (art. 176, § 1º, I). A <b>inscrição</b>, em sentido amplo, é o registro de hipotecas e demais ônus.", "<b>Princípio da <i>legalidade</i> e o procedimento de <i>dúvida</i> (arts. 198 a 207).</b> O registrador faz a <b>qualificação registral</b>: se houver exigência, indica-a por escrito (art. 198). O interessado pode <b>(V) satisfazê-la</b> ou <b>(VI)</b>, se não se conformar ou for impossível cumprir, <b>requerer que o título e a declaração de dúvida sejam remetidos ao juízo competente</b>. Rito (art. 198, § 1º): <b>anotação na margem da prenotação</b>; certificação da prenotação e da suscitação, com rubrica das folhas; <b>ciência ao apresentante</b>, que é notificado para <b>impugnar em 15 dias</b> perante o juízo; remessa eletrônica das razões da dúvida e do título. Se o interessado <b>não impugnar</b>, a dúvida é <b>ainda assim julgada por sentença</b> (art. 199). Impugnada, ouve-se o <b>Ministério Público em 10 dias</b> (art. 200); o juiz decide em <b>15 dias</b> (art. 201). Da sentença cabe <b>apelação</b>, com efeitos <b>devolutivo e suspensivo</b>, pelo <b>interessado, MP e terceiro prejudicado</b> (art. 202). Transitada em julgado: se <b>procedente</b>, os documentos voltam à parte e cancela-se a prenotação; se <b>improcedente</b>, o interessado reapresenta o título com a certidão da sentença e procede-se ao registro (art. 203). <b>A decisão da dúvida tem natureza administrativa</b> e <b>não impede o uso do processo contencioso competente</b> (art. 204). Custas: só são devidas, e pagas pelo interessado, <b>quando a dúvida é julgada procedente</b> (art. 207).", "<b>Retificação (arts. 212 e 213) e cancelamento (arts. 252 a 259).</b> Se o registro ou a averbação for <b>omissa, imprecisa ou não exprimir a verdade</b>, a retificação é feita <b>pelo oficial</b>, a requerimento do interessado, pelo <b>procedimento administrativo do art. 213</b>, sendo <b>facultado</b> o procedimento judicial (art. 212). O art. 213 permite retificar <b>de ofício ou a requerimento</b> nos casos de: erro de transposição de elemento do título; indicação ou atualização de confrontação; mudança de nome de logradouro; indicação de rumos, ângulos de deflexão ou coordenadas georreferenciadas <b>sem alterar as medidas perimetrais</b>; mero cálculo matemático; reprodução de linha divisória já retificada; dados de qualificação pessoal das partes (I). <b>A requerimento do interessado</b> (II), quando houver inserção ou alteração de <b>medida perimetral</b> ou de área, exige-se <b>planta e memorial descritivo</b> com ART no CREA e <b>anuência dos confrontantes</b>; se faltar alguma assinatura, o confrontante é <b>notificado para se manifestar em 15 dias</b> (§ 2º), <b>presumindo-se a anuência</b> pelo silêncio (§ 4º). Havendo <b>impugnação fundamentada</b>, o oficial intima o requerente (5 dias); sem transação, remete ao juiz, que decide de plano ou após instrução sumária, <b>remetendo às vias ordinárias</b> se a controvérsia versar sobre o <b>direito de propriedade</b> (§§ 5º e 6º). <b>Cancelamento</b>: o registro, enquanto não cancelado, vale (art. 252); o <b>terceiro prejudicado</b> pode provar em juízo a extinção dos ônus e promover o cancelamento (art. 253); cancelado o registro, se o título subsistir, o credor pode fazer <b>novo registro</b>, que <b>só produz efeitos a partir da nova data</b> (art. 254); o cancelamento <b>não pode</b> decorrer de sentença <b>sujeita a recurso</b> (art. 259).", "<b>Bem de família (arts. 260 e seguintes; ponte com o Direito de Família).</b> A <b>instituição do bem de família</b> far-se-á <b>por escritura pública</b>, declarando o instituidor que determinado prédio se destina a domicílio de sua família e <b>ficará isento de execução por dívida</b> (art. 260, que li). O registro é feito no <b>Registro de Imóveis</b> (art. 167, I, 1), e o art. 261 trata da apresentação ao oficial. Para o Município, a distinção entre o <b>bem de família voluntário</b> (CC) e o <b>legal</b> (Lei 8.009/1990) importa em <b>execução fiscal</b> (de memória; não lido nesta unidade).", "<b>Resumo operacional para prova.</b> (1) São <b>quatro</b> registros públicos (RCPN, RCPJ, RTD, RI). (2) <b>Instância</b>: registro a requerimento, por ordem judicial ou do MP (art. 13). (3) <b>Prioridade</b>: número de ordem do Protocolo (arts. 182 a 191); direitos reais contraditórios não se registram no mesmo dia (art. 190). (4) <b>Continuidade</b>: exige registro prévio em nome do outorgante (arts. 195 e 237). (5) <b>Especialidade</b>: matrícula própria, com identificação do imóvel e das partes (art. 176). (6) <b>Legalidade</b>: exigência escrita, única e articulada; <b>dúvida</b> com impugnação em <b>15 dias</b>, MP em <b>10</b>, decisão em <b>15</b>, apelação com efeito suspensivo; natureza <b>administrativa</b> (arts. 198 a 204). (7) Prazos: <b>10 dias</b> (5 em casos específicos); prenotação cessa em <b>20 dias</b> (40 na Reurb-S). (8) Registro vale até o <b>cancelamento</b> (art. 252). (9) Retificação administrativa com <b>notificação de confrontantes em 15 dias</b> e <b>anuência presumida</b> (art. 213, §§ 2º e 4º)."], "pega": ["Espécies: a banca inclui o <b>registro de empresas mercantis</b> ou o <b>registro de embarcações</b> entre os quatro da Lei 6.015. O art. 1º, § 1º, lista: <b>pessoas naturais, pessoas jurídicas, títulos e documentos e imóveis</b>; os demais regem-se por leis próprias (§ 2º).", "Instância: a banca diz que o oficial pratica <b>todos os atos de ofício</b>. A regra é a <b>instância</b> (art. 13: ordem judicial, requerimento do interessado ou do MP); de ofício só em casos como a retificação por erro de transposição (art. 213, I) e as averbações obrigatórias.", "Prioridade: a banca afirma que prevalece o título de <b>data de lavratura anterior</b>. A prioridade decorre do <b>número de ordem no Protocolo</b> (arts. 182 e 186); a escritura que declara a <b>hora</b> da lavratura só prevalece nos casos do art. 192.", "Direitos reais contraditórios: a banca diz que se registram <b>ambos</b> no mesmo dia e prevalece o primeiro. O art. 190 <b>proíbe</b> o registro, no mesmo dia, de títulos que constituam direitos reais contraditórios sobre o mesmo imóvel.", "Continuidade: a banca afirma que, estando o imóvel matriculado, <b>qualquer título</b> pode ser registrado. O art. 237 manda <b>exigir o título anterior</b> mesmo com matrícula aberta, para preservar a continuidade; o art. 195 exige a prévia matrícula e o registro em nome do outorgante.", "Dúvida: a banca diz que o <b>oficial decide</b> a dúvida, ou que a decisão faz <b>coisa julgada material</b>. Quem decide é o <b>juiz competente</b>, e a decisão tem <b>natureza administrativa</b> e <b>não impede</b> o processo contencioso (art. 204).", "Prazos da dúvida: a banca troca os números (impugnação em <b>10 dias</b>, parecer do MP em <b>15</b>). Impugnação: <b>15 dias</b>; MP: <b>10 dias</b>; decisão do juiz: <b>15 dias</b> (arts. 198, § 1º, III, 200 e 201).", "Recurso: a banca diz que a apelação da sentença da dúvida só tem efeito <b>devolutivo</b>, ou que só o interessado pode recorrer. Cabe apelação com efeitos <b>devolutivo e suspensivo</b> e legitimados são o <b>interessado, o MP e o terceiro prejudicado</b> (art. 202).", "Custas: a banca afirma que as custas da dúvida são devidas sempre. Só são devidas, pelo interessado, quando a dúvida é <b>julgada procedente</b> (art. 207).", "Prenotação: a banca diz que a prenotação vale <b>indefinidamente</b> enquanto pendente a exigência. Cessam os efeitos em <b>20 dias</b> se o interessado não atender à exigência (40 dias na regularização fundiária de interesse social).", "Registro e anulação do título: a banca diz que, provada a nulidade do título, o registro <b>deixa de valer</b> por si. Pelo art. 252, o registro, enquanto <b>não cancelado</b>, produz todos os seus efeitos, mesmo que se prove que o título está desfeito, anulado ou rescindido."]}, {"materia": "DIREITO URBANÍSTICO E AMBIENTAL", "titulo": "Estatuto da Metrópole (Lei 13.089/2015) e Estatuto da Cidade (Lei 10.257/2001): governança interfederativa, plano diretor e instrumentos da política urbana", "key":
