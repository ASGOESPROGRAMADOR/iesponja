rição que <b>atinge individualmente</b> o bem e esvazia seu valor ou causa dano especial indeniza.", "<b>Limitação administrativa.</b> Imposição geral, gratuita e unilateral, que condiciona o exercício de direitos em prol do interesse público (recuos, gabarito, zoneamento, área non aedificandi). Alcança pessoas indeterminadas, <b>não gera indenização</b> em regra, salvo dano comprovado e anormal. É distinta do tombamento (que é, em regra, individualizado) e da servidão (direito real sobre coisa alheia).", "<b>Tombamento: conceito e objeto (DL 25/1937, arts. 1º a 4º).</b> Integra o patrimônio histórico e artístico nacional o conjunto de bens móveis e imóveis de interesse público, por vinculação a fatos memoráveis ou por excepcional valor arqueológico, etnográfico, bibliográfico ou artístico (art. 1º). Esses bens só <b>integram o patrimônio depois de inscritos</b> nos Livros do Tombo (art. 1º, §1º); os monumentos naturais, sítios e paisagens também podem ser tombados (§2º). O art. 2º aplica o decreto-lei a coisas pertencentes a pessoas naturais, a pessoas jurídicas de direito privado e a pessoas de direito público interno. Há <b>quatro Livros do Tombo</b>: Arqueológico, Etnográfico e Paisagístico; Histórico; das Belas Artes; das Artes Aplicadas (art. 4º).", "<b>Espécies de tombamento (arts. 5º a 10).</b> Por <b>ordem do diretor do órgão</b>, <b>de ofício</b>, para bens da União, dos Estados e dos Municípios (art. 5º). Em bens de particulares, <b>voluntário</b> (pedido do proprietário ou anuência por escrito à notificação, art. 7º) ou <b>compulsório</b> (recusa do proprietário, art. 8º). Também se classifica em <b>provisório</b> (a partir da notificação) e <b>definitivo</b> (a partir da inscrição no Livro do Tombo), e o parágrafo único do art. 10 diz que o provisório se equipara ao definitivo, salvo quanto à transcrição no registro de imóveis (art. 13). O tombamento de bem público por ente maior sobre ente menor é matéria de doutrina e jurisprudência (hierarquia federativa), não de texto do decreto-lei.", "<b>Procedimento do tombamento compulsório (art. 9º).</b> Notificação ao proprietário para, em 15 dias, anuir ou impugnar. Sem impugnação, o diretor manda inscrever por despacho. Havendo impugnação, o órgão tem 15 dias para sustentar, e o <b>Conselho Consultivo decide em 60 dias</b>. Segundo o decreto-lei, a decisão do Conselho é <b>sem recurso</b> na via administrativa. Na prática, o controle judicial permanece (inafastabilidade da jurisdição, CF art. 5º, XXXV, de memória).", "<b>Efeitos para o proprietário (arts. 11 a 21).</b> O bem público tombado é inalienável por natureza, só transferível entre União, Estados e Municípios (art. 11). Transcrição no registro de imóveis (art. 13); o adquirente tem 30 dias para declarar a transferência, sob multa de 10% (art. 13, §1º). O bem <b>não pode sair do País</b> senão por curto prazo, para fins de intercâmbio cultural (art. 14). O proprietário <b>não pode destruir, demolir ou mutilar</b> a coisa, nem repará-la, pintá-la ou restaurá-la <b>sem prévia autorização</b> do órgão, sob multa de 50% do dano (art. 17); a autoridade responsável por bem público paga pessoalmente a multa (parágrafo único). Na vizinhança, sem autorização não se pode construir de modo que impeça ou reduza a visibilidade, nem colocar anúncios ou cartazes (art. 18).", "<b>Dever de conservar e dever do Poder Público (art. 19).</b> O proprietário que não tiver recursos para as obras de conservação deve comunicar a necessidade ao órgão. O órgão mandará executar as obras, <b>às expensas da União</b>, no prazo de seis meses, ou providenciará a desapropriação (§1º). Sem providência, o proprietário pode requerer o <b>cancelamento do tombamento</b> (§2º). Em urgência, o órgão executa as obras (§3º). Observação: o art. 22 (direito de preferência do poder público na alienação) foi <b>revogado</b> pelo CPC/2015. Indenização do tombamento, de memória: em regra não há, salvo se o ato esvaziar o conteúdo econômico do bem ou causar dano anormal, caso em que a indenização (ou a desapropriação indireta) é cabível.", "<b>Servidão administrativa, requisição e ocupação temporária.</b> <b>Servidão</b>: direito real público sobre bem alheio, para a execução de obra ou serviço público (passagem de linhas de transmissão, dutos, etc.); instituída por acordo ou sentença, <b>indenizada quando houver prejuízo</b>; o expropriante pode constituir servidões mediante indenização (DL 3.365, art. 40). <b>Requisição</b>: uso de bens ou serviços particulares em perigo público iminente (CF art. 5º, XXV, de memória), com indenização posterior se houver dano, e pode recair sobre móveis, imóveis e serviços. <b>Ocupação temporária</b> (DL 3.365, art. 36): o expropriante pode ocupar, durante as obras, <b>terrenos não edificados vizinhos</b>, com indenização por ação própria e prestação de caução, se exigida.", "<b>Desapropriação: fundamentos e competência (DL 3.365, arts. 1º a 4º).</b> Mediante declaração de utilidade pública, todos os bens podem ser desapropriados pela União, pelos Estados, Municípios, Distrito Federal e Territórios (art. 2º). Para desapropriar bens dos Estados, Municípios e DF pela União, ou bens dos Municípios pelos Estados, é necessária <b>autorização legislativa</b> (art. 2º, §2º, Lei 14.620/2023), dispensada se houver acordo entre os entes (§2º-A). Podem promover a desapropriação, mediante autorização expressa em lei ou contrato, concessionários (inclusive de PPP), permissionários, autorizatários e arrendatários, entidades públicas, entidades com funções delegadas e o contratado pelo poder público para obras de engenharia (art. 3º). A declaração pode abranger <b>área contígua necessária</b> ao desenvolvimento da obra e as zonas que se valorizarem extraordinariamente (art. 4º). Competência legislativa privativa da União sobre desapropriação (CF art. 22, II, de memória).", "<b>Utilidade pública (art. 5º), necessidade pública e interesse social.</b> Casos de utilidade pública: segurança nacional, defesa do Estado, socorro público em calamidade, salubridade pública, criação e melhoramento de centros de população, aproveitamento industrial de minas e jazidas, assistência pública, exploração de serviços públicos, abertura de vias, planos de urbanização e parcelamento do solo, distritos industriais, transporte coletivo, preservação de monumentos históricos e paisagens, edifícios públicos, cemitérios, estádios e aeródromos, entre outros (art. 5º, alíneas a a p). Já o <b>interesse social</b> (Lei 4.132/1962, arts. 1º e 2º) liga-se à justa distribuição da propriedade e ao bem-estar social: bem improdutivo, colônias e cooperativas agrícolas, manutenção de posseiros em terrenos urbanos (núcleos de mais de 10 famílias), casas populares, terras valorizáveis por obras públicas, proteção do solo e mananciais, turismo, áreas para comunidades indígenas, e outros.", "<b>Declaração e prazos de caducidade.</b> A utilidade pública é declarada por <b>decreto</b> do Presidente, Governador, Interventor ou Prefeito (art. 6º), e o Legislativo pode tomar a iniciativa, cabendo ao Executivo praticar os atos necessários (art. 8º). A declaração <b>não é discutida pelo Judiciário</b> quanto ao mérito: é vedado decidir se se verificam ou não os casos de utilidade pública (art. 9º). Prazo: a desapropriação deve efetivar-se mediante acordo ou ação judicial em <b>5 anos</b> da expedição do decreto, <b>caducando</b> a declaração; e só após <b>1 ano</b> pode ser renovada (art. 10). Na desapropriação por interesse social, o prazo é de <b>2 anos</b> (Lei 4.132, art. 3º). As autoridades podem ingressar nas áreas, inclusive com força policial se houver resistência, e respondem por excesso ou abuso (art. 7º).", "<b>Fase administrativa e oferta (arts. 10-A e 10-B).</b> Antes da ação, o poder público <b>notifica o proprietário</b> e apresenta oferta, com cópia do ato, planta ou descrição, valor da oferta e <b>prazo de 15 dias</b> para aceitar ou rejeitar; o <b>silêncio equivale à rejeição</b> (§1º). Aceita a oferta e paga a indenização, o acordo servirá de título para o registro (§2º). Rejeitada ou silenciada, segue a fase judicial (§3º). O proprietário pode optar por <b>mediação ou arbitragem</b>, indicando órgão ou instituição cadastrado (art. 10-B).", "<b>Fase judicial (arts. 11 a 30).</b> Foro da situação dos bens; a inicial leva a oferta do preço, o decreto e a planta (art. 13). <b>Imissão provisória</b> na posse: alegada a urgência e feito o depósito, o juiz a concede (art. 15); a urgência <b>não pode ser renovada</b> e deve ser requerida em até <b>120 dias</b>; excedido esse prazo, não se admite a imissão (art. 15, §§2º e 3º). A contestação só pode versar sobre <b>vício do processo judicial ou impugnação do preço</b>; qualquer outra questão deve ser decidida por ação direta (art. 20). A sentença fixa o preço, e o principal e os acessórios são calculados em parcelas autônomas (arts. 24 e 25). A indenização é <b>contemporânea à avaliação</b> (art. 26).", "<b>Indenização, juros e honorários (arts. 15-A, 15-B, 26, 27, 32 a 34-A).</b> <b>Juros compensatórios</b>: até <b>6% ao ano</b> sobre a diferença entre o preço ofertado e o valor da indenização, a contar da imissão na posse, vedado o cálculo composto (art. 15-A); só incidem se comprovados lucros cessantes, e não incidem nas desapropriações por descumprimento da função social (§1º). Valem para a desapropriação indireta (§2º). <b>Juros moratórios</b>: até 6% ao ano, a partir de 1º de janeiro do exercício seguinte àquele em que o pagamento deveria ser feito (art. 15-B). <b>Honorários</b>: de 0,5% a 5% sobre a diferença entre a oferta e a indenização, observado o limite do §1º do art. 27 (de memória, o limite nominal é objeto da ADI 2.332). Pagamento <b>prévio e em dinheiro</b> (art. 32). Depósito = pagamento prévio, e o expropriado pode levantar até 80% do depósito mesmo discordando do preço (art. 33, §2º). Concordância do expropriado, reduzida a termo, com imissão provisória, <b>transfere a propriedade</b> e permite o levantamento de 100% (art. 34-A), sem renúncia ao direito de discutir o preço.", "<b>Efeitos finais e retrocessão (arts. 28, 35 e 5º, §6º).</b> Apelação: só efeito devolutivo se interposta pelo expropriado; ambos os efeitos se pelo expropriante; duplo grau se a condenação superar o dobro da oferta (art. 28). Os bens incorporados ao patrimônio público <b>não podem ser reivindicados</b>, mesmo nulo o processo, e qualquer ação fundada em nulidade se resolve em perdas e danos (art. 35). Se o poder público desistir da finalidade, pode destiná-la a outra finalidade pública ou alienar o bem com <b>direito de preferência ao ex-proprietário</b> (art. 5º, §6º). <b>Desapropriação indireta</b> (apossamento sem o devido processo): o proprietário pode ajuizar ação de indenização, e o prazo prescricional é tema de jurisprudência do STJ (de memória, hoje tratado como decenal por analogia à usucapião extraordinária; <b>conferir</b>). <b>Retrocessão</b>: tratada pela doutrina como direito real ou pessoal, em debate; o texto do DL 3.365 (art. 5º, §6º) lhe dá feição de preferência."], "pega": ["<b>Provisório equiparado ao definitivo:</b> o tombamento provisório (a partir da notificação) produz, em regra, os mesmos efeitos do definitivo (DL 25, art. 10, p.ú.). Em questão da FGV (TJBA, 2026, juiz substituto), o proprietário notificado e antes da inscrição que demolia parcialmente o bem estava <b>sujeito provisoriamente às restrições</b>, e a alternativa certa foi a que dizia isso. Cuidado com as alternativas que dizem que as restrições só valem após a inscrição, ou que a duração do provisório é de 90 dias (o texto do decreto-lei não fixa esse prazo).", "<b>Tombamento não é bilateral:</b> o compulsório independe de concordância do proprietário (arts. 8º e 9º). Pegadinha comum: afirmar que exige anuência, ou lei da Assembleia, ou decreto expropriatório. É ato administrativo, de regra unilateral, com procedimento e direito de impugnação em 15 dias.", "<b>Conselho Consultivo decide em 60 dias, sem recurso administrativo</b> (art. 9º). Atenção à troca de prazos (15 dias para anuir ou impugnar; 15 dias para o órgão sustentar).", "<b>Tombamento de bem público:</b> o art. 5º diz que é de <b>ofício</b>, por ordem do diretor, com notificação à entidade, e o art. 11 torna os bens públicos tombados inalienáveis por natureza (só transferíveis entre União, Estados e Municípios). Não confunda com o bem privado, que admite tombamento voluntário ou compulsório.", "<b>Alteração do bem tombado exige autorização:</b> destruir, demolir ou mutilar é proibido; reparar, pintar ou restaurar exige prévia autorização (art. 17). Multa de 50% do dano. A comunicação prévia sem autorização não basta.", "<b>Quem paga a conservação?</b> O proprietário que não tem recursos comunica; o órgão manda executar às expensas da União em 6 meses, <b>ou desapropria</b>; se nada fizer, o proprietário pode pedir o cancelamento do tombamento (art. 19). Não é correto dizer que o proprietário sempre custeia, nem que o tombamento gera sempre indenização.", "<b>Direito de preferência na venda de bem tombado:</b> o art. 22 foi revogado pelo CPC/2015. Alternativa que afirma que o poder público tem preferência pela via do DL 25 está desatualizada.", "<b>Judiciário e a declaração de utilidade pública:</b> é vedado decidir se se verificam os casos de utilidade pública (art. 9º). O Judiciário pode examinar vício do processo e o preço (art. 20), e, em ação direta, outras questões. Atenção à redação: <b>mérito do decreto</b> não se discute na ação de desapropriação, mas desvio de finalidade é controlável por ação própria.", "<b>Prazos de caducidade:</b> utilidade pública = 5 anos; interesse social = 2 anos (Lei 4.132, art. 3º); só após 1 ano pode haver nova declaração para o mesmo bem (art. 10). Banca troca os prazos.", "<b>Imissão provisória:</b> exige urgência alegada e depósito; urgência não se renova e deve ser requerida em até 120 dias (art. 15, §2º); depósito pelo valor do art. 15, §1º. Não é a mesma coisa que o levantamento (art. 33, §2º: até 80% mesmo discordando do preço).", "<b>Juros compensatórios:</b> até 6% ao ano, sobre a <b>diferença</b> entre a oferta e a indenização, a partir da imissão, <b>sem anatocismo</b>, e só com lucros cessantes comprovados (art. 15-A). Juros moratórios: até 6% ao ano, a partir de 1º de janeiro do exercício seguinte ao em que o pagamento deveria ter sido feito (art. 15-B).", "<b>Indenização abrange o que existe:</b> em questão do TRF6 (juiz substituto, 2025, gabarito preliminar), a descoberta de depósito de granito em área rural, sem título de lavra, levou à resposta de que a indenização abrange a <b>terra nua e as benfeitorias</b>, não o depósito natural. O subsolo mineral pertence à União e sua exploração depende de título. A banca induz o candidato a incluir a jazida.", "<b>Honorários e fase administrativa:</b> a lei fixa faixa de 0,5% a 5% sobre a diferença; a oferta do art. 10-A tem 15 dias e o silêncio é rejeição, não aceitação.", "<b>Imposto de renda sobre a indenização:</b> em questão do TJPE (2026, gabarito preliminar), a resposta correta foi a de que <b>não incide IR</b> sobre a indenização de desapropriação, pela natureza indenizatória, sem acréscimo patrimonial. Pelo meu conhecimento (memória), a jurisprudência do STF e do STJ segue essa linha; confira antes da prova.", "<b>Bem incorporado não é reivindicável</b> (art. 35): mesmo que a desapropriação seja nula, o dono lesado só tem perdas e danos. Alternativa que fala em reintegração do bem incorporado é errada.", "<b>Servidão x limitação:</b> servidão incide sobre bem determinado e, havendo prejuízo, é indenizada; limitação administrativa é geral e, em regra, não é indenizada. A banca descreve a situação sem usar o rótulo."]}, {"materia": "DIREITO CIVIL", "titulo": "Direito de Família: casamento, união estável, parentesco e filiação, poder familiar, regimes de bens, dissolução, alimentos e bem de família (CC, arts. 1.511 a 1.727)", "key": "CIV", "nome": "Civil", "conc": ["Edital: item 5 de Direito Civil. Li <b>literalmente</b>, no navegador (Planalto, texto compilado): <b>CC, arts. 1.511 a 1.727</b> (todo o Livro IV, exceto a tutela, a curatela e a tomada de decisão apoiada, arts. 1.728 e seguintes). <b>Não li</b> as leis especiais: Lei 5.478/1968 (ação de alimentos), Lei 6.515/1977 (divórcio), Lei 8.560/1992 (investigação de paternidade), Lei 8.009/1990 (bem de família legal) e o ECA. A ADI 4.277, a ADPF 132, a Resolução CNJ 175/2013 e os Temas 498, 809, 1.053 e 1.236 do STF vêm <b>da minha memória</b>. Alguns incisos revogados do compilado do Planalto foram filtrados por mim, e a coexistência de textos antigos e novos no CC (ex.: separação judicial) mereceu cautela.", "<b>Casamento: celebração e habilitação.</b> A comunhão plena de vida é estabelecida pelo casamento (art. 1.511). É civil, ou religioso com efeitos civis se registrado (art. 1.515). Habilitação: o MP é ouvido, os proclamas são publicados por <b>15 dias</b>, e o certificado de habilitação tem <b>eficácia de 90 dias</b> (arts. 1.525 a 1.532). Celebração com duas testemunhas (art. 1.534), ou <b>seis</b> em caso de iminente risco de vida (art. 1.540); procuração por instrumento público, eficaz por 90 dias (art. 1.542).", "<b>Capacidade, impedimentos e causas suspensivas.</b> Idade núbil é de 16 anos com autorização dos pais (art. 1.517), e o art. 1.520 não permite mais o casamento antes da idade núbil (Lei 13.811/2019, sem exceção). <b>Impedimentos</b> (art. 1.521): ascendentes com descendentes; afins em linha reta; adotante com quem foi cônjuge do adotado e adotado com o cônjuge do adotante; irmãos e colaterais até o terceiro grau; pessoas casadas; cônjuge sobrevivente com condenado por homicídio ou tentativa contra o consorte. <b>Causas suspensivas</b> (art. 1.523): viúvo ou viúva com filho do falecido antes do inventário e partilha; a viúva ou mulher cujo casamento se desfez, até dez meses depois; o divorciado, enquanto não houver partilha; tutor ou curador com a pessoa tutelada ou curatelada. Pode-se provar a inexistência de prejuízo para afastá-las (parágrafo único).", "<b>Invalidade.</b> <b>Nulo</b> o casamento contraído com infringência de impedimento (art. 1.548, após a revogação do inciso I pelo Estatuto da Pessoa com Deficiência), e a ação pode ser proposta por qualquer interessado ou pelo MP (art. 1.549). <b>Anulável</b> (art. 1.550): idade mínima, menor sem autorização, vício da vontade, incapaz de consentir, mandatário sem ciência da revogação, incompetência da autoridade. A pessoa com deficiência mental ou intelectual em idade núbil pode contrair matrimônio (§2º). Prazos decadenciais (art. 1.560): 180 dias, 2, 3 e 4 anos conforme a hipótese. <b>Casamento putativo</b> (art. 1.561): produz efeitos para o cônjuge de boa-fé, e para os filhos, até a sentença.", "<b>Efeitos do casamento (arts. 1.565 e 1.566).</b> Marido e mulher são <b>consortes, companheiros e responsáveis</b> pelos encargos da família. Qualquer dos nubentes pode acrescer o sobrenome do outro (§1º). O planejamento familiar é de livre decisão do casal (§2º). Deveres: fidelidade recíproca, vida em comum no domicílio conjugal, mútua assistência, sustento, guarda e educação dos filhos, respeito e consideração mútuos.", "<b>Dissolução (arts. 1.571 a 1.582).</b> A sociedade conjugal termina pela morte de um dos cônjuges, pela nulidade ou anulação, pela separação judicial e pelo divórcio, e o casamento válido só se dissolve pela morte ou pelo divórcio (§1º). O texto do CC ainda trata da separação judicial; a EC 66/2010 e a jurisprudência (STF, Tema 1.053, memória) tornaram o divórcio direto e dispensaram prazo e culpa, sem excluir de modo absoluto a figura da separação. O divórcio <b>não modifica os direitos e deveres dos pais</b> em relação aos filhos (art. 1.579). O art. 1.581 diz que o divórcio pode ser concedido <b>sem que haja prévia partilha</b> de bens. Só aos cônjuges cabe a ação de dissolução (art. 1.582).", "<b>Guarda (arts. 1.583 a 1.590).</b> Pode ser unilateral ou compartilhada. Na compartilhada, o tempo de convívio é dividido de forma equilibrada, com a cidade-base fixada pelo critério do melhor interesse dos filhos. Se não houver acordo, aplica-se a <b>guarda compartilhada</b>, salvo se um dos genitores declarar que não a deseja ou houver elementos que evidenciem risco de violência (art. 1.584, §2º). Estabelecimentos devem prestar informações a qualquer dos genitores, sob multa de R$ 200 a R$ 500 por dia (art. 1.584, §6º). O direito de visitas pode ser estendido aos avós (art. 1.589).", "<b>Parentesco e filiação (arts. 1.591 a 1.617).</b> Linha reta (ascendentes e descendentes, sem limite) e colateral (até o <b>4º grau</b>), natural ou civil. Afinidade: liga um cônjuge aos parentes do outro; na linha reta, não se extingue com a dissolução do casamento. Filhos, havidos ou não da relação de casamento, ou por adoção, têm os mesmos direitos, proibidas designações discriminatórias (art. 1.596). <b>Presunção de paternidade</b> (art. 1.597): nascidos 180 dias depois de estabelecida a convivência ou 300 dias após a dissolução; fecundação homóloga, mesmo falecido o marido; embriões excedentários; <b>inseminação heteróloga</b> com prévia autorização do marido. A ação negatória é imprescritível (art. 1.601). O reconhecimento é <b>irrevogável</b> (art. 1.609) e pode preceder o nascimento; o maior só pode ser reconhecido com seu consentimento, e o menor pode impugnar nos 4 anos seguintes à maioridade (art. 1.614). Sobre a multiparentalidade e a paternidade socioafetiva (Tema 622 do STF), uso a memória: não li o texto do tema.", "<b>Poder familiar (arts. 1.630 a 1.638).</b> Os filhos estão sujeitos ao poder familiar enquanto menores; compete aos pais dirigir a criação e a educação, ter os filhos em sua companhia e guarda, conceder ou negar consentimento para casar, nomear tutor, representar até os 16 anos e assistir após, reclamá-los de quem os detenha ilegalmente (art. 1.634). <b>Extinção</b> (art. 1.635): morte dos pais ou do filho, emancipação, maioridade, adoção e decisão judicial. <b>Suspensão</b> (art. 1.637): abuso de autoridade, falta aos deveres, ruína dos bens, condenação por pena superior a 2 anos de prisão. <b>Perda</b> (art. 1.638): castigo imoderado, abandono, atos contrários à moral e aos bons costumes, reiteração das faltas, entrega irregular a terceiros para adoção, e crimes dolosos graves contra outro titular do poder familiar ou contra filho.", "<b>Regime de bens: regras gerais (arts. 1.639 a 1.652).</b> É lícito aos nubentes estipular o que lhes aprouver; o regime começa a vigorar a partir do casamento, e a alteração depende de <b>autorização judicial</b>, com pedido motivado de ambos, ressalvados os direitos de terceiros (art. 1.639, §2º). Sem convenção, ou se for nula ou ineficaz, vigora a <b>comunhão parcial</b> (art. 1.640). O pacto antenupcial exige <b>escritura pública</b> (art. 1.653 e 1.640, p.ú.) e fica ineficaz se não seguir o casamento; só vale perante terceiros após registro no Registro de Imóveis (art. 1.657). <b>Separação obrigatória</b> (art. 1.641): pessoas que contraírem casamento com inobservância das causas suspensivas, maiores de 70 anos e os que dependerem de suprimento judicial. A outorga do cônjuge (art. 1.647) é necessária, salvo no regime de separação absoluta, para alienar ou gravar bens imóveis, pleitear sobre eles, prestar fiança ou aval e fazer doação não remuneratória de bens comuns; a falta torna o ato anulável em 2 anos (art. 1.649).", "<b>Espécies de regime.</b> <b>Comunhão parcial</b> (arts. 1.658 a 1.666): comunicam-se os bens adquiridos na constância do casamento a título oneroso; excluem-se os bens anteriores, os doados ou herdados, as obrigações anteriores e os bens de uso pessoal (art. 1.659). Entram na comunhão os bens adquiridos por fato eventual, os por doação em favor de ambos e os frutos (art. 1.660). <b>Comunhão universal</b> (arts. 1.667 a 1.671): tudo se comunica, com as exceções do art. 1.668. <b>Participação final nos aquestos</b> (arts. 1.672 a 1.686): cada cônjuge tem patrimônio próprio e, na dissolução, direito à metade do que foi adquirido onerosamente na constância. <b>Separação</b> (arts. 1.687 e 1.688): bens permanecem sob a administração exclusiva de cada um, e ambos contribuem para as despesas na proporção dos rendimentos.", "<b>Alimentos (arts. 1.694 a 1.710).</b> Parentes, cônjuges ou companheiros podem pedir uns aos outros os alimentos de que necessitem para viver de modo compatível com a condição social. Proporcionalidade entre a <b>necessidade</b> de quem pede e a <b>possibilidade</b> de quem paga (art. 1.694, §1º). O direito é recíproco entre pais e filhos (art. 1.696) e, na falta, a obrigação recai nos ascendentes e depois nos colaterais até o 2º grau (art. 1.697). A obrigação transmite-se aos herdeiros (art. 1.700). Direito <b>irrenunciável</b>, insuscetível de cessão, compensação ou penhora, embora o credor possa não exercê-lo (art. 1.707); cessa pelo casamento, união estável ou concubinato do credor (art. 1.708). Atualização por índice oficial (art. 1.710). A prisão civil do devedor é matéria do CPC e da Lei 5.478/1968, não lida.", "<b>Bem de família convencional (arts. 1.711 a 1.722).</b> Pode ser instituído por escritura pública ou testamento, até <b>um terço do patrimônio líquido</b> existente ao tempo da instituição (art. 1.711); a instituição se dá pelo <b>registro</b> no Registro de Imóveis (art. 1.714). Isenta de execução por dívidas posteriores, salvo tributos relativos ao prédio, ou despesas de condomínio (art. 1.715). Dura enquanto viver um dos cônjuges ou, na falta destes, até que os filhos completem a maioridade (art. 1.716). A extinção e a sub-rogação dependem de autorização judicial e de oitiva do MP (art. 1.719). Não confundir com o bem de família <b>legal</b> da Lei 8.009/1990, que não li; as exceções à impenhorabilidade (de memória) são tema recorrente, mas não verifiquei o texto.", "<b>União estável (arts. 1.723 a 1.727).</b> É reconhecida a união entre pessoas como entidade familiar, configurada pela convivência <b>pública, contínua e duradoura</b> e estabelecida com o objetivo de constituir família. O texto do CC fala em homem e mulher, mas o STF (ADI 4.277 e ADPF 132) e a Res. CNJ 175/2013 reconhecem a união homoafetiva (memória). Não constituem união estável as pessoas impedidas de casar (art. 1.723, §1º), com a ressalva da pessoa casada separada de fato ou judicialmente; as causas suspensivas não impedem a configuração (§2º). Salvo contrato escrito, aplica-se a <b>comunhão parcial</b> (art. 1.725). A conversão em casamento é pedida ao juiz e assentada no registro civil (art. 1.726). <b>Concubinato</b>: as relações não eventuais entre pessoas impedidas de casar (art. 1.727). Equiparação sucessória entre cônjuge e companheiro: STF, Tema 809 (memória, RE 878.694)."], "pega": ["<b>Divórcio sem partilha é válido:</b> em questão da FGV (TJPE, 2026), o casal em comunhão parcial lavrou escritura pública de divórcio consensual sem partilha, e a alternativa correta foi a de que a ausência de partilha não compromete a validade nem a eficácia do divórcio, podendo a divisão patrimonial ser feita depois (CC, art. 1.581). A banca monta alternativas dizendo que a partilha é condição de eficácia ou que o regime de bens permanece.", "<b>Presunção de paternidade na inseminação heteróloga:</b> exige <b>prévia autorização do marido</b> (art. 1.597, V); na homóloga, vale mesmo se o marido falecido (inciso III). Cuidado com a ordem das situações.", "<b>Prazos de 180 e 300 dias:</b> o nascimento nos 180 dias após estabelecida a convivência conjugal e nos 300 dias seguintes à dissolução presume a paternidade; não troque.", "<b>Reconhecimento de filho é irrevogável</b> (art. 1.609) e <b>pode preceder o nascimento</b> (parágrafo único). O filho maior só é reconhecido com o seu consentimento, e o menor tem 4 anos após a maioridade para impugnar (art. 1.614).", "<b>Impedimentos x causas suspensivas:</b> impedimento = nulidade (art. 1.548, II); causa suspensiva = casamento válido, mas com regime obrigatório de separação (art. 1.641, I). Parentesco colateral impede até o 3º grau (tio e sobrinha). A banca troca 'impedimento' por 'causa suspensiva' para que o candidato conclua pela nulidade.", "<b>Maior de 70 anos:</b> separação obrigatória (art. 1.641, II). Em sucessão, a banca pode questionar se o cônjuge concorre com descendentes (de memória: STJ e STF debatem a Súmula 377 e a situação do separado obrigatório); verifique a literalidade e a jurisprudência atual antes da prova.", "<b>Alteração de regime de bens:</b> pedido <b>motivado de ambos</b>, com autorização judicial, resguardados direitos de terceiros (art. 1.639, §2º). Não basta escritura pública nem ser apenas um dos cônjuges quem pede.", "<b>Pacto antenupcial:</b> escritura pública, sob pena de nulidade; ineficaz se o casamento não se realizar; efeitos perante terceiros só após o registro imobiliário (arts. 1.653 e 1.657).", "<b>Outorga conjugal:</b> exigida para alienar imóveis, fiança e aval, doação não remuneratória; não é exigida na separação absoluta; falta = anulável em 2 anos (arts. 1.647 e 1.649). Quem pode pleitear a anulação é o cônjuge prejudicado (ou seus herdeiros), não o terceiro.", "<b>Comunhão parcial:</b> bens adquiridos <b>antes</b> do casamento, doados ou herdados <b>não</b> se comunicam; os adquiridos onerosamente na constância, sim (arts. 1.659 e 1.660). Questão do TJMS (2026) apresentou doação de casa pública em programa de governo a casados em comunhão parcial para testar a comunicabilidade; não verifiquei o gabarito.", "<b>Alimentos:</b> o direito é <b>irrenunciável</b>, mas o credor pode deixar de exercê-lo; a obrigação <b>transmite-se aos herdeiros</b> (art. 1.700); cessa com casamento, união estável ou concubinato do credor (art. 1.708). Atenção: 'renúncia' (inválida) x 'não exercício' (válido).", "<b>Guarda compartilhada é a regra</b> se não houver acordo, salvo declaração de um dos pais de que não deseja a guarda ou risco de violência (art. 1.584, §2º). Pegadinha: guarda unilateral como regra.", "<b>Perda x suspensão do poder familiar:</b> castigo imoderado, abandono, atos contrários à moral, reiteração e crimes graves = perda; abuso de autoridade, falta aos deveres e condenação superior a 2 anos = suspensão. A emancipação extingue o poder familiar.", "<b>Bem de família convencional:</b> máximo de 1/3 do patrimônio líquido; constituição pelo registro; isenção não vale para tributos do prédio e condomínio; dura enquanto viver um dos cônjuges ou até a maioridade dos filhos. Não confunda com o bem de família legal da Lei 8.009 (não lido).", "<b>União estável:</b> sem contrato escrito, comunhão parcial (art. 1.725). A conversão em casamento é por pedido ao juiz e registro (art. 1.726). A união com pessoa casada e separada de fato pode configurar união estável (art. 1.723, §1º); com pessoa casada e não separada, o caso é concubinato (art. 1.727).", "<b>Casamento putativo:</b> boa-fé de um ou de ambos; produz efeitos até a sentença e favorece o cônjuge de boa-fé e os filhos (art. 1.561). A sentença de nulidade retroage, ressalvados os efeitos do putativo (art. 1.563)."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Precatórios e requisições de pequeno valor: CF art. 100, EC 136/2025, Lei municipal 10.235/2001 e decretos de atualização do limite", "key": "TRI", "nome": "Tributário", "conc": ["Edital: item 16 de Direito Tributário (precatórios e RPV no âmbito municipal). Li <b>literalmente</b>, no navegador: <b>Lei Municipal 10.235/2001 inteira (arts. 1º a 7º)</b>; os <b>Decretos Municipais 789/2025, 1.346/2025 e 2.674/2025</b> (apenas o valor do limite e os efeitos financeiros); a <b>EC 136/2025 inteira</b> e o <b>art. 100 da CF consolidado (§§ 1º a 30)</b> no Planalto. <b>Não li</b> o ADCT em sua integralidade (apenas os dispositivos alterados pela EC 136: arts. 97, §§16 e 16-A, 101, §6º, 76-B, 115 a 117), a Lei 12.153/2009, o CPC (arts. 534 e 535, 910) nem as resoluções do CNJ sobre precatórios. Súmulas, temas do STF e acórdãos citados vêm <b>da minha memória</b> e não foram conferidos.", "<b>Regra constitucional (CF art. 100).</b> Os pagamentos devidos pelas Fazendas Públicas, em virtude de sentença judiciária, far-se-ão exclusivamente na ordem cronológica de apresentação dos precatórios e à conta dos créditos respectivos, vedada a designação de pessoas ou casos nas dotações orçamentárias. As exceções são as <b>obrigações de pequeno valor</b> (§3º), pagas sem precatório. A cessão de crédito independe da concordância do devedor (§13) e só produz efeitos após comunicação, por petição protocolizada, ao tribunal de origem e à entidade devedora (§14).", "<b>Créditos alimentares e preferências (art. 100, §§1º e 2º).</b> São de natureza alimentícia os créditos de salários, vencimentos, proventos, pensões e suas complementações, benefícios previdenciários e indenizações por morte ou invalidez, fundadas em responsabilidade civil, em virtude de sentença transitada em julgado. A EC 136/2025 incluiu aí a relação laboral ou previdenciária <b>independente da natureza tributária</b> e a repetição de indébito sobre remuneração e proventos. Os créditos alimentares têm preferência sobre todos os demais, <b>exceto</b> os de titulares com <b>60 anos ou mais</b>, portadores de <b>doença grave</b> ou pessoas com deficiência, definidos na forma da lei, que têm <b>superpreferência</b> até o <b>triplo do limite de RPV</b> (§2º); o restante do crédito é pago na ordem cronológica comum.", "<b>Inclusão no orçamento e prazo (art. 100, §5º).</b> É obrigatória a inclusão no orçamento das entidades de direito público de verba necessária ao pagamento dos precatórios <b>apresentados até 1º de fevereiro</b> (a EC 136/2025 fixou esta data; antes era 2 de abril, EC 114/2021), fazendo-se o pagamento até o <b>final do exercício seguinte</b>, com atualização monetária. A omissão e a preterição geram o <b>sequestro</b> da quantia necessária (§6º), e o Presidente do Tribunal que retardar ou tentar frustrar a liquidação regular responde por <b>crime de responsabilidade</b> e pelo crime comum (§7º). É <b>vedada a expedição de precatórios complementares ou suplementares</b> de valor pago, bem como o fracionamento, a repartição ou a quebra do valor da execução para fins de enquadramento (§8º).", "<b>Compensação com débitos do credor (art. 100, §9º, redação da EC 113/2021).</b> Sem interromper o pagamento, os débitos inscritos em dívida ativa contra o credor do precatório devem ser <b>depositados à conta do juízo responsável pela cobrança</b>. A antiga compensação automática do §9º foi afastada (ADI 4.425, de memória). Os §§11 e 21 tratam da <b>oferta de créditos em precatórios</b> para quitar débitos parcelados ou inscritos em dívida ativa, comprar imóveis públicos, outorgas, participação societária e outros direitos, e de amortização de dívidas, e o §26 diz que os pagamentos feitos assim <b>não contam</b> no limite do §23.", "<b>Valores distintos por ente (art. 100, §§3º e 4º).</b> Os débitos de pequeno valor são definidos por <b>lei do próprio ente federado</b>, e o limite não pode ser inferior ao valor do maior benefício do regime geral de previdência social (§4º). Para os Municípios, enquanto não houver lei própria, o ADCT, art. 87, de memória, estabelecia como valor o de 30 salários mínimos para os Municípios; <b>não li</b> o ADCT, art. 87, nesta sessão. O Município de Curitiba tem lei própria.", "<b>Lei Municipal 10.235/2001 (Curitiba).</b> O art. 1º define como RPV os débitos da administração direta, das autarquias e fundações de Curitiba, decorrentes de <b>sentença transitada em julgado</b>, de valor até o limite fixado (R$ 5.181,00 no texto original, atualizado por decreto). O limite é aferido na data em que os cálculos se tornarem <b>incontroversos</b>, de forma individualizada por ação judicial (§1º). É <b>vedado o fracionamento, repartição ou quebra</b> do valor total, controvertido ou incontroverso, <b>ressalvado o art. 23 da Lei 8.906/1994</b> (honorários advocatícios reconhecidos em juízo) (§2º). É vedado precatório complementar ou suplementar do valor pago na forma do caput (§3º). O credor pode <b>renunciar ao excedente</b> para optar pelo RPV (§4º), e o pagamento sem precatório implica <b>quitação total</b> do crédito (§5º).", "<b>Trâmite do RPV em Curitiba (arts. 2º a 5º).</b> O pagamento é feito, no juízo da execução, a requerimento do credor, no prazo de <b>90 dias</b>, contados do recebimento da requisição pela Procuradoria Geral do Município (art. 2º). O credor apresenta a certidão de trânsito em julgado e a demonstração de liquidez e exigibilidade (§1º) e, havendo excedente, a <b>renúncia expressa</b> (§2º). Constatada a regularidade formal e material, a PGM remete a requisição à Secretaria Municipal de Finanças ou à entidade devedora para o pagamento (art. 3º). Os créditos já inscritos em precatório, de valor não superior ao limite, são pagos integralmente, pela ordem cronológica de apresentação, na categoria própria, <b>sem parcelamento</b> (art. 4º; referência ao ADCT, art. 78). O valor pode ser revisto anualmente pelo Executivo e publicado no Diário Oficial (art. 5º).", "<b>Limite atual em Curitiba.</b> O Decreto 789/2025 (19/02/2025) fixou o limite em <b>R$ 8.157,41</b>, e o Decreto 1.346/2025 (30/05/2025) esclareceu que alcança a administração direta, autarquias e fundações, com efeitos financeiros a partir de 1º/01/2025. O <b>Decreto 2.674/2025</b> (19/12/2025) fixou o limite em <b>R$ 8.537,55</b>, com efeitos a partir de 1º/01/2026. A vigência da Lei 10.235 (art. 7º): publicação, e os arts. 1º a 3º a partir de 1º/02/2002.", "<b>EC 136/2025: limites de pagamento (art. 100, §§23 a 30).</b> O pagamento de precatórios por Estados, DF e Municípios fica limitado a um percentual da <b>receita corrente líquida</b> do ente, conforme a faixa que o estoque de precatórios representa em relação à RCL: até 15% (ou sem estoque), <b>1%</b>; de 15 a 25%, 1,5%; de 25 a 35%, 2%; de 35 a 45%, 2,5%; de 45 a 55%, 3%; de 55 a 65%, 3,5%; de 65 a 75%, 4%; de 75 a 85%, 4,5%; acima de 85%, <b>5%</b> (§23). A partir de 1º/01/2036, e a cada 10 anos, o percentual aumenta 0,5 ponto, se houver estoque (§24). Descumprido o repasse, suspendem-se os limites, faz-se o <b>sequestro</b> pelo Presidente do TJ, o chefe do Executivo responde (LRF e improbidade) e ficam vedadas transferências voluntárias (§27). O ente pode pagar acima do limite com dotação específica (§28). Os recursos aportados nas contas especiais são excluídos do estoque (§30).", "<b>Acordo direto e atualização (EC 136, art. 100, §29; ADCT, art. 97, §§16 e 16-A).</b> O credor pode firmar <b>acordo direto</b> perante os Juízos Auxiliares de Conciliação de Precatórios, com pagamento em <b>parcela única</b> até o final do exercício seguinte, com renúncia (aplicável aos não pagos por força dos §§20 e 23). Quanto à atualização, a partir de <b>1º/08/2025</b> os requisitórios de Estados, DF e Municípios são atualizados pelo <b>IPCA</b>, acrescido de <b>juros simples de 2% ao ano</b>, sem juros compensatórios; se a Selic for superior, aplica-se a Selic (§16-A). O art. 8º da EC 136 estende o §23 até aos precatórios inscritos antes da promulgação.", "<b>Regimes anteriores (memória).</b> A EC 62/2009 (regime especial e correção pela poupança) foi declarada inconstitucional pelas ADIs 4.357 e 4.425, e o STF fixou as teses sobre juros e correção (Tema 810, de memória). A EC 113/2021 substituiu o índice por Selic e a EC 136/2025 o trocou por IPCA mais juros de 2% a.a. A EC 94/2016 criou o regime especial do ADCT, art. 101, e a EC 136/2025 manda aplicar a ele os §§23 a 30 do art. 100 (ADCT, art. 101, §6º).", "<b>Prescrição e outros pontos (memória).</b> A prescrição das dívidas da Fazenda Pública é de 5 anos (Decreto 20.910/1932; Súmula 150 do STF para a execução). Os juros de mora entre a data dos cálculos e a expedição do precatório não incidem se pagos no prazo constitucional (Súmula Vinculante 17). A EC 136 também alterou a desvinculação de receitas municipais (ADCT, art. 76-B). Não verifiquei esses itens no texto."], "pega": ["<b>Superpreferência é dos alimentares com 60 anos, doença grave ou deficiência:</b> o idoso que completa 60 anos <b>depois</b> da expedição também tem direito à prioridade (jurisprudência do STF/STJ, memória). Em questão do TRF6 (2025, gabarito preliminar), o município sustentou que a preferência só alcançaria quem já tinha 60 anos na expedição, e a resposta correta foi a de que o credor portador de doença grave tem preferência no pagamento, em limite fixado em lei, por previsão constitucional. A banca troca o momento da condição e a hierarquia entre idoso e doente grave (não há hierarquia entre eles: todos estão no §2º).", "<b>Compensação tributária contra precatório:</b> a compensação automática foi afastada, e hoje se deposita à conta do juízo da cobrança (art. 100, §9º). A alternativa que admite a compensação 'em favor da Fazenda, pela supremacia do interesse público' é errada.", "<b>Remuneração pela poupança:</b> declarada inconstitucional para atualização monetária (ADIs 4.357/4.425, memória). Hoje: IPCA mais 2% a.a. de juros simples para os entes subnacionais, desde 1º/08/2025 (ADCT, art. 97, §16, e §16-A com a Selic).", "<b>Data de apresentação:</b> até <b>1º de fevereiro</b> (EC 136); a banca pode usar 2 de abril (EC 114). Pagamento até o final do exercício seguinte.", "<b>Limite do RPV em Curitiba muda por decreto:</b> R$ 8.157,41 (2025) e R$ 8.537,55 (a partir de 1º/01/2026); R$ 5.181,00 é o valor original da lei. Se a questão indicar a data, confira qual decreto estava vigente.", "<b>Aferição do limite:</b> na data em que os cálculos se tornarem <b>incontroversos</b>, por ação judicial (Lei 10.235, art. 1º, §1º), não na data do ajuizamento nem do trânsito em julgado.", "<b>Fracionamento:</b> vedado (CF art. 100, §8º; Lei 10.235, art. 1º, §2º). Ressalva: os <b>honorários advocatícios</b> reconhecidos em juízo (art. 23 da Lei 8.906/1994) podem ser tratados à parte. A banca costuma dizer que o fracionamento é permitido para enquadrar no RPV (errado).", "<b>Renúncia ao excedente</b> permite optar pelo RPV, mas o pagamento por RPV é <b>quitação total</b> (§5º): não sobra saldo a cobrar. Também é vedado precatório complementar do valor pago.", "<b>Prazo de 90 dias</b> para pagar o RPV conta-se do recebimento da requisição pela <b>PGM</b>, não da data do trânsito em julgado.", "<b>Precatório já inscrito até o valor do limite</b> (Lei 10.235, art. 4º): paga-se integralmente, pela ordem cronológica, <b>sem parcelamento</b>; não precisa converter em RPV.", "<b>Sequestro:</b> cabe em caso de preterição ou de não alocação orçamentária (art. 100, §6º) e, pela EC 136, quando os recursos do limite não são liberados (§27). O sequestro não é a sanção para qualquer atraso.", "<b>Cessão de precatório:</b> independe de anuência do devedor, mas só produz efeitos após <b>comunicação ao tribunal e à entidade devedora</b> (§§13 e 14). A banca omite a comunicação.", "<b>Natureza alimentar:</b> a EC 136 incluiu a repetição de indébito sobre remuneração e proventos e a relação laboral ou previdenciária independente da natureza tributária. A banca diz que crédito tributário nunca é alimentar; a regra de 2025 muda o raciocínio apenas nesses casos.", "<b>Acordo direto (§29):</b> parcela única, até o final do exercício seguinte, com renúncia; para os precatórios não pagos nos termos dos §§20 e 23. Não é desconto livre e não depende do ente.", "<b>Faixas do §23:</b> o percentual sobe com o estoque (1% a 5% da RCL). Pegadinha: inverter a lógica (menos estoque, mais percentual)."]}, {"materia": "DIREITO ADMINISTRATIVO", "titulo": "Agentes públicos: regime constitucional, concurso, ingresso em Curitiba (Lei 16.639/2025, Decreto 1.292/2026), Estatuto (Lei 1.656/1958) e regime disciplinar (Decreto 868/2024)", "key": "ADM2", "nome": "Administrativo II", "conc": ["Edital: item 13 de Direito Administrativo (agentes públicos). Li <b>literalmente</b>, no navegador (leis.org e Planalto): <b>Decreto Municipal 1.292/2026 inteiro</b> (arts. 1º a 47); <b>Lei Municipal 16.639/2025 inteira</b> (arts. 1º a 45); <b>Decreto Municipal 868/2024 inteiro</b> (Regimento da Corregedoria Geral, 80 artigos); da <b>Lei 1.656/1958 (Estatuto)</b>, os arts. 1º a 107 e 193 a 269 (todo o regime disciplinar). <b>Não li</b> os arts. 108 a 192 do Estatuto (aposentadoria, vencimentos, gratificações, diárias, licenças e férias), a Constituição (arts. 37 a 41), a Lei 8.112/1990 e a Lei 14.133/2021. O texto do Estatuto na internet mostra redações antigas e novas lado a lado, e identifiquei a vigente pela ordem das alterações e pela revogação do art. 45 da Lei 16.639. Súmulas e temas do STF citados vêm <b>da memória</b>.", "<b>Regime constitucional (memória).</b> Os cargos, empregos e funções são acessíveis aos brasileiros que preencham os requisitos da lei e aos estrangeiros na forma da lei (CF art. 37, I). A investidura em cargo ou emprego depende de <b>concurso público</b> de provas ou de provas e títulos, ressalvadas as nomeações para cargo em comissão de livre nomeação e exoneração (art. 37, II). O prazo de validade do concurso é de até <b>2 anos, prorrogável uma vez por igual período</b> (art. 37, III). Estabilidade: <b>3 anos</b> de efetivo exercício, com avaliação especial de desempenho (art. 41, EC 19/1998). Acumulação remunerada: vedada, salvo as hipóteses do art. 37, XVI, com compatibilidade de horários. Não li esses dispositivos nesta sessão.", "<b>Cargo público no Estatuto (Lei 1.656/1958, arts. 1º a 4º).</b> Funcionário é a pessoa legalmente investida em cargo público (art. 1º). Cargo é o criado por <b>lei</b>, com número certo, denominação própria e pago pelo Tesouro do Município (art. 2º), criado por lei por proposta do Prefeito (art. 3º), em carreira ou isolado (art. 4º). O provimento se dá por decreto do Prefeito (art. 9º), por nomeação, promoção, transferência, reintegração, reversão, readmissão e aproveitamento (art. 10). A readaptação e a reintegração têm capítulos próprios. A nomeação pode ser de caráter efetivo (com estágio probatório), em comissão, interina ou em substituição (art. 12).", "<b>Estágio probatório e estabilidade: confronto com a Constituição.</b> No texto do Estatuto, o estágio probatório é de <b>2 anos</b> (provimento por concurso) ou 5 anos (sem concurso) (art. 13), e a estabilidade é adquirida em 2 anos (concurso) ou 5 (sem concurso) (arts. 106 e 107). Esses prazos <b>conflitam com a CF, art. 41</b> (3 anos, EC 19/1998), e a prova deve indicar se pede o texto do Estatuto ou a regra constitucional. A perda do cargo estável exige sentença judicial transitada em julgado, processo administrativo com ampla defesa, ou procedimento de avaliação periódica (CF, de memória). Para os agentes em estágio, a Lei Municipal 16.037/2022 institui o PAD-Especial e o Processo de Exoneração (PEX), regidos no Regimento da Corregedoria (arts. 46 a 49 do Decreto 868/2024); não li a Lei 16.037 diretamente.", "<b>Concurso em Curitiba (Lei 16.639/2025 e Decreto 1.292/2026).</b> O concurso público é para <b>cargo efetivo estatutário</b>; o processo seletivo público (PSP) é para <b>emprego CLT</b>; o processo seletivo simplificado (PSS) é para <b>contratação temporária</b> (Lei 15.455/2019). A autorização é do Chefe do Executivo, com necessidade, disponibilidade orçamentária, LRF e TCE-PR (Lei 16.639, art. 4º; Decreto 1.292, art. 6º). A coordenação é da SMGP. A validade é de até <b>2 anos da homologação, prorrogável uma vez</b> por igual período (Decreto 1.292, art. 4º, §2º). O edital é publicado no Diário Oficial Eletrônico com <b>antecedência mínima de 60 dias da primeira prova</b> e vincula a Administração, a banca e os candidatos (art. 18); um edital por regime jurídico, sem misturar concurso, PSP e PSS (art. 19, p.ú.). Há comissões organizadora, examinadora e recursal em número ímpar, vedada a participação de candidatos, parentes até o terceiro grau e quem tenha vínculo com cursinhos (arts. 15 a 17).", "<b>Reservas de vagas e desempate (Decreto 1.292, arts. 23 a 28).</b> PcD: reserva mínima de <b>5%</b>, com arredondamento para cima até o limite de 20%, mediante declaração na inscrição e laudo com CID. PPI: conforme a Lei 15.931/2021, <b>sem reserva se as vagas forem 3 ou menos</b>. Listas de ampla concorrência, de PcD e de PPI (art. 27). Desempate pela <b>maior idade</b> (Estatuto da Pessoa Idosa) e depois por critério de LIBRAS (Lei 15.482/2019) (art. 28). Cadastro de reserva (arts. 13 e 14). O certame unificado permite o mesmo edital para vagas distintas, com banco de classificados sem direito subjetivo (arts. 9º a 12).", "<b>Requisitos de ingresso (Lei 16.639, art. 24).</b> Brasileiro nato ou naturalizado, ou português com Estatuto de Igualdade; <b>18 anos</b> completos e idade máxima inferior à da aposentadoria compulsória; escolaridade comprovada até a posse; gozo dos direitos políticos; serviço militar em dia; boa conduta; boa saúde; aptidão para o exercício; e demais exigências do edital. O art. 11 do Estatuto (requisitos) está revogado: o <b>art. 45 da Lei 16.639 revoga os arts. 11, 15, 16 e 21 da Lei 1.656/1958</b>.", "<b>Convocação, nomeação, posse e exercício.</b> A convocação é por edital no Diário Oficial (oficial e obrigatória); outras comunicações são facultativas (Decreto 1.292, art. 30). O convocado tem <b>10 dias úteis improrrogáveis</b> para apresentar a documentação (art. 31), e o não comparecimento elimina o candidato (com a possibilidade de deslocamento para o final da lista, se prevista). O exame médico ocupacional é eliminatório, o ASO vale 180 dias, sem segunda chamada, e o recurso é em <b>2 dias úteis</b> (art. 32). Quanto à nomeação, o aprovado <b>dentro das vagas</b> do edital tem direito à nomeação no prazo de validade (Decreto 1.292, art. 34; Lei 16.639, art. 33); além das vagas e no cadastro de reserva há <b>mera expectativa</b>. A <b>posse</b> ocorre em até <b>5 dias úteis</b> da publicação da nomeação, prorrogável por até 30 dias; o exercício se inicia na data da posse; sem posse a nomeação perde o efeito; <b>15 dias sem entrar em exercício</b> geram exoneração (art. 36). O Estatuto, art. 21, previa 15 dias úteis para posse, <b>revogado</b>.", "<b>Vacância, promoção e petição (Estatuto, arts. 35 a 107).</b> Vacância: exoneração, demissão, promoção, transferência, aposentadoria, posse em outro cargo, falecimento (art. 79). Exoneração a pedido, a critério do Prefeito (cargos em comissão e funções gratificadas) e quando não satisfeitas as condições do estágio. A promoção observa 2/3 por antiguidade e 1/3 por merecimento, com lista tríplice (art. 35). A reintegração é o retorno do demitido, com ressarcimento, por sentença ou decisão administrativa (art. 61); a readmissão é sem ressarcimento (art. 65); a reversão do aposentado não é possível se ele tiver mais de 60 anos (art. 68). Direito de petição: reconsideração não renovável e recurso sem efeito suspensivo; a prescrição administrativa é de <b>5 anos</b> (demissão, cassação) e <b>120 dias</b> nos demais casos (art. 101), interrompida pela reconsideração e pelo recurso até duas vezes (art. 103).", "<b>Acumulação, deveres e proibições (Estatuto, arts. 193 a 209).</b> É vedada a acumulação remunerada de cargos, com as exceções do magistério (com juiz, dois cargos de magistério, ou um de magistério com um técnico ou científico), exigidas compatibilidade de horário e correlação de matérias (art. 193). Quando a acumulação é ilegal e apurada em processo, aplica-se a demissão de todos os cargos e a restituição; de <b>boa-fé</b> mantém-se o cargo mais antigo; de <b>má-fé</b> há inabilitação por 5 anos (art. 205). Deveres (art. 207): comparecer, cumprir ordens (exceto manifestamente ilegais), guardar sigilo, representar contra irregularidades, urbanidade, zelar pela economia, atender prontamente às requisições dos órgãos jurídicos de defesa do Município (inciso XII), dignificar a função pública. Proibições (arts. 208 e 209): contratos comerciais com o Município, requerer privilégios, gerir sociedade privada (a Lei 16.794/2026 acrescentou §§1º e 2º ao art. 209, que admitem o MEI), entre outras.", "<b>Penalidades e competência (Estatuto, arts. 210 a 222).</b> As penas que o Regimento menciona são advertência, repreensão, suspensão (convertível em multa, Estatuto, art. 217, §1º), demissão e cassação de aposentadoria (confira o rol completo no Estatuto). O art. 222, §1º, dá ao <b>Corregedor-Geral</b> a competência para aplicar advertência, repreensão e suspensão até 30 dias (no Regimento, art. 2º, VI, ele aplica as três sem fixar o limite; a suspensão do PAD pode chegar a <b>90 dias</b>, art. 29, p.ú.). A sindicância e o PAD estão sob a Corregedoria (arts. 228 e 235 do Estatuto, c/c art. 74 do Decreto 868/2024, que delega ao Corregedor-Geral a designação dos membros das comissões). O art. 252, §4º (Lei 16.268/2023) trata da revisão.", "<b>Corregedoria Geral (Decreto 868/2024, arts. 1º a 5º).</b> É unidade da PGM responsável pelos atos de natureza correicional na administração direta, autárquica e fundacional, e o Corregedor-Geral se reporta ao <b>Procurador-Geral do Município</b>. Instaura sindicância, PAD, o PAR de licitações (Lei 14.133, art. 158), o PAD-Especial e o PEX. <b>Exceções</b>: o PAR da Lei Anticorrupção (Lei 12.846) e os processos da Corregedoria da Guarda Municipal. A <b>CPS</b> (Comissão Permanente de Sindicância) conduz as investigações; a <b>CPP</b> (Comissão Permanente de Processo) conduz o PAD. Cada comissão tem <b>3 agentes públicos efetivos</b>, e o presidente deve ser <b>Procurador Municipal estável</b> (arts. 13 e 19).", "<b>Apuração preliminar e sindicância (arts. 6º a 18).</b> A autoridade que tiver ciência de irregularidade deve apurar, sob pena de responsabilidade. A denúncia, <b>inclusive anônima</b>, é reduzida a termo e passa por juízo de admissibilidade; a denúncia anônima só deflagra processo ou medida consensual se estiver <b>respaldada por outras provas</b> (art. 6º, §5º). O denunciante pode pedir sigilo. A apuração preliminar é imediata, com relatório circunstanciado, por agentes efetivos, com ao menos um de nível superior aos envolvidos (arts. 7º e 8º); podem ser monitorados, auditados e periciados os instrumentos de uso funcional, sem prévia notificação (art. 9º). A <b>sindicância</b> destina-se a apurar indícios de autoria e materialidade, é instaurada pelo Corregedor-Geral, deve ser concluída em <b>15 dias</b>, é <b>sigilosa, inquisitorial e sem contraditório</b>, mas o investigado tem direito ao silêncio e, por requerimento, acesso aos autos (arts. 11 a 15).", "<b>PAD (arts. 19 a 38).</b> Apura a responsabilidade do agente público e pode resultar em advertência, repreensão, suspensão de até <b>90 dias</b>, demissão, cassação de aposentadoria ou arquivamento, com contraditório e ampla defesa (art. 29, p.ú.). A comunicação dos atos é preferencialmente eletrônica; prazos em dias corridos (art. 27), ressalvado o PAR de licitações, em dias úteis. Após o indiciamento e a citação, o interrogatório e as oitivas ocorrem, preferencialmente, por videoconferência. O indiciado tem direito ao silêncio; a ausência após intimação gera <b>revelia sem presunção de veracidade</b> (art. 36); as <b>alegações finais</b> são em <b>20 dias</b> (art. 37). A autoridade julgadora pode, motivadamente, agravar, atenuar ou excluir a pena proposta (art. 28). Havendo vários indiciados, julga a autoridade competente para a pena mais grave (art. 38, §5º), e a suspensão pode ser convertida em multa (§6º).", "<b>Recursos e revisão (arts. 50 a 55).</b> Cabe recurso da decisão que aplicar penalidade, <b>em 30 dias</b> da publicação, perante a autoridade julgadora, que faz o juízo de admissibilidade. Não se conhece o recurso fora do prazo, perante órgão incompetente, por pessoa não legitimada ou com alegação genérica de injustiça. É vedado agravar a sanção a partir de novos fatos arguidos em alegações recursais (art. 53, §1º); a prescrição se interrompe até duas vezes (§4º); o recurso, se conhecido, pode ter efeito suspensivo. Das decisões do <b>Prefeito</b> cabe apenas <b>pedido de reconsideração</b> em 30 dias (art. 54). Dos despachos das comissões não cabe recurso (art. 50, p.ú.). A revisão segue os arts. 252 e seguintes do Estatuto (art. 55).", "<b>Consensualidade: OAP e TAD (arts. 56 a 70).</b> Dois instrumentos: a <b>oferta de aplicação imediata de pena (OAP)</b> e o <b>termo de ajustamento disciplinar (TAD)</b>, ambos benefícios processuais por oportunidade e conveniência (art. 56). <b>OAP</b>: infração passível de advertência, repreensão ou suspensão; o agente deve assumir a responsabilidade (atenuante); pode ser proposta até o fim das alegações finais; defesa escrita em 5 dias; aceite em 5 dias; <b>silêncio = recusa</b>; a suspensão pode ser convertida em multa de 50% por dia; frustrada a OAP, a CPP não fica vinculada à pena ofertada (arts. 59 a 63). <b>TAD</b>: conduta de <b>menor potencial ofensivo</b>; sem condenação disciplinar nos últimos 2 anos; sem outro TAD vigente; prazo entre <b>6 e 24 meses</b>; suspende a sindicância e o PAD e também a prescrição; não é pena e não influencia a avaliação; fica registrado na ficha funcional apenas durante a vigência; não é publicado no Diário Oficial; em dano de pequeno valor (até R$ 50.000,00, reajustável) exige ressarcimento (arts. 64 a 70). Cumprido o TAD, declara-se a extinção da punibilidade (art. 68).", "<b>Outros pontos do Regimento.</b> O art. 73 veda a exoneração a pedido e a aposentadoria voluntária a quem responde a PAD (e, se aplicada pena, só após o cumprimento), com a exceção de PAD por abandono de cargo, inassiduidade habitual ou acumulação ilegal. O art. 76 afasta o <b>perdão tácito</b> na atividade correcional. O art. 77 transfere à CPP os processos do Comitê Técnico de Estágio Probatório (extinto pela Lei 16.268/2023). O art. 80 manda observar a LGPD. O art. 78 aplica o regimento imediatamente aos processos em curso."], "pega": ["<b>Aprovado dentro das vagas tem direito à nomeação</b> (Decreto 1.292, art. 34; Lei 16.639, art. 33); no cadastro de reserva, só expectativa. Banca inverte: dá direito subjetivo ao cadastro, ou nega o direito ao classificado dentro das vagas.", "<b>Validade do concurso:</b> até 2 anos da <b>homologação</b> (não da publicação do edital), prorrogável <b>uma vez</b> por igual período. Se a alternativa fala em prorrogação ilimitada ou em contagem a partir da inscrição, está errada.", "<b>Antecedência do edital:</b> 60 dias antes da primeira prova (Decreto 1.292, art. 18). Atenção a prazos de 30 ou 45 dias.", "<b>Reserva de PcD:</b> mínimo de 5%, arredondando para cima até 20%; PPI sem reserva se vagas ≤ 3. Pegadinha: arredondar para baixo, ou falar em 20% como mínimo.", "<b>Posse:</b> hoje 5 dias úteis da publicação da nomeação, prorrogáveis por até 30; o Estatuto (art. 21) falava em 15 dias úteis, mas foi revogado pela Lei 16.639. A banca cobra o prazo antigo.", "<b>Exercício e exoneração por omissão:</b> 15 dias sem entrar em exercício geram exoneração; sem posse a nomeação fica sem efeito. Não confundir com a demissão por abandono de cargo (30 dias consecutivos de interrupção, Estatuto, art. 31).", "<b>Estágio probatório e estabilidade:</b> o texto do Estatuto fala em 2 anos (concurso) e 5 (sem concurso), mas o art. 41 da CF fixa 3 anos para a estabilidade. A banca pode apresentar a regra do Estatuto como se fosse a vigente; o enunciado costuma indicar a fonte.", "<b>Acumulação:</b> as exceções do art. 193 são do magistério; a má-fé gera inabilitação por 5 anos, a boa-fé mantém o cargo mais antigo (art. 205). O TRF6 (2025) cobrou caso de enfermeira federal de 40 horas semanais que quer acumular outro cargo; <b>não conferi o gabarito</b>. De memória, o critério é a compatibilidade de horários, e o limite de 60 horas semanais é debate do STJ e do STF.", "<b>Sindicância:</b> não comporta contraditório, é sigilosa e inquisitorial, mas o silêncio é assegurado e o acesso aos autos pode ser pedido. A banca afirma que é obrigatório o contraditório na sindicância (errado) ou que o investigado não tem acesso (errado).", "<b>Denúncia anônima:</b> pode ser apurada e admitida, mas só deflagra processo (CPP) ou medida consensual se for respaldada por outros elementos de prova (art. 6º, §5º). Não é causa de arquivamento sumário automático nem base suficiente para o PAD.", "<b>Revelia no PAD:</b> não se reputam verdadeiros os fatos imputados (arts. 36 e 37, p.ú.). Pegadinha: aplicar a presunção do processo civil.", "<b>Prazos:</b> alegações finais 20 dias; recurso 30 dias; defesa e aceite da OAP 5 dias; sindicância 15 dias; reconsideração do Prefeito 30 dias. A banca troca os números. Prazos do Regimento são em <b>dias corridos</b> (art. 27), salvo no PAR de licitações.", "<b>Pena máxima de suspensão:</b> até 90 dias no PAD (Regimento, art. 29, p.ú.); o Corregedor-Geral aplica advertência, repreensão e suspensão; a demissão e a cassação são de autoridade superior. Questão do TRT24 (2025) sobre inassiduidade habitual de servidor federal: pela Lei 8.112 (de memória) a sanção é a <b>demissão</b>; o gabarito que extraí (C) não bate com isso, provavelmente por erro meu de extração, e <b>não o usei</b>. Para Curitiba, a regra está no Estatuto municipal.", "<b>TAD e prescrição:</b> o TAD suspende a prescrição e o processo; não é pena; não aparece na ficha funcional depois de vencido; pode ser rescindido por descumprimento ou nova falta, retomando-se o processo, e a rescisão não implica reconhecimento de culpa (art. 64, §§10 e 11).", "<b>Vedação à exoneração a pedido durante o PAD</b> (art. 73), com exceção de abandono, inassiduidade habitual e acúmulo ilegal. Banca generaliza a vedação ou omite as exceções.", "<b>Perdão tácito:</b> não se aplica na atividade correcional municipal (art. 76). Alternativa que invoca o decurso do tempo sem manifestação como perdão está errada (a prescrição, sim, corre)."]}], "24": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Responsabilidade civil do Estado: evolução, teorias, atos comissivos e omissivos, concessionárias, prescrição e ação de regresso", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 14 de Direito Administrativo. Li <b>literalmente</b>, no navegador (Planalto): <b>CF, art. 37, § 6º</b>; <b>CC, arts. 43, 186, 187, 188, 927 (caput), 936 e 945</b>. Li, na página de cada tema, o texto das teses dos <b>Temas 366, 592, 777 e 512 do STF</b> e do <b>Tema 553 do STJ</b> (algumas teses vieram em trechos e a de 366 só em resumo). <b>Não li</b> a Lei 4.619/1965, a Lei 9.494/1997, a Lei 8.112/1990 nem a Lei 10.744/2003. O <b>Tema 940</b>, o <b>Tema 362</b>, o <b>Tema 130</b>, as súmulas e a doutrina (autores, evolução histórica) vêm <b>da minha memória</b> e não foram conferidos.", "<b>Evolução histórica (doutrina).</b> (1) <b>Irresponsabilidade</b>: o rei não erra (<i>the king can do no wrong</i>); (2) <b>teoria civilista</b>: o Estado só responde com <b>culpa</b>, separando atos de império (sem responsabilidade) e atos de gestão (com responsabilidade); (3) <b>culpa administrativa</b> (<i>faute du service</i>, caso Blanco, França, 1873): responde quando o serviço <b>não funciona, funciona mal ou funciona atrasado</b>, sem identificar o agente culpado (culpa anônima); (4) <b>risco administrativo</b>: responsabilidade <b>objetiva</b>, basta conduta, dano e nexo causal, com excludentes; (5) <b>risco integral</b>: responsabilidade objetiva <b>sem excludentes</b>. No Brasil, a responsabilidade objetiva aparece desde a Constituição de 1946; a CF/88 a consolidou no art. 37, § 6º.", "<b>Regra constitucional (CF, art. 37, § 6º).</b> As pessoas jurídicas de <b>direito público</b> e as de <b>direito privado prestadoras de serviços públicos</b> respondem pelos danos que seus agentes, <b>nessa qualidade</b>, causarem a terceiros, <b>assegurado o direito de regresso</b> contra o responsável nos casos de <b>dolo ou culpa</b>. O <b>CC, art. 43</b> repete a lógica para as pessoas jurídicas de direito público interno. Observe a assimetria: o <b>Estado</b> responde <b>sem culpa</b> (objetiva); o <b>agente</b> só responde perante o Estado, em regresso, se houver <b>dolo ou culpa</b> (subjetiva). Elementos: <b>conduta do agente nessa qualidade</b>, <b>dano</b> e <b>nexo causal</b>.", "<b>Risco administrativo e excludentes.</b> A regra geral é o <b>risco administrativo</b>. Excluem ou atenuam a responsabilidade: <b>culpa exclusiva da vítima</b>, <b>caso fortuito ou força maior</b> (ruptura do nexo) e <b>fato exclusivo de terceiro</b>. A <b>culpa concorrente</b> da vítima não exclui, mas <b>reduz</b> a indenização: CC, art. 945 (a indenização é fixada considerando a gravidade da culpa da vítima em confronto com a do autor do dano). O <b>risco integral</b> é exceção: costuma-se citar, <b>de memória</b>, dano nuclear (CF, art. 21, XXIII, d), dano ambiental e atentados terroristas contra aeronaves (Lei 10.744/2003); confira cada hipótese antes de afirmar em prova.", "<b>Atos omissivos: Tema 366 (STF).</b> Discutiu a explosão em residência usada como comércio de fogos de artifício, por suposta omissão do dever de fiscalizar (julgado em 11/03/2020). Resumo da tese que li: a responsabilidade civil do Estado por omissão exige a <b>violação de um dever jurídico específico de agir</b>, o que ocorre, por exemplo, quando a <b>licença de funcionamento é concedida sem as cautelas legais</b> ou quando o poder público <b>sabia das irregularidades</b> do particular e nada fez. Leitura prática: a <b>omissão genérica</b> (dever geral de fiscalizar) não basta; a <b>omissão específica</b> gera responsabilidade. (Doutrina clássica: omissão genérica seria responsabilidade subjetiva, por culpa anônima; omissão específica, objetiva.)", "<b>Dever específico de proteção: Tema 592 (STF), morte de detento.</b> Tese lida (em trechos): em caso de <b>inobservância do seu dever específico de proteção</b> previsto no <b>art. 5º, XLIX, da CF</b> (é assegurado aos presos o respeito à integridade física e moral), o <b>Estado é responsável pela morte de detento</b>. Quem está sob <b>custódia</b> do Estado está em posição de garante: se o dever específico de proteção foi violado, há responsabilidade. Do estudo anterior, de memória: o STF admitiu a exclusão do nexo quando a morte era <b>inevitável</b>, mesmo com ação diligente do Estado.", "<b>Quem deve ser demandado: Tema 940 (STF).</b> De memória (já estudado antes): a ação por dano causado por agente público deve ser ajuizada contra o <b>Estado</b> ou a <b>pessoa jurídica de direito privado prestadora de serviço público</b>, sendo <b>parte ilegítima o autor do ato</b>, assegurado o direito de regresso nos casos de dolo ou culpa. É a chamada <b>dupla garantia</b>: a vítima tem o Estado solvente e o agente fica protegido de ação direta. Conferir o texto oficial da tese antes de reproduzir em prova.", "<b>Notários e registradores: Tema 777 (STF).</b> Tese lida (em trechos): <b>o Estado responde, objetivamente, pelos atos dos tabeliães e registradores oficiais</b> que, no exercício de suas funções, causem dano a terceiros, <b>assentado o dever de regresso contra o responsável nos casos de dolo ou culpa, sob pena de improbidade administrativa</b>. Ou seja: a responsabilidade é do <b>Estado</b> (e não apenas do notário), e a omissão do regresso pode configurar improbidade.", "<b>Concurso organizado por entidade privada: Tema 512 (STF).</b> Tese lida (em trechos): o Estado responde <b>subsidiariamente</b> por <b>danos materiais</b> causados a candidatos em concurso público organizado por pessoa jurídica de direito privado quando os exames são <b>cancelados por indícios de fraude</b>. Note a palavra <b>subsidiariamente</b>: a banca privada responde primeiro; o Estado, depois.", "<b>Concessionárias e permissionárias; foragidos.</b> De memória: (a) o STF, no <b>Tema 130</b> (RE 591.874), entendeu que a responsabilidade das empresas privadas prestadoras de serviço público é <b>objetiva</b> tanto perante <b>usuários</b> quanto <b>não usuários</b> do serviço; o <b>poder concedente</b> responde de forma <b>subsidiária</b> (doutrina e STJ). (b) <b>Tema 362</b> (RE 608.880): não há responsabilidade objetiva do Estado por crime praticado por <b>foragido</b> do sistema prisional quando <b>não demonstrado nexo causal direto</b> entre a fuga e a conduta criminosa. Ambos precisam ser conferidos.", "<b>Prescrição: Tema 553 (STJ).</b> Tese lida (em trechos): aplica-se o prazo prescricional <b>quinquenal</b> do <b>Decreto 20.910/1932</b> nas ações indenizatórias ajuizadas contra a Fazenda Pública, <b>em detrimento do prazo trienal</b> do Código Civil de 2002. Do estudo anterior (memória): a Lei 9.494/1997 (art. 1º-C) repete os cinco anos para pessoas jurídicas de direito público e de direito privado prestadoras de serviço público; a Súmula 647 do STJ declara <b>imprescritíveis</b> as ações indenizatórias por atos de <b>tortura</b> durante o regime militar.", "<b>Ação de regresso.</b> Fundamento: CF, art. 37, § 6º, parte final, e CC, art. 43: exige <b>dolo ou culpa</b> do agente (responsabilidade <b>subjetiva</b> do agente perante o Estado). Pressupõe que o Estado <b>já indenizou</b> a vítima. A <b>denunciação da lide</b> ao agente, em tese prevista no CPC (art. 125, II), <b>não é obrigatória</b> e, em prática, costuma ser indeferida quando traz fundamento novo (culpa do agente) ao processo contra o Estado; isso conversa com a dupla garantia do Tema 940. De memória: a Lei 8.112/1990, art. 122, trata da ação regressiva do servidor federal e a obrigação se transmite aos sucessores até o limite da herança. O <b>prazo prescricional da ação regressiva</b> é ponto controvertido: não cravei, confira.", "<b>Danos indenizáveis (de memória).</b> A indenização abrange <b>dano material</b> (emergente e lucros cessantes) e <b>moral</b>; a Súmula 37 do STJ permite cumular dano material e moral do mesmo fato; a Súmula 54 do STJ fixa os <b>juros de mora a partir do evento danoso</b> em responsabilidade extracontratual. No concurso, associe a Fazenda Pública ao regime de juros e correção do art. 1º-F da Lei 9.494/1997 e à EC 113/2021 (art. 3º), assuntos de outras unidades.", "<b>Resumo operacional para prova.</b> (1) Regra: <b>risco administrativo</b>, objetiva, com excludentes. (2) <b>Art. 37, § 6º</b>: pessoas de direito público e de direito privado prestadoras de serviço público; regresso só com dolo ou culpa. (3) <b>Omissão</b>: exige dever <b>específico</b> de agir (Tema 366); detento sob custódia (Tema 592). (4) <b>Tema 940</b>: demandar o Estado, não o agente. (5) <b>Tema 777</b>: Estado responde objetivamente pelos notários, com regresso. (6) <b>Tema 512</b>: Estado subsidiário no concurso privado fraudado. (7) <b>Tema 553 STJ</b>: cinco anos, Decreto 20.910."], "pega": ["Teoria adotada: a banca diz que o Brasil adota, como regra, o <b>risco integral</b>. A regra é o <b>risco administrativo</b>, que admite excludentes (culpa exclusiva da vítima, fortuito ou força maior, fato de terceiro).", "Culpa: a banca afirma que a vítima precisa provar <b>culpa do Estado</b> para ser indenizada. Na responsabilidade objetiva basta <b>conduta, dano e nexo</b>. A culpa só é exigida do <b>agente</b>, na ação de regresso (art. 37, § 6º).", "Omissão: a banca sustenta que <b>toda omissão</b> do Estado gera responsabilidade objetiva, ou que omissão <b>nunca</b> gera. O Tema 366 exige a violação de <b>dever jurídico específico de agir</b>; sem ele, a omissão genérica não basta.", "Legitimidade: a banca diz que a vítima pode escolher livremente entre processar o Estado ou o <b>agente</b> diretamente. Pelo Tema 940, o agente é <b>parte ilegítima</b>; a ação vai contra o Estado (ou a concessionária), com regresso depois.", "Detento: a banca afirma que a morte de preso gera responsabilidade <b>subjetiva</b> ou nunca. O Tema 592 firma a responsabilidade do Estado quando <b>descumprido o dever específico de proteção</b> do art. 5º, XLIX.", "Notários: a banca atribui a responsabilidade <b>apenas ao notário</b> como pessoa física. Pelo Tema 777, o <b>Estado</b> responde objetivamente pelos atos dos tabeliães e registradores, com regresso por dolo ou culpa.", "Concurso privado: a banca diz que o Estado responde <b>solidária e objetivamente</b> pelos danos do concurso organizado por entidade privada. A tese do Tema 512 é de responsabilidade <b>subsidiária</b>, por danos materiais, quando há cancelamento por fraude.", "Prescrição: a banca aplica o prazo <b>trienal</b> do Código Civil. O STJ (Tema 553) fixou o prazo <b>quinquenal</b> do Decreto 20.910/1932 para indenização contra a Fazenda Pública.", "Regresso: a banca exige só nexo causal do agente, sem culpa. O direito de regresso depende de <b>dolo ou culpa</b>."]}, {"materia": "DIREITO CIVIL", "titulo": "Direito sucessório: abertura, herança, aceitação e renúncia, indignidade e deserdação, herança jacente e vacante, ordem de vocação, herdeiros necessários, testamento, colação, inventário e partilha", "key": "CIV", "nome": "Civil", "conc": ["Edital: item 6 de Direito Civil. Li no navegador (Planalto, CC compilado), com <b>trechos truncados</b> em várias linhas: <b>arts. 1.784 a 1.827 (em boa parte), 1.829 a 1.836, 1.842 a 1.860, 1.961 a 1.965 e 1.991 a 2.027</b>. O <b>art. 1.829 e os arts. 1.830 a 1.832 li por inteiro</b>. <b>Não li</b> os arts. 1.837 a 1.841, 1.861 a 1.960 (formas de testamento, legados, substituições) e 1.966 a 1.990 (testamenteiro, inventariante etc.); também <b>não li o CPC</b> (inventário, arrolamento, partilha). Li, na página do tema, a tese do <b>Tema 809 do STF</b>. Súmulas, o repetitivo do STJ sobre a comunhão parcial e o que marco como memória <b>não foram conferidos</b>.", "<b>Abertura e transmissão (arts. 1.784 a 1.788).</b> Aberta a sucessão, a herança <b>transmite-se desde logo</b> aos herdeiros legítimos e testamentários (<b>princípio de saisine</b>). A sucessão abre-se no lugar do <b>último domicílio</b> do falecido (1.785); dá-se por <b>lei ou disposição de última vontade</b> (1.786); a lei que a regula e define a legitimação para suceder é a <b>vigente ao tempo da abertura</b> (1.787). Se não há testamento, ou quanto aos bens não compreendidos nele, ou se o testamento caducar ou for julgado nulo, defere-se a herança aos <b>herdeiros legítimos</b> (1.788). Havendo <b>herdeiros necessários</b>, o testador só pode dispor da <b>metade</b> da herança (1.789).", "<b>Herança, cessão e administração.</b> Até a partilha, a herança é <b>universalidade indivisível</b>, regida pelas regras de condomínio (art. 1.791, de memória). Li as regras da <b>cessão do direito hereditário</b>: é <b>ineficaz</b> a cessão, pelo coerdeiro, de seu direito sobre <b>bem singular</b> da herança (1.793, § 2º) e é ineficaz a disposição de bem do acervo, pendente a indivisibilidade, <b>sem autorização do juiz da sucessão</b> (§ 3º). O coerdeiro <b>não pode ceder a quota a estranho</b> se outro coerdeiro a quiser, <b>tanto por tanto</b> (1.794); se não for avisado da cessão, pode haver a quota para si, depositado o preço, <b>até 180 dias</b> após a transmissão (1.795). O inventário deve ser instaurado em <b>30 dias</b> da abertura (1.796, redação do Código; o CPC fixa prazo próprio, de memória). Até o compromisso do inventariante, a administração cabe sucessivamente ao cônjuge ou companheiro que conviva com o falecido, ao herdeiro na posse e administração dos bens, ao testamenteiro e a pessoa de confiança do juiz (1.797).", "<b>Capacidade para suceder (1.798 a 1.803).</b> Legitimam-se a suceder as pessoas nascidas ou já concebidas no momento da abertura (1.798, de memória). Na sucessão testamentária podem ser chamados os filhos ainda não concebidos de pessoas vivas (prole eventual): se, passados <b>dois anos</b> da abertura, não for concebido o herdeiro esperado, os bens reservados caberão aos herdeiros legítimos (1.800, § 4º, lido). <b>Não podem ser nomeados herdeiros nem legatários</b> (1.801): quem escreveu o testamento a rogo (e seu cônjuge, companheiro, ascendentes e irmãos); as testemunhas; o <b>concubino do testador casado</b>, salvo se este, sem culpa, estava separado de fato há mais de <b>cinco anos</b>; o tabelião ou quem fez ou aprovou o testamento. São <b>nulas</b> as disposições em favor de pessoas não legitimadas (1.802).", "<b>Aceitação e renúncia (1.804 a 1.813).</b> A aceitação é <b>irretratável</b> (1.812, de memória). Não são atos de aceitação os <b>atos oficiosos</b> (funeral), os meramente conservatórios e os de administração e guarda provisória (1.805, § 1º, lido); também não importa aceitação a <b>cessão gratuita, pura e simples</b>, da herança aos demais coerdeiros (§ 2º). A <b>renúncia</b> deve constar expressamente de <b>instrumento público ou termo judicial</b> (1.806). Qualquer interessado pode, <b>vinte dias após a abertura</b>, requerer que o herdeiro declare se aceita (1.807). <b>Não se pode aceitar ou renunciar em parte, sob condição ou a termo</b> (1.808). O herdeiro a quem se testarem legados pode aceitá-los renunciando à herança, ou aceitar a herança e repudiar os legados (1.808, § 1º). Na sucessão legítima, a parte do renunciante <b>acresce</b> à dos outros herdeiros da mesma classe (1.810). Os credores do renunciante prejudicado podem aceitar em seu nome (1.813, de memória).", "<b>Indignidade (1.814 a 1.818).</b> São excluídos da sucessão os herdeiros ou legatários que: (I) foram autores, coautores ou partícipes de <b>homicídio doloso, ou tentativa</b>, contra o autor da herança, seu cônjuge, companheiro, ascendente ou descendente; (II) acusaram <b>caluniosamente</b> em juízo o autor da herança ou incorreram em crime contra a honra dele ou de seu cônjuge ou companheiro; (III) por <b>violência ou meios fraudulentos</b> inibiram ou obstaram o autor de dispor livremente por ato de última vontade. A exclusão é declarada por <b>sentença</b> (1.815); o direito de demandar a exclusão extingue-se em <b>quatro anos</b>, contados da abertura da sucessão (§ 1º); no caso de homicídio, o <b>Ministério Público</b> tem legitimidade (§ 2º). O art. 1.815-A, que li em parte, prevê a exclusão por força do trânsito em julgado de sentença penal condenatória nos casos do 1.814. Os efeitos da exclusão são <b>pessoais</b>: os descendentes do excluído sucedem como se ele morto fosse (1.816), e o excluído não tem usufruto nem administração dos bens que couberem a seus sucessores. A <b>reabilitação</b> é o perdão do ofendido por ato autêntico ou testamento (1.818, de memória).", "<b>Deserdação (1.961 a 1.965).</b> Os herdeiros <b>necessários</b> podem ser privados da legítima, ou deserdados, nos casos em que podem ser excluídos da sucessão (1.961). Além do art. 1.814, autorizam a deserdação dos <b>descendentes</b> pelos ascendentes: <b>ofensa física, injúria grave, relações ilícitas com a madrasta ou o padrasto, desamparo do ascendente em alienação mental ou grave enfermidade</b> (1.962). Para a deserdação dos <b>ascendentes</b> pelos descendentes, hipóteses paralelas (1.963). A deserdação só pode ser ordenada em <b>testamento</b>, com <b>expressa declaração de causa</b> (1.964); quem se beneficia deve <b>provar a veracidade</b> da causa, e o direito de provar extingue-se em <b>quatro anos</b> contados da abertura do testamento (1.965).", "<b>Herança jacente e vacante (1.819 a 1.823) e 1.844.</b> Falecendo alguém sem testamento nem herdeiro legítimo notoriamente conhecido, os bens, depois de arrecadados, ficam sob a guarda e administração de um <b>curador</b>, até a entrega ao sucessor devidamente habilitado ou à declaração de vacância (1.819). Praticadas as diligências e feito o inventário, expedem-se editais e, decorrido <b>um ano</b>, procede-se à <b>declaração de vacância</b> (1.820). Os credores podem pedir pagamento das dívidas reconhecidas, nos limites da herança (1.821). A vacância <b>não prejudica os herdeiros</b> que se habilitarem, mas decorridos <b>cinco anos da abertura</b> os bens passam ao domínio do Município ou do Distrito
