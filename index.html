ecução fiscal, Lei 6.830/1980. Não há norma de Curitiba nesta unidade. A lei foi lida no texto atualizado do Planalto, incluindo as alterações da Lei 13.043/2014 (seguro garantia).", "<b>Alcance (arts. 1º e 2º):</b> a lei rege a execução judicial da dívida ativa da União, dos Estados, do DF, dos Municípios e de suas autarquias. O CPC aplica-se <b>subsidiariamente</b>. A dívida ativa é tributária ou não tributária e abrange atualização monetária, juros, multa e encargos.", "<b>Inscrição e CDA (art. 2º):</b> a inscrição é ato de controle administrativo da legalidade e constitui a certidão de dívida ativa. O art. 2º, §5º lista o conteúdo do termo: devedor e corresponsáveis, valor originário, termo inicial e forma de cálculo de juros e correção, origem e natureza, dispositivo legal, data e número da inscrição e, se for o caso, o número do processo administrativo.", "<b>Presunção (art. 3º):</b> a dívida regularmente inscrita goza de presunção de <b>certeza e liquidez</b>, que é <b>relativa</b> e só cai por prova inequívoca a cargo do executado ou do terceiro a quem aproveite.", "<b>Legitimidade passiva (art. 4º):</b> pode ser promovida contra o devedor, o fiador, o espólio, a massa, o responsável nos termos da lei e os sucessores a qualquer título. Aplicam-se à dívida ativa as normas de responsabilidade da legislação tributária, civil e comercial.", "<b>Petição inicial (art. 6º):</b> indica só o juiz, o pedido e o requerimento de citação. Vem instruída com a CDA, que faz parte dela. A produção de provas pela Fazenda independe de requerimento na inicial. O valor da causa é o da dívida constante da certidão.", "<b>Citação (art. 8º):</b> o executado é citado para pagar em <b>5 dias</b> ou garantir a execução. A citação é pelo <b>correio, com aviso de recepção</b>, salvo se a Fazenda pedir outra forma. Considera-se feita na data da entrega, ou, sem data, <b>10 dias</b> após a entrega à agência postal. Se o AR não voltar em <b>15 dias</b>, a citação é por oficial ou edital, com edital de <b>30 dias</b>.", "<b>Garantia (art. 9º):</b> depósito em dinheiro, fiança bancária, <b>seguro garantia</b>, nomeação de bens (ordem do art. 11) ou bens de terceiros aceitos pela Fazenda. O imóvel exige consentimento do cônjuge.", "<b>Ordem de penhora (art. 11):</b> dinheiro; títulos da dívida pública e títulos com cotação em bolsa; pedras e metais preciosos; imóveis; navios e aeronaves; veículos; móveis e semoventes; direitos e ações. Excepcionalmente recai sobre estabelecimento. A Fazenda pode pedir <b>a qualquer tempo</b> a substituição por outros bens, independentemente da ordem, e o reforço da penhora (art. 15, II). O executado só pode substituir por depósito, fiança ou seguro garantia (art. 15, I).", "<b>Embargos (art. 16):</b> prazo de <b>30 dias</b>, contados do depósito, da juntada da fiança ou seguro garantia, ou da intimação da penhora. Só se admitem <b>depois de garantida a execução</b>. Toda matéria útil à defesa deve ser alegada no prazo. Não cabem <b>reconvenção nem compensação</b>. A Fazenda impugna em <b>30 dias</b> (art. 17).", "<b>Fase final:</b> o terceiro garantidor tem 15 dias para remir o bem ou pagar a dívida (art. 19). O edital do leilão é publicado uma só vez, com prazo de <b>10 a 30 dias</b> até o leilão (art. 22). A Fazenda pode <b>adjudicar</b> o bem pelo preço de avaliação (art. 24). Qualquer intimação do representante da Fazenda é <b>pessoal</b>, podendo ser por vista dos autos (art. 25).", "<b>Cancelamento da inscrição (art. 26):</b> se for cancelada antes da decisão de primeiro grau, a execução é extinta sem ônus para as partes. Pelo art. 29, a cobrança não se sujeita a concurso de credores nem a habilitação em falência ou inventário; o concurso de preferência entre entes foi tratado na ADPF 357.", "<b>Discussão judicial (art. 38):</b> só em execução, salvo mandado de segurança, repetição de indébito ou ação anulatória do ato declarativo da dívida. A exigência de depósito preparatório na anulatória foi afastada pela <b>Súmula Vinculante 28</b>. O art. 39 isenta a Fazenda de custas, mas ela deve antecipar as despesas de oficial de justiça (Súmula 190 do STJ)."], "pega": ["<b>Prazo dos embargos:</b> 30 dias. Não confundir com os 15 dias da impugnação ao cumprimento de sentença nem com os 5 dias para pagar ou garantir.", "<b>Garantia:</b> sem garantia, não há embargos. A defesa antes da garantia é por exceção de pré-executividade, para matérias de ordem pública sem dilação probatória (Súmula 393 do STJ).", "<b>CDA:</b> a Fazenda pode substituir ou emendar a CDA até a sentença de embargos, para corrigir erro formal ou material, <b>vedada a mudança do sujeito passivo</b> (Súmula 392 do STJ).", "<b>Citação por edital:</b> só depois de esgotados os meios, como a citação por correio e por oficial (Súmula 414 do STJ). A banca troca por “cabe de imediato”.", "<b>Ordem de penhora:</b> dinheiro é o primeiro. A Fazenda pode recusar a substituição do bem por precatório (Súmula 406 do STJ), mas o executado pode substituir por seguro garantia.", "<b>Intimação da Fazenda:</b> pessoal, por qualquer meio previsto, inclusive vista dos autos. Não basta a publicação.", "<b>Reconvenção e compensação:</b> a lei veda ambas nos embargos. A banca inverte e diz que é “permitida a compensação”.", "<b>Honorários:</b> o cancelamento da CDA depois dos embargos não exime a Fazenda da sucumbência (Súmula 153 do STJ). O art. 26 só vale se for antes da decisão e sem embargos.", "<b>Execuções de baixo valor:</b> o STF (Tema 1.184) admitiu a extinção por falta de interesse de agir, exigindo antes tentativa de conciliação ou solução administrativa e protesto da CDA. Confira a tese antes da prova.", "<b>Redirecionamento:</b> sócio só responde nos casos do art. 135 do CTN, e a dissolução irregular autoriza o redirecionamento (Súmula 435 do STJ). Nos grupos econômicos, a necessidade do incidente de desconsideração (IDPJ) está afetada no Tema 1.209 do STJ, sem tese fixada: a 1ª Turma o admite para grupo econômico fora da CDA, e a 2ª Turma o considera desnecessário."]}, {"materia": "PROCESSO CIVIL", "titulo": "Mediação, arbitragem e negócios processuais com a Fazenda Pública", "key": "PCV", "nome": "Proc. Civil", "conc": ["<b>Edital:</b> conciliação, mediação e arbitragem com o ente público, convenções processuais e calendário com a Fazenda. Textos conferidos no Planalto: Lei 13.140/2015, Lei 9.307/1996 e CPC (arts. 165 a 175, 190, 191 e 334). Não há norma de Curitiba nesta unidade.", "<b>Conciliador e mediador (CPC, art. 165):</b> os tribunais criam centros de solução consensual. O <b>conciliador</b> atua em casos sem vínculo anterior e pode sugerir soluções. O <b>mediador</b> atua quando há vínculo anterior e auxilia as partes a identificar os interesses e a construir a solução, sem sugerir.", "<b>Princípios da mediação (Lei 13.140, art. 2º):</b> imparcialidade do mediador, isonomia, oralidade, informalidade, autonomia da vontade, busca do consenso, confidencialidade e boa-fé. Se o contrato tem cláusula de mediação, as partes devem comparecer à <b>primeira reunião</b>, mas ninguém é obrigado a permanecer.", "<b>Objeto (art. 3º):</b> direitos disponíveis ou indisponíveis que admitam transação. O consenso sobre direito indisponível transigível precisa de <b>homologação judicial</b> com oitiva do <b>Ministério Público</b>.", "<b>Mediador:</b> aplicam-se as hipóteses de impedimento e suspeição do juiz (art. 5º). Fica impedido por <b>1 ano</b> de assessorar ou representar qualquer parte (art. 6º) e não pode ser árbitro nem testemunha no mesmo conflito (art. 7º). A mediação judicial deve ser concluída em <b>60 dias</b> (art. 28). A confidencialidade vale até em processo arbitral ou judicial (art. 30).", "<b>Audiência de conciliação (CPC, art. 334):</b> o juiz a designa com <b>30 dias</b> de antecedência, citando o réu com 20 dias. Pode haver mais de uma sessão, em até <b>2 meses</b>. Não se realiza se <b>ambas</b> as partes manifestarem desinteresse ou se não se admitir autocomposição. O autor manifesta na inicial, e o réu em petição com <b>10 dias</b> de antecedência. No litisconsórcio, todos devem manifestar. A ausência injustificada é ato atentatório à dignidade da justiça.", "<b>Câmaras de prevenção e resolução administrativa (Lei 13.140, art. 32):</b> os entes <b>poderão</b> criar câmaras no âmbito da advocacia pública para dirimir conflitos entre órgãos, avaliar a admissibilidade de pedidos de composição entre particular e ente público e celebrar termo de ajustamento de conduta. A submissão é <b>facultativa</b> e só nos casos previstos em regulamento. Ficam fora controvérsias que dependam de autorização do Legislativo. Cabem conflitos de equilíbrio econômico-financeiro de contratos. O CPC (art. 174) diz que os entes <b>criarão</b> câmaras.", "<b>Efeitos do pedido administrativo (art. 34):</b> a instauração do procedimento suspende a <b>prescrição</b>, retroagindo à data do pedido quando houver juízo de admissibilidade. Em matéria tributária, observa-se o CTN. No âmbito federal, a AGU faz transação por adesão (art. 35) e composição entre entes federais (arts. 36 a 38). Antes de criadas as câmaras, a advocacia pública pode instaurar mediação coletiva de serviços públicos (art. 33).", "<b>Arbitragem (Lei 9.307):</b> a administração direta e indireta pode usar para <b>direitos patrimoniais disponíveis</b> (art. 1º, §1º). A autoridade competente para a convenção é a mesma que pode fazer acordos (art. 1º, §2º). A arbitragem com a administração é sempre <b>de direito</b> e respeita a <b>publicidade</b> (art. 2º, §3º).", "<b>Sentença arbitral:</b> o árbitro é juiz de fato e de direito, e a sentença não depende de homologação nem comporta recurso (art. 18). Produz os efeitos da sentença judicial e, se condenatória, é <b>título executivo</b> (art. 31). Prazo de 6 meses, se nada for convencionado (art. 23). A nulidade se pede em ação no prazo de <b>90 dias</b> (art. 33, §1º).", "<b>Negócios processuais (CPC, art. 190):</b> versando o processo sobre direitos que admitam autocomposição, partes plenamente capazes podem estipular mudanças no procedimento e convencionar sobre ônus, poderes, faculdades e deveres processuais, antes ou durante o processo. O juiz controla a validade e só recusa nos casos de <b>nulidade</b>, inserção abusiva em contrato de adesão ou <b>manifesta vulnerabilidade</b>.", "<b>Calendário (art. 191):</b> juiz e partes, de comum acordo, fixam calendário para os atos. Ele vincula partes e juiz, os prazos só mudam em casos excepcionais, e fica dispensada a intimação para os atos com data prevista. Com a Fazenda, o negócio exige que o representante tenha poderes e que a lei e o regulamento do ente permitam, em respeito à indisponibilidade do interesse público."], "pega": ["<b>Mediador x conciliador:</b> o conciliador sugere, o mediador não. A banca inverte os vínculos anteriores.", "<b>Impedimento do mediador:</b> 1 ano para assessorar ou representar as partes. A banca troca por 2 anos ou por “vitalício”.", "<b>Audiência do art. 334:</b> só deixa de ocorrer se <b>ambas</b> manifestarem desinteresse. O desinteresse de apenas uma não basta.", "<b>Câmaras do art. 32:</b> a Lei 13.140 diz “poderão criar”, o CPC diz “criarão”. A submissão é <b>facultativa</b> e depende de regulamento.", "<b>Prescrição:</b> o procedimento administrativo de resolução consensual <b>suspende</b> a prescrição. Não interrompe.", "<b>Arbitragem pública:</b> sempre de direito e com publicidade. A equidade e o sigilo são pegadinhas.", "<b>Sentença arbitral:</b> não cabe recurso nem homologação. A nulidade é pedida ao Judiciário em 90 dias.", "<b>Direitos indisponíveis:</b> podem ser objeto de mediação se admitirem transação, com homologação e oitiva do MP. Na arbitragem, apenas direitos patrimoniais disponíveis.", "<b>Negócio processual:</b> não pode afastar normas cogentes nem o interesse público. O juiz controla a validade. O calendário vincula o juiz, e não só as partes."]}], "16": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Contratos administrativos (Lei 14.133/2021)", "key": "ADM", "nome": "Administrativo", "conc": ["<b>Edital:</b> Lei 14.133/2021, regime contratual: alteração, execução, inexecução, equilíbrio econômico-financeiro e extinção. Não há norma de Curitiba nesta unidade (os decretos municipais da 14.133 são outra unidade do plano). Os artigos foram conferidos no texto da lei no site do Planalto.", "<b>Natureza e cláusulas (arts. 89 e 92):</b> os contratos regem-se por suas cláusulas e pelos preceitos de <b>direito público</b>, e se aplicam <b>supletivamente</b> a teoria geral dos contratos e o direito privado. O art. 92 lista as cláusulas necessárias: objeto, vinculação ao edital e à proposta, legislação aplicável, regime de execução, preço e condições de pagamento, data-base e periodicidade do reajuste, prazos, entre outras.", "<b>Instrumento e publicidade (arts. 94 e 95):</b> o instrumento de contrato é obrigatório, salvo na dispensa por valor e nas compras com <b>entrega imediata e integral</b>, em que pode ser substituído por carta-contrato, nota de empenho, autorização de compra ou ordem de serviço. O contrato <b>verbal é nulo</b>, salvo pequenas compras ou serviços de pronto pagamento até <b>R$ 10.000,00</b> (valor da lei, atualizado por decreto). A divulgação no <b>PNCP</b> é <b>condição de eficácia</b> do contrato e dos aditamentos: <b>20 dias úteis</b> na licitação e <b>10 dias úteis</b> na contratação direta, contados da assinatura. Em caso de urgência, o contrato tem eficácia desde a assinatura, mas deve ser publicado nesses prazos, sob pena de nulidade.", "<b>Garantias (arts. 96 a 100):</b> exigidas a critério da autoridade, com previsão no edital. <b>O contratado escolhe</b> a modalidade: caução em dinheiro ou títulos da dívida pública, seguro-garantia, fiança bancária ou título de capitalização (Lei 14.770/2023). Limite de <b>5%</b> do valor inicial, podendo chegar a <b>10%</b> com justificativa de complexidade técnica e riscos. Nos serviços e fornecimentos contínuos, usa-se o valor anual. Em obras e serviços de engenharia de <b>grande vulto</b>, o seguro-garantia com cláusula de retomada pode chegar a <b>30%</b>. O seguro continua em vigor mesmo que o contratado não pague o prêmio. A garantia é liberada após a fiel execução ou a extinção por culpa exclusiva da Administração.", "<b>Prerrogativas (art. 104):</b> modificar unilateralmente o contrato, extingui-lo unilateralmente nos casos da lei, <b>fiscalizar</b> a execução, <b>aplicar sanções</b> pela inexecução e <b>ocupar provisoriamente</b> bens, pessoal e serviços (risco à prestação de serviços essenciais ou necessidade de acautelar apuração de faltas). As <b>cláusulas econômico-financeiras e monetárias</b> não podem ser alteradas sem concordância do contratado (§ 1º).", "<b>Duração (arts. 105 a 114):</b> a regra é o prazo previsto no edital, com crédito orçamentário a cada exercício e previsão no PPA se passar de um exercício. <b>Serviços e fornecimentos contínuos:</b> contratos de até <b>5 anos</b>, prorrogáveis sucessivamente até <b>10 anos</b>, com previsão no edital e atestado de que preços e condições seguem vantajosos. Na falta de crédito, a Administração pode extinguir sem ônus, só na próxima data de aniversário. Até 10 anos: hipóteses do art. 75, IV, “f” e “g”, V, VI, XII e XVI. Prazo <b>indeterminado:</b> usuária de serviço público em regime de monopólio. Contratos que geram receita e de eficiência: até 10 anos sem investimento e até <b>35 anos</b> com investimento. Sistemas estruturantes de TI: até <b>15 anos</b>. No contrato de escopo, o prazo se prorroga automaticamente se o objeto não for concluído, e, se a causa for o contratado, ele fica em mora e sujeito a sanções.", "<b>Execução (arts. 115 a 123):</b> a execução é acompanhada por <b>fiscais do contrato</b>. É proibido à Administração retardar imotivadamente a execução da obra ou serviço. Pelo art. 121, <b>somente o contratado</b> responde pelos encargos trabalhistas, previdenciários, fiscais e comerciais, e a inadimplência não se transfere à Administração. Exceção: em serviços contínuos com <b>dedicação exclusiva de mão de obra</b>, a Administração responde <b>solidariamente</b> pelos encargos previdenciários e <b>subsidiariamente</b> pelos trabalhistas, se comprovada <b>falha na fiscalização</b>. A Administração deve decidir expressamente as solicitações, no prazo de <b>1 mês</b> após a instrução (art. 123).", "<b>Alteração (arts. 124 a 136):</b> pode ser <b>unilateral</b> (modificação do projeto ou das especificações; acréscimo ou diminuição quantitativa do objeto) ou <b>por acordo</b> (substituição da garantia; mudança do regime de execução; forma de pagamento, sem antecipação; e restabelecimento do equilíbrio em caso de força maior, caso fortuito, fato do príncipe ou fatos imprevisíveis, ou previsíveis de consequências incalculáveis, respeitada a matriz de riscos). Nas alterações unilaterais, o contratado é obrigado a aceitar <b>acréscimos ou supressões de até 25%</b> do valor inicial atualizado e, em <b>reforma de edifício ou de equipamento</b>, acréscimos de até <b>50%</b> (art. 125). A alteração não pode <b>transfigurar o objeto</b> (art. 126).", "<b>Equilíbrio, reajuste e apostila:</b> a alteração unilateral que aumenta ou diminui encargos exige restabelecer o equilíbrio <b>no mesmo termo aditivo</b> (art. 130). O pedido de restabelecimento deve ser feito <b>durante a vigência</b> e <b>antes de eventual prorrogação</b>; a extinção do contrato não impede o reconhecimento do desequilíbrio, com indenização por termo indenizatório (art. 131). Na contratação integrada ou semi-integrada, é vedada a alteração de valores, salvo em quatro casos (art. 133). Serviços com dedicação exclusiva ou predominância de mão de obra usam a <b>repactuação</b>, com demonstração analítica da variação dos custos (art. 135). Por simples <b>apostila</b>, sem aditivo, registram-se o reajuste ou a repactuação previstos no contrato, atualizações financeiras, mudança de razão social e empenho (art. 136).", "<b>Extinção (arts. 137 a 139):</b> exige motivação formal nos autos, com contraditório e ampla defesa. Motivos: descumprimento do edital e do contrato, desatendimento de determinações do fiscal, alteração social que restrinja a capacidade, falência, insolvência ou morte, caso fortuito ou força maior, atraso de licença ambiental ou de liberação de áreas, razões de interesse público e descumprimento das cotas de PcD, reabilitado e aprendiz. O <b>contratado tem direito à extinção</b> se houver supressão acima do limite do art. 125, <b>suspensão por ordem escrita superior a 3 meses</b>, suspensões que somem <b>90 dias úteis</b>, <b>atraso superior a 2 meses</b> nos pagamentos, ou não liberação de área ou objeto nos prazos.", "<b>Formas e efeitos da extinção (arts. 138 e 139):</b> pode ser <b>unilateral</b> (ato escrito da Administração, salvo se o descumprimento for dela), <b>consensual</b> (acordo, conciliação, mediação ou comitê de resolução de disputas) ou por decisão <b>arbitral ou judicial</b>. Se houver culpa exclusiva da Administração, o contratado é ressarcido pelos prejuízos comprovados e tem direito à devolução da garantia, ao pagamento pelo que executou até a extinção e ao custo de desmobilização. A extinção unilateral pode gerar assunção imediata do objeto, ocupação de local, instalações e pessoal, execução da garantia e retenção de créditos.", "<b>Recebimento, pagamento e solução de conflitos:</b> obras e serviços têm recebimento <b>provisório</b> (pelo fiscal) e <b>definitivo</b> (por servidor ou comissão); os prazos e métodos vêm do regulamento ou do contrato (art. 140). O recebimento não exclui a responsabilidade civil pela <b>solidez e segurança</b> da obra. O pagamento obedece à <b>ordem cronológica</b>, por fonte de recursos e por categoria de contrato (art. 141). O pagamento <b>antecipado é vedado</b>, salvo se gerar sensível economia ou for condição indispensável, com justificativa e previsão no edital (art. 145). Podem ser usados conciliação, mediação, comitê de resolução de disputas e <b>arbitragem</b>, que será <b>sempre de direito e pública</b> (arts. 151 e 152)."], "pega": ["<b>Contrato verbal:</b> é nulo. A exceção é a pequena compra ou serviço de pronto pagamento até R$ 10.000,00 (valor atualizado). A banca troca por “válido sempre que houver urgência”.", "<b>PNCP:</b> a divulgação é condição de <b>eficácia</b>, e não de validade. Prazos: 20 dias úteis (licitação) e 10 dias úteis (contratação direta). A banca inverte os prazos ou usa dias corridos.", "<b>25% e 50%:</b> o limite geral é de 25% para acréscimos e supressões. Os 50% valem só para <b>acréscimos</b> em <b>reforma de edifício ou de equipamento</b>. A banca estende os 50% a toda obra.", "<b>Garantia:</b> quem escolhe a modalidade é o contratado, e não a Administração. Limite de 5%, com possibilidade de 10%, e 30% só no seguro-garantia de grande vulto.", "<b>Prazos:</b> contínuos têm contrato de até 5 anos e prorrogação até 10 anos. Só o usuário de serviço monopolizado pode ter prazo indeterminado. A banca troca por “prazo indeterminado nos serviços contínuos”.", "<b>Encargos trabalhistas:</b> a regra é que só o contratado responde. A Administração só responde, e de forma subsidiária, nos serviços com dedicação exclusiva de mão de obra e com falha comprovada na fiscalização. Pelos previdenciários, a responsabilidade é solidária.", "<b>Cláusulas econômicas:</b> a Administração pode modificar o objeto unilateralmente, mas não as cláusulas econômico-financeiras sem a concordância do contratado.", "<b>Equilíbrio:</b> o pedido deve ser feito antes da prorrogação. Depois dela, a banca diz que ainda cabe, e a lei diz que não.", "<b>Apostila ou aditivo:</b> reajuste e repactuação previstos no contrato vão por apostila. Acréscimo de objeto exige termo aditivo.", "<b>Pagamento:</b> a ordem cronológica é por fonte de recursos. O pagamento antecipado é a exceção, e a regra é a vedação. A banca inverte.", "<b>Extinção:</b> o contratado tem direito à extinção quando a suspensão ultrapassa 3 meses ou o atraso de pagamento passa de 2 meses. A banca troca pelos prazos da Lei 8.666 (120 dias de suspensão e 90 dias de atraso).", "<b>Arbitragem:</b> sempre de direito e com publicidade. “Por equidade” e “sigilosa” estão errados."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Ordem econômica e financeira, política urbana, política agrícola e função social da propriedade", "key": "CON", "nome": "Constitucional", "conc": ["<b>Edital:</b> ordem econômica e financeira: princípios gerais, política urbana, agrícola, fundiária, reforma agrária, função social da propriedade e intervenção do Estado no domínio econômico (CF, arts. 170 a 191). Não há norma de Curitiba nesta unidade. Os artigos foram conferidos no texto atualizado da Constituição no Planalto.", "<b>Fundamentos e princípios (art. 170):</b> a ordem econômica se funda na <b>valorização do trabalho humano e na livre iniciativa</b> e visa assegurar existência digna, conforme os ditames da justiça social. Princípios: soberania nacional, <b>propriedade privada</b>, <b>função social da propriedade</b>, livre concorrência, defesa do consumidor, defesa do meio ambiente (inclusive com tratamento diferenciado conforme o impacto), redução das desigualdades regionais e sociais, busca do pleno emprego e tratamento favorecido para as <b>empresas de pequeno porte</b> constituídas sob as leis brasileiras e com sede e administração no País.", "<b>Intervenção direta (art. 173):</b> a exploração direta de atividade econômica pelo Estado é <b>exceção</b>: só quando necessária aos <b>imperativos da segurança nacional</b> ou a <b>relevante interesse coletivo</b>, conforme definidos em lei. A lei estabelece o estatuto jurídico da empresa pública, da sociedade de economia mista e de suas subsidiárias que explorem atividade econômica (função social, regime próprio das empresas privadas, licitação e contratação com os princípios da administração pública, conselhos, mandatos e responsabilidade dos administradores). Elas <b>não podem gozar de privilégios fiscais</b> não extensivos ao setor privado (§ 2º).", "<b>Abuso do poder econômico (art. 173, §§ 4º e 5º):</b> a lei reprimirá o abuso do poder econômico que vise à <b>dominação dos mercados, à eliminação da concorrência e ao aumento arbitrário dos lucros</b>. A pessoa jurídica responde pelos atos contra a ordem econômica e financeira e contra a economia popular, <b>sem prejuízo da responsabilidade individual dos dirigentes</b>.", "<b>Intervenção indireta (art. 174):</b> como agente normativo e regulador, o Estado exerce as funções de <b>fiscalização, incentivo e planejamento</b>. O planejamento é <b>determinante para o setor público</b> e <b>indicativo para o setor privado</b>. A lei apoia o cooperativismo e o associativismo.", "<b>Serviços públicos e monopólio (arts. 175 e 177):</b> a prestação de serviços públicos incumbe ao Poder Público, diretamente ou sob concessão ou permissão, <b>sempre por licitação</b>. Constituem <b>monopólio da União</b>: pesquisa e lavra de petróleo e gás natural; refinação; importação e exportação dos derivados; transporte marítimo e por conduto; e pesquisa, lavra, enriquecimento e comércio de minérios e minerais nucleares, com exceção dos <b>radioisótopos</b>, cuja produção, comercialização e utilização podem ser autorizadas sob regime de permissão (EC 49/2006). A União pode contratar com empresas estatais ou privadas as atividades do monopólio.", "<b>Política urbana (art. 182):</b> é executada pelo <b>Município</b>, conforme diretrizes gerais fixadas em lei federal (Estatuto da Cidade), para ordenar o pleno desenvolvimento das funções sociais da cidade. O <b>plano diretor</b>, aprovado pela Câmara Municipal, é <b>obrigatório para cidades com mais de 20 mil habitantes</b> e é o instrumento básico da política urbana. A propriedade urbana cumpre sua <b>função social</b> quando atende às exigências do plano diretor (§ 2º). As desapropriações urbanas são feitas com <b>prévia e justa indenização em dinheiro</b> (§ 3º).", "<b>Instrumentos contra o solo ocioso (art. 182, § 4º):</b> mediante <b>lei municipal específica</b> para área incluída no plano diretor, o Município pode exigir do proprietário de solo urbano não edificado, subutilizado ou não utilizado, <b>sucessivamente</b>: (I) parcelamento ou edificação compulsórios; (II) IPTU progressivo no tempo; (III) desapropriação com pagamento em <b>títulos da dívida pública</b> de emissão previamente aprovada pelo <b>Senado</b>, com resgate em até <b>10 anos</b>, em parcelas anuais, iguais e sucessivas, assegurados o valor real da indenização e os juros legais.", "<b>Usucapião constitucional (arts. 183 e 191):</b> a <b>urbana especial</b> exige área de até <b>250 m²</b>, posse de <b>5 anos</b> ininterruptos e sem oposição, para moradia, e que o possuidor não seja proprietário de outro imóvel urbano ou rural. O direito não é reconhecido mais de uma vez ao mesmo possuidor, e o título pode ser dado ao homem, à mulher ou a ambos. A <b>rural</b> exige área de até <b>50 hectares</b>, 5 anos, produtividade pelo trabalho do possuidor ou de sua família, moradia e que não seja proprietário de outro imóvel. <b>Imóveis públicos não são adquiridos por usucapião</b> (arts. 183, § 3º, e 191, parágrafo único).", "<b>Reforma agrária (arts. 184 a 186):</b> compete à <b>União</b> desapropriar por interesse social, para reforma agrária, o imóvel rural que não cumpra sua função social, mediante prévia e justa indenização em <b>títulos da dívida agrária</b>, com preservação do valor real, resgatáveis em até <b>20 anos</b>, a partir do segundo ano de emissão. As <b>benfeitorias úteis e necessárias</b> são indenizadas <b>em dinheiro</b>. O decreto que declara o interesse social autoriza a ação, e lei complementar fixa o rito sumário. São <b>insuscetíveis</b> de desapropriação para esse fim a pequena e média propriedade rural (se o dono não possuir outra) e a <b>propriedade produtiva</b>.", "<b>Função social da propriedade rural (art. 186):</b> é cumprida quando a propriedade atende, <b>simultaneamente</b>, a quatro requisitos: aproveitamento racional e adequado; utilização adequada dos recursos naturais e preservação do meio ambiente; observância das normas trabalhistas; e exploração que favoreça o bem-estar de proprietários e trabalhadores.", "<b>Entendimentos do STF para memorizar:</b> a Súmula Vinculante 49 (e a Súmula 646) considera que <b>ofende a livre concorrência</b> a lei municipal que impede a instalação de estabelecimentos comerciais do mesmo ramo em determinada área. Pela Súmula Vinculante 38, o <b>Município é competente</b> para fixar o horário de funcionamento do comércio local."], "pega": ["<b>Intervenção direta:</b> a exploração direta é exceção. As hipóteses são segurança nacional ou relevante interesse coletivo. A banca troca por “interesse público” ou “qualquer atividade estratégica”.", "<b>Planejamento:</b> é determinante para o setor <b>público</b> e indicativo para o setor <b>privado</b>. A banca inverte as duas palavras.", "<b>Estatais econômicas:</b> sujeitam-se ao regime das empresas privadas, não gozam de privilégios fiscais não extensivos ao setor privado, mas devem licitar e contratar observando os princípios da administração pública.", "<b>Plano diretor:</b> aprovado pela Câmara, obrigatório acima de 20 mil habitantes. A banca fala em “aprovado por decreto do Prefeito” ou “obrigatório em qualquer Município”.", "<b>Pagamento da desapropriação:</b> a regra urbana é dinheiro. Títulos da dívida pública com resgate em 10 anos só na desapropriação-sanção do § 4º, e depois do parcelamento compulsório e do IPTU progressivo, nessa ordem.", "<b>Títulos:</b> os da dívida pública (urbana, Município, até 10 anos, aprovados pelo Senado) não se confundem com os da dívida agrária (reforma agrária, União, até 20 anos).", "<b>Benfeitorias:</b> as úteis e necessárias, na reforma agrária, são pagas em dinheiro, e não em títulos.", "<b>Usucapião:</b> urbana, 250 m²; rural, 50 hectares; ambas com 5 anos. Imóvel público nunca é usucapido. O direito vale uma só vez.", "<b>Reforma agrária:</b> não alcança a pequena e média propriedade (desde que o dono não tenha outra) nem a propriedade produtiva. A banca amplia ou reduz o rol.", "<b>Função social rural:</b> os quatro requisitos são cumulativos (“simultaneamente”). A banca diz que basta a produtividade.", "<b>Monopólio:</b> radioisótopos podem ser produzidos e utilizados sob permissão. A banca generaliza o monopólio absoluto de todo material nuclear.", "<b>Livre concorrência:</b> a lei municipal que impõe distância mínima entre estabelecimentos do mesmo ramo é inconstitucional (SV 49). Já fixar horário de funcionamento é competência do Município (SV 38)."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Embargos, exceção de pré-executividade, redirecionamento e prescrição intercorrente", "key": "TRI", "nome": "Tributário", "conc": ["<b>Edital:</b> processo judicial tributário: embargos à execução fiscal, exceção de pré-executividade, redirecionamento e prescrição intercorrente. Não há norma de Curitiba nesta unidade. Foram lidos no Planalto a Lei 6.830, o CTN já com a <b>LC 236/2026</b>, a LC 236/2026 inteira e o CPC (art. 921). As teses foram conferidas nos sites do STF e do STJ.", "<b>Embargos à execução fiscal:</b> prazo de 30 dias, só depois de garantida a execução, sem reconvenção nem compensação (Lei 6.830, art. 16). Eles <b>não suspendem automaticamente</b> a execução. Pelo <b>Tema 526 do STJ</b> (1ª Seção, 2013), o efeito suspensivo exige três requisitos: <b>garantia</b>, <b>relevância da fundamentação</b> e <b>perigo de dano irreparável ou de difícil reparação</b>.", "<b>Exceção de pré-executividade:</b> é a defesa feita nos próprios autos, sem garantia, para matérias de <b>ordem pública</b> conhecíveis de ofício, desde que <b>não exijam dilação probatória</b> (Súmula 393 do STJ). Provas e matérias que dependam de instrução ficam para os embargos.", "<b>Prescrição do crédito tributário (CTN, art. 174):</b> a ação de cobrança prescreve em <b>5 anos</b> da constituição definitiva do crédito. A <b>LC 236, de 4/9/2026</b>, deu nova redação ao dispositivo, e o antigo parágrafo único passou a § 1º. A prescrição se interrompe: <b>I</b> pelo despacho do juiz que ordenar a citação em execução fiscal; <b>II</b> pelo protesto extrajudicial da CDA ou pelo protesto judicial; <b>III</b> por qualquer ato judicial que constitua em mora o devedor; <b>IV</b> por ato inequívoco, ainda que extrajudicial, de reconhecimento do débito; e, <b>como novidade</b>, <b>V</b> pela instauração de mediação; <b>VI</b> pela instituição da arbitragem especial tributária e aduaneira, retroagindo ao requerimento; <b>VII</b> pela sentença de extinção da execução fiscal por não localização do executado ou de bens, se a prescrição intercorrente ainda não tiver começado; <b>VIII</b> pela informação do crédito na falência ou liquidação extrajudicial, ficando o prazo suspenso até o encerramento; <b>IX</b> pelo ato inicial da execução fiscal extrajudicial.", "<b>Recomeço do prazo (CTN, art. 174, § 3º):</b> a prescrição interrompida recomeça a correr da data do ato que a interrompeu ou do último ato do processo judicial ou extrajudicial. <b>Atenção:</b> questões de provas anteriores a setembro de 2026 trazem a redação antiga, com quatro incisos. A discussão sobre como o novo inciso VII convive com o art. 40 da Lei 6.830 está aberta na doutrina, e é preciso conferir a posição do STJ antes da prova.", "<b>Prescrição intercorrente (Lei 6.830, art. 40):</b> se o devedor não é localizado ou não são encontrados bens penhoráveis, o juiz <b>suspende a execução por 1 ano</b>, e <b>não corre a prescrição</b>. Passado o ano sem localização, os autos são <b>arquivados</b> (§ 2º), e voltam ao andamento se o devedor ou os bens forem encontrados (§ 3º). Se, depois do arquivamento, o prazo prescricional se completar, o juiz, <b>ouvida a Fazenda</b>, pode <b>reconhecer de ofício</b> a prescrição intercorrente (§ 4º). Para o CPC, o art. 921, § 1º, prevê o mesmo ano de suspensão.", "<b>Súmula 314 do STJ e Tema 566:</b> suspende-se o processo por 1 ano e, findo esse prazo, começa o prazo da prescrição quinquenal intercorrente. No <b>Tema 566</b> (1ª Seção, 12/09/2018), o STJ decidiu que o prazo de 1 ano de suspensão começa <b>automaticamente</b> quando a Fazenda toma ciência da <b>não localização do devedor ou da inexistência de bens penhoráveis</b>, e que o prazo prescricional corre em seguida, também automaticamente. A mera petição da Fazenda não interrompe o prazo; só a <b>citação</b> e a <b>penhora efetivas</b> o interrompem. Se a Fazenda alegar nulidade por falta de intimação, deve <b>demonstrar o prejuízo</b>.", "<b>Responsabilidade do sócio (CTN, art. 135, III):</b> o mero inadimplemento da sociedade <b>não gera</b>, por si só, a responsabilidade do sócio-gerente (Súmula 430 do STJ). A <b>dissolução irregular</b> da empresa, presumida quando ela deixa de funcionar no domicílio fiscal sem comunicação, autoriza o redirecionamento (Súmula 435 do STJ).", "<b>Quem pode ser redirecionado:</b> pelo <b>Tema 962</b> do STJ, o redirecionamento por dissolução irregular <b>não alcança</b> o sócio ou o terceiro não sócio que, embora tivesse poderes de gerência no fato gerador, <b>dela se retirou regularmente</b> e não deu causa à dissolução posterior. Pelo <b>Tema 981</b> (1ª Seção, 2022), o pedido pode ser dirigido ao sócio ou terceiro não sócio com <b>poderes de administração na época da dissolução irregular</b> (ou de sua presunção), ainda que ele <b>não tivesse poderes de gerência no fato gerador</b>.", "<b>Nome do sócio na CDA (Tema 103 do STJ):</b> se a execução foi proposta só contra a pessoa jurídica e o nome do sócio não consta da CDA, o ônus de provar a infração do art. 135 é da <b>Fazenda</b>. Se o nome do sócio constar da CDA, o ônus de provar a inexistência da infração passa ao <b>sócio</b>.", "<b>Prescrição para redirecionar (Tema 444 do STJ, 08/05/2019):</b> o prazo é de <b>5 anos</b>, contados da <b>citação da pessoa jurídica</b>, quando a dissolução irregular for anterior a essa citação. Se a dissolução for posterior, o prazo conta de ato inequívoco de frustração da cobrança, cuja prova cabe à Fazenda. Em qualquer caso, é preciso demonstrar a <b>inércia da Fazenda</b> no quinquênio.", "<b>IDPJ e grupo econômico (Tema 1.209 do STJ):</b> a Primeira Seção afetou, em recurso repetitivo, a compatibilidade do incidente de desconsideração da personalidade jurídica com a execução fiscal. Em novembro de 2026 <b>não há tese fixada</b>. A 1ª Turma admite o incidente para atingir empresa de mesmo grupo econômico fora da CDA e fora dos arts. 134 e 135 do CTN; a 2ª Turma o considera desnecessário para o grupo econômico de fato."], "pega": ["<b>Efeito suspensivo:</b> os embargos não suspendem a execução automaticamente. Exigem garantia, relevância da fundamentação e perigo de dano (Tema 526 do STJ).", "<b>Exceção de pré-executividade:</b> não exige garantia, mas só vale para matéria de ordem pública sem dilação probatória. A banca diz que serve para qualquer matéria, ou que exige garantia.", "<b>Marco do art. 174, I:</b> é o <b>despacho que ordena a citação</b>, e não a citação pessoal do devedor, que era a redação anterior à LC 118/2005. A banca antiga cobra a citação pessoal.", "<b>LC 236/2026:</b> o art. 174 ganhou novos marcos (mediação, arbitragem especial, sentença de extinção por não localização, falência, execução fiscal extrajudicial). Prova com texto antigo pode trazer só os quatro incisos originais. Leia o enunciado e a data.", "<b>Art. 40 da LEF:</b> o ano de suspensão não conta para a prescrição. Depois dele, corre o quinquênio, de modo que o prazo total é de <b>seis anos</b>. A banca diz que a prescrição corre durante o ano de suspensão ou que o prazo total é de cinco anos.", "<b>Tema 566:</b> o ano de suspensão começa automaticamente, com a ciência da Fazenda. A banca diz que depende de despacho do juiz ou de intimação para o arquivamento.", "<b>Interrupção da intercorrente:</b> petição da Fazenda não basta. É preciso citação ou penhora efetivas.", "<b>Prescrição de ofício:</b> o juiz pode reconhecê-la, mas depois de ouvir a Fazenda (art. 40, § 4º).", "<b>Redirecionamento:</b> inadimplemento não basta (Súmula 430). Dissolução irregular basta (Súmula 435). Sócio que se retirou regularmente antes da dissolução não responde (Tema 962), mas o administrador da época da dissolução responde mesmo que não administrasse no fato gerador (Tema 981).", "<b>Ônus da prova:</b> nome do sócio na CDA inverte o ônus para o sócio. Sem o nome na CDA, o ônus é da Fazenda.", "<b>Prazo do redirecionamento:</b> 5 anos da citação da pessoa jurídica, e não do fato gerador. A banca troca o termo inicial.", "<b>Tema 1.209:</b> o assunto está afetado, sem tese. Afirmar que o IDPJ é sempre necessário, ou sempre dispensável, na execução fiscal é afirmar o que o STJ ainda não decidiu."]}, {"materia": "PROCESSO CIVIL", "titulo": "Juros, correção monetária e prescrição contra a Fazenda Pública", "key": "PCV", "nome": "Proc. Civil", "conc": ["<b>Edital:</b> encargos financeiros e prescrição envolvendo a Fazenda Pública: juros, atualização monetária e demais valores devidos pela Fazenda; prescrição contra a Fazenda e prescrição intercorrente; Decreto 20.910/1932 e Decreto-Lei 4.597/1942. Não há norma de Curitiba nesta unidade. Decretos, EC 113 e EC 136 lidos no Planalto, e as teses conferidas nos sites do STF e do STJ.", "<b>Prescrição quinquenal (Decreto 20.910/1932, art. 1º):</b> as dívidas passivas e todo e qualquer direito ou ação contra a Fazenda federal, estadual ou municipal, seja qual for a natureza, prescrevem em <b>5 anos</b> contados da data do ato ou fato do qual se originaram. O <b>Decreto-Lei 4.597/1942 (art. 2º)</b> estende o regime às <b>autarquias</b> e entidades paraestatais criadas por lei e mantidas por impostos, taxas ou contribuições. As prestações periódicas prescrevem <b>progressivamente</b>, à medida que completam o prazo (art. 3º).", "<b>Indenização contra a Fazenda:</b> pelo <b>Tema 553 do STJ</b>, aplica-se o prazo de <b>5 anos</b> do Decreto 20.910 às ações indenizatórias contra a Fazenda Pública, e não o prazo de 3 anos do Código Civil. A <b>Súmula 150 do STF</b> diz que a execução prescreve no mesmo prazo da ação. A <b>Súmula 85 do STJ</b> trata das relações de trato sucessivo: se o direito em si não foi negado, a prescrição atinge só as prestações vencidas antes do quinquênio anterior ao ajuizamento.", "<b>Suspensão e interrupção (Decreto 20.910, arts. 4º a 10):</b> não corre a prescrição durante a demora da repartição em estudar, reconhecer ou pagar a dívida líquida, contada da entrada do requerimento no protocolo. A demora do titular em prestar esclarecimentos ou em dar andamento ao feito <b>não</b> suspende. A reclamação administrativa sem prazo previsto prescreve em <b>1 ano</b> (art. 6º). A prescrição <b>só pode ser interrompida uma vez</b> (art. 8º), e, interrompida, <b>recomeça pela metade do prazo</b> (art. 9º). Para a <b>Súmula 383 do STF</b>, ela recomeça por dois anos e meio, mas não fica reduzida a menos de 5 anos. Os prazos menores previstos em lei especial continuam valendo (art. 10).", "<b>Prescrição intercorrente no cumprimento de sentença (CPC, art. 921):</b> a execução é suspensa por <b>1 ano</b> quando o executado ou os bens não são localizados, e a prescrição fica suspensa. O termo inicial da prescrição no curso do processo é a <b>ciência da primeira tentativa infrutífera</b> de localizar o devedor ou bens, suspensa uma única vez pelo prazo máximo de 1 ano (§ 4º). A efetiva <b>citação, intimação ou constrição de bens</b> interrompe a prescrição (§ 4º-A).", "<b>Ressarcimento ao erário (STF):</b> é <b>imprescritível</b> a ação de ressarcimento fundada em ato doloso de improbidade (Tema 897). É <b>prescritível</b> a ação de reparação de danos à Fazenda por ilícito civil (Tema 666) e a pretensão de ressarcimento fundada em decisão de Tribunal de Contas (Tema 899).", "<b>Antes da EC 113:</b> o art. 1º-F da Lei 9.494 (redação da Lei 11.960/2009) mandava aplicar a poupança (TR e juros). No <b>Tema 810</b>, o STF declarou inconstitucional a TR para a correção monetária (aplicando-se o IPCA-E) e manteve os juros da poupança nas condenações não tributárias. Nas condenações de natureza <b>tributária</b>, aplicam-se os mesmos critérios com que a Fazenda corrige o seu crédito. O <b>Tema 905 do STJ</b> detalhou: previdenciário, correção pelo INPC e juros da poupança; servidores, juros da poupança desde julho de 2009 e IPCA-E; repetição de indébito tributário, mesmo critério da cobrança de tributo pago em atraso, com a Selic se a lei do ente a previr, sem cumulação com outros índices.", "<b>EC 113/2021, art. 3º (redação original):</b> nas discussões e condenações da Fazenda, de qualquer natureza, a atualização monetária, a remuneração do capital e a compensação da mora, inclusive do precatório, passaram a ser feitas pela <b>Selic, uma única vez</b>, acumulada mensalmente. O <b>Tema 1.419 do STF</b> (30/08/2025) fixou que a Selic se aplica em qualquer discussão ou condenação da Fazenda, inclusive na cobrança judicial de créditos tributários. Em maio de 2026, o STF rejeitou os embargos e a modulação e entendeu que a tese vale só para o período da redação original.", "<b>EC 136/2025 (promulgada em 9/9/2025):</b> deu nova redação ao art. 3º da EC 113. Nos <b>requisitórios da Fazenda federal</b>, da expedição ao pagamento, a atualização é pelo <b>IPCA</b> com <b>juros simples de 2% ao ano</b>, vedados juros compensatórios. Se esse total ficar acima da <b>Selic</b>, aplica-se a Selic (§ 1º). Nos processos <b>tributários</b>, usam-se os critérios com que a Fazenda remunera seu crédito (§ 2º). Durante o prazo do art. 100, § 5º (até o fim do exercício seguinte), <b>não incidem juros de mora</b> sobre os precatórios pagos nele (§ 3º). Para <b>Estados, DF e Municípios</b>, a regra equivalente é o § 16 do art. 97 do ADCT: IPCA mais 2% ao ano a partir de <b>1º de agosto de 2025</b>, com a Selic no lugar se for menor o total (§ 16-A).", "<b>Fase anterior à expedição:</b> o regime da EC 136 vale da expedição ao pagamento. Para o período anterior (conhecimento e liquidação), o STF discute qual índice vale no <b>Tema 1.484</b>, e até outubro de 2026 <b>não havia tese</b>. O Tema 1.457 discute o termo inicial da Selic antes da EC 136.", "<b>Juros no precatório:</b> a <b>Súmula Vinculante 17</b> afirma que não incidem juros de mora no período entre a expedição do precatório e o pagamento, desde que feito no prazo constitucional. No <b>Tema 96 do STF</b> (RE 579.431), incidem juros de mora entre a data da elaboração do cálculo e a da expedição do requisitório."], "pega": ["<b>5 e 3 anos:</b> contra a Fazenda, a prescrição é de 5 anos (Decreto 20.910), inclusive na indenização (Tema 553). A banca aplica o prazo de 3 anos do Código Civil.", "<b>Interrupção:</b> só uma vez, e recomeça pela metade, mas nunca por menos de 5 anos (Súmula 383). A banca diz que pode ser interrompida mais de uma vez.", "<b>Demora do credor:</b> a demora do titular em prestar esclarecimentos não suspende. A suspensão decorre da demora da repartição em estudar ou pagar a dívida líquida.", "<b>Trato sucessivo:</b> se o direito não foi negado, prescrevem só as parcelas anteriores ao quinquênio (Súmula 85). Se o direito foi negado, atinge-se o fundo de direito.", "<b>Autarquias:</b> o regime quinquenal também as alcança (DL 4.597, art. 2º). A banca limita à Administração direta.", "<b>Execução:</b> prescreve no mesmo prazo da ação (Súmula 150 do STF).", "<b>Intercorrente do CPC:</b> o termo inicial é a ciência da primeira tentativa infrutífera, a suspensão é de 1 ano e uma única vez, e citação, intimação ou constrição efetivas interrompem.", "<b>Erário:</b> improbidade dolosa, imprescritível (Tema 897). Ilícito civil, prescritível (Tema 666). Decisão de Tribunal de Contas, prescritível (Tema 899).", "<b>TR e poupança:</b> a TR é inconstitucional para a correção (IPCA-E). Os juros da poupança foram mantidos nas condenações não tributárias. Nas tributárias, usam-se os critérios do crédito tributário. A banca confunde as duas coisas.", "<b>Selic ou IPCA mais 2%:</b> a Selic única da EC 113 (Tema 1.419) vale para o período da redação original. A partir da EC 136, requisitórios usam IPCA mais 2% ao ano, e a Selic entra se esse total for maior que ela. Atenção à data que a questão pergunta.", "<b>União, Estados e Municípios:</b> a nova regra da União está no art. 3º da EC 113, e a dos demais entes, no art. 97, § 16, do ADCT. O índice é o mesmo, e a vigência é de 1º/8/2025 para os entes subnacionais.", "<b>Precatório sem juros:</b> não há juros de mora no prazo constitucional para pagamento (SV 17 e EC 136). Antes da expedição, entre o cálculo e a expedição, há juros (Tema 96).", "<b>Tema 1.484:</b> está sem tese. A banca não pode afirmar como pacificado o índice da fase anterior à expedição depois da EC 136."]}], "17": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Lei das Estatais (Lei 13.303/2016) e Contrato Público para Solução Inovadora (LC 182/2021)", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 7 de Direito Administrativo, <b>Lei das estatais (Lei 13.303/2016)</b> e <b>Contrato Público para Solução Inovadora (CPSI)</b> e contrato de fornecimento decorrente, nos termos da <b>LC 182/2021</b>. Não há norma de Curitiba nesta unidade (a PARS S/A e o PMPE ficam na unidade 18). Os artigos foram conferidos no texto das leis no site do Planalto.", "Âmbito (art. 1º): estatuto jurídico da <b>empresa pública</b>, da <b>sociedade de economia mista</b> e de suas subsidiárias, de qualquer ente (União, Estados, DF e Municípios), que <b>explore atividade econômica</b> de produção ou comercialização de bens ou de prestação de serviços, <b>ainda que em monopólio ou de serviço público</b>. Submetem-se também a sociedade controlada, inclusive a de propósito específico (§ 6º), e a estatal que participe de consórcio na condição de <b>operadora</b> (§ 5º).", "Estatais de menor porte (art. 1º, §§ 1º, 3º e 4º): o <b>Título I</b> (estatuto de governança) não se aplica, salvo os arts. 2º a 8º, 11, 12 e 27, à estatal que tiver, com suas subsidiárias, <b>receita operacional bruta inferior a R$ 90 milhões</b> no exercício anterior. Cabe ao Poder Executivo editar regras de governança para elas; se não o fizer em 180 dias da publicação da Lei, aplicam-se as regras do Título I. <b>A licitação e os contratos continuam regidos pela Lei.</b>", "Governança e controle (arts. 6º a 12): o art. 9º exige estrutura de <b>gestão de riscos e controle interno</b>, área de verificação de conformidade, <b>auditoria interna</b>, <b>Comitê de Auditoria Estatutário</b> e <b>Código de Conduta e Integridade</b>. O art. 10 manda criar <b>comitê estatutário</b> para verificar a conformidade da indicação e da avaliação dos membros do Conselho de Administração e do Conselho Fiscal. O art. 8º traz as exigências de transparência, como a carta anual com os compromissos de políticas públicas.", "Administradores (arts. 13, 17 e 22): conselheiros e diretores devem ter <b>reputação ilibada e notório conhecimento</b>, experiência de <b>10 anos</b> na área (ou 4 anos em cargo de direção ou chefia superior, entre outras alternativas), formação acadêmica compatível e ausência de inelegibilidade. O § 2º do art. 17 veda a indicação, entre outros, de representante do órgão regulador, <b>Ministro de Estado, Secretário de Estado e Secretário Municipal</b>, dirigente estatutário de partido, titular de mandato no Legislativo (ainda que licenciado), quem atuou nos últimos <b>36 meses</b> em estrutura decisória de partido ou em campanha eleitoral, e dirigente sindical. O Conselho de Administração tem no mínimo <b>25% de conselheiros independentes</b> (ou 1, se houver voto múltiplo). O prazo de gestão é <b>unificado, de até 2 anos, com até 3 reconduções consecutivas</b> (art. 13, VI); no Conselho Fiscal, até 2 anos e 2 reconduções.", "ADI 7331 (STF, 9/5/2024): por maioria, o Plenário considerou <b>válidas as restrições</b> do art. 17, § 2º, incisos I e II, à indicação de políticos e dirigentes partidários. A lógica: não se impede ninguém de ocupar cargo por opinião política, mas a lei pode presumir <b>conflito objetivo de interesses</b> de quem exerceu direção partidária ou atuou em campanha. Por unanimidade, os indicados desde a liminar do relator (Min. Lewandowski, março de 2023) <b>permanecem até o fim dos mandatos</b>.", "Regra e hipóteses sem licitação (arts. 28 a 30): contratos de serviços, obras, compras, locação e alienação são <b>precedidos de licitação</b> (art. 28), salvo dispensa (art. 29) e inexigibilidade (art. 30). O art. 28, § 3º, afasta o dever de licitar em duas situações: (i) <b>atividade-fim</b>, isto é, comercialização, prestação ou execução direta de produtos, serviços ou obras especificamente relacionados ao objeto social; (ii) <b>oportunidades de negócio</b>, quando a escolha do parceiro se associa a características particulares e se justifica a inviabilidade de procedimento competitivo. Aplicam-se às licitações das estatais os arts. 42 a 49 da LC 123/2006 (tratamento favorecido a ME e EPP).", "Dispensa e inexigibilidade (arts. 29 e 30): a dispensa por valor alcança <b>obras e serviços de engenharia até R$ 100.000,00</b> e <b>outros serviços e compras até R$ 50.000,00</b>, sem fracionamento. Há ainda dispensa para licitação deserta justificada, preços manifestamente superiores aos de mercado, compra ou locação de imóvel cuja instalação e localização condicionem a escolha, entre outras. A <b>inexigibilidade</b> decorre da inviabilidade de competição: fornecedor exclusivo; serviços técnicos especializados de profissional ou empresa de notória especialização (<b>vedada para publicidade e divulgação</b>); profissional do setor artístico consagrado.", "Procedimento (arts. 31, 32, 40 e 51 a 56): o art. 31 fixa os princípios (impessoalidade, moralidade, igualdade, publicidade, eficiência, probidade, economicidade, desenvolvimento nacional sustentável, vinculação ao instrumento convocatório e julgamento objetivo) e o dever de evitar sobrepreço e superfaturamento. Cada estatal deve manter <b>regulamento interno de licitações e contratos</b> (art. 40). As <b>fases</b> (art. 51): preparação, divulgação, lances ou propostas, julgamento, verificação de efetividade, negociação, <b>habilitação</b>, recursos, adjudicação e homologação. A habilitação, em regra, vem depois do julgamento, mas pode antecedê-lo, excepcionalmente, se o edital previr (§ 1º). Modos de disputa: <b>aberto</b>, <b>fechado</b> ou a combinação de ambos (art. 52). Critérios de julgamento (art. 54): menor preço, maior desconto, melhor combinação de técnica e preço, melhor técnica, melhor conteúdo artístico, maior oferta de preço, maior retorno econômico e melhor destinação de bens alienados.", "Contratos (arts. 68 a 84): as cláusulas necessárias estão no art. 69. A duração é de <b>até 5 anos</b>, salvo projetos contemplados no plano de negócios e investimentos ou prazo maior que seja prática rotineira de mercado (art. 71). Na alteração por acordo (art. 81), o contratado <b>poderá aceitar</b> acréscimos ou supressões de até <b>25%</b> do valor inicial atualizado e, em reforma de edifício ou de equipamento, de até <b>50%</b> nos acréscimos (§ 1º); nenhum acréscimo ou supressão pode exceder esses limites, salvo supressões resultantes de acordo (§ 2º). O reequilíbrio econômico-financeiro vale para fatos imprevisíveis, ou previsíveis de consequências incalculáveis, força maior, caso fortuito e fato do príncipe.", "Sanções (arts. 83 e 84): pela inexecução total ou parcial, e garantida a prévia defesa, a estatal pode aplicar <b>advertência</b>, <b>multa</b> e <b>suspensão temporária</b> de participação em licitação e impedimento de contratar com a entidade sancionadora, por prazo <b>não superior a 2 anos</b>. A advertência e a suspensão podem ser aplicadas junto com a multa, e a defesa prévia é de <b>10 dias úteis</b> (§ 2º). Se a multa for superior à garantia, o contratado responde pela diferença (§ 1º). O art. 84 estende a suspensão a empresas e profissionais condenados por fraude fiscal dolosa, que praticaram atos ilícitos para frustrar a licitação ou que não demonstrem idoneidade para contratar.", "CPSI, licitação especial (LC 182/2021, art. 13): a Administração pode contratar pessoas físicas ou jurídicas, isoladamente ou em consórcio, para <b>testar soluções inovadoras</b>, com ou sem risco tecnológico, por <b>licitação na modalidade especial</b>. O escopo pode se limitar ao <b>problema e aos resultados esperados</b>, sem descrever a solução. O edital é divulgado com antecedência mínima de <b>30 dias corridos</b> no sítio oficial centralizado de licitações e no diário oficial. As propostas são julgadas por <b>comissão especial de, no mínimo, 3 pessoas</b> de reputação ilibada e reconhecido conhecimento, sendo 1 servidor do órgão e 1 professor de instituição pública de ensino superior da área. O preço só é critério de julgamento nos critérios de viabilidade econômica e de custo-benefício (§ 5º). A habilitação vem <b>depois</b> do julgamento e só dos selecionados (§ 7º). Pode haver mais de um selecionado (§ 6º), negociação (§ 9º) e aceitação de preço acima da estimativa, com justificativa (§ 10).", "CPSI, o contrato (art. 14): celebrado após a homologação, com vigência de até <b>12 meses</b>, prorrogável por mais até <b>12</b>. O valor máximo é de <b>R$ 1.600.000,00</b> por CPSI (o edital pode fixar limite menor). A remuneração segue um destes critérios: preço fixo; preço fixo mais remuneração variável de incentivo; reembolso de custos; reembolso mais variável de incentivo; ou reembolso mais remuneração fixa de incentivo. Havendo <b>risco tecnológico</b>, paga-se proporcionalmente ao trabalho executado, ainda que o resultado não seja atingido (salvo a parcela variável de incentivo), sem prejuízo da rescisão se comprovada a inviabilidade técnica ou econômica. O CPSI deve prever metas, relatórios, <b>matriz de riscos</b>, titularidade da propriedade intelectual e participação nos resultados.", "Contrato de fornecimento (art. 15): encerrado o CPSI, a Administração <b>pode</b> contratar a mesma contratada, <b>sem nova licitação</b>, para fornecer o produto, o processo ou a solução, ou para integrá-la à infraestrutura ou ao processo de trabalho. Se mais de uma contratada cumprir as metas, escolhe-se, com justificativa, aquela de melhor relação custo-benefício (§ 1º). A vigência é de até <b>24 meses</b>, prorrogável por mais até <b>24</b> (§ 2º). O valor é limitado a <b>5 vezes</b> o teto do CPSI, ou seja, R$ 8 milhões, incluídas as prorrogações, ressalvados reajuste e acréscimos legais (§ 3º)."], "pega": ["Âmbito: a Lei alcança a empresa pública e a sociedade de economia mista que explorem atividade econômica, <b>ainda que em monopólio ou de serviço público</b>. A banca limita a aplicação às estatais que exploram atividade econômica em sentido estrito.", "R$ 90 milhões: a exceção atinge o <b>Título I</b> (governança), com ressalvas. A licitação e os contratos continuam sob a Lei. A banca diz que a estatal pequena está livre de licitar.", "Habilitação: em regra <b>depois</b> do julgamento; só pode vir <b>antes</b>, excepcionalmente, se o edital prever. A banca troca por “sempre antes” ou “sempre depois”.", "Dever de licitar: a atividade-fim e as oportunidades de negócio (art. 28, § 3º) <b>ficam fora do capítulo da licitação</b>, o que é diferente da dispensa do art. 29. A banca confunde as duas figuras.", "Valores: dispensa por valor de <b>R$ 100.000,00</b> (obras e serviços de engenharia) e <b>R$ 50.000,00</b> (outros serviços e compras). A banca troca os valores ou usa os da Lei 14.133.", "Inexigibilidade: não vale para <b>publicidade e divulgação</b>, mesmo que haja notória especialização.", "Sanções: só <b>advertência, multa e suspensão de até 2 anos</b>, com defesa prévia de <b>10 dias úteis</b>. A banca inclui a declaração de inidoneidade ou fala em 5 anos.", "25% e 50%: na Lei 13.303 o contratado <b>“poderá aceitar”</b> os acréscimos e supressões, e não “é obrigado” (esta é a redação da Lei 14.133). Os 50% valem só para acréscimos em reforma de edifício ou de equipamento.", "Prazo do contrato: <b>até 5 anos</b>, com exceções (projetos do plano de negócios e investimentos; prática rotineira de mercado). A banca diz “10 anos” ou “prazo indeterminado”.", "Administradores: quarentena de <b>36 meses</b> para quem atuou em estrutura decisória de partido ou em campanha; vedação ao Secretário Municipal e ao titular de mandato legislativo, ainda que licenciado. Na <b>ADI 7331</b>, o STF manteve as restrições. O prazo de gestão é unificado, de até 2 anos, com até <b>3 reconduções</b> (Conselho Fiscal: 2). A banca diz que as restrições foram declaradas inconstitucionais ou troca as reconduções.", "CPSI: contrato de <b>12 + 12 meses</b>, teto de <b>R$ 1,6 milhão</b>. Contrato de fornecimento de <b>24 + 24 meses</b>, limitado a <b>5 vezes</b> o teto do CPSI. A banca inverte as vigências ou muda o limite.", "CPSI, licitação: é <b>modalidade especial</b>, com edital de 30 dias corridos, julgamento antes da habilitação e comissão de 3 pessoas (um servidor do órgão e um professor de instituição pública de ensino superior). O contrato de fornecimento dispensa nova licitação, mas a Administração <b>“pode”</b>, e não “deve”, celebrá-lo.", "Risco tecnológico: o pagamento é proporcional ao trabalho executado, <b>mesmo que o resultado não seja alcançado</b> (salvo a parcela variável de incentivo). A banca diz que só se paga se a solução funcionar."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Seguridade social, saúde (SUS), assistência social e dispensação de medicamentos", "key": "CON", "nome": "Constitucional", "conc": ["Edital: item 11 de Direito Constitucional, ordem social, seguridade social, saúde, previdência e assistência social; Sistema Único; Lei Orgânica da Assistência Social (Lei 8.742/1993); Sistema Único de Saúde (Leis 8.080/1990 e 8.142/1990); política de dispensação de medicamentos e responsabilidade dos entes da Federação. Não há norma de Curitiba nesta unidade. A Constituição e as leis foram conferidas no site do Planalto, já com a <b>EC 140/2026</b> e as alterações recentes da Lei 8.080.", "Seguridade social (arts. 194 e 195): conjunto integrado de ações dos Poderes Públicos e da sociedade para assegurar <b>saúde, previdência e assistência social</b>. Objetivos (art. 194, parágrafo único): universalidade da cobertura e do atendimento; <b>uniformidade e equivalência</b> dos benefícios para as populações urbanas e rurais; seletividade e distributividade; irredutibilidade do valor dos benefícios; equidade no custeio; diversidade da base de financiamento; e caráter democrático e descentralizado da administração, com <b>gestão quadripartite</b> (trabalhadores, empregadores, aposentados e Governo).", "Financiamento (art. 195): toda a sociedade, de forma direta e indireta, com recursos orçamentários dos entes federados e com contribuições sociais. Nenhum benefício ou serviço pode ser criado, majorado ou estendido <b>sem a correspondente fonte de custeio total</b> (§ 5º). As contribuições só podem ser exigidas após <b>90 dias</b> da publicação da lei que as instituiu ou aumentou, sem a anterioridade anual (§ 6º). São isentas as entidades beneficentes de assistência social que atendam às exigências da lei (§ 7º). Para o STF (RE 566.622, Tema 32), os <b>requisitos</b> da imunidade dependem de <b>lei complementar</b>, e a lei ordinária pode tratar apenas dos aspectos procedimentais.", "Saúde (arts. 196 a 200): direito de todos e dever do Estado, garantido por políticas sociais e econômicas e por acesso <b>universal e igualitário</b>. As ações e serviços são de relevância pública, executados diretamente ou por terceiros (art. 197). O SUS é uma <b>rede regionalizada e hierarquizada</b>, organizada em sistema único, com as diretrizes de <b>descentralização com direção única em cada esfera de governo</b>, <b>atendimento integral</b> com prioridade às atividades preventivas e <b>participação da comunidade</b> (art. 198). A <b>EC 140/2026</b> acrescentou o inciso IV: a atuação obrigatória e permanente dos agentes comunitários de saúde (ACS) e dos agentes de combate às endemias (ACE) é <b>essencial ao SUS e exclusiva de Estado</b>.", "ACS e ACE (art. 198, §§ 4º a 10): os gestores locais admitem esses agentes por <b>processo seletivo público</b> (§ 4º). Pela EC 140/2026, é <b>vedada a contratação temporária ou terceirizada</b>, salvo emergência em saúde pública (§ 4º-A), e eles se submetem ao regime dos servidores de <b>cargo efetivo</b> (§ 4º-B). Lei federal dispõe sobre o regime jurídico, o piso salarial profissional nacional e as diretrizes de carreira (§ 5º). O vencimento fica sob responsabilidade da <b>União</b>, com dotação própria, e não pode ser inferior a <b>2 salários mínimos</b>, repassados aos entes (§§ 7º a 9º, EC 120/2022).", "Financiamento da saúde (art. 198, §§ 1º a 3º): o SUS é financiado com recursos da seguridade social, da União, dos Estados, do DF e dos Municípios. A União aplica, no mínimo, <b>15% da receita corrente líquida</b> (EC 86/2015). Os percentuais de Estados, DF e Municípios sobre a arrecadação de impostos e as transferências são fixados em <b>lei complementar</b>, reavaliada ao menos a cada 5 anos (§ 3º). A LC 141/2012 fixou <b>12% para os Estados</b> e <b>15% para os Municípios e o DF</b>. Com a EC 132/2023, a base também inclui o IBS (art. 156-A).", "Iniciativa privada (art. 199): a assistência à saúde é <b>livre à iniciativa privada</b>. As instituições privadas participam do SUS <b>de forma complementar</b>, por <b>contrato de direito público ou convênio</b>, com preferência para as entidades filantrópicas e as sem fins lucrativos (§ 1º). É vedada a destinação de recursos públicos para auxílios ou subvenções a instituições privadas <b>com fins lucrativos</b> (§ 2º) e a participação direta ou indireta de empresas ou capitais estrangeiros na assistência à saúde, <b>salvo nos casos previstos em lei</b> (§ 3º). O art. 200 lista competências do SUS, como controlar e fiscalizar procedimentos, produtos e substâncias de interesse para a saúde, executar ações de vigilância sanitária e epidemiológica e de saúde do trabalhador, e participar da política de saneamento básico.", "Lei 8.080/1990 (organização do SUS): a saúde é direito fundamental do ser humano, e o dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade. Entre os princípios (art. 7º) estão a universalidade de acesso, a integralidade, a igualdade, o direito à informação, a participação da comunidade e a descentralização político-administrativa com <b>direção única em cada esfera de governo</b>, com ênfase na descentralização para os Municípios, na regionalização e na hierarquização. À <b>direção municipal</b> compete planejar, organizar, controlar e avaliar as ações e serviços de saúde, gerir e executar os serviços públicos de saúde e executar serviços de vigilância epidemiológica e sanitária, alimentação e nutrição, saneamento básico, saúde do trabalhador e saúde bucal (art. 18, redação da Lei 14.572/2023). A pactuação entre gestores ocorre na <b>Comissão Intergestores Tripartite (CIT)</b> e nas <b>Comissões Intergestores Bipartites (CIB)</b>.", "Lei 8.142/1990 (participação e transferências): institui as <b>Conferências de Saúde</b> (a cada 4 anos) e os <b>Conselhos de Saúde</b> (caráter permanente e deliberativo), com representantes do governo, dos prestadores, dos profissionais e dos usuários, que têm <b>metade das vagas</b> (paridade). Para receber os recursos do Fundo Nacional de Saúde por repasse regular e automático (fundo a fundo), Municípios, Estados e DF devem contar com <b>Fundo de Saúde, Conselho de Saúde paritário, plano de saúde, relatórios de gestão, contrapartida orçamentária</b> e comissão de elaboração do plano de carreira, cargos e salários (art. 4º).", "Assistência social (arts. 203 e 204; Lei 8.742/1993, a LOAS): prestada a quem dela necessitar, <b>independentemente de contribuição</b> à seguridade. Objetivos: proteção à família, à maternidade, à infância, à adolescência e à velhice; amparo a crianças e adolescentes carentes; integração ao mercado de trabalho; habilitação e reabilitação da pessoa com deficiência; garantia de <b>1 salário mínimo</b> ao idoso e à pessoa com deficiência sem meios de manutenção (BPC); e, desde a EC 114/2021, redução da vulnerabilidade socioeconômica de famílias em situação de pobreza ou extrema pobreza. Diretrizes (art. 204): <b>descentralização político-administrativa</b> (coordenação e normas gerais na esfera federal; coordenação e execução dos programas nas esferas estadual e municipal e em entidades beneficentes) e <b>participação da população</b>. O repasse aos entes exige <b>Conselho de Assistência Social paritário, Fundo e Plano de Assistência Social</b>, além de comprovação orçamentária de recursos próprios (LOAS, art. 30).", "O Município na assistência (LOAS, arts. 15 e 22): compete ao Município destinar recursos para os <b>benefícios eventuais</b>, pagar os <b>auxílios natalidade e funeral</b>, executar projetos de enfrentamento da pobreza, atender ações assistenciais de caráter de emergência e prestar os serviços assistenciais. Benefícios eventuais são as provisões suplementares e provisórias prestadas em virtude de nascimento, morte, vulnerabilidade temporária e calamidade pública (art. 22).", "BPC (art. 203, V; LOAS, art. 20): benefício de <b>1 salário mínimo mensal</b> à pessoa com deficiência e ao idoso com <b>65 anos ou mais</b> que não tenham meios de prover a própria manutenção nem de tê-la provida pela família. A renda familiar mensal <b>per capita</b> deve ser igual ou inferior a <b>1/4 do salário mínimo</b> (art. 20, § 3º, redação da Lei 14.176/2021). Deficiência é o impedimento de <b>longo prazo</b> de natureza física, mental, intelectual ou sensorial que, em interação com barreiras, pode obstruir a participação plena e efetiva na sociedade (§ 2º). A concessão exige avaliação médica e social (§ 6º), e a Lei 15.077/2024 incluiu a avaliação também na via judicial (§ 2º-A) e regras de cálculo da renda (§ 3º-A). O BPC não se acumula com outro benefício da seguridade ou de outro regime, salvo assistência médica, pensão especial indenizatória e transferências de renda (§ 4º), e o acolhimento em instituição de longa permanência não prejudica o direito (§ 5º). Para o STF, o critério de 1/4 não é limite absoluto (RE 567.985), o benefício de 1 salário mínimo já concedido a outro membro da família não entra no cálculo da renda per capita (RE 580.963) e o <b>estrangeiro residente</b> no País, preenchidos os requisitos, tem direito ao BPC (RE 587.970).", "Dispensação de medicamentos na Lei 8.080 (arts. 19-M a 19-T): a assistência terapêutica integral compreende a <b>dispensação de medicamentos e produtos de interesse para a saúde</b> prescritos conforme o <b>protocolo clínico e diretriz terapêutica (PCDT)</b> e a oferta de procedimentos constantes de tabelas do gestor federal (art. 19-M). Na falta de protocolo, a dispensação segue as <b>relações de medicamentos</b> do gestor federal (responsabilidade pactuada na <b>CIT</b>), dos Estados (na <b>CIB</b>) e dos Municípios (no <b>Conselho Municipal de Saúde</b>) (art. 19-P). A incorporação, a exclusão ou a alteração de tecnologias e de PCDT cabem ao <b>Ministério da Saúde</b>, assessorado pela <b>Conitec</b> (art. 19-Q), em processo administrativo de até <b>180 dias</b>, prorrogável por <b>90 dias corridos</b> (art. 19-R). A Lei 15.379/2026 incluiu a <b>imunoterapia</b> nos protocolos do câncer, quando superior ou mais segura que as opções tradicionais (art. 19-O, § 2º). São <b>vedados</b> o pagamento, o ressarcimento e a dispensação de medicamento experimental ou <b>sem registro na Anvisa</b> (art. 19-T), com exceções legais, como o uso diverso do registrado recomendado pela Conitec (Lei 14.313/2022).", "Responsabilidade dos entes (Tema 793 do STF): os entes federados são <b>solidariamente responsáveis</b> nas demandas prestacionais de saúde, em razão da competência comum. Mas, diante dos critérios constitucionais de descentralização e hierarquização, cabe ao juiz <b>direcionar o cumprimento</b> conforme as regras de repartição de competências e determinar o <b>ressarcimento</b> a quem suportou o ônus financeiro.", "Medicamento não incorporado (Tema 6 do STF; SV 61): para o medicamento <b>registrado na Anvisa, mas não incorporado</b> ao SUS, o autor deve provar, <b>cumulativamente</b>: negativa administrativa; ilegalidade da não incorporação pela Conitec (inclusive ausência de pedido ou demora injustificada); impossibilidade de substituição por outro das listas e protocolos do SUS; eficácia, acurácia, efetividade e segurança com <b>evidência de alto nível</b> (ensaios clínicos randomizados, revisão sistemática ou meta-análise); <b>imprescindibilidade clínica</b>, por laudo fundamentado; e <b>incapacidade financeira</b>. Relatório médico isolado não basta. O juiz controla a legalidade e os motivos do ato administrativo, mas não substitui a vontade do administrador.", "Competência e custeio (Tema 1.234 do STF; SV 60): ações sobre medicamentos não incorporados ao SUS, com registro na Anvisa, tramitam na <b>Justiça Federal</b> se o tratamento anual, pelo PMVG da CMED, for igual ou superior a <b>210 salários mínimos</b>; abaixo disso, na <b>Justiça Estadual</b>. O medicamento <b>sem registro</b> na Anvisa fica na Justiça Federal, contra a União (Tema 500). Nas ações federais, a União custeia. Nas estaduais de valor entre 7 e 210 salários mínimos, a União ressarce <b>65%</b> dos valores pagos por Estados e Municípios, e nos oncológicos ajuizados até 10/6/2024, <b>80%</b>."], "pega": ["Objetivos da seguridade: <b>uniformidade e equivalência</b> entre populações urbanas e rurais, seletividade e distributividade, gestão <b>quadripartite</b>. A banca troca por “diferenciação” entre urbanos e rurais ou por gestão bipartite.", "Fonte de custeio: nenhum benefício ou serviço da seguridade pode ser criado, majorado ou estendido <b>sem a correspondente fonte de custeio total</b> (art. 195, § 5º). A banca excetua a assistência social.", "Contribuição: saúde e assistência social <b>independem de contribuição</b>; só a previdência é contributiva. A banca exige contribuição para o acesso ao SUS ou ao BPC.", "Anterioridade: as contribuições sociais seguem a <b>noventena</b> (90 dias), sem anterioridade anual (art. 195, § 6º). A banca diz que se aplica a anterioridade do exercício.", "Imunidade (art. 195, § 7º): os requisitos dependem de <b>lei complementar</b> (RE 566.622, Tema 32); a lei ordinária trata só dos aspectos procedimentais. A banca admite lei ordinária para criar requisitos.", "Percentuais mínimos: <b>15%</b> da receita corrente líquida (União), <b>12%</b> (Estados) e <b>15%</b> (Municípios e DF). A banca inverte os números entre Estados e Municípios.", "Setor privado: participação <b>complementar</b>, por contrato de direito público ou convênio, com preferência às filantrópicas. É vedado auxílio ou subvenção a entidades <b>com fins lucrativos</b>. O capital estrangeiro é vedado <b>salvo previsão em lei</b>. A banca diz “vedação absoluta” ou “preferência às empresas com fins lucrativos”.", "ACS e ACE (EC 140/2026): contratação temporária ou terceirizada é <b>vedada</b>, salvo emergência em saúde pública; regime de cargo efetivo; vencimento de ao menos <b>2 salários mínimos</b>, de responsabilidade da União. A banca autoriza a terceirização por organização social ou o contrato temporário como regra.", "Tema 793: a solidariedade <b>não impede</b> que o juiz direcione o cumprimento a quem a repartição de competências atribui e determine o ressarcimento. A banca diz que o Município nunca responde ou que há litisconsórcio necessário entre os três entes.", "Tema 6: os requisitos são <b>cumulativos</b>, o ônus da prova é do autor e o relatório médico isolado não basta. A banca os apresenta como alternativos ou diz que a prescrição médica é suficiente.", "Tema 1.234: o corte é de <b>210 salários mínimos</b> no tratamento anual (PMVG da CMED), e não de 60 salários (Juizado Especial Federal). Abaixo disso, Justiça Estadual. Sem registro na Anvisa, Justiça Federal. A banca troca o número ou a justiça competente.", "Sem registro na Anvisa: a regra é a <b>vedação</b> (Lei 8.080, art. 19-T; Tema 500), com exceção só em caso de mora irrazoável da Anvisa e demais requisitos, em ação contra a União. A banca diz que o juiz sempre pode determinar. Conitec: <b>180 dias</b>, prorrogáveis por <b>90 dias corridos</b>; a banca inverte.", "BPC: <b>1/4</b> do salário mínimo per capita, idoso de <b>65 anos</b>, benefício <b>federal</b>, não acumulável com outro da seguridade. O critério de 1/4 não é absoluto (RE 567.985). Ao Município cabem os <b>benefícios eventuais</b> (natalidade e funeral). A banca diz que o Município paga o BPC ou que o idoso tem 60 anos."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Ações tributárias: anulatória, declaratória, repetição de indébito, mandado de segurança, consignação e cautelar fiscal", "key": "TRI", "nome": "Tributário", "conc": ["Edital: item 11 de Direito Tributário (processo judicial tributário), <b>ação anulatória</b>, <b>ação declaratória</b> (inclusive da inexistência de relação jurídico-tributária), <b>repetição de indébito</b>, <b>consignação em pagamento</b>, <b>mandado de segurança em matéria tributária</b> e <b>cautelar fiscal</b>. A execução fiscal, os embargos e a exceção de pré-executividade ficaram no PDF 16. Não há norma de Curitiba nesta unidade. Os artigos foram conferidos no Planalto, com o CTN já alterado pela <b>LC 236/2026</b>.", "Visão geral (LEF, art. 38): a discussão judicial da dívida ativa só é admissível em execução, <b>salvo</b> mandado de segurança, ação de repetição de indébito e <b>ação anulatória</b> do ato declarativo da dívida. O texto da lei prevê que a anulatória seja precedida de depósito preparatório do valor do débito, mas a <b>Súmula Vinculante 28</b> declara inconstitucional a exigência de depósito prévio como requisito de admissibilidade de ação em que se discute a exigibilidade do crédito tributário. O depósito é <b>faculdade do contribuinte</b>, para suspender a exigibilidade. A propositura da ação importa <b>renúncia ao poder de recorrer na esfera administrativa</b> e desistência do recurso interposto (parágrafo único).", "Suspensão da exigibilidade (CTN, art. 151, com a LC 236/2026): suspendem a exigibilidade a moratória; o <b>depósito do montante integral</b>; as impugnações, os recursos e a manifestação de inconformidade administrativos; a <b>liminar em mandado de segurança</b>; a <b>liminar ou tutela provisória</b> em outras ações; o parcelamento; e, como novidades da LC 236/2026, a arbitragem especial tributária e aduaneira, a proposta de transação aceita, o acordo decorrente de mediação e a aceitação, pelo credor, de <b>seguro-garantia ou fiança bancária</b> oferecidos em execução fiscal (incisos VII a X). A suspensão <b>não dispensa as obrigações acessórias</b> (§ 1º). É vedada a exigência de caução ou depósito para apresentar impugnações e recursos administrativos (§ 2º). Pela Súmula 112 do STJ, o depósito só suspende se for <b>integral e em dinheiro</b>. Com a exigibilidade suspensa, ou com penhora efetivada em execução, cabe certidão positiva com efeitos de negativa (CTN, art. 206).", "Ação anulatória de débito fiscal: busca desconstituir o lançamento ou a inscrição em dívida ativa (CDA) por vício de forma ou de mérito, como decadência, prescrição, pagamento, nulidade do lançamento ou ilegitimidade do sujeito passivo. Pode ser proposta <b>antes ou depois</b> da execução. Por si só, <b>não suspende nem impede a execução</b> (CPC, art. 784, § 1º); é preciso depósito integral ou tutela provisória (CTN, art. 151). Se há execução, as ações são <b>conexas</b> (CPC, art. 55, § 2º, I) e se reúnem no juízo prevento, salvo se uma delas já foi julgada (Súmula 235 do STJ). A pretensão contra a Fazenda se sujeita ao prazo de <b>5 anos</b> do Decreto 20.910/1932.", "Ação declaratória (CPC, arts. 19 e 20): declara a existência, a inexistência ou o modo de ser de relação jurídica, mesmo que já tenha ocorrido a violação do direito. Em matéria tributária, serve para afirmar a <b>inexistência de relação jurídico-tributária</b> (imunidade, isenção, não incidência, competência de outro ente), inclusive de forma preventiva, antes do lançamento. A sentença declaratória transitada em julgado que reconhece o indébito permite ao contribuinte optar entre <b>precatório ou compensação</b> (Súmula 461 do STJ). Nas relações de <b>trato sucessivo</b>, a coisa julgada não alcança exercícios em que mudem o direito ou os fatos (Súmula 239 do STF). Segundo o STF (<b>Tema 881</b>), as decisões em controle concentrado ou em repercussão geral <b>interrompem automaticamente</b> os efeitos da coisa julgada nas relações tributárias de trato sucessivo, respeitadas a irretroatividade e as anterioridades anual e nonagesimal, sem necessidade de ação rescisória.", "Repetição de indébito (CTN, arts. 165 a 169): o sujeito passivo tem direito à restituição, <b>independentemente de protesto prévio</b>, nos casos de (I) cobrança ou pagamento espontâneo de tributo indevido ou maior que o devido; (II) erro na identificação do sujeito passivo, na alíquota, no cálculo ou em documento; (III) reforma, anulação, revogação ou rescisão de decisão condenatória. O prazo é de <b>5 anos</b> da extinção do crédito (art. 168, I) ou, no inciso III, da decisão administrativa definitiva ou do trânsito em julgado. Para as ações ajuizadas a partir de <b>9/6/2005</b>, vale o prazo de 5 anos contados do pagamento antecipado (LC 118/2005; STF, RE 566.621, Tema 4). A ação anulatória da decisão que nega a re
