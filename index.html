nários são abertos <b>por decreto</b> do Executivo, com imediato conhecimento do Legislativo (art. 44). Dependem de <b>recursos disponíveis</b> e exposição justificativa (art. 43): <b>superávit financeiro</b> do exercício anterior (ativo financeiro menos passivo financeiro), <b>excesso de arrecadação</b> (saldo positivo das diferenças acumuladas mês a mês entre previsão e arrecadação, considerada a tendência do exercício, deduzidos os extraordinários), <b>anulação</b> de dotações e <b>operações de crédito</b> autorizadas. <b>Vigência</b>: adstrita ao exercício, salvo disposição legal para os especiais e extraordinários (art. 45); na CF, os créditos especiais e extraordinários valem no exercício em que autorizados, mas, se promulgados nos <b>últimos quatro meses</b>, reabrem-se nos limites dos saldos (art. 167, § 2º). O crédito extraordinário só é admitido para despesas <b>imprevisíveis e urgentes</b> (art. 167, § 3º).", "<b>Execução orçamentária e programação financeira (arts. 47 a 70).</b> Após a promulgação da LOA, o Executivo aprova um quadro de <b>cotas trimestrais</b> da despesa por unidade (art. 47), que podem ser alteradas (art. 50). <b>Empenho</b> é o ato que cria para o Estado obrigação de pagamento, pendente ou não de implemento de condição (art. 58); <b>não pode exceder o limite dos créditos</b> (art. 59) e é <b>vedada despesa sem prévio empenho</b> (art. 60); admite-se empenho <b>estimativo</b> e <b>global</b>. A <b>liquidação</b> verifica o direito adquirido do credor com base em títulos e documentos (art. 63); o pagamento só ocorre após a regular liquidação (art. 62); a <b>ordem de pagamento</b> é o despacho da autoridade (art. 64). <b>Município</b>: no <b>último mês do mandato do Prefeito</b> é vedado empenhar mais do que <b>um duodécimo</b> da despesa prevista e assumir compromissos para execução depois do término do mandato, e os empenhos em desacordo são <b>nulos</b> (art. 59, §§ 1º a 4º, incluídos pela Lei 6.397/1976), salvo calamidade. <b>Precatórios</b>: pagos na ordem de apresentação, vedada a designação de casos ou pessoas (art. 67). <b>Adiantamento</b> (arts. 68 e 69): numerário a servidor, precedido de empenho; não se faz a servidor em alcance nem a responsável por dois adiantamentos.", "<b>Restos a pagar e despesas de exercícios anteriores.</b> <b>Restos a pagar</b> são as despesas empenhadas e não pagas até 31 de dezembro, distinguindo-se <b>processadas</b> de <b>não processadas</b> (art. 36); os empenhos de créditos plurianuais não liquidados só entram como restos a pagar no último ano de vigência. As <b>despesas de exercícios encerrados</b> (art. 37), com crédito próprio e saldo suficiente, restos com prescrição interrompida e compromissos reconhecidos após o encerramento, podem ser pagos à conta de <b>dotação específica</b> do orçamento, discriminada por elementos, obedecida, sempre que possível, a <b>ordem cronológica</b>. A anulação de despesa reverte à dotação, e, se ocorrer depois do encerramento, é receita do ano em que se efetivar (art. 38).", "<b>Receita: lançamento, arrecadação e dívida ativa.</b> Nenhum tributo é exigido ou aumentado sem lei, e nenhum é cobrado sem prévia autorização orçamentária, ressalvados a tarifa aduaneira e o imposto de guerra (art. 51, texto original, sujeito ao regime constitucional vigente). Lançamento é ato da repartição competente (art. 53). A lei <b>não admite compensação</b> da obrigação de recolher rendas com direito creditório contra a Fazenda (art. 54). Vigora a <b>unidade de tesouraria</b> (art. 56). <b>Dívida ativa</b> (art. 39, redação do DL 1.735/1979): os créditos da Fazenda, tributários ou não, são inscritos após apurada a <b>liquidez e certeza</b>; <b>dívida ativa tributária</b> é a de tributos, adicionais e multas tributárias, e a <b>não tributária</b> abrange os demais créditos (multas não tributárias, foros, laudêmios, aluguéis, taxas de ocupação, custas, indenizações, reposições, entre outros); a receita da dívida ativa abrange atualização, multa, juros e encargo legal. <b>Alienação de bens e cessão de créditos</b>: o <b>art. 39-A</b> (LC 208/2024) permite ao ente ceder onerosamente direitos originados de créditos tributários e não tributários, inclusive inscritos em dívida ativa, a pessoas jurídicas de direito privado ou fundos regulamentados pela CVM, mediante <b>lei específica</b>, operação <b>definitiva</b>, preservada a natureza do crédito, a prerrogativa de cobrança pela Fazenda e a atualização original; deve ocorrer até <b>90 dias antes do fim do mandato</b> do chefe do Executivo (salvo pagamento posterior), e a receita de capital observa o art. 44 da LRF e se destina <b>no mínimo 50% à previdência</b> e o restante a investimentos.", "<b>Fundos especiais (arts. 71 a 74).</b> Fundo especial é o produto de <b>receitas especificadas</b> que, <b>por lei</b>, se vinculam à realização de determinados objetivos ou serviços, com normas peculiares de aplicação. A aplicação das receitas se faz por <b>dotação na LOA ou créditos adicionais</b>; o saldo positivo apurado em balanço <b>transfere-se</b> ao exercício seguinte, a crédito do mesmo fundo, salvo determinação em contrário (art. 73). A lei do fundo pode prever normas próprias de controle e prestação de contas, <b>sem elidir a competência do Tribunal de Contas</b> (art. 74). Na CF, é vedada a instituição de fundos <b>sem prévia autorização legislativa</b> (art. 167, IX) e a criação de fundo público quando seus objetivos puderem ser alcançados por vinculação de receitas específicas ou execução orçamentária direta (art. 167, XIV, EC 109/2021). É vedada a transferência a fundos de recursos de <b>repasses duodecimais</b> (art. 168, § 1º). Os orçamentos de <b>autarquias e entidades paraestatais</b> são aprovados por decreto do Executivo, salvo lei em contrário, e se vinculam ao orçamento do ente (arts. 107 a 110).", "<b>Controle, contabilidade e gestão patrimonial.</b> O controle da execução (art. 75) compreende a <b>legalidade</b> dos atos de arrecadação e despesa, a <b>fidelidade funcional</b> dos agentes e o cumprimento do <b>programa de trabalho</b>. O controle interno é do Executivo e o externo, do Legislativo com o Tribunal de Contas; as contas anuais do Executivo são submetidas ao Legislativo com <b>parecer prévio</b> do Tribunal de Contas (art. 82, § 1º). <b>Balanços</b> (art. 101): orçamentário, financeiro, patrimonial e demonstração das variações patrimoniais. O <b>ativo financeiro</b> compreende créditos e valores realizáveis independentemente de autorização orçamentária; o <b>permanente</b>, bens e créditos cuja mobilização depende de autorização legislativa (art. 105). <b>Dívida flutuante</b>: restos a pagar (excluídos os serviços da dívida), serviços da dívida a pagar, depósitos e débitos de tesouraria (art. 92). <b>Dívida fundada</b>: compromissos de <b>exigibilidade superior a doze meses</b>, para atender a desequilíbrio orçamentário ou financeiro de obras e serviços (art. 98). Crédito público e disciplina da dívida (LRF, Senado) estão <b>de memória</b>.", "<b>Despesa com pessoal e repasses (CF, arts. 168 e 169).</b> Os recursos das dotações dos Poderes Legislativo e Judiciário, do MP e da Defensoria são entregues <b>até o dia 20 de cada mês, em duodécimos</b> (art. 168), e o saldo financeiro é restituído ao caixa único ou deduzido das parcelas seguintes (§ 2º). A despesa com pessoal ativo, inativo e pensionistas não pode exceder os limites da lei complementar (art. 169). A concessão de vantagem, a criação de cargos e a admissão de pessoal só podem ser feitas se houver <b>prévia dotação orçamentária suficiente</b> e <b>autorização específica na LDO</b>, ressalvadas as <b>empresas públicas e sociedades de economia mista</b> (§ 1º). <b>Ajuste fiscal</b> (art. 167-A, EC 109): apurado, no período de 12 meses, que a relação entre despesas e receitas correntes supera <b>95%</b>, Estados, DF e Municípios <b>podem</b> aplicar as vedações do rol (reajustes, criação de cargos, concursos, criação de despesa obrigatória, benefícios tributários, entre outras); com mais de <b>85%</b> as medidas podem ser adotadas por ato do Chefe do Executivo, submetido ao Legislativo em urgência, que perde eficácia se rejeitado, se passarem <b>180 dias</b> sem apreciação ou se a situação cessar; a apuração é <b>bimestral</b>."], "pega": ["Princípios: a Lei 4.320 cita <b>unidade, universalidade e anualidade</b>. A banca insere especificação ou exclusividade como se constassem desse artigo, ou troca universalidade por <b>orçamento líquido</b> (o correto é o <b>bruto</b>, sem deduções).", "Exclusividade: a LOA <b>pode</b> autorizar créditos suplementares e operações de crédito, <b>inclusive ARO</b>. A banca proíbe qualquer autorização de crédito suplementar na LOA.", "Iniciativa: PPA, LDO e LOA são de iniciativa <b>do Poder Executivo</b>. A banca atribui a iniciativa ao Legislativo ou ao Tribunal de Contas.", "Conteúdo: <b>PPA</b> = diretrizes, objetivos e metas para despesas de <b>capital</b> e programas de <b>duração continuada</b>; <b>LDO</b> = metas, prioridades, política fiscal, <b>alterações na legislação tributária</b> e política das agências de fomento. A banca troca as funções entre PPA e LDO.", "Créditos adicionais: <b>suplementar</b> = reforço; <b>especial</b> = sem dotação específica; <b>extraordinário</b> = urgente e imprevisível (<b>guerra, comoção interna, calamidade</b>). Suplementares e especiais: <b>lei autoriza, decreto abre</b>. A banca diz que o decreto basta para o especial sem lei, ou que o extraordinário exige lei prévia.", "Recursos para créditos: <b>superávit financeiro, excesso de arrecadação, anulação de dotações e operações de crédito</b>. A banca inclui o superávit <b>econômico</b> ou o <b>patrimonial</b>, ou chama de excesso de arrecadação a diferença entre previsão e arrecadação de um só mês.", "Vigência dos créditos: <b>especiais e extraordinários</b> abertos nos <b>últimos quatro meses</b> reabrem-se no exercício seguinte, nos limites dos saldos. A banca diz que todo crédito adicional reabre ou usa o prazo de seis meses.", "Exercício financeiro: coincide com o <b>ano civil</b>; pertencem a ele as receitas <b>arrecadadas</b> e as despesas <b>empenhadas</b> (regime misto). A banca diz que a despesa é a <b>paga</b> ou que a receita é a <b>lançada</b>.", "Estágios da despesa: <b>empenho, liquidação e pagamento</b>. O empenho <b>não pode exceder o crédito</b>; sem empenho prévio é <b>vedada</b> a despesa. A banca admite despesa sem empenho em regra ou empenho acima do crédito.", "Restos a pagar: empenhadas e <b>não pagas até 31/12</b>, <b>processadas</b> ou <b>não processadas</b>. Despesas de exercícios anteriores pagam-se por <b>dotação específica</b>. A banca diz que são as não empenhadas.", "Fim de mandato municipal: <b>duodécimo</b> no último mês; vedado assumir compromisso para execução após o mandato; empenhos irregulares <b>nulos</b>. A banca diz 'últimos seis meses' ou que a regra vale para a União.", "Dívida: <b>flutuante</b> (restos a pagar, serviços da dívida, depósitos, débitos de tesouraria) e <b>fundada</b> (exigibilidade superior a <b>12 meses</b>). A banca troca o prazo ou os tipos.", "Art. 39-A (LC 208/2024): cessão de créditos exige <b>lei específica</b>, é <b>operação definitiva</b>, a Fazenda mantém a <b>cobrança</b>, e a receita de capital destina <b>no mínimo 50% à previdência</b>. A banca diz que a cessão é com regresso ou que o cessionário passa a cobrar sozinho.", "Duodécimo: <b>até o dia 20 de cada mês</b>, a Poderes e órgãos autônomos (art. 168). Pessoal: LDO autoriza e há dotação prévia, <b>exceto</b> estatais (art. 169, § 1º). Gatilho do art. 167-A: <b>95%</b> (faculdade para Estados e Municípios) e <b>85%</b> (medidas por ato do Executivo). A banca troca os percentuais, transforma a faculdade em obrigação ou aplica o gatilho à União."]}, {"materia": "PROCESSO CIVIL", "titulo": "Ação monitória (inclusive contra a Fazenda), reivindicatória da Fazenda e ação civil pública", "key": "PCV", "nome": "Proc. Civil", "conc": ["Edital: item 12 (ações especiais e coletivas envolvendo a Fazenda Pública). Li <b>literalmente no Planalto</b>: <b>arts. 700 a 702 do CPC</b> (monitória), mais os arts. <b>319, 496 e 916</b> do CPC (que a monitória invoca), a <b>Lei 7.347/1985</b> (página do Planalto que mostra todas as redações; o texto vigente foi lido a partir das redações sucessivas) e os <b>arts. 1.228 a 1.232 do Código Civil</b> (propriedade e direito de reivindicar). <b>Não existe</b> procedimento especial da reivindicatória no CPC: segue o procedimento comum; o que digo sobre requisitos, bens públicos, súmulas e jurisprudência (STJ e STF) vem <b>de memória</b> e está sinalizado. Não li o CDC (Título III), que a LACP manda aplicar (art. 21).", "<b>Ação monitória: cabimento (art. 700).</b> Quem afirma ter direito, com base em <b>prova escrita sem eficácia de título executivo</b>, de exigir de devedor capaz: (I) <b>pagamento de quantia em dinheiro</b>; (II) <b>entrega de coisa fungível ou infungível, ou de bem móvel ou imóvel</b>; (III) <b>obrigação de fazer ou de não fazer</b>. A prova escrita pode ser <b>prova oral documentada</b>, produzida antecipadamente nos termos do art. 381 (§ 1º). Na petição inicial incumbe ao autor explicitar a <b>importância devida com memória de cálculo</b>, o valor atual da coisa ou o conteúdo patrimonial em discussão (§ 2º); o <b>valor da causa</b> corresponde a essa importância (§ 3º); a inicial é <b>indeferida</b>, além das hipóteses do art. 330, se não atendido o § 2º (§ 4º). Havendo dúvida sobre a idoneidade da prova, o juiz intima o autor para <b>emendar</b> a inicial e adaptá-la ao <b>procedimento comum</b> (§ 5º). A citação pode ser por qualquer meio do procedimento comum (§ 7º).", "<b>Monitória contra a Fazenda Pública.</b> É <b>admissível</b> a ação monitória em face da Fazenda Pública (art. 700, § 6º), o que positiva o entendimento da <b>Súmula 339 do STJ</b> (<b>de memória</b>). Quando a ré é a Fazenda e <b>não apresenta embargos</b>, aplica-se o <b>art. 496</b> (<b>remessa necessária</b>) e depois o cumprimento de sentença do Título II do Livro I (art. 701, § 4º). O art. 496, I, sujeita ao duplo grau a sentença proferida contra a União, Estados, DF, Municípios e suas autarquias e fundações de direito público; o § 3º afasta a remessa quando o proveito econômico for certo e líquido inferior a <b>1.000 salários-mínimos</b> (União), <b>500</b> (Estados, DF e capitais) e <b>100</b> (demais Municípios); o § 4º afasta quando a sentença se funda em súmula de tribunal superior, acórdão de repetitivo ou IRDR/IAC, ou orientação vinculante administrativa. <b>Prazo em dobro</b> da Fazenda para manifestar-se (art. 183, <b>de memória</b>) e <b>precatório ou RPV</b> no cumprimento (art. 100 da CF, <b>de memória</b>).", "<b>Procedimento da monitória.</b> Sendo evidente o direito, o juiz defere a expedição de <b>mandado de pagamento, de entrega de coisa ou de cumprimento de obrigação de fazer ou não fazer</b>, com prazo de <b>15 dias</b> e <b>honorários advocatícios de 5%</b> sobre o valor da causa (art. 701). O réu que cumprir o mandado no prazo é <b>isento de custas</b> (§ 1º). Se não pagar nem embargar, constitui-se de pleno direito o <b>título executivo judicial</b>, <b>independentemente de formalidade</b> (§ 2º), e cabe <b>ação rescisória</b> dessa decisão (§ 3º). Aplica-se o <b>parcelamento do art. 916</b> (30% de entrada e até 6 parcelas), no que couber (§ 5º), e a opção importa renúncia aos embargos.", "<b>Embargos à monitória (art. 702).</b> Independem de <b>prévia segurança do juízo</b>, opõem-se <b>nos próprios autos</b> no prazo de <b>15 dias</b> e podem fundar-se em <b>qualquer matéria</b> de defesa do procedimento comum (§ 1º). Se o réu alega <b>excesso</b>, deve declarar de imediato o valor que entende devido, com <b>demonstrativo discriminado e atualizado</b>; sem isso, os embargos são <b>liminarmente rejeitados</b> se esse for o único fundamento, e, havendo outro, o juiz não examina o excesso (§§ 2º e 3º). A oposição <b>suspende a eficácia</b> da decisão do art. 701 até o julgamento em primeiro grau (§ 4º). O autor responde em <b>15 dias</b> (§ 5º). É admitida <b>reconvenção</b>, vedada a reconvenção à reconvenção (§ 6º). Embargos parciais podem ser autuados em apartado, constituindo-se o título quanto à parcela incontroversa (§ 7º). Rejeitados os embargos, o título se constitui e prossegue o cumprimento (§ 8º). Cabe <b>apelação</b> da sentença que acolhe ou rejeita os embargos (§ 9º). <b>Multa de até 10%</b> sobre o valor da causa para o autor que propõe a ação <b>indevidamente e de má-fé</b> (§ 10) e para o réu que opõe embargos de má-fé (§ 11). Súmulas do STJ sobre monitória (cheque prescrito, contrato de abertura de crédito, prazo prescricional) são <b>de memória</b>.", "<b>Ação reivindicatória ajuizada pela Fazenda Pública.</b> Fundamento: o proprietário tem o <b>direito de reaver a coisa de quem injustamente a possua ou detenha</b> (CC, art. 1.228, caput). É ação <b>real</b>, petitória, do proprietário <b>não possuidor</b> contra o possuidor ou detentor injusto. Segue o <b>procedimento comum</b>, com a petição inicial do art. 319 do CPC. Requisitos (doutrina, <b>de memória</b>): <b>título de domínio</b> do autor, <b>individualização</b> da coisa e <b>posse injusta</b> do réu. A Fazenda prova o domínio com a <b>matrícula</b> ou ato equivalente. Por ser pública, a Fazenda pode ainda usar a <b>autotutela</b> sobre bens de uso comum e de uso especial em caso de invasão recente, o <b>desforço imediato</b> (CC, art. 1.210, § 1º, <b>de memória</b>) ou o <b>interdito possessório</b>, em vez da reivindicatória; e a <b>imprescritibilidade</b> dos bens públicos (CF, arts. 183, § 3º, e 191, p. único; CC, art. 102, <b>de memória</b>) significa que a reivindicatória pública <b>não prescreve</b>.", "<b>Reivindicatória pública: temas correlatos.</b> O art. 1.228, § 4º, permite privar o proprietário se o imóvel reivindicado for extensa área, na posse ininterrupta e de boa-fé por mais de <b>5 anos</b> de considerável número de pessoas, que realizaram obras de interesse social e econômico relevante, mediante <b>justa indenização</b>, e a sentença serve de título para registro (§ 5º); a jurisprudência <b>não aplica</b> essa regra a bens públicos (<b>de memória</b>). A <b>Súmula 619 do STJ</b> trata a ocupação de bem público como <b>detenção</b> e afasta indenização por acessões e benfeitorias (<b>de memória</b>). A <b>Súmula 340 do STF</b> veda usucapião de bens públicos (<b>de memória</b>). Os frutos pertencem ao proprietário (CC, art. 1.232).", "<b>Ação civil pública (Lei 7.347/1985): objeto.</b> Regem-se pela lei, sem prejuízo da ação popular, as ações de responsabilidade por <b>danos morais e patrimoniais</b> causados ao <b>meio ambiente</b>, ao <b>consumidor</b>, a bens e direitos de valor <b>artístico, estético, histórico, turístico e paisagístico</b>, a qualquer outro <b>interesse difuso ou coletivo</b>, por <b>infração da ordem econômica</b>, à <b>ordem urbanística</b>, à <b>honra e dignidade de grupos raciais, étnicos ou religiosos</b> e ao <b>patrimônio público e social</b> (art. 1º, I a VIII). O parágrafo único <b>veda</b> a ACP para pretensões que envolvam <b>tributos, contribuições previdenciárias, FGTS</b> ou outros fundos institucionais cujos beneficiários possam ser individualmente determinados (incluído por medida provisória). O objeto pode ser a <b>condenação em dinheiro</b> ou o cumprimento de <b>obrigação de fazer ou não fazer</b> (art. 3º), e cabe <b>ação cautelar</b> para evitar o dano (art. 4º).", "<b>Competência e legitimidade.</b> A ação é proposta no <b>foro do local do dano</b>, cujo juízo tem <b>competência funcional</b> (art. 2º), e a propositura <b>previne</b> a jurisdição para ações posteriores de mesma causa de pedir ou objeto (parágrafo único). <b>Legitimados</b> (art. 5º): <b>Ministério Público</b>, <b>Defensoria Pública</b>, <b>União, Estados, DF e Municípios</b>, <b>autarquia, empresa pública, fundação e sociedade de economia mista</b>, e <b>associação</b> constituída há pelo menos <b>1 ano</b> nos termos da lei civil e que inclua entre suas finalidades a proteção dos bens e interesses protegidos (o requisito da pré-constituição pode ser <b>dispensado</b> pelo juiz por manifesto interesse social, § 4º). O MP, se não for parte, atua como <b>fiscal da lei</b> (§ 1º). Há litisconsórcio facultativo entre MPs (§ 5º). Em caso de <b>desistência infundada ou abandono</b> pela associação, o MP ou outro legitimado assume a titularidade (§ 3º). Os órgãos públicos legitimados podem tomar <b>compromisso de ajustamento de conduta</b>, com eficácia de <b>título executivo extrajudicial</b> (§ 6º).", "<b>Inquérito civil e provas.</b> O interessado pode requerer certidões e informações em <b>15 dias</b> (art. 8º); o MP pode instaurar <b>inquérito civil</b> e requisitar informações com prazo <b>não inferior a 10 dias úteis</b> (§ 1º). Só o <b>sigilo legal</b> justifica negar certidão. O <b>arquivamento</b> do inquérito é fundamentado, remetido em <b>3 dias</b> ao Conselho Superior do MP (art. 9º), que pode homologar ou designar outro órgão para ajuizar. Constitui <b>crime</b> a recusa, o retardamento ou a omissão de dados técnicos requisitados pelo MP: <b>reclusão de 1 a 3 anos</b>, mais multa (art. 10).", "<b>Tutela, liminar e recursos.</b> Em obrigação de fazer ou não fazer o juiz determina a prestação ou a cessação da atividade nociva, sob pena de execução específica ou <b>multa diária</b>, <b>independentemente de requerimento</b> do autor (art. 11). <b>Liminar</b> com ou sem justificação prévia, em decisão sujeita a <b>agravo</b> (art. 12). A requerimento da pessoa jurídica de direito público, para evitar <b>grave lesão à ordem, à saúde, à segurança e à economia públicas</b>, o <b>presidente do tribunal</b> pode suspender a execução da liminar, cabendo agravo em <b>5 dias</b> (§ 1º). A multa liminar só é <b>exigível após o trânsito em julgado</b> da decisão favorável, mas é <b>devida desde o descumprimento</b> (§ 2º). O juiz pode dar <b>efeito suspensivo</b> aos recursos, para evitar dano irreparável (art. 14).", "<b>Condenação, execução e coisa julgada.</b> A indenização em dinheiro <b>reverte a um fundo</b> gerido por conselho com participação obrigatória do MP e da comunidade, para <b>reconstituição dos bens lesados</b> (art. 13). Decorridos <b>60 dias do trânsito em julgado</b> sem que a associação execute, o <b>MP deve executar</b>, facultada igual iniciativa aos demais legitimados (art. 15). A sentença faz coisa julgada <b>erga omnes</b>, nos limites da competência territorial do órgão prolator (redação da Lei 9.494/1997), <b>exceto</b> se o pedido for improcedente por <b>insuficiência de provas</b>, hipótese em que qualquer legitimado pode propor outra ação com nova prova (art. 16). A limitação territorial foi <b>declarada inconstitucional pelo STF</b> em 2021 (RE 1.101.937, Tema 1.075, <b>de memória</b>): confira antes da prova. <b>Custas</b>: sem adiantamento de custas, emolumentos, honorários periciais e outras despesas; a associação autora só paga honorários e custas se houver <b>comprovada má-fé</b> (art. 18); a má-fé gera condenação solidária da associação e dos diretores em honorários e <b>décuplo das custas</b> (art. 17). Aplica-se o <b>CPC</b> no que não contrarie a lei (art. 19) e o <b>Título III do CDC</b> (art. 21)."], "pega": ["Monitória: exige <b>prova escrita sem eficácia de título executivo</b>, que pode ser <b>prova oral documentada</b> (art. 381). A banca exige título executivo, ou diz que testemunhas sem documentação bastam.", "Objeto: quantia em dinheiro, entrega de coisa e <b>obrigação de fazer ou não fazer</b> (art. 700, I a III). A banca restringe a monitória a dívida em dinheiro.", "Inicial: <b>memória de cálculo</b> e valor da causa igual ao proveito; se faltar, é <b>indeferida</b>. Dúvida sobre a prova: o juiz <b>manda emendar</b> para o procedimento comum, não extingue de plano.", "<b>Monitória contra a Fazenda</b> é admissível (§ 6º). Sem embargos da Fazenda, aplica-se a <b>remessa necessária (art. 496)</b> antes do cumprimento. A banca diz que não cabe monitória contra a Fazenda ou que a falta de embargos já forma título definitivo sem reexame.", "Mandado: prazo de <b>15 dias</b> e honorários de <b>5%</b>; cumprindo, o réu fica <b>isento de custas</b>. A banca diz 10 dias, 10% ou 20% de honorários.", "Embargos: <b>independem de segurança do juízo</b>, <b>15 dias</b>, nos próprios autos, qualquer matéria do procedimento comum, e <b>suspendem a eficácia</b> do mandado até a sentença. A banca exige garantia do juízo ou diz que não suspendem.", "Excesso de cobrança: o embargante deve <b>declarar o valor devido com demonstrativo</b>; sem isso, os embargos fundados só em excesso são <b>rejeitados liminarmente</b>. A banca diz que o juiz apura o excesso de ofício.", "Reconvenção na monitória: <b>admitida</b>, mas <b>não a reconvenção da reconvenção</b>. Recurso: <b>apelação</b>. A banca diz que não cabe reconvenção ou que o recurso é agravo.", "Multas: <b>até 10%</b> do valor da causa, para o autor que propõe indevidamente de má-fé e para o réu que embarga de má-fé. A banca diz que só o réu é multado.", "Reivindicatória: ação <b>real</b> do proprietário <b>não possuidor</b> contra quem <b>injustamente</b> possua ou detenha; <b>não tem rito especial</b> no CPC. A banca diz que segue rito sumário ou que é possessória.", "Bens públicos: <b>imprescritíveis</b> e <b>não usucapíveis</b>; a ocupação é, em regra, <b>detenção</b> sem direito a indenização por acessões (Súmula 619 STJ). A banca diz que a posse prolongada gera usucapião contra o Município.", "ACP: <b>legitimados</b> incluem <b>Defensoria</b>, <b>entes federativos</b>, entidades da administração indireta e associações com <b>1 ano</b> (dispensável). A banca restringe ao MP ou exige 2 anos da associação.", "ACP: foro do <b>local do dano</b>, competência <b>funcional</b>, e a propositura <b>previne</b> o juízo. A banca diz que é relativa ou que o foro é o do domicílio do réu.", "ACP e tributos: <b>não cabe</b> ACP para pretensões que envolvam <b>tributos, contribuições previdenciárias, FGTS</b> ou fundos com beneficiários determináveis (art. 1º, p. único). A banca diz que cabe ACP para anular cobrança de tributo.", "TAC: <b>órgãos públicos</b> legitimados tomam compromisso de ajustamento, com eficácia de <b>título executivo extrajudicial</b>. A banca diz que depende de homologação para ter eficácia ou que associações também o tomam.", "Liminar: <b>agravo</b>; a suspensão pelo <b>presidente do tribunal</b> exige grave lesão à ordem, saúde, segurança ou economia públicas, com agravo em <b>5 dias</b>; a <b>multa</b> é exigível só após o trânsito, mas devida <b>desde o descumprimento</b>. A banca troca prazo ou momento de exigibilidade.", "Execução: após <b>60 dias</b> do trânsito sem execução pela associação, o <b>MP deve executar</b>. Condenação em dinheiro: fundo para <b>reconstituição dos bens lesados</b>. A banca diz 30 ou 90 dias, ou que o valor vai ao autor.", "Coisa julgada: <b>erga omnes</b>, salvo <b>improcedência por insuficiência de provas</b>. A lei limitava à <b>competência territorial</b> do órgão prolator, regra declarada inconstitucional pelo STF em 2021 (confira). A banca diz que é sempre <b>inter partes</b> ou que improcedência por qualquer motivo permite nova ação.", "Custas: sem <b>adiantamento</b>; associação só paga honorários e custas em caso de <b>má-fé comprovada</b>, com décuplo das custas e honorários em solidariedade com os diretores. A banca impõe honorários ao vencido em regra."]}], "21": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Bens públicos e serviços públicos: regime, alienação, uso privativo, CDC e Lei 13.460/2017", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 10 de Direito Administrativo (bens e serviços públicos). Li <b>literalmente</b>, no navegador (site da Câmara dos Deputados): a <b>Lei 13.460/2017</b> inteira; do <b>Código Civil</b>, os <b>arts. 98 a 103</b>; da <b>Lei 14.133/2021</b>, os <b>arts. 76 e 77</b> (texto da publicação original); do <b>CDC</b>, os <b>arts. 2º, 3º, 6º, 14, 22, 27 e 42</b>. <b>Não reli</b> a Constituição, o Decreto-Lei 271/1967 (concessão de direito real de uso), a Lei 9.636/1998 e a Lei 8.987/1995: o que digo deles vem do estudo anterior. Súmulas e temas de tribunais citados abaixo vêm <b>da minha memória</b> e não foram conferidos nesta rodada.", "<b>Bens públicos (CC, arts. 98 a 103).</b> São públicos os bens do domínio nacional pertencentes às <b>pessoas jurídicas de direito público interno</b>; <b>todos os outros são particulares</b>, seja qual for o dono (art. 98). O critério é <b>subjetivo</b>: quem é o titular. Três classes (art. 99): <b>uso comum do povo</b> (rios, mares, estradas, ruas, praças); <b>uso especial</b> (edifícios ou terrenos destinados a serviço ou estabelecimento da administração, inclusive de autarquias); <b>dominicais</b> (patrimônio das pessoas jurídicas de direito público, como objeto de direito pessoal ou real). Parágrafo único: se a lei não dispuser em contrário, são <b>dominicais</b> os bens das pessoas de direito público que tenham <b>estrutura de direito privado</b>.", "<b>Regime jurídico.</b> Uso comum e uso especial são <b>inalienáveis enquanto conservarem a qualificação</b>, na forma da lei (art. 100). Dominicais <b>podem ser alienados</b>, observadas as exigências da lei (art. 101). <b>Não se sujeitam a usucapião</b> (art. 102). Atenção: a inalienabilidade é <b>condicionada</b>, não absoluta. Perdida a afetação (<b>desafetação</b>), o bem pode ser alienado. O uso comum pode ser <b>gratuito ou retribuído</b>, conforme a lei da entidade dona do bem (art. 103). Do estudo anterior: impenhorabilidade (execução por precatório), imprescritibilidade e não onerabilidade (sem penhor e hipoteca).", "<b>Afetação e desafetação.</b> <b>Afetação</b> é o ato ou fato que destina o bem a uma finalidade pública; <b>desafetação</b> é o inverso. Pode ser <b>expressa</b> (lei ou ato administrativo) ou <b>tácita</b> (fato, como a ocupação de um terreno por uma escola). Bem de uso comum ou especial só é desafetado, em regra, por <b>lei ou por ato do Executivo autorizado por lei</b>; a desafetação de bem dominical não existe, porque ele já não está afetado. Do estudo anterior: bens de empresas estatais prestadoras de serviço público, <b>enquanto vinculados ao serviço</b>, recebem proteção semelhante à dos bens públicos (impenhorabilidade) pela jurisprudência do STF (memória, sem número de tema conferido).", "<b>Alienação de bens públicos (Lei 14.133, arts. 76 e 77, lidos).</b> Exige <b>interesse público justificado</b> e <b>avaliação prévia</b>. <b>Imóveis</b> (inclusive de autarquias e fundações): <b>autorização legislativa</b> + licitação na modalidade <b>leilão</b>. Dispensam a licitação: dação em pagamento; doação <b>só para outro órgão ou entidade da Administração</b> (de qualquer esfera), ressalvadas as alíneas f, g e h; permuta por outros imóveis com a diferença limitada à metade do valor do imóvel ofertado; <b>investidura</b>; venda a outro órgão ou entidade; programas de habitação ou regularização fundiária de interesse social (alíneas f e g, comerciais locais até <b>250 m²</b>); terras rurais da União e do Incra (alínea h); legitimação de posse (Lei 6.383/1976) e legitimação fundiária e de posse da <b>Lei 13.465/2017</b>.", "<b>Móveis e regras especiais.</b> Bens <b>móveis</b>: dependem de <b>leilão</b>, dispensado para doação (só para fins e uso de interesse social, após avaliação de oportunidade e conveniência), permuta (só entre órgãos ou entidades da Administração), venda de ações (bolsa), de títulos, de bens produzidos ou comercializados pela própria entidade em razão de suas finalidades e de materiais e equipamentos sem utilização previsível. <b>§ 1º:</b> imóveis adquiridos por <b>procedimento judicial ou dação em pagamento</b> dispensam autorização legislativa (só avaliação + leilão). <b>§ 2º:</b> imóveis doados à Administração, cessadas as razões da doação, <b>revertem</b> ao doador, vedada a alienação pelo beneficiário. <b>§ 5º, investidura:</b> venda ao lindeiro de área remanescente de obra pública inaproveitável isoladamente, por preço <b>não inferior à avaliação nem superior a 50%</b> do valor máximo de dispensa de bens e serviços. <b>§ 6º:</b> doação com encargo é <b>licitada</b> e o instrumento traz encargos, prazo e <b>cláusula de reversão</b>, sob pena de nulidade. <b>Art. 77:</b> na venda de imóveis, <b>preferência</b> ao licitante que, aceitando as regras do edital, comprove a <b>ocupação</b>.", "<b>Uso de bens públicos por particulares (do estudo anterior).</b> <b>Autorização de uso</b>: ato <b>unilateral, discricionário e precário</b>, no interesse do particular, sem licitação em regra. <b>Permissão de uso</b>: ato unilateral, discricionário e precário, para uso no interesse coletivo; exige licitação quando houver mais de um interessado. <b>Concessão de uso</b>: <b>contrato administrativo</b>, com prazo determinado e licitação, que dá estabilidade ao uso. <b>Concessão de direito real de uso (CDRU, DL 271/1967)</b>: contrato que cria <b>direito real resolúvel</b>, transferível por ato entre vivos ou por sucessão, para fins de regularização fundiária, urbanização, industrialização, edificação, cultivo ou outra utilização de interesse social; pode ser gratuita ou onerosa. Cessão de uso é entre órgãos e entidades públicas. Súmula do STJ (memória): a ocupação irregular de bem público é <b>mera detenção</b>, sem direito a retenção ou indenização por acessões e benfeitorias.", "<b>Serviço público: conceito e princípios.</b> Conceito (estudo anterior): atividade de prestação de utilidade material à coletividade, de titularidade estatal, sob <b>regime de direito público</b>. Pela <b>Lei 13.460, art. 4º</b>, o serviço e o atendimento do usuário são prestados de forma adequada, observados <b>regularidade, continuidade, efetividade, segurança, atualidade, generalidade, transparência e cortesia</b> (oito princípios). A Lei 8.987 (não reli) fala em serviço adequado com <b>eficiência e modicidade das tarifas</b> e permite o <b>corte</b> por inadimplemento ou por razões técnicas, com <b>aviso prévio</b>. Prestação <b>direta</b> pelo Estado ou <b>indireta</b> por concessão ou permissão, sempre com <b>licitação</b> (CF, art. 175, do estudo anterior). Regulação: agências e entes reguladores fiscalizam, e a Lei 13.460 não afasta as normas regulatórias específicas (art. 1º, § 2º, I).", "<b>Lei 13.460/2017: campo de aplicação (art. 1º e 2º).</b> Normas básicas de participação, proteção e defesa dos direitos do usuário de serviços públicos prestados <b>direta ou indiretamente</b>. Aplica-se à administração direta e indireta de <b>todos os entes</b> (art. 37, § 3º, I da CF). Não afasta normas regulatórias nem o <b>CDC</b>, quando houver relação de consumo (§ 2º). Aplica-se <b>subsidiariamente</b> a serviços prestados por particular (§ 3º). <b>Usuário</b>: pessoa <b>física ou jurídica</b> que se beneficia ou utiliza, <b>efetiva ou potencialmente</b>, do serviço. <b>Administração pública</b> inclui a <b>Advocacia Pública</b> e a <b>Defensoria Pública</b>. <b>Manifestações</b>: reclamações, denúncias, sugestões, elogios e demais pronunciamentos. Acesso a informações segue a Lei 12.527 (LAI). Cada Poder e esfera publica, no mínimo <b>anualmente</b>, o quadro geral dos serviços públicos (art. 3º).", "<b>Diretrizes e direitos (arts. 5º a 8º).</b> Art. 5º traz <b>15 diretrizes</b>, entre elas: urbanidade e cortesia; <b>presunção de boa-fé do usuário</b>; atendimento por <b>ordem de chegada</b>, com prioridade legal a pessoas com deficiência, idosos, gestantes, lactantes e quem acompanha criança de colo; vedada exigência não prevista em lei (inciso IV); <b>vedado reconhecimento de firma</b> (autenticação pelo agente à vista do original), salvo dúvida de autenticidade; linguagem simples; <b>vedada nova prova sobre fato já comprovado</b> em documentação válida. Art. 6º, <b>direitos básicos</b>: participação no acompanhamento e na avaliação; liberdade de escolha entre os meios oferecidos, sem discriminação; acesso e proteção de informações pessoais; informações precisas, inclusive sobre <b>valor das taxas e tarifas</b> e <b>situação da tramitação</b> dos processos. Art. 8º, <b>deveres</b>: usar adequadamente, informar, colaborar e <b>preservar os bens públicos</b>.", "<b>Carta de Serviços (art. 7º).</b> Órgãos e entidades <b>divulgarão</b> a Carta de Serviços ao Usuário: informa os serviços, as formas de acesso e os <b>compromissos e padrões de qualidade</b>. Conteúdo mínimo: serviços oferecidos; requisitos e documentos; principais etapas; <b>prazo máximo</b> de prestação; forma de prestação; locais e formas de manifestação. Também detalha prioridades de atendimento, <b>previsão de tempo de espera</b>, mecanismos de comunicação, procedimentos para manifestações e consulta ao andamento. É <b>atualizada periodicamente</b> e publicada no sítio eletrônico; regulamento de cada Poder e esfera disciplina a operacionalização (§ 5º).", "<b>Manifestações e ouvidorias (arts. 9º a 17).</b> A manifestação vai à <b>ouvidoria</b>, com <b>identificação</b> do requerente, sem exigências que a inviabilizem (art. 10); são <b>vedadas exigências sobre os motivos</b> da manifestação; se não houver ouvidoria, o usuário apresenta ao órgão executor e ao órgão a que se vincule; pode ser eletrônica, por correspondência ou <b>verbal</b> (reduzida a termo). A identificação é <b>informação pessoal protegida</b>. <b>Em nenhuma hipótese</b> se recusa o recebimento, sob pena de <b>responsabilidade do agente</b> (art. 11). Resolução efetiva (art. 12, p.ú.): recepção, <b>comprovante</b>, análise, <b>decisão administrativa final</b> e ciência ao usuário. Atribuições da ouvidoria (art. 13), entre elas promover a <b>mediação e conciliação</b>; elabora <b>relatório de gestão anual</b> (arts. 14 e 15), enviado à autoridade máxima e <b>publicado integralmente na internet</b>. <b>Prazo:</b> decisão final em <b>30 dias</b>, prorrogável de forma justificada <b>uma única vez</b>, por igual período; pedidos da ouvidoria a agentes do órgão são respondidos em <b>20 dias</b>, prorrogáveis uma vez por igual período (art. 16).", "<b>Conselhos de usuários e avaliação (arts. 18 a 25).</b> Conselhos são <b>órgãos consultivos</b>: acompanham e avaliam a prestação, propõem melhorias, contribuem para as diretrizes de atendimento e <b>acompanham e avaliam a atuação do ouvidor</b>. Composição com <b>representatividade e pluralidade</b>; escolha dos representantes em <b>processo aberto ao público</b>, diferenciado por tipo de usuário; o conselho <b>pode ser consultado</b> na indicação do ouvidor; participação é <b>serviço relevante e sem remuneração</b>. <b>Avaliação continuada</b> (art. 23): satisfação, qualidade do atendimento, cumprimento de compromissos e prazos, número de manifestações e medidas de melhoria; <b>pesquisa de satisfação no mínimo a cada ano</b>; resultado <b>publicado integralmente</b>, com <b>ranking</b> das entidades com mais reclamações. <b>Vigência escalonada</b> (art. 25): <b>360 dias</b> para União, Estados, DF e Municípios com mais de 500 mil habitantes (Curitiba); <b>540 dias</b> para Municípios entre 100 e 500 mil; <b>720 dias</b> para os menores.", "<b>CDC aplicado aos serviços públicos.</b> <b>Fornecedor</b> é toda pessoa física ou jurídica, <b>pública ou privada</b>, que presta serviços (art. 3º); <b>serviço</b> é a atividade fornecida no mercado de consumo <b>mediante remuneração</b> (§ 2º). Por isso o STJ distingue (memória): serviço remunerado por <b>tarifa ou preço público</b> (água, energia, telefonia) é relação de consumo; serviço custeado por <b>taxa ou por impostos</b> não é. <b>Art. 6º, X</b>: direito básico à adequada e eficaz prestação dos serviços públicos em geral. <b>Art. 22</b>: órgãos públicos, por si ou por suas empresas, concessionárias, permissionárias ou outra forma de empreendimento, devem fornecer serviços <b>adequados, eficientes, seguros e, quanto aos essenciais, contínuos</b>; no descumprimento, são <b>compelidos a cumprir</b> e a <b>reparar</b> os danos. <b>Art. 14</b>: responsabilidade <b>objetiva</b> por defeito do serviço; só se exime provando inexistência do defeito ou culpa exclusiva do consumidor ou de terceiro (§ 3º); profissionais liberais respondem por <b>culpa</b> (§ 4º). <b>Art. 27</b>: prescrição de <b>cinco anos</b> para a reparação por fato do serviço, contada do conhecimento do dano e de sua autoria. <b>Art. 42, p.ú.</b>: cobrança de quantia indevida gera repetição <b>em dobro</b> com correção e juros, salvo engano justificável; o STJ (Corte Especial, memória) fixou que isso não exige má-fé quando a cobrança contraria boa-fé objetiva.", "<b>Interrupção do serviço e tarifa (memória, a conferir).</b> O corte por inadimplemento de serviço essencial é admitido quando há <b>aviso prévio</b> e se trata de dívida atual, não de débito pretérito; não se admite o corte em <b>unidades que prestam serviços indispensáveis</b> (hospitais, por exemplo) sem cautela, e há controvérsia quando o inadimplente é ente público, onde se protegem as unidades que atendem a população. <b>Tarifa progressiva</b> por faixas de consumo e categorias é legítima (súmula do STJ). A <b>tarifa mínima</b> de água e a assinatura básica de telefonia também são admitidas. A <b>contribuição</b> para iluminação pública é tributo (COSIP), não tarifa, e já foi estudada em Tributário."], "pega": ["Classificação do CC: bens públicos são os do domínio nacional pertencentes a <b>pessoas jurídicas de direito público interno</b>. A banca diz que bens de empresa pública ou de sociedade de economia mista são públicos pelo CC. Pelo art. 98, são particulares, ainda que afetados ao serviço (a proteção especial vem da jurisprudência).", "Dominicais das pessoas de direito público com <b>estrutura de direito privado</b>: pela lei, em regra, são <b>dominicais</b> (art. 99, p.ú.). A banca troca por bens de uso especial.", "Inalienabilidade: uso comum e uso especial são inalienáveis <b>enquanto conservarem a qualificação</b>, na forma da lei. A banca diz que são inalienáveis para sempre ou que a desafetação não é possível. Dominicais <b>podem</b> ser alienados com as exigências da lei.", "<b>Não há usucapião</b> de bens públicos (art. 102), de qualquer classe, inclusive dominicais. A banca diz que dominicais podem ser usucapidos após a desafetação tácita.", "Alienação de imóveis (Lei 14.133, art. 76): interesse público justificado, <b>avaliação prévia</b>, <b>autorização legislativa</b> e <b>leilão</b>. A banca troca por concorrência, diz que a autorização legislativa é sempre dispensável ou omite a avaliação. Exceção: imóveis vindos de <b>procedimento judicial ou dação em pagamento</b> dispensam a lei (só avaliação e leilão).", "Doação de imóvel com dispensa de licitação: só para <b>outro órgão ou entidade da Administração</b> (de qualquer esfera). A banca diz que pode ser a qualquer entidade sem fins lucrativos. E, cessadas as razões da doação, o imóvel <b>reverte</b> ao doador, vedada a alienação pelo donatário.", "<b>Investidura</b>: ao lindeiro, de área remanescente de obra pública inaproveitável isoladamente, por preço <b>não inferior à avaliação nem superior a 50%</b> do valor máximo de dispensa. A banca inverte os limites ou diz que a venda pode ser por qualquer valor.", "Doação <b>com encargo</b>: é <b>licitada</b> (dispensada se houver interesse público justificado), com encargos, prazo e <b>cláusula de reversão</b> no instrumento, sob pena de nulidade. A banca diz que a cláusula de reversão é facultativa.", "Uso privativo: autorização e permissão são atos <b>unilaterais, discricionários e precários</b>; concessão de uso é <b>contrato</b> com prazo e licitação. A banca diz que a permissão é contratual e estável ou que a concessão é precária.", "Lei 13.460, art. 1º, § 3º: aplica-se <b>subsidiariamente</b> aos serviços prestados por particular. A banca diz que não se aplica a concessionárias ou que se aplica com preferência sobre as normas das agências. Também: <b>não afasta o CDC</b> nem as normas regulatórias.", "<b>Usuário</b> pode ser pessoa física <b>ou jurídica</b>, com benefício efetivo <b>ou potencial</b>. A banca restringe a pessoa física ou a quem já usa o serviço. A <b>Advocacia Pública e a Defensoria</b> contam como administração pública para a lei.", "Ouvidoria: decisão final em <b>30 dias</b>, prorrogável <b>uma única vez</b>, por igual período; resposta de agentes à ouvidoria em <b>20 dias</b>, também prorrogável uma vez. A banca troca por 60 dias, prorrogações sucessivas ou 15 dias.", "Manifestação: <b>vedadas exigências sobre os motivos</b>; recusa de recebimento <b>nunca</b> (responsabilidade do agente); pode ser verbal, reduzida a termo. A banca diz que a ouvidoria pode exigir justificativa ou recusar manifestação anônima já identificada em outro canal.", "Conselhos de usuários são <b>consultivos</b>, participação <b>sem remuneração</b>, considerada serviço relevante; podem ser consultados na indicação do ouvidor. A banca diz que são deliberativos, remunerados ou que escolhem o ouvidor.", "Vigência: <b>360 dias</b> para Municípios com mais de 500 mil habitantes, 540 entre 100 e 500 mil e 720 para os menores. A banca embaralha os números ou diz que a vigência foi imediata.", "CDC e serviços públicos: art. 22 exige serviços adequados, eficientes, seguros e, <b>quanto aos essenciais, contínuos</b>; responsabilidade <b>objetiva</b> (art. 14). A banca diz que todos os serviços públicos devem ser contínuos ou que a responsabilidade depende de culpa. Prescrição do art. 27: <b>cinco anos</b>."]}, {"materia": "DIREITO CIVIL", "titulo": "Responsabilidade civil: teorias, elementos, dano, responsabilidade objetiva e subjetiva", "key": "CIV", "nome": "Civil", "conc": ["Edital: item 3 de Direito Civil (responsabilidade civil). Li <b>literalmente</b>, no site da Câmara dos Deputados (Código Civil republicado e atualizado), os <b>arts. 186 a 188</b>, o <b>art. 389 a 391</b> e os <b>arts. 927 a 954</b>. <b>Não reli</b> os arts. 393 (caso fortuito), 402 a 405 (perdas e danos), 206 (prescrição) nem a Constituição. As súmulas do STJ e do STF citadas vêm <b>da minha memória</b>.", "<b>Ato ilícito (arts. 186 e 187).</b> Comete ato ilícito quem, por <b>ação ou omissão voluntária, negligência ou imprudência</b>, viola direito e causa dano a outrem, <b>ainda que exclusivamente moral</b> (art. 186). Também o comete o <b>titular de um direito que, ao exercê-lo, excede manifestamente os limites</b> do fim econômico ou social, da <b>boa-fé</b> ou dos <b>bons costumes</b> (art. 187): é o <b>abuso de direito</b>, que a doutrina e o Enunciado 37 do CJF (memória) tratam como ilícito <b>objetivo</b>, sem exigir culpa. O ato ilícito, no art. 927, <b>caput</b>, gera o dever de reparar.", "<b>Elementos.</b> <b>Conduta</b> (ação ou omissão), <b>dano</b> e <b>nexo causal</b>; na responsabilidade <b>subjetiva</b> exige-se também <b>culpa</b> (em sentido amplo: dolo, negligência, imprudência; no art. 186 a imperícia é lida junto). <b>Sem dano não há responsabilidade civil</b> (nem se indeniza o risco), exceto na tutela inibitória do CPC, art. 497, parágrafo único, em que é irrelevante o dano ou a culpa para inibir ou remover o ilícito. Nexo causal: teorias da <b>equivalência das condições</b>, da <b>causalidade adequada</b> e da <b>causa direta e imediata</b> (a doutrina e o STJ se inclinam à última, memória). <b>Excludentes</b>: culpa exclusiva da vítima, fato de terceiro, caso fortuito ou força maior, e os casos do art. 188.", "<b>Excludentes de ilicitude (art. 188).</b> Não são ilícitos: <b>legítima defesa</b> e <b>exercício regular de direito</b> reconhecido (inciso I); <b>deterioração ou destruição da coisa alheia, ou lesão a pessoa, para remover perigo iminente</b> (<b>estado de necessidade</b>, inciso II). No estado de necessidade o ato só é legítimo quando <b>absolutamente necessário</b> e nos limites do indispensável (p.ú.). Mesmo lícito, se a vítima ou o dono da coisa <b>não forem culpados do perigo</b>, têm <b>direito à indenização</b> (art. 929); o autor do dano tem <b>ação regressiva</b> contra o terceiro culpado pelo perigo (art. 930) e contra aquele em cuja defesa agiu em legítima defesa (art. 930, p.ú.).", "<b>Cláusula geral e responsabilidade objetiva (art. 927).</b> Quem causa dano por ato ilícito (arts. 186 e 187) <b>fica obrigado a repará-lo</b> (caput). Parágrafo único: haverá obrigação de reparar <b>independentemente de culpa</b> nos casos <b>especificados em lei</b> ou quando a <b>atividade normalmente desenvolvida</b> pelo autor do dano <b>implicar, por sua natureza, risco</b> para os direitos de outrem: é a <b>teoria do risco</b> (cláusula geral de atividade de risco). Outros casos de responsabilidade objetiva no CC: <b>empresários e empresas pelos produtos postos em circulação</b> (art. 931); <b>fato de terceiro</b> dos incisos I a V do art. 932 (art. 933); <b>animais</b> (art. 936); e as previstas em leis especiais (CDC, art. 14, ambiental, estatal).", "<b>Responsabilidade por fato de terceiro (arts. 932 e 933).</b> Respondem também: <b>pais</b> pelos filhos menores sob sua autoridade <b>e em sua companhia</b>; <b>tutor e curador</b> pelos pupilos e curatelados nas mesmas condições; <b>empregador ou comitente</b> por empregados, serviçais e prepostos <b>no exercício do trabalho ou em razão dele</b>; <b>donos de hotéis e estabelecimentos de albergue</b> por hóspedes, moradores e educandos; e <b>quem gratuitamente participou dos produtos do crime</b>, até a concorrente quantia. Pelo art. 933, <b>mesmo sem culpa</b> própria, respondem (responsabilidade <b>objetiva</b> pelo ato do terceiro, que precisa ter agido com <b>culpa</b>). Quem ressarce o dano de outro pode <b>regredir</b> contra o causador, <b>salvo</b> se este for descendente seu, absoluta ou relativamente incapaz (art. 934).", "<b>Incapaz e responsabilidade solidária.</b> O <b>incapaz responde</b> pelos prejuízos que causar <b>se as pessoas responsáveis não tiverem obrigação de fazê-lo ou não dispuserem de meios suficientes</b> (art. 928): responsabilidade <b>subsidiária e equitativa</b>, que <b>não pode privar do necessário</b> o incapaz ou seus dependentes. <b>Solidariedade</b> (art. 942): os bens do responsável ficam sujeitos à reparação e, havendo mais de um autor, <b>todos respondem solidariamente</b>; são solidariamente responsáveis com os autores os <b>coautores</b> e as pessoas do art. 932. O dever de reparar e o direito de exigir reparação <b>transmitem-se com a herança</b> (art. 943). A responsabilidade civil é <b>independente da criminal</b>, mas não se discute a existência do fato ou da autoria <b>já decididas no juízo criminal</b> (art. 935).", "<b>Coisas e animais (arts. 936 a 938).</b> <b>Dono ou detentor do animal</b> ressarce o dano que ele causar, <b>salvo se provar culpa da vítima ou força maior</b> (art. 936: objetiva, com excludentes). <b>Dono de edifício ou construção</b> responde pela <b>ruína</b>, se esta provier de <b>falta de reparos cuja necessidade fosse manifesta</b> (art. 937). Quem <b>habita</b> prédio ou parte dele responde pelo dano das coisas que dele <b>caírem ou forem lançadas</b> em lugar indevido (art. 938, <b>effusis et dejectis</b>), mesmo sem identificar o autor, regra da responsabilidade do habitante.", "<b>Cobrança indevida (arts. 939 a 941).</b> Quem cobra a dívida <b>antes do vencimento</b>, fora dos casos legais, fica obrigado a <b>esperar o tempo que faltava</b>, <b>descontar os juros</b> e pagar as <b>custas em dobro</b> (art. 939). Quem cobra <b>dívida já paga</b>, sem ressalvar o recebido, deve pagar <b>o dobro</b> do que cobrou; quem pede <b>mais do que é devido</b> paga o equivalente ao que exigiu, <b>salvo prescrição</b> (art. 940). As penas <b>não se aplicam</b> se o autor <b>desistir da ação antes de contestada a lide</b>, ressalvada a indenização do prejuízo provado (art. 941). Súmula 159 do STF (memória): a cobrança excessiva, mas de boa-fé, <b>não</b> dá lugar às sanções da lei antiga. O STJ exige <b>má-fé</b> para o art. 940 (memória, a conferir).", "<b>Indenização: extensão (arts. 944 a 947).</b> <b>A indenização mede-se pela extensão do dano</b> (art. 944), e não pela gravidade da culpa; mas se houver <b>excessiva desproporção entre a gravidade da culpa e o dano</b>, o juiz <b>pode reduzir equitativamente</b> (p.ú.). Em regra o juiz <b>não</b> aumenta pela gravidade da culpa. <b>Culpa concorrente</b> (art. 945): a indenização considera a <b>gravidade da culpa da vítima</b> em confronto com a do autor. Obrigação indeterminada sem critério na lei ou no contrato: valor apurado na forma da lei processual (art. 946); se o devedor não puder cumprir na espécie, <b>substitui-se pelo valor em moeda corrente</b> (art. 947). Inadimplemento contratual: perdas e danos, juros, <b>atualização monetária</b> e <b>honorários de advogado</b> (art. 389); todos os bens do devedor respondem (art. 391).", "<b>Indenização: casos especiais (arts. 948 a 954).</b> <b>Homicídio</b>: despesas de tratamento, funeral e luto da família e <b>alimentos</b> a quem o morto devia, considerando a duração provável de vida da vítima (art. 948). <b>Lesão à saúde</b>: despesas de tratamento e <b>lucros cessantes</b> até o fim da convalescença, mais outro prejuízo provado (art. 949). <b>Defeito que impeça o ofício ou reduza a capacidade de trabalho</b>: além disso, <b>pensão</b> correspondente ao trabalho de que se inabilitou ou à depreciação sofrida; o lesado pode pedir que seja arbitrada e paga <b>de uma só vez</b> (art. 950). Aplica-se também ao <b>profissional</b> que, por negligência, imprudência ou imperícia, mata, agrava o mal, lesiona ou inabilita o paciente (art. 951). <b>Usurpação ou esbulho</b>: restituição, deteriorações e lucros cessantes, ou equivalente (art. 952). <b>Injúria, difamação e calúnia</b>: reparação do dano; sem prova de prejuízo material, o juiz fixa <b>equitativamente</b> o valor (art. 953). <b>Ofensa à liberdade pessoal</b>: cárcere privado, prisão por queixa ou denúncia falsa e de má-fé e prisão ilegal (art. 954).", "<b>Dano.</b> <b>Material</b>: dano emergente e lucros cessantes. <b>Moral</b>: lesão a direitos da personalidade, reconhecido pelo art. 186 (&quot;ainda que exclusivamente moral&quot;) e pela CF (art. 5º, V e X, não reli). <b>Estético</b>: alteração morfológica; o STJ admite <b>cumular</b> dano estético e moral (Súmula 387, memória) e dano material e moral (Súmula 37). <b>Pessoa jurídica</b> pode sofrer dano moral (Súmula 227). Em certas hipóteses o dano moral é <b>in re ipsa</b> (presumido), como a inscrição indevida em cadastro de inadimplentes. <b>Perda de uma chance</b>: reparação da probabilidade séria e real perdida, e não do resultado final (STJ, memória). <b>Juros</b>: na responsabilidade extracontratual, contam-se <b>desde o evento danoso</b> (Súmula 54); a correção do dano moral conta-se <b>da data do arbitramento</b> (Súmula 362). Memória, não conferida nesta rodada.", "<b>Teorias e tipologia.</b> <b>Subjetiva</b> (culpa como núcleo, art. 186) e <b>objetiva</b> (risco: do <b>risco-proveito</b>, do <b>risco criado</b>, do <b>risco integral</b>). <b>Contratual</b> (inadimplemento, arts. 389 e ss.) e <b>extracontratual ou aquiliana</b> (art. 186). Responsabilidade <b>direta</b> (por fato próprio) e <b>indireta</b> (por fato de terceiro, de coisa ou de animal). O CC adota a <b>subjetiva como regra</b> (art. 927, caput) e a <b>objetiva como exceção</b> (p.ú.). Diferença com a responsabilidade do Estado, já estudada em Administrativo: a CF, art. 37, § 6º, adota a objetiva para pessoas jurídicas de direito público e prestadoras de serviço público, e a ação de regresso contra o agente exige dolo ou culpa. A prescrição da pretensão de reparação civil é de <b>três anos</b> no CC (art. 206, § 3º, V, memória) e de <b>cinco anos</b> contra a Fazenda (Decreto 20.910, estudado em Civil 1)."], "pega": ["Abuso de direito (art. 187): ato ilícito de quem exerce direito <b>excedendo manifestamente</b> os limites do fim econômico ou social, da <b>boa-fé</b> ou dos <b>bons costumes</b>. A banca diz que exige culpa (concepção subjetiva) ou que não gera dever de indenizar.", "Art. 186: comete ato ilícito quem viola direito e causa dano, <b>ainda que exclusivamente moral</b>. A banca diz que só há ato ilícito com dano patrimonial ou que o dano moral exige dano material concomitante.", "Excludentes do art. 188: <b>legítima defesa</b>, <b>exercício regular de direito</b> e <b>remoção de perigo iminente</b>. Mesmo assim, quem agiu em estado de necessidade <b>indeniza</b> a vítima não culpada pelo perigo (art. 929), com <b>regresso</b> contra o terceiro culpado (art. 930). A banca diz que o estado de necessidade afasta qualquer indenização.", "Art. 927, p.ú.: responsabilidade objetiva nos casos <b>especificados em lei</b> ou quando a <b>atividade normalmente desenvolvida implicar risco por sua natureza</b>. A banca diz que todo dano exige culpa, que a atividade de risco precisa ser ilícita ou que a objetiva depende de previsão contratual.", "Fato de terceiro (arts. 932 e 933): pais, tutores, curadores, empregadores, donos de hotéis respondem <b>mesmo sem culpa própria</b>, pelo ato <b>culposo</b> do terceiro. A banca diz que dependem de culpa <i>in vigilando</i> ou <i>in eligendo</i> provada. Pais respondem pelos filhos menores <b>sob sua autoridade e em sua companhia</b>.", "Empregador: responde pelos atos de empregados, serviçais e prepostos <b>no exercício do trabalho que lhes competir ou em razão dele</b>. A banca estende a qualquer ato fora do trabalho, sem relação com a função.", "Incapaz (art. 928): responde <b>subsidiariamente</b>, se os responsáveis não tiverem obrigação ou meios; indenização <b>equitativa</b> e que <b>não prive do necessário</b>. A banca diz que o incapaz nunca responde ou que responde solidariamente e sempre pelo valor integral.", "Regresso (art. 934): quem paga pelo outro pode reaver, <b>salvo</b> se o causador for <b>descendente seu, absoluta ou relativamente incapaz</b>. A banca estende a vedação a ascendentes, a capazes ou a qualquer parente.", "Responsabilidade civil e criminal (art. 935): são <b>independentes</b>, mas o que o juízo criminal decidiu sobre <b>existência do fato e autoria</b> não se rediscute. A banca diz que a absolvição criminal sempre impede a ação civil ou que a esfera civil depende da condenação penal.", "Animais (art. 936): dono ou detentor ressarce o dano, <b>salvo culpa da vítima ou força maior</b>. A banca diz que o fortuito sempre exime ou que só o dono (não o detentor) responde. Edifício (art. 937): ruína por <b>falta de reparos cuja necessidade fosse manifesta</b>; coisas lançadas (art. 938): responde o <b>habitante</b>.", "Cobrança indevida: dívida <b>já paga</b> cobrada sem ressalva gera <b>o dobro</b> do cobrado; cobrança de <b>mais do que é devido</b> gera o equivalente ao excesso; ambos <b>salvo prescrição</b>, e não incidem se o autor desistir <b>antes da contestação</b>. A banca troca por triplo, por qualquer momento da desistência ou diz que a prescrição não exclui.", "Extensão da indenização (art. 944): <b>mede-se pelo dano</b>, não pela culpa; o juiz pode <b>reduzir</b> se houver excessiva desproporção entre a culpa e o dano. A banca diz que o juiz pode <b>aumentar</b> a indenização pela gravidade da culpa ou que a redução é obrigatória.", "Culpa concorrente (art. 945): indenização fixada pela <b>gravidade da culpa da vítima em confronto com a do autor</b>. A banca diz que afasta toda indenização ou que a divide sempre pela metade.", "Homicídio (art. 948): despesas de tratamento, funeral e luto e <b>alimentos</b> a quem o morto devia, pela <b>duração provável da vida da vítima</b>. Lesão com perda da capacidade (art. 950): <b>pensão</b> proporcional e pagamento <b>de uma só vez</b> se o lesado preferir. A banca inverte, diz que o pagamento único é opção do ofensor ou que a pensão só vale para quem exercia profissão formal.", "Pessoa jurídica pode sofrer <b>dano moral</b> (Súmula 227 do STJ); <b>dano estético e dano moral</b> são <b>cumuláveis</b> (Súmula 387); <b>juros</b> na responsabilidade extracontratual correm <b>desde o evento danoso</b> (Súmula 54). A banca nega a cumulação ou conta os juros da citação. Súmulas citadas de memória."]}, {"materia": "DIREITO TRIBUTÁRIO, PROCESSO TRIBUTÁRIO E FINANCEIRO", "titulo": "Receita pública, despesa pública, créditos adicionais, dívida ativa e dívida pública (Lei 4.320/1964)", "key": "TRI", "nome": "Tributário", "conc": ["Edital: item 14 de Tributário/Financeiro (continuação): receita pública, despesa pública, restos a pagar e despesas de exercícios anteriores, fundos especiais, crédito e dívida pública. Li <b>literalmente</b>, no site da Câmara dos Deputados, a <b>Lei 4.320/1964</b> na versão atualizada, <b>até o art. 110</b>; <b>não li</b> as disposições finais (arts. 111 em diante). <b>Não reli</b> a Constituição (arts. 52, 163, 165, 167), a LRF e a Resolução 40/2001 do Senado: o que digo deles vem do estudo anterior ou da memória, e está sinalizado.", "<b>Receita pública: categorias (art. 11).</b> A receita classifica-se em <b>Receitas Correntes</b> e <b>Receitas de Capital</b>. <b>Correntes</b> (§ 1º): tributária, de contribuições, patrimonial, agropecuária, industrial, de serviços e outras, e as <b>transferências</b> recebidas para atender despesas correntes. <b>De Capital</b> (§ 2º): constituição de dívidas (<b>operações de crédito</b>), conversão em espécie de bens e direitos (<b>alienação de bens</b>), amortização de empréstimos, transferências para despesas de capital e, ainda, o <b>superavit do Orçamento Corrente</b>. Mas o § 3º diz que esse superavit <b>não constitui item de receita orçamentária</b>. Esquema do § 4º: correntes (tributária com impostos, taxas e contribuições de melhoria; contribuições; patrimonial; agropecuária; industrial; serviços; transferências correntes; outras) e de capital (operações de crédito; alienação de bens; amortização de empréstimos; transferências de capital; outras). O conceito de tributo da Lei 4.320 (art. 9º) é <b>vetado e mantido</b>: o conceito vigente é o do <b>CTN, art. 3º</b>.", "<b>Estágios e regras da receita (arts. 51 a 57).</b> <b>Legalidade e anterioridade orçamentária</b> (art. 51): nenhum tributo é exigido ou aumentado sem lei e nenhum é cobrado em cada exercício sem <b>prévia autorização orçamentária</b>, ressalvados a tarifa aduaneira e o imposto de guerra (regra da lei antiga, superada pela CF, memória). <b>Lançamento</b> (arts. 52 e 53): ato da repartição competente que verifica a procedência do crédito e a pessoa devedora e <b>inscreve o débito</b>. <b>Compensação</b> de dívida com crédito contra a Fazenda: <b>não admitida</b> (art. 54), embora o CTN (art. 170, estudo anterior) a permita se houver lei. <b>Recibos</b> em via única (art. 55). <b>Unidade de tesouraria</b> (art. 56): recolhimento de todas as receitas sem fragmentação para criar caixas especiais. <b>Art. 57</b>: toda receita arrecadada é <b>orçamentária</b>, inclusive operações de crédito, ainda que não prevista. Fases da receita: previsão, lançamento, arrecadação e recolhimento. Receita <b>extraorçamentária</b>: entradas compensatórias, como cauções, depósitos e restos a pagar (art. 103, p.ú.).", "<b>Dívida ativa (art. 39).</b> Créditos da Fazenda, tributários ou não, são escriturados como receita <b>do exercício em que forem arrecadados</b>. Exigíveis pelo transcurso do prazo de pagamento, são inscritos como <b>Dívida Ativa</b> em registro próprio, <b>após apurada a liquidez e certeza</b> (§ 1º). <b>Tributária</b>: crédito proveniente de obrigação legal relativa a tributos, adicionais e multas. <b>Não tributária</b>: os demais, como empréstimos compulsórios, contribuições legais, multas de qualquer origem <b>exceto as tributárias</b>, foros, laudêmios, aluguéis, taxas de ocupação, custas, preços de serviços, indenizações, reposições, restituições, alcances julgados e créditos de contratos e garantias (§ 2º). Observação: o texto da lei lista os empréstimos compulsórios e as contribuições legais entre os créditos <b>não tributários</b>, embora o CTN e a CF os tratem como tributos; em prova que pergunte pela <b>letra da Lei 4.320</b>, siga a lei. A receita da Dívida Ativa inclui <b>correção, multa, juros e o encargo legal</b> (§ 4º).", "<b>Cessão de créditos (art. 39-A, LC 208/2024).</b> A União, o Estado, o DF ou o Município pode <b>ceder onerosamente</b>, nos termos da lei e de <b>lei específica que a autorize</b>, direitos originados de créditos tributários e não tributários, <b>inclusive inscritos em dívida ativa</b>, a pessoas jurídicas de direito privado ou a <b>fundos de investimento regulados pela CVM</b>. Requisitos do § 1º: <b>preservar a natureza</b> do crédito, as garantias e os privilégios; manter <b>inalterados</b> os critérios de atualização, o principal, juros, multas, pagamento e vencimento; manter com a Fazenda a <b>prerrogativa de cobrança judicial e extrajudicial</b>; operação <b>definitiva</b>, sem responsabilidade do cedente (o devedor continua obrigado a todo tempo); abranger só o <b>direito autônomo ao recebimento</b> de créditos <b>já constituídos e reconhecidos</b> (inclusive parcelamento); ser autorizada pelo <b>chefe do Executivo</b> ou por delegado; realizar-se até <b>90 dias antes do fim do mandato</b>, salvo se o pagamento integral ocorrer depois.", "<b>Cessão: demais regras.</b> Preserva a base de cálculo das <b>vinculações constitucionais</b> (§ 2º); <b>não pode abranger</b> percentuais que, por regra constitucional, pertençam a outros entes (§ 3º); <b>não se enquadra</b> como operação de crédito da LRF (art. 29, III e IV, e art. 37), sendo <b>venda definitiva de patrimônio</b> (§ 4º); a cessão de créditos tributários é <b>atividade da administração tributária</b>, sem a vedação de vincular impostos (art. 167, IV da CF) (§ 5º); a receita de capital da venda observa o <b>art. 44 da LRF</b>: pelo menos <b>50%</b> para despesas de <b>previdência social</b> e o restante para <b>investimentos</b> (§ 6º); pode ser feita por <b>sociedade de propósito específico</b>, com <b>dispensa de licitação</b> (§ 7º); a <b>instituição financeira controlada pelo cedente</b> não pode adquirir, negociar ou lastrear operação com esses créditos (§ 8º), mas pode estruturar como prestadora de serviço (§ 9º); parcelamentos <b>não inscritos</b> em dívida ativa só podem ser cedidos no limite do <b>estoque existente</b> até a publicação da lei (§ 10).", "<b>Despesa pública: categorias (arts. 12 e 13).</b> <b>Despesas Correntes</b>: <b>custeio</b> (manutenção de serviços já criados, inclusive conservação e adaptação de imóveis) e <b>transferências correntes</b> (sem contraprestação direta em bens ou serviços, inclusive <b>subvenções</b>). <b>Despesas de Capital</b>: <b>investimentos</b> (obras, aquisição de imóveis necessários às obras, equipamentos, material permanente, capital de empresas <b>não</b> comerciais ou financeiras), <b>inversões financeiras</b> (aquisição de imóveis ou bens de capital <b>já em utilização</b>, títulos de empresas já constituídas sem aumento de capital, capital de empresas <b>comerciais ou financeiras</b>) e <b>transferências de capital</b> (incluindo a <b>amortização da dívida pública</b>, § 6º). <b>Juros da dívida pública</b> são transferências <b>correntes</b> (art. 13). <b>Material permanente</b> é o de duração superior a <b>dois anos</b> (art. 15, § 2º). <b>Subvenções</b>: <b>sociais</b> (instituições assistenciais ou culturais sem fins lucrativos) e <b>econômicas</b> (empresas industriais, comerciais, agrícolas ou pastoris), em transferências para custeio (art. 12, § 3º).", "<b>Vedações e unidades.</b> A lei não consigna <b>dotações globais</b> para despesas indiferentes de pessoal, material, serviços e transferências (art. 5º), salvo os programas especiais do art. 20, p.ú. (<b>dotações globais</b> classificadas em despesas de capital). <b>Subvenções econômicas</b> cobrem déficits de manutenção de empresas públicas (art. 18). Vedada ajuda financeira a <b>empresa de fins lucrativos</b>, salvo subvenção autorizada em lei especial (art. 19), e vedado auxílio para investimentos incorporáveis ao patrimônio de empresas privadas de fins lucrativos (art. 21). <b>Subvenção social</b> só vai a instituições com funcionamento satisfatório (art. 17) e deve ser calculada, se possível, por unidades de serviços efetivamente prestados (art. 16, p.ú.). <b>Unidade orçamentária</b> é o agrupamento de serviços ao qual se consignam dotações próprias (art. 14).", "<b>Estágios da despesa (arts. 58 a 65).</b> <b>Empenho</b>: ato de autoridade competente que cria para o Estado <b>obrigação de pagamento pendente de implemento de condição</b> (as palavras &quot;ou não&quot; foram vetadas e o veto foi mantido; art. 58). <b>Não pode exceder o limite dos créditos</b> (art. 59); <b>é vedada despesa sem prévio empenho</b> (art. 60), salvo casos especiais de dispensa da nota de empenho (§ 1º); <b>estimativa</b> quando não se puder determinar o montante (§ 2º); <b>global</b> para despesas contratuais parceladas (§ 3º). <b>Nota de empenho</b> indica credor, especificação, importância e dedução do saldo (art. 61). <b>Liquidação</b> verifica o direito adquirido do credor, a origem e o objeto, a importância exata e <b>a quem pagar</b> (art. 63), com base no contrato, na nota de empenho e nos comprovantes da entrega ou da prestação. <b>Pagamento</b> só após regular liquidação (art. 62), por <b>ordem de pagamento</b> de autoridade competente (art. 64). Sequência: <b>empenho, liquidação, pagamento</b>.", "<b>Fim de mandato municipal (art. 59, §§ 1º a 4º).</b> Ressalvado o art. 67 da CF (da época), <b>é vedado aos Municípios empenhar, no último mês do mandato do Prefeito, mais do que o duodécimo</b> da despesa prevista no orçamento vigente (§ 1º); também é vedado, no mesmo período, <b>assumir compromissos financeiros</b> para execução depois do término do mandato (§ 2º). Não se aplicam em <b>calamidade pública comprovada</b> (§ 3º). <b>Empenhos e atos em desacordo são nulos</b>, sem prejuízo da responsabilidade do Prefeito pelo <b>art. 1º, V, do Decreto-Lei 201/1967</b> (§ 4º). Esse trecho conversa com a LRF, art. 42 (estudo futuro).", "<b>Adiantamento, precatórios e compras.</b> <b>Regime de adiantamento</b> (arts. 68 e 69): entrega de numerário a servidor, precedida de empenho, para despesas que não possam subordinar-se ao processo normal; <b>não se faz adiantamento a servidor em alcance</b> (a expressão &quot;nem a responsável por dois adiantamentos&quot; foi vetada e mantida). <b>Pagamentos por sentença judiciária</b> seguem a <b>ordem de apresentação dos precatórios</b>, à conta dos créditos respectivos, proibida a designação de casos ou pessoas nas dotações (art. 67). Aquisição de material, fornecimento e obras e serviços são regulados em lei, respeitado o princípio da <b>concorrência</b> (art. 70). O pagamento é feito por tesouraria ou pagadoria ou por <b>estabelecimentos bancários credenciados</b> (art. 65).", "<b>Exercício financeiro, restos a pagar e despesas de exercícios anteriores (arts. 34 a 39).</b> O exercício coincide com o <b>ano civil</b> (art. 34). Pertencem a ele as <b>receitas nele arrecadadas</b> e as <b>despesas nele legalmente empenhadas</b> (art. 35: <b>regime misto</b>, caixa para receita e competência pelo empenho para despesa). <b>Restos a Pagar</b>: despesas <b>empenhadas, mas não pagas até 31 de dezembro</b>, distinguindo <b>processadas</b> (já liquidadas) das <b>não processadas</b> (art. 36); empenhos de crédito de <b>vigência plurienal</b> não liquidados só são Restos a Pagar no <b>último ano</b> da vigência. <b>Despesas de exercícios anteriores</b> (art. 37): despesas de exercícios encerrados que tinham crédito próprio com saldo suficiente e não se processaram, <b>restos a pagar com prescrição interrompida</b> e compromissos reconhecidos após o encerramento podem ser pagos por <b>dotação específica</b> do orçamento, discriminada por elementos, observada, se possível, a <b>ordem cronológica</b>. Despesa anulada no exercício <b>reverte à dotação</b>; anulada depois do encerramento, é <b>receita</b> do ano em que se efetivar (art. 38).", "<b>Créditos adicionais (arts. 40 a 46).</b> Autorizações de despesa <b>não computadas ou insuficientemente dotadas</b> na LOA (art. 40). <b>Suplementares</b>: reforço de dotação; <b>especiais</b>: despesa sem dotação específica; <b>extraordinários</b>: despesas <b>urgentes e imprevistas</b> (guerra, comoção intestina, calamidade pública) (art. 41). Suplementares e especiais: <b>autorizados por lei e abertos por decreto executivo</b> (art. 42); extraordinários: <b>abertos por decreto do Executivo</b>, com imediato conhecimento ao Legislativo (art. 44). Dependem de <b>recursos disponíveis</b> e exposição justificativa (art. 43): <b>superavit financeiro</b> do balanço do exercício anterior; <b>excesso de arrecadação</b>; <b>anulação</b> de dotações; <b>operações de crédito</b> autorizadas. Superavit financeiro é a diferença positiva entre <b>ativo e passivo financeiro</b> (§ 2º); excesso de arrecadação é o saldo positivo das diferenças acumuladas mês a mês entre previsão e arrecadação, considerando a tendência do exercício (§ 3º). <b>Vigência</b>: o exercício em que foram abertos, salvo disposição legal sobre especiais e extraordinários (art. 45).", "<b>Fundos especiais (arts. 71 a 74).</b> Fundo especial é o <b>produto de receitas especificadas que, por lei, se vinculam</b> à realização de objetivos ou serviços, com normas peculiares de aplicação (art. 71). A aplicação faz-se por <b>dotação consignada na LOA</b> ou em créditos adicionais (art. 72). <b>Salvo determinação em contrário</b> da lei que o instituiu, o saldo positivo apurado em balanço é <b>transferido para o exercício seguinte</b>, a crédito do mesmo fundo (art. 73). A lei pode fixar normas peculiares de controle, prestação e tomada de contas, <b>sem afastar a competência do Tribunal de Contas</b> (art. 74). O fundo <b>não tem personalidade jurídica</b>, é uma reserva contábil (estudo anterior, ao tratar do Fundo de Aportes e Garantias).", "<b>Dívida pública: flutuante, fundada e balanço.</b> <b>Dívida flutuante</b> (art. 92): <b>restos a pagar</b> (excluídos os serviços da dívida), serviços da dívida a pagar, <b>depósitos</b> e <b>débitos de tesouraria</b>; o registro dos restos a pagar é feito por exercício e credor, distinguindo processadas e não processadas. <b>Dívida fundada ou consolidada</b> (art. 98): compromissos de exigibilidade <b>superior a doze meses</b>, contraídos para atender a <b>desequilíbrio orçamentário ou financeiro</b> de obras e serviços públicos. <b>Balanço Patrimonial</b> (art. 105): <b>Ativo e Passivo Financeiros</b> (créditos e valores realizáveis, e dívidas, <b>independentemente de autorização orçamentária</b>) e <b>Ativo e Passivo Permanentes</b> (bens, créditos e dívidas que dependem de <b>autorização legislativa</b> para mobilização, alienação ou amortização). Demonstrações: Balanço <b>Orçamentário</b> (previsto x realizado, art. 102), <b>Financeiro</b> (receita e despesa orçamentárias e extraorçamentárias, com saldos, art. 103), <b>Patrimonial</b> e <b>Variações Patrimoniais</b> (art. 104).", "<b>Crédito público (memória e estudo anterior, não relido).</b> <b>Operações de crédito</b> são receita de capital (art. 11, § 2º) e só entram no orçamento se <b>autorizadas por lei</b> (art. 7º, § 2º). <b>Antecipação de receita orçamentária (ARO)</b> não é receita orçamentária e é paga até o fim do exercício; a LOA pode autorizá-la (art. 7º, II). A CF veda operações de crédito que excedam as despesas de capital (<b>regra de ouro</b>, art. 167, III) e atribui ao <b>Senado</b> o estabelecimento de limites de endividamento dos Estados e Municípios (art. 52, V a IX; Resolução 40/2001 para a dívida consolidada, memória). A LRF disciplina dívida, operações de crédito, garantias e contragarantias, ARO e restos a pagar (estudo da próxima rodada, unidade 21)."], "pega": ["Superavit do orçamento corrente: o art. 11, § 2º, o inclui entre as receitas de capital, mas o § 3º diz que <b>não constitui item de receita orçamentária</b>. A banca diz que é receita corrente ou que entra como receita orçamentária.", "Receitas de capital: operações de crédito, alienação de bens, amortização de empréstimos e transferências de capital. A banca coloca a <b>receita patrimonial</b> ou a transferência corrente entre as de capital. A alienação de bens (como venda de imóveis) é receita de <b>capital</b>.", "<b>Juros da dívida pública</b> são transferências <b>correntes</b>; a <b>amortização da dívida</b> é transferência de <b>capital</b> (art. 12, § 6º). A banca inverte as duas.", "<b>Investimentos x inversões financeiras</b>: aquisição de imóveis <b>já existentes</b> ou bens de capital <b>já em utilização</b> e capital de empresa <b>comercial ou financeira</b> são <b>inversões</b>; obras, equipamentos e capital de empresas <b>não comerciais ou financeiras</b> são <b>investimentos</b>. A banca troca as categorias.", "<b>Subvenções</b>: sociais (instituições assistenciais ou culturais sem fins lucrativos) e econômicas (empresas industriais, comerciais, agrícolas ou pastoris), ambas <b>transferências correntes para custeio</b>. A banca diz que subvenção econômica cobre investimentos ou que é vedada a empresas públicas.", "Empenho: <b>cria obrigação de pagamento</b> e não pode exceder o limite dos créditos; despesa sem prévio empenho é <b>vedada</b>. Empenho <b>não</b> é pagamento e <b>não</b> dispensa a liquidação. A banca diz que o empenho equivale à liquidação ou que pode ser feito sem crédito disponível.", "Estágios: <b>empenho, liquidação e pagamento</b>. A liquidação verifica o <b>direito adquirido do credor</b> (origem, objeto, importância exata, a quem pagar), e o pagamento só ocorre <b>após regular liquidação</b>. A banca inverte a ordem ou diz que a ordem de pagamento antecede a liquidação.", "Modalidades de empenho: <b>por estimativa</b> (montante indeterminável), <b>global</b> (despesas contratuais parceladas) e <b>ordinário</b>. A banca diz que o empenho global exige um empenho por parcela ou que a estimativa só vale em calamidade.", "Regime do exercício (art. 35): pertencem ao exercício <b>receitas arrecadadas</b> e <b>despesas legalmente empenhadas</b>. A banca diz que são as receitas lançadas e as despesas pagas (regime de caixa para tudo) ou as liquidadas.", "Restos a pagar: despesas <b>empenhadas e não pagas até 31/12</b>, <b>processadas</b> (liquidadas) ou <b>não processadas</b>. A banca diz que só se inscrevem as liquidadas ou que as não processadas não podem ser inscritas. Empenhos de crédito plurianual só viram restos a pagar no <b>último ano</b> de vigência.", "Despesas de exercícios anteriores (art. 37): pagas por <b>dotação específica</b>, discriminada por elementos, com <b>ordem cronológica</b> quando possível; incluem compromissos reconhecidos <b>após o encerramento</b> e restos a pagar com prescrição interrompida. A banca diz que são pagas por restos a pagar ou exigem crédito extraordinário.", "Últimos meses do mandato municipal (art. 59, §§ 1º a 4º): é vedado empenhar mais do que <b>um duodécimo</b> no último mês e assumir compromissos para depois do mandato; <b>calamidade pública</b> comprovada afasta a vedação; atos em desacordo são <b>nulos</b>. A banca troca por dois duodécimos, por último ano ou diz que são apenas anuláveis.", "Créditos adicionais: suplementares e especiais são <b>autorizados por lei e abertos por decreto</b>; os <b>extraordinários</b> (urgência e imprevisibilidade) são abertos <b>por decreto, com ciência imediata ao Legislativo</b>. Recursos: <b>superavit financeiro</b>, <b>excesso de arrecadação</b>, <b>anulação de dotações</b> e <b>operações de crédito</b>. A banca coloca o fundo de reserva de contingê
