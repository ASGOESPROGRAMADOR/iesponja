 deve ser usado para fazer a companhia realizar o seu <b>objeto</b> e cumprir sua <b>função social</b>, com deveres para com os demais acionistas, <b>os que nela trabalham e a comunidade</b> (parágrafo único). O controlador <b>responde pelos danos causados por atos com abuso de poder</b> (art. 117); são modalidades, por exemplo: orientar a companhia para <b>fim estranho ao objeto social ou lesivo ao interesse nacional</b>; promover <b>liquidação de companhia próspera, transformação, incorporação, fusão ou cisão</b> para obter <b>vantagem indevida</b>; promover alteração estatutária ou emissão de valores sem interesse da companhia; <b>eleger administrador ou fiscal que sabe inapto</b>; <b>contratar com a companhia em condições de favorecimento</b>; <b>aprovar contas irregulares</b> por favorecimento pessoal.", "<b>Administradores: deveres e responsabilidade (arts. 153 a 158).</b> O administrador deve empregar o <b>cuidado e a diligência que todo homem ativo e probo costuma empregar</b> nos seus negócios (art. 153: <b>dever de diligência</b>). Deve exercer as atribuições <b>nos fins e no interesse da companhia</b>, satisfeitas as exigências do <b>bem público e da função social</b> (art. 154); é <b>vedado</b> praticar ato de <b>liberalidade à custa da companhia</b>, tomar <b>empréstimo</b> de recursos da companhia sem autorização, e <b>receber vantagem pessoal</b> de terceiros sem autorização (art. 154, § 2º). <b>Dever de lealdade</b>: servir com lealdade e manter <b>reserva sobre negócios</b> (art. 155, início, que li só em parte). <b>Responsabilidade</b> (art. 158): <b>não responde pessoalmente</b> pelas obrigações contraídas em nome da sociedade e em virtude de <b>ato regular de gestão</b>; responde <b>civilmente</b> pelos prejuízos que causar quando proceder (I) <b>dentro de suas atribuições, com culpa ou dolo</b>, ou (II) <b>com violação da lei ou do estatuto</b>. O administrador <b>não é responsável por atos ilícitos de outros</b>, salvo conivência, negligência em descobri-los ou omissão em impedir (§ 1º), eximindo-se o <b>dissidente</b> que consigne a divergência em ata ou dê ciência por escrito.", "<b>Transformação, incorporação, fusão e cisão (Lei 6.404, arts. 220 a 234).</b> <b>Transformação</b> (art. 220): operação pela qual a sociedade passa, <b>independentemente de dissolução e liquidação</b>, de um tipo para outro; exige <b>consentimento unânime</b> dos sócios ou acionistas, <b>salvo previsão no estatuto ou contrato</b>, caso em que o dissidente tem direito de <b>retirada</b> (art. 221); <b>não prejudica os credores</b>, que mantêm as mesmas garantias (art. 222). <b>Incorporação</b> (art. 227): uma ou mais sociedades são <b>absorvidas por outra</b>, que lhes <b>sucede em todos os direitos e obrigações</b>; aprovado o laudo e a incorporação, <b>extingue-se a incorporada</b>. <b>Fusão</b> (art. 228): unem-se duas ou mais sociedades para formar <b>sociedade nova</b>, que lhes sucede; extinguem-se as originais; é vedado aos sócios de cada uma votar o laudo de avaliação do patrimônio da sociedade de que fazem parte (§ 2º). <b>Cisão</b> (art. 229): a companhia <b>transfere parcelas do seu patrimônio</b> para uma ou mais sociedades, constituídas para esse fim ou já existentes, <b>extinguindo-se</b> a cindida, se houver versão total, ou <b>dividindo-se o seu capital</b>, se parcial. <b>Responsabilidade na cisão</b> (art. 233): na cisão com extinção, as sociedades que absorverem parcelas <b>respondem solidariamente</b> pelas obrigações da extinta; a cindida que subsistir e as que absorverem parcelas respondem <b>solidariamente</b> pelas obrigações anteriores à cisão; na <b>cisão parcial</b>, o ato pode estipular que as receptoras <b>só respondem pelas obrigações transferidas</b>, sem solidariedade, mas <b>qualquer credor anterior pode se opor</b>, notificando em <b>90 dias</b> da publicação. As operações podem ocorrer entre <b>tipos iguais ou diferentes</b> (art. 223). A certidão do registro do comércio é título hábil para <b>averbar a sucessão</b> nos registros públicos (art. 234).", "<b>Grupos, coligadas, controladas e economia mista (arts. 235, 243 e 265).</b> <b>Controlada</b>: a sociedade em que a controladora, diretamente ou por outras controladas, é titular de direitos de sócio que lhe assegurem, <b>de modo permanente, preponderância nas deliberações</b> e o poder de <b>eleger a maioria dos administradores</b> (art. 243, § 2º). <b>Coligadas</b>: a redação antiga usava <b>10% ou mais do capital</b>, sem controle; a redação atual usa a <b>influência significativa</b> (§ 1º; a página mostra as duas redações). <b>Grupo de sociedades</b> (art. 265): a controladora e suas controladas podem constituir grupo por <b>convenção</b> pela qual se obriguem a combinar recursos ou esforços ou participar de atividades comuns; a controladora deve ser <b>brasileira</b> e exercer o controle de modo permanente (§ 1º). <b>Sociedade de economia mista</b>: as S.A. de economia mista sujeitam-se à Lei 6.404, <b>sem prejuízo de disposições especiais de lei federal</b> (art. 235); as companhias abertas de economia mista também se sujeitam às normas da <b>CVM</b> (§ 1º). <b>De memória (conferir)</b>: a CF, art. 173, § 1º, exige <b>estatuto jurídico próprio</b> para as estatais que exploram atividade econômica, a <b>Lei 13.303/2016</b> o instituiu, e a <b>empresa pública</b> pode ter <b>qualquer forma societária</b>, com capital 100% público; a <b>sociedade de economia mista</b> adota a forma de <b>S.A.</b>, com maioria das ações com direito a voto pertencente ao ente público. <b>Consórcio de empresas</b> (arts. 278 e 279 da Lei 6.404; <b>não li</b>): de memória, <b>não tem personalidade</b> e as consorciadas <b>respondem sem presunção de solidariedade</b>, regra que a Lei de Licitações modifica para o consórcio em licitações (conferir).", "<b>Resumo operacional para prova.</b> (1) <b>Sociedade empresária × simples</b> pelo <b>objeto</b>; S.A. é sempre empresária, cooperativa sempre simples. (2) <b>Personalidade</b>: surge com a <b>inscrição</b> dos atos constitutivos (art. 985). (3) <b>Sociedade em comum</b>: sócios respondem <b>solidária e ilimitadamente</b>, quem contratou <b>sem benefício de ordem</b>. (4) <b>Conta de participação</b>: só o <b>sócio ostensivo</b> se obriga perante terceiros; a inscrição <b>não dá</b> personalidade. (5) <b>Desconsideração</b> (CC, art. 50): <b>desvio de finalidade ou confusão patrimonial</b>; grupo econômico sozinho <b>não basta</b>; vale a <b>inversa</b> (§ 3º). (6) <b>Limitada</b>: responsabilidade <b>limitada ao valor das quotas</b>, mas <b>solidária pela integralização</b>; <b>serviços não integralizam</b> capital. (7) <b>S.A.</b>: pelo menos <b>2 subscritores</b>, <b>10% de entrada</b>. (8) <b>Controlador</b> responde por abuso; <b>administrador</b> responde por culpa/dolo ou violação da lei. (9) <b>Transformação</b>: sem dissolução e sem prejudicar credores; <b>incorporação</b> extingue a incorporada, <b>fusão</b> cria nova sociedade, <b>cisão</b> divide o patrimônio (solidariedade regra, exceção na parcial com oposição dos credores)."], "pega": ["Tipos: a banca diz que a sociedade <b>por ações</b> pode ser simples quando o objeto não é empresarial, ou que a <b>cooperativa</b> é sempre empresária. Pelo art. 982, parágrafo único, a S.A. é <b>sempre empresária</b> e a cooperativa <b>sempre simples</b>.", "Personalidade: a banca afirma que a sociedade em conta de participação <b>adquire personalidade</b> com a inscrição do contrato. O art. 993 diz que a inscrição <b>não confere personalidade</b>, e o contrato só vale entre os sócios.", "Sociedade em comum: a banca diz que os sócios respondem <b>subsidiariamente e limitadamente</b>, ou que o sócio que contratou pode invocar o <b>benefício de ordem</b>. Respondem <b>solidária e ilimitadamente</b>, e <b>excluído do benefício de ordem</b> aquele que contratou pela sociedade (art. 990).", "Prova da sociedade em comum: a banca afirma que <b>terceiros</b> só provam por escrito. Os <b>sócios</b> só provam por escrito; <b>terceiros</b> podem provar <b>de qualquer modo</b> (art. 987).", "Desconsideração: a banca diz que a <b>mera inadimplência</b> ou a <b>existência de grupo econômico</b> autoriza a desconsideração pelo art. 50. O CC exige <b>abuso</b>, por <b>desvio de finalidade ou confusão patrimonial</b>; o grupo sozinho não basta (§ 4º), e a expansão da atividade não é desvio (§ 5º). A teoria menor está em <b>leis especiais</b> (CDC, ambiental), segundo a minha memória.", "Sociedade simples: a banca afirma que os sócios <b>não respondem</b> pelas dívidas além do capital. Os sócios respondem pelo saldo, <b>proporcionalmente às perdas</b>, salvo solidariedade pactuada (art. 1.023), mas <b>só após</b> executados os bens sociais (art. 1.024).", "Limitada: a banca diz que o sócio <b>só responde pelas suas quotas</b>, sem solidariedade. Todos respondem <b>solidariamente pela integralização</b> do capital (art. 1.052) e, por <b>5 anos</b>, pela exata estimação de bens conferidos (art. 1.055, § 1º).", "Capital da limitada: a banca admite capital em <b>prestação de serviços</b> na limitada (como na sociedade simples). O art. 1.055, § 2º, <b>veda</b> contribuição que consista em prestação de serviços na limitada.", "Administração: a banca diz que o administrador não sócio da limitada é designado por <b>maioria simples</b> dos presentes. Exige-se <b>2/3 dos sócios</b> enquanto o capital não está integralizado e <b>mais da metade do capital</b> após a integralização (art. 1.061).", "S.A.: a banca afirma que a companhia se constitui com <b>um só subscritor</b> ou com <b>50%</b> de entrada. São necessárias <b>2 pessoas</b> e <b>10% do preço de emissão</b> das ações subscritas em dinheiro (art. 80); as exceções são as <b>subsidiárias integrais</b> (de memória).", "Administrador: a banca diz que o administrador responde <b>pessoalmente</b> pelas obrigações contraídas em nome da companhia. Não responde por <b>ato regular de gestão</b>; responde civilmente por <b>culpa ou dolo</b> ou por <b>violação da lei ou do estatuto</b> (art. 158).", "Cisão: a banca afirma que a sociedade receptora <b>nunca</b> responde pelas dívidas da cindida, ou que sempre responde <b>solidariamente</b>. A regra é a <b>solidariedade</b> (art. 233), mas na <b>cisão parcial</b> o ato pode limitar a responsabilidade às obrigações transferidas, <b>ressalvada a oposição do credor</b> em 90 dias."]}], "26": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Improbidade administrativa: processo, indisponibilidade, ANPC, sentença, sanções, prescrição (Lei 8.429/1992, arts. 13 a 23)", "key": "ADM", "conc": ["Edital: item 15 de Direito Administrativo (segunda parte: processo, acordo de não persecução civil e prescrição). Li <b>literalmente</b>, no navegador (Planalto, texto compilado), a <b>Lei 8.429/1992, arts. 13 a 23</b> (incluídos os arts. 17-A a 17-D, 18-A, 23-A, 23-B e 23-C), na <b>redação vigente dada pela Lei 14.230/2021</b>; resumi só o que vale hoje. <b>Não reli</b> nesta unidade os arts. 1º a 12 (atos, sujeitos e sanções, que estudamos na unidade anterior). Os <b>Temas 1.199 (irretroatividade e prescrição), as ADIs 7042/7043 (legitimidade ativa) e 7236</b> e as teses do STJ vêm <b>da minha memória</b> e precisam de conferência. Os decretos e a regulamentação local <b>não foram lidos</b>. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Declaração de bens (art. 13).</b> A posse e o exercício de agente público ficam condicionados à <b>apresentação de declaração de imposto de renda e proventos</b> (ou autorização de acesso eletrônico), atualizada anualmente e na saída do cargo. A recusa ou a declaração falsa expõem a pena de demissão, sem prejuízo de outras sanções. <b>Representação (art. 14):</b> qualquer pessoa pode representar à autoridade administrativa; o procedimento exige <b>identificação do representante</b> e indícios; a representação que não cumpre os requisitos é rejeitada. <b>Investigação (art. 22):</b> o MP pode instaurar <b>inquérito civil</b> (art. 22) e requisitar diligências, assegurada a <b>manifestação do investigado</b>.", "<b>Indisponibilidade de bens (art. 16).</b> Medida <b>cautelar</b> dentro da própria ação, que garante o <b>integral ressarcimento do dano ou a perda do acréscimo patrimonial ilícito</b>. A lei exige <b>urgência</b> e fundamentação; como regra, ouve-se o réu em <b>5 dias</b> (§ 3º), mas há decretação <b>sem oitiva prévia</b> quando a urgência o justificar (§ 4º). Alcança só o <b>ressarcimento</b> e o acréscimo ilícito, <b>não a multa civil</b> (§ 10º). Respeita a <b>ordem de preferência</b> (dinheiro, aplicações e bens, conforme o § 11) e <b>não incide</b> sobre quantia de até <b>40 salários mínimos</b> em poupança, conta ou aplicação (§ 13). O <b>bem de família é impenhorável</b> nesse regime, salvo se adquirido com produto de <b>enriquecimento ilícito do art. 9º</b> (§ 14). Cabe <b>agravo de instrumento</b> (§ 9º).", "<b>Legitimidade ativa e foro (art. 17).</b> O art. 17, caput, atribui a propositura da ação ao <b>Ministério Público</b>. A Lei 14.230 retirou a legitimação do ente lesado, e a <b>ADI 7042/7043</b> discutiu isso (de memória: o STF reconheceu a <b>legitimidade concorrente</b> da pessoa jurídica interessada; a conferir). A ação segue o <b>procedimento comum do CPC</b>, mas <b>não é ação civil pública</b> (art. 17-D: tem natureza <b>repressiva e sancionatória</b>). <b>Foro (§ 4º-A):</b> a ação é proposta perante o juízo do local do dano ou do domicílio do réu, <b>sem prerrogativa de foro</b> em razão do cargo (resultado de memória do STF).", "<b>Petição inicial e fases (art. 17, §§ 6º a 19).</b> A inicial <b>individualiza a conduta</b> de cada réu e a norma violada (§ 6º, I) e traz <b>elementos probatórios mínimos</b> (II). O juiz <b>rejeita</b> por inexistência de ato ímprobo, falta de provas mínimas ou ilegitimidade (§ 6º-B). O réu é citado e <b>contesta em 30 dias</b> (§ 7º). Da decisão sobre a inicial e a contestação cabe <b>agravo</b> (§ 9º-A). Após a contestação, o juiz tem até <b>90 dias</b> para tentativa de <b>solução consensual</b> (§ 10-A). Na decisão de recebimento, o juiz <b>fixa o tipo</b> (arts. 9º, 10 ou 11) e é <b>nulo</b> condenar por tipo <b>diverso</b> do apontado ou sem prova (§§ 10-C, 10-D e 10-F). Havendo <b>manifesta inexistência do ato</b>, julga-se improcedente (§ 11). A <b>pessoa jurídica lesada</b> é intimada para intervir (§ 14). O interrogatório segue o CPC (§ 18). Não se aplicam à ação (§ 19): a <b>presunção de veracidade pela revelia</b>; a <b>distribuição dinâmica do ônus da prova</b> contra o réu (CPC, art. 373, §§ 1º e 2º); o <b>ajuizamento de mais de uma ação</b> pelo mesmo fato; e o <b>reexame necessário</b>. A assessoria jurídica pode <b>defender o agente</b> no polo passivo (§ 20), e há <b>agravo</b> contra decisões interlocutórias (§ 21).", "<b>Acordo de não persecução civil (art. 17-B).</b> O <b>Ministério Público</b> pode celebrar o ANPC, desde que <b>do acordo resulte</b> o <b>integral ressarcimento do dano</b> e a <b>reversão da vantagem indevida</b> ao ente lesado. Exige <b>oitiva do ente federado lesado</b> e <b>aprovação, em até 60 dias, pelo órgão superior do MP</b>, e depois <b>homologação judicial</b> (§ 1º). Em caso de dano ao erário, a tomada de contas de <b>TCE tem 90 dias</b> para apurar o valor (§ 3º). Pode ser celebrado na fase de <b>investigação, ação ou execução</b> (§ 4º). Quem descumpre ou frustra o acordo fica <b>impedido de nova composição por 5 anos</b> (§ 7º).", "<b>Sentença e unificação de sanções (arts. 17-C, 18 e 18-A).</b> A sentença indica de modo <b>preciso</b> os atos e as razões de convencimento. <b>Ilegalidade sem dolo</b> não é improbidade (§ 1º). <b>Não há solidariedade</b> entre os réus (§ 2º) e <b>não há remessa necessária</b> (§ 3º). O art. 18 prevê o <b>ressarcimento</b> (parcelamento em até <b>48 parcelas</b>, § 4º). O art. 18-A permite <b>unificar sanções</b>: a <b>continuidade</b> leva à maior sanção <b>aumentada de 1/3</b>; <b>novos atos</b> somam-se; o limite é de <b>20 anos</b> para a suspensão dos direitos políticos e a proibição de contratar.", "<b>Execução e sanções (arts. 19 a 21).</b> A <b>denúncia falsa</b> de improbidade é crime com <b>detenção de 6 a 10 meses</b> e multa (art. 19). A <b>perda da função</b> e a <b>suspensão dos direitos políticos</b> só se efetivam com o <b>trânsito em julgado</b> (art. 20). O <b>afastamento cautelar</b> do agente pode durar até <b>90 dias</b>, prorrogável por <b>mais 90</b>. As sanções <b>independem</b> da aprovação das contas e do dano efetivo, <b>salvo</b> o ressarcimento e o art. 10 (art. 21). A sentença civil e a penal se comunicam nos termos dos §§ 3º e 4º (a <b>absolvição criminal por órgão colegiado</b> pode repercutir na ação), e o § 5º admite a <b>compensação</b> das sanções já aplicadas em outras esferas pelo mesmo fato.", "<b>Prescrição (art. 23).</b> Em <b>8 anos</b>, contados do <b>fato</b> ou, nas infrações permanentes, da <b>cessação da permanência</b>. O prazo é <b>suspenso por até 180 dias</b> pela instauração de inquérito civil ou procedimento administrativo (§ 1º). O inquérito se conclui em <b>365 dias</b>, prorrogável por <b>mais 365</b> (§ 2º), e a ação deve ser proposta em <b>30 dias</b> da conclusão (§ 3º). A prescrição se <b>interrompe</b> (§ 4º): (I) pelo ajuizamento; (II) pela publicação da sentença condenatória; (III) por acórdão do TJ ou TRF que confirma condenação ou reforma improcedência; (IV) por acórdão do STJ; (V) por acórdão do STF. Interrompida, <b>recomeça pela metade</b>, ou seja, <b>4 anos</b> (§ 5º); decorrido esse prazo entre os marcos, reconhece-se a <b>prescrição intercorrente</b> de ofício (§ 8º).", "<b>Disposições finais (arts. 23-A a 23-C).</b> Os órgãos de controle devem promover <b>capacitação</b> dos gestores (art. 23-A). Não há <b>adiantamento de custas</b> nem condenação em honorários ou despesas, <b>salvo comprovada má-fé</b> (art. 23-B). Os atos que causem dano a <b>partidos políticos</b> seguem a Lei 9.096/1995 (art. 23-C). <b>Jurisprudência (de memória, a conferir):</b> o STF fixou no <b>Tema 1.199</b> a exigência de <b>dolo</b> para o art. 10, a <b>irretroatividade</b> das normas mais benéficas aos processos com condenação transitada em julgado, a aplicação nos casos em curso apenas quanto à <b>culpa</b> e a <b>prescrição intercorrente</b> sem retroatividade."], "pega": ["Legitimidade e natureza: a banca diz que a ação de improbidade é <b>ação civil pública</b> comum. A lei diz que é ação <b>repressiva e sancionatória</b>, que <b>não é ação civil</b> (art. 17-D), e que a sentença <b>não admite remessa necessária</b> (art. 17-C, § 3º).", "Revelia e ônus: a banca diz que a falta de contestação gera <b>revelia e presunção de veracidade</b>, e que o juiz pode inverter o ônus da prova contra o réu. A lei diz que <b>não se aplicam</b> a presunção pela revelia nem a distribuição dinâmica do ônus (art. 17, § 19).", "Prazos: a banca diz que a contestação é em <b>15 dias</b> e que o juiz tenta a solução consensual em <b>30 dias</b>. A lei diz <b>30 dias</b> para contestar (§ 7º) e <b>90 dias</b> para a tentativa de solução consensual (§ 10-A).", "Indisponibilidade: a banca diz que a indisponibilidade garante também a <b>multa civil</b> e que atinge poupança de qualquer valor. A lei diz que garante só o <b>ressarcimento e o acréscimo ilícito</b> (§ 10) e protege até <b>40 salários mínimos</b> (§ 13).", "Bem de família: a banca diz que o bem de família é sempre <b>impenhorável</b> na improbidade. A lei diz que a regra cede quando o bem foi adquirido com <b>enriquecimento ilícito (art. 9º)</b> (§ 14).", "ANPC: a banca diz que o acordo dispensa o ressarcimento ou que depende só de assinatura do promotor. A lei diz que exige <b>integral ressarcimento e reversão da vantagem</b>, <b>oitiva do ente lesado</b>, <b>aprovação em 60 dias pelo órgão superior do MP</b> e <b>homologação judicial</b> (art. 17-B).", "Perda da função: a banca diz que a perda do cargo ocorre com a sentença de primeiro grau. A lei diz que só ocorre com o <b>trânsito em julgado</b> (art. 20); o afastamento cautelar é de até <b>90 dias</b>, prorrogável por 90.", "Prescrição: a banca diz que o prazo é de <b>5 anos</b> e recomeça por inteiro após a interrupção. A lei diz <b>8 anos</b>, e, interrompido o prazo, ele recomeça <b>pela metade (4 anos)</b>, com <b>prescrição intercorrente</b> (art. 23, §§ 5º e 8º).", "Denúncia falsa: a banca diz que é só infração administrativa. A lei diz que é <b>crime</b>, com detenção de <b>6 a 10 meses</b> (art. 19)."]}, {"materia": "DIREITO CIVIL", "titulo": "Locação de imóveis urbanos (Lei 8.245/1991) e direitos autorais (Lei 9.610/1998)", "key": "CIV", "conc": ["Edital: item de Direito Civil sobre <b>locações</b> e <b>direitos autorais</b>. Li <b>literalmente</b>, no navegador (Planalto, texto compilado): a <b>Lei 8.245/1991 inteira (arts. 1º a 78)</b> e a <b>Lei 9.610/1998 inteira (arts. 1º a 115)</b>. Na Lei 8.245 o texto compilado mistura redações antigas e novas; valem as das <b>Leis 12.112/2009 e 12.744/2012</b>. Na Lei 9.610, os arts. 68 a 110 trazem redações <b>sobrepostas</b> (a original, a da Lei 12.853/2013 e a da MP 907/2019, que perdeu eficácia, e a MP 1.068/2021, <b>rejeitada</b>); resumi a redação <b>vigente</b>. <b>Jurisprudência</b> (STJ e STF) e <b>doutrina</b> vêm <b>da minha memória</b> e precisam de conferência. <b>Não li</b> os regulamentos (decretos) nem a legislação do ECAD. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Locação: contrato, multa e alienação (arts. 4º e 8º).</b> O locador não pode reaver o imóvel durante o prazo ajustado; o locatário pode devolvê-lo pagando a <b>multa proporcional ao tempo que falta</b> (art. 4º). Na <b>alienação</b> do imóvel durante a locação, o adquirente pode denunciar o contrato em <b>90 dias</b> após o registro da venda, salvo se o contrato tiver <b>cláusula de vigência</b> e estiver <b>averbado na matrícula</b> (art. 8º). <b>Fiança (art. 12, § 2º):</b> o fiador pode se <b>exonerar</b> notificando o locador e continua responsável por <b>120 dias</b>; nos casos do art. 40 o <b>locatário</b> tem <b>30 dias</b> para apresentar nova garantia, sob pena de desfazimento da locação. <b>Cessão, sublocação e empréstimo (art. 13)</b> exigem <b>consentimento prévio e escrito</b> do locador; notificado, ele tem <b>30 dias</b> para manifestar oposição (§ 2º), e o silêncio nesse prazo <b>vale como aceitação</b>.", "<b>Deveres e garantias (arts. 22, 23, 35 a 42).</b> O <b>locador</b> entrega o imóvel em estado de servir ao uso, garante o uso pacífico e paga taxas extraordinárias de condomínio; o <b>locatário</b> paga aluguel e encargos, usa para o fim contratado e devolve o imóvel no estado em que recebeu. As <b>benfeitorias necessárias</b> são indenizáveis e permitem <b>retenção</b>; as <b>úteis</b>, só se <b>autorizadas</b> (art. 35); salvo cláusula, as benfeitorias se <b>incorporam</b> ao imóvel (art. 36). Em cada contrato admite-se <b>uma única garantia</b> (art. 37, parágrafo único: a <b>cumulação é nula</b>). A <b>caução em dinheiro</b> não passa de <b>3 meses</b> de aluguel (art. 38, § 2º). A garantia <b>se estende até a devolução do imóvel</b> (art. 39). A <b>revisão judicial</b> do aluguel só é possível após <b>3 anos</b> do contrato ou do último acordo (art. 19).", "<b>Direito de preferência (arts. 27 a 34).</b> O locatário tem preferência na compra, em igualdade de condições. O locador comunica o preço, as condições e o local para exame; o locatário tem <b>30 dias</b> para aceitar. <b>Preterido</b>, o locatário pode pleitear <b>perdas e danos</b> ou <b>haver para si o imóvel</b>, depositando o preço e as despesas, desde que o contrato esteja <b>averbado na matrícula, no mínimo, 30 dias antes</b> da alienação e que requeira em <b>6 meses do registro</b> da venda (art. 33). Não há preferência em perda da propriedade por decisão judicial, desapropriação, permuta, doação, integralização de capital, cisão, fusão e incorporação (art. 32).", "<b>Locação residencial (arts. 46 e 47).</b> Contrato <b>escrito por 30 meses ou mais</b> termina no prazo, <b>sem notificação</b>; se o locatário continua no imóvel por <b>30 dias</b> sem oposição, a locação <b>prorroga por prazo indeterminado</b> (art. 46, § 1º). Contratos <b>verbais ou escritos com menos de 30 meses</b> prorrogam-se automaticamente, e o locador só retoma nas hipóteses do <b>art. 47</b>, como: extinção do contrato de trabalho relacionado à ocupação, uso próprio ou de familiares, obras determinadas pelo Poder Público ou aprovadas e, no inciso V, <b>vigência ininterrupta por 5 anos</b>. <b>Locação por temporada (art. 48):</b> até <b>90 dias</b>, para lazer, obras ou outro fim temporário.", "<b>Locação não residencial e ação renovatória (arts. 51 a 57 e 71 a 75).</b> O locatário tem direito à renovação, por igual prazo, se o contrato for <b>escrito e por prazo determinado</b>, o prazo mínimo for <b>5 anos</b> (somados contratos ininterruptos) e ele explorar o <b>mesmo ramo por 3 anos</b>. A ação se propõe no <b>interregno de 1 ano a 6 meses antes</b> do fim do prazo; fora dele há <b>decadência</b>. O locador pode se opor nas hipóteses do art. 52 (obras determinadas pelo Poder Público, uso próprio ou transferência de fundo de comércio existente há mais de um ano); a <b>proposta melhor de terceiro</b> é defesa do art. 72. <b>Contrato atípico built-to-suit (art. 54-A):</b> prevalecem as condições livremente pactuadas; a <b>renúncia à revisional</b> é válida e, em caso de denúncia antecipada, a <b>multa não excede a soma dos aluguéis até o termo</b>.", "<b>Ações locatícias (arts. 58 a 75).</b> Nelas as <b>férias forenses não suspendem os prazos</b>; o foro é o do <b>local do imóvel</b> ou o de eleição; o valor da causa é de <b>12 meses de aluguel</b>; o recurso tem <b>só efeito devolutivo</b> (art. 58). <b>Liminar de despejo em 15 dias</b> (art. 59, § 1º, incisos I a IX), mediante <b>caução de 3 meses</b> de aluguel. <b>Purga da mora</b> no despejo por falta de pagamento: em <b>15 dias</b> da citação, <b>uma vez em 24 meses</b> (art. 62). Nos demais casos o prazo de desocupação voluntária é de <b>30 dias</b> (art. 63; § 1º: <b>15 dias</b>). Na <b>revisional</b> (rito sumário), o aluguel provisório é devido desde a citação e fica em <b>até 80% do pedido</b>, se o autor é o locador, ou em <b>no mínimo 80% do aluguel vigente</b>, se o autor é o locatário (art. 68); o novo valor retroage à citação (art. 69). A lei traz ainda a <b>contravenção do art. 43</b> e o <b>crime do art. 44</b>.", "<b>Direitos autorais: objeto e titularidade (arts. 7º, 8º, 11 e 18).</b> Protegem-se as <b>criações do espírito</b>, expressas por qualquer meio, tangível ou intangível (art. 7º). <b>Não se protegem</b> as ideias, procedimentos, esquemas, planos e regras de jogos, os formulários em branco, os textos oficiais, as informações de uso comum, os nomes e títulos isolados e o aproveitamento industrial ou comercial das ideias (art. 8º). <b>Autor</b> é a <b>pessoa física</b> criadora; a lei estende a proteção à pessoa jurídica nos casos previstos (art. 11). A <b>proteção independe de registro</b>, que é <b>facultativo</b> (art. 18).", "<b>Direitos morais e patrimoniais (arts. 24 a 29, 38 a 52).</b> Os <b>direitos morais</b> (paternidade, nome, integridade, modificação, retirada de circulação, acesso a exemplar raro) são <b>inalienáveis e irrenunciáveis</b> (art. 27). O <b>patrimonial</b> depende de <b>autorização prévia e expressa</b> do autor para qualquer utilização (art. 29), que se interpreta <b>restritivamente</b>. <b>Direito de sequência (art. 38):</b> <b>5%</b> sobre o aumento de preço em cada revenda de obra de arte ou manuscrito. <b>Prazo (art. 41):</b> <b>70 anos</b> contados de <b>1º de janeiro do ano seguinte ao da morte</b>; obras anônimas e pseudônimas, <b>70 anos</b> da divulgação (art. 43); audiovisuais e fotográficas, <b>70 anos</b> da divulgação (art. 44). <b>Limitações (art. 46):</b> cópia de pequenos trechos para uso privado, citação, uso em atos judiciais e administrativos e <b>paródias</b> (art. 47, quando não forem reprodução da obra nem lhe causem descrédito); as obras situadas <b>permanentemente em logradouros públicos</b> podem ser representadas <b>livremente</b> por pinturas, desenhos, fotografias e processos audiovisuais (art. 48). <b>Cessão (art. 49):</b> contrato <b>escrito</b>; sem estipulação de prazo, <b>5 anos</b>; vale no <b>país onde foi celebrado</b>; só para as <b>modalidades existentes</b>; a cessão de obras futuras é de até <b>5 anos</b> (art. 51).", "<b>Edição, execução pública e conexos (arts. 53 a 100-B).</b> No <b>contrato de edição</b>, no silêncio, vale <b>uma edição de 3.000 exemplares</b> (art. 56); o editor presta contas <b>mensais</b> quando o autor ganha por venda (art. 61) e a obra deve ser editada em <b>2 anos</b> (art. 62). A <b>execução pública</b> de música e fonogramas em <b>locais de frequência coletiva</b> (bares, restaurantes, hotéis, lojas, órgãos públicos) exige <b>autorização prévia</b> e comprovação do pagamento ao <b>ECAD</b> (art. 68, § 4º). Os <b>direitos conexos</b> (intérpretes, produtores fonográficos, radiodifusão) duram <b>70 anos</b> contados de <b>1º de janeiro do ano seguinte</b> à fixação, transmissão ou execução (art. 96). A <b>gestão coletiva</b> exige <b>habilitação</b> em órgão federal (arts. 98 e 98-A); dirigentes têm mandato de <b>3 anos</b> e <b>uma recondução</b> (art. 98, § 13), e respondem <b>solidariamente, com bens particulares</b> (art. 100-A).", "<b>Sanções civis (arts. 101 a 110).</b> O titular pode pedir <b>apreensão</b> dos exemplares e <b>suspensão</b> da divulgação (art. 102). Quem edita sem autorização perde os exemplares apreendidos e paga o preço dos vendidos; se desconhecido o número, paga o valor de <b>3.000 exemplares</b> além dos apreendidos (art. 103). Respondem <b>solidariamente com o contrafator</b> quem vende, expõe, adquire ou deposita a obra fraudulenta (art. 104); o <b>importador</b> e o <b>distribuidor</b> respondem como contrafatores (art. 104). A <b>execução pública irregular</b> gera <b>multa de 20 vezes</b> o valor devido (art. 109). Os proprietários, gerentes e arrendatários do local respondem <b>solidariamente</b> com os organizadores do espetáculo (art. 110). A omissão do nome do autor gera <b>danos morais</b> e obrigação de divulgar a identidade (art. 108). O art. 111 (prescrição) foi <b>vetado</b>; a prescrição segue o Código Civil (de memória: <b>3 anos</b> para a reparação civil, conforme o STJ, a conferir)."], "pega": ["Fiança: a banca diz que o fiador exonerado deixa de responder imediatamente. A lei diz que ele responde pelos efeitos da fiança por <b>120 dias</b> após a notificação (art. 12, § 2º).", "Garantias: a banca diz que o locador pode exigir <b>fiador e caução</b> ao mesmo tempo. A lei diz que só cabe <b>uma modalidade de garantia</b>, sendo <b>nula</b> a cumulação (art. 37, parágrafo único), e a caução em dinheiro vai a no máximo <b>3 meses</b> (art. 38, § 2º).", "Alienação: a banca diz que a venda do imóvel rompe sempre a locação. A lei diz que o adquirente só denuncia em <b>90 dias</b> se o contrato <b>não tiver cláusula de vigência averbada</b> (art. 8º).", "Preferência: a banca diz que o preterido sempre pode haver o imóvel. A lei diz que isso exige <b>contrato averbado 30 dias antes</b> e requerimento em <b>6 meses do registro</b>; sem isso, só <b>perdas e danos</b> (art. 33).", "Renovatória: a banca diz que o prazo para a ação renovatória é de qualquer época do contrato. A lei diz que o interregno é de <b>1 ano a 6 meses antes</b> do fim; fora dele, <b>decadência</b> (art. 51, § 5º).", "Purga da mora: a banca diz que pode ser feita sempre, em 30 dias. A lei diz <b>15 dias</b> da citação e <b>uma vez a cada 24 meses</b> (art. 62).", "Retomada: a banca diz que o locador retoma o imóvel residencial a qualquer tempo por contrato de 30 meses. A lei diz que o contrato <b>escrito por 30 meses ou mais</b> termina no prazo sem notificação, e a retomada em contratos <b>menores</b> exige as hipóteses do <b>art. 47</b> (inciso V: <b>5 anos</b>).", "Direitos autorais: a banca diz que a proteção depende de <b>registro</b> e que os direitos morais podem ser <b>cedidos</b>. A lei diz que o registro é <b>facultativo</b> (art. 18) e que os direitos morais são <b>inalienáveis e irrenunciáveis</b> (art. 27).", "Prazo: a banca diz que a proteção é de <b>vida do autor mais 50 anos</b>. A lei diz <b>70 anos</b>, contados de <b>1º de janeiro do ano seguinte</b> à morte (art. 41); conexos: <b>70 anos</b> (art. 96).", "Execução pública: a banca diz que restaurante e hotel não precisam de autorização para música ambiente. A lei diz que são <b>locais de frequência coletiva</b> (art. 68, § 3º) e exige <b>autorização prévia</b> e pagamento; a infração gera <b>multa de 20 vezes</b> o valor (art. 109)."]}, {"materia": "DIREITO URBANÍSTICO E AMBIENTAL", "titulo": "Legislação urbanística de Curitiba: Plano Diretor (14.771/2015), Zoneamento (15.511/2019), potencial construtivo adicional (16.361/2024), prêmios e incentivos (16.448/2024), Patrimônio Cultural (14.794/2016) e Código de Posturas (11.095/2004)", "key": "URB", "conc": ["Edital: item de Direito Urbanístico e Ambiental sobre a <b>legislação urbanística de Curitiba</b>. Li <b>literalmente</b>, no navegador, nos PDFs e páginas oficiais da Prefeitura: o <b>Plano Diretor (Lei 14.771/2015), arts. 1º a 194, inteiro</b>; o <b>Zoneamento (Lei 15.511/2019), arts. 1º a 239</b>, mas no <b>texto original</b> (as <b>alterações posteriores</b> só conheço pela Lei 16.448/2024, art. 73, parágrafo único, e <b>não verifiquei</b> as demais); a <b>Lei 15.626/2020</b>; a <b>Lei 16.361/2024 inteira</b>; a <b>Lei 16.448/2024 inteira</b>; a <b>Lei 14.794/2016 (Patrimônio Cultural), arts. 1º a 64</b>, <b>sem ler item a item o Anexo I</b> (lista de imóveis, que apenas varri); e o <b>Código de Posturas (Lei 11.095/2004), arts. 1º a 360 e anexo</b>, na <b>versão compilada de 2014</b> da Prefeitura. <b>Alterações posteriores a 2014 do Código de Posturas não foram verificadas.</b> Não li <b>decretos regulamentadores</b> (por exemplo, o Decreto 1327/2024) nem os <b>anexos e quadros de parâmetros</b> numéricos do Zoneamento. Jurisprudência e doutrina vêm <b>da minha memória</b>. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Plano Diretor: natureza e estrutura (Lei 14.771/2015, arts. 1º a 16).</b> É a <b>revisão</b> do plano de 1966 (Lei 2.828), adequada ao Estatuto da Cidade pela Lei 11.266/2004. Abrange <b>todo o território municipal, totalmente urbano</b> (art. 3º), e é o <b>instrumento básico, global e estratégico</b> da política de desenvolvimento (art. 4º), compatível com os planos regionais, a RMC e o ZEE; o PPA, a LDO e a LOA o observam. Integram o plano a legislação urbanística e os <b>planos setoriais</b> (mobilidade, habitação e regularização fundiária, desenvolvimento econômico, social, defesa social e civil, ambiental e biodiversidade, saneamento). O <b>Sistema de Planejamento</b> é coordenado pelo <b>IPPUC</b> (art. 7º), que apresenta o <b>relatório anual de monitoramento</b> (arts. 10 a 12). A <b>função social da propriedade</b> é cumprida segundo os critérios do plano (art. 16). Valem <b>parâmetros da lei vigente na análise</b>, sem direito adquirido nem indenização por mudança (art. 21).", "<b>Macrozoneamento (arts. 17 a 23).</b> O território se organiza em <b>oito categorias</b>: eixos estruturantes, eixos de adensamento, predominância residencial de média densidade, de baixa densidade, ocupação mista, destinação específica, ocupação controlada e áreas de proteção ambiental (as <b>APAs do Passaúna e do Iguaçu</b>). Densidade: <b>baixa até 80 hab/ha</b>, <b>média 81 a 200</b>, <b>alta 201 a 400</b> (art. 20, § 2º). Os <b>Polos de Desenvolvimento</b> (art. 22) e os <b>microcentros de adensamento</b> (art. 23, com compra de potencial ao <b>Fundo Curitiba Mais Humana</b> e EIV) reforçam o modelo. A <b>fachada ativa</b> (arts. 29 a 31) dá <b>+1 pavimento não computável</b> quando 50% do térreo é não residencial, <b>sem cumular</b> com o uso misto. A <b>regularização simplificada</b> (arts. 33 a 35) alcança imóveis ocupados até <b>31/12/2012</b>, com <b>regulamento em 60 dias</b>, protocolo em <b>1 ano</b> e recursos ao Fundo. Pelo art. 37, parágrafo único, o gabarito máximo fora das áreas de influência é de <b>8 pavimentos</b>, salvo exceções.", "<b>Mobilidade, ambiente, patrimônio e paisagem (arts. 39 a 78).</b> O Plano <b>proíbe pedágio urbano e rodízio de placas</b> (art. 40, parágrafo único); trata de estacionamentos próximos a terminais (<b>até 300 m</b>, art. 55) e do <b>EstaR</b> com pagamento fracionado (arts. 59 e 60). Em matéria ambiental, consagra a <b>proibição do retrocesso ambiental</b> (art. 61), a <b>bacia hidrográfica</b> como unidade de planejamento (art. 62), o <b>IPTU verde</b> (art. 65, só para imóveis ligados à rede de esgoto) e o <b>pagamento por serviços ambientais</b> (art. 66). O patrimônio cultural é regulado por lei específica (arts. 68 e 69). A <b>fruição pública</b> de lotes privados exige área mínima de <b>50 m²</b>, com limite de <b>20% do lote</b> (arts. 70 a 76). <b>Habitação (arts. 79 a 91):</b> a HIS prioriza renda até <b>3 salários mínimos</b>; os <b>SEHIS</b> são de Regularização Fundiária, de Vazios e de Produção; a <b>cota de HIS</b> é obrigatória em empreendimentos de grande porte (produção local ou próxima, doação de imóvel ou depósito ao Fundo Municipal); o SEHIS pode ser criado por <b>decreto</b> a qualquer momento (art. 90). O <b>Fundo Curitiba Mais Humana</b> (arts. 93 a 98) favorece áreas de <b>IDHM abaixo de 0,71</b>, depois de 0,71 a 0,75; <b>veda o custeio</b>.", "<b>Uso misto e edificações mistas (arts. 123 e 124).</b> No <b>uso misto em edificação unifamiliar</b>, o uso não residencial pode ocupar até <b>50% da área total averbada</b>, com acessibilidade, comércio ou serviço <b>sem impacto ambiental ou de vizinhança</b> e fora de polo gerador de tráfego (art. 123). Na <b>edificação mista</b>, exigem-se <b>mínimo de 30% residencial</b> e <b>30% não residencial</b>; os benefícios são: dispensa de acesso independente de veículos, garagem compartilhada, nenhuma obrigatoriedade de vagas residenciais e <b>redução de 25%</b> do valor do potencial construtivo; o limite é de <b>2.500 m²</b> (art. 124, § 4º).", "<b>Instrumentos da política urbana no Plano (arts. 131 a 180).</b> O rol: <b>PEUC, preempção, outorga onerosa, transferência do direito de construir, operações urbanas consorciadas, planos de desenvolvimento regional, reparcelamento e EIV</b> (art. 131). A <b>concessão urbanística</b> depende de lei específica (§ 1º) e a <b>CDRU coletiva</b> se admite em HIS (§ 2º). <b>PEUC (arts. 132 a 141):</b> a sequência é <b>PEUC, IPTU progressivo e desapropriação com títulos</b>. <b>Não se aplica</b> a unidades de conservação, imóveis com <b>bosque nativo em 50% ou mais</b> e APP comprometida em <b>50% ou mais</b> (art. 134). <b>Não edificado</b> é o lote ou gleba com <b>2.000 m² ou mais</b> (ou qualquer área na zona central, no setor histórico ou em SEHIS de Vazios, ou construção paralisada ou em ruínas); <b>subutilizado</b> é o imóvel com coeficiente de aproveitamento de até <b>15% do básico</b> ou com unidades autônomas com mais de 500 m² computáveis e <b>80% desocupadas por 3 anos</b>; <b>não utilizado</b> é o de mais de 500 m² com <b>75% de desocupação por 3 anos</b> (art. 136). A notificação é <b>averbada</b>; os prazos são <b>1 ano</b> para protocolar o projeto, <b>2 anos</b> para iniciar as obras e <b>5 anos</b> para a conclusão (art. 138). O <b>IPTU progressivo</b> dura <b>5 anos</b>, com alíquota <b>dobrada a cada ano</b>, teto de <b>15%</b> e <b>sem isenção ou anistia</b> (art. 139). Depois, a desapropriação é paga em <b>títulos</b> (art. 140).", "<b>Preempção, outorga, TDC, OUC, PDR, RDU e EIV (arts. 142 a 180).</b> <b>Preempção</b>: vigência de até <b>5 anos</b>, renovável após <b>1 ano</b> (arts. 142 a 145). <b>Outorga onerosa</b> (arts. 146 a 151): permite edificar acima do coeficiente básico mediante contrapartida; os acréscimos máximos de coeficiente variam por zona (<b>até 2</b> nos eixos estruturantes, de adensamento, na ocupação mista e nas residenciais média e alta; <b>até 1</b> em baixa densidade, ocupação controlada e destinação específica, art. 149); as vias hierarquizadas dão <b>+1</b>; <b>sem isenção</b> para novas edificações, salvo HIS (art. 150, parágrafo único). <b>TDC</b> (arts. 152 a 156): para imóveis com limitação ambiental ou cultural, doação ao Município etc. <b>OUC</b> (arts. 157 a 165): coordenada pelo IPPUC; o <b>CEPAC</b> só se converte em direito de construir <b>na área da operação</b> (art. 163). <b>PDR</b> (arts. 166 a 168) é elaborado pelo IPPUC e aprovado por ato do Executivo. <b>Reparcelamento (RDU)</b> exige <b>lei específica</b> (arts. 169 a 175). <b>EIV</b> (arts. 176 a 180): completo, simplificado ou RAP; <b>não dispensa o EIA</b>.", "<b>Gestão democrática e disposições finais (arts. 181 a 194).</b> Compõem a gestão democrática o <b>CONCITIBA</b>, as audiências públicas, a conferência e a iniciativa popular (arts. 181 a 189). A <b>alteração do Plano</b> exige participação popular e oitiva do CONCITIBA (art. 188). O <b>licenciamento prévio</b> é exigido para qualquer edificação, reforma, demolição ou obra (art. 193). A lei vigora desde a publicação, em <b>17/12/2015</b> (art. 194).", "<b>Zoneamento: estrutura (Lei 15.511/2019, arts. 1º a 110).</b> A lei divide o território em <b>eixos, zonas e setores especiais</b> e é de <b>observância obrigatória</b> para alvarás, planos, obras, urbanização e parcelamento (arts. 1º e 5º). <b>Eixos Estruturantes</b> (EE, ENC, EMF, EAC, EMLV): sistema trinário, com o <b>Plano Massa</b> na via central, que garante a continuidade da testada comercial (art. 11) e que o Conselho Municipal de Urbanismo pode dispensar (art. 12); recuo mínimo de <b>10 m</b> nas vias externas, cedido sem ônus (art. 13); <b>vedado</b> usar a frente do térreo para garagem (art. 14). Nos eixos de adensamento (EACF, EACB, Conectores), a <b>fruição pública</b> é obrigatória em trechos como Costa Barros/Mercer Júnior e Wenceslau Braz. <b>Zonas</b> (art. 34): ZC (central; proíbe balanço, admite marquise), <b>ZR</b> (ZR1 a ZR4, ZROC e ZROI), <b>ZUM</b> (inclusive <b>Vale do Pinhão</b>, ZUMVP, com coeficiente básico <b>1 por tipo de uso até 3</b>) e <b>ZDE</b> (ZE, ZM, ZPS, ZH, ZCC, ZCSF, ZCUM, ZS, ZI). Em ZROC-1 (Campo de Santana), o loteamento reserva <b>10% a equipamentos comunitários</b>, <b>10% a lazer</b> e <b>15% a HIS</b> (art. 48); na ZROI, <b>40%</b> da área vai ao Município (art. 51). Na ZH, o imóvel tombado pode chegar a <b>coeficiente 4</b> com a <b>transferência total do potencial</b> (art. 73, parágrafo único, hoje com a redação da Lei 16.448/2024).", "<b>Zoneamento: setores especiais, usos e parâmetros (arts. 94 a 239).</b> <b>Setores especiais</b> (art. 94): SEPE, SEPP, SEP, SEDE, SEAHM, SEVB, SEAV, SESA e SEHIS; novos setores nascem de <b>ato do Executivo</b>, por proposta do IPPUC (art. 95). O <b>SEVB</b> (vias) trata faixa de <b>80 m</b> ou metade da quadra (o que ocorrer primeiro); nas <b>vias prioritárias</b>, abrange todo o lote. <b>Uso do solo</b> (arts. 161 a 189): é admitida mais de uma edificação por lote; a lei <b>veda</b> atividade não contemplada na zona (art. 165), embora o CMU possa autorizar (art. 166); o <b>alvará de localização é sempre precário</b> e pode ser <b>cassado</b> por incômodo, periculosidade ou nocividade, inclusive por <b>manifestação da vizinhança</b> (art. 167). Tipos habitacionais: <b>em série</b> (4 a 20 unifamiliares), <b>conjunto</b> (mais de 20) e <b>coletiva</b> (mais de 2 unidades autônomas verticais); conjuntos só em lotes de até <b>20.000 m²</b> (art. 169). <b>Porte</b> (art. 185): <b>pequeno até 400 m²</b>, <b>médio de 400 a 2.000 m²</b>, <b>grande acima de 2.000 m²</b>. Usos classificam-se em <b>permitidos, permissíveis e omissos</b> (art. 188). <b>Densidade</b>: ZR1 <b>1 UH/300 m²</b>; ZROC-1 e 2 <b>1 UH/2.000 m²</b>; demais ZR <b>1 UH/120 m²</b> (arts. 209 a 212). O <b>recuo frontal</b> admite balanço de até <b>1,20 m</b> (art. 202, § 2º). Em <b>infrações</b>: cassação do alvará, embargo, multa e demolição (art. 237). Validade de projetos: <b>1 ano</b> sem início de obras (art. 234); vigência <b>180 dias</b> após a publicação; revoga as Leis 7.529/1990 e 9.800/2000 (art. 239).", "<b>Suspensão do Zoneamento (Lei 15.626/2020).</b> Suspendeu por <b>120 dias</b> a aplicação da Lei 15.511, <b>sem revogá-la nem alterar</b> a legislação vigente (§ 1º); o Executivo podia regulamentar a suspensão e a retomada (§ 2º); vigência na publicação, com <b>efeitos retroativos a 07/04/2020</b>, inclusive para contagem do prazo. Segundo a página da Secretaria de Urbanismo, o zoneamento está em vigor <b>desde 05/08/2020</b> (informação lida na página, não em lei).", "<b>Potencial construtivo adicional (Lei 16.361/2024).</b> Os acréscimos aos parâmetros básicos da Lei 15.511 dependem de três instrumentos: <b>outorga onerosa (OODC)</b>, <b>transferência do direito de construir (TDC)</b> e <b>cotas de potencial construtivo (CPC)</b> (arts. 1º e 2º). Os recursos da <b>OODC</b> se distribuem assim (art. 6º): <b>70% ao FMHIS</b>, <b>5% ao FUNRECAL</b> (patrimônio natural), <b>5% ao FUNPAC</b> (patrimônio cultural), <b>10% ao Município</b> (equipamentos) e <b>até 10%</b> a critério do Executivo. Fórmula (art. 9º): <b>Vp = (A / Ca) × Vu × Fc</b>, com <b>Fc de 0,15</b> (pavimentos), <b>0,75</b> (coeficiente) e <b>1,0</b> (uso e porte não habitacional); com mais de uma situação, <b>prevalece o maior valor</b>. O <b>IPU</b> (art. 10) é de <b>0,3</b>, por <b>2 anos</b> (prorrogáveis), para habitação na ZC e na ZR4 lindeiras a certos eixos. O art. 11 divide <b>50% por OODC e 50% por TDC</b>; o art. 12 <b>isenta</b> a OODC de HIS e habitação coletiva da COHAB. A <b>TDC</b> (arts. 14 a 26) se faz em <b>duas etapas</b> (certidão de concessão e certidão de transferência) e se averba; <b>Pc = Ptr × Vur/Vuc × Cc/Cr × Fc</b>, com <b>Fc 0,55</b> (edificação do patrimônio cultural), <b>0,75</b> (RPPNM e demais) e <b>0,15</b> (pavimentos); o potencial se <b>restabelece a cada 15 anos</b> se o bem estiver conservado e transferido o total (art. 26). A <b>CPC</b> (arts. 27 a 32): <b>1 cota = 1 m²</b>. As <b>certidões</b> de OODC e CPC valem <b>4 anos</b>, prorrogáveis por <b>até 4 anos</b>, com taxa de <b>1%</b> ao FMHIS (art. 35); os recursos só custeiam <b>despesas de capital</b> (art. 33). Revoga a <b>Lei 15.661/2020</b> (art. 40).", "<b>Prêmios e incentivos construtivos (Lei 16.448/2024).</b> <b>Prêmio</b> compensa o cumprimento de regras urbanísticas especiais; <b>incentivo construtivo</b> são parâmetros diferenciados condicionados a obrigações do empreendedor; <b>condições especiais</b> são parâmetros diferenciados em face de restrições (art. 2º). O <b>Plano Massa</b> (arts. 5º a 11) funciona na <b>Via Central</b>: o <b>embasamento comercial</b> premia com <b>mínimo de 50% do terreno no térreo</b> (até 100%), galeria coberta e testada contínua (art. 7º); a <b>torre exclusivamente comercial</b> recebe <b>1,5 vez a área do terreno</b> (art. 8º); nas <b>Outras Vias</b>, até <b>1×</b> a área, não computada (art. 10); nas <b>Vias Externas</b>, <b>+1×</b> se a torre for exclusivamente habitacional (art. 11). <b>Fruição pública</b> (arts. 12 a 14): <b>obrigatória</b> em Marechal Floriano, Affonso Camargo, EACB e Conector Leste 3 (Wenceslau Braz); o prêmio vai até o <b>dobro</b> da área de fruição; área mínima de <b>50 m²</b>, até <b>20% do lote</b>. <b>Passagens e praças internas</b> (art. 15): diâmetro mínimo de <b>8 m</b>; incentivo de <b>1×</b> a área. <b>Fachada ativa</b> (arts. 16 a 19): <b>+1 pavimento não oneroso</b> habitacional. <b>Galerias comerciais na ZC</b> (arts. 20 a 22): largura mínima de <b>4 m</b> e pé-direito de <b>2,80 m</b>; incentivo de <b>2×</b> a área da galeria. No <b>patrimônio cultural</b> (arts. 24 a 29): na transferência <b>total</b>, a área da edificação preservada se acresce ao potencial; na <b>parcial</b>, a área preservada <b>não computa</b> no coeficiente nem na taxa de ocupação; o art. 30 admite <b>coeficiente até 4</b> para imóveis tombados e listados no Anexo I da Lei 14.794 (UIP), com transferência total. Revoga a <b>Lei 15.824/2021</b> (art. 37).", "<b>Patrimônio Cultural (Lei 14.794/2016).</b> Abrange bens <b>materiais e imateriais</b>, públicos ou privados (art. 1º); a gestão é da <b>Fundação Cultural de Curitiba (FCC)</b> e, no edificado, da SMU e do IPPUC (art. 3º). Os instrumentos <b>plenos</b> são o <b>tombamento</b> e o <b>registro</b>; os <b>auxiliares</b>, o <b>inventário</b> e a <b>vigilância</b> (art. 4º), esta de caráter <b>subsidiário</b> (arts. 17 a 19). O <b>tombamento</b> declara singularidade e excepcionalidade e <b>dispensa inventário prévio</b> (art. 8º, § 3º); o bem tombado ou em processo <b>não pode ser demolido, destruído, mutilado ou movido</b>. O proprietário conserva às suas custas (art. 10); sem recursos, requer ao <b>CMPC</b> com plano de trabalho de até <b>24 meses</b> (art. 11), exceto <b>obras urgentes</b> (art. 12). Os procedimentos exigem contraditório com prazo <b>não inferior a 30 dias</b> (arts. 20 e 21). <b>Multas</b> (calculadas sobre o valor do bem): destruir ou demolir, <b>50% a 80%</b> (art. 30); reformar sem autorização, <b>20% a 70%</b> (art. 31); deixar de conservar, <b>30% a 80%</b> (art. 32); entorno, <b>10% a 50%</b> (art. 33); plano protelatório, <b>20%</b> (art. 34); impugnação em <b>30 dias</b> (art. 38). A <b>reincidência</b> não prevalece após <b>5 anos</b> (art. 26); a multa pode ser aumentada até o <b>dobro</b> (art. 27); admite-se <b>redução de até 2/3</b> por caso fortuito, força maior ou culpa de terceiro, com restauração em até <b>24 meses</b> (art. 28). <b>Incentivos</b> (arts. 40 a 47): redução de IPTU, incentivo construtivo averbado, potencial restabelecido a cada <b>15 anos</b>; a área do bem protegido <b>não computa</b> no coeficiente nem na TO (art. 47). O <b>CMPC</b> é consultivo e deliberativo (presidente: o da FCC; vice: o do IPPUC; <b>14 titulares</b>, sendo 7 do Executivo; mandato de <b>2 anos</b>, com uma recondução) e revê os benefícios a cada <b>4 anos</b>. O <b>FUNPAC</b> recebe multas, doações e condenações em ACP. A infração <b>suspende imediatamente</b> os benefícios, e o bem pode ser <b>desapropriado</b> a qualquer momento, abatendo-se as multas da indenização (arts. 60 a 64).", "<b>Código de Posturas: alvarás e obras (Lei 11.095/2004, arts. 1º a 100).</b> Regula a aprovação de projetos, o licenciamento de obras e atividades e a manutenção das obras. O profissional precisa ser <b>habilitado no CREA e licenciado pelo Município</b>, e o Município <b>não assume responsabilidade técnica</b> (art. 3º). O <b>alvará de licença</b> é obrigatório para construção, ampliação, reforma, demolição, redes, antenas, tapume, caçamba, publicidade e atividades (art. 9º); a aprovação é cancelada se a obra não começa ou é interrompida e passam <b>180 dias</b> do prazo (art. 24, § 1º). O <b>CVCO</b> (certificado de vistoria de conclusão) vem após a conclusão; se não expedido no prazo, o interessado <b>pode ocupar</b> (art. 30, § 3º). O <b>alvará de localização e funcionamento</b> antecede a atividade (arts. 32 a 44); o temporário vale até <b>30 dias</b> (art. 35); o <b>ambulante</b> tem licença <b>individual e intransferível</b> (arts. 40 a 44). Na <b>vistoria administrativa</b>, o edital antecede em <b>3 dias úteis</b>; obras <b>paralisadas há mais de 30 dias</b> ou em ruínas exigem vedação e vigilância (arts. 58 a 70). A <b>limpeza do passeio</b> cabe ao proprietário; em eventos, termina em até <b>8 horas</b> após (arts. 90 a 98).", "<b>Código de Posturas: instalações, penalidades e recursos (arts. 101 a 360).</b> Nas instalações: <b>inspeção anual de segurança</b> (art. 130); elevadores obrigatórios se o piso mais alto estiver a mais de <b>9,50 m</b> (art. 134); <b>marquise</b> com balanço máximo de <b>2,00 m</b> (art. 167); inflamáveis a <b>4 m</b> das divisas e <b>10 m</b> do alinhamento (art. 185). <b>Penalidades</b> (art. 193): cassação, interdição, embargo, demolição, suspensão, apreensão e multa, <b>sem hierarquia</b> e cumuláveis. O <b>auto de infração</b> exige <b>verificação pessoal</b>, e a mera denúncia não basta (art. 210, § 2º); o prazo de pagamento da multa é de <b>10 dias</b>, sob pena de dívida ativa; há <b>redução de até 90%</b> por circunstância atenuante (art. 211). As multas por obra sem licença vão de <b>R$ 200 a R$ 500</b> por faixa de área; para imóvel de valor cultural, de <b>R$ 4.000 a R$ 32.000</b>; a demolição de imóvel de valor cultural sem alvará chega a <b>R$ 100.000</b>; <b>embargo descumprido</b>: <b>triplo</b> da soma das multas (art. 344); <b>reincidência</b>: <b>dobro</b>, em <b>24 meses</b> (art. 345). <b>Recursos</b> (arts. 347 a 349): <b>defesa prévia em 10 dias</b> ao diretor do órgão e <b>recurso hierárquico em 10 dias</b> ao Secretário, última instância. Os valores acima são os da versão compilada de 2014 e podem ter sido corrigidos por decreto (art. 346)."], "pega": ["Natureza do Plano Diretor: a banca diz que o Plano Diretor de Curitiba abrange apenas a <b>área urbana</b> definida por perímetro. A lei diz que abrange <b>todo o território municipal</b>, <b>completamente urbano</b> (art. 3º).", "Direito adquirido: a banca diz que a alteração do Zoneamento gera <b>direito a indenização</b> por parâmetros anteriores. A lei diz que valem os parâmetros da lei vigente <b>à época da análise</b>, sem direito adquirido ou indenização (PD, art. 21).", "PEUC e IPTU progressivo: a banca diz que o IPTU progressivo pode ter alíquota livre, com isenção para pequenos proprietários. A lei diz que a alíquota <b>dobra</b> a cada ano, com teto de <b>15%</b>, por <b>5 anos</b>, e que <b>é vedada isenção ou anistia</b> (PD, art. 139).", "Imóvel não edificado: a banca diz que é todo lote vazio, de qualquer tamanho. A lei diz que é o lote ou gleba com <b>2.000 m² ou mais</b>, ou qualquer área na zona central, no setor histórico ou em SEHIS de Vazios (PD, art. 136).", "Pedágio urbano: a banca diz que o Plano Diretor admite o <b>rodízio de placas</b> em situações críticas. A lei <b>proíbe</b> o pedágio urbano e o rodízio de placas (PD, art. 40, parágrafo único).", "Alvará de localização: a banca diz que o alvará de localização é <b>definitivo</b> e só se cassa por decisão judicial. A lei diz que é <b>sempre a título precário</b> e pode ser cassado por incômodo, periculosidade ou nocividade, até com base na <b>manifestação da vizinhança</b> (Zoneamento, art. 167).", "Porte: a banca diz que porte grande é acima de <b>1.000 m²</b>. A lei diz <b>pequeno até 400 m², médio de 400 a 2.000 m², grande acima de 2.000 m²</b> (Zoneamento, art. 185).", "Suspensão do zoneamento: a banca diz que a Lei 15.626/2020 <b>revogou</b> o Zoneamento. A lei diz que <b>suspendeu por 120 dias</b>, sem revogar nem alterar a legislação vigente, com efeitos retroativos a <b>07/04/2020</b> (art. 1º, § 1º).", "Distribuição da outorga: a banca diz que a outorga onerosa vai toda para o caixa geral do Município. A lei diz <b>70% FMHIS, 5% FUNRECAL, 5% FUNPAC, 10% Município e até 10% a critério do Executivo</b> (Lei 16.361/2024, art. 6º).", "Validade das certidões: a banca diz que a certidão de OODC ou CPC vale <b>indefinidamente</b>. A lei diz <b>4 anos</b>, prorrogáveis por <b>até 4 anos adicionais</b>, com taxa de 1% e sem devolução do valor pago (Lei 16.361/2024, art. 35).", "Tombamento: a banca diz que o tombamento exige <b>inventário prévio</b> e que o bem inventariado pode sofrer intervenção livre. A lei diz que o tombamento <b>dispensa inventário</b> (art. 8º, § 3º) e que o bem inventariado <b>não pode sofrer intervenção sem autorização prévia</b> (art. 7º, Lei 14.794).", "Reincidência no patrimônio: a banca diz que a reincidência vale por <b>10 anos</b>. A lei diz que <b>não prevalece após 5 anos</b> (art. 26, Lei 14.794); a multa por destruir ou demolir é de <b>50% a 80%</b> do valor do bem (art. 30).", "Posturas: a banca diz que a multa por <b>embargo descumprido</b> é de uma vez a soma das multas e que a reincidência não tem agravante. A lei diz <b>triplo</b> (art. 344) e <b>dobro</b> na reincidência dentro de 24 meses (art. 345); defesa prévia e recurso têm <b>10 dias</b> cada.", "Alvará em loteamento: a banca diz que se concede alvará em qualquer lote de loteamento não aprovado. A lei diz que <b>não se concede</b> alvará em lotes de loteamento não aprovado (Posturas, art. 10, § 4º), salvo COHAB-CT e regularização fundiária a critério do Município (§ 5º)."]}, {"materia": "DIREITO EMPRESARIAL", "titulo": "Defesa da concorrência: Lei 12.529/2011 (Sistema Brasileiro de Defesa da Concorrência, CADE, infrações, penas, procedimentos, TCC, leniência e atos de concentração)", "key": "EMP", "conc": ["Edital: item de Direito Empresarial sobre a <b>ordem econômica e a defesa da concorrência</b>. Li <b>literalmente</b>, no navegador (Planalto), a <b>Lei 12.529/2011 inteira (arts. 1º a 128)</b>. Uma ressalva: o <b>início do art. 9º</b> (lista de competências do Tribunal) <b>não foi relido</b> com o cuidado das demais partes. Os <b>valores em reais</b> e os critérios de faturamento resumidos aqui são os do <b>texto da lei</b>; as <b>portarias interministeriais</b> que os atualizam (por exemplo, para as notificações do art. 88) <b>não foram lidas</b>, e o <b>regimento interno do CADE</b> também não. A jurisprudência do STJ e do STF e a doutrina vêm <b>da minha memória</b> e precisam de conferência. Esta unidade não traz questões novas do banco; o treino fica no app.", "<b>Sistema e órgãos (arts. 1º a 20).</b> A lei estrutura o <b>Sistema Brasileiro de Defesa da Concorrência (SBDC)</b>: o <b>CADE</b> (autarquia federal vinculada ao Ministério da Justiça) e a <b>Secretaria de Acompanhamento Econômico (Seae)</b>. O CADE tem o <b>Tribunal Administrativo</b>, a <b>Superintendência-Geral (SG)</b> e o <b>Departamento de Estudos Econômicos (DEE)</b>. O <b>Tribunal</b> tem <b>1 Presidente e 6 Conselheiros</b>, com mais de 30 anos, notório saber jurídico ou econômico e reputação ilibada, nomeados pelo Presidente da República <b>após aprovação do Senado</b>, com mandato de <b>4 anos, sem recondução</b>. O Presidente tem <b>voto de qualidade</b> e os processos são distribuídos por <b>sorteio</b> (art. 10). A <b>SG</b> tem <b>1 Superintendente e 2 Adjuntos</b>, também com mais de 30 anos, mandato de <b>2 anos</b>, com uma recondução (art. 12). A <b>Procuradoria Federal</b> junto ao CADE tem Procurador-Chefe com mais de 30 anos, mandato de <b>2 anos</b> e uma recondução (arts. 15 e 16). O <b>MPF</b> oficia nos processos (art. 20). As <b>taxas processuais</b> são de <b>R$ 85.000</b> (análise de atos do art. 88) e <b>R$ 15.000</b> (consultas) (art. 23). As multas revertem ao <b>Fundo de Defesa de Direitos Difusos</b> (art. 28, § 3º).", "<b>Aplicação e responsabilidade (arts. 31 a 35).</b> A lei se aplica a <b>pessoas físicas ou jurídicas</b>, de direito público ou privado, mesmo sob <b>monopólio legal</b> (art. 31). Respondem <b>solidariamente</b> a empresa e seus dirigentes ou administradores (art. 32) e as empresas do <b>mesmo grupo econômico</b> (art. 33). A <b>desconsideração da personalidade jurídica</b> é possível por abuso de direito, excesso de poder, infração à lei ou falência, estado de insolvência, encerramento ou inatividade provocados por má administração (art. 34).", "<b>Infração à ordem econômica (art. 36).</b> Constituem infração os atos que tenham por objeto ou possam produzir: limitar ou prejudicar a <b>livre concorrência</b>; <b>dominar mercado relevante</b>; <b>aumentar arbitrariamente lucros</b>; ou <b>exercer abusivamente posição dominante</b>. A infração é <b>objetiva</b>: configura-se <b>independentemente de culpa</b>, ainda que os efeitos não sejam alcançados. <b>Posição dominante</b> presume-se quando a empresa controla <b>20% ou mais</b> do mercado relevante (§ 2º, parâmetro ajustável pelo CADE para setores específicos). O § 3º traz um <b>rol exemplificativo</b> (cartel: acordo sobre preços, quantidades, divisão de mercados e licitações; conduta uniforme ou concertada; preços predatórios; venda casada; recusa de venda; discriminação; exclusividade; imposição de preços de revenda).", "<b>Penas (arts. 37 a 45).</b> A <b>empresa</b> paga multa de <b>0,1% a 20% do faturamento bruto</b> do ramo de atividade no ano anterior à instauração do processo, <b>nunca inferior à vantagem auferida</b>, quando for possível estimá-la. As demais pessoas físicas ou jurídicas sem faturamento pagam de <b>R$ 50.000 a R$ 2 bilhões</b>. O <b>administrador</b> responsável paga de <b>1% a 20%</b> da multa da empresa, por <b>culpa ou dolo</b>. Na <b>reincidência</b>, a multa é aplicada em <b>dobro</b>. <b>Penas acessórias</b> (art. 38): publicação do extrato da decisão; <b>proibição de contratar com instituições financeiras oficiais e de participar de licitação</b> por <b>no mínimo 5 anos</b>; inscrição no cadastro de defesa do consumidor; <b>licença compulsória</b> de patentes; <b>cisão</b> ou transferência de controle; proibição de exercer o comércio por até 5 anos. Há ainda multas processuais: <b>multa diária de R$ 5.000</b> (até 50 vezes, art. 39); <b>recusa de informações</b>: <b>R$ 5.000 por dia</b> (art. 40); <b>falta injustificada</b>: <b>R$ 500 a R$ 15.000</b> (art. 41); <b>obstrução à inspeção</b>: <b>R$ 20.000 a R$ 400.000</b> (art. 42); <b>informação falsa ou enganosa</b>: <b>R$ 5.000 a R$ 5 milhões</b> (art. 43); <b>quebra de sigilo</b>: <b>R$ 1.000 a R$ 20.000</b> (art. 44). A dosimetria segue critérios do art. 45 (gravidade, boa-fé, vantagem, consumação, efeitos, situação econômica e reincidência).", "<b>Prescrição e reparação (arts. 46 a 47-A).</b> A pretensão <b>punitiva</b> prescreve em <b>5 anos</b>, contados da data da prática do ilícito ou, nas infrações permanentes ou continuadas, do dia em que cessou; <b>interrompe-se por qualquer ato</b> de apuração, e a <b>prescrição intercorrente</b> é de <b>3 anos</b> (art. 46, § 3º). A <b>reparação de danos (art. 46-A)</b> prescreve em <b>5 anos</b>, contados da <b>ciência inequívoca do ilícito</b>, que ocorre com a <b>publicação do julgamento final do CADE</b>. A <b>ação de indenização</b> é <b>independente</b> do processo administrativo (art. 47) e, nos <b>cartéis</b>, a indenização é em <b>dobro</b> (§ 1º); quem celebrou <b>leniência ou TCC</b> responde só pelos <b>próprios danos</b>; o <b>sobrepreço não se presume repassado</b> (§ 4º). O art. 47-A admite a <b>tutela da evidência</b> com base nas conclusões do CADE.", "<b>Procedimentos e processo administrativo (arts. 48 a 84).</b> A lei prevê <b>seis tipos</b> de procedimentos. O <b>procedimento preparatório</b> (30 dias) e o <b>inquérito administrativo</b> (de natureza <b>inquisitorial</b>) apuram os fatos; o inquérito dura <b>180 dias</b>, prorrogáveis por <b>até 60</b> (art. 66). Após a instauração do <b>processo administrativo</b>, o representado apresenta <b>defesa em 30 dias</b> (art. 70), com até <b>3 testemunhas</b> por fato; a <b>revelia</b> gera confissão sobre a matéria de fato, mas o revel pode intervir no estado em que o processo se encontra (art. 71). O Plenário pode adotar <b>medida preventiva</b> (art. 84), e do despacho cabe <b>recurso ao Plenário em 5 dias</b>, sem efeito suspensivo. A decisão é publicada em até <b>5 dias úteis</b> e constitui <b>título executivo extrajudicial</b> (art. 93).", "<b>TCC e leniência (arts. 85 a 87).</b> O <b>termo de compromisso de cessação (TCC)</b> é cabível a critério de <b>conveniência e oportunidade</b>; é <b>público</b>, só pode ser proposto <b>uma vez</b> e <b>não suspende</b> o processo (que fica suspenso apenas enquanto cumprido o termo); no <b>cartel</b>, a contribuição pecuniária não é inferior ao <b>mínimo do art. 37</b>; é <b>título executivo extrajudicial</b>. O <b>acordo de leniência</b> (art. 86) concede <b>extinção da ação punitiva</b> ou <b>redução de 1 a 2/3</b> da pena. Exige: ser o <b>primeiro</b> a se qualificar; <b>cessar</b> o envolvimento; a SG <b>não dispor de provas suficientes</b> para condenar; <b>confissão</b> e <b>cooperação</b>. O descumprimento gera <b>impedimento por 3 anos</b>. O art. 87 estende efeitos aos <b>crimes</b> (suspensão do prazo prescricional, e extinção da punibilidade com o cumprimento).", "<b>Atos de concentração (arts. 88 a 91).</b> Devem ser <b>previamente submetidos</b> ao CADE os atos em que (I) um grupo envolvido tenha faturamento bruto no Brasil, no ano anterior, de <b>R$ 400 milhões ou mais</b> e (II) outro grupo, <b>R$ 30 milhões ou mais</b>. Os critérios são <b>cumulativos</b> e podem ser alterados por <b>portaria interministerial</b>. O <b>controle é prévio</b> e o CADE decide em até <b>240 dias</b>, prorrogáveis por <b>60 dias</b> (a pedido das partes) ou por <b>90 dias</b> (decisão do Tribunal). A <b>consumação antes da aprovação</b> é nula e gera multa de <b>R$ 60 mil a R$ 60 milhões</b>, além de abertura de processo (gun jumping, art. 88, § 3º). São <b>vedados</b> os atos que eliminem a concorrência em parte substancial do mercado ou criem ou reforcem posição dominante, <b>ressalvadas as eficiências</b>, desde que repassada parte relevante aos consumidores (§§ 5º e 6º). O CADE pode, em até <b>1 ano</b> da consumação, requisitar a submissão de atos <b>fora dos critérios</b> (§ 7º). O art. 90 define a concentração (fusão, aquisição de controle ou partes, incorporação, contrato associativo, consórcio ou <b>joint venture</b>, exceto licitações). O Tribunal pode <b>aprovar</b>, <b>rejeitar</b> ou aprovar <b>com restrições</b> (venda de ativos, cisão, licenciamento etc., art. 61, § 2º). Da aprovação pela SG cabe <b>recurso de terceiros em 15 dias</b> e <b>avocação</b> por Conselheiro (art. 65). A <b>revisão</b> da aprovação (art. 91) gera multa de <b>R$ 60 mil a R$ 6 milhões</b>.", "<b>Execução e disposições finais (arts. 93 a 128).</b> A decisão do Plenário é <b>título executivo extrajudicial</b>; a execução segue a <b>Lei 6.830/1980</b>, na <b>Justiça Federal do DF</b> ou da <b>sede ou domicílio do executado</b>, à escolha do CADE (art. 97); os <b>embargos</b> só suspendem a execução se o juízo estiver <b>garantido</b> (art. 98). Em casos graves cabe <b>intervenção judicial</b> na empresa, por até <b>180 dias</b> (arts. 102 a 111; o prazo máximo é de <b>180 dias</b>, com nomeação de interventor). Aplicam-se subsidiariamente o CPC, a Lei 7.347/1985, o CDC e a Lei 9.784/1999 (art. 115). O CADE é <b>intimado como assistente</b> nas ações sobre a matéria (art. 118). <b>Dumping e subsídios</b> ficam fora da lei (art. 119). A lei foi assinada em <b>30/11/2011</b> e entrou em vigor <b>180 dias</b> após a publicação (art. 128); revogou a <b>Lei 8.884/1994</b> (em parte)."], "pega": ["Natureza da infração: a banca diz que a infração à ordem econômica exige <b>culpa ou dolo</b> da empresa. A lei diz que é <b>objetiva</b>, <b>independe de culpa</b> e não exige que os efeitos sejam alcançados (art. 36).", "Posição dominante: a banca diz que se presume com <b>51%</b> do mercado. A lei diz que se presume com <b>20%</b> do mercado relevante, parâmetro que o CADE pode alterar para setores específicos (art. 36, § 2º).", "Multa: a banca diz que a multa da empresa é de <b>1% a 30%</b> do faturamento total. A lei diz <b>0,1% a 20%</b> do faturamento bruto do <b>ramo de atividade</b> no ano anterior à instauração, nunca inferior à vantagem auferida (art. 37, I); o administrador paga <b>1% a 20% da multa da empresa</b>; a reincidência <b>dobra</b>.", "Notificação: a banca diz que basta <b>um</b> grupo atingir o faturamento previsto. A lei exige <b>cumulativamente</b> R$ 400 milhões para um grupo e R$ 30 milhões para outro (art. 88, I e II), e o controle é <b>prévio</b>, com <b>nulidade e multa</b> se consumado antes (§ 3º).", "Prazo de análise: a banca diz que o CADE decide em <b>120 dias</b>. A lei diz <b>240 dias</b>, prorrogáveis por <b>60 dias</b> (partes) ou <b>90 dias</b> (Tribunal) (art. 88, §§ 2º e 9º).", "Mandatos: a banca diz que os Conselheiros têm mandato de <b>2 anos com recondução</b>. A lei diz <b>4 anos, sem recondução</b> (Tribunal), e <b>2 anos com uma recondução</b> para o Superintendente-Geral e o Procurador-Chefe (arts. 6º, 12 e 15).", "Leniência: a banca diz que qualquer cooperador tem extinção da pena. A lei diz que o benefício exige ser o <b>primeiro</b> a se qualificar e a SG <b>não ter provas suficientes</b>, e a pena é <b>extinta</b> ou <b>reduzida de 1 a 2/3</b> (art. 86); o descumprimento gera <b>3 anos</b> de impedimento.", "TCC: a banca diz que o TCC suspende o processo desde a proposta e pode ser proposto várias vezes. A lei diz que é cabível a critério de <b>conveniência e oportunidade</b>, é proposto <b>uma só vez</b> e é <b>título executivo extrajudicial</b> (art. 85).", "Prescrição: a banca diz que a pretensão punitiva do CADE prescreve em <b>10 anos</b> e a reparação, em <b>3 anos</b>. A lei diz <b>5 anos</b> (punitiva), com <b>intercorrente de 3 anos</b>, e <b>5 anos</b> para a reparação, a partir da <b>ciência inequívoca</b> (arts. 46 e 46-A).", "Indenização: a banca diz que o cartel gera indenização <b>simples</b> e que o sobrepreço é sempre presumido repassado. A lei diz que o cartel gera indenização em <b>dobro</b> (art. 47, § 1º) e que o <b>repasse do sobrepreço não se presume</b> (§ 4º)."]}]};
const PAL={ADM:['#fce29a','#fff3c9','#e8b923','Direito Administrativo'],CON:['#d2e7c1','#e9f4e0','#6aa84f','Direito Constitucional'],CIV:['#e2cdee','#f4ebf9','#9b6bb5','Direito Civil'],TRI:['#fbd6ac','#ffebd2','#e08a2e','Direito Tributário'],URB:['#bfe6df','#e3f4f1','#2a9d8f','Direito Urbanístico e Ambiental'],EMP:['#d3dde2','#eef2f4','#607d8b','Direito Empresarial'],PCV:['#c8dff3','#e3eef9','#4a8fcf','Processo Civil']};
const DATA={'25':'17/11/2026','26':'17/11/2026'};
const m=document.getElementById('m'),back=document.getElementById('back'),crumb=document.getElementById('crumb'),pg=document.getElementById('pg');
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function setTop(b,c,p){back.style.display=b?'':'none';if(b)back.href=b;crumb.textContent=c;pg.textContent=p||''}
function home(){
 setTop(null,'iEsponja','');m.innerHTML='';
 const h=el('div','hero','<h1>iEsponja</h1><p>Resumos coloridos de estudo, na íntegra: conceito, explicação e pegadinhas das bancas. Escolha o PDF.</p>');m.appendChild(h);
 Object.keys(D).sort().forEach(k=>{
  const a=el('a','btn big','<span class="n">Procurador de Curitiba</span><b>PDF '+k+'</b><small>'+D[k].map(x=>PAL[x.key][3]).join(' · ')+'</small>');
  a.href='#/'+k;a.style.setProperty('--c','var(--white)');a.style.setProperty('--s','var(--red)');m.appendChild(a);
 });
}
function pdf(k){
 setTop('#/','PDF '+k,'');m.innerHTML='';
 m.appendChild(el('div','hero','<h1>PDF '+k+'</h1><p>Estudo de '+DATA[k]+' · Procurador de Curitiba · conceito e explicação · pegadinhas das bancas</p>'));
 D[k].forEach(t=>{const p=PAL[t.key];
  const a=el('a','btn','<span class="n"></span><b></b><small></small>');
  a.querySelector('.n').textContent='Toque para abrir';a.querySelector('b').textContent=p[3];a.querySelector('small').textContent=t.titulo;
  a.href='#/'+k+'/'+t.key;a.style.setProperty('--c',p[1]);a.style.setProperty('--s',p[2]);m.appendChild(a);});
}
function topic(k,key){
 const L=D[k],i=L.findIndex(x=>x.key===key);if(i<0)return home();const t=L[i],p=PAL[key];
 setTop('#/'+k,'PDF '+k,p[3]);m.innerHTML='';
 const b=el('div','band','<span class="n"></span><h2></h2>');b.style.setProperty('--c',p[0]);
 b.querySelector('.n').textContent=t.materia;b.querySelector('h2').textContent=t.titulo;m.appendChild(b);
 m.appendChild(el('div','bar','CONCEITO E EXPLICAÇÃO'));
 t.conc.forEach((c,j)=>{const d=el('div','card',c);d.style.setProperty('--c',j%2?p[0]:p[1]);d.style.setProperty('--s',p[2]);m.appendChild(d)});
 const r=el('div','red');r.appendChild(el('div','bar red','PEGADINHAS DAS BANCAS'));
 t.pega.forEach((c,j)=>{const d=el('div','card',c);d.style.setProperty('--c',j%2?'#f8d9d4':'#fdeceb');d.style.setProperty('--s','var(--red)');r.appendChild(d)});m.appendChild(r);
 const n=el('div','nav');
 const pr=el('a',i>0?'':'off','‹ Anterior'),ix=el('a','alt','PDF '+k),nx=el('a',i<L.length-1?'':'off','Próxima ›');
 pr.href=i>0?'#/'+k+'/'+L[i-1].key:'#';ix.href='#/'+k;nx.href=i<L.length-1?'#/'+k+'/'+L[i+1].key:'#';
 n.append(pr,ix,nx);m.appendChild(n);
}
function route(){const s=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 if(s[0]&&D[s[0]]){if(s[1])topic(s[0],s[1]);else pdf(s[0])}else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
