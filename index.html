stituição <b>prescreve em 2 anos</b> (art. 169). Nos tributos que comportam transferência do encargo (<b>indiretos</b>), a restituição só é feita a quem <b>provar ter assumido o encargo</b> ou estar autorizado por quem o assumiu (art. 166).", "Repetição, consectários e novidades da LC 236/2026: a restituição do tributo leva, na mesma proporção, juros de mora e penalidades pecuniárias (art. 167). Os <b>juros</b> não capitalizáveis fluem do <b>trânsito em julgado</b> (art. 167, parágrafo único; Súmula 188 do STJ), e a <b>correção</b> incide desde o pagamento indevido (Súmula 162 do STJ). A LC 236/2026 incluiu o <b>art. 165-A</b>, pelo qual os indébitos são atualizados pelos <b>mesmos índices de atualização dos créditos tributários</b> do respectivo ente, e o <b>art. 168, §§ 2º e 3º</b>, pelo qual o prazo de 5 anos vale também para a <b>habilitação</b> do indébito perante a Administração, contado da certificação do trânsito em julgado. O indébito pode ser recebido por precatório ou por compensação (Súmula 461 do STJ).", "Mandado de segurança tributário (Lei 12.016/2009): protege direito líquido e certo contra ato de autoridade fiscal, de forma <b>preventiva</b> (justo receio) ou <b>repressiva</b>. O prazo é de <b>120 dias</b> da ciência do ato (art. 23). Não cabe contra lei em tese (Súmula 266 do STF), mas cabe para declarar o direito à <b>compensação</b> (Súmula 213 do STJ), e não para <b>convalidar</b> a compensação feita pelo contribuinte (Súmula 460 do STJ). Não substitui ação de cobrança (Súmula 269 do STF), e os efeitos patrimoniais de período anterior à impetração devem ser reclamados administrativamente ou em ação própria (Súmula 271 do STF). A liminar pode exigir caução, fiança ou depósito (art. 7º, III) e suspende a exigibilidade (CTN, art. 151, IV). Concedida a segurança, há <b>duplo grau obrigatório</b> (art. 14, § 1º), e não cabem <b>honorários</b> (art. 25; Súmulas 512 do STF e 105 do STJ). A controvérsia sobre matéria de direito não impede o mandado (Súmula 625 do STF).", "A ADI 4296 e o mandado de segurança (STF, 9/6/2021): o Plenário declarou <b>inconstitucionais</b> o art. 7º, § 2º (vedação de liminar para compensação de créditos tributários, entrega de mercadorias do exterior, reclassificação ou equiparação de servidores e concessão de aumento ou extensão de vantagens) e o art. 22, § 2º (oitiva prévia do representante da pessoa jurídica de direito público para a liminar no MS coletivo). Foram mantidos o art. 1º, § 2º (atos de gestão comercial), o art. 7º, III (caução, fiança ou depósito), o art. 23 (120 dias) e o art. 25 (sem honorários). Com isso, a vedação legal de liminar em compensação, que sustentava a Súmula 212 do STJ, ficou sem base.", "Consignação em pagamento (CTN, art. 164; CPC, arts. 539 e seguintes): o sujeito passivo pode consignar judicialmente o crédito tributário nos casos de (I) <b>recusa de recebimento</b>, ou subordinação do recebimento ao pagamento de outro tributo ou penalidade ou ao cumprimento de obrigação acessória; (II) subordinação do recebimento a <b>exigências administrativas sem fundamento legal</b>; (III) <b>exigência, por mais de uma pessoa jurídica de direito público, de tributo idêntico sobre um mesmo fato gerador</b>. A consignação só pode versar sobre o crédito que o consignante <b>se propõe pagar</b> (§ 1º). Julgada procedente, o pagamento se reputa efetuado e a importância é <b>convertida em renda</b>; julgada improcedente, no todo ou em parte, cobra-se o crédito com <b>juros de mora</b>, sem prejuízo das penalidades cabíveis (§ 2º).", "Cautelar fiscal, cabimento (Lei 8.397/1992, arts. 1º a 3º): pode ser instaurada <b>após a constituição do crédito</b>, inclusive no curso da execução, contra o sujeito passivo de crédito tributário ou não tributário. As hipóteses do art. 2º incluem: devedor sem domicílio certo que tenta ausentar-se ou alienar bens; ausência para elidir o pagamento; insolvência com alienação de bens ou dívidas extraordinárias; notificado que não paga no prazo, <b>salvo se suspensa a exigibilidade</b>; colocação de bens em nome de terceiros; débitos que somados ultrapassem <b>30% do patrimônio conhecido</b>; alienação sem a comunicação ao Fisco, quando exigível; inscrição declarada inapta; e outros atos que dificultem a satisfação do crédito. Na colocação de bens em nome de terceiros (art. 2º, V, “b”) e na alienação sem comunicação (art. 2º, VII), <b>não se exige</b> a prévia constituição do crédito (art. 1º, parágrafo único). São essenciais a <b>prova literal da constituição do crédito</b> e a <b>prova documental</b> de uma das hipóteses (art. 3º).", "Cautelar fiscal, procedimento e efeitos (arts. 4º a 15): é requerida ao <b>juiz da execução</b> (ou ao relator, se a execução estiver no tribunal) (art. 5º). O juiz concede a liminar <b>sem justificação prévia e sem caução</b> (art. 7º), cabendo agravo de instrumento. O requerido contesta em <b>15 dias</b>, e a falta de contestação gera presunção de veracidade dos fatos (arts. 8º e 9º). A decretação produz a <b>indisponibilidade imediata dos bens</b> até o limite da obrigação (art. 4º). Na pessoa jurídica, recai somente sobre o <b>ativo permanente</b>, podendo se estender aos bens do acionista controlador e de quem tenha poderes para fazer a empresa cumprir suas obrigações fiscais, ao tempo do fato gerador (lançamento de ofício) ou do inadimplemento (demais casos) (§ 1º). A medida pode ser <b>substituída por garantia</b> (art. 10). Se concedida em procedimento preparatório, a execução deve ser proposta em <b>60 dias</b> da irrecorribilidade da exigência na esfera administrativa (art. 11). A eficácia <b>cessa</b> se a execução não for proposta nesse prazo, se a medida não for executada em 30 dias, se a execução for extinta ou se houver quitação (art. 13), e é vedado repetir o pedido pelo mesmo fundamento. Os autos são apensados aos da execução (art. 14).", "Cautelar fiscal e art. 185-A do CTN: não se confundem. A indisponibilidade do art. 185-A ocorre <b>na execução fiscal</b>, quando o devedor, <b>devidamente citado</b>, não paga nem apresenta bens à penhora no prazo legal e não são encontrados bens penhoráveis. O STJ (Tema 714) exige citação, ausência de pagamento ou de garantia e <b>esgotamento das diligências</b> para localizar bens."], "pega": ["Depósito: na anulatória, o depósito prévio do art. 38 da LEF <b>não é condição de admissibilidade</b> (SV 28), e só o depósito <b>integral e em dinheiro</b> suspende a exigibilidade (Súmula 112 do STJ). A banca exige o depósito prévio ou aceita o depósito parcial.", "Anulatória e execução: ajuizar a anulatória <b>não suspende</b> a execução por si só; é preciso depósito integral ou tutela provisória (CTN, art. 151). As ações são conexas e se reúnem, salvo se uma já foi julgada (Súmula 235 do STJ). A banca diz que a anulatória suspende a execução.", "Esfera administrativa: a ação judicial com o mesmo objeto implica <b>renúncia ao poder de recorrer</b> na esfera administrativa e desistência do recurso (LEF, art. 38, parágrafo único).", "Declaratória: nas relações de trato sucessivo, a decisão do STF em controle concentrado ou em repercussão geral <b>interrompe automaticamente</b> a coisa julgada (Tema 881), respeitadas a irretroatividade e as anterioridades. A banca exige ação rescisória ou fala em efeito retroativo.", "Prazos: repetição de indébito, <b>5 anos</b> (art. 168); anulatória da decisão que nega a restituição, <b>2 anos</b> (art. 169); mandado de segurança, <b>120 dias</b>; anulatória de débito fiscal, <b>5 anos</b> (Decreto 20.910). A banca mistura os prazos.", "LC 118/2005: o prazo de 5 anos contados do pagamento vale para ações ajuizadas a partir de <b>9/6/2005</b> (Tema 4 do STF). A banca cobra a antiga “tese dos 5 + 5”.", "Juros e correção: os juros de mora na repetição fluem do <b>trânsito em julgado</b> (art. 167, parágrafo único; Súmula 188 do STJ), e a correção, do <b>pagamento indevido</b> (Súmula 162 do STJ). Pelo art. 165-A (LC 236/2026), a atualização segue os índices do crédito tributário do ente. A banca fala em juros desde a citação.", "Tributos indiretos (art. 166): a restituição exige prova de que o contribuinte <b>assumiu o encargo</b> ou autorização de quem o assumiu. A banca dispensa a prova.", "Mandado de segurança: os 120 dias são decadenciais; não cabem honorários; o duplo grau é obrigatório se concedida a segurança; não substitui ação de cobrança; serve para <b>declarar</b> o direito à compensação (Súmula 213), e não para convalidar a compensação já feita (Súmula 460). A banca troca as duas súmulas.", "Liminar em compensação: a Súmula 212 do STJ e o art. 7º, § 2º, da Lei 12.016 vedavam a liminar. O STF declarou o § 2º <b>inconstitucional</b> na ADI 4296 (2021). Atenção ao comando da questão: ela pode cobrar o texto antigo ou a decisão do STF.", "Consignação: só do crédito que o consignante <b>se propõe pagar</b>; não serve para discutir o mérito do tributo. Improcedente, cobram-se juros de mora e penalidades. A banca diz que o pagamento se considera feito mesmo na improcedência.", "Cautelar fiscal: exige crédito <b>constituído</b> (prova literal), salvo no art. 2º, V, “b”, e VII; liminar <b>sem caução</b> e sem justificação prévia; indisponibilidade da pessoa jurídica só do <b>ativo permanente</b>, com extensão a controladores e administradores; eficácia cessa se a execução não for proposta em <b>60 dias</b>. A banca diz que alcança todos os bens da empresa ou exige caução.", "Art. 185-A do CTN × cautelar fiscal: o 185-A exige <b>citação</b>, ausência de pagamento ou garantia e <b>esgotamento de diligências</b> (Tema 714 do STJ); a cautelar fiscal é medida autônoma, preparatória ou incidental à execução. A banca troca os requisitos.", "Suspensão (art. 151): parcelamento, depósito integral, liminar em mandado de segurança e tutela provisória suspendem a exigibilidade, mas <b>não dispensam as obrigações acessórias</b>. A LC 236/2026 incluiu a aceitação de seguro-garantia ou fiança bancária pelo credor (inciso X). A banca diz que a suspensão dispensa a escrituração."]}, {"materia": "PROCESSO CIVIL", "titulo": "Lei 9.469/1997, pedido de suspensão de liminar, de tutela provisória e de sentença (Leis 8.437/1992 e 12.016/2009)", "key": "PCV", "nome": "Proc. Civil", "conc": ["Edital: item 10 de Processo Civil, <b>intervenção das pessoas jurídicas de direito público</b> em processos judiciais e pagamentos devidos pela Fazenda Pública (Lei 9.469/1997); tutelas de urgência contra o Poder Público; <b>pedido de suspensão</b> de liminar, de tutela provisória e de sentença; Leis 8.437/1992 e 12.016/2009. A Lei 9.469 é federal e trata, em boa parte, da AGU; a autocomposição municipal (LC 141/2023 e Decreto 1.106/2024) está em outra unidade. Não há norma de Curitiba nesta unidade. Os artigos foram conferidos no Planalto.", "Intervenção anômala (Lei 9.469, art. 5º): a União <b>pode intervir</b> nas causas em que figurem como autoras ou rés autarquias, fundações públicas, sociedades de economia mista e empresas públicas <b>federais</b> (caput). O parágrafo único permite a qualquer pessoa jurídica de direito público, inclusive o Município, intervir nas causas cuja decisão possa ter <b>reflexos, ainda que indiretos, de natureza econômica</b>, <b>independentemente da demonstração de interesse jurídico</b>, para esclarecer questões de fato e de direito, juntar documentos e memoriais e, se for o caso, <b>recorrer</b>. Só ao recorrer é considerada <b>parte</b>, para fins de deslocamento de competência.", "Pagamentos devidos pela Fazenda (art. 6º): os pagamentos em virtude de sentença fazem-se <b>exclusivamente na ordem cronológica</b> dos precatórios e à conta do respectivo crédito. Os credores de obrigação alimentícia têm preferência, respeitada a ordem cronológica entre eles (§ 1º). O acordo ou a transação para extinguir processo judicial, inclusive nos casos de extensão administrativa de pagamentos postulados em juízo, implica sempre a responsabilidade de <b>cada parte pelos honorários de seus respectivos advogados</b> (§ 2º). O regime constitucional dos precatórios é matéria de outras unidades.", "Acordos, desistência e dispensa (arts. 1º a 4º): são normas federais. O Advogado-Geral da União e os dirigentes máximos das empresas públicas federais (em conjunto com o dirigente estatutário da área) podem autorizar <b>acordos ou transações para prevenir ou terminar litígios</b>, inclusive judiciais (art. 1º, redação da Lei 13.140/2015). Acima do limite regulamentar, a autorização prévia e expressa do AGU e do Ministro da área é exigida, sob pena de nulidade. Podem ser criadas <b>câmaras especializadas</b> para analisar e formular propostas de acordos. A Administração pode concordar com a <b>desistência da ação</b>, em causas de qualquer valor, desde que o autor <b>renuncie expressamente ao direito</b> em que se funda a ação (art. 3º). Se a desistência decorre de prévio pedido administrativo com o mesmo objeto, o pedido não pode ser negado só por causa da renúncia. Não havendo súmula da AGU, o AGU pode dispensar a propositura de ações e a interposição de recursos quando a controvérsia estiver sendo <b>iterativamente decidida</b> pelo STF ou pelos Tribunais Superiores (art. 4º). No Município, a autocomposição segue a LC 141/2023 e o Decreto 1.106/2024.", "Tutela provisória contra a Fazenda (CPC, art. 1.059): à tutela provisória requerida contra a Fazenda Pública aplicam-se os <b>arts. 1º a 4º da Lei 8.437/1992</b> e o <b>art. 7º, § 2º, da Lei 12.016/2009</b> (este último declarado inconstitucional pelo STF na ADI 4296). A Lei 9.494/1997 (art. 1º) já estendia à tutela antecipada contra a Fazenda os arts. 1º, 3º e 4º da Lei 8.437/1992.", "Lei 8.437/1992, limites à liminar (arts. 1º a 3º): <b>não cabe liminar</b> contra atos do Poder Público, em cautelar ou em outras ações cautelares ou preventivas, quando providência semelhante não puder ser concedida em mandado de segurança por vedação legal (art. 1º). Não cabe, em 1º grau, cautelar inominada contra ato de autoridade que, no mandado de segurança, esteja sujeita à competência originária de tribunal (§ 1º), regra que <b>não se aplica à ação popular e à ação civil pública</b> (§ 2º). Não cabe liminar que <b>esgote, no todo ou em parte, o objeto da ação</b> (§ 3º), nem a que <b>defira compensação</b> de créditos tributários ou previdenciários (§ 5º). O representante judicial da entidade é <b>imediatamente intimado</b> da liminar (§ 4º). No mandado de segurança coletivo e na ação civil pública, a liminar só é concedida, quando cabível, após <b>audiência do representante judicial</b> da pessoa jurídica de direito público, que se pronuncia em <b>72 horas</b> (art. 2º). O recurso contra sentença cautelar que importe em outorga ou adição de vencimentos ou reclassificação funcional tem efeito suspensivo (art. 3º).", "Pedido de suspensão (Lei 8.437, art. 4º): é <b>contracautela</b>, e não recurso. Cabe a requerimento do <b>Ministério Público</b> ou da <b>pessoa jurídica de direito público interessada</b>, ao <b>presidente do tribunal</b> ao qual couber o conhecimento do respectivo recurso, em caso de manifesto interesse público ou flagrante ilegitimidade e para evitar <b>grave lesão à ordem, à saúde, à segurança e à economia públicas</b>, em despacho fundamentado. Alcança também a <b>sentença</b> em cautelar inominada, ação popular e ação civil pública, enquanto não transitada em julgado (§ 1º). O presidente pode ouvir o autor e o MP em <b>72 horas</b> (§ 2º). Do despacho que conceder ou negar a suspensão cabe <b>agravo em 5 dias</b>, levado a julgamento na sessão seguinte (§ 3º).", "Pedido de suspensão, desdobramentos (art. 4º, §§ 4º a 9º): mantida ou restabelecida a decisão no julgamento do agravo, cabe <b>novo pedido</b> ao presidente do tribunal competente para conhecer de eventual recurso especial ou extraordinário (§ 4º), também quando negado provimento ao <b>agravo de instrumento</b> contra a liminar (§ 5º). O agravo de instrumento <b>não prejudica nem condiciona</b> o julgamento do pedido de suspensão (§ 6º). O presidente pode conferir <b>efeito suspensivo liminar</b> ao pedido se constatar, em juízo prévio, a plausibilidade do direito invocado e a urgência (§ 7º). Liminares de objeto idêntico podem ser suspensas <b>em uma única decisão</b>, com extensão às supervenientes por simples aditamento do pedido (§ 8º). A suspensão vigora até o <b>trânsito em julgado</b> da decisão de mérito na ação principal (§ 9º).", "Suspensão no mandado de segurança (Lei 12.016, art. 15): têm legitimidade o MP e a pessoa jurídica de direito público interessada, para evitar grave lesão à ordem, à saúde, à segurança e à economia públicas. O presidente do tribunal ao qual couber o recurso suspende, em decisão fundamentada, a execução da <b>liminar e da sentença</b>. Da decisão cabe agravo, <b>sem efeito suspensivo</b>, em 5 dias, levado a julgamento na sessão seguinte. Indeferido o pedido ou provido o agravo, cabe novo pedido ao presidente do tribunal competente para REsp ou RE (§ 1º), o que vale também quando negado provimento ao agravo de instrumento contra a liminar (§ 2º). O agravo de instrumento não prejudica o pedido (§ 3º). Pela <b>Súmula 626 do STF</b>, a suspensão da liminar em mandado de segurança vigora até o trânsito em julgado da decisão de concessão da segurança (ou até sua manutenção pelo STF, havendo recurso), desde que o objeto da liminar coincida, total ou parcialmente, com o da impetração, salvo determinação em contrário na decisão que deferir a suspensão.", "Competência e natureza: o pedido vai ao presidente do tribunal que julgaria o recurso (para o Município de Curitiba, em regra o <b>TJPR</b>). Em matéria constitucional, o pedido pode ser dirigido ao STF (suspensão de liminar, de segurança e de tutela antecipada) e, em matéria infraconstitucional, ao STJ, quando for o tribunal competente para o recurso. A suspensão tem natureza de <b>juízo político e de gravidade</b>, com exame apenas mínimo do mérito, e <b>não substitui o recurso</b> cabível.", "Mandado de segurança, pontos ligados à Fazenda (Lei 12.016): a liminar do art. 7º, III, suspende o ato impugnado quando houver fundamento relevante e risco de ineficácia da medida, podendo ser exigida <b>caução, fiança ou depósito</b>. Seus efeitos persistem até a sentença, salvo se revogada ou cassada (art. 7º, § 3º), e o processo tem prioridade (§ 4º). Da decisão sobre a liminar cabe agravo de instrumento (§ 1º). Da sentença cabe apelação; concedida a segurança, o <b>duplo grau é obrigatório</b> (art. 14, § 1º), e a autoridade coatora pode recorrer (§ 2º). A sentença concessiva pode ser <b>executada provisoriamente</b>, salvo nos casos em que é vedada a liminar (§ 3º), e o pagamento de vencimentos ao servidor só alcança as prestações vencidas a partir do <b>ajuizamento</b> (§ 4º). O prazo é de 120 dias (art. 23) e não há honorários (art. 25). O impetrante pode <b>desistir a qualquer tempo</b>, mesmo após a sentença de mérito, sem anuência do impetrado (STF, Tema 530).", "Mandado de segurança coletivo (arts. 21 e 22): pode ser impetrado por partido político com representação no Congresso Nacional, em defesa de seus interesses legítimos relativos a seus integrantes ou à finalidade partidária, ou por organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos <b>1 ano</b>, em defesa de direitos de seus membros, <b>sem necessidade de autorização especial</b>. A sentença faz <b>coisa julgada limitada aos membros do grupo ou categoria</b> substituídos. O mandado coletivo não induz litispendência para as ações individuais, mas o impetrante individual só se beneficia se <b>desistir de seu mandado em 30 dias</b>, contados da ciência comprovada da impetração coletiva (art. 22, § 1º). A exigência de audiência prévia do representante da pessoa jurídica de direito público (art. 22, § 2º) foi declarada inconstitucional na ADI 4296.", "ADI 4296 (STF, 9/6/2021): declarou inconstitucionais o <b>art. 7º, § 2º</b>, e o <b>art. 22, § 2º</b>, da Lei 12.016, e manteve o art. 1º, § 2º (atos de gestão comercial), o <b>art. 7º, III</b> (caução, fiança ou depósito, como faculdade do juiz), o <b>art. 23</b> (120 dias) e o <b>art. 25</b> (sem honorários). Assim, a lei não pode vedar nem condicionar a liminar em mandado de segurança nas hipóteses do § 2º (compensação tributária, entrega de mercadorias do exterior, reclassificação ou equiparação de servidores, aumento ou extensão de vantagens). Atenção: a Lei 8.437/1992 (art. 1º, § 5º) e o CPC (art. 1.059) mantêm seus textos, e a banca pode cobrar a letra da lei ou a decisão do STF."], "pega": ["Art. 5º, caput: a União intervém em causas de <b>autarquias, fundações públicas, empresas públicas e sociedades de economia mista federais</b>. A banca troca por entidades estaduais ou municipais.", "Art. 5º, parágrafo único: o ente de direito público intervém <b>sem demonstrar interesse jurídico</b>, bastando o reflexo econômico, ainda que indireto. Só é considerado <b>parte</b> (para deslocar competência) quando <b>recorre</b>. A banca exige interesse jurídico ou diz que sempre se torna parte.", "Desistência (art. 3º): a Administração concorda com a desistência da ação, em causas de qualquer valor, desde que o autor <b>renuncie expressamente ao direito</b>. A banca limita a causas de baixo valor ou dispensa a renúncia.", "Honorários no acordo (art. 6º, § 2º): <b>cada parte</b> paga os honorários de seus advogados. A banca diz que paga quem desistiu ou o vencido.", "Âmbito da Lei 9.469: acordos, transações e dispensa de recurso são <b>federais</b> (AGU e empresas públicas federais). No Município vale a LC 141/2023. A banca aplica a Lei 9.469 ao Prefeito sem norma local.", "Suspensão não é recurso: é contracautela, pedida ao <b>presidente do tribunal</b> (e não ao relator) pelo <b>MP</b> ou pela <b>pessoa jurídica de direito público interessada</b>, para evitar grave lesão à <b>ordem, à saúde, à segurança e à economia públicas</b>. A banca troca por “meio ambiente” ou legitima o particular.", "Prazos: agravo em <b>5 dias</b>; oitiva do autor e do MP em <b>72 horas</b>; audiência do representante da Fazenda em <b>72 horas</b> (Lei 8.437, art. 2º). A banca troca por 10 ou 15 dias.", "Duração: a suspensão vigora até o <b>trânsito em julgado</b> da decisão de mérito (art. 4º, § 9º); na liminar do MS, vale a Súmula 626 do STF. A banca diz que cessa com a sentença.", "Agravo de instrumento e suspensão: podem andar <b>ao mesmo tempo</b>; o agravo não prejudica nem condiciona o pedido (art. 4º, § 6º; art. 15, § 3º). Indeferida a suspensão ou provido o agravo, cabe <b>novo pedido</b> ao presidente do tribunal superior (REsp ou RE). A banca diz que o agravo prejudica o pedido ou que não há novo pedido.", "Suspensão em bloco (art. 4º, § 8º): várias liminares de objeto idêntico podem ser suspensas <b>numa única decisão</b>, estendida às supervenientes por aditamento. A banca exige pedido separado para cada liminar.", "Liminar contra o Poder Público: a Lei 8.437 veda a liminar que <b>esgote o objeto</b> e a que <b>defira compensação</b> de créditos tributários (art. 1º, §§ 3º e 5º). A vedação do art. 7º, § 2º, da Lei 12.016 foi declarada <b>inconstitucional</b> (ADI 4296). A banca cobra uma ou outra; leia o enunciado.", "ADI 4296: foram mantidos o prazo de <b>120 dias</b> (art. 23), a ausência de <b>honorários</b> (art. 25), a <b>caução</b> facultativa do art. 7º, III, e a exclusão dos atos de gestão comercial (art. 1º, § 2º). A banca diz que foram invalidados.", "Mandado de segurança: concedida a segurança, o <b>duplo grau</b> é obrigatório e a execução provisória é possível, salvo quando vedada a liminar; o servidor recebe vencimentos só desde o <b>ajuizamento</b>; o impetrante pode <b>desistir a qualquer tempo</b>, sem anuência (Tema 530). A banca troca por “desde a data do ato” ou exige a anuência da autoridade.", "MS coletivo: coisa julgada <b>limitada aos membros</b>; o impetrante individual precisa <b>desistir em 30 dias</b> para se beneficiar; a associação precisa de <b>1 ano</b> de funcionamento, sem autorização especial; o partido precisa ter representação no Congresso Nacional. A banca troca os 30 dias ou exige autorização."]}], "18": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Decretos municipais de Curitiba sobre a Lei 14.133/2021 (edital, item 8)", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 8 de Direito Administrativo, <b>Decretos municipais de Curitiba que regulamentam a Lei 14.133/2021</b>: 1.883/2021, 700/2023, 701/2023, 384/2023, 383/2023, 2.051/2025, 2.067/2025, 380/2023, 385/2023, 388/2025 e 1.206/2023. Todos foram lidos <b>literalmente no Chrome</b>, nos sites oficiais da Prefeitura (legisladocexterno) e, para 385, 388, 2.051 e 2.067, em portais de legislação. Os Decretos alteradores <b>2.204/2025, 2.335/2025, 637/2024 e 172/2026</b> também foram lidos (ver conceito final). Ressalva única: o <b>Decreto 1.238/2026</b>, altera o Decreto 701 (site: assinado e publicado em 06/08/2026, Diário Oficial 145, em vigor), mas o <b>texto próprio do decreto não abriu</b> (a página devolveu outro ato e o arquivo é assinatura digital ilegível). O texto consolidado do 701 usado aqui é o da página oficial, que já vem com as alterações, mas não consigo indicar quais dispositivos vieram do 1.238. Desde 2025 a <b>SMAP</b> aparece como <b>SMATI</b> (Secretaria de Administração e Tecnologia da Informação) nos textos novos.", "Decreto 385/2023 (modalidades): as modalidades são <b>pregão, concorrência, concurso, leilão e diálogo competitivo</b>, com preferência pela forma <b>eletrônica</b>. Prazos mínimos para propostas (art. 18): bens, <b>8 dias úteis</b> (menor preço ou maior desconto) ou 15; serviços comuns e obras comuns, <b>10</b>; serviços e obras especiais, <b>25</b>; contratação integrada, <b>60</b>; semi-integrada, <b>35</b>; maior lance, <b>15</b>; técnica e preço, <b>35</b>. Garantia de proposta de até <b>1%</b>, devolvida em 10 dias úteis.", "Decreto 385/2023 (esclarecimentos, recursos e desempate): impugnação e pedido de esclarecimento até <b>3 dias úteis antes da sessão</b>, com resposta em 3 dias úteis e efeito vinculante. Desconexão superior a <b>10 minutos</b> suspende a sessão por 24 horas. Na negociação, o licitante tem <b>2 horas</b> para proposta adequada. Desempate: disputa final de 30 minutos, desempenho contratual, <b>equidade de gênero</b> (2% de vagas para vítimas de violência doméstica) e programa de integridade. Recurso: intenção em <b>20 minutos</b>, razões em <b>3 dias úteis</b>, contrarrazões em 3, reconsideração em 3 e decisão em 10 dias úteis.", "Decreto 385/2023 (diálogo competitivo, leilão e revogações): na fase competitiva do diálogo, prazo mínimo de <b>60 dias úteis</b>, sem habilitação nessa fase. No <b>leilão</b> não há habilitação; bens móveis são avaliados pela <b>Comissão de Baixa Patrimonial</b> e imóveis pela <b>CAI</b>. Revogou os Decretos 1.217/2003, 1.235/2003, 379/2008, 517/2009, 884/2013, 1.668/2013, 413/2015, 558/2015 e 63/2020. A publicação do edital em jornal foi obrigatória só até <b>31/12/2023</b>.", "Decreto 388 (cadastro de fornecedores no e-Compras, integrado ao PNCP): o CRC vale por <b>no máximo 12 meses</b>; a auditoria do cadastro leva 3 dias úteis; cabe recurso em <b>5 dias úteis sem efeito suspensivo</b>; o cadastro é inativado se não atualizado há mais de <b>2 anos</b>; documentos sem prazo de validade valem <b>3 meses</b>; sanção aplicada é comunicada à Comissão em 10 dias úteis.", "Decreto 2.051/2025 (habilitação em contratação de <b>serviços</b>): a habilitação se divide em jurídica, técnica, fiscal, social e trabalhista, e econômico-financeira. Atestados de capacidade técnica: serviços similares em quantidade mínima de <b>até 50%</b> do objeto; em serviços contínuos, experiência de <b>até 3 anos</b>, sem contar períodos concomitantes; admite <b>somatório</b> de atestados; só valem atestados emitidos após <b>1 ano</b> de execução, salvo contrato de prazo menor. Exige declaração de conhecimento das condições locais e de vistoria, ou de renúncia a ela.", "Decreto 2.051/2025 (econômico-financeira): balanço, DRE e demais demonstrações dos <b>2 últimos exercícios</b> (apenas o último, se a empresa tem menos de 2 anos) e certidão negativa de falência. Pela redação do <b>Decreto 707/2026</b>, o art. 7º traz índices: ILC, ILG e SG <b>≥ 1,00</b>; grau de endividamento <b>≤ 0,35</b>; CCL <b>≥ 16,66%</b> do valor anual; relação de compromissos (PL ≥ 1/12 dos contratos firmados); PL <b>≥ 10%</b> do valor anual estimado. O uso cumulativo é referência para contratações estratégicas e serviços com dedicação exclusiva de mão de obra; a não utilização exige <b>justificativa</b> do agente de planejamento, com autorização ou ratificação da autoridade.", "Decreto 2.051/2025 (diligência e disposições finais): após a entrega, só se admite documento novo em <b>diligência</b>, para complementar informação ou atualizar documento vencido depois da proposta. O licitante tem <b>até 3 oportunidades</b>, cada uma com <b>2 dias úteis</b>. O agente pode sanar falhas que não alterem a substância, por despacho fundamentado. É vedado exigir faturamento mínimo anterior ou índices de rentabilidade. O Decreto <b>revoga o 804/2023</b>.", "Decreto 2.067/2025 (habilitação em aquisição de <b>bens</b>): estrutura semelhante à dos serviços, com diferenças. A econômico-financeira exige índices ILC, ILG e SG <b>≥ 1</b>, aferidos por contador da Administração, que prevalece em caso de divergência. Se os índices ficarem abaixo de 1, o edital pode exigir <b>patrimônio líquido de até 10%</b> do valor estimado (art. 8º). O <b>MEI</b> é dispensado de balanço e de índices. Para consórcio, aplica-se o acréscimo do art. 15, § 1º, da Lei 14.133, e cada consorciada comprova os índices.", "Decreto 2.067/2025 (disposições finais): processos com edital publicado antes do Decreto continuam regidos pelo <b>Decreto 804/2023</b>; a SMATI edita normas complementares. Pessoa física: CPF, regularidades, <b>certidão negativa de insolvência civil</b> e declaração. A documentação pode ser substituída por <b>registro cadastral</b> de órgão público, se prevista no edital, e a autenticidade de cópia pode ser provada por <b>declaração de advogado</b>.", "Decreto 700/2023 (reajuste em sentido estrito, arts. 112-116): considera a variação <b>da data do orçamento estimado</b> (data em que a planilha ou mapa de preços foi assinado, não a da tabela referencial) até o adimplemento. Deve ser <b>pedido expressamente pelo contratado</b>, até a prorrogação subsequente ou o termo final, sob <b>preclusão lógica</b>. Em serviço continuado com dedicação exclusiva ou predominância de mão de obra incide <b>repactuação</b>, e não o reajuste. Culpa do contratado: reajuste só no período sem culpa. Se vier depois de revisão, evita-se <b>dupla concessão</b> pelo mesmo fundamento. Cálculo: Assessoria de Custos da SMF; pode ser por <b>apostilamento</b>.", "Decreto 700/2023 (repactuação, arts. 117-126): vale para serviço contínuo com mão de obra, em contratos de <b>12 meses ou mais</b> e com <b>interregno mínimo de 1 ano</b>. Para mão de obra, o ano conta da data do acordo, convenção ou dissídio; para insumos, da data da proposta. A repactuação seguinte conta da data em que se iniciaram os efeitos financeiros da anterior. O pedido vem com planilha analítica, e <b>planilhas separadas</b> para mercado e mão de obra. É vedado incluir benefício não previsto na proposta, salvo imposição legal ou normativa. A Administração <b>não se vincula</b> a cláusulas de acordo coletivo sobre matéria não trabalhista, PLR ou exclusivas de contrato público (art. 135 §2º da Lei 14.133). Sem convenção coletiva, usa-se pesquisa na mesma fonte inicial ou o IPCA. Efeitos financeiros retroativos podem ser pagos por apostilamento (contrato vigente) ou <b>termo indenizatório</b> (contrato encerrado).", "Decreto 700/2023 (revisão, atualização monetária e preclusão, arts. 127-133): a <b>revisão</b> restabelece o equilíbrio por fato imprevisível, ou previsível de consequências incalculáveis, força maior, caso fortuito ou fato do príncipe. Pode ser concedida <b>a qualquer tempo</b>, mesmo sem previsão contratual, com 7 requisitos (evento futuro e incerto, posterior à proposta, sem culpa do contratado, alteração substancial, nexo causal, demonstração com planilha). O contratado comprova; o gestor atesta; a SMF calcula. <b>Atualização monetária</b>: só se o atraso não for do contratado e o pagamento ocorrer <b>após 30 dias do atesto do recebimento definitivo</b>. Reajuste, repactuação e revisão devem ser pleiteados antes da formalização do contrato, da prorrogação ou do termo final, sob <b>preclusão lógica</b>; simples ressalva não basta. Não há preclusão se o direito foi ressalvado no aditivo, se o acordo coletivo estava pendente de registro (30 dias) ou no caso do art. 126. Em contrato acima de 12 meses, exerce-se a cada 12 meses.", "Decreto 700/2023 (recebimento e pagamento, arts. 134-146): obras e serviços têm recebimento <b>provisório</b> (fiscal) e <b>definitivo</b> (agente ou comissão). Em obra, a garantia de solidez e segurança é de <b>no mínimo 5 anos</b>. Pagamento em até <b>30 dias corridos do atesto</b>. Em dispensa e inexigibilidade com mão de obra alocada, o pagamento exige certidões e guias (CND previdenciária, FGTS, CNDT etc.). A falta das certidões de regularidade fiscal não retém o pagamento, mas dá <b>30 dias, prorrogáveis duas vezes, no máximo 90</b>. Contrato vencido: pagamento por <b>termo de indenização</b>. <b>Pagamento antecipado</b> é vedado, salvo economia de recursos ou condição indispensável, com justificativa e previsão no edital. Remuneração variável: até o limite orçamentário.", "Decreto 700/2023 (subcontratação e suspensão, arts. 147-152): a subcontratação é limitada a <b>30% do objeto</b>, não pode ser parcela de maior relevância nem a usada para qualificação técnica, e depende de <b>autorização prévia</b>. É vedada na inexigibilidade do art. 74, III. A Administração pode exigir subcontratação de ME/EPP. <b>Suspensão unilateral: até 3 meses</b>, prorrogável só em calamidade, grave perturbação da ordem ou guerra. Se o contratado concorda, termo aditivo; se silencia ou discorda, portaria publicada. Há justa indenização por desmobilização.", "Decreto 700/2023 (extinção e sanções, arts. 153-164 e 244-289): extinção unilateral exige defesa prévia de <b>10 dias úteis</b>, recurso de <b>3 dias úteis</b> com efeito suspensivo, e decisão em 10 dias úteis. O contratado tem direito à extinção se a Administração suspender por mais de <b>3 meses</b>, atrasar pagamento por mais de <b>2 meses</b> ou houver suspensões que somem <b>90 dias úteis</b>. Sanções: advertência, multa, <b>impedimento</b> (até 3 anos, só no Município) e <b>inidoneidade</b> (3 a 6 anos, todos os entes). Multa: <b>0,5% a 30%</b> do valor do contrato. Defesa prévia: 2 dias úteis (só advertência) ou 15 dias úteis (multa); recurso único de 15 dias úteis. Impedimento e inidoneidade passam pela Corregedoria Geral (PGM) e Comissão Processante, com defesa de 15 dias úteis. Reabilitação: 1 ano (impedimento) ou 3 anos (inidoneidade). Registro no CEIS e CNEP em 15 dias úteis.", "Decreto 700/2023 (chamamento público, convênios e disposições finais, arts. 165-309): o edital de chamamento tem divulgação mínima de <b>15 dias úteis</b> no PNCP e no site. Dispensa por emergência (até 1 ano), educação/saúde/assistência por entidade credenciada, e valores do art. 75, I e II. Inexigível quando só uma entidade puder executar. A comissão de seleção tem <b>no mínimo 3 servidores efetivos</b>. Convênio: vedada a taxa de administração, e a vigência máxima é de <b>48 meses</b>. Eficácia do extrato: publicação em até <b>20 dias</b> da assinatura. Transição: o art. 300 foi alterado pelo Decreto 2.236/2023, prorrogando a opção pelo regime antigo até <b>22/12/2023</b>; a partir de <b>23/12/2023</b>, só a Lei 14.133. Locação sob a Lei 8.666 deve ser extinta até <b>8/12/2025</b> (Decreto 483/2024). Qualquer alteração do Decreto 700 exige manifestação prévia da PGM (art. 309).", "Decreto 380/2023 (definições e sistematização): as normas municipais da Lei 14.133 se aplicam <b>de modo conjunto</b>, conforme o objeto. <b>Órgão promotor</b> requisita o bem e assina e gere os termos; <b>setor requisitante</b> faz planejamento e fase preparatória; <b>órgão instaurador</b> divulga o edital, opera e homologa; <b>autoridade máxima</b> é o Secretário, o Procurador-Geral ou o Presidente da autarquia ou fundação. Apostilamento é registro administrativo. Normas complementares imprescindíveis: em <b>15 dias</b>. À SMAP, regulamentar em <b>120 dias</b> o uso e a alienação de bens municipais por terceiros. <b>Qualquer decreto novo ou alteração exige análise prévia da PGM</b> (art. 7º).", "Decreto 1.883/2021 (transição): até que sobreviesse decreto autorizando a Lei 14.133, valiam as Leis 8.666, 10.520 e 12.462 (art. 1º). Dispensas de valor (art. 75, I e II) dependiam de modelos aprovados por portaria conjunta PGM e SMAP, em <b>90 dias prorrogáveis por igual período</b>. Bens de consumo devem ser de qualidade <b>comum</b>; <b>luxo</b> é o que, por qualidade e preço, supera o necessário, e só se admite com justificativa da autoridade máxima ou preço equivalente. Recursos federais seguem as regras da União. Publicidade no Diário Oficial até a integração do e-Compras ao PNCP.", "Decreto 383/2023 (ETP): é a <b>primeira etapa do planejamento</b>. A autoridade máxima o aprova (subdelegável a Superintendentes, Subprocurador-Geral e, desde o Decreto 1.392/2023, Diretores). Há <b>segregação de funções</b>: o servidor que conduz a licitação não elabora o ETP. O art. 6º lista <b>15 elementos</b>; obrigatórios sempre os incisos <b>I, IV, VI, VIII e XIII</b> (necessidade, quantidades, valor estimado, parcelamento e conclusão). É <b>facultativo</b> abaixo dos valores do art. 75, I e II, em guerra e emergência, para licitante remanescente, ETP anterior ou padronização; <b>dispensado</b> em aditivos, apostilamentos e prorrogações de serviço contínuo. Divulgação: PNCP e Portal da Transparência <b>após a homologação</b> (Decreto 1.242/2024). Consulta pública com antecedência mínima de <b>8 dias úteis</b>.", "Decreto 384/2023 (pesquisa de preços): quem pesquisa é o <b>setor requisitante</b>. Estimativa pela <b>média aritmética simples de 3 ou mais preços</b>, sem valores extremos; sem 3 referências, vale o menor preço, justificado. São 9 parâmetros (painel de preços e PNCP, contratações similares do <b>último ano</b>, mídia e tabelas com data e hora, <b>mínimo 3 fornecedores</b>, notas fiscais eletrônicas só para <b>bens</b>, tabelas oficiais, Nota Paraná, Nota Curitibana, cesta de preços). Preços de até <b>6 meses</b> antes do edital. E-mail sem resposta: reiterar em <b>2 dias úteis</b> e prosseguir após <b>4</b>. Vedada estimativa em sítios de leilão ou intermediação (art. 31). Orçamento sigiloso: justificado, divulgado <b>após o encerramento</b>; obrigatório divulgar quando se exige atestado (art. 27) e no maior desconto. Contratação direta: notas fiscais dos últimos <b>6 meses</b>. O <b>Decreto 2.204/2025</b> revogou o <b>inciso III do art. 3º</b> e deu ao inciso II do §2º do art. 3º esta regra: na licitação com mais de um órgão, a competência é do <b>órgão promotor</b>.", "Decreto 701/2023 (credenciamento e pré-qualificação): o credenciamento é chamamento público; aviso no PNCP e Portal de Compras, e extrato no Diário Oficial. Prazo mínimo de <b>15 dias úteis</b> (<b>8</b> em mercados fluidos), edital <b>permanentemente aberto</b>. Hipóteses: <b>paralela e não excludente</b>, <b>seleção a critério de terceiros</b> e <b>mercados fluidos</b>. O credenciamento não obriga a contratar e a extinção dele não rescinde o contrato em vigor (art. 20). Contrato de até <b>5 anos</b> em serviço contínuo. Pré-qualificação: permanentemente aberta, recurso em <b>3 dias úteis</b>, cadastro de bens válido por <b>1 ano</b>, licitação restrita aos pré-qualificados só com pré-qualificação total. Não gera direito à contratação (art. 52).", "Decreto 701/2023 (PMI e registro cadastral): o <b>PMI</b> parte de edital de chamamento; a autorização é <b>pessoal e intransferível</b>, não dá preferência na licitação, não obriga a licitar e o ressarcimento é pago <b>só pelo vencedor</b>, vedada a cobrança da Administração. Pode ser restrito a <b>startups</b>. O autor dos estudos pode participar da licitação. Cassação: 5 dias úteis para regularizar. <b>Registro cadastral</b>: usa-se o cadastro unificado do PNCP; o cadastro municipal <b>não pode ser exigido</b> como condição de participação (art. 143) e é proibido registro complementar para acessar o edital (art. 144).", "Decreto 701/2023 (SRP, parte 1): ata de registro de preços com vigência de <b>1 ano</b>, prorrogável por igual período; vedado acrescer quantitativos. A <b>IRP</b> dura no mínimo <b>8 dias úteis</b>. Gerenciador (art. 85, nova redação do Decreto 2.204/2025): <b>SMATI</b> em contratação estratégica; o <b>órgão promotor</b> quando participar mais de um órgão; a SMATI quando o promotor não tiver servidor para operar, mas a <b>homologação fica com o promotor</b>. Adoção em obras exige projeto padronizado e necessidade permanente. Licitação por grupo de itens só com inviabilidade por item. Cadastro de reserva: expectativa de direito, habilitação só se precisar. O preço registrado vincula o fornecedor, mas <b>não obriga a Administração a contratar</b> (art. 102).", "Decreto 701/2023 (SRP, parte 2): alteração de preços por força maior, fato do príncipe, tributos ou reajuste, formalizada por <b>termo aditivo</b> (casos I e II) ou <b>apostilamento</b> (reajuste). Preclusão: antes da nota de empenho, da assinatura do contrato ou da prorrogação. Preço de mercado menor: o fornecedor é convocado para <b>negociar</b> e, se recusar, é liberado <b>sem penalidade</b>. Reajuste só após 12 meses e por apostilamento, sem prévia análise da PGM. Prorrogação da ata: 9 requisitos. Cancelamento: defesa em <b>5 dias</b>. Adesão (carona): justificada pela autoridade máxima; até <b>50%</b> por órgão e <b>o dobro</b> no total; carona em ata de outros Municípios só se a ata tiver sido licitada (Decreto 483/2024). Transição: editais até 30/11/2023 e atas do Decreto 290/2016 seguem até o fim.", "Decreto 1.206/2023 (obras e serviços de engenharia, parte 1): modalidade <b>concorrência</b>; serviço comum de engenharia vai a <b>pregão</b> (menor preço ou maior desconto), e a concorrência se o critério for técnica ou técnica e preço. Quem licita é o órgão com corpo técnico (Lei 5.194/1966). Projeto básico exige profissional habilitado e <b>ART ou RRT</b>. O ETP é feito por engenheiro ou arquiteto, com <b>vistoria in loco</b> (dispensável em caráter excepcional). Marca ou modelo só com justificativa técnica, sempre com “ou equivalente”. Qualificação técnica: parcela de maior relevância é a de valor <b>igual ou superior a 4%</b> do total; atestados de até <b>50%</b>, sem limite de tempo ou local. Proposta inexequível: abaixo de <b>75%</b> do orçado. BDI: IRPJ e CSLL <b>não entram</b>.", "Decreto 1.206/2023 (parte 2): empreitada por preço global quando os quantitativos são precisos; por preço unitário quando há imprecisão inerente. <b>Integrada</b>: contratado faz projeto básico e executivo; <b>semi-integrada</b>: só o executivo, e o básico pode ser alterado com autorização se houver superioridade comprovada. Matriz de riscos obrigatória nesses regimes e em grande vulto. Valores só se alteram por caso fortuito ou força maior, alteração pedida pela Administração ou risco alocado a ela. Fornecimento com serviço associado: operação limitada a <b>5 anos</b>, vigência máxima decenal. Prazos: o de execução não pode ultrapassar o de vigência; obra paralisada por mais de <b>1 mês</b> exige aviso público. Acréscimos e supressões calculam-se <b>isoladamente</b>, sem compensação.", "Decreto 1.206/2023 (parte 3): <b>BIM</b> é preferencial, e a não adoção exige justificativa; é exigido nos regimes integrado, semi-integrado e de fornecimento com serviço associado; o IPPUC padroniza as especificações. Recebimento provisório (fiscal) e definitivo (servidor ou comissão); a SMAP averba a obra no cartório de imóveis. <b>Grande vulto</b>: programa de integridade em <b>6 meses</b> do contrato, seguro-garantia de até <b>30%</b>, e a multa por inexecução parcial se não implantar. O programa de integridade é critério de desempate e atenuante. A inidoneidade por certas infrações exige programa de integridade para reabilitação. Acima da receita da EPP, não se aplicam os arts. 42 a 49 da LC 123/2006. Alterado pelos Decretos 1.242/2024, 637/2024 (Painel de Obras) e 2.335/2025.", "Decretos alteradores lidos literalmente: <b>2.204/2025</b> (16/10/2025) alterou 384, 700 e 701 em um ponto só: <b>quem opera e homologa a licitação com mais de um órgão é o órgão promotor</b> (Decreto 700, art. 10, II; revogado o inciso III); o órgão sem agente de contratação pede apoio à <b>SMATI</b>, que opera o certame, e o promotor instaura e homologa. <b>2.335/2025</b> (05/11/2025) mudou o art. 55 do 1.206: o inciso VI passou a ser <b>pesquisa direta com fornecedor</b>, com média de <b>3 referências</b>, orçamentos de até <b>6 meses</b> e justificativa de por que afastar os outros critérios (§6º); criou o <b>Relatório de Cotações</b> (art. 57, parágrafo único) e as regras de pesquisa por e-mail (2 e 4 dias úteis). <b>637/2024</b>: Painel de Obras (art. 14, §5º do 1.206). <b>172/2026</b> (11/02/2026): art. 136-A no 701, em que <b>outros Municípios</b> podem aderir a ata de Curitiba, se ela for licitada por SRP e o <b>edital admitir</b>, com limites de <b>50%</b> por órgão e o <b>dobro</b> no total; a SMATI edita as normas complementares (arts. 151 e 152)."], "pega": ["Prazos de proposta: a banca troca o número de dias úteis entre bens (8), serviços comuns (10), serviços especiais (25), integrada (60) e semi-integrada (35).", "Impugnação: vai até <b>3 dias úteis antes</b> da sessão. A banca troca por 5 dias ou por dias corridos.", "Atestado: o limite é de <b>até 50%</b> do objeto. A banca troca por “no mínimo 50%” ou “100%”.", "Decreto 804/2023: é revogado pelo 2.051/2025, mas o 2.067/2025 mantém sua aplicação aos editais já publicados. A banca diz que revoga tudo sem ressalva.", "MEI: dispensado de balanço e de índices. A banca exige balanço de todas as microempresas e do MEI.", "Diligência: até 3 oportunidades de 2 dias úteis. A banca diz que não se admite diligência ou fala em prazo único de 5 dias.", "Cadastro (Decreto 388): CRC de 12 meses e inativação após 2 anos sem atualização. A banca inverte os prazos.", "Preclusão: o pedido de reajuste, repactuação ou revisão deve ser feito até a prorrogação subsequente ou o termo final. A banca diz que a simples ressalva do direito basta; o Decreto 700 diz que <b>não basta</b>.", "Reajuste x repactuação: serviço com dedicação exclusiva de mão de obra tem repactuação e <b>não</b> reajuste em sentido estrito.", "Sanções: multa de 0,5% a 30%; impedimento até 3 anos (só Município); inidoneidade de 3 a 6 anos (todos os entes). A banca troca prazos e abrangência.", "Suspensão unilateral: até 3 meses. Atraso de pagamento que dá direito à extinção: mais de 2 meses. A banca troca por 90 dias ou 6 meses.", "Transição: o art. 300 do Decreto 700 foi alterado pelo 2.236/2023 (22/12/2023 em vez de 30/11/2023). A banca usa a data original.", "Pesquisa de preços (Decreto 384): preços de até <b>6 meses</b> antes do edital e média de <b>3 ou mais</b> preços. A banca troca por 12 meses ou por menor preço como regra.", "Adesão ao SRP (Decreto 701): até <b>50% por órgão</b> e <b>o dobro</b> no total. A banca inverte ou troca por 100%.", "Obras (Decreto 1.206): parcela de maior relevância é a de <b>4% ou mais</b>; inexequível é abaixo de <b>75%</b>. A banca troca por 10% e 70%.", "ETP (Decreto 383): obrigatórios os incisos <b>I, IV, VI, VIII e XIII</b>; a banca diz que todos os 15 são sempre obrigatórios, ou que o ETP é dispensado em qualquer dispensa de licitação.", "Decreto 701, art. 143: o cadastro municipal <b>não pode ser exigido</b> como condição de participação. A banca diz que é obrigatório.", "Gerenciador do SRP e operador do certame: a competência passou ao <b>órgão promotor</b> quando há mais de um órgão (Decreto 2.204/2025). A banca usa a regra antiga, da SMAP ou da maior parcela.", "Adesão ao SRP por outros Municípios (Decreto 172/2026): só se a ata foi licitada por SRP, está vigente e o <b>edital admite</b>; mesmos limites de 50% e do dobro."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Educação, cultura, desporto, ciência, comunicação social, meio ambiente, família, criança, adolescente, idoso e indígenas (CF, arts. 205 a 232)", "key": "CON", "nome": "Constitucional", "conc": ["Edital: Direito Constitucional, ordem social nos temas de <b>educação, cultura e desporto, ciência, tecnologia e inovação, comunicação social, meio ambiente, família, criança, adolescente, pessoa idosa e povos indígenas</b> (CF, arts. 205 a 232). O texto dos arts. 205 a 232 foi <b>lido literalmente no site do Planalto</b> nesta rodada. A jurisprudência citada (temas e ADIs do STF) vem de memória e deve ser conferida antes da prova.", "Educação (arts. 205 a 214): direito de todos e dever do Estado e da família. Princípios do art. 206: igualdade de condições, liberdade, <b>pluralismo de ideias</b>, <b>gratuidade</b> do ensino público em estabelecimentos oficiais, valorização dos profissionais com concurso, <b>gestão democrática</b>, padrão de qualidade e <b>piso salarial</b> nacional. O art. 207 garante <b>autonomia</b> didático-científica, administrativa e de gestão financeira e patrimonial às universidades. Súmula Vinculante 12: é inconstitucional cobrar taxa de matrícula em universidade pública.", "Dever do Estado (art. 208): educação básica <b>obrigatória e gratuita dos 4 aos 17 anos</b>, inclusive para quem não teve acesso na idade própria; universalização do ensino médio gratuito; educação infantil em creche e pré-escola até 5 anos; atendimento educacional especializado, preferencialmente na rede regular. O acesso ao ensino obrigatório é <b>direito público subjetivo</b> e a oferta irregular gera responsabilidade da autoridade. Os Municípios atuam <b>prioritariamente no ensino fundamental e na educação infantil</b> (art. 211, § 2º).", "Financiamento (arts. 212 e 212-A): a União aplica no mínimo <b>18%</b> e Estados, DF e Municípios <b>25%</b> da receita de impostos na manutenção e desenvolvimento do ensino. O FUNDEB é permanente (EC 108/2020), com complementação da União de no mínimo <b>23%</b>, e ao menos <b>70%</b> dos recursos vão para a remuneração dos profissionais da educação básica. O salário-educação é contribuição social das empresas.", "Jurisprudência de educação: Tema 548 do STF, o acesso a creche e pré-escola é direito exigível do Município, sem que a reserva do possível o afaste. Educação domiciliar: sem lei, não há direito público subjetivo ao homeschooling (Tema 822). Ensino religioso em escola pública (ADI 4439): admite-se o <b>confessional</b>, de <b>matrícula facultativa</b>, nos horários normais (art. 210, § 1º). As cotas raciais foram declaradas constitucionais na ADPF 186.", "Cultura e desporto (arts. 215 a 217): o Estado garante o pleno exercício dos direitos culturais e apoia a difusão das manifestações. O patrimônio cultural brasileiro (art. 216) inclui bens de natureza material e imaterial; a proteção se dá por inventários, registros, vigilância, <b>tombamento</b> e desapropriação. O Sistema Nacional de Cultura está no art. 216-A. No desporto (art. 217), o Judiciário só admite ação sobre disciplina e competições <b>após esgotadas as instâncias da justiça desportiva</b>, que tem 60 dias para decidir.", "Ciência, tecnologia e inovação (arts. 218 e 219): o Estado promove e incentiva a pesquisa, com prioridade para a pesquisa básica e tecnológica; a pesquisa tecnológica se volta ao problema brasileiro e ao desenvolvimento do sistema produtivo. O <b>mercado interno integra o patrimônio nacional</b> e será incentivado de modo a viabilizar o desenvolvimento cultural e socioeconômico (art. 219). O art. 219-B cria o Sistema Nacional de Ciência, Tecnologia e Inovação.", "Comunicação social (arts. 220 a 224): a manifestação do pensamento e a informação <b>não sofrem restrição</b>, observada a Constituição; nenhuma lei conterá embaraço à liberdade de informação jornalística, e é <b>vedada toda censura</b> política, ideológica e artística. Lei federal regula diversões e espetáculos públicos e informa sobre a faixa etária (classificação indicativa, sem caráter vinculante: ADI 2404). A propaganda de tabaco, bebidas alcoólicas, agrotóxicos, medicamentos e terapias se sujeita a restrições legais. A Lei de Imprensa não foi recepcionada (ADPF 130).", "Empresas de comunicação (arts. 222 a 224): propriedade de empresa jornalística e de radiodifusão é privativa de <b>brasileiros natos ou naturalizados há mais de 10 anos</b>, ou de pessoas jurídicas constituídas sob as leis brasileiras com sede no País. A outorga e a renovação de concessão, permissão e autorização de rádio e TV competem ao <b>Poder Executivo</b>, com apreciação do Congresso em 45 dias. A <b>não renovação</b> exige aprovação de <b>2/5</b> do Congresso em votação nominal, e o cancelamento antes do prazo exige <b>decisão judicial</b>. Os prazos são de 10 anos (rádio) e 15 (TV). O Conselho de Comunicação Social é órgão auxiliar do Congresso (art. 224).", "Meio ambiente (art. 225): direito ao ambiente ecologicamente equilibrado, <b>bem de uso comum do povo</b> e essencial à sadia qualidade de vida, com dever de defesa e preservação do Poder Público e da coletividade, para as gerações presentes e futuras. Incumbe ao Poder Público exigir <b>EIA/RIMA</b> para obra potencialmente degradante, definir espaços protegidos (a alteração ou supressão só por <b>lei</b>) e proteger a fauna e a flora, vedadas as práticas cruéis. Condutas lesivas sujeitam a <b>sanções penais e administrativas</b>, sem prejuízo da <b>reparação</b>, para pessoas físicas e jurídicas.", "Meio ambiente (outros parágrafos e jurisprudência): são <b>patrimônio nacional</b> a Floresta Amazônica, a Mata Atlântica, a Serra do Mar, o Pantanal Mato-Grossense e a Zona Costeira. A localização de <b>usinas nucleares</b> se define em lei federal. A EC 96/2017 afasta a crueldade de práticas desportivas que sejam manifestações culturais registradas como patrimônio imaterial. O dano ambiental é <b>imprescritível</b> quanto à reparação (Tema 999). O Município pode legislar sobre meio ambiente no interesse local e <b>suplementar</b>, inclusive de modo mais protetivo (Tema 145).", "Família, criança, adolescente e idoso (arts. 226 a 230): a família tem <b>especial proteção do Estado</b>; o casamento civil é gratuito; a <b>união estável</b> é reconhecida como entidade familiar, assim como a comunidade formada por qualquer dos pais e seus descendentes. O casamento civil pode ser dissolvido pelo <b>divórcio</b>, sem prazo prévio (EC 66/2010). O planejamento familiar é livre decisão do casal. O STF equipara cônjuge e companheiro na sucessão (Tema 809) e reconhece a união homoafetiva (ADI 4277 e ADPF 132).", "Criança e adolescente (arts. 227 a 229): é dever da família, da sociedade e do Estado assegurar, com <b>absoluta prioridade</b>, os direitos à vida, saúde, alimentação, educação, lazer, profissionalização, cultura, dignidade, respeito, liberdade e convivência. O caput do art. 227 inclui também o <b>jovem</b> (EC 65/2010). Os filhos, havidos ou não do casamento, ou por adoção, têm os <b>mesmos direitos</b>, vedada designação discriminatória. São penalmente inimputáveis os menores de <b>18 anos</b> (art. 228). Os pais assistem os filhos menores, e os filhos maiores amparam os pais na velhice, carência ou enfermidade (art. 229).", "Pessoa idosa (art. 230): família, sociedade e Estado têm o dever de amparar as pessoas idosas, defendendo sua dignidade e bem-estar e garantindo o direito à vida. Os programas de amparo são executados <b>preferencialmente em seus lares</b>. Aos <b>maiores de 65 anos</b> é garantida a gratuidade dos transportes coletivos urbanos.", "Povos indígenas (arts. 231 e 232): são reconhecidos aos índios sua organização social, costumes, línguas, crenças e tradições e os <b>direitos originários</b> sobre as terras que tradicionalmente ocupam. Compete à <b>União</b> demarcá-las e protegê-las. As terras são bens da União, de <b>posse permanente</b> dos índios, com <b>usufruto exclusivo</b> das riquezas do solo, rios e lagos. São <b>inalienáveis e indisponíveis</b>, e os direitos sobre elas, <b>imprescritíveis</b>. Os índios, suas comunidades e organizações são <b>partes legítimas</b> para ingressar em juízo, com intervenção do Ministério Público (art. 232).", "Povos indígenas (recursos e remoção): o aproveitamento de recursos hídricos e a lavra de riquezas minerais em terras indígenas só se dão com <b>autorização do Congresso Nacional</b>, ouvidas as comunidades, assegurada a elas participação nos resultados. É <b>vedada a remoção</b> dos grupos, salvo <i>ad referendum</i> do Congresso em caso de catástrofe, epidemia ou interesse da soberania. São nulos os atos de ocupação, domínio e posse sobre essas terras, sem indenização, salvo benfeitorias de boa-fé. No STF, a tese do <b>marco temporal</b> foi afastada no Tema 1031; a Lei 14.701/2023 voltou a adotá-la e está sob discussão na Corte.", "Educação, complementos do texto: o ensino é livre à iniciativa privada, com <b>normas gerais da educação nacional</b> e autorização e avaliação de qualidade pelo Poder Público (art. 209). Conteúdos mínimos para o ensino fundamental, que é ministrado em <b>língua portuguesa</b>, assegurada às comunidades indígenas a língua materna (art. 210, § 2º). Regime de colaboração entre União, Estados, DF e Municípios (art. 211): a União tem função <b>redistributiva e supletiva</b>; Estados e DF atuam no fundamental e médio. Recursos públicos vão às escolas públicas e podem ir a <b>comunitárias, confessionais ou filantrópicas</b> sem fins lucrativos (art. 213). O <b>PNE é decenal</b> (art. 214), com meta de aplicação em educação como proporção do PIB.", "Educação, financiamento (EC 135/2024): vedado usar a receita de impostos vinculada e o salário-educação para <b>aposentadorias e pensões</b> (art. 212, § 7º). A complementação da União ao Fundeb tem 23%: <b>10 pontos</b> (VAAF), <b>10,5</b> (VAAT) e <b>2,5</b> (resultados); no máximo 30% da complementação pode contar para os 18% da União. Estados e Municípios aplicam o Fundeb em seu âmbito prioritário. A partir de <b>2026</b>, ao menos <b>4%</b> dos recursos do Fundeb vão para matrículas em tempo integral (art. 212-A, XV). Metade (<b>50%</b>) dos recursos da complementação VAAT vai para a educação infantil.", "Cultura, ciência e comunicação, complementos: o <b>Plano Nacional de Cultura</b> é plurianual e visa defesa do patrimônio, produção, formação de pessoal, democratização do acesso e valorização da diversidade (art. 215, § 3º); ficam <b>tombados</b> os documentos e sítios dos antigos <b>quilombos</b> (art. 216, § 5º); Estados e DF podem vincular até <b>0,5%</b> da receita tributária líquida a fundo de cultura, sem pagar pessoal ou dívida (§ 6º). O desporto: prioridade ao <b>desporto educacional</b> e tratamento diferenciado entre o profissional e o não profissional (art. 217). Ciência: a lei apoia empresas que invistam em pesquisa e que paguem participação nos ganhos de produtividade <b>desvinculada do salário</b> (art. 218, § 4º); Estados e DF podem vincular parcela da receita a fomento de pesquisa (§ 5º). Entes públicos podem firmar <b>cooperação com entidades privadas</b> (art. 219-A); o SNCTI tem normas gerais federais e legislação concorrente dos demais entes (art. 219-B).", "Comunicação social, complementos: nenhuma restrição à liberdade de informação jornalística, observado o art. 5º, IV, V, X, XIII e XIV (art. 220, § 1º). Os meios de comunicação <b>não podem ser objeto de monopólio ou oligopólio</b> (§ 5º), e a publicação de veículo impresso <b>independe de licença</b> (§ 6º). Rádio e TV atendem a quatro princípios: finalidades educativas, artísticas, culturais e informativas; promoção da cultura nacional e regional; <b>regionalização</b> da produção; respeito aos valores éticos e sociais da pessoa e da família (art. 221). Pelo menos <b>70%</b> do capital total e votante das empresas jornalísticas e de radiodifusão deve pertencer a brasileiros natos ou naturalizados há mais de 10 anos, e a <b>responsabilidade editorial</b> é privativa deles (art. 222, §§ 1º e 2º). A alteração de controle societário é comunicada ao Congresso (§ 5º). O ato de outorga ou renovação só produz efeitos após deliberação do Congresso (art. 223, § 3º).", "Meio ambiente e família, complementos: incumbe ao Poder Público preservar os processos ecológicos, preservar o <b>patrimônio genético</b> e fiscalizar a pesquisa, controlar técnicas e substâncias de risco, promover a <b>educação ambiental</b> em todos os níveis e manter regime fiscal favorecido para biocombustíveis e <b>hidrogênio de baixa emissão</b> (EC 132/2023). Quem explora recursos minerais recupera o ambiente degradado. As <b>terras devolutas</b> necessárias à proteção dos ecossistemas são indisponíveis (art. 225, § 5º). Família: o planejamento familiar é de livre decisão do casal, com vedação de qualquer coerção (art. 226, § 7º); o Estado cria mecanismos para <b>coibir a violência</b> doméstica (§ 8º). Direito de proteção especial da criança e do adolescente (art. 227, § 3º): garantia de acesso do trabalhador adolescente e jovem à escola, defesa técnica na atribuição de ato infracional, e <b>brevidade, excepcionalidade e respeito à condição peculiar</b> na medida privativa de liberdade. A adoção é assistida pelo Poder Público (§ 5º). Estatuto e Plano Nacional da Juventude: § 8º. Terras indígenas: não se aplica o art. 174, §§ 3º e 4º (§ 7º)."], "pega": ["Educação básica obrigatória: dos <b>4 aos 17 anos</b>. A banca fala em 6 a 14 anos, o texto antigo.", "Aplicação mínima em educação: União 18% e demais entes 25% da receita de <b>impostos</b>. A banca troca por 20% ou por receita total.", "Ensino religioso: de <b>matrícula facultativa</b> e pode ser confessional (ADI 4439). A banca diz que é obrigatório ou que só pode ser não confessional.", "Homeschooling: sem lei, não há direito público subjetivo. A banca diz que é direito fundamental autoaplicável ou que é proibido pela Constituição.", "Censura: é vedada, mas a classificação indicativa é permitida e <b>não vincula</b>. A banca diz que a lei pode impor o horário.", "Renovação de concessão de rádio e TV: a não renovação exige <b>2/5</b> do Congresso. O cancelamento antes do prazo exige <b>decisão judicial</b>. A banca troca por maioria absoluta ou por ato do Executivo.", "Terras indígenas: são bens da <b>União</b>, com usufruto exclusivo dos índios. A banca diz que são propriedade dos índios ou que a remoção é livre.", "Idoso: gratuidade no transporte coletivo urbano a partir de <b>65 anos</b> (art. 230, § 2º). A banca fala em 60 anos, idade do Estatuto."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Transação tributária e dívida ativa de Curitiba (LC 141/2023 e Decretos 2.305 e 2.306/2023)", "key": "TRI", "nome": "Tributário", "conc": ["Edital: Direito Tributário, <b>transação tributária e dívida ativa de Curitiba</b>: <b>Lei Complementar 141/2023</b> (transação e autocomposição, que revogou a LC 68/2008) e os <b>Decretos 2.305/2023 e 2.306/2023</b>. Todos foram lidos literalmente no Chrome.", "LC 141/2023 (natureza e competência): a transação é meio de <b>autocomposição</b> de conflitos que envolvam o Município. A <b>Procuradoria-Geral do Município</b> autoriza a transação em <b>juízo de conveniência e oportunidade</b>, e a decisão é <b>irrecorrível</b>. A transação não gera <b>novação</b> do crédito, e a <b>confissão</b> do débito é irretratável. Os agentes públicos que participam do acordo só respondem em caso de <b>dolo ou fraude</b>.", "LC 141/2023 (parcelamento e descontos): parcelamento em até <b>120 parcelas</b>, com correção por <b>IPCA mais 1% ao mês</b>. O atraso superior a <b>60 dias</b> leva à revogação do acordo. Há desconto especial, até <b>100% de juros e multa</b>, para créditos em atraso há mais de <b>7 anos</b> e para devedor em recuperação judicial ou falência. Precatórios podem amortizar a dívida do contribuinte com o Município.", "LC 141/2023 (Município devedor): quando o Município é devedor, a transação pode se dar por <b>chamamento público</b>, com <b>deságio mínimo de 20%</b> sobre o valor do crédito. A lei também cuida da autocomposição por câmaras e mediação.", "Decreto 2.305/2023 (regulamento da transação): parte de princípios como a isonomia, a capacidade contributiva, a razoabilidade e a recuperação de créditos. O pedido é feito pelo sistema <b>PROCEC</b>, e a PGM decide de forma <b>fundamentada e irrecorrível</b>. A <b>rescisão</b> se dá por notificação, com <b>30 dias</b> para regularizar ou impugnar.", "Decreto 2.305/2023 (créditos irrecuperáveis e de baixo valor): são considerados <b>irrecuperáveis</b>, entre outros, créditos inscritos há mais de <b>15 anos</b>, de pessoa jurídica falida e extinta, de CNPJ baixado ou inapto, de devedor falecido sem bens, os suspensos pelo <b>art. 40 da LEF</b> há mais de 3 anos e os alcançados pelo Tema 566 do STJ. São de <b>baixo valor</b> os créditos de até <b>R$ 10.000,00</b>.", "Decreto 2.306/2023 (parcelamento em escala): o número de parcelas varia conforme o valor da dívida, de <b>12 a 120</b>, com degraus em R$ 600, R$ 1.200, R$ 10.000, R$ 50.000, R$ 200.000 e R$ 400.000. A parcela mínima é de <b>R$ 100</b> para o ISS e <b>R$ 50</b> para os demais tributos. A correção é <b>IPCA mais 1% ao mês</b>, e o atraso superior a 60 dias revoga o parcelamento.", "Decreto 2.306/2023 (reparcelamento e honorários): o reparcelamento exige entrada de <b>10% ou 20%</b>. Os honorários são de <b>10%</b> para dívidas em execução e de <b>5%</b> para as protestadas. A desistência de ações judiciais deve ser feita em <b>60 dias</b>, pelo PROCEC. O benefício não alcança débitos do <b>Simples Nacional</b>, e o parcelamento não gera <b>novação</b>.", "Decreto 2.306/2023 (desconto especial): para dívidas inscritas antes de <b>15/11/2016</b>, o pagamento em <b>parcela única</b> reduz 100% de juros e multa; em até 6 parcelas, 90% e 80%; em até 12, 70% e 60%; em até 24, 50% e 40%. O pedido é administrativo quando o ISS é igual ou superior a <b>R$ 1.000.000,00</b> ou os demais tributos, a <b>R$ 500.000,00</b>."], "pega": ["Decisão da PGM: é de <b>conveniência e oportunidade</b> e irrecorrível. A banca diz que cabe recurso hierárquico ao Prefeito.", "Transação e novação: não há novação, e a confissão é irretratável. A banca diz que a transação novaria o crédito.", "Revogação do parcelamento: atraso de <b>mais de 60 dias</b>. A banca troca por 30 ou 90 dias.", "Encargos: IPCA mais 1% ao mês. A banca fala em SELIC ou em TR.", "Parcelas: o teto é de 120 e há <b>escala por valor</b>. A banca diz que qualquer dívida pode ir a 120 parcelas.", "Desconto especial: depende de dívida inscrita <b>antes de 15/11/2016</b> e não vale para o Simples Nacional. A banca estende a todos os débitos.", "Baixo valor: até R$ 10.000,00 no Decreto 2.305. A banca confunde com a parcela mínima de R$ 100 e R$ 50."]}, {"materia": "PROCESSO CIVIL", "titulo": "Mandado de segurança individual e coletivo (Lei 12.016/2009)", "key": "PCV", "nome": "Proc. Civil", "conc": ["Edital: Processo Civil, <b>mandado de segurança individual e coletivo (Lei 12.016/2009)</b>. O texto da lei foi lido no site do Planalto. A suspensão de segurança (art. 15) já foi estudada na rodada 17 e aqui entra só no que for necessário.", "Cabimento (art. 1º): protege <b>direito líquido e certo</b> não amparado por habeas corpus ou habeas data, contra ato ilegal ou abusivo de <b>autoridade</b>, de qualquer categoria. Equiparam-se a autoridade os representantes de <b>partidos políticos</b>, os administradores de autarquias e os dirigentes de pessoas jurídicas ou pessoas naturais no exercício de atribuições do poder público, <b>só quanto a essas atribuições</b>. Não cabe contra <b>atos de gestão comercial</b> de empresas públicas, sociedades de economia mista e concessionárias.", "Descabimento (art. 5º): não se concede MS contra ato que caiba <b>recurso administrativo com efeito suspensivo</b>, independentemente de caução, contra decisão judicial da qual caiba <b>recurso com efeito suspensivo</b>, nem contra decisão judicial <b>transitada em julgado</b>. Súmulas do STF: 266 (não cabe contra lei em tese), 267 (não cabe contra ato judicial passível de recurso ou correição), 268 (não cabe contra decisão transitada em julgado), 269 (MS não substitui ação de cobrança) e 271 (a concessão não produz efeitos patrimoniais pretéritos, que se cobram pela via própria).", "Autoridade coatora (art. 6º): a inicial indica a autoridade e a <b>pessoa jurídica</b> a que ela se vincula. Autoridade coatora é a que <b>praticou o ato</b> ou da qual <b>emanou a ordem</b> (§ 3º). Se o documento estiver em poder de autoridade que se recuse a fornecê-lo, o juiz ordena a exibição em <b>10 dias</b> (§ 1º). A denegação sem exame do mérito permite renovar o pedido dentro do prazo decadencial (§ 6º) ou ir à ação própria (art. 19).", "Prazo (art. 23): o direito de requerer MS se extingue em <b>120 dias</b> contados da <b>ciência</b> do ato. É prazo <b>decadencial</b>, não se suspende nem se interrompe (Súmula 632 do STF: é constitucional a lei que fixa prazo de decadência para o MS; a ADI 4296 também manteve o art. 23).", "Liminar (art. 7º): ao despachar a inicial o juiz notifica a autoridade para informações em <b>10 dias</b>, dá ciência ao órgão de representação judicial da pessoa jurídica e <b>suspende o ato</b> se houver fundamento relevante e risco de ineficácia da medida. A lei prevê caução, fiança ou depósito, mas o STF declarou essa exigência <b>inconstitucional</b> na ADI 4296. Cabe <b>agravo de instrumento</b>. A liminar persiste até a sentença, e o processo ganha <b>prioridade</b>.", "Vedações de liminar (art. 7º, § 2º): não se concede liminar para <b>compensação de créditos tributários</b>, entrega de mercadorias e bens do exterior, <b>reclassificação ou equiparação de servidores</b> e concessão de aumento ou extensão de vantagens. O STF declarou <b>inconstitucional</b> esse § 2º na ADI 4296, mas a Súmula 212 do STJ continua dizendo que a compensação tributária não pode ser deferida em liminar. Confira o enunciado cobrado.", "Procedimento (arts. 7º a 12): decorrido o prazo das informações, o juiz ouve o <b>Ministério Público</b>, que opina em <b>10 dias improrrogáveis</b>, e a sentença deve sair em <b>30 dias</b>. Não se admite litisconsórcio ativo após o despacho da inicial (art. 10, § 2º). Há <b>perempção</b> da liminar se o impetrante deixa de promover atos por mais de <b>3 dias úteis</b> (art. 8º).", "Sentença e recursos (arts. 14 e 18): cabe <b>apelação</b>, e a sentença que concede a segurança sofre <b>reexame necessário</b>. A autoridade coatora também pode recorrer. A sentença concessiva pode ser executada provisoriamente, salvo onde a liminar é vedada. A condenação em <b>honorários não cabe</b> (art. 25; Súmulas 512 do STF e 105 do STJ), sem prejuízo de sanções por má-fé, e não cabem embargos infringentes. O não cumprimento é <b>crime de desobediência</b> (art. 26).", "Mandado de segurança coletivo (arts. 21 e 22): impetram partido político <b>com representação no Congresso</b>, na defesa de interesses de seus integrantes ou de suas finalidades, e organização sindical, entidade de classe ou <b>associação constituída há pelo menos 1 ano</b>, em defesa de direitos de seus membros, <b>sem autorização especial</b> (Súmula 629 do STF; a 630 admite o MS ainda que a pretensão interesse só a parte da categoria). Tutela direitos <b>coletivos</b> (transindividuais, indivisíveis) e <b>individuais homogêneos</b>.", "Efeitos do MS coletivo: a coisa julgada alcança <b>apenas os membros</b> do grupo substituídos. Não induz <b>litispendência</b> para as ações individuais, mas o impetrante individual só se beneficia se <b>desistir</b> da sua ação em <b>30 dias</b> da ciência da impetração coletiva. Pela letra da lei, a liminar só é concedida após a oitiva do representante judicial do ente público, em <b>72 horas</b> (o STF declarou inconstitucional essa exigência de oitiva prévia na ADI 4296).", "Outros pontos: pode-se impetrar por meio eletrônico em urgência, com petição original em <b>5 dias úteis</b> (art. 4º). O terceiro titular de direito decorrente de direito de outro pode impetrar em favor do direito originário se o titular, notificado judicialmente, não o fizer em <b>30 dias</b> (art. 3º). Concedida a ordem, o servidor só recebe vencimentos <b>a partir do ajuizamento</b> (art. 14, § 4º). Os prazos para o recurso contra suspensão pelo presidente do tribunal são de 5 dias (art. 15)."], "pega": ["Prazo de 120 dias: conta da <b>ciência do ato</b> e é decadencial. A banca fala em prazo prescricional ou em contagem da data do ato.", "Honorários: <b>não cabem</b> no MS, mas há multa por litigância de má-fé. A banca diz que são devidos pelo vencido.", "MS contra lei em tese: não cabe (Súmula 266). Cabe contra <b>lei de efeitos concretos</b>. A banca generaliza.", "MS coletivo: associação com <b>1 ano</b> e sem autorização especial. A banca exige autorização de assembleia ou 2 anos.", "Partido político: precisa de <b>representação no Congresso Nacional</b>. A banca dispensa ou exige maioria no Congresso.", "Coisa julgada coletiva: limitada aos membros. O individual precisa desistir em <b>30 dias</b>. A banca troca por 15 dias ou diz que a litispendência é automática.", "Segurança concedida: <b>reexame necessário</b>. A banca diz que depende de recurso da autoridade ou que a sentença denegatória também sofre reexame."]}], "19": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Parcerias público-privadas e concessões (Lei 11.079/2004)", "key": "ADM", "nome": "Administrativo", "conc": ["Edital: item 17 de Direito Administrativo, <b>parcerias público-privadas e concessões</b>. O texto da <b>Lei 11.079/2004</b> foi lido <b>literalmente no Planalto</b> (compilada, no Chrome). A <b>Lei 8.987/1995</b> não foi relida nesta rodada: o que aparece dela abaixo vem do estudo anterior e do conhecimento geral. As leis de Curitiba sobre PPP e PMI (item 18 do plano) ficam para o próximo PDF.", "Conceito (art. 2º): PPP é o <b>contrato administrativo de concessão</b> nas modalidades <b>patrocinada</b> ou <b>administrativa</b>. <b>Patrocinada</b> é a concessão de serviço público ou de obra pública da Lei 8.987 que envolve, além da tarifa paga pelo usuário, <b>contraprestação pecuniária do parceiro público</b>. <b>Administrativa</b> é o contrato de prestação de serviços em que a Administração é a <b>usuária direta ou indireta</b>, ainda que envolva obra ou fornecimento e instalação de bens. A <b>concessão comum</b> (sem contraprestação do parceiro público) <b>não é PPP</b> e continua regida pela Lei 8.987.", "Limites de existência (art. 2º, § 4º): é <b>vedada</b> a PPP com valor inferior a <b>R$ 10 milhões</b> (valor dado pela Lei 13.529/2017; o original era R$ 20 milhões), com prazo de prestação inferior a <b>5 anos</b>, ou que tenha como <b>objeto único</b> o fornecimento de mão de obra, o fornecimento e instalação de equipamentos ou a execução de obra pública. Prazo do contrato (art. 5º, I): <b>mínimo 5 e máximo 35 anos</b>, incluída eventual prorrogação, compatível com a amortização dos investimentos.", "Regime jurídico (art. 3º): a <b>concessão administrativa</b> rege-se pela Lei 11.079 e, adicionalmente, pelos arts. <b>21, 23, 25 e 27 a 39</b> da Lei 8.987 e pelo art. 31 da Lei 9.074/1995. A <b>patrocinada</b> rege-se pela Lei 11.079 e, <b>subsidiariamente</b>, pela Lei 8.987. A concessão comum segue só a Lei 8.987. A lei é de <b>normas gerais</b> de licitação e contratação de PPP e vale para União, Estados, DF e Municípios (art. 1º), inclusive entidades controladas.", "Diretrizes (art. 4º): eficiência no cumprimento das missões do Estado, respeito aos interesses dos destinatários e dos entes privados, <b>indelegabilidade</b> das funções de regulação, jurisdicional, de poder de polícia e de outras atividades exclusivas do Estado, responsabilidade fiscal, transparência, <b>repartição objetiva de riscos</b> e sustentabilidade financeira. A lei veda delegar o que é típico de Estado: não se faz PPP para exercer poder de polícia.", "Contraprestação (arts. 6º e 7º): pode ser paga por <b>ordem bancária</b>, <b>cessão de créditos não tributários</b>, <b>outorga de direitos</b> em face da Administração, <b>outorga de direitos sobre bens públicos dominicais</b> ou outros meios em lei. O contrato pode prever <b>remuneração variável</b> ligada ao desempenho. A contraprestação só é paga <b>depois da disponibilização do serviço</b> (art. 7º), com a faculdade de pagar parcela já fruível. Há ainda o <b>aporte de recursos</b> (art. 6º, § 2º) para obras e bens reversíveis, autorizado no edital (contratos novos) e proporcional às etapas executadas; se o parceiro privado recebeu aporte, <b>não há indenização</b> pelas parcelas ainda não amortizadas desses bens (art. 6º, § 5º).", "Garantias do parceiro público (art. 8º): as obrigações pecuniárias da Administração podem ser garantidas por <b>vinculação de receitas</b> (respeitado o art. 167, IV, da CF), <b>fundos especiais</b> previstos em lei, <b>seguro-garantia</b>, garantia de organismos internacionais ou instituições financeiras, <b>fundo garantidor ou empresa estatal</b> criada para esse fim e outros mecanismos admitidos em lei. A garantia reduz o risco do privado e é o ponto central do equilíbrio financeiro da PPP.", "SPE (art. 9º): antes do contrato deve ser constituída <b>sociedade de propósito específico</b>, que implanta e gere o objeto da parceria. A <b>transferência do controle</b> depende de <b>autorização expressa</b> da Administração. A SPE pode ser companhia aberta, deve ter governança e contabilidade padronizadas e <b>a Administração não pode ser titular da maioria do capital votante</b> (§ 4º). Exceção (§ 5º): aquisição da maioria do capital votante por <b>instituição financeira controlada pelo Poder Público</b> em caso de inadimplemento de contratos de financiamento.", "Licitação (arts. 10 a 12): a contratação é precedida de <b>concorrência</b> (hoje também <b>diálogo competitivo</b>, pela Lei 14.133/2021). A abertura do processo depende de autorização fundamentada em estudo técnico (conveniência, <b>metas fiscais</b>, LRF), estimativa do <b>impacto orçamentário-financeiro</b>, declaração do ordenador de despesa (LDO e LOA), objeto previsto no <b>PPA</b>, licença ambiental ou diretrizes, e <b>consulta pública</b> da minuta de edital e de contrato por no mínimo <b>30 dias</b>, terminando ao menos <b>7 dias</b> antes da publicação do edital. O edital pode prever <b>arbitragem</b> no Brasil e em português e garantia de proposta. Critérios de julgamento: além dos da Lei 8.987, <b>menor valor da contraprestação</b> e <b>combinação com melhor técnica</b>.", "Limite fiscal federal (art. 28): a União não concede garantia nem faz transferência voluntária a Estado, DF ou Município se as despesas continuadas de PPP ultrapassarem <b>5% da receita corrente líquida</b> do ano anterior ou se as despesas anuais dos 10 anos seguintes excederem <b>5% da RCL projetada</b>. A versão original dizia 1%; houve alterações para 3% e depois 5% (a compilada mostra todas as redações).", "Concessão comum (Lei 8.987, de memória): concessão é <b>delegação por prazo determinado</b>, feita pelo poder concedente por concorrência (ou diálogo competitivo), a pessoa jurídica ou consórcio que demonstre capacidade para executá-la <b>por sua conta e risco</b>. Remuneração por <b>tarifa</b>. Extinçã
