<style>
:root{--paper:#faf2d6;--ink:#191916;--gold:#fbdd67;--red:#ff0807;--salmon:#fe6e52;--ring:#b78445;--bar2:#191916;--fs:17px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper)}
body{color:var(--ink);font:var(--fs)/1.5 'Noto Serif','Droid Serif',Georgia,serif;padding:48px 0 56px;min-height:100vh}
.top{position:fixed;top:0;left:0;right:0;height:48px;background:#000;color:var(--gold);z-index:10;display:flex;align-items:center;padding:0 14px;font:500 14px Roboto,Arial,sans-serif}
.top a,.top button{color:var(--gold);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
.top .l{display:flex;align-items:center;gap:6px;min-width:90px;font-size:15px}
.top .c{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.top .r{min-width:90px;text-align:right;font-size:19px}
.bot{position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--bar2);display:flex;align-items:center;justify-content:space-around;z-index:10;padding:0 4px;font:500 15px Roboto,Arial,sans-serif}
.bot a{color:var(--gold);text-decoration:none;padding:16px 4px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bot a.on{border-top:3px solid var(--gold);padding-top:13px;color:#fff3b3}
.page{max-width:720px;margin:0 auto;padding:10px 16px 90px}
.h{color:var(--red);text-align:center;text-transform:uppercase;margin:24px 0 6px;font-size:1em;letter-spacing:.02em}
.sub{text-align:right;font-style:italic;margin:4px 0 14px}
.rub{color:var(--red);margin:20px 0 4px}
.rub small{display:block;color:var(--salmon);font-size:.95em}
.cross{display:flex;align-items:flex-start;gap:8px;margin:18px 0 10px;font-weight:700}
.cross i{flex:none;width:20px;height:20px;margin-top:3px;border-radius:3px;background:var(--salmon);position:relative}
.cross i:before{content:"";position:absolute;left:8px;top:3px;width:4px;height:14px;background:var(--paper)}
.cross i:after{content:"";position:absolute;left:3px;top:8px;width:14px;height:4px;background:var(--paper)}
.cross span em{font-style:normal;color:var(--salmon);font-weight:400}
.v{position:relative;padding-left:20px;margin:0 0 14px}
.v>sup{position:absolute;left:0;top:.45em;font:400 9px/1 Roboto,Arial,sans-serif;color:var(--salmon)}
.v b{font-weight:700}
.p .v>sup{color:var(--red)}
.p .v:before{content:"R.";color:var(--red);margin-right:6px}
.menu a{display:block;text-decoration:none;color:var(--ink);padding:16px 14px 14px;margin:14px 0;border:2px solid var(--ring);border-radius:12px;background:rgba(255,255,255,.35)}
.menu a:active{background:rgba(183,132,66,.18)}
.menu .t{display:block;color:var(--red);font-size:1.2em;font-weight:700}
.menu .m{display:block;margin-top:4px;font-style:italic;font-size:.92em}
.menu .s{display:block;margin-top:6px;font:400 12px Roboto,sans-serif;color:var(--salmon);text-transform:uppercase;letter-spacing:.06em}
.title{text-align:center;margin:18px 0 4px}
.title big{display:block;color:var(--red);font-size:2em;font-weight:700;line-height:1.1}
.nv{display:flex;gap:10px;margin:26px 0 0}
.nv a{flex:1;text-align:center;text-decoration:none;color:var(--gold);background:#000;border-radius:10px;padding:12px 6px;font:500 15px Roboto,Arial,sans-serif}
.nv a.off{opacity:.3;pointer-events:none}

<script>
const D={"10": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Atos Administrativos: Requisitos, Atributos, Espécies e Invalidação", "key": "ADM", "nome": "Administrativo", "conc": ["<b>Conceito:</b> declaração da Administração (ou de quem exerça prerrogativas públicas) que produz <b>efeitos jurídicos imediatos</b>, sob regime de direito público e sujeita a controle judicial. <b>Fato administrativo</b> é a atuação material, sem declaração de vontade (a obra, a apreensão).", "<b>Elementos (requisitos): competência</b> (quem pratica, sempre vinculada e fixada em lei), <b>finalidade</b> (interesse público), <b>forma</b> (modo de exteriorização), <b>motivo</b> (pressuposto de fato e de direito) e <b>objeto</b> (o efeito jurídico produzido). Competência, finalidade e forma são <b>sempre vinculadas</b>. Na discricionariedade, a liberdade está no <b>motivo</b> e no <b>objeto</b>, e é isso o <b>mérito</b> administrativo (conveniência e oportunidade).", "<b>Atributos: presunção de legitimidade e veracidade</b> (relativa, admite prova em contrário), <b>imperatividade</b> (obrigações unilaterais, sem consentimento do destinatário), <b>exigibilidade</b> (coerção indireta, como multa) e <b>autoexecutoriedade</b> (execução direta, sem ordem judicial, só quando a lei prevê ou em urgência). Há doutrina que inclui a <b>tipicidade</b>. Nem todo ato tem todos os atributos: o ato <b>enunciativo</b>, por exemplo, não tem imperatividade.", "<b>Motivação e motivos determinantes:</b> a motivação é a exposição escrita do motivo, exigida no art. 50 da Lei 9.784/1999 para atos que neguem, limitem ou afetem direitos, e pode ser <b>per relationem</b> (concordância com parecer anterior, art. 50, §1º). Pela <b>teoria dos motivos determinantes</b>, o motivo <b>declarado</b> vincula a validade do ato, mesmo se a lei dispensasse a motivação (exoneração <b>ad nutum</b>, art. 37, II, CF). Motivo falso ou inexistente invalida o ato.", "<b>Vício e abuso de poder:</b> o abuso pode ser por <b>excesso de poder</b> (agente extrapola a competência) ou por <b>desvio de finalidade</b> (finalidade alheia ao interesse público). A Lei 4.717/1965 (ação popular, art. 2º) lista cinco vícios: incompetência, vício de forma, ilegalidade do objeto, inexistência dos motivos e desvio de finalidade.", "<b>Extinção do ato: anulação</b> (por ilegalidade, pela Administração ou pelo Judiciário, efeitos <b>ex tunc</b>); <b>revogação</b> (conveniência e oportunidade, só pela Administração, efeitos <b>ex nunc</b>, respeita direitos adquiridos); <b>cassação</b> (o beneficiário descumpre condição); <b>caducidade</b> (norma superveniente torna o ato incompatível); <b>contraposição</b> (novo ato, de competência diversa, com efeito oposto). <b>Súmulas 346 e 473 do STF:</b> a Administração anula os próprios atos ilegais e revoga os inconvenientes, respeitados os direitos adquiridos e o controle judicial.", "<b>Convalidação (art. 55 da Lei 9.784/1999):</b> atos com defeitos <b>sanáveis</b>, que não acarretem lesão ao interesse público nem prejuízo a terceiros, podem ser convalidados. Em regra, o vício de <b>competência</b> (não exclusiva) e o de <b>forma</b> (não essencial) são sanáveis. Vício de <b>motivo, objeto e finalidade</b> não admite convalidação. O art. 54 fixa <b>decadência de cinco anos</b> para anular atos favoráveis aos destinatários, salvo má-fé.", "<b>Classificação e espécies:</b> quanto à formação, ato <b>simples</b> (um órgão), <b>composto</b> (uma vontade com ato de verificação, como o visto) e <b>complexo</b> (duas vontades de órgãos diferentes que se fundem). Espécies: <b>normativos</b> (decreto, regulamento), <b>ordinatórios</b> (portaria, circular, ordem de serviço), <b>negociais</b> (licença, autorização, permissão), <b>enunciativos</b> (certidão, atestado, parecer) e <b>punitivos</b>. <b>Licença</b> é vinculada e definitiva, <b>autorização</b> é discricionária e precária. O parecer pode ser facultativo, obrigatório ou vinculante.", "<b>Controle judicial:</b> o Judiciário examina a <b>legalidade</b>, a <b>razoabilidade</b> e a <b>proporcionalidade</b> do ato, e não o mérito. Pelo <b>Tema 138 do STF</b>, a Administração pode anular atos ilegais, mas, se o ato repercutiu em interesses individuais, é indispensável o <b>devido processo legal</b> (contraditório e ampla defesa). Em concurso público, o Judiciário não substitui a banca na correção de provas, salvo ilegalidade (Tema 485)."], "pega": ["<b>Elementos do ato:</b> competência, finalidade, forma, motivo e objeto. A banca troca <b>objeto</b> por <b>conteúdo</b> sem avisar ou inclui a <b>motivação</b> como elemento.", "<b>Mérito:</b> está em <b>motivo e objeto</b> do ato discricionário. A banca diz que o mérito está na competência.", "<b>Presunção de legitimidade:</b> é <b>relativa</b>. A banca diz absoluta.", "<b>Autoexecutoriedade:</b> não é de todo ato. Exige previsão legal ou urgência. A banca diz que todo ato administrativo é autoexecutório.", "<b>Revogação:</b> efeitos <b>ex nunc</b>, só pela Administração, respeita direitos adquiridos. A banca diz que o Judiciário também revoga ato de outro Poder, ou que revogação retroage.", "<b>Anulação:</b> pelo Judiciário <b>e</b> pela Administração (Súmulas 346 e 473 do STF), com efeitos <b>ex tunc</b>. A banca diz que só o Judiciário anula.", "<b>Cassação e caducidade:</b> cassação é sanção por descumprimento do beneficiário. Caducidade é nova norma tornando o ato incompatível. A banca troca as definições.", "<b>Convalidação:</b> só vícios de competência (não exclusiva) e forma (não essencial). A banca admite convalidar vício de finalidade ou de objeto.", "<b>Licença x autorização:</b> licença é <b>vinculada</b> e definitiva. Autorização é <b>discricionária</b> e precária. A banca inverte.", "<b>Motivos determinantes:</b> vinculam mesmo quando a lei dispensava a motivação (exoneração ad nutum). A banca diz que, sendo dispensada, o motivo declarado não vincula."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Municípios, Lei Orgânica, Câmara Municipal, Contas do Prefeito e Constituição do Paraná", "key": "CON", "nome": "Constitucional", "conc": ["<b>Edital:</b> autonomia dos Municípios e competências municipais, Lei Orgânica do Município de Curitiba e Constituição do Estado do Paraná. <b>Nota:</b> o texto integral da Lei Orgânica de Curitiba e da Constituição do Paraná não estava acessível para consulta. Esta parte se apoia na <b>Constituição Federal</b> (arts. 18, 29 a 31) e na jurisprudência do STF. Confira os textos locais antes da prova.", "<b>Município como ente federativo (art. 18):</b> a CF o reconhece como ente autônomo, com <b>auto-organização</b> pela <b>Lei Orgânica</b>, não pela Constituição. A <b>criação</b> de Município exige lei estadual, dentro do período fixado por <b>lei complementar federal</b>, após estudo de viabilidade e <b>plebiscito</b> com a população dos Municípios envolvidos (art. 18, §4º). Não há Poder Judiciário municipal.", "<b>Lei Orgânica (art. 29):</b> votada em <b>dois turnos</b>, com <b>interstício mínimo de dez dias</b>, e aprovada por <b>dois terços</b> da Câmara, que a promulga. Deve respeitar a CF e a Constituição Estadual (simetria). Não há sanção ou veto do Prefeito. A Lei Orgânica de Curitiba é de <b>1990</b>.", "<b>Prefeito e Vice (art. 29, I a III):</b> eleição no <b>primeiro domingo de outubro</b>, mandato de <b>quatro anos</b>, com <b>segundo turno</b> em Municípios com mais de <b>duzentos mil eleitores</b> (Curitiba se enquadra). A posse é em 1º de janeiro. O Prefeito é julgado pelo <b>Tribunal de Justiça</b> nos crimes comuns (art. 29, X). Pela <b>Súmula 702 do STF</b>, nos crimes da Justiça Federal ou Eleitoral, o julgamento é pelo respectivo tribunal de segundo grau (TRF, TRE).", "<b>Câmara e vereadores:</b> o número é <b>proporcional à população</b>, dentro dos limites do art. 29, IV. Curitiba tem <b>38 vereadores</b>, fixados pela <b>LC Municipal 51/2004</b> (o teto constitucional para sua faixa é 39). O <b>subsídio</b> é fixado por lei de cada legislatura para a seguinte, até <b>75%</b> do subsídio dos deputados estaduais nos Municípios com mais de 500 mil habitantes, e a soma dos subsídios não passa de <b>5% da receita</b> do Município (art. 29, VI e VII). A <b>inviolabilidade</b> cobre opiniões, palavras e votos no exercício do mandato e na circunscrição do Município (art. 29, VIII).", "<b>Despesa da Câmara (art. 29-A):</b> o total é limitado a percentual da receita tributária do ano anterior, conforme a população. Entre 500 mil e 3 milhões de habitantes, o teto é de <b>4,5%</b>. A folha de pagamento da Câmara não passa de <b>70%</b> de seu orçamento. Constitui crime de responsabilidade do Prefeito repassar mais que o permitido, não repassar até o dia <b>20</b> ou repassar menos que o fixado na LOA.", "<b>Fiscalização e contas (art. 31):</b> o controle externo é da <b>Câmara</b>, com o auxílio do <b>Tribunal de Contas</b>. O parecer prévio sobre as contas do Prefeito só deixa de prevalecer por decisão de <b>dois terços</b> da Câmara. No <b>Tema 835</b>, o STF decidiu que a Câmara julga tanto as contas de <b>governo</b> quanto as de <b>gestão</b> do Prefeito, para fins de inelegibilidade. As contas ficam à disposição do contribuinte por <b>sessenta dias</b>. É <b>vedada</b> a criação de Tribunais, Conselhos ou órgãos de contas municipais (art. 31, §4º). As contas de Curitiba contam com o auxílio do TCE-PR.", "<b>Responsabilização e processo legislativo local:</b> o Decreto-Lei 201/1967 distingue os <b>crimes de responsabilidade</b> (julgados pelo Judiciário) das <b>infrações político-administrativas</b> (julgadas pela Câmara, com cassação do mandato). No <b>Tema 917</b>, o STF decidiu que lei de iniciativa parlamentar que cria despesa, mas não trata da estrutura da Administração, das atribuições de seus órgãos nem do regime dos servidores, não usurpa a competência do Chefe do Executivo. A <b>Súmula Vinculante 13</b> veda o nepotismo nos três Poderes.", "<b>Região metropolitana:</b> o Estado pode instituí-la por lei complementar (art. 25, §3º), para integrar a organização, o planejamento e a execução de funções públicas de interesse comum. A <b>Região Metropolitana de Curitiba</b> é exemplo. Na <b>ADI 1842</b>, o STF decidiu que a competência sobre saneamento é <b>compartilhada</b> entre Estado e Municípios da região, sem concentração em um único ente. Para a <b>intervenção</b> estadual em Município, veja o PDF anterior (art. 35 e Súmula 637)."], "pega": ["<b>Lei Orgânica:</b> dois turnos, interstício de dez dias, dois terços. A banca troca por maioria absoluta, um turno ou prevê sanção do Prefeito.", "<b>Municípios:</b> são entes federativos autônomos, mas não têm Poder Judiciário próprio, nem Constituição. A banca diz que têm Constituição municipal.", "<b>Segundo turno:</b> só em Municípios com mais de <b>200 mil eleitores</b>. A banca diz 200 mil habitantes.", "<b>Foro do Prefeito:</b> TJ nos crimes comuns. Se o crime é federal ou eleitoral, vai ao TRF ou TRE (Súmula 702 do STF). A banca diz que é sempre o TJ.", "<b>Contas do Prefeito:</b> a Câmara julga, o Tribunal de Contas emite parecer prévio, e só dois terços o derrubam. A banca diz que o Tribunal de Contas julga, ou que basta maioria simples.", "<b>Contas de gestão:</b> pelo Tema 835, do Prefeito também são julgadas pela Câmara (para inelegibilidade). A banca diz que o Tribunal de Contas julga as de gestão.", "<b>Tribunais de Contas municipais:</b> não podem ser criados (art. 31, §4º), embora os já existentes (São Paulo e Rio de Janeiro) continuem. A banca diz que qualquer Município pode criar.", "<b>Subsídio de vereadores:</b> fixado em uma legislatura para a seguinte, com teto de 75% do deputado estadual (Municípios com mais de 500 mil habitantes). A banca diz que é fixado pelo Prefeito, ou na mesma legislatura.", "<b>Iniciativa parlamentar:</b> lei que cria despesa não tem, por isso só, vício de iniciativa (Tema 917). A banca diz que é sempre inconstitucional."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "ISSQN: Lei Complementar 116/2003 e Lei Complementar Municipal 40/2001", "key": "TRI", "nome": "Tributário", "conc": ["<b>Fundamento:</b> o ISSQN é imposto <b>municipal e do DF</b> (art. 156, III, CF), sobre serviços de qualquer natureza <b>não compreendidos</b> no ICMS (transporte interestadual e intermunicipal e comunicação), <b>definidos em lei complementar</b>. A norma geral é a <b>LC 116/2003</b> (com a <b>LC 157/2016</b>), e em Curitiba a <b>LC Municipal 40/2001</b>. Nota: o texto integral da LC 40/2001 não foi consultado, e os dados locais vêm do portal da Prefeitura.", "<b>Fato gerador:</b> prestar serviço constante da <b>lista anexa</b> da LC 116, ainda que não seja atividade preponderante do prestador (art. 1º). A lista é <b>taxativa</b>, mas comporta <b>interpretação extensiva</b> de seus itens (<b>Tema 296 do STF</b>). Incide também sobre o serviço <b>proveniente do exterior</b> ou ali iniciado (importação, art. 1º, §1º). Ressalvadas exceções da lista, o serviço com fornecimento de mercadoria não sofre ICMS.", "<b>Não incidência (art. 2º): exportação</b> de serviços (o resultado só se verifica no exterior), serviço prestado em <b>relação de emprego</b>, por trabalhadores avulsos e por diretores e membros de conselhos. Serviço desenvolvido no Brasil, cujo resultado aqui se verifique, é tributado, ainda que o contratante esteja no exterior. A <b>Súmula Vinculante 31</b> afasta o ISS sobre <b>locação de bens móveis</b>.", "<b>Alíquotas:</b> a LC 116 fixa o <b>máximo de 5%</b> (art. 8º, II). O <b>mínimo é de 2%</b> (art. 88 do ADCT e art. 8º-A da LC 116, incluído pela LC 157/2016). É <b>vedada</b> isenção, incentivo ou benefício que reduza a carga abaixo de 2%, com exceções expressas (como os subitens 7.02 e 7.05). Em Curitiba, a alíquota varia de <b>2% a 5%</b>, conforme o serviço (art. 4º da LC 40/2001).", "<b>Local da incidência (art. 3º):</b> a regra é o <b>estabelecimento prestador</b> (ou o domicílio do prestador). Há exceções de local da <b>prestação</b>, como a construção civil (local da obra), e a LC 157/2016 levou o imposto ao <b>domicílio do tomador</b> em planos de saúde, cartões e arrendamento mercantil. Esse deslocamento foi questionado no STF (<b>ADI 5835</b>), então confira o julgado atualizado antes da prova. Curitiba cobra ISS de empresas <b>sem inscrição</b> local quando o serviço é devido ao Município.", "<b>Sujeito passivo e responsável:</b> contribuinte é o <b>prestador</b> (art. 5º). A lei pode atribuir a <b>responsabilidade</b> a terceiro vinculado ao fato gerador (art. 6º), como o tomador ou intermediário, inclusive o <b>substituto</b> que retém o imposto. Em Curitiba, os tomadores listados nos <b>arts. 8º e 8º-A da LC 40/2001</b> retêm e recolhem o ISS, em regra com <b>5%</b> sobre o valor do serviço (2% a 5% em hipóteses específicas). O pagamento vence no <b>dia 20</b> do mês seguinte, pelo DAM e pelo sistema eletrônico ISS-Curitiba.", "<b>Base de cálculo:</b> o <b>preço do serviço</b> (art. 7º). Na construção civil, não se incluem os <b>materiais fornecidos pelo prestador</b> (art. 7º, §2º, I) nem as subempreitadas já tributadas. Na <b>industrialização por encomenda</b> destinada à etapa seguinte do ciclo produtivo, o STF afastou o ISS (<b>Tema 816</b>), e a multa moratória não pode exceder <b>20%</b> (<b>Tema 214</b>).", "<b>Sociedades de profissionais:</b> o <b>DL 406/1968</b> (art. 9º, §§ 1º e 3º) permite <b>ISS fixo</b>, por profissional habilitado, às sociedades uniprofissionais de trabalho pessoal, que não tenham natureza empresarial. Perdem o benefício as sociedades que prestam serviço com caráter empresarial ou que têm sócio não habilitado. <b>Súmulas do STJ:</b> o ISS incide em <b>leasing</b> (Súmula 138), em serviços bancários da lista (Súmula 424) e em concreto fornecido por empreitada (Súmula 167).", "<b>Reforma tributária:</b> o ISSQN será <b>substituído pelo IBS</b>, com transição entre <b>2029 e 2032</b> e extinção em 2033, conforme estudado no PDF sobre IBS e CBS. Até lá, as regras de ISS continuam em vigor."], "pega": ["<b>Alíquotas:</b> máxima 5% e mínima 2%. A banca troca por 3%, ou diz que o Município pode conceder isenção que a leve abaixo de 2%.", "<b>Competência:</b> transporte intermunicipal e interestadual é ICMS, não ISS. A banca coloca todo transporte no ISS.", "<b>Lista de serviços:</b> taxativa, mas com interpretação extensiva (Tema 296). A banca diz que é meramente exemplificativa ou que não admite extensão.", "<b>Locação de bens móveis:</b> não incide ISS (SV 31). A banca diz que incide.", "<b>Exportação de serviços:</b> não incide, desde que o resultado se verifique no exterior. A banca diz que a mera contratação por estrangeiro basta.", "<b>Local da incidência:</b> a regra é o estabelecimento prestador, com exceções. A banca diz que sempre é o local da prestação.", "<b>Responsável:</b> a lei pode atribuir ao tomador a retenção (substituição). A banca diz que só o prestador pode ser sujeito passivo.", "<b>Sociedades de profissionais:</b> ISS fixo só para as de trabalho pessoal e sem caráter empresarial. A banca estende a qualquer sociedade de profissionais.", "<b>Multa moratória:</b> o teto razoável é de 20%. A banca diz que 30% ou 100% é legítimo por estar na lei municipal."]}, {"materia": "PROCESSO CIVIL", "titulo": "Recursos: Teoria Geral, Apelação, Agravo e Embargos de Declaração", "key": "PCV", "nome": "Proc. Civil", "conc": ["<b>Princípios: taxatividade</b> (só os recursos do art. 994), <b>singularidade</b> (um recurso por decisão), <b>fungibilidade</b> (admite o recurso errado se não houver erro grosseiro nem má-fé), <b>dialeticidade</b> (o recorrente impugna os fundamentos da decisão), <b>voluntariedade</b> e <b>proibição da reformatio in pejus</b>. O art. 1.001 torna irrecorríveis os <b>despachos</b>.", "<b>Admissibilidade:</b> pressupostos <b>intrínsecos</b> (cabimento, legitimidade e interesse, inexistência de fato impeditivo ou extintivo, como renúncia ou aquiescência) e <b>extrínsecos</b> (tempestividade, regularidade formal e <b>preparo</b>). O prazo é de <b>15 dias úteis</b>, exceto <b>embargos de declaração, de cinco dias</b> (art. 1.003, §5º). A <b>Fazenda Pública</b> e o MP têm prazo em <b>dobro</b>, e a Fazenda é <b>dispensada de preparo</b> (art. 1.007, §1º).", "<b>Efeitos:</b> o <b>devolutivo</b> (art. 1.013) limita a matéria ao que foi impugnado, com <b>profundidade</b> sobre as questões suscitadas (§1º). O <b>suspensivo</b> vale, em regra, para a <b>apelação</b>, salvo nas hipóteses do art. 1.012, §1º (como a sentença que confirma, concede ou revoga tutela provisória). Há também efeitos <b>translativo</b> (questões de ordem pública), <b>expansivo</b> e <b>regressivo</b> (retratação, como no art. 485, §7º).", "<b>Apelação (arts. 1.009 a 1.014):</b> cabe contra a <b>sentença</b>. As interlocutórias <b>não agraváveis</b> não ficam sujeitas à preclusão imediata e devem ser impugnadas em <b>preliminar de apelação</b> ou nas contrarrazões (art. 1.009, §1º). O juízo de <b>admissibilidade</b> é só do tribunal (art. 1.010, §3º). Aplica-se a <b>teoria da causa madura</b> (art. 1.013, §3º), quando o tribunal julga o mérito de imediato se o processo estiver em condições. É cabível a <b>apelação adesiva</b> (art. 997, §2º).", "<b>Agravo de instrumento (art. 1.015):</b> cabe contra as interlocutórias do <b>rol</b> (tutela provisória, mérito, convenção de arbitragem, desconsideração da personalidade jurídica, gratuidade, exibição de documento, exclusão de litisconsorte, intervenção de terceiros, efeito suspensivo dos embargos à execução, ônus da prova e outras previstas em lei) e, no parágrafo único, em liquidação, cumprimento de sentença, execução e inventário. No <b>Tema 988</b>, o STJ fixou a <b>taxatividade mitigada</b>: cabe fora do rol quando houver <b>urgência</b> que torne inútil o exame só na apelação. O recurso é interposto direto no <b>tribunal</b> (art. 1.016), e o relator pode dar <b>efeito suspensivo</b> (art. 1.019, I).", "<b>Agravo interno (art. 1.021):</b> cabe contra decisão <b>monocrática do relator</b>, em <b>15 dias</b>. A decisão que nega provimento ao agravo interno, unânime e manifestamente inadmissível ou improcedente, sujeita o agravante à <b>multa de 1% a 5%</b> do valor da causa, e o pagamento é pressuposto para novo recurso (exceto Fazenda e beneficiário da gratuidade, que pagam ao final).", "<b>Embargos de declaração (arts. 1.022 a 1.026):</b> cabem contra <b>qualquer decisão judicial</b>, para esclarecer <b>obscuridade</b>, eliminar <b>contradição</b>, suprir <b>omissão</b> (inclusive as hipóteses do art. 489, §1º) ou corrigir <b>erro material</b>. <b>Não têm efeito suspensivo</b>, mas <b>interrompem</b> o prazo para outros recursos (art. 1.026). Os embargos protelatórios geram multa de até <b>2%</b>, e a reiteração, de até <b>10%</b>. O <b>prequestionamento ficto</b> (art. 1.025) considera incluídos no acórdão os elementos suscitados nos embargos, ainda que rejeitados.", "<b>Honorários recursais e preparo:</b> o tribunal majora os honorários ao julgar o recurso (art. 85, §11), cumulativamente, até 20% no total. O <b>preparo</b> deve ser comprovado no ato de interposição, e a insuficiência permite <b>complementação em cinco dias</b>. A falta de comprovação gera a intimação para recolhimento em <b>dobro</b> (art. 1.007, §4º), sob pena de <b>deserção</b>. A desistência do recurso <b>independe de anuência</b> do recorrido (art. 998).", "<b>Fazenda Pública em juízo:</b> prazo em dobro para recorrer (art. 183), inclusive nos embargos de declaração (10 dias). A <b>remessa necessária</b> não é recurso e não admite agravamento da condenação à Fazenda (Súmula 45 do STJ). A Fazenda também está dispensada de depósito prévio da multa dos embargos protelatórios, que paga ao final."], "pega": ["<b>Prazos:</b> 15 dias úteis, exceto embargos de declaração (5 dias). A banca diz 15 dias para os embargos, ou dias corridos.", "<b>Embargos de declaração:</b> interrompem o prazo, e não o suspendem. A banca diz suspendem.", "<b>Embargos intempestivos:</b> não interrompem o prazo para os outros recursos. A banca diz que interrompem mesmo se intempestivos.", "<b>Efeito suspensivo:</b> a apelação o tem, em regra. O agravo de instrumento não tem automaticamente, e o relator pode concedê-lo. A banca inverte.", "<b>Juízo de admissibilidade da apelação:</b> é do tribunal, não do juiz de primeiro grau (art. 1.010, §3º). A banca diz que o juiz faz o primeiro exame.", "<b>Agravo de instrumento:</b> o rol do art. 1.015 é taxativo, mas com mitigação pelo Tema 988 do STJ, e não gera preclusão automática se não interposto. A banca diz que o rol é exemplificativo, ou que a preclusão é automática.", "<b>Agravo interno:</b> contra decisão monocrática do relator, em 15 dias. A banca diz que cabe contra acórdão, ou em 5 dias.", "<b>Preparo:</b> insuficiente permite complementação em 5 dias. A falta absoluta leva ao recolhimento em dobro e, se não pago, à deserção. A banca diz que a deserção é imediata nos dois casos.", "<b>Fazenda:</b> prazo em dobro, dispensa de preparo. A banca diz que o prazo em dobro vale para os embargos só em primeira instância, ou que a Fazenda recolhe preparo."]}], "11": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Processo Administrativo: Lei 16.466/2024, Decreto 435/2026 e Prescrição", "key": "ADM", "nome": "Administrativo", "conc": ["<b>Edital:</b> processo administrativo em geral, Lei federal 9.784/1999, Lei Municipal 16.466/2024 e Decreto 435/2026, prescrição da pretensão punitiva e executória, prescrição intercorrente e marcos interruptivos. <b>Nota:</b> o texto da Lei 16.466 não trata de prescrição, então o tema vem da Lei 9.873/1999 (federal) e da jurisprudência do STJ. Confira o texto vigente das normas locais.", "<b>Âmbito (Lei 16.466, art. 1º):</b> normas gerais do processo na Administração <b>direta, autárquica e fundacional</b> de Curitiba. Aplica-se ao Legislativo na função administrativa. O <b>Decreto 435/2026</b> a regulamenta (publicado em 1º/4/2026, revogou o Decreto 1.111/2004) e vale quando o procedimento específico for omisso. O <b>meio eletrônico é obrigatório</b> (art. 2º), e os processos físicos migram em 180 dias. Casos omissos: CPC e Lei 9.784 (art. 74).", "<b>Princípios (art. 7º):</b> legalidade, motivação, razoabilidade, ampla defesa, contraditório, segurança jurídica e verdade material, entre outros. Há <b>impulso de ofício</b>, proibição de cobrar despesas processuais e aplicação da LINDB. <b>Impedimento</b> (parentesco até o 3º grau) e <b>suspeição</b> estão nos arts. 27 a 29. A competência é <b>irrenunciável</b>, com delegação e avocação temporária (arts. 24 a 26).", "<b>Prazos (dias úteis):</b> atos do processo, <b>5 dias</b>, prorrogáveis por igual período (art. 32). Intimação com antecedência mínima de 3 dias (art. 33). <b>Decisão após a instrução: 30 dias</b>, prorrogáveis de forma motivada, com teto de 6 meses (art. 43). <b>Recurso: 15 dias</b> da publicação, recurso único (art. 46). <b>Reconsideração: 15 dias</b> para pedir e 15 para julgar (art. 50). Contagem exclui o dia inicial e inclui o final (art. 51). Prazos suspensos de <b>20/12 a 20/01</b> (art. 75).", "<b>Intimação (art. 35):</b> ordem de meios: correio eletrônico com confirmação de leitura, correio postal e edital. Empresas, agentes públicos e advogados têm cadastro eletrônico obrigatório. A intimação eletrônica se efetiva no <b>dia útil seguinte à consulta</b>, ou no fim de <b>10 dias corridos</b> sem confirmação. Por edital, 3 dias úteis após a publicação. A intimação defeituosa é nula, mas o <b>comparecimento sana</b> o vício.", "<b>Instrução e decisão:</b> provas ilícitas são inadmissíveis (art. 38). O ônus da prova é do interessado quanto ao que alegou (art. 41). Cabem medidas acauteladoras sem prévia manifestação, com oitiva posterior (art. 42). A decisão é motivada, e a motivação pode remeter a pareceres do processo. <b>Recurso:</b> em regra <b>sem efeito suspensivo</b>. As decisões do Prefeito e das autoridades máximas encerram a instância administrativa (art. 46). Recurso abusivo ou protelatório não é conhecido.", "<b>Invalidação (arts. 52 a 59):</b> a Administração <b>deve anular</b> o ato ilegal e <b>pode revogar</b> por conveniência, respeitados os direitos adquiridos. Não se revoga após 5 anos, sem prejuízo ou se o ato é convalidável. <b>Decadência (art. 53):</b> 5 anos para anular ato favorável, salvo <b>má-fé ou ofensa direta à Constituição</b>. Nos efeitos patrimoniais contínuos, o prazo conta do primeiro pagamento. Verbas alimentares recebidas de boa-fé não se devolvem (art. 55). Vedada a invalidação por mudança posterior de orientação geral (art. 59).", "<b>Processo sancionador (arts. 63 e 64):</b> exige indicação dos fatos e do fundamento legal, <b>defesa em 10 dias úteis</b>, manifestação sobre documentos novos em 5 dias úteis e decisão em 30 dias úteis após a instrução. Infrações e sanções dependem de lei (art. 13). A dosimetria considera natureza, gravidade, danos, agravantes, atenuantes e antecedentes.", "<b>Prescrição na esfera federal (Lei 9.873/1999):</b> a pretensão <b>punitiva</b> prescreve em <b>5 anos</b> da prática do ato (ou da cessação, se permanente). Se o fato é crime, vale o prazo penal. A <b>intercorrente</b> ocorre com <b>3 anos</b> de paralisação por pendência de despacho ou julgamento. A <b>executória</b> prescreve em <b>5 anos</b> da constituição definitiva do crédito (art. 1º-A). A lei vale <b>só para a Administração federal</b>. Súmula 467 do STJ: 5 anos, do término do processo, para executar multa ambiental.", "<b>Estados e Municípios (Curitiba):</b> sem lei local, o STJ aplica o <b>Decreto 20.910/1932</b> (5 anos) à pretensão punitiva. Pelo <b>Tema 1.294 do STJ (dez/2025)</b>, esse decreto <b>não trata de prescrição intercorrente</b> e não serve de referência, nem por analogia. <b>Sem lei local específica, não há prescrição intercorrente</b> em processo administrativo estadual ou municipal. A Lei 16.466 não cria essa hipótese. Confira se alguma norma de Curitiba a prevê.", "<b>Marcos interruptivos (art. 2º da Lei 9.873, federal):</b> notificação ou citação do indiciado, ato inequívoco de apuração do fato, decisão condenatória recorrível e tentativa de solução conciliatória. Súmula 633 do STJ: a Lei 9.784 se aplica subsidiariamente a Estados e Municípios, para a decadência, se não houver norma local e específica. A Lei 9.873 vale só no plano federal."], "pega": ["<b>Lei 16.466 × prescrição:</b> a lei local não regula prescrição punitiva, executória ou intercorrente. A banca atribui a ela prazos que são da Lei 9.873, que é federal. Se a questão pede \"conforme a Lei 16.466\", desconfie.", "<b>Dias úteis × corridos:</b> os prazos do processo são em dias úteis. A exceção é o de 10 dias <b>corridos</b> da intimação eletrônica sem leitura (art. 35, §6º). A banca troca.", "<b>Recurso:</b> 15 dias, único, em regra sem efeito suspensivo. A banca diz 10 dias ou diz que suspende automaticamente.", "<b>Decisão:</b> 30 dias, prorrogável motivadamente, com teto de 6 meses. A banca troca para 60 dias ou diz que a prorrogação é livre.", "<b>Decadência (art. 53):</b> 5 anos, salvo má-fé <b>ou ofensa direta à Constituição</b>. A banca esquece a segunda exceção.", "<b>Anular × revogar:</b> anular é dever, revogar é faculdade. A revogação respeita direitos adquiridos e não vale após 5 anos.", "<b>Intimação:</b> o comparecimento sana o defeito. A banca diz que a intimação irregular é sempre nula e não pode ser sanada.", "<b>Intercorrente:</b> os 3 anos de paralisação são da Lei 9.873, federal. Em Estado ou Município, sem lei local, não há intercorrente (Tema 1.294). A banca aplica a lei federal ou o Decreto 20.910.", "<b>Marcos interruptivos:</b> a decisão condenatória só interrompe se for <b>recorrível</b>. A banca inverte ou diz que qualquer despacho interrompe.", "<b>Meio eletrônico:</b> é obrigatório, e não facultativo. O Decreto 435/2026 revogou o Decreto 1.111/2004."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Poder Legislativo, Processo Legislativo e Tribunal de Contas", "key": "CON", "nome": "Constitucional", "conc": ["<b>Edital:</b> organização dos Poderes, Poder Legislativo (organização, atribuições, processo legislativo municipal, imunidades, comissões parlamentares, fiscalização financeira e orçamentária e Tribunal de Contas). Base: CF, arts. 44 a 75, aplicada ao Município por simetria.", "<b>Imunidade material (art. 53, caput):</b> os parlamentares são <b>invioláveis</b>, civil e penalmente, por opiniões, palavras e votos, quando as manifestações têm <b>conexão com o mandato</b> (STF, Tema 469). O <b>vereador</b> tem imunidade material <b>somente no Município</b> e no exercício do mandato (art. 29, VIII). Vereador <b>não tem imunidade formal</b>.", "<b>Imunidade formal (art. 53, §§2º a 8º):</b> o congressista só é preso em <b>flagrante de crime inafiançável</b>, e a Casa decide em 24 horas, por <b>maioria absoluta</b>, se mantém a prisão. Recebida a denúncia por crime após a diplomação, o STF dá ciência à Casa, que pode <b>sustar</b> a ação por maioria absoluta, em 45 dias. Foro no STF para crimes cometidos <b>durante o mandato e relacionados às funções</b> (AP 937).", "<b>CPI (art. 58, §3º):</b> poderes de investigação próprios das autoridades judiciais. Exige <b>requerimento de 1/3</b>, <b>fato determinado</b> e <b>prazo certo</b>. Pode quebrar sigilo bancário, fiscal e de dados telefônicos, com <b>fundamentação</b>. Tem <b>reserva de jurisdição</b>: não decreta busca domiciliar, interceptação telefônica nem prisão (salvo flagrante). As conclusões vão ao MP.", "<b>Processo legislativo (art. 59):</b> emendas, leis complementares, ordinárias, delegadas, medidas provisórias, decretos legislativos e resoluções. <b>Lei complementar:</b> maioria absoluta. <b>Lei ordinária:</b> maioria simples, presente a maioria absoluta. <b>Iniciativa privativa (art. 61, §1º):</b> servidores, organização administrativa, criação de cargos e regime jurídico, por simetria também no Município. <b>Sanção não convalida</b> vício de iniciativa.", "<b>Emendas e veto:</b> emenda parlamentar exige pertinência temática e <b>não pode aumentar despesa</b> em projeto de iniciativa reservada (art. 63). O Presidente tem <b>15 dias úteis</b> para sancionar ou vetar. O veto parcial alcança texto integral de artigo, parágrafo, inciso ou alínea. A derrubada exige <b>maioria absoluta</b> em sessão conjunta, em 30 dias. Em regra, a promulgação é em 48 horas pelo Presidente, e depois pelo Presidente do Senado.", "<b>Medida provisória (art. 62):</b> relevância e urgência. Vigora por <b>60 dias, prorrogáveis por mais 60</b>. Após 45 dias, tranca a pauta. Se não for convertida, perde a eficácia desde a edição, e o Congresso disciplina as relações. É vedada em matéria de <b>nacionalidade, direitos políticos, direito penal e processual, lei complementar</b> e outras (§1º). Não se reedita na mesma sessão legislativa matéria rejeitada ou que perdeu a eficácia.", "<b>Tribunal de Contas (arts. 71 a 75):</b> auxilia o Legislativo no controle externo. Aprecia as contas do Presidente por <b>parecer prévio em 60 dias</b>, julga as contas dos administradores, fiscaliza licitações e aplicação de recursos, <b>sustra atos</b> e aplica sanções. Sustação de <b>contrato</b> é ato do Legislativo, e se ele não decidir em 90 dias, cabe ao Tribunal (art. 71, §§1º e 2º). Súmula Vinculante 3: exige contraditório em atos que afetem interessado, salvo concessão inicial de aposentadoria.", "<b>Composição e jurisprudência:</b> o TCU tem 9 ministros, de 35 a 70 anos, com <b>1/3 indicado pelo Presidente</b> e 2/3 pelo Congresso. Os tribunais de contas podem afastar lei inconstitucional no caso concreto (Súmula 347 do STF). Tema 899: é <b>prescritível</b> o ressarcimento ao erário fundado em decisão de Tribunal de Contas. Tema 835: a Câmara julga as contas do Prefeito. <b>Não se criam</b> novos tribunais de contas municipais."], "pega": ["<b>Imunidade material × formal:</b> a material cobre opiniões, palavras e votos com nexo com o mandato. A formal trata de prisão e processo. O vereador só tem a material, e só na circunscrição do Município.", "<b>Prisão de parlamentar:</b> só em flagrante de crime <b>inafiançável</b>, e a Casa decide em 24 horas. A banca diz \"afiançável\" ou \"48 horas\".", "<b>Sustação da ação:</b> maioria <b>absoluta</b>, em 45 dias, e apenas para crime ocorrido <b>após a diplomação</b>. A banca troca por 2/3.", "<b>CPI:</b> não decreta prisão, nem busca e apreensão domiciliar, nem interceptação telefônica. A banca lhe dá poderes de juiz sem reserva de jurisdição.", "<b>Quórum:</b> lei complementar é maioria <b>absoluta</b>. Ordinária é maioria simples. A banca inverte ou usa 3/5.", "<b>Vício de iniciativa:</b> a sanção do chefe do Executivo não convalida. A banca diz que convalida.", "<b>Veto:</b> 15 dias úteis para decidir, 30 dias para o Congresso apreciar, derrubada por maioria absoluta. A banca diz 15 dias corridos ou 2/3.", "<b>MP:</b> 60 mais 60 dias, tranca a pauta após 45. A banca diz 30 dias, ou que a MP não convertida perde a eficácia só dali em diante.", "<b>Contas do Prefeito:</b> a Câmara julga, o Tribunal de Contas dá parecer prévio, e dois terços o afastam.", "<b>Sustação de contrato:</b> compete primeiro ao Legislativo. O Tribunal de Contas só atua se, em 90 dias, o Legislativo e o Executivo não o fizerem."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "ITBI: Hipóteses, Imunidades, Base de Cálculo e Sujeição Passiva", "key": "TRI", "nome": "Tributário", "conc": ["<b>Edital:</b> ITBI, regra-matriz de incidência, hipóteses de incidência e não incidência, imunidades, sujeição passiva, momento do fato gerador, base de cálculo, arbitramento e LC Municipal 40/2001. <b>Nota:</b> o site da Prefeitura cita também a LC 108/2017 para base e alíquotas. Confira o texto vigente.", "<b>Competência (CF, art. 156, II):</b> Municípios e DF, para a transmissão <b>inter vivos</b>, a <b>título oneroso</b>, de <b>bens imóveis por natureza ou acessão física</b> e de <b>direitos reais sobre imóveis, exceto os de garantia</b>, e a <b>cessão de direitos</b> à aquisição. Não incide na transmissão <b>causa mortis</b> ou por <b>doação</b>, que são ITCMD estadual. Também não incide sobre a <b>hipoteca</b> e outros direitos reais de garantia.", "<b>Fato gerador:</b> ocorre com o <b>registro</b> da transmissão no cartório de imóveis (CC, art. 1.245). O contrato de compra e venda ou o compromisso <b>sem registro</b> não gera o imposto. A competência para o imóvel é do Município da <b>situação do bem</b> (art. 156, §2º, II).", "<b>Imunidade condicionada (art. 156, §2º, I):</b> não incide na transmissão para <b>integralização de capital</b> e na fusão, incorporação, cisão ou extinção de pessoa jurídica, <b>salvo</b> se a atividade preponderante do adquirente for <b>compra e venda, locação ou arrendamento</b> de imóveis. Tema 796 do STF: o valor que <b>excede</b> o capital integralizado <b>sofre incidência</b>. Há ainda as imunidades gerais do art. 150, VI (entes, templos, partidos e outros).", "<b>Sujeito passivo (CTN, art. 42):</b> a lei pode eleger <b>qualquer das partes</b> da operação. Em regra, o <b>adquirente</b> é o contribuinte, e o transmitente pode responder por lei. O tabelião pode responder se não exigir a prova de pagamento (CTN, art. 134, VI). Cabe à lei local definir a sujeição passiva.", "<b>Base de cálculo (CTN, art. 38):</b> o <b>valor venal</b> do imóvel ou dos direitos transmitidos. STJ, Tema 1.113: é o <b>valor de mercado em condições normais</b>, <b>sem vínculo com a base do IPTU</b>. O Município <b>não pode arbitrar previamente</b> a base com valor de referência. O valor declarado pelo contribuinte goza de <b>presunção de veracidade</b>, que só se afasta em <b>processo administrativo</b> (CTN, art. 148).", "<b>Arbitramento:</b> cabe quando o valor declarado ou as informações são <b>omissos ou não merecem fé</b>, com <b>processo regular</b> e contraditório, e não por tabela prévia. Em <b>arrematação judicial</b>, segundo a legislação de Curitiba, a base é o valor da arrematação corrigido pelo IPCA. A base do ITBI <b>não coincide</b> com a do IPTU.", "<b>Alíquotas:</b> o Município fixa em lei. Súmula 656 do STF: é <b>inconstitucional a progressividade</b> do ITBI pelo valor venal. Pode haver alíquotas <b>diferentes pela natureza</b> da operação (por exemplo, financiamento habitacional). Em Curitiba, o site da Prefeitura informa <b>2,7%</b> como alíquota geral, com reduções para imóvel residencial financiado e guia com vencimento em <b>30 dias</b>, sem parcelamento.", "<b>Reforma tributária:</b> a EC 132/2023 <b>manteve</b> o ITBI de competência municipal, e o IBS não o substitui. O ITBI não tem anterioridade especial, e <b>respeita as duas</b> (anual e nonagesimal). A restituição do indébito segue o art. 168 do CTN, em <b>5 anos</b>."], "pega": ["<b>Fato gerador:</b> é o <b>registro</b>, e não a escritura, o contrato ou o compromisso de compra e venda. A banca diz que ocorre com o contrato.", "<b>Doação e herança:</b> são ITCMD, estadual. A banca atribui ao Município.", "<b>Garantia real:</b> a hipoteca <b>não</b> é fato gerador do ITBI. A banca inclui.", "<b>Integralização de capital:</b> imune, mas só até o valor do capital. O excedente paga. Se a atividade preponderante for imobiliária, perde a imunidade.", "<b>Base de cálculo:</b> valor de mercado, e não o venal do IPTU. A banca diz que é o venal do IPTU, ou o valor de referência fixado em decreto (Tema 1.113).", "<b>Arbitramento:</b> só com processo administrativo e motivação. A banca diz que o Município pode fixar a base previamente por pauta.", "<b>Alíquota progressiva:</b> inconstitucional (Súmula 656). A banca admite se for pelo valor do imóvel.", "<b>Sujeito passivo:</b> qualquer das partes, conforme a lei. A banca diz que só o transmitente, ou que só o adquirente por força do CTN.", "<b>Local:</b> Município da situação do imóvel (art. 156, §2º, II). A banca diz domicílio do adquirente ou do tabelionato.", "<b>Anterioridade:</b> o ITBI respeita a anual e a nonagesimal. A banca diz que escapa da nonagesimal, o que é regra do IPTU (base de cálculo)."]}, {"materia": "PROCESSO CIVIL", "titulo": "REsp, RE, IRDR, IAC, Reclamação, Precedentes e Ação Rescisória", "key": "PCV", "nome": "Proc. Civil", "conc": ["<b>Edital:</b> recurso especial e extraordinário, IRDR, IAC, reclamação, precedentes judiciais e ação rescisória (CPC, arts. 926 a 928, 947, 976 a 993, 994 e 1.029 a 1.044, 966 a 975).", "<b>Recurso especial (CF, art. 105, III):</b> cabe contra <b>acórdão</b> de TJ ou TRF em única ou última instância para: contrariar tratado ou lei federal ou negar-lhes vigência; julgar válido ato de governo local contestado em face de lei federal; ou dar interpretação divergente de outro tribunal. Interpõe-se no tribunal de origem, em <b>15 dias úteis</b>, e o STJ examina o direito <b>federal infraconstitucional</b>.", "<b>Recurso extraordinário (art. 102, III):</b> contra decisão de única ou última instância que contrarie a <b>Constituição</b>, declare inconstitucional tratado ou lei federal, julgue válida lei ou ato local contestado em face da Constituição, ou julgue válida lei local contestada em face de lei federal. Exige <b>repercussão geral</b> (art. 1.035). Há repercussão presumida quando o acórdão contraria súmula ou jurisprudência dominante do STF ou declara a inconstitucionalidade de tratado ou lei federal. Só <b>2/3</b> dos ministros a recusam.", "<b>Requisitos e óbices: prequestionamento</b> (Súmulas 282 e 356 do STF e 211 do STJ). Súmula <b>7 do STJ</b> e <b>279 do STF</b> vedam reexame de prova. Súmula 5 do STJ veda interpretar cláusula contratual. Súmula 280 do STF veda RE por ofensa a lei local. Súmulas 283 e 284 do STF tratam de fundamento suficiente não impugnado e deficiência de fundamentação. Prequestionamento ficto: art. 1.025.", "<b>Repetitivos (arts. 1.036 a 1.041):</b> o presidente do tribunal de origem seleciona dois ou mais recursos representativos, e o STJ ou STF afeta a questão. Os demais ficam <b>suspensos</b>. Publicado o acórdão, os recursos sobrestados seguem a tese, ou o tribunal de origem aplica ou reexamina. A tese <b>vincula</b> os juízes e tribunais (art. 927, III).", "<b>IRDR (arts. 976 a 987):</b> exige <b>efetiva repetição</b> de processos com a mesma <b>questão de direito</b> e <b>risco de ofensa à isonomia e à segurança jurídica</b>. Legitimados: juiz ou relator (ofício), partes, MP e Defensoria. Não cabe se um tribunal superior já afetou recurso repetitivo sobre a questão. <b>Suspende</b> os processos por até <b>1 ano</b>, e a desistência não o impede. Julgado no <b>tribunal</b>, a tese vale em sua área, e o REsp ou RE contra o julgamento tem efeito suspensivo e <b>repercussão geral presumida</b>.", "<b>IAC (art. 947):</b> cabe para <b>relevante questão de direito, com grande repercussão social</b>, <b>sem repetição em múltiplos processos</b>. É o que o distingue do IRDR. O acórdão <b>vincula</b> juízes e órgãos fracionários.", "<b>Reclamação (arts. 988 a 993):</b> preserva competência, garante a autoridade das decisões, e garante a observância de <b>súmula vinculante</b>, de decisão do STF em <b>controle concentrado</b> e de acórdão de <b>IRDR ou IAC</b>. <b>Não cabe</b> contra decisão <b>transitada em julgado</b>. Contra acórdão em RE com repercussão geral ou em repetitivo, só após <b>esgotadas as instâncias ordinárias</b> (§5º, II).", "<b>Precedentes (arts. 926 e 927):</b> a jurisprudência deve ser <b>estável, íntegra e coerente</b>. Os juízes observam: decisões do STF em controle concentrado, súmulas vinculantes, acórdãos de IAC, IRDR e repetitivos, súmulas do STF em matéria constitucional e do STJ em infraconstitucional, e a orientação do plenário ou órgão especial. É possível <b>distinguir</b> e <b>superar</b>, com fundamentação. A modificação de tese pode ser <b>modulada</b> (§3º).", "<b>Ação rescisória (arts. 966 a 975):</b> cabe contra <b>decisão de mérito transitada</b> em julgado, e também contra decisão sem mérito que impeça nova propositura ou admissibilidade de recurso. Hipóteses: prevaricação, concussão ou corrupção; juiz impedido ou incompetente; dolo ou coação; <b>coisa julgada</b>; <b>violação manifesta de norma jurídica</b>; prova falsa; <b>prova nova</b>; erro de fato. Prazo de <b>2 anos</b> do trânsito em julgado da <b>última decisão</b> (Súmula 401 do STJ). Na prova nova, o prazo é de 2 anos da descoberta, com limite de 5 anos do trânsito em julgado da última decisão. Exige <b>depósito de 5%</b> do valor da causa. Súmula 343 do STF não se aplica a matéria constitucional."], "pega": ["<b>REsp × RE:</b> o REsp é para lei federal e vai ao STJ. O RE é para a Constituição e vai ao STF. A banca troca. Os dois são interpostos <b>no tribunal de origem</b>.", "<b>Reexame de prova:</b> Súmula 7 do STJ e Súmula 279 do STF vedam. A banca diz que o REsp pode reanalisar fatos.", "<b>Repercussão geral:</b> só 2/3 dos ministros a recusam. A banca diz maioria simples ou absoluta. A presumida vale para contrariedade a súmula ou jurisprudência dominante.", "<b>Prequestionamento:</b> basta o ficto do art. 1.025 se o tribunal supre a omissão ou se os embargos foram opostos. A banca diz que é inexigível.", "<b>IRDR × IAC:</b> o IRDR exige repetição de processos e risco à isonomia. O IAC tem grande repercussão social sem repetição. A banca troca.", "<b>IRDR e afetação:</b> não cabe se um tribunal superior já afetou o repetitivo. A suspensão dura 1 ano. A banca diz que dura indefinidamente.", "<b>Reclamação:</b> não cabe contra decisão transitada em julgado. A banca diz que cabe a qualquer tempo.", "<b>Rescisória:</b> 2 anos da última decisão, 5% de depósito. A banca diz que o prazo corre da primeira decisão ou que o prazo é de 5 anos.", "<b>Súmula 343 do STF:</b> não vale para matéria constitucional. A banca diz que vale sempre.", "<b>Precedente vinculante:</b> o juiz pode distinguir ou superar com fundamentação. A banca diz que o precedente nunca pode ser afastado."]}], "12": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "Direito Administrativo Sancionador", "key": "ADM", "nome": "Administrativo", "conc": ["<b>Edital:</b> poder de polícia e poder disciplinar, princípios do direito sancionador, devido processo administrativo, sanções da Lei 14.133/2021, Lei Anticorrupção (12.846/2013), improbidade e prescrição. <b>Nota:</b> a legislação local de Curitiba (estatuto dos servidores e leis de posturas) deve ser conferida no texto vigente.", "<b>Ideia central:</b> o direito administrativo sancionador aplica à Administração, com adaptações, as garantias do direito penal: <b>legalidade, tipicidade, culpabilidade, proporcionalidade, contraditório, ampla defesa</b> e motivação. A tipicidade é <b>mais flexível</b> que a penal: aceita normas em branco e conceitos indeterminados, desde que a conduta e a sanção estejam previstas em lei.", "<b>Poder de polícia:</b> ciclo de <b>ordem, consentimento, fiscalização e sanção</b>. Atributos: discricionariedade, <b>autoexecutoriedade</b> (nem sempre) e coercibilidade. O STF admite delegação a estatal de direito privado só se for de capital majoritariamente público, prestadora exclusiva de serviço público de atuação própria do Estado e em regime não concorrencial (Tema 532).", "<b>Defesa técnica:</b> a <b>Súmula Vinculante 5</b> diz que a falta de defesa técnica por advogado no processo administrativo disciplinar <b>não ofende</b> a Constituição. A Súmula 343 do STJ, que exigia advogado, foi superada. O contraditório e a ampla defesa continuam obrigatórios. A <b>Súmula Vinculante 21</b> proíbe exigir depósito ou arrolamento prévio para recurso administrativo.", "<b>Independência das instâncias:</b> a sanção administrativa pode correr em paralelo à penal e à civil. A absolvição criminal só vincula a Administração se reconhecer <b>inexistência do fato ou negativa de autoria</b>. Se sobra <b>falta residual</b>, a punição administrativa é possível (Súmula 18 do STF).", "<b>Servidor (STJ):</b> a Súmula 650 afasta a discricionariedade: configuradas as hipóteses do art. 132 da Lei 8.112, a pena é a <b>demissão</b>. A Súmula 651 permite demitir por improbidade <b>sem condenação judicial prévia</b>. A Súmula 592 diz que o excesso de prazo no PAD só gera nulidade se houver <b>prejuízo à defesa</b>.", "<b>Prescrição da pretensão punitiva:</b> na esfera federal, a Lei 9.873/1999 fixa <b>5 anos</b> da prática do fato (ou da cessação, se permanente). Se o fato também for crime, vale o <b>prazo penal</b>. Há <b>prescrição intercorrente de 3 anos</b> se o processo ficar parado pendente de julgamento ou despacho. Para Estados e Municípios sem lei própria, o STJ aplica por analogia o <b>Decreto 20.910/1932 (5 anos)</b>. A Súmula 467 do STJ trata da execução da multa ambiental: 5 anos do fim do processo administrativo.", "<b>Súmula 635 do STJ (servidor federal):</b> o prazo do art. 142 da Lei 8.112 começa quando a autoridade competente toma conhecimento do fato, é interrompido com a instauração do PAD e volta a correr por inteiro <b>após 140 dias</b> da interrupção.", "<b>Lei 14.133/2021 (licitações), sanções do art. 156:</b> advertência, multa, <b>impedimento de licitar e contratar</b> (até 3 anos) e <b>declaração de inidoneidade</b> (3 a 6 anos). A defesa prévia é de <b>15 dias úteis</b>. A inidoneidade, no Executivo, é de competência exclusiva de Ministro, Secretário estadual ou Secretário municipal. A pretensão punitiva prescreve em <b>5 anos</b> da ciência da infração. Há previsão de desconsideração da personalidade jurídica e de reabilitação.", "<b>Lei Anticorrupção (12.846/2013):</b> responsabilidade <b>objetiva</b>, administrativa e civil, da pessoa jurídica. Multa de <b>0,1% a 20% do faturamento bruto</b> do último exercício anterior à instauração do PAR, nunca inferior à vantagem obtida. Sem faturamento, multa de R$ 6 mil a R$ 60 milhões. Também há publicação extraordinária da decisão. Os dirigentes respondem na medida da culpabilidade (subjetiva). Prescrição de 5 anos da ciência da infração. Acordo de leniência atenua as sanções.", "<b>Improbidade (Lei 8.429/1992, após Lei 14.230/2021):</b> exige <b>dolo</b>, a modalidade culposa foi extinta. A sanção é <b>judicial</b>, aplicada em ação própria, e não no processo administrativo. Prescrição de <b>8 anos</b> do fato, com prescrição intercorrente de 4 anos. No Tema 1.199, o STF decidiu que a exigência de dolo vale para casos em curso sem condenação definitiva, mas o <b>novo regime de prescrição não retroage</b>. Ressarcimento: imprescritível se decorrente de ato doloso de improbidade (Tema 897) e prescritível se fundado só em decisão de Tribunal de Contas (Tema 899)."], "pega": ["<b>Defesa técnica:</b> a prova costuma dizer que o PAD exige advogado (Súmula 343 do STJ). Está superada pela SV 5. Mas o contraditório e a ampla defesa são obrigatórios.", "<b>Instâncias independentes:</b> a banca afirma que a absolvição penal sempre livra o servidor. Só vincula se for por inexistência do fato ou negativa de autoria. Falta residual pode ser punida (Súmula 18 do STF).", "<b>Lei 9.873/1999 é federal:</b> a banca aplica os 5 anos dela ao Município. Para entes sem lei própria, o STJ usa por analogia o Decreto 20.910/1932. Cuidado com a correta esfera.", "<b>Fato que também é crime:</b> o prazo prescricional da infração administrativa passa a ser o da lei penal, não os 5 anos.", "<b>Súmula 635 do STJ:</b> a pegadinha troca o prazo de 140 dias por 120 ou 180, ou diz que a interrupção zera para sempre. O prazo volta a correr por inteiro.", "<b>Excesso de prazo no PAD</b> não anula o processo automaticamente (Súmula 592 do STJ). Exige prejuízo à defesa.", "<b>SV 21:</b> é inconstitucional exigir depósito prévio para recorrer administrativamente. A banca troca por SV 28, que trata de crédito tributário em juízo.", "<b>Demissão por improbidade:</b> o STJ (Súmula 651) autoriza a Administração a demitir sem condenação judicial prévia. A improbidade da Lei 8.429, porém, só se aplica em ação judicial.", "<b>Lei Anticorrupção:</b> a multa incide sobre o <b>faturamento bruto</b>, não sobre o lucro. A responsabilidade da pessoa jurídica é objetiva, a dos dirigentes é subjetiva.", "<b>Sanções da Lei 14.133:</b> impedimento é de até 3 anos, inidoneidade de 3 a 6 anos. A defesa é de 15 dias úteis, não corridos. A banca troca os números.", "<b>Improbidade e ressarcimento:</b> a nova lei exige dolo, mas o novo prazo prescricional não retroage (Tema 1.199). Ressarcimento por ato doloso de improbidade é imprescritível (Tema 897), enquanto o baseado só em acórdão do Tribunal de Contas prescreve (Tema 899)."]}, {"materia": "DIREITO CONSTITUCIONAL", "titulo": "Poder Executivo, Poder Judiciário e CNJ", "key": "CON", "nome": "Constitucional", "conc": ["<b>Edital:</b> Poder Executivo (Presidente, Ministros, responsabilidade, poder regulamentar e medidas provisórias), Poder Judiciário (órgãos, garantias, estatuto da magistratura) e Conselho Nacional de Justiça.", "<b>Eleição do Presidente (arts. 77 e 82):</b> dois turnos, maioria absoluta dos votos válidos. Mandato de <b>4 anos</b>, com posse em <b>5 de janeiro</b> (EC 111/2021). Uma só reeleição consecutiva. Os governadores tomam posse em <b>6 de janeiro</b>. Para o Presidente, há 35 anos de idade mínima, e a ausência do país por mais de <b>15 dias</b> exige licença do Congresso (art. 83).", "<b>Vacância (art. 81):</b> se vagar nos <b>2 primeiros anos</b>, a eleição é <b>direta, em 90 dias</b>. Nos <b>2 últimos anos</b>, a eleição é <b>indireta, pelo Congresso, em 30 dias</b>. O eleito apenas completa o período do antecessor (mandato-tampão). Em impedimento, assumem: Vice, Presidente da Câmara, do Senado e do STF.", "<b>Responsabilidade do Presidente (arts. 51, I; 52, I; 86):</b> a <b>Câmara autoriza por 2/3</b> a instauração do processo. Nos <b>crimes comuns</b>, o julgamento é do STF. Nos <b>crimes de responsabilidade</b>, é do Senado. O Presidente fica suspenso quando o STF recebe a denúncia (comuns) ou o Senado instaura o processo (responsabilidade). Se o julgamento não terminar em <b>180 dias</b>, cessa o afastamento. Não há prisão cautelar antes de sentença condenatória (§3º), e há imunidade temporária por atos estranhos ao mandato (§4º).", "<b>Governadores e Prefeitos:</b> a cláusula de irresponsabilidade penal e a vedação de prisão cautelar são exclusivas do Presidente, e as constituições estaduais não podem estendê-las. O STJ julga governadores por crimes comuns (art. 105, I, a). Segundo o STF (ADI 5540), a autorização da Assembleia <b>não é exigida</b> para receber a denúncia. Os crimes de responsabilidade são de competência legislativa da <b>União</b> (SV 46). O Prefeito responde por crimes comuns no TJ (art. 29, X), e as infrações político-administrativas (DL 201/1967) são julgadas pela Câmara.", "<b>Poder regulamentar (art. 84):</b> o decreto regulamentar dá fiel execução às leis. O <b>decreto autônomo</b> só pode dispor sobre organização e funcionamento da administração, sem aumento de despesa nem criação ou extinção de órgãos, e extinção de funções ou cargos <b>vagos</b> (VI). Pode delegar a Ministros, PGR e AGU as atribuições dos incisos VI, XII e XXV, primeira parte (parágrafo único).", "<b>Medida provisória (art. 62):</b> relevância e urgência. Vigência de <b>60 dias, prorrogável por 60</b>, e trancamento da pauta a partir do 46º dia. Vedada em matérias como nacionalidade, direitos políticos, direito penal e processual, organização do Judiciário e MP, e confisco de poupança. Se rejeitada ou perder eficácia, <b>não pode ser reeditada</b> na mesma sessão legislativa. O STF proíbe os chamados jabutis na conversão (ADI 5127).", "<b>Ministros de Estado (arts. 50 e 87):</b> brasileiros maiores de 21 anos, no exercício dos direitos políticos. Podem ser convocados pela Câmara ou Senado, e a ausência sem justificativa é crime de responsabilidade. Prazo de 30 dias para informações. Julgados pelo STF nos crimes comuns e de responsabilidade, salvo conexão com o Presidente, caso em que o Senado julga (art. 52, I).", "<b>Órgãos do Judiciário (art. 92):</b> STF, <b>CNJ</b>, STJ, TST, TRFs e Juízes Federais, Tribunais e Juízes do Trabalho, Eleitorais, Militares e dos Estados. STF: 11 Ministros, de 35 a 70 anos, notável saber jurídico, <b>brasileiros natos</b>, nomeados pelo Presidente após aprovação por maioria absoluta do Senado. STJ: no mínimo 33, de 35 a 65 anos. Quinto constitucional: advogados e MP, com mais de 10 anos de carreira, lista sêxtupla, tríplice e nomeação em 20 dias.", "<b>Garantias e vedações dos juízes:</b> vitaliciedade (após 2 anos, perda só por sentença transitada em julgado), inamovibilidade (exceto interesse público, por maioria absoluta do tribunal ou do CNJ) e irredutibilidade de subsídio. Vedações: outro cargo, salvo uma de magistério, custas, atividade político-partidária e <b>quarentena de saída de 3 anos</b> para advogar no juízo ou tribunal em que atuou. Ingresso por concurso com a OAB em todas as fases e <b>3 anos de atividade jurídica</b>. Estatuto da magistratura: lei complementar de iniciativa do STF.", "<b>Art. 93:</b> decisões fundamentadas e julgamentos públicos, sob pena de nulidade. Decisões administrativas dos tribunais são motivadas, e as punições exigem maioria absoluta. Tribunais com mais de 25 julgadores podem criar <b>órgão especial</b> de 11 a 25 membros. Atividade jurisdicional ininterrupta, com distribuição imediata dos processos.", "<b>CNJ (art. 103-B): 15 membros</b>, mandato de <b>2 anos</b>, uma recondução. Nomeados pelo Presidente da República, após aprovação por <b>maioria absoluta do Senado</b>. Presidido pelo <b>Presidente do STF</b>, e o <b>Corregedor Nacional</b> é Ministro do STJ. Composição: magistrados de vários ramos, 1 membro do MPU, 1 do MP estadual, 2 advogados indicados pela OAB e 2 cidadãos, um indicado pela Câmara e outro pelo Senado.", "<b>Atribuições do CNJ:</b> controle da atuação <b>administrativa e financeira</b> do Judiciário e do cumprimento dos deveres funcionais dos juízes. Edita atos regulamentares (a Resolução sobre nepotismo foi validada na ADC 12), recebe reclamações, avoca processos disciplinares e revê processos disciplinares julgados há <b>menos de 1 ano</b>. Elabora relatório anual. O CNJ <b>não exerce jurisdição</b> e <b>não controla o STF</b> (ADI 3367). Sua competência disciplinar é <b>concorrente</b> à dos tribunais (ADI 4638). Os atos do CNJ são questionados no <b>STF</b> (art. 102, I, r)."], "pega": ["<b>Vacância:</b> a banca troca os prazos e os modos. Primeira metade do mandato: eleição direta em 90 dias. Segunda metade: indireta, em 30 dias. O sucessor só completa o período.", "<b>Cláusula de irresponsabilidade:</b> vale apenas para o Presidente. Não se estende a Governadores, nem pode ser criada por constituição estadual. Autorização da Assembleia para processar governador também não é obrigatória (ADI 5540).", "<b>Crime de responsabilidade:</b> a competência para legislar é privativa da União (SV 46 e Súmula 722 do STF). Estado ou Município não pode defini-los.", "<b>Foro:</b> Presidente e Ministros de Estado, nos crimes comuns, no STF. Governador no STJ. Prefeito no TJ, salvo crime federal (TRF) ou eleitoral (TRE, Súmula 702 do STF).", "<b>Decreto autônomo:</b> só nos casos do art. 84, VI. A banca amplia para tudo que não contraria lei. Não pode aumentar despesa nem criar ou extinguir órgãos.", "<b>Medida provisória:</b> os prazos de 60 + 60 dias são contados sem os recessos. A rejeitada não pode ser reeditada na mesma sessão legislativa. A pegadinha troca por 30 dias ou por legislatura.", "<b>CNJ sem jurisdição:</b> não julga processos, não revê decisões judiciais e não controla o STF. A ação contra ato do CNJ vai ao STF.", "<b>Competência disciplinar do CNJ:</b> é concorrente e originária (ADI 4638), e não apenas subsidiária. A revisão disciplinar tem o limite de 1 ano.", "<b>Composição do CNJ:</b> 15 membros, 2 anos, uma recondução. O Presidente do STF preside, e o Corregedor é do STJ. A banca troca para 17 membros ou Corregedor do STF.", "<b>Ingresso e quarentena:</b> 3 anos de atividade jurídica para ingresso (não 5) e 3 anos de quarentena de saída. Quinto constitucional só com mais de 10 anos."]}, {"materia": "DIREITO TRIBUTÁRIO", "titulo": "Taxas, Contribuição de Melhoria e COSIP", "key": "TRI", "nome": "Tributário", "conc": ["<b>Edital:</b> taxas (poder de polícia e serviços públicos), contribuição de melhoria e contribuição para o custeio do serviço de iluminação pública (COSIP). <b>Nota:</b> as taxas locais de Curitiba (Código Tributário e leis complementares) devem ser conferidas no texto vigente.", "<b>Taxa (art. 145, II, da CF e arts. 77 a 80 do CTN):</b> tributo <b>vinculado</b> a atividade estatal. Fato gerador: exercício regular do <b>poder de polícia</b> ou utilização, efetiva ou <b>potencial</b>, de serviço público <b>específico e divisível</b>, prestado ao contribuinte ou posto à sua disposição. O serviço potencial é o de utilização compulsória, posto à disposição por atividade administrativa em efetivo funcionamento.", "<b>Específico e divisível:</b> serviço específico tem destinatário determinado (uti singuli). Divisível é o que pode ser utilizado separadamente por cada usuário. Serviços gerais, como segurança pública e limpeza de vias, são indivisíveis (uti universi), pagos por impostos. O STF considerou inconstitucional taxa de segurança e de combate a incêndio (Tema 16) e de limpeza de vias.", "<b>Base de cálculo:</b> não pode ser a de impostos (art. 145, §2º, da CF) nem se basear no capital das empresas (art. 77, parágrafo único, do CTN). A <b>SV 29</b> permite usar <b>um ou mais elementos</b> da base de um imposto, desde que não haja identidade integral. A <b>SV 19</b> aceita a taxa de coleta de lixo, que só pode custear a coleta, remoção e tratamento de resíduos de imóveis.", "<b>Poder de polícia (art. 78 do CTN):</b> considera-se regular o exercido pelo órgão competente nos limites da lei, com processo legal e sem abuso ou desvio de poder. Na taxa de renovação de licença de funcionamento, o STF exige <b>órgão e estrutura em efetivo funcionamento</b>, sem necessidade de fiscalização individual em cada caso (Tema 217).", "<b>Taxa x tarifa:</b> a Súmula 545 do STF diz que a taxa é <b>compulsória</b> e depende de lei, e o preço público é facultativo e contratual. A Súmula 412 do STJ trata da repetição de tarifas de água e esgoto, sujeita ao Código Civil. Outras súmulas: a <b>SV 12</b> proíbe taxa de matrícula em universidade pública; a <b>Súmula 667 do STF</b> proíbe taxa judiciária sem limite sobre o valor da causa. Custas e emolumentos são taxas.", "<b>Imunidades:</b> a imunidade recíproca (art. 150, VI) cobre <b>impostos</b>, não taxas. Há gratuidade constitucional de petição, certidões e registro civil de nascimento e óbito para pobres (art. 5º, XXXIV e LXXVI). A destinação do produto é irrelevante para a natureza do tributo (art. 4º do CTN).", "<b>Contribuição de melhoria (art. 145, III, da CF; arts. 81 e 82 do CTN; DL 195/1967):</b> fato gerador é a <b>valorização imobiliária</b> decorrente de <b>obra pública</b>. Exige valorização <b>efetiva</b> e nexo com a obra. Tem dois limites: o <b>total</b> (o custo da obra) e o <b>individual</b> (o acréscimo de valor de cada imóvel).", "<b>Requisitos do art. 82 do CTN: edital prévio</b> com memorial descritivo, orçamento do custo, parcela do custo a financiar, zona beneficiada e fator de absorção da valorização, e prazo de <b>30 dias</b> para impugnação, com processo administrativo de instrução e julgamento. Sem esses requisitos, a cobrança é nula. Prescrição de 5 anos (art. 174 do CTN).", "<b>COSIP (art. 149-A da CF, EC 39/2002):</b> Municípios e DF podem instituir, <b>por lei</b>, contribuição para o custeio do serviço de iluminação pública. A EC 132/2023 ampliou a finalidade para expansão, melhoria e sistemas de monitoramento. Deve obedecer à legalidade, à anterioridade e à noventena (art. 150, I e III). Pode ser cobrada na <b>fatura de energia elétrica</b>. A <b>SV 41</b> proíbe taxa de iluminação pública, e o STF reconheceu a COSIP como tributo <b>sui generis</b> constitucional (Tema 7). Admite alíquotas progressivas pelo consumo.", "<b>COSIP em Curitiba (LC 46/2002, alterada pela LC 129/2021):</b> fato gerador é a prestação do serviço de iluminação pública, e o contribuinte é o <b>consumidor de energia elétrica</b>. A concessionária é <b>responsável pela cobrança e repasse</b> até o 5º dia útil do mês seguinte, ao Fundo Municipal de Iluminação Pública. A conta é a alíquota de cada faixa de consumo sobre a TEIP, com <b>teto de 10% da fatura</b>. Residências até 100 kWh/mês são isentas. A cobrança dos inadimplentes cabe ao Município. Confira o texto vigente."], "pega": ["<b>Taxa x imposto:</b> o serviço geral e indivisível (segurança, limpeza de vias, iluminação) não pode ser custeado por taxa. Coleta de lixo domiciliar pode (SV 19). Limpeza de logradouros não.", "<b>Base de cálculo:</b> a taxa não pode ter base idêntica à do imposto, mas pode usar alguns elementos (SV 29). Metragem do imóvel em taxa de lixo é aceita, desde que não seja a base integral do IPTU.", "<b>Serviço potencial:</b> a taxa só é devida se o serviço for de utilização compulsória e estiver em efetivo funcionamento. Sem órgão estruturado, a taxa de polícia é inconstitucional (Tema 217).", "<b>Taxa x tarifa:</b> serviço compulsório e por lei gera taxa. Serviço facultativo gera preço público. Concessões remuneram-se por tarifa. A Súmula 545 do STF é a base.", "<b>Imunidade:</b> a imunidade recíproca protege contra impostos, e não contra taxas. A banca diz que ente público não paga taxa.", "<b>Custas e emolumentos:</b> têm natureza de taxa. A taxa judiciária sem limite sobre o valor da causa é inconstitucional (Súmula 667 do STF).", "<b>Capital da empresa:</b> taxa calculada pelo capital social é vedada (art. 77, parágrafo único, do CTN). A pegadinha troca por «faturamento».", "<b>Contribuição de melhoria:</b> exige obra pública e valorização efetiva, com os dois limites (total e individual). Obra sem valorização, ou o mero gasto, não autoriza cobrança.", "<b>Edital prévio:</b> o prazo de impugnação é de no mínimo 30 dias. A banca troca por 15 ou por 60 dias.", "<b>COSIP:</b> é contribuição, não taxa (SV 41) e não imposto. Só Município e DF a instituem, por lei, com noventena e anterioridade. Pode ser cobrada na conta de luz.", "<b>COSIP em Curitiba:</b> o contribuinte é o consumidor de energia, e a concessionária só responde pela cobrança e pelo repasse, não pela inadimplência. A cobrança do inadimplente é do Município. Teto de 10% da fatura."]}, {"materia": "PROCESSO CIVIL", "titulo": "Cumprimento de Sentença contra a Fazenda Pública, Precatórios e RPV", "key": "PCV", "nome": "Proc. Civil", "conc": ["<b>Edital:</b> cumprimento de sentença contra a Fazenda Pública, precatórios e requisições de pequeno valor (RPV), com o regime da Lei Municipal 10.235/2001 de Curitiba. <b>Nota:</b> o valor da RPV em Curitiba depende da lei local, então confira o texto vigente.", "<b>Rito (CPC, arts. 534 e 535):</b> o exequente apresenta <b>demonstrativo discriminado e atualizado</b> do crédito, com CPF/CNPJ, índice de correção, juros, termos inicial e final e descontos. A Fazenda é intimada para impugnar em <b>30 dias</b>, nos próprios autos. <b>Não incide</b> a multa de 10% do art. 523. A execução fundada em título extrajudicial segue o art. 910, com embargos em 30 dias (cabe execução por título extrajudicial, Súmula 279 do STJ).", "<b>Matérias de impugnação (art. 535):</b> falta ou nulidade de citação (revelia), ilegitimidade, inexequibilidade ou inexigibilidade, <b>excesso de execução</b>, incompetência e causas modificativas ou extintivas <b>supervenientes à sentença</b> (pagamento, novação, compensação, transação, prescrição). Quem alega excesso deve <b>indicar o valor que entende correto</b>, sob pena de não conhecimento (§2º). Impugnação parcial não impede o prosseguimento do <b>valor incontroverso</b> (§4º).", "<b>Inexigibilidade por decisão do STF (§§5º a 8º):</b> é inexigível o título fundado em lei ou ato declarado inconstitucional pelo STF, em controle concentrado ou difuso. A decisão do STF deve ser <b>anterior ao trânsito em julgado</b> do título. Se posterior, cabe <b>ação rescisória</b>, com prazo de 2 anos contado do trânsito em julgado da decisão do STF. Cabe modulação de efeitos.", "<b>Honorários (art. 85, §7º):</b> não são devidos no cumprimento de sentença contra a Fazenda que gere <b>precatório</b>, se <b>não houve impugnação</b>. O tratamento na RPV deve ser conferido na jurisprudência.", "<b>Precatório (art. 100 da CF):</b> pagamento na <b>ordem cronológica</b> de apresentação. Só após o trânsito em julgado. O precatório apresentado até o prazo constitucional entra no orçamento do ano seguinte e deve ser pago até o fim desse exercício. A EC 136/2025 antecipou o prazo de apresentação de <b>2 de abril para 1º de fevereiro</b>. Débitos alimentares têm preferência (§1º), e idosos de 60 anos ou mais, doentes graves e pessoas com deficiência têm <b>superpreferência</b> até o triplo do valor da RPV (§2º).", "<b>Atualização:</b> a EC 113/2021 adotou a <b>Selic</b>, acumulada mensalmente, como índice único de correção e juros, vedados juros compensatórios (art. 100, §12). A EC 136/2025 fixou o <b>IPCA</b> a partir de 1º/8/2025, com a Selic se o IPCA mais juros de 2% a.a. superarem a Selic. Confira o texto vigente. A <b>SV 17</b> afasta juros de mora durante o prazo constitucional de pagamento.", "<b>RPV (art. 100, §§3º e 4º, da CF):</b> as obrigações de pequeno valor <b>dispensam precatório</b>. Cada ente fixa o valor por lei, com mínimo igual ao <b>maior benefício do RGPS</b>. Enquanto não há lei local, o art. 87 do ADCT estabelece 40 salários mínimos (Estados e DF) e <b>30 salários mínimos (Municípios)</b>. O limite federal é de 60 salários mínimos. Em Curitiba, vale a Lei 10.235/2001: confira o valor vigente. É vedado <b>fracionar</b> o valor da execução para enquadrar em RPV (art. 100, §8º). Os honorários podem ser destacados (SV 47).", "<b>Cessão e sequestro:</b> o credor pode <b>ceder</b> o crédito, total ou parcialmente, sem concordância do devedor, mas o cessionário perde a preferência alimentar e a RPV (§§13 e 14). A cessão só produz efeito após comunicação ao tribunal e ao devedor. O <b>sequestro</b> cabe em caso de preterição da ordem ou de falta de alocação orçamentária (§6º). A intervenção por não pagamento exige conduta voluntária e dolosa.", "<b>Súmulas:</b> o STJ diz que os atos do presidente do tribunal no processamento do precatório têm <b>caráter administrativo</b> (Súmula 311), e o STF não admite RE contra eles (Súmula 733). O pagamento do alimentar sem precatório é inadmissível (Súmula 655 do STF), e o indébito tributário reconhecido pode ser recebido por precatório ou compensação (Súmula 461 do STJ).", "<b>Prescrição e obrigações de fazer:</b> a execução prescreve no mesmo prazo da ação (Súmula 150 do STF), de <b>5 anos</b> contra a Fazenda (Decreto 20.910). Obrigação de fazer, não fazer ou entregar coisa contra a Fazenda segue os arts. 536 e seguintes, sem precatório. O STJ admite o bloqueio de verbas públicas para fornecer medicamentos (Tema 84)."], "pega": ["<b>Multa de 10%:</b> a banca aplica o art. 523 à Fazenda. Não incide multa nem honorários da fase de cumprimento, se não impugnada e gerar precatório.", "<b>Prazo:</b> a Fazenda tem 30 dias para impugnar, e não 15. A banca usa o prazo do cumprimento comum.", "<b>Excesso de execução:</b> a Fazenda deve indicar o valor correto, sob pena de não conhecimento. Dizer que basta alegar é erro.", "<b>Parte incontroversa:</b> prossegue, mesmo com impugnação parcial. A banca diz que a impugnação suspende tudo.", "<b>Decisão do STF:</b> se for anterior ao trânsito em julgado do título, é matéria de impugnação. Se posterior, cabe rescisória, e o prazo conta do trânsito da decisão do STF.", "<b>Precatório:</b> só depois do trânsito em julgado. A execução provisória não gera pagamento. O prazo de apresentação mudou para 1º de fevereiro pela EC 136/2025.", "<b>SV 17:</b> não há juros de mora durante o prazo constitucional do precatório. A banca diz que há juros em todo o período.", "<b>Fracionamento:</b> proibido para enquadrar em RPV, mas é possível destacar honorários (SV 47). A banca diz que fracionar é sempre vedado.", "<b>Cessão:</b> independe da concordância do devedor, mas só produz efeito após comunicação ao tribunal e à entidade devedora. O cessionário não tem superpreferência.", "<b>Natureza do ato do presidente do tribunal:</b> é administrativa, não jurisdicional (Súmula 311 do STJ). Por isso não cabe RE (Súmula 733 do STF).", "<b>Alimentar:</b> crédito alimentar não dispensa precatório, só a ordem cronológica geral (Súmula 655 do STF). A dispensa é da RPV."]}], "13": [{"materia": "DIREITO ADMINISTRATIVO", "titulo": "TAC e Autocomposição na Administração Municipal de Curitiba", "key": "ADM", "nome": "Administrativo", "conc": ["<b>Edital:</b> compromisso de ajustamento de conduta e autocomposição na Administração Municipal de Curitiba: Lei 15.461/2019, Lei Complementar 141/2023, Decreto 868/2024 e Decreto 1.106/2024. Esta unidade também cobre o item 14 de Processo Civil. Os decretos de transação da dívida ativa (2.305 e 2.306/2023) entram aqui só como complemento. Os textos abaixo foram conferidos no texto municipal.", "<b>Base federal:</b> o <b>art. 26 da LINDB</b> permite à autoridade celebrar <b>compromisso</b> com os interessados para eliminar irregularidade, incerteza jurídica ou situação contenciosa, após <b>oitiva do órgão jurídico</b> e, se for o caso, consulta pública, com razões de relevante interesse geral. Só produz efeitos depois da <b>publicação oficial</b>. Não pode desonerar permanentemente de dever nem condicionar direito reconhecido por orientação geral. A <b>Lei 13.140/2015 (art. 32)</b> autoriza as <b>câmaras de prevenção e resolução administrativa de conflitos</b> na Advocacia Pública. O <b>art. 5º, § 6º, da Lei 7.347/85</b> dá ao <b>TAC</b> eficácia de título executivo extrajudicial.", "<b>Lei 15.461/2019, art. 6º (nova redação do art. 16 da Lei 7.671/91):</b> a PGM tem competências <b>exclusivas</b> na Administração Direta, Indireta e Fundacional: consultoria e assessoramento jurídico no controle interno dos atos do Executivo, manifestação sobre a legalidade de projetos de lei e decretos, representação judicial em qualquer foro, <b>cobrança judicial e extrajudicial da dívida ativa</b>, análise jurídica e cadastro dos instrumentos firmados pelo Município, <b>sindicâncias, PAD e estágio probatório</b>, instituição de <b>termo de ajustamento disciplinar por ato do Chefe do Executivo</b> e <b>procedimentos de autocomposição</b> de conflitos. O parágrafo único diz que essas atribuições são <b>exclusivas dos procuradores da carreira</b>, vedada a terceiros, servidores ou não.", "<b>LC 141/2023, arts. 1º e 2º:</b> trata de meios alternativos de solução de litígios judiciais e extrajudiciais na Administração <b>Direta e Indireta</b>, com mútuas concessões. O <b>Procurador-Geral</b> pode autorizar a transação, em juízo de <b>oportunidade e conveniência</b>, por decisão motivada que demonstre o interesse público. O pedido parte da parte interessada, instruído pelo procurador da causa, e termina em <b>decisão irrecorrível</b> do PGM. A atribuição de transigir, inclusive em audiência, pode ser <b>delegada aos procuradores</b>.", "<b>LC 141/2023, arts. 3º a 6º:</b> o art. 3º autoriza <b>câmaras de prevenção e resolução administrativa de conflitos</b>, permanentes ou provisórias, na PGM, com procuradores e servidores com <b>curso de formação específica</b>. O Município pode aderir a juizados e câmaras de conciliação públicas ou privadas. O art. 4º autoriza <b>súmulas administrativas e pareceres referenciais</b>, vinculantes para a Administração. O art. 5º permite <b>dispensar ação, defesa ou recurso</b> quando o STF ou os tribunais superiores decidem a controvérsia de forma
